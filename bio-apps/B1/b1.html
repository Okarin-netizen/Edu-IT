<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>B1 育成日誌＋成長予測</title>
<link rel="stylesheet" href="../../shared/eduit-frame.css">
<script src="../eduit-info.js"></script>
<script>EDUIT_INFO.app = { name: 'B1 育成日誌＋成長予測' };</script>
<script src="../../shared/eduit-frame.js"></script>
<style>
/* ===== B1 育成日誌＋成長予測 : すべて .b1 の中に閉じたスタイル ===== */
html,body{margin:0;padding:0;background:var(--ef-bg);}
.b1{
  /* 共通の枠(shared/eduit-frame.css)の色にそろえる */
  --bg:var(--ef-bg); --card:var(--ef-surface); --ink:var(--ef-text); --sub:var(--ef-muted); --line:#bfcbb9;
  --pri:var(--ef-accent); --pri-d:#1b5e20; --pri-l:var(--ef-accent-soft); --acc:#d84315; --acc-l:#fbe9e7;
  --warn:#b71c1c; --warn-l:#fdecea; --info:#0d47a1; --info-l:#e3edfb; --yel:#fff6d6;
  font-family:var(--ef-font);
  font-size:18px; line-height:1.6; color:var(--ink); background:var(--bg);
  min-height:100vh; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:rgba(46,125,50,.2);
}
.b1 *{box-sizing:border-box;}
.b1.noruby rt{display:none;}
.b1 rt{font-size:.5em;color:var(--sub);letter-spacing:-.04em;}
.b1 ruby{ruby-align:center;}
.b1 .topbar rt{color:var(--sub);}
.b1 h1,.b1 h2,.b1 h3{margin:.2em 0 .5em;line-height:1.4;}
.b1 h2{font-size:1.3em;}
.b1 h3{font-size:1.1em;}
.b1 p{margin:.4em 0 .8em;}
.b1 small,.b1 .small{font-size:.85em;color:var(--sub);}
/* header + tabs(見出しは共通の枠 .ef-header。タブの帯は分野の色) */
.b1 .top{position:sticky;top:0;z-index:20;background:var(--ef-accent);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.b1 .topbar{padding:6px 12px;padding-top:max(6px,env(safe-area-inset-top));flex-wrap:nowrap;}
.b1 .topbar .ttl{display:block;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.b1 .topbar .ef-btn{font:600 15px/1.2 var(--ef-font);}
.b1 .topbar .who{display:inline-block;line-height:38px;min-height:44px;min-width:44px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;}
.b1 .topbar .who .demo-b{display:inline-block;background:#ffd54f;color:#3e2b00;border-radius:999px;padding:0 8px;margin-left:6px;font-size:.85em;}
/* K2: ふりがな・A−・A＋ */
.b1 .pf{display:flex;gap:6px;flex:0 0 auto;}
.b1 .topbar .ef-tools{flex-wrap:nowrap;}
.b1 .pfb{min-width:44px;min-height:44px;padding:0 12px;}
.b1 .pfb[disabled]{opacity:.4;cursor:default;}
/* K3: メニューの中では見出しをかくし、名前ボタンだけ細い行に */
html.kz-embed .b1 .topbar .ttl,html.kz-embed .b1 .pf,html.kz-embed .b1 .ef-back{display:none;}
html.kz-embed .b1 .topbar{justify-content:flex-end;padding:2px 10px;min-height:0;background:transparent;border-bottom:0;}
/* 横に広い画面(Chromebook など)では名前ボタンをタブと同じ行に置き、縦の場所を空ける */
@media (min-width:1000px){
  html.kz-embed .b1 .top{display:flex;align-items:center;}
  html.kz-embed .b1 .tabs{flex:1 1 auto;min-width:0;align-self:flex-end;}
  html.kz-embed .b1 .topbar{order:2;flex:0 0 auto;padding:4px 10px 4px 4px;}
  html.kz-embed .b1 .topbar .who{max-width:14em;}
}
/* K4: タブ(帯は濃い緑、選択中はページの地色) */
.b1 .tabs{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;padding:4px 6px 0;}
.b1 .tabs.c5{grid-template-columns:repeat(5,minmax(0,1fr));}
.b1 .tabs.c4{grid-template-columns:repeat(4,minmax(0,1fr));}
.b1 .tabs.c3{grid-template-columns:repeat(3,minmax(0,1fr));}
.b1 .tab{background:transparent;border:0;color:#fff;font-weight:700;padding:4px 4px 6px;min-height:52px;min-width:0;font-size:.88em;line-height:1.25;border-radius:12px 12px 0 0;font-family:inherit;white-space:nowrap;cursor:pointer;}
.b1 .tab rt{color:rgba(255,255,255,.85);}
.b1 .tab.on{background:var(--bg);color:var(--pri-d);}
.b1 .tab.on rt{color:var(--sub);}
.b1 .tab .ic{display:block;font-size:1.15em;line-height:1.2;}
.b1 .demobar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:#fff3c4;border:2px solid #e6c84f;border-radius:12px;padding:8px 12px;margin:0 0 12px;}
.b1 .demobar b{flex:1;min-width:12em;}
.b1 .ptxt{display:none;}
.b1 .autosave{font-size:.85em;color:var(--sub);margin:.4em 0 0;}
.b1 .reflhead{display:grid;grid-template-columns:6em 6em 1fr;gap:10px;}
@media (max-width:560px){ .b1 .reflhead{grid-template-columns:1fr 1fr;} .b1 .reflhead .fn{grid-column:1 / -1;} }
.b1 .self .seg button{min-width:7.5em;}
.b1 .sbar{position:sticky;bottom:0;z-index:5;background:#fff;margin:8px -16px -16px;padding:10px 16px 14px;border-top:1px solid #e3e8e0;border-radius:0 0 14px 14px;}
.b1 main{max-width:1100px;margin:0 auto;padding:14px 14px 90px;}
.b1 section.scr{display:none;}
.b1 section.scr.on{display:block;}
/* cards */
.b1 .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;}
.b1 .card.soft{background:var(--pri-l);border-color:#a5d6a7;}
.b1 .card.note{background:var(--yel);border-color:#e6c84f;}
.b1 .card.warn{background:var(--warn-l);border-color:#e57373;}
.b1 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.b1 .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media (max-width:820px){ .b1 .grid2{grid-template-columns:1fr;} .b1 .grid2.keep{grid-template-columns:1fr 1fr;} }
@media (max-width:480px){ .b1 .grid2.keep{grid-template-columns:1fr;} }
@media (max-width:560px){ .b1 .grid3{grid-template-columns:1fr 1fr;} }
.b1 .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.b1 .row.end{justify-content:flex-end;}
.b1 .sp{flex:1;}
/* buttons */
.b1 button,.b1 .btn{font-family:inherit;font-size:1em;}
.b1 .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:8px 18px;border-radius:12px;border:2px solid var(--pri);background:#fff;color:var(--pri-d);font-weight:700;cursor:pointer;text-decoration:none;user-select:none;}
.b1 .btn:active{transform:translateY(1px);filter:brightness(.95);}
.b1 .btn.pri{background:var(--pri);color:#fff;}
.b1 .btn.acc{background:var(--acc);border-color:var(--acc);color:#fff;}
.b1 .btn.danger{border-color:var(--warn);color:var(--warn);}
.b1 .btn.sm{min-height:44px;min-width:44px;padding:4px 12px;font-size:.9em;border-radius:10px;}
.b1 .btn.big{min-height:64px;font-size:1.1em;padding:10px 24px;}
.b1 .btn.wide{width:100%;}
.b1 .btn[disabled]{opacity:.45;pointer-events:none;}
/* forms */
.b1 label.f,.b1 div.f{display:block;margin:0 0 12px;}
.b1 label.f > span:not(.stepper){display:block;font-weight:700;margin-bottom:4px;}
.b1 input[type=text],.b1 input[type=number],.b1 input[type=date],.b1 select,.b1 textarea{
  font-family:inherit;font-size:1em;width:100%;min-height:52px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);}
.b1 input:focus,.b1 select:focus,.b1 textarea:focus{outline:3px solid #ffd54f;border-color:var(--pri);}
.b1 textarea{min-height:110px;line-height:1.6;resize:vertical;}
.b1 .unit{display:flex;align-items:center;gap:6px;}
.b1 .unit input{flex:1;min-width:0;}
.b1 .unit b{white-space:nowrap;font-weight:400;color:var(--sub);}
.b1 .stepper{display:flex;gap:6px;align-items:center;}
.b1 .stepper input{text-align:center;flex:1;min-width:0;}
.b1 .stepper button{width:52px;min-height:52px;border-radius:10px;border:2px solid var(--line);background:#f7f7f7;font-size:1.3em;font-weight:700;color:var(--ink);flex:0 0 auto;}
.b1 .chips{display:flex;flex-wrap:wrap;gap:8px;}
.b1 .chip{display:inline-flex;align-items:center;gap:6px;min-height:50px;padding:6px 14px;border:2px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;user-select:none;font-size:.95em;}
.b1 .chip input{width:22px;height:22px;margin:0;accent-color:var(--pri);}
.b1 .chip.on,.b1 .chip:has(input:checked){border-color:var(--pri);background:var(--pri-l);font-weight:700;}
.b1 .wx{display:flex;gap:8px;flex-wrap:wrap;}
.b1 .wx button{min-width:86px;min-height:64px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:.9em;line-height:1.2;color:var(--ink);}
.b1 .wx button .e{display:block;font-size:1.6em;}
.b1 .wx button.on{border-color:var(--pri);background:var(--pri-l);font-weight:700;box-shadow:inset 0 0 0 2px var(--pri);}
/* lists */
.b1 .list{list-style:none;margin:0;padding:0;}
.b1 .list li{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line);}
.b1 .list li:last-child{border-bottom:0;}
.b1 .tag{display:inline-block;font-size:.8em;padding:1px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;}
.b1 .tag.late{color:var(--warn);background:var(--warn-l);font-weight:700;}
.b1 .tag.today{color:var(--acc);background:var(--acc-l);font-weight:700;}
.b1 .tag.ok{color:var(--pri-d);background:var(--pri-l);}
.b1 .tag.info{color:var(--info);background:var(--info-l);}
.b1 .alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin:0 0 8px;border-left:6px solid;}
.b1 .alert .ai{font-size:1.4em;line-height:1.2;}
.b1 .alert.w{background:var(--warn-l);border-color:var(--warn);}
.b1 .alert.c{background:var(--acc-l);border-color:var(--acc);}
.b1 .alert.i{background:var(--info-l);border-color:var(--info);}
.b1 .alert.g{background:var(--pri-l);border-color:var(--pri);}
.b1 .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;}
.b1 .stat b{display:block;font-size:1.6em;color:var(--pri-d);line-height:1.3;}
.b1 table.t{width:100%;border-collapse:collapse;font-size:.95em;}
.b1 table.t th,.b1 table.t td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top;}
.b1 table.t th{background:var(--pri-l);}
.b1 .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;}
/* chart */
.b1 .chartbox{position:relative;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.b1 .chartbox canvas{display:block;width:100%;height:100%;touch-action:pan-y;}
.b1 .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85em;margin:6px 2px;}
.b1 .legend i{display:inline-block;width:26px;height:0;border-top:4px solid;vertical-align:middle;margin-right:4px;}
.b1 .legend i.dash{border-top-style:dashed;}
.b1 .legend i.box{height:12px;border:0;}
.b1 .tip{position:absolute;pointer-events:none;background:rgba(23,35,23,.92);color:#fff;font-size:.8em;padding:6px 10px;border-radius:8px;white-space:nowrap;display:none;}
/* photos */
.b1 .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.b1 .thumb{position:relative;border-radius:10px;overflow:hidden;border:3px solid transparent;background:#e6ebe3;aspect-ratio:1/1;padding:0;cursor:pointer;}
.b1 .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.b1 .thumb .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:.8em;padding:2px 6px;text-align:left;}
.b1 .thumb.sel{border-color:#ffb300;}
.b1 .thumb .num{position:absolute;top:6px;left:6px;background:#ffb300;color:#000;border-radius:999px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.b1 .thumb .x{position:absolute;top:4px;right:4px;width:44px;height:44px;border-radius:999px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:1.1em;}
.b1 .cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.b1 .cmp figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.b1 .cmp img{width:100%;display:block;max-height:60vh;object-fit:contain;background:#222;}
.b1 .cmp figcaption{padding:8px 10px;font-size:.9em;}
/* calendar */
.b1 .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.b1 .cal .h{text-align:center;font-size:.8em;color:var(--sub);font-weight:700;}
.b1 .cal button{min-height:72px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:3px;text-align:left;font-size:.8em;line-height:1.25;color:var(--ink);overflow:hidden;display:flex;flex-direction:column;align-items:stretch;}
.b1 .cal button .d{font-weight:700;}
.b1 .cal button.out{opacity:.35;}
.b1 .cal button.today{box-shadow:inset 0 0 0 3px var(--acc);}
.b1 .cal button.sel{background:#fff3c4;}
.b1 .cal button .k{display:block;background:var(--pri-l);border-radius:4px;padding:0 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9em;}
.b1 .cal button .k.done{background:#eee;color:#777;text-decoration:line-through;}
.b1 .cal button .k.st{background:#ffe0b2;}
/* diag */
.b1 .flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.b1 .flow button{min-height:72px;text-align:left;border:2px solid var(--line);border-radius:12px;background:#fff;padding:10px 14px;font-size:.95em;color:var(--ink);}
.b1 .flow button .e{font-size:1.4em;margin-right:6px;}
.b1 .crumb{font-size:.9em;color:var(--sub);margin-bottom:8px;}
/* stars */
.b1 .stars{display:flex;gap:4px;}
.b1 .stars button{width:52px;height:52px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:1.4em;color:#bbb;}
.b1 .stars button.on{color:#f9a825;border-color:#f9a825;background:#fffbe6;}
/* misc */
.b1 .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#172317;color:#fff;padding:12px 22px;border-radius:999px;z-index:100;font-size:.95em;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;}
.b1 .toast.on{opacity:1;}
.b1 .ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;}
.b1 .ov .box{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:90vh;max-height:calc(100dvh - 32px);overflow:auto;-webkit-overflow-scrolling:touch;padding:20px;}
.b1 .ov{padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));}
.b1 .ov .box > .row.end:last-child{position:sticky;bottom:-20px;background:#fff;margin:0 -20px -20px;padding:10px 20px 16px;border-top:1px solid #e3e8e0;z-index:1;}
.b1 .ov .box.wide{max-width:1000px;}
.b1 .hint{background:var(--info-l);border-left:6px solid var(--info);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:.95em;}
.b1 .caution{background:var(--warn-l);border-left:6px solid var(--warn);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:.95em;}
.b1 .formula{font-family:"Courier New",monospace;background:#f0f3ee;border-radius:8px;padding:6px 10px;display:inline-block;}
.b1 .empty{text-align:center;color:var(--sub);padding:24px 10px;}
.b1 .empty .e{font-size:2.6em;display:block;}
.b1 details{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;}
.b1 details summary{padding:12px 16px;font-weight:700;cursor:pointer;min-height:52px;display:flex;align-items:center;}
.b1 details > div{padding:0 16px 14px;}
.b1 input[type=range]{width:100%;height:44px;accent-color:var(--pri);}
.b1 .seg{display:flex;flex-wrap:wrap;gap:6px;}
.b1 .seg button{flex:1 1 auto;min-height:50px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font-size:.92em;color:var(--ink);}
.b1 .seg button.on{border-color:var(--pri);background:var(--pri-l);font-weight:700;box-shadow:inset 0 0 0 2px var(--pri);}
.b1 .num-big{font-size:1.5em;font-weight:700;color:var(--pri-d);}
.b1 .hide{display:none !important;}
.b1 details, .b1 h2, .b1 h3{scroll-margin-top:var(--hdr,140px);}
.b1 .more{margin-top:10px;background:#f7faf5;}
.b1 table.t td.nw, .b1 table.t .btn{white-space:nowrap;}
.b1.big table.t{font-size:.85em;}
.b1.big .tab{font-size:.82em;}
.b1 .season{margin:0 0 12px;}
@media print{
  .b1 .top,.b1 .noprint,.b1 .toast,.b1 .demobar,.b1 .autosave{display:none !important;}
  .b1 main{padding:0;}
  .b1.print-refl section.scr{display:none !important;}
  .b1.print-refl section#b1-refl{display:block !important;}
  .b1 .card{break-inside:avoid;}
  .b1 .card.long{break-inside:auto;}
  .b1 .ptxt{display:inline !important;font-weight:700;}
  .b1 .sbar{position:static;}
  .b1 input::placeholder{color:transparent !important;}
  .b1 .kz-ptext{font-size:1em;line-height:1.6;}
}
</style>
</head>
<body>
<div id="b1-app" class="b1">
  <header class="top">
    <div class="topbar ef-header">
      <a class="ef-btn ef-back" href="../dist/生物育成教材集.html" title="教材集のメニューを開く">◀ メニュー</a>
      <div class="ttl ef-title"><span class="ef-icon" aria-hidden="true">📒</span>B1 <ruby>育<rt>いく</rt></ruby><ruby>成<rt>せい</rt></ruby><ruby>日<rt>にっ</rt></ruby><ruby>誌<rt>し</rt></ruby>＋<ruby>成<rt>せい</rt></ruby><ruby>長<rt>ちょう</rt></ruby><ruby>予<rt>よ</rt></ruby><ruby>測<rt>そく</rt></ruby></div>
      <div class="ef-tools">
      <div class="pf" role="group" aria-label="表示の設定">
        <button type="button" class="ef-btn pfb" id="b1-pf-ruby" aria-pressed="true" title="ふりがなを表示する・かくす">ふりがな</button>
        <button type="button" class="ef-btn pfb" id="b1-pf-dec" aria-label="文字を小さくする" title="文字を小さく">A−</button>
        <button type="button" class="ef-btn pfb" id="b1-pf-inc" aria-label="文字を大きくする" title="文字を大きく">A＋</button>
      </div>
      <button type="button" class="ef-btn who" data-act="who" id="b1-who">👤 ---</button>
      </div>
    </div>
    <nav class="tabs" id="b1-tabs" role="tablist"></nav>
  </header>
  <main>
    <div class="demobar hide" id="b1-demobar"><b>🧪 いまは「サンプル(練習用)」を見ています。自分の記録ではありません。</b><button type="button" class="btn sm pri" data-act="demoBack">自分の記録にもどる</button></div>
    <section class="scr" id="b1-home"></section>
    <section class="scr" id="b1-plan"></section>
    <section class="scr" id="b1-entry"></section>
    <section class="scr" id="b1-graph"></section>
    <section class="scr" id="b1-photos"></section>
    <section class="scr" id="b1-predict"></section>
    <section class="scr" id="b1-diag"></section>
    <section class="scr" id="b1-eval"></section>
    <section class="scr" id="b1-refl"></section>
    <section class="scr" id="b1-help"></section>
  </main>
  <div class="toast" id="b1-toast" role="status" aria-live="polite"></div>
  <input type="file" id="b1-file" class="hide">
</div>
<!-- 確認メッセージ(全画面・タブレットでも切れない自作ダイアログ。window.confirm の代わり) -->
<style>
.kzd-back{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483000;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;box-sizing:border-box;

(function(){
  if (window.kzConfirm) return;
  var queue = Promise.resolve();
  function open(msg, opt){
    opt = opt || {};
    return new Promise(function(resolve){
      var back = document.createElement('div');
      back.className = 'kzd-back';
      back.setAttribute('role', 'alertdialog'); back.setAttribute('aria-modal', 'true');
      var box = document.createElement('div'); box.className = 'kzd-box';
      var p = document.createElement('p'); p.className = 'kzd-msg'; p.id = 'kzd-msg-' + Date.now(); p.textContent = String(msg);
      back.setAttribute('aria-describedby', p.id);
      var btns = document.createElement('div'); btns.className = 'kzd-btns';
      var cancel = null;
      if (!opt.alert) {
        cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'kzd-cancel';
        cancel.textContent = opt.cancel || 'キャンセル'; btns.appendChild(cancel);
      }
      var ok = document.createElement('button'); ok.type = 'button'; ok.className = 'kzd-ok' + (opt.danger ? ' kzd-danger' : '');
      ok.textContent = opt.ok || 'OK'; btns.appendChild(ok);
      box.appendChild(p); box.appendChild(btns); back.appendChild(box);
      var prev = document.activeElement;
      function done(v){
        document.removeEventListener('keydown', onKey, true);
        back.remove();
        try { if (prev && prev.focus) prev.focus({preventScroll:true}); } catch(e) {}
        resolve(v);
      }
      function onKey(e){
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); }
        else if (e.key === 'Tab') { var f = cancel ? [cancel, ok] : [ok]; var i = f.indexOf(document.activeElement); e.preventDefault(); f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus(); }
      }
      ok.addEventListener('click', function(){ done(true); });
      if (cancel) cancel.addEventListener('click', function(){ done(false); });
      document.addEventListener('keydown', onKey, true);
      (document.body || document.documentElement).appendChild(back);
      ((opt.danger && cancel) ? cancel : ok).focus({preventScroll:true});
    });
  }
  /* 1つずつ順番に出す */
  window.kzConfirm = function(msg, opt){ var r = queue.then(function(){ return open(msg, opt); }); queue = r.catch(function(){}); return r; };
  window.kzAlert = function(msg, opt){ opt = opt || {}; opt.alert = true; return window.kzConfirm(msg, opt); };
})();

<!--
  kz-prefs : 教材集ぜんぶで共通の「ふりがな」「文字の大きさ」設定 (K1)
  ------------------------------------------------------------------
  入れ方: kzConfirm の <script> のすぐ後ろに、このファイルの <script> をそのまま貼る。
          2回入れても害はない(window.kzPrefs があれば何もしない)。ES5。外部通信なし。

  保存キー(localStorage):
    hub_ruby  '1' = ふりがなあり / '0' = なし
    hub_fs    文字の大きさ(px の整数。14〜26、2きざみ、初期 18)

  API (グローバルは window.kzPrefs だけ):
    kzPrefs.get()            → {ruby: true|false|null, fs: 14..26|null}
                               キーが無い(まだ一度も設定していない)ときは null。
                               localStorage が使えないときは、このページ内のメモリ上の値を返す。
    kzPrefs.set({ruby?, fs?}) → 指定した項目だけ書きこみ、変わっていればリスナーに知らせる。
                               fs は clampFs で丸める。ほかの画面(親・ほかの iframe)には
                               storage イベント＋postMessage(予備)で伝わる。戻り値は get()。
    kzPrefs.on(fn)           → fn(prefs) を登録。自分の set()、ほかの画面での変更
                               (storage イベント / postMessage)のときに呼ばれる。
                               同じ値が続けて来たときは呼ばない。戻り値は登録解除の関数。
    kzPrefs.clampFs(n)       → 14〜26 の偶数に丸めた数(数でなければ 18)。
    kzPrefs.bump(d)          → 文字サイズを d 段(+1 / -1)変える。新しい fs を返す。
    kzPrefs.bind(rubyBtn, decBtn, incBtn)
                             → K2 の3つのボタンをつなぐ(どれか null 可)。
                               クリックで set()、aria-pressed と disabled(上限・下限)を自動更新。
    kzPrefs.embed            → 教材集(メニュー)の iframe の中なら true。
                               true のとき <html> に class "kz-embed" をすぐ付ける(K3 の CSS 用)。
    kzPrefs.FS_MIN=14, FS_MAX=26, FS_STEP=2, FS_DEFAULT=18

  教材側の使い方の例:
    var p = kzPrefs.get();
    var ruby = (p.ruby !== null) ? p.ruby : 自分の古い設定;   // 古い設定は null のときだけ使う
    var fs   = (p.fs   !== null) ? p.fs   : 自分の古い設定を clampFs したもの;
    apply(ruby, fs);
    kzPrefs.on(function(p){ apply(p.ruby !== false, p.fs || 18); });
    kzPrefs.bind(document.getElementById('x-ruby'), document.getElementById('x-dec'), document.getElementById('x-inc'));
-->
<script data-kz-prefs>
(function(){
  if (window.kzPrefs) return;
  var KR = 'hub_ruby', KF = 'hub_fs', MIN = 14, MAX = 26, STEP = 2, DEF = 18;
  var mem = {ruby: null, fs: null};          /* localStorage が使えないときの予備 */
  var fns = [], last = '';
  var embed = false;
  try { embed = window.self !== window.top; } catch (e) { embed = true; }
  if (embed) { try { document.documentElement.className += (document.documentElement.className ? ' ' : '') + 'kz-embed'; } catch (e) {} }

  function clampFs(n){
    n = Number(n);
    if (!isFinite(n)) return DEF;
    n = Math.round(n / STEP) * STEP;
    return n < MIN ? MIN : (n > MAX ? MAX : n);
  }
  function lsGet(k){ try { return window.localStorage.getItem(k); } catch (e) { return undefined; } }
  function lsSet(k, v){ try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function get(){
    var r = lsGet(KR), f = lsGet(KF), o = {ruby: mem.ruby, fs: mem.fs};
    if (r !== undefined) o.ruby = (r === '1') ? true : (r === '0' ? false : null);
    if (f !== undefined) o.fs = (f === null || f === '' || isNaN(parseInt(f, 10))) ? null : clampFs(parseInt(f, 10));
    return o;
  }
  function notify(p){
    var key = String(p.ruby) + '|' + String(p.fs);
    if (key === last) return;
    last = key;
    for (var i = 0; i < fns.length; i++) { try { fns[i](p); } catch (e) { if (window.console) console.error(e); } }
  }
  function post(win, p){ try { win.postMessage({kzPrefs: {ruby: p.ruby, fs: p.fs}}, '*'); } catch (e) {} }
  function broadcast(p, except){
    /* 予備の伝え方: 親と子の iframe に postMessage(storage イベントが届かない環境のため) */
    try { if (embed && window.parent && window.parent !== except) post(window.parent, p); } catch (e) {}
    try { for (var i = 0; i < window.frames.length; i++) { if (window.frames[i] !== except) post(window.frames[i], p); } } catch (e) {}
  }
  function set(o){
    o = o || {};
    if (o.ruby !== undefined && o.ruby !== null) { mem.ruby = !!o.ruby; lsSet(KR, o.ruby ? '1' : '0'); }
    if (o.fs !== undefined && o.fs !== null) { mem.fs = clampFs(o.fs); lsSet(KF, String(mem.fs)); }
    var p = get();
    if (p.ruby === null) p.ruby = mem.ruby;
    if (p.fs === null) p.fs = mem.fs;
    notify(p);
    broadcast(p, null);
    return p;
  }
  function on(fn){
    if (typeof fn === 'function') fns.push(fn);
    return function(){ for (var i = fns.length - 1; i >= 0; i--) if (fns[i] === fn) fns.splice(i, 1); };
  }
  function cur(){ var p = get(); return {ruby: p.ruby !== false, fs: p.fs || DEF}; }
  function bump(d){ return set({fs: cur().fs + (d > 0 ? STEP : -STEP)}).fs || DEF; }
  function bind(rb, dec, inc){
    function upd(){
      var c = cur();
      if (rb) rb.setAttribute('aria-pressed', c.ruby ? 'true' : 'false');
      if (dec) dec.disabled = c.fs <= MIN;
      if (inc) inc.disabled = c.fs >= MAX;
    }
    if (rb) rb.addEventListener('click', function(){ set({ruby: !cur().ruby}); });
    if (dec) dec.addEventListener('click', function(){ bump(-1); });
    if (inc) inc.addEventListener('click', function(){ bump(1); });
    on(upd); upd();
    return upd;
  }

  window.addEventListener('storage', function(e){
    if (e.key !== KR && e.key !== KF && e.key !== null) return;
    notify(get());
  });
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || typeof d !== 'object' || !d.kzPrefs || typeof d.kzPrefs !== 'object') return;
    var q = d.kzPrefs;
    if (typeof q.ruby === 'boolean') mem.ruby = q.ruby;
    if (typeof q.fs === 'number') mem.fs = clampFs(q.fs);
    var p = get();
    if (p.ruby === null) p.ruby = mem.ruby;
    if (p.fs === null) p.fs = mem.fs;
    notify(p);
    /* メニュー(いちばん上)は、ほかの iframe にも伝える */
    if (!embed) { try { for (var i = 0; i < window.frames.length; i++) if (window.frames[i] !== e.source) post(window.frames[i], p); } catch (err) {} }
  });

  var p0 = get(); last = String(p0.ruby) + '|' + String(p0.fs);
  window.kzPrefs = {get: get, set: set, on: on, clampFs: clampFs, bump: bump, bind: bind, embed: embed,
    FS_MIN: MIN, FS_MAX: MAX, FS_STEP: STEP, FS_DEFAULT: DEF};
})();
</script>
<!--
  kz-ruby : 共通の用語辞書で、画面の文字に自動でふりがな(ruby)を付ける (K8)
  ------------------------------------------------------------------
  入れ方: kzConfirm の <script> のすぐ後ろ(kz-prefs の後)に、このファイルの <style> と <script> を貼る。

    kzRuby(root, opts)   root(要素。省略時 document.body)の下の文字に <ruby>語<rt>よみ</rt></ruby> を付ける。

var PhotoDB = {
  db:null, mode:'idb', urls:{},
  open:function(){
    var self=this;
    return new Promise(function(res){
      if(!window.indexedDB){ self.mode='ls'; return res(); }
      try{
        var rq = indexedDB.open('b1_photos', 1);
        rq.onupgradeneeded = function(){ rq.result.createObjectStore('photos', {keyPath:'id'}); };
        rq.onsuccess = function(){ self.db = rq.result; res(); };
        rq.onerror = function(){ self.mode='ls'; res(); };
        rq.onblocked = function(){ self.mode='ls'; res(); };
      }catch(e){ self.mode='ls'; res(); }
    });
  },
  tx:function(m){ return this.db.transaction('photos', m).objectStore('photos'); },
  put:function(rec){
    var self=this;
    if(self.mode==='ls'){
      return blobToDataURL(rec.blob).then(function(u){
        try{ localStorage.setItem('b1_photo_'+rec.id, JSON.stringify({id:rec.id, takenAt:rec.takenAt, data:u})); }
        catch(e){ throw new Error('容量がいっぱいです'); }
      });
    }
    return new Promise(function(res, rej){ var r=self.tx('readwrite').put(rec); r.onsuccess=function(){res();}; r.onerror=function(){rej(r.error);}; });
  },
  get:function(id){
    var self=this;
    if(self.mode==='ls'){
      try{ var j=JSON.parse(localStorage.getItem('b1_photo_'+id)); return Promise.resolve(j?{id:j.id,takenAt:j.takenAt,blob:dataURLToBlob(j.data)}:null); }catch(e){ return Promise.resolve(null); }
    }
    return new Promise(function(res){ var r=self.tx('readonly').get(id); r.onsuccess=function(){res(r.result||null);}; r.onerror=function(){res(null);}; });
  },
  del:function(id){
    var self=this;
    if(self.urls[id]){ URL.revokeObjectURL(self.urls[id]); delete self.urls[id]; }
    if(self.mode==='ls'){ try{ localStorage.removeItem('b1_photo_'+id); }catch(e){} return Promise.resolve(); }
    return new Promise(function(res){ var r=self.tx('readwrite').delete(id); r.onsuccess=function(){res();}; r.onerror=function(){res();}; });
  },
  url:function(id){
    var self=this;
    if(self.urls[id]) return Promise.resolve(self.urls[id]);
    return self.get(id).then(function(rec){ if(!rec||!rec.blob) return null; var u=URL.createObjectURL(rec.blob); self.urls[id]=u; return u; });
  }
};
function blobToDataURL(b){ return new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){res(fr.result);}; fr.onerror=rej; fr.readAsDataURL(b); }); }
function dataURLToBlob(u){ var p=u.split(','), m=p[0].match(/:(.*?);/)[1], bin=atob(p[1]), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:m}); }
function canvasToBlob(cv, q){ return new Promise(function(res){ if(cv.toBlob) cv.toBlob(function(b){res(b);}, 'image/jpeg', q); else res(dataURLToBlob(cv.toDataURL('image/jpeg', q))); }); }
/* 写真を縮小(長辺1024px、約200KB以下) */
function resizePhoto(file){
  var maxSide = PhotoDB.mode==='ls' ? 640 : 1024;
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1, maxSide/Math.max(w,h));
      var cv=document.createElement('canvas'); cv.width=Math.round(w*s); cv.height=Math.round(h*s);
      var cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      var q = 0.75;
      (function tryQ(){
        canvasToBlob(cv, q).then(function(b){
          if(b && b.size > 220*1024 && q > 0.4){ q -= 0.15; tryQ(); }
          else res(b);
        });
      })();
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('画像を読みこめませんでした')); };
    img.src = url;
  });
}

function alertsFor(pl){
  var c=crop(pl.cropId), es=entriesOf(pl.id), t=today(), A=[];
  var last = es.length? es[es.length-1] : null;
  if(!es.length) A.push(['i','📒','まだ記録がありません。今日の様子を記録しよう。']);
  else {
    var gap = diffDays(last.date, t);
    if(gap>=3) A.push(['c','📒','最後の記録から'+gap+'日たっています。記録をつづけよう。']);
    var lo = num(last.tmin)!=null? num(last.tmin) : meanT(last);
    var hi = num(last.tmax)!=null? num(last.tmax) : meanT(last);
    var tl = FIELDS[c.cat].t, rg = rangeAt(c, diffDays(pl.sowDate, last.date)), chick = !!c.rangeByDay && rg!==c.range;
    var rgs = (chick?'ひなの時期の適温 ':'適温 ')+rg[0]+'〜'+rg[1]+'℃';
    if(lo!=null && c.cat==='plant' && lo < c.base) A.push(['w','🥶','低温注意: 最低'+tl+'が'+lo+'℃で、'+c.name+'が育つ下限('+c.base+'℃)より低いです。保温を考えよう。']);
    else if(lo!=null && lo < rg[0]-2) A.push(['w','🥶','低温注意: '+tl+'が'+lo+'℃です('+rgs+')。'+(chick?'ひなは寒さに弱いので、保温を強めよう。':'')]);
    if(hi!=null && hi > rg[1]+3) A.push(['w','🥵','高温注意: '+tl+'が'+hi+'℃です('+rgs+')。'+(c.cat==='plant'?'日よけ・換気を考えよう。':(chick?'保温を少し弱め、ひなが熱源から離れていないか見よう。':'換気・日よけを考えよう。'))]);
    if(c.cat==='plant'){
      var lw=null; for(var i=es.length-1;i>=0;i--){ if(num(es[i].water)>0){ lw=es[i]; break; } }
      var g = lw? diffDays(lw.date, t) : null;
      if(g==null || g > c.waterDays+1) A.push(['c','💧','水やり確認: '+(g==null?'水やりの記録がありません':'最後の水やりから'+g+'日')+'。土の乾き具合を見よう(目安: '+c.waterDays+'日に1回)。']);
    }
    if(c.cat==='aquatic'){
      var ph=num(last.ph); if(ph!=null && (ph<6.5||ph>8.0)) A.push(['w','🧪','水質注意: pHが'+ph+'です(目安 6.5〜8.0)。水替えを考えよう。']);
      var lw2=null; for(var j=es.length-1;j>=0;j--){ if(num(es[j].water)>0){ lw2=es[j]; break; } }
      var g2 = lw2? diffDays(lw2.date,t) : diffDays(pl.sowDate,t);
      if(g2>c.waterDays) A.push(['c','💧','水替えから'+g2+'日たっています。水のにごり・においを確認しよう。']);
    }
  }
  (pl.tasks||[]).forEach(function(k){ if(!k.done && /追肥|穂肥/.test(k.type)){ var d=diffDays(t,k.date); if(d>=0 && d<=3) A.push(['i','🧴','追肥の時期が近づいています('+mdw(k.date)+' '+k.type+')。']); } });
  if(c.safety){ var near=(pl.tasks||[]).some(function(k){ return /収穫/.test(k.type) && diffDays(t,k.date)<=14; }); if(near) A.push(['w','⚠️','収穫の時期です。'+c.safety]); }
  return A;
}

/* ================= グラフ(Canvas 自作) ================= */
function drawChart(cv, cfg){
  var box=cv.parentNode, W=box.clientWidth, H=box.clientHeight, dpr=window.devicePixelRatio||1;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  var fs = W<500?11:13;
  var L=52, Rm=cfg.right?52:16, T=28, B=40, pw=W-L-Rm, ph=H-T-B;
  var x0=cfg.xMin, x1=cfg.xMax; if(x1<=x0) x1=x0+1;
  function nice(lo, hi, zero){
    if(zero) lo=Math.min(0,lo);
    if(hi<=lo) hi=lo+1;
    var span=hi-lo, st=Math.pow(10, Math.floor(Math.log10(span/5))), m=span/5/st;
    st *= m>5?10:m>2?5:m>1?2:1;
    return {lo:Math.floor(lo/st)*st, hi:Math.ceil(hi/st)*st, st:st};
  }
  var yl=nice(cfg.left.min, cfg.left.max, cfg.left.zero), yr=cfg.right? nice(cfg.right.min, cfg.right.max, false):null;
  function X(x){ return L+(x-x0)/(x1-x0)*pw; }
  function YL(y){ return T+ph-(y-yl.lo)/(yl.hi-yl.lo)*ph; }
  function YR(y){ return T+ph-(y-yr.lo)/(yr.hi-yr.lo)*ph; }
  g.font=fs+'px sans-serif'; g.lineWidth=1;
  /* 目盛り */
  g.strokeStyle='#e3e8e0'; g.fillStyle='#475547'; g.textAlign='right'; g.textBaseline='middle';
  for(var v=yl.lo; v<=yl.hi+1e-9; v+=yl.st){ var yy=YL(v); g.beginPath(); g.moveTo(L,yy); g.lineTo(L+pw,yy); g.stroke(); g.fillText(round(v,2), L-6, yy); }
  if(yr){ g.textAlign='left'; for(var v2=yr.lo; v2<=yr.hi+1e-9; v2+=yr.st){ g.fillStyle='#bf360c'; g.fillText(round(v2,1), L+pw+6, YR(v2)); } }
  var xs = Math.max(1, Math.ceil((x1-x0)/ (pw/70)));
  var nx=[1,2,5,7,10,14,20,30,50,100]; for(var q=0;q<nx.length;q++){ if(nx[q]>=xs){ xs=nx[q]; break; } }
  g.textAlign='center'; g.textBaseline='top'; g.fillStyle='#475547';
  for(var xv=Math.ceil(x0/xs)*xs; xv<=x1; xv+=xs){ var xx=X(xv); g.strokeStyle='#eef2ec'; g.beginPath(); g.moveTo(xx,T); g.lineTo(xx,T+ph); g.stroke(); g.fillText(cfg.xFmt? cfg.xFmt(xv): xv, xx, T+ph+5); }
  g.strokeStyle='#8a9886'; g.lineWidth=1.5; g.strokeRect(L,T,pw,ph);
  /* 軸ラベル */
  g.fillStyle='#172317'; g.font='bold '+fs+'px sans-serif'; g.textAlign='left'; g.textBaseline='top';
  g.fillText(cfg.left.label, 4, 2);
  if(yr){ g.textAlign='right'; g.fillStyle='#bf360c'; g.fillText(cfg.right.label, W-4, 2); }
  g.textAlign='center'; g.fillStyle='#475547'; g.font=fs+'px sans-serif'; g.textBaseline='bottom'; g.fillText(cfg.xLabel||'', L+pw/2, H-1);
  g.save(); g.beginPath(); g.rect(L,T,pw,ph); g.clip();
  /* 今日 */
  if(cfg.nowX!=null && cfg.nowX>=x0 && cfg.nowX<=x1){ g.strokeStyle='#d84315'; g.setLineDash([4,4]); g.lineWidth=2; g.beginPath(); g.moveTo(X(cfg.nowX),T); g.lineTo(X(cfg.nowX),T+ph); g.stroke(); g.setLineDash([]); g.fillStyle='#d84315'; g.textBaseline='top'; var nx0=X(cfg.nowX); g.textAlign = nx0>L+pw-40? 'right':'left'; g.fillText('今日', nx0+(nx0>L+pw-40?-3:3), T+2); }
  (cfg.markers||[]).forEach(function(mk){ if(mk.x<x0||mk.x>x1) return; g.strokeStyle='#f57c00'; g.setLineDash([2,3]); g.lineWidth=1.5; g.beginPath(); g.moveTo(X(mk.x),T); g.lineTo(X(mk.x),T+ph); g.stroke(); g.setLineDash([]); g.fillStyle='#e65100'; g.textAlign='center'; g.textBaseline='top'; var lw=g.measureText('★'+mk.label).width/2+4; g.fillText('★'+mk.label, clamp(X(mk.x),L+lw,L+pw-lw), T+16+(mk.row||0)*16); });
  var hits=[];
  cfg.series.forEach(function(s){
    var Y = s.axis==='right'? YR : YL;
    if(s.type==='band'){ if(!s.pts.length) return; g.fillStyle=s.color; g.beginPath(); s.pts.forEach(function(p,i){ var px=X(p[0]), py=Y(p[2]); if(i) g.lineTo(px,py); else g.moveTo(px,py); }); for(var i=s.pts.length-1;i>=0;i--) g.lineTo(X(s.pts[i][0]), Y(s.pts[i][1])); g.closePath(); g.fill(); return; }
    if(s.type==='range'){ s.pts.forEach(function(p){ var px=X(p[0]); g.strokeStyle=s.color; g.lineWidth=Math.max(4,Math.min(12,pw/(x1-x0)*0.6)); g.lineCap='round'; g.beginPath(); g.moveTo(px,Y(p[1])); g.lineTo(px,Y(p[2])); g.stroke(); g.lineCap='butt'; hits.push({x:px,y:Y((p[1]+p[2])/2),t:s.tip?s.tip(p):''}); }); return; }
    g.strokeStyle=s.color; g.lineWidth=s.width||3; g.setLineDash(s.dash||[]);
    if(s.type!=='points' && s.pts.length>1){ g.beginPath(); s.pts.forEach(function(p,i){ var px=X(p[0]), py=Y(p[1]); if(i) g.lineTo(px,py); else g.moveTo(px,py); }); g.stroke(); }

/* 記録のまとめ(評価・振り返りで使う) */
function recordSummary(ap){
  var c=crop(ap.cropId), F=FIELDS[c.cat], es=entriesOf(ap.id), ms=es.filter(function(e){return num(e.m1)!=null;});
  var ts=es.map(meanT).filter(function(v){return v!=null;});
  var mx=es.map(function(e){return num(e.tmax);}).filter(function(v){return v!=null;});
  var water=es.reduce(function(a,e){ return a+(num(e.water)||0); },0);
  return [
    ['記録した期間', es.length? mdw(es[0].date)+' 〜 '+mdw(es[es.length-1].date)+'('+es.length+'回)':'—'],
    [c.m1.label+'の変化', ms.length? ms[0].m1+' → '+ms[ms.length-1].m1+c.m1.unit:'—'],
    ['平均'+F.t, ts.length? round(ts.reduce(function(a,b){return a+b;},0)/ts.length,1)+'℃'+(mx.length?'(最高 '+Math.max.apply(null,mx)+'℃)':''):'—'],
    [F.water.label+'の合計', round(water,1)+F.water.unit],
    ['終わった作業', (ap.tasks||[]).filter(function(k){return k.done;}).length+' / '+(ap.tasks||[]).length],
    ['診断の記録', (P().diag||[]).filter(function(d){return d.planId===ap.id;}).length+'件']
  ];
}
function recordSummaryHTML(ap){ return '<table class="t">'+recordSummary(ap).map(function(r){ return '<tr><th style="width:12em">'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>'; }).join('')+'</table>'; }
function starText(v){ v=Number(v)||0; return v? '★★★★★'.slice(0,v)+'☆☆☆☆☆'.slice(0,5-v)+'('+v+'/5)' : '(未記入)'; }
function evalRows(ap){
  var c=crop(ap.cropId), ev=P().evals[ap.id]||{};

    ['かかった費用', ev.cost!=null&&ev.cost!==''?ev.cost+'円'+(ev.costNote?'('+ev.costNote+')':''):''], ['うまくいったこと', ev.good], ['うまくいかなかったこと', ev.bad],

function exportJSON(withPhoto){
  var p=P(); if(!p) return;
  var ids=[]; p.entries.forEach(function(e){ ids=ids.concat(e.photoIds||[]); });
  var out={schema:'artifact', app:'B1', title:'育成日誌', version:1, exportedAt:new Date().toISOString(), profile:p, photos:[]};
  toast('書き出しを準備しています…');
  var chain=Promise.resolve();
  if(withPhoto) ids.forEach(function(id){ chain=chain.then(function(){ return PhotoDB.get(id).then(function(r){ if(r&&r.blob) return blobToDataURL(r.blob).then(function(u){ out.photos.push({id:id, takenAt:r.takenAt, data:u}); }); }); }); });
  chain.then(function(){
    download('B1_育成日誌_'+safeName(p.name)+'_'+fileStamp()+'.json', JSON.stringify(out), 'application/json');
    p.lastExport=today(); save(); toast('💾 書き出しました'+(withPhoto?'(写真'+out.photos.length+'枚)':'')); if(cur==='home') R.home({});
  }).catch(function(){ toast('書き出しに失敗しました'); });
}
function importJSON(){
  pickFile('.json,application/json').then(function(fs){
    if(!fs.length) return;
    readText(fs[0]).then(function(txt){
      var j; try{ j=JSON.parse(txt); }catch(e){ toast('ファイルを読めませんでした'); return; }
      if(!j || j.app!=='B1' || !j.profile || typeof j.profile!=='object'){ toast('この教材(B1)のファイルではありません'); return; }
      var pr=j.profile, exists=pr.id && S.profiles[pr.id];
      if(!pr.id) pr.id=uid();
      /* B1-14: やめる/置きかえる/別の名前で追加 の3つから選べるように、2回に分けてきく */
      var ask = exists ? kzConfirm('「'+exists.name+'」の記録がすでにこのタブレットにあります。\nファイルの記録を読みこみますか?', {ok:'読みこむ', cancel:'やめる'}).then(function(go1){
          if(!go1) return null;
          return kzConfirm('どちらにしますか?\n\n・置きかえる: 今の「'+exists.name+'」の記録と写真は消えて、ファイルの内容になります。\n・別の名前で追加: 今の記録はそのまま残り、「'+pr.name+'(読込)」として追加します。', {ok:'置きかえる', cancel:'別の名前で追加', danger:true}).then(function(rep){ return rep ? 'replace' : 'add'; });
        }) : Promise.resolve('new');
      ask.then(function(mode){
        if(!mode) { toast('読みこみをやめました'); return; }
        pr = migrate({profiles:{x:pr}}).profiles.x;
        var photos = (j.photos||[]).filter(function(ph){ return ph && ph.id && ph.data; });
        if(mode==='add'){
          /* 写真は新しいIDにつけかえる(元の記録と写真を共有しない) */
          var idmap={}; photos = photos.map(function(ph){ var n=uid(); idmap[ph.id]=n; return {id:n, takenAt:ph.takenAt, data:ph.data}; });
          pr.entries.forEach(function(e){ e.photoIds=(e.photoIds||[]).map(function(id){ return idmap[id]; }).filter(Boolean); });
          pr.id=uid(); pr.name=pr.name+'(読込)';
        }
        var oldIds=[];
        if(mode==='replace'){
          var keep={}; pr.entries.forEach(function(e){ (e.photoIds||[]).forEach(function(id){ keep[id]=1; }); });
          exists.entries.forEach(function(e){ (e.photoIds||[]).forEach(function(id){ if(!keep[id]) oldIds.push(id); }); });
        }
        var chain=Promise.resolve();
        photos.forEach(function(ph){ chain=chain.then(function(){ return PhotoDB.put({id:ph.id, takenAt:ph.takenAt, blob:dataURLToBlob(ph.data), profileId:pr.id}).catch(function(){}); }); });
        chain.then(function(){
          oldIds.forEach(function(id){ PhotoDB.del(id); });
          S.profiles[pr.id]=pr; if(S.order.indexOf(pr.id)<0) S.order.push(pr.id); S.current=pr.id; save(); draft=null; applySettings();
          toast('📂 読みこみました: '+pr.name); go('home');
        });
      });
    });
  });
}
function csvCell(v){ v=String(v==null?'':v); return /[",\n\r]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
function exportCSV(){
  var p=P(); if(!p) return;
  if(p.demo){ toast('サンプル(練習用)の記録はCSVに書き出せません。「自分の記録にもどる」を押してね'); return; }
  var anon = $('#b1-anon') ? $('#b1-anon').checked : true;
  var nm = anon? '匿名'+(Math.abs(hash(p.id))%900+100) : p.name;
  var rows=[['名前','生物','呼び名','日付','経過日数','天気','最高温度','最低温度','水やり・水替え','肥料・えさ','測定1','測定1の項目','測定2','測定2の項目','pH','メモ']];
  /* B1-09: サンプルの計画は書き出さない。教材側の文字は kzRuby.plain でルビを取る */
  p.plans.filter(function(pl){ return !pl.demo; }).forEach(function(pl){ var c=crop(pl.cropId); entriesOf(pl.id).forEach(function(e){ rows.push([nm, plain(c.name), pl.name, e.date, diffDays(pl.sowDate,e.date), plain(wxName(e.weather)), e.tmax, e.tmin, e.water, e.feed, e.m1, plain(c.m1.label+'('+c.m1.unit+')'), e.m2, c.m2?plain(c.m2.label+'('+c.m2.unit+')'):'', e.ph, anon?'':e.memo]); }); });
  if(rows.length<2){ toast('書き出す記録がありません'); return; }
  download('B1_記録_'+safeName(nm)+'_'+fileStamp()+'.csv', '﻿'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n'), 'text/csv;charset=utf-8');
  toast('📊 CSVを書き出しました');
}
function hash(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return h; }
function parseCSV(t){
  t=t.replace(/^﻿/,''); var rows=[], row=[], cell='', q=false;
  for(var i=0;i<t.length;i++){ var ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ row.push(cell); cell=''; } else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; } else if(ch!=='\r') cell+=ch; }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function importCompare(){
  pickFile('.csv,text/csv').then(function(fs){
    if(!fs.length) return;
    readText(fs[0]).then(function(txt){
      var rows=parseCSV(txt), hd=rows[0]||[], iD=hd.indexOf('経過日数'), iV=hd.indexOf('測定1'), iN=hd.indexOf('名前'), iC=hd.indexOf('生物');
      if(iD<0||iV<0){ toast('この教材で書き出したCSVを選んでください'); return; }
      var ap=activePlan(), cname=crop(ap.cropId).name, groups={}, skipped=0;
      rows.slice(1).forEach(function(r){ var d=num(r[iD]), v=num(r[iV]); if(d==null||v==null) return; if(iC>=0 && r[iC] && r[iC]!==cname){ skipped++; return; } var n=(iN>=0&&r[iN])||'比較'; (groups[n]=groups[n]||[]).push([d,v]); });
      var gs=Object.keys(groups).slice(0,4).map(function(n){ return {name:n, pts:groups[n].sort(function(a,b){return a[0]-b[0];})}; });
      if(!gs.length){ toast(cname+'のデータが見つかりませんでした'+(skipped?'(別の生物のデータでした)':'')); return; }
      graphOpt.compare={groups:gs}; graphOpt.metric='m1'; toast('比較データを読みこみました('+gs.length+'グループ)'); R.graph();
    });
  });
}

function makeDemo(){
  var p=P(); if(!p) return Promise.resolve();
  var sow=addDays(today(),-46), c=crop('tomato');
  var pl={id:uid(), cropId:'tomato', name:'ミニトマト(サンプル)', sowDate:sow, location:'学校の畑(サンプル)', methods:['支柱・誘引','マルチング','かん水(水やり)の工夫'], methodNote:'サンプル: 風で倒れないように支柱を立て、乾燥を防ぐためにマルチをした。', goal:'1株から30個収穫する', tasks:makeTasks(c, sow), demo:true};
  pl.tasks.forEach(function(k){ if(k.date<addDays(today(),-1)) k.done=true; });
  p.plans.push(pl); p.activePlan=pl.id;
  var seed=7; function rnd(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
  var days=[]; for(var d=3; d<=45; d+= (rnd()<0.5?2:3)) days.push(d);
  var chain=Promise.resolve();
  days.forEach(function(d, i){
    var hgt=round(118/(1+Math.exp(-0.095*(d-48)))+ (rnd()-0.5)*1.2, 1); if(hgt<0.5) hgt=0.5;
    var tx=round(23+4*Math.sin(d/9)+rnd()*3,1), tn=round(tx-7-rnd()*3,1);
    var e={id:uid(), planId:pl.id, date:addDays(sow,d), weather:['sun','sun','cloud','rain'][Math.floor(rnd()*4)], tmax:tx, tmin:tn, water:rnd()<0.75?round(300+rnd()*400,-2):'', feed:(d>=49&&d<=51)?'追肥(固形)':'なし', m1:hgt, m2:Math.max(0,Math.round(hgt/5.5+rnd())), ph:'', memo:i===0?'芽が出た! 子葉が2枚。':(d>=24&&d<=27)?'つぼみのようなものが見えた。':'', photoIds:[]};
    if(i%2===0) chain=chain.then(function(){ return demoPhoto(hgt, d).then(function(b){ var id=uid(); e.photoIds.push(id); return PhotoDB.put({id:id, takenAt:e.date, blob:b, profileId:p.id}).catch(function(){ e.photoIds.pop(); }); }); });
    p.entries.push(e);
  });
  return chain.then(function(){ save(); });
}
function demoPhoto(h, d){
  var cv=document.createElement('canvas'); cv.width=480; cv.height=480; var g=cv.getContext('2d');
  var sky=g.createLinearGradient(0,0,0,480); sky.addColorStop(0,'#bfe3ff'); sky.addColorStop(1,'#eaf6ff'); g.fillStyle=sky; g.fillRect(0,0,480,480);
  g.fillStyle='#7b5a3c'; g.fillRect(0,400,480,80); g.fillStyle='#5d4037'; g.fillRect(160,360,160,60);
  var ph=Math.min(330, 10+h*2.6); g.strokeStyle='#2e7d32'; g.lineWidth=6; g.beginPath(); g.moveTo(240,370); g.quadraticCurveTo(232,370-ph/2,240,370-ph); g.stroke();
  var nl=Math.max(2, Math.round(h/6)); for(var i=0;i<nl;i++){ var y=370-ph*(i+1)/(nl+1), s=i%2?1:-1, w=12+Math.min(28,h/3); g.fillStyle='#43a047'; g.beginPath(); g.ellipse(240+s*w, y, w, w*0.45, s*0.4, 0, Math.PI*2); g.fill(); }
  if(d>30){ g.fillStyle='#fdd835'; for(var k=0;k<3;k++){ g.beginPath(); g.arc(225+k*15, 370-ph*0.7, 6, 0, Math.PI*2); g.fill(); } }
  g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(0,0,480,44); g.fillStyle='#fff'; g.font='bold 24px sans-serif'; g.fillText('サンプル写真 '+d+'日目', 14, 30);
  return canvasToBlob(cv, 0.7);
}

/* B1-03 / K7: 評価・メモ・振り返りは入力のたびに自動で保存する */
var saveTimer=null, dirty=false, reflDirty=false;
function markDirty(){ dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flushSave, 500); }
function flushSave(){
  clearTimeout(saveTimer); saveTimer=null;
  if(!dirty) return;
  dirty=false;
  var p=P(); if(!p) return;
  if(reflDirty){ p.refl=p.refl||{}; p.refl.savedTs=new Date().toISOString(); p.refl.savedAt=mdw(today())+' '+hhmm(); reflDirty=false; }
  save(); writeReflStat();
  var rs=$('#b1-rsaved'); if(rs) rs.textContent=savedLabel();
  $$('[data-autosave]').forEach(function(x){ x.textContent='✓ 自動で保存しました('+hhmm()+')'; });
}
function autoInput(t){
  var p=P(); if(!p || !t.dataset) return false;
  var ap=activePlan(), d=t.dataset;
  if(d.refl || d.rh){ p.refl=p.refl||{}; p.refl[d.refl||d.rh]=t.value; reflDirty=true; markDirty(); return true; }
  if(!ap) return false;
  if(d.ev){ p.evals[ap.id]=p.evals[ap.id]||{}; p.evals[ap.id][d.ev]=t.value; markDirty(); return true; }
  if(d.note){ p.notes[ap.id]=p.notes[ap.id]||{}; p.notes[ap.id][d.note]=t.value; markDirty(); return true; }
  if(t.id==='b1-dgmemo'){ p.notes[ap.id]=p.notes[ap.id]||{}; p.notes[ap.id].dgDraft=t.value; markDirty(); return true; }
  return false;
}
