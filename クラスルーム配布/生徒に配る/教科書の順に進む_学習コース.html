<div id="tapp">
  <!-- 上の帯: 目次のときと、節を開いたときで中身を変える(どちらも1段) -->
  <header class="c-bar" id="c-bar">
    <div id="c-bar-toc" style="display:contents">
      <h1 class="c-bar-title">技術分野 教材集</h1>
      <span class="c-sp"></span>
      <span class="c-seg" role="group" aria-label="使い方をえらぶ">
        <button type="button" data-mode="self" aria-pressed="true">ひとりで進む</button>
        <button type="button" data-mode="class" aria-pressed="false">授業で使う</button>
      </span>
    </div>
    <div id="c-bar-sec" style="display:contents" hidden>
      <button type="button" class="c-back" id="c-back">◀ 目次</button>
      <span class="c-bar-ref" id="c-bar-ref"></span>
      <span class="c-bar-name" id="c-bar-name"></span>
      <span class="c-bar-p" id="c-bar-p"></span>
      <span class="c-sp"></span>
      <span class="c-classnav" id="c-classnav">
        <button type="button" class="ef-btn" id="c-cprev" title="前の節">◀ 前</button>
        <button type="button" class="ef-btn" id="c-cnext" title="次の節">次 ▶</button>
      </span>
    </div>
    <button type="button" class="ef-btn" id="c-view" aria-expanded="false" aria-controls="c-menu">表示</button>
    <div class="c-menu" id="c-menu" hidden>
      <button type="button" data-ef-pref="ruby" title="ふりがなの表示・非表示">ふりがな</button>
      <button type="button" data-ef-pref="fs"></button>
      <button type="button" data-ef-pref="kukkiri">くっきり</button>
      <span data-ef-fs></span>
      <button type="button" class="ef-btn" id="t-howto">使い方</button>
      <button type="button" class="ef-btn" id="c-about">このページについて</button>
    </div>
  </header>

  <!-- 目次 -->
  <main class="c-main" id="c-toc">
    <p class="c-small" id="c-cont-k">つづきから</p>
    <div class="c-cont" id="c-cont">
      <div class="c-cont-t"><span class="c-small" id="c-cont-ref"></span><b id="c-cont-name"></b></div>
      <button type="button" class="ef-btn ef-btn-primary" id="c-cont-go">つづきをひらく ▶</button>
    </div>
    <div class="c-prog"><span class="c-track" aria-hidden="true"><span id="c-track"></span></span><span id="c-count" class="c-small"></span></div>
    <nav class="c-hens" id="c-hens" role="tablist" aria-label="編をえらぶ"></nav>
    <div id="c-hen-body"></div>

    <section class="c-list" aria-labelledby="c-list-h">
      <h2 id="c-list-h">教材の一覧 <span class="c-small">(先生が「A4 を開いて」と言ったとき)</span></h2>
      <ul id="c-apps"></ul>
    </section>

    <section class="c-rec" aria-labelledby="c-rec-h">
      <h2 id="c-rec-h">記録を出す</h2>
      <p class="c-small">先生に言われたら、組・番号・名前を入れて書き出します。どの節まで進んだかと、「まとめ」に書いた文が入ります。</p>
      <div class="t-row3">
        <label class="t-field"><span>組</span><input data-k="who.cls" autocomplete="off"></label>
        <label class="t-field"><span>番号</span><input data-k="who.no" inputmode="numeric" autocomplete="off"></label>
        <label class="t-field"><span>名前</span><input data-k="who.name" autocomplete="off"></label>
      </div>
      <div class="t-btns"><button type="button" class="t-btn t-pri" id="c-export">記録を書き出す</button><span id="c-export-msg" class="c-small" aria-live="polite"></span></div>
    </section>
  </main>

  <!-- 節の画面 -->
  <div class="c-secview" id="c-secview" hidden>
    <div class="c-app"><iframe id="c-frame" title="教材" allow="fullscreen; microphone; camera; clipboard-write" allowfullscreen></iframe></div>
    <aside class="c-guide" id="c-guide" aria-label="この節の進め方">
      <button type="button" class="c-sheet-h" id="c-sheet-h" aria-expanded="false"><span class="c-sheet-n" id="c-sheet-n"></span><span id="c-sheet-t"></span><span class="c-sp"></span><span class="c-small" id="c-sheet-o">▲ ひらく</span></button>
      <div class="c-guide-in">
        <h2 class="c-guide-h">この節の進め方 <span class="c-small" id="c-gcount"></span></h2>
        <div class="c-gtrack" aria-hidden="true"><span id="c-gtrack"></span></div>
        <ol class="c-steps" id="c-steps"></ol>
        <div class="c-nav2"><button type="button" class="ef-btn" id="c-prev">◀ 前の節</button><button type="button" class="ef-btn" id="c-next">次の節 ▶</button></div>
      </div>
    </aside>
  </div>
</div>
<div data-ef-footer id="c-footer"></div>

<script>
(function () {
  'use strict';
  // 配るファイルの名前(T-textbook/build.py が BASE を '' にする。site/build.py が公開用の名前に書きかえる)
  var BASE = '', WS_BASE = 'ワークシート/';
  var FILES = {"G": "G_技術分野のガイダンス.html", "A": "A_材料と加工_統一版.html", "B": "B_生物育成_統一版.html", "C": "C_エネルギー変換_統一版.html", "D": "D_情報の技術_統一版.html", "M": "M_身の回りの技術さがし.html", "F": "F_これからの技術ラボ.html", "Z": "Z_学習を終えて.html"};
  var WS = {"G": "G_技術分野のガイダンス_ワークシート.html", "A": "A_材料と加工_ワークシート.html", "B": "B_生物育成_ワークシート.html", "C": "C_エネルギー変換_ワークシート.html", "D": "D_情報の技術_ワークシート.html", "M": "M_身の回りの技術さがし_ワークシート.html", "F": "F_これからの技術ラボ_ワークシート.html", "Z": "Z_学習を終えて_ワークシート.html"};
  var MENU = FILES;  // 教材の一覧から開くファイル(生徒用サイトでは、上に「◀ 教科書の目次」のバーが付いたページにする)

  var APPS = window.COURSE_APPS, COURSE = window.COURSE, JISHU = window.COURSE_JISHU || {};
  // 自習ガイドの言葉のふりがなも使う(t-ruby.js にないものだけ足す)。かなのまじる言葉(「次の」など)は、
  // その分野の文の中だけの読みのことがあるので足さない。分野の手順・問題の文は、その分野の表で付ける(RB)
  var R = window.COURSE_RUBY || {}, RB = window.COURSE_RUBY_BY || {};
  window.T_RUBY = window.T_RUBY || {};
  Object.keys(R).forEach(function (k) { if (!window.T_RUBY[k] && /^[一-鿿々]+$/.test(k)) window.T_RUBY[k] = R[k]; });

  var T = TCore.init({
    key: 'eduit.course.v1', blank: function () { return { done: {}, st: {}, last: '', who: { cls: '', no: '', name: '' } }; },
    howto: '<h3>このページの使い方</h3><ol>' +
      '<li>教科書の目次の順に、節がならんでいます。上の「1編」などで編をえらびます。</li>' +
      '<li>節の「ひらく」を押すと、左に教材、右に「この節の進め方」が出ます。</li>' +
      '<li>進め方は5つです。教科書をひらく → まず考えよう → やってみる → たしかめ → まとめ。</li>' +
      '<li>まとめを書くと、その節に ✓ が付きます。「次の節」で、そのまま次へ進めます。</li>' +
      '<li>「授業で使う」にすると、進め方を出さずに教材だけを開きます。先生の説明を聞きながら使います。</li></ol>' +
      '<p>✓ や書いたことは、この端末のブラウザの中に保存されます。先生に言われたら、目次のいちばん下の「記録を書き出す」で出します。</p>'
  });
  var S = T.S, el = T.el, $ = T.$;
  if (typeof S.st !== 'object' || !S.st) S.st = {};

  // ---- 使い方のモード: ひとりで進む(進め方を出す)・授業で使う(教材だけ) ----
  var MODE_KEY = 'eduit.course.mode';
  var mode = 'self';
  try { mode = localStorage.getItem(MODE_KEY) === 'class' ? 'class' : 'self'; } catch (e) {}
  var m = /[?&]mode=(self|class)(?:&|$)/.exec(location.search);
  if (m) mode = m[1];
  Array.prototype.forEach.call(document.querySelectorAll('.c-seg [data-mode]'), function (b) {
    b.addEventListener('click', function () {
      mode = b.getAttribute('data-mode');
      try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
      paintMode();
    });
  });
  function paintMode() {
    Array.prototype.forEach.call(document.querySelectorAll('.c-seg [data-mode]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === mode)); });
  }

  // ---- 表示のメニュー(ふりがな・文字・くっきり・全画面・使い方) ----
  var viewBtn = $('c-view'), menu = $('c-menu');
  viewBtn.addEventListener('click', function (e) { e.stopPropagation(); menu.hidden = !menu.hidden; viewBtn.setAttribute('aria-expanded', String(!menu.hidden)); });
  document.addEventListener('click', function (e) { if (!menu.hidden && !menu.contains(e.target) && e.target !== viewBtn) { menu.hidden = true; viewBtn.setAttribute('aria-expanded', 'false'); } });
  $('c-about').addEventListener('click', function () { EduitFrame.open(0); });
  // 表示を変えたら、となりの教材にも読みなおしてもらう(file:// で開いたときのため)
  EduitFrame.prefs.on(function () { post({ eduitSec: 'prefs' }); });

  // ---- 節の一覧を作る ----
  var all = [], extra = [], byId = {};  // all: 進み具合に数える節。extra: 付録(発展)
  COURSE.forEach(function (H) {
    H.chapters.forEach(function (C) {
      C.secs.forEach(function (s) {
        var x = { s: s, H: H, C: C };
        byId[s.id] = x;
        (H.extra ? extra : all).push(x);
      });
    });
  });
  var ORDER = all.concat(extra);
  function numOf(s) { var mm = /(\d+)\s*$/.exec(s.ref); return mm ? mm[1] : ''; }
  function shortRef(s) { return s.ref.replace(/\s+/g, ''); }
  // 付録の節(「1編1章 2 を深める」)を、もとの節から開けるようにする
  var deeper = {};
  extra.forEach(function (x) {
    var mm = /^(\d+編\d+章)\s*([\d・]+)\s*を深める/.exec(x.s.ref);
    if (!mm) return;
    mm[2].split('・').forEach(function (n) {
      all.forEach(function (y) { if (y.s.ref === mm[1] + ' ' + n) (deeper[y.s.id] = deeper[y.s.id] || []).push(x); });
    });
  });

  // 節で使う教材: go の1つずつ → { key: COURSE_APPS の記号, code: 教材の中の記号(ready で来る), j: 自習ガイドの記号, label, href }
  function appsOf(s) {
    return s.go.map(function (g) {
      var A = APPS[g[0]];
      var h = g[2] != null ? g[2] : A.h;
      var area = (g[0] === 'M' || g[0] === 'F') && h ? h : '';
      var qs = ['sec=' + s.id, area ? 'bunya=' + area : '', A.q || ''].filter(Boolean).join('&');
      return {
        key: g[0], code: A.q ? null : g[0], j: area ? g[0] + area.toUpperCase() : g[0], tab: g[1], tag: A.tag || g[0], name: A.name,
        href: BASE + FILES[A.f] + '?' + qs + (h ? '#' + h : '')
      };
    });
  }
  function hasSec(x, id) { return x.sec != null && [].concat(x.sec).indexOf(id) >= 0; }
  // その節の手順(sec の付いた手順。発展は more に分ける)
  function stepsOf(s, app) {
    var J = JISHU[app.j];
    if (!J) return { basic: [], adv: [] };
    var list = (J.steps || []).map(function (x, i) { return { x: x, i: i }; }).filter(function (o) { return hasSec(o.x, s.id) && !o.x.reflect; });
    return { basic: list.filter(function (o) { return o.x.level !== 'advanced'; }), adv: list.filter(function (o) { return o.x.level === 'advanced'; }) };
  }
  // たしかめ: コースの1問と、自習ガイドのたしかめ問題(sec の付いたもの)から、3問まで
  function quizOf(s) {
    var out = [];
    if (s.q) out.push({ t: s.q.t, c: s.q.c, a: 0, x: s.q.x });
    appsOf(s).forEach(function (a) {
      var J = JISHU[a.j];
      (J && J.check || []).forEach(function (q) { if (hasSec(q, s.id)) out.push({ t: q.q, c: q.choices, a: q.answer, x: q.explain, rb: RB[a.j] }); });
    });
    var seen = {};
    return out.filter(function (q) { if (seen[q.t]) return false; seen[q.t] = 1; return true; }).slice(0, 3);
  }
  function stOf(id) {
    var st = S.st[id];
    if (!st || typeof st !== 'object') st = S.st[id] = {};
    ['s', 'sub', 'q'].forEach(function (k) { if (!st[k] || typeof st[k] !== 'object') st[k] = {}; });
    if (typeof st.m !== 'string') st.m = '';
    return st;
  }
  function stepCount(id) { var st = S.st[id]; return st && st.s ? Object.keys(st.s).filter(function (k) { return st.s[k]; }).length : 0; }

  // ---- 目次 ----
  var HEN_SHORT = { g: 'ガイダンス', a: '1編 材料と加工', b: '2編 生物育成', c: '3編 エネルギー変換', d: '4編 情報', i: '統合的な問題解決', z: '学習を終えて', x: '付録 発展' };
  var HEN_KEY = 'eduit.course.hen';
  var curHen = '';
  try { curHen = localStorage.getItem(HEN_KEY) || ''; } catch (e) {}
  var henBtns = {};
  COURSE.forEach(function (H) {
    var b = el('button', { type: 'button', role: 'tab', class: 'c-hen-' + H.id, 'aria-selected': 'false' }, [HEN_SHORT[H.id] || H.title, el('span', { class: 'c-n' })]);
    b.addEventListener('click', function () { showHen(H.id); });
    $('c-hens').appendChild(b);
    henBtns[H.id] = b;
  });
  function nextSec() {
    // つづき: 前に開いた節がまだなら、その節。終わっていれば、そのあとのまだの節。なければ最初のまだの節
    var i = -1;
    all.forEach(function (x, k) { if (x.s.id === S.last) i = k; });
    if (i >= 0 && !S.done[all[i].s.id]) return all[i];
    for (var k = i + 1; k < all.length; k++) if (!S.done[all[k].s.id]) return all[k];
    for (k = 0; k < all.length; k++) if (!S.done[all[k].s.id]) return all[k];
    return null;
  }
  function showHen(id) {
    curHen = id;
    try { localStorage.setItem(HEN_KEY, id); } catch (e) {}
    renderToc();
  }
  function renderToc() {
    var nx = nextSec();
    if (!curHen || !henBtns[curHen]) curHen = nx ? nx.H.id : 'g';
    Object.keys(henBtns).forEach(function (k) { henBtns[k].setAttribute('aria-selected', String(k === curHen)); });
    // 編ごとの数
    COURSE.forEach(function (H) {
      var n = 0, d = 0;
      H.chapters.forEach(function (C) { C.secs.forEach(function (s) { n++; if (S.done[s.id]) d++; }); });
      henBtns[H.id].querySelector('.c-n').textContent = d + '/' + n;
    });
    // つづきから
    $('c-cont').hidden = $('c-cont-k').hidden = !nx;
    if (nx) {
      T.text($('c-cont-ref'), shortRef(nx.s) + (nx.s.p ? ' ・ 教科書 p.' + nx.s.p : ''));
      T.text($('c-cont-name'), nx.s.name);
    }
    var done = all.filter(function (x) { return S.done[x.s.id]; }).length;
    $('c-track').style.width = (done / all.length * 100) + '%';
    T.text($('c-count'), done + ' / ' + all.length + ' 節 できた');
    // 編の中身
    var box = $('c-hen-body');
    box.innerHTML = '';
    var H = COURSE.filter(function (h) { return h.id === curHen; })[0];
    box.className = 'c-hen-' + H.id;
    box.appendChild(el('h2', { class: 'c-hen-h', text: H.title }));
    if (H.when) box.appendChild(el('p', { class: 'c-when c-small', text: (H.extra ? '' : 'いつ: ') + H.when }));
    H.chapters.forEach(function (C) {
      var d = C.secs.filter(function (s) { return S.done[s.id]; }).length;
      if (C.title) box.appendChild(el('h3', { class: 'c-ch' }, [C.ch + ' ' + C.title, el('span', { class: 'c-small', text: d + ' / ' + C.secs.length + ' できた' })]));
      var ul = el('ul', { class: 'c-rows' });
      C.secs.forEach(function (s) {
        var now = nx && nx.s.id === s.id;
        var open = el('button', { type: 'button', class: 'ef-btn c-open' + (now ? ' ef-btn-primary' : ''), text: 'ひらく ▶' });
        open.addEventListener('click', function () { openSec(s.id); });
        var sub = H.extra ? s.ref : (stepCount(s.id) && !S.done[s.id] ? '進め方 ' + stepCount(s.id) + ' / 5' : '');
        ul.appendChild(el('li', { class: 'c-row' + (now ? ' is-now' : '') }, [
          el('span', { class: 'c-ck', 'aria-label': S.done[s.id] ? 'できた' : 'まだ', text: S.done[s.id] ? '✓' : '' }),
          el('span', { class: 'c-no', text: H.extra ? '' : (numOf(s) || '') }),
          el('span', { class: 'c-t' }, [s.name, sub ? el('span', { class: 'c-small', text: sub }) : null, s.p ? el('span', { class: 'c-small c-pg2', text: '教科書 p.' + s.p }) : null]),
          el('span', { class: 'c-pg c-small', text: s.p ? 'p.' + s.p : '' }),
          open
        ]));
      });
      box.appendChild(ul);
    });
    T.ruby(box);
  }
  $('c-cont-go').addEventListener('click', function () { var nx = nextSec(); if (nx) openSec(nx.s.id); });

  // 教材の一覧(先生が「A4 を開いて」と言ったとき。分野のメニューを開く)
  [['G', 'G', '技術分野のガイダンス', '1年生のはじめ'], ['A', 'A', '材料と加工の技術', '教材 A1〜A8'], ['B', 'B', '生物育成の技術', '教材 B1〜B6'], ['C', 'C', 'エネルギー変換の技術', '教材 C1〜C8'],
    ['D', 'D', '情報の技術', '教材 D1〜D11'], ['M', 'M', '身の回りの技術さがし', '各編のはじめ'], ['F', 'F', 'これからの技術ラボ', '各編の最後'], ['Z', 'Z', '学習を終えて', '3年生の最後']].forEach(function (a) {
    $('c-apps').appendChild(el('li', null, [el('a', { href: BASE + MENU[a[0]], 'data-ef-domain': a[1] }, [
      el('span', { class: 'ef-code', text: a[1] }), el('span', { class: 'c-t' }, [a[2], el('span', { class: 'c-small', text: a[3] })]), el('span', { class: 'c-small', text: 'ひらく ▶' })])]));
  });

  // ---- 節の画面 ----
  var cur = null, curApp = null, frame = $('c-frame'), openStep = 0, wantGo = null, sentFirst = {};
  function post(msg) { try { if (frame.contentWindow) frame.contentWindow.postMessage(msg, '*'); } catch (e) {} }
  function tabsFor(app) {
    var r = stepsOf(cur.s, app), out = [];
    r.basic.concat(r.adv).forEach(function (o) { if (o.x.go && out.indexOf(o.x.go) < 0) out.push(o.x.go); });
    return out;
  }
  function loadApp(app, go) {
    curApp = app;
    wantGo = go || null;
    sentFirst = {};
    frame.src = app.href;
    paintAppBtns();
  }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!cur || !curApp || !d || d.eduitSec !== 'ready' || e.source !== frame.contentWindow) return;
    if (d.code !== curApp.code) return;
    post({ eduitSec: 'set', code: d.code, tabs: mode === 'self' ? tabsFor(curApp) : [] });
    var go = wantGo;
    if (!go && !sentFirst[d.code]) { var t = tabsFor(curApp); go = t[0] || null; }
    sentFirst[d.code] = 1;
    wantGo = null;
    if (go) post({ eduitSec: 'go', code: d.code, go: go });
  });

  function idx(id) { for (var i = 0; i < ORDER.length; i++) if (ORDER[i].s.id === id) return i; return -1; }
  function neighbor(id, dir) {
    var x = byId[id], list = x.H.extra ? extra : all, i = list.indexOf(x) + dir;
    return list[i] || null;
  }
  function openSec(id, noPush) {
    var x = byId[id];
    if (!x) return;
    cur = x;
    S.last = x.H.extra ? S.last : id;
    T.save();
    var st = stOf(id);
    openStep = firstOpen(st);
    document.body.classList.toggle('is-class-sec', mode === 'class');
    $('c-toc').hidden = true; $('c-footer').hidden = true;
    $('c-bar-toc').hidden = true; $('c-bar-sec').hidden = false;
    var sv = $('c-secview');
    sv.hidden = false;
    sv.classList.toggle('is-class', mode === 'class');
    $('c-guide').hidden = mode === 'class';
    $('c-bar').className = 'c-bar c-hen-' + x.H.id;
    sv.className = 'c-secview c-hen-' + x.H.id + (mode === 'class' ? ' is-class' : '');
    T.text($('c-bar-ref'), shortRef(x.s));
    T.text($('c-bar-name'), x.s.name);
    T.text($('c-bar-p'), x.s.p ? '教科書 p.' + x.s.p : '');
    document.title = shortRef(x.s) + ' ' + x.s.name;
    $('c-guide').classList.remove('is-up');
    $('c-sheet-h').setAttribute('aria-expanded', 'false');
    loadApp(appsOf(x.s)[0]);
    renderGuide();
    if (!noPush) try { history.pushState({ sec: id }, '', location.pathname + location.search + '#s=' + id); } catch (e) {}
    window.scrollTo(0, 0);
  }
  function closeSec(noPush) {
    cur = null; curApp = null;
    frame.src = 'about:blank';
    document.body.classList.remove('is-class-sec');
    $('c-secview').hidden = true;
    $('c-toc').hidden = false; $('c-footer').hidden = false;
    $('c-bar-toc').hidden = false; $('c-bar-sec').hidden = true;
    $('c-bar').className = 'c-bar';
    document.title = '技術分野 教材集(教科書の目次)';
    renderToc();
    if (!noPush) try { history.pushState(null, '', location.pathname + location.search); } catch (e) {}
  }
  $('c-back').addEventListener('click', function () { closeSec(); });
  window.addEventListener('popstate', function () { route(true); });
  function route(noPush) {
    var mm = /^#s=([a-z0-9]+)$/.exec(location.hash);
    if (mm && byId[mm[1]]) openSec(mm[1], noPush); else if (cur) closeSec(noPush); else renderToc();
  }
  function go(dir) { var n = cur && neighbor(cur.s.id, dir); if (n) openSec(n.s.id); }
  $('c-prev').addEventListener('click', function () { go(-1); });
  $('c-next').addEventListener('click', function () { go(1); });
  $('c-cprev').addEventListener('click', function () { go(-1); });
  $('c-cnext').addEventListener('click', function () { go(1); });
  $('c-sheet-h').addEventListener('click', function () {
    var up = !$('c-guide').classList.contains('is-up');
    $('c-guide').classList.toggle('is-up', up);
    this.setAttribute('aria-expanded', String(up));
    T.text($('c-sheet-o'), up ? '▼ とじる' : '▲ ひらく');
  });

  // ---- この節の進め方(5つの手順) ----
  var STEP_NAMES = ['教科書をひらく', 'まず考えよう', 'やってみる', 'たしかめ', 'まとめ'];
  function firstOpen(st) { for (var i = 1; i <= 5; i++) if (!st.s[i]) return i; return 5; }
  var appBtns = [];
  function paintAppBtns() { appBtns.forEach(function (o) { o.b.setAttribute('aria-pressed', String(curApp && o.a.href === curApp.href)); }); }
  function doneBtn(n, label, check) {
    var b = el('button', { type: 'button', class: 'ef-btn ef-btn-primary', text: label || 'できた' });
    b.addEventListener('click', function () {
      if (check && !check()) return;
      markStep(n);
    });
    return b;
  }
  function markStep(n) {
    var st = stOf(cur.s.id);
    st.s[n] = 1;
    if (n === 5) S.done[cur.s.id] = true;
    T.save();
    openStep = firstOpen(st);
    if (st.s[5]) openStep = 0;
    renderGuide();
  }
  function stepBody(n, st) {
    var s = cur.s, b = el('div', { class: 'c-step-b' });
    if (n === 1) {
      b.appendChild(el('p', { text: s.p ? '教科書の p.' + s.p + ' をひらこう。' : '教科書の「' + s.ref + '」のページをひらこう。' }));
      if (s.pnote) b.appendChild(el('p', { class: 'c-small', text: s.pnote }));
      if (s.kw && s.kw.length) {
        b.appendChild(el('p', { class: 'c-small', text: 'この節のキーワード。教科書で、この言葉をさがそう。' }));
        b.appendChild(el('div', { class: 'c-kws' }, s.kw.map(function (k) { return el('span', { class: 'c-kw', text: k }); })));
      }
      b.appendChild(el('div', { class: 'c-foot' }, [doneBtn(1, 'ひらいた')]));
    } else if (n === 2) {
      var L = EduitFrame.lets(s.id);
      if (L) {
        b.appendChild(el('p', { style: 'font-weight:700', text: L.q }));
        if (L.hint) b.appendChild(el('details', { class: 'c-more' }, [el('summary', { text: 'ヒント' }), el('p', { class: 'c-hint', text: L.hint })]));
      } else b.appendChild(el('p', { text: 'この節のねらいを読もう。' }));
      b.appendChild(el('p', { class: 'c-small', text: 'ねらい: ' + s.aim }));
      b.appendChild(el('div', { class: 'c-foot' }, [doneBtn(2, '考えた')]));
    } else if (n === 3) {
      var apps = appsOf(s);
      appBtns = [];
      apps.forEach(function (a) {
        var r = stepsOf(s, a);
        if (apps.length > 1 || !a.code) {
          var ob = el('button', { type: 'button', class: 'ef-btn', 'aria-pressed': 'false', text: 'ひらく ▶' });
          ob.addEventListener('click', function () { loadApp(a); if (narrow()) sheet(false); });
          appBtns.push({ a: a, b: ob });
          b.appendChild(el('div', { class: 'c-apphead' }, [el('span', { class: 'ef-code', text: a.tag }), el('b', { text: a.name }), ob]));
        }
        if (!a.code) b.appendChild(el('p', { text: '学習のまとめの問題を、全部といてみよう。まちがえた問題は、教材にもどって確かめよう。' }));
        b.appendChild(el('ol', { class: 'c-sub' }, r.basic.map(function (o) { return subEl(a, o, st); })));
        if (r.adv.length) b.appendChild(el('details', { class: 'c-more' }, [el('summary', { text: 'もっと調べたい人(発展)' }), el('ol', { class: 'c-sub' }, r.adv.map(function (o) { return subEl(a, o, st); }))]));
      });
      paintAppBtns();
      if (s.fig) b.appendChild(el('p', { class: 'c-fig', text: '教科書 ' + s.fig.replace(/ (図.*)$/, ' の$1') + ' と、教材の画面をくらべよう。' }));
      var deep = deeper[s.id] || [];
      if (deep.length) {
        b.appendChild(el('details', { class: 'c-more' }, [el('summary', { text: 'もっと調べたい人(付録の発展)' }), el('ul', { class: 'c-sub' }, deep.map(function (x) {
          var ob = el('button', { type: 'button', class: 'ef-btn', text: 'ひらく ▶' });
          ob.addEventListener('click', function () { openSec(x.s.id); });
          return el('li', null, [el('b', { text: x.s.name }), el('p', { class: 'c-small', text: x.s.aim }), ob]);
        }))]));
      }
      b.appendChild(el('div', { class: 'c-foot' }, [doneBtn(3)]));
    } else if (n === 4) {
      var qs = quizOf(s);
      if (!qs.length) {
        b.appendChild(el('p', { text: '教材でやったことを、教科書の本文と見くらべよう。' }));
        b.appendChild(el('div', { class: 'c-foot' }, [doneBtn(4)]));
      } else {
        b.appendChild(el('p', { class: 'c-small', text: '全部正解すると ✓ が付きます。まちがえたら、もう一度えらぼう。' }));
        var ol = el('ol', { class: 't-quiz' });
        b.appendChild(ol);
        T.quiz(ol, null, null, qs, function () { return stOf(cur.s.id).q; }, { mix: idx(s.id) * 7 + 3 });
      }
    } else if (n === 5) {
      b.appendChild(el('p', { text: 'この節で分かったことを、自分の言葉で1文に書こう。' }));
      b.appendChild(el('p', { class: 'c-small', text: s.kw && s.kw.length ? 'キーワード(' + s.kw.slice(0, 3).join('・') + ' など)を1つ使おう。' : 'ねらいの言葉を使って書こう。' }));
      var ta = el('textarea', { 'aria-label': 'まとめ', rows: '3' });
      ta.value = st.m || '';
      var msg = el('p', { class: 'c-small', 'aria-live': 'polite' });
      ta.addEventListener('input', function () { stOf(cur.s.id).m = ta.value; T.save(); });
      b.appendChild(ta);
      b.appendChild(msg);
      b.appendChild(el('div', { class: 'c-foot' }, [doneBtn(5, '書いた', function () {
        if (ta.value.trim().length < 5) { T.text(msg, 'まとめを1文書いてから押そう。'); ta.focus(); return false; }
        return true;
      })]));
    }
    return b;
  }
  function subEl(a, o, st) {
    var k = a.j + '.' + o.i, x = o.x;
    var cb = el('input', { type: 'checkbox' });
    cb.checked = !!st.sub[k];
    var li = el('li', { class: cb.checked ? 'is-done' : '' });
    cb.addEventListener('change', function () { var t = stOf(cur.s.id); if (cb.checked) t.sub[k] = 1; else delete t.sub[k]; li.classList.toggle('is-done', cb.checked); T.save(); });
    var tools = el('div', { class: 'c-sub-tools' });
    var hint = null;
    if (x.go) {
      var gb = el('button', { type: 'button', class: 'ef-btn', text: 'この場所へ ▶' });
      gb.addEventListener('click', function () {
        if (!curApp || curApp.href !== a.href) loadApp(a, x.go); else post({ eduitSec: 'go', code: a.code, go: x.go });
        if (narrow()) sheet(false);
      });
      tools.appendChild(gb);
    }
    if (x.hint) {
      hint = el('p', { class: 'c-hint', hidden: '', text: x.hint });
      var hb = el('button', { type: 'button', class: 'ef-btn', 'aria-expanded': 'false', text: 'ヒント' });
      hb.addEventListener('click', function () { hint.hidden = !hint.hidden; hb.setAttribute('aria-expanded', String(!hint.hidden)); });
      tools.appendChild(hb);
    }
    tools.appendChild(el('label', null, [cb, 'できた']));
    li.appendChild(el('span', { class: 'c-sub-where', text: x.where || '' }));
    li.appendChild(el('span', { class: 'c-sub-do', text: x.do }));
    li.appendChild(tools);
    if (hint) li.appendChild(hint);
    if (RB[a.j]) T.ruby(li, RB[a.j]);
    return li;
  }
  function renderGuide() {
    var st = stOf(cur.s.id), ol = $('c-steps');
    ol.innerHTML = '';
    var qs = quizOf(cur.s);
    // たしかめが全部正解なら、4 に ✓
    if (qs.length && qs.every(function (q, i) { return st.q[i] != null && +st.q[i] === q.a; }) && !st.s[4]) { st.s[4] = 1; T.save(); }
    var n = stepCount(cur.s.id);
    T.text($('c-gcount'), n + ' / 5');
    $('c-gtrack').style.width = (n / 5 * 100) + '%';
    var on = openStep || 0;
    T.text($('c-sheet-n'), (S.done[cur.s.id] ? '✓' : (on || 5) + ' / 5'));
    T.text($('c-sheet-t'), S.done[cur.s.id] ? 'この節はできた' : STEP_NAMES[(on || 5) - 1]);
    STEP_NAMES.forEach(function (name, i) {
      var k = i + 1, isOpen = k === on;
      var h = el('button', { type: 'button', class: 'c-step-h', 'aria-expanded': String(isOpen) }, [
        el('span', { class: 'c-sn', text: String(k) }), el('span', { text: name }),
        el('span', { class: 'c-small', text: k === 4 && qs.length ? qs.length + '問' : (k === 1 && cur.s.p ? 'p.' + cur.s.p : '') })]);
      h.addEventListener('click', function () { openStep = openStep === k ? 0 : k; renderGuide(); });
      var li = el('li', { class: 'c-step' + (st.s[k] ? ' is-done' : '') + (isOpen ? ' is-open' : '') }, [h]);
      if (isOpen) li.appendChild(stepBody(k, st));
      ol.appendChild(li);
    });
    if (S.done[cur.s.id]) {
      var nx = neighbor(cur.s.id, 1);
      var end = el('div', { class: 'c-end' }, [el('p', { text: 'この節はできました。' })]);
      if (nx) {
        var nb = el('button', { type: 'button', class: 'ef-btn ef-btn-primary', text: '次の節へ ▶ ' + nx.s.name });
        nb.addEventListener('click', function () { openSec(nx.s.id); });
        end.appendChild(nb);
      }
      ol.appendChild(el('li', null, [end]));
    }
    $('c-prev').disabled = !neighbor(cur.s.id, -1);
    $('c-next').disabled = !neighbor(cur.s.id, 1);
    $('c-cprev').disabled = $('c-prev').disabled;
    $('c-cnext').disabled = $('c-next').disabled;
    T.ruby($('c-guide'));
  }
  T.onSave.push(function () {
    if (!cur) return;
    var st = stOf(cur.s.id), qs = quizOf(cur.s);
    if (qs.length && !st.s[4] && qs.every(function (q, i) { return st.q[i] != null && +st.q[i] === q.a; })) { st.s[4] = 1; openStep = firstOpen(st); setTimeout(renderGuide, 900); }
  });
  function narrow() { return window.matchMedia && window.matchMedia('(max-width: 860px)').matches; }
  function sheet(up) { $('c-guide').classList.toggle('is-up', up); $('c-sheet-h').setAttribute('aria-expanded', String(up)); T.text($('c-sheet-o'), up ? '▼ とじる' : '▲ ひらく'); }

  // ---- 記録の書き出し(先生の振り返り一覧 teacher-tools/furikaeri-ichiran で読める) ----
  $('c-export').addEventListener('click', function () {
    var safe = function (v) { return String(v || '').replace(/[\\/:*?"<>|\s]/g, ''); };
    var who = [safe(S.who.cls), safe(S.who.no)].filter(Boolean).join('-');
    var d = new Date(), ds = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    var name = '教科書の目次_' + (who ? who + '_' : '') + (safe(S.who.name) ? safe(S.who.name) + '_' : '') + ds + '.json';
    var secs = {};
    ORDER.forEach(function (x) {
      var st = S.st[x.s.id];
      if (!st && !S.done[x.s.id]) return;
      secs[x.s.id] = { ref: x.s.ref, name: x.s.name, done: !!S.done[x.s.id], steps: stepCount(x.s.id), matome: st && st.m || '' };
    });
    var ob = { schema: 'eduit-textbook/1', app: 'T', title: '教科書の目次', version: (window.EDUIT_INFO || {}).version || '', exported: d.toISOString(),
      student: { cls: S.who.cls, no: S.who.no, name: S.who.name }, score: { done: all.filter(function (x) { return S.done[x.s.id]; }).length, total: all.length }, data: { secs: secs } };
    try {
      var blob = new Blob([JSON.stringify(ob, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      T.text($('c-export-msg'), '「' + name + '」を作りました。先生の言う場所に出そう。');
    } catch (e) { T.text($('c-export-msg'), 'ファイルを作れませんでした。先生に聞いてください。'); }
  });

  T.fields();
  paintMode();
  route(true);
  T.ruby(T.root);
})();
</script>
</body>
</html>
