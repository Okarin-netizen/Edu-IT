<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技術分野 教材集(教科書の目次)</title>
<!-- 入り口のページ: 教科書の目次。節を開くと、教材と「この節の進め方」がならぶ。T-textbook/build.py が CSS・JS を中に入れて dist/教科書の順に進む_学習コース.html を作る -->
<style>
/* Edu-IT 共通の見た目(4分野・全アプリ共通)
 * 見た目は案1「教科書の目次」: 白地・黒の細い線・角なし・影なし・絵文字なし。色は分野の色を、記号・開いているタブの下線・ON の下線にだけ使う。
 *
 * このファイルは3つの層の、上の2つ。
 *   ① 設定(トークン) … 色・文字・余白・線・はばの「値」はここにだけ書く。教材の CSS は var(--ef-…) で使う
 *   ② 共通の部品     … ボタン・箱・注意の箱・ラベル・入力欄・表・タブ など。教材はクラス名を付けるだけ
 *   ③ 教材だけの見た目 … 各教材の CSS。図・盤面・シミュレーションの絵だけ。図の色は教材の CSS の上で --fig-… の名前を付ける
 * 部品の見本は shared/ef-mihon.html。決まりに合っているかは python3 shared/style-check.py で調べる。
 *
 * 目次
 *   1. 設定(トークン)と分野の色
 *   2. 文字と中身の基本(.ef-main の中の見出し・文・入力欄)
 *   3. 部品(ボタン・箱・注意・ラベル・えらぶボタン・クイズの答え・表・結果の数字・進み具合・小さな切りかえ)
 *   4. 上のバー・メニュー・アプリのタブ・フッター・ダイアログ
 *   5. 自習ガイド・まず考えよう・振り返りを隠す設定
 *   6. はばに合わせた形(せまい画面・スマホ)と印刷
 */


/* ======================================================================
 * 1. 設定(トークン)と分野の色
 *    色をあとで変えたいときは、ここの1行を変えれば全分野が変わる。
 * ====================================================================== */
:root {
  color-scheme: light;        /* 端末がダークモードでも、明るい画面で出す */

  /* 地・面・線・文字 */
  --ef-bg: #ffffff;           /* 画面の地 */
  --ef-surface: #ffffff;      /* 箱・カード・上のバー */
  --ef-surface-2: #f7f7f5;    /* 一段下げた面(押したとき・表の見出し) */
  --ef-line: #c8c8c8;         /* 細い区切りの線・箱の枠 */
  --ef-ink: #222222;          /* 黒の線(上のバーの下・見出しの下・ボタンの枠)と、黒でぬるボタン */
  --ef-ink-hover: #444444;    /* 黒でぬるボタンにマウスをのせたとき */
  --ef-on-ink: #ffffff;       /* 黒・分野の色でぬった上の字 */
  --ef-text: #222222;         /* ふだんの字 */
  --ef-muted: #565d68;        /* 説明の字 */
  --ef-focus: #f08c00;        /* キーボード操作の枠 */
  --ef-backdrop: rgba(0, 0, 0, .4);  /* ダイアログのうしろ */

  /* 分野の色(既定は D。下の data-ef-domain で切りかわる) */
  --ef-accent: #1a5fc8;
  --ef-accent-ink: #ffffff;
  --ef-accent-soft: #e6eefb;
  /* 発展の印(むらさき) */
  --ef-advanced: #5b3fa8;
  --ef-advanced-soft: #efeaf8;

  /* 状態の色(正解・まちがい・注意・お知らせ)。-soft はうすい地 */
  --ef-ok: #1f7a3a;   --ef-ok-soft: #e3f3e7;
  --ef-ng: #b3261e;   --ef-ng-soft: #fbe5e3;
  --ef-warn: #8a5a00; --ef-warn-soft: #fff4d6;
  --ef-info: #1a5fc8; --ef-info-soft: #eaf1fc;

  /* グラフの線の色(分野をまたいで同じ順に使う) */
  --ef-series-1: #1a5fc8;
  --ef-series-2: #b45309;
  --ef-series-3: #1f7a3a;
  --ef-series-4: #b3261e;
  --ef-series-5: #5b3fa8;

  /* 文字。--ef-fs は「文字 中」のボタンで変わる(EduitFrame.prefs)。見出しなどは em で --ef-fs からの倍にする */
  --ef-font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --ef-mono: "BIZ UDGothic", ui-monospace, "SFMono-Regular", Consolas, monospace;  /* プログラム・数字をそろえる所 */
  --ef-fs: 17px;
  --ef-fs-h1: 1.6em;
  --ef-fs-h2: 1.3em;
  --ef-fs-h3: 1.1em;
  --ef-fs-s: .88em;           /* 小さい字(説明・ラベル) */
  --ef-lh: 1.75;              /* 行の間 */
  --ef-lh-tight: 1.4;         /* 見出し・ボタンの行の間 */

  /* 余白(4・8・12・16・24・32px) */
  --ef-sp-1: 4px;
  --ef-sp-2: 8px;
  --ef-sp-3: 12px;
  --ef-sp-4: 16px;
  --ef-sp-5: 24px;
  --ef-sp-6: 32px;

  /* 線の太さ・角・影 */
  --ef-bw: 1px;               /* ふつうの線 */
  --ef-bw-strong: 2px;        /* 見出しの下・章の区切り */
  --ef-mark: 4px;             /* 開いているタブ・ON のボタンの下線、注意の箱の左の線 */
  --ef-radius: 0;
  --ef-radius-s: 0;
  --ef-shadow: none;

  /* 大きさ・はば */
  --ef-header-h: 52px;
  --ef-tap: 44px;             /* ボタン・入力欄の高さ(指で押しやすい大きさ) */
  --ef-tap-s: 36px;           /* 小さいボタン(.ef-btn.is-s) */
  --ef-tap-bar: 40px;         /* メニューの上のバーのボタン */
  --ef-read-w: 1040px;        /* 読む画面の中身のはば(.ef-main)。作業の画面(.ef-main.is-wide)は画面いっぱい */
}
/* 分野の色: <html data-ef-domain="A"> でページ全体、ほかの要素に付けるとその中だけ(サイトの入り口のカードなど) */
[data-ef-domain="A"] { --ef-accent: #985a26; --ef-accent-soft: #f5e9dc; }  /* 材料と加工: 木の茶 */
[data-ef-domain="B"] { --ef-accent: #2e7d32; --ef-accent-soft: #e4f2e5; }  /* 生物育成: 緑 */
[data-ef-domain="C"] { --ef-accent: #b45309; --ef-accent-soft: #fbeedd; }  /* エネルギー変換: だいだい */
[data-ef-domain="D"] { --ef-accent: #1a5fc8; --ef-accent-soft: #e6eefb; }  /* 情報: 青 */
[data-ef-domain="G"] { --ef-accent: #0f766e; --ef-accent-soft: #e0f2ef; }  /* 技術分野のガイダンス(4分野の前): 青緑 */
[data-ef-domain="T"] { --ef-accent: #475569; --ef-accent-soft: #eef1f5; }  /* 教科書の順に進む学習コース(T-textbook/): 灰青 */
[data-ef-domain="M"] { --ef-accent: #9d174d; --ef-accent-soft: #fbe7ef; }  /* M 身の回りの技術さがし(各編のはじめ): 赤紫 */
[data-ef-domain="F"] { --ef-accent: #4338ca; --ef-accent-soft: #e8e8fb; }  /* F これからの技術ラボ(各編の最後): あい色 */
[data-ef-domain="Z"] { --ef-accent: #7c4a03; --ef-accent-soft: #f6ecdc; }  /* Z 学習を終えて(3年間のまとめ): こげ茶 */
/* くっきり(EduitFrame.prefs の kukkiri): 字と線を濃くする */
:root[data-ef-kukkiri="on"] { --ef-text: #000000; --ef-muted: #222222; --ef-line: #555555; --ef-surface-2: #ffffff; }


/* ======================================================================
 * 2. 文字と中身の基本
 *    教材の中身は <main class="ef-main"> に入れる(読む画面は 1040px まで真ん中、作業の画面は .is-wide で画面いっぱい)。
 *    中の見出し・文・リスト・入力欄は、クラスを付けなくてもこの形になる。
 *    文字の大きさ: EduitFrame.prefs を使うページ(<html data-ef-prefs>)は、<html> の字が --ef-fs になる。
 *    教材の CSS は字の大きさを rem・em で書く(px で書くと「文字 中」のボタンで変わらない)。
 * ====================================================================== */
html[data-ef-prefs] { font-size: var(--ef-fs); }
html[data-ef-prefs][data-ef-ruby="off"] rt { display: none; }  /* ふりがな オフ(EduitFrame.prefs を使うページだけ) */
.ef-page { background: var(--ef-bg); color: var(--ef-text); font-family: var(--ef-font); }
.ef-main {
  box-sizing: border-box; max-width: var(--ef-read-w); margin: 0 auto; padding: var(--ef-sp-5) var(--ef-sp-6) var(--ef-sp-6);
  font-family: var(--ef-font); font-size: 1rem; line-height: var(--ef-lh); color: var(--ef-text);
}
.ef-main.is-wide { max-width: none; padding: var(--ef-sp-3) var(--ef-sp-4) var(--ef-sp-5); }
.ef-main h1, .ef-main h2, .ef-main h3 { margin: 1.4em 0 .5em; line-height: var(--ef-lh-tight); font-weight: 700; color: var(--ef-text); }
.ef-main h1 { font-size: var(--ef-fs-h1); margin-top: .4em; }
.ef-main h2 { font-size: var(--ef-fs-h2); padding-bottom: var(--ef-sp-1); border-bottom: var(--ef-bw-strong) solid var(--ef-ink); }
.ef-main h3 { font-size: var(--ef-fs-h3); }
.ef-main > :first-child { margin-top: 0; }
.ef-main p { margin: .5em 0; }
.ef-main ul, .ef-main ol { margin: .5em 0; padding-left: 1.5em; }
.ef-main li { margin: .2em 0; }
.ef-main small, .ef-small { font-size: var(--ef-fs-s); color: var(--ef-muted); }
.ef-main code, .ef-main kbd { font-family: var(--ef-mono); font-size: .95em; }
/* 入力欄: 灰の細い枠・高さ 44px。押している(フォーカス)ときは分野の色の枠 */
.ef-main :is(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]), select, textarea) {
  box-sizing: border-box; min-height: var(--ef-tap); padding: var(--ef-sp-2) var(--ef-sp-3);
  border: var(--ef-bw) solid var(--ef-ink); border-radius: 0; background: var(--ef-surface); color: var(--ef-text);
  font: inherit; line-height: var(--ef-lh-tight);
}
.ef-main textarea { width: 100%; line-height: var(--ef-lh); }
.ef-main :is(input, select, textarea):focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 1px; }
.ef-main :is(input[type=checkbox], input[type=radio], input[type=range]) { accent-color: var(--ef-accent); }
.ef-main label { line-height: var(--ef-lh-tight); }


/* ======================================================================
 * 3. 部品
 *    名前は ef- で始め、形のちがいは is-〜 で表す。書き方の見本は shared/ef-mihon.html。
 * ====================================================================== */

/* ---- ボタン ----
 * .ef-btn           ふつうのボタン(白地・黒の細い枠・角なし)
 * .ef-btn.is-s      小さいボタン(高さ 36px。.ef-btn-primary.is-s も同じ)
 * .ef-btn.is-on     ON の状態(下に分野の色の線)。aria-pressed="true" でも同じ
 * .ef-btn.is-danger 消す・取り消す(赤の字と枠)
 * .ef-btn-primary   いちばん大事な操作(はじめる・ひらく など。黒でぬる)
 */
.ef-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--ef-tap-bar); padding: 0 14px;
  border: var(--ef-bw) solid var(--ef-ink); border-radius: 0;
  background: var(--ef-surface); color: var(--ef-text);
  font: 600 15px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
  box-sizing: border-box; white-space: nowrap;
}
.ef-btn:hover { background: var(--ef-surface-2); }
/* ON は下に分野の色の太い線(ぬりつぶさない) */
.ef-btn.is-on, .ef-btn[aria-pressed="true"] { box-shadow: inset 0 calc(-1 * var(--ef-mark)) 0 var(--ef-accent); }
.ef-btn:disabled, .ef-btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; background: var(--ef-surface); }
.ef-btn.is-danger { color: var(--ef-ng); border-color: var(--ef-ng); }
.ef-btn.is-danger:hover { background: var(--ef-ng-soft); }
/* 中身の中のボタン(上のバーより大きく、字の大きさに合わせて大きくなる) */
.ef-main .ef-btn, .ef-box .ef-btn { min-height: var(--ef-tap); font-size: .94rem; }
.ef-btn.is-s, .ef-btn-primary.is-s, .ef-main .ef-btn.is-s, .ef-main .ef-btn-primary.is-s { min-height: var(--ef-tap-s); padding: 0 10px; font-size: var(--ef-fs-s); }
.ef-back { color: var(--ef-text); border-color: transparent; background: none; }
.ef-back:hover { background: none; text-decoration: underline; }
/* 上のバーの表示の道具(4分野で同じ形)。ふりがな・くっきりは .ef-toggle(ON で ✓)、文字の大きさは .ef-size(EduitFrame.sizeButton) */
.ef-toggle[aria-pressed="true"]::before { content: "✓"; }
.ef-size .ef-size-v {
  display: inline-block; min-width: 1.4em; padding: 0 .1em;
  color: var(--ef-text); font-weight: 700; text-align: center; text-decoration: underline; text-underline-offset: 3px;
}
/* 「ふつう・大きい」の2段だけのとき: <button class="ef-btn ef-size" aria-pressed="false|true">文字 <span class="ef-size-v"></span></button>
 * (中身が空の .ef-size-v に「中」「大」を出す。ON でもボタンは塗らない) */
.ef-size[aria-pressed="true"] { background: var(--ef-surface); box-shadow: none; color: var(--ef-text); }
.ef-size[aria-pressed]::before { content: none; }
.ef-size[aria-pressed] .ef-size-v:empty::after { content: "中"; }
.ef-size[aria-pressed="true"] .ef-size-v:empty::after { content: "大"; }
/* タブの帯をスクロールで隠す(data-ef-autohide。隠すのは eduit-frame.js) */
[data-ef-autohide] { transition: transform .2s ease; }
[data-ef-autohide].ef-ah-hide { transform: translateY(var(--ef-ah-y, -110%)); }
@media (prefers-reduced-motion: reduce) { [data-ef-autohide] { transition: none; } }
.ef-btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--ef-tap); padding: 0 20px;
  border: var(--ef-bw) solid var(--ef-ink); border-radius: 0;
  background: var(--ef-ink); color: var(--ef-on-ink);
  font: 700 16px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
}
.ef-btn-primary:hover { background: var(--ef-ink-hover); }
.ef-btn-primary:disabled { opacity: .45; cursor: not-allowed; background: var(--ef-ink); }
.ef-main .ef-btn-primary, .ef-box .ef-btn-primary { font-size: 1rem; }
.ef-btn:focus-visible, .ef-btn-primary:focus-visible, .ef-about-link:focus-visible, .ef-dialog :focus-visible {
  outline: 3px solid var(--ef-focus); outline-offset: 2px;
}
/* ボタンをならべる行 */
.ef-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ef-sp-2); margin: var(--ef-sp-3) 0; }

/* ---- 箱 ----
 * <section class="ef-box"> <h3 class="ef-box-h">見出し</h3> … </section>
 * 白地・灰の細い線・影なし。.is-soft は一段下げた面(灰の地)、.is-accent は左に分野の色の線
 */
.ef-box {
  box-sizing: border-box; margin: var(--ef-sp-4) 0; padding: var(--ef-sp-4);
  background: var(--ef-surface); border: var(--ef-bw) solid var(--ef-line); border-radius: 0; box-shadow: none;
}
.ef-box.is-soft { background: var(--ef-surface-2); }
.ef-box.is-accent { border-left: var(--ef-mark) solid var(--ef-accent); }
.ef-box > :first-child { margin-top: 0; }
.ef-box > :last-child { margin-bottom: 0; }
.ef-box-h, .ef-main .ef-box-h {
  margin: 0 0 var(--ef-sp-2); padding: 0; border: 0;
  font-size: var(--ef-fs-h3); font-weight: 700; line-height: var(--ef-lh-tight); color: var(--ef-text);
}

/* ---- 注意・お知らせの箱 ----
 * <div class="ef-note is-warn">…</div>  左に 4px の線と、うすい地。
 * .is-warn 注意(黄)・.is-info お知らせ(青)・.is-ok よい(緑)・.is-ng 危ない(赤)。なしは分野の色の線と白地
 */
.ef-note {
  box-sizing: border-box; margin: var(--ef-sp-3) 0; padding: var(--ef-sp-2) var(--ef-sp-3);
  border: 0; border-left: var(--ef-mark) solid var(--ef-accent); border-radius: 0; background: var(--ef-surface);
  line-height: var(--ef-lh); color: var(--ef-text);
}
.ef-note > :first-child { margin-top: 0; }
.ef-note > :last-child { margin-bottom: 0; }
.ef-note.is-warn { border-left-color: var(--ef-warn); background: var(--ef-warn-soft); }
.ef-note.is-info { border-left-color: var(--ef-info); background: var(--ef-info-soft); }
.ef-note.is-ok { border-left-color: var(--ef-ok); background: var(--ef-ok-soft); }
.ef-note.is-ng { border-left-color: var(--ef-ng); background: var(--ef-ng-soft); }
.ef-note-k { display: block; font-weight: 700; }  /* 「注意」「ポイント」などの見出しの字 */
.ef-note.is-warn .ef-note-k { color: var(--ef-warn); }
.ef-note.is-info .ef-note-k { color: var(--ef-info); }
.ef-note.is-ok .ef-note-k { color: var(--ef-ok); }
.ef-note.is-ng .ef-note-k { color: var(--ef-ng); }

/* ---- 小さなラベル ----
 * <span class="ef-tag">切断</span>  白地に細い枠。.is-advanced 発展(むらさき)・.is-accent 分野の色・.is-ok / .is-ng / .is-warn
 */
.ef-tag {
  display: inline-flex; align-items: center; gap: .3em; padding: 0 .5em; vertical-align: .08em;
  border: var(--ef-bw) solid var(--ef-line); border-radius: 0; background: var(--ef-surface); color: var(--ef-text);
  font-size: var(--ef-fs-s); font-weight: 700; line-height: 1.6; white-space: nowrap;
}
.ef-tag.is-accent { border-color: var(--ef-accent); color: var(--ef-accent); }
.ef-tag.is-advanced { border-color: var(--ef-advanced); color: var(--ef-advanced); }
.ef-tag.is-ok { border-color: var(--ef-ok); color: var(--ef-ok); }
.ef-tag.is-ng { border-color: var(--ef-ng); color: var(--ef-ng); }
.ef-tag.is-warn { border-color: var(--ef-warn); color: var(--ef-warn); }

/* ---- 1つえらぶボタンの組 ----
 * <div class="ef-seg" role="group"> <button aria-pressed="true">回転</button> <button aria-pressed="false">往復</button> … </div>
 * えらんだもの(aria-pressed="true" か .is-on)は太字と分野の色の下線
 */
.ef-seg { display: inline-flex; flex-wrap: wrap; gap: 0; border: var(--ef-bw) solid var(--ef-ink); background: var(--ef-surface); }
.ef-seg > button {
  min-height: var(--ef-tap); padding: 0 14px; margin: 0; cursor: pointer;
  border: 0; border-right: var(--ef-bw) solid var(--ef-line); border-radius: 0; background: none; color: var(--ef-text);
  font: inherit; font-size: .94rem; line-height: var(--ef-lh-tight); white-space: nowrap;
}
.ef-seg > button:last-child { border-right: 0; }
.ef-seg > button:hover { background: var(--ef-surface-2); }
.ef-seg > button[aria-pressed="true"], .ef-seg > button.is-on { font-weight: 700; box-shadow: inset 0 calc(-1 * var(--ef-mark)) 0 var(--ef-accent); }
.ef-seg > button:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: -3px; }

/* ---- クイズの答え ----
 * <div class="ef-choices"> <button class="ef-choice">…</button> … </div>
 * 答えたあと、正解は .is-ok(○ と緑)、まちがいは .is-ng(× と赤)。色だけでなく ○ × の字も出す
 */
.ef-choices { display: flex; flex-direction: column; gap: var(--ef-sp-2); margin: var(--ef-sp-2) 0; }
.ef-choice {
  display: block; width: 100%; min-height: var(--ef-tap); padding: var(--ef-sp-2) var(--ef-sp-3); cursor: pointer; text-align: left;
  border: var(--ef-bw) solid var(--ef-line); border-radius: 0; background: var(--ef-surface); color: var(--ef-text);
  font: inherit; line-height: var(--ef-lh-tight);
}
.ef-choice:hover { border-color: var(--ef-ink); }
.ef-choice:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 1px; }
.ef-choice.is-ok { border-color: var(--ef-ok); background: var(--ef-ok-soft); font-weight: 700; }
.ef-choice.is-ok::before { content: "○ "; color: var(--ef-ok); }
.ef-choice.is-ng { border-color: var(--ef-ng); background: var(--ef-ng-soft); }
.ef-choice.is-ng::before { content: "× "; color: var(--ef-ng); }

/* ---- 表 ----
 * <table class="ef-table"> 見出しの行は灰の地、線は細い灰。はばが足りないときは <div class="ef-scroll"> で包むと、表だけ横にスクロールする
 */
.ef-table { border-collapse: collapse; margin: var(--ef-sp-3) 0; font-size: .94em; line-height: var(--ef-lh-tight); }
.ef-table th, .ef-table td { padding: var(--ef-sp-2) var(--ef-sp-3); border: var(--ef-bw) solid var(--ef-line); text-align: left; vertical-align: top; }
.ef-table th { background: var(--ef-surface-2); font-weight: 700; }
.ef-table .is-num { text-align: right; font-variant-numeric: tabular-nums; }
.ef-scroll { max-width: 100%; overflow-x: auto; }

/* ---- 結果の数字 ----
 * <div class="ef-result"> <span class="ef-result-k">たわみ</span> <span class="ef-result-v">1.05</span> <span class="ef-result-u">mm</span> </div>
 */
.ef-result { display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: .1em .4em; }
.ef-result-k { font-size: var(--ef-fs-s); font-weight: 700; color: var(--ef-muted); }
.ef-result-v { font-size: 1.6em; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--ef-text); }
.ef-result-u { font-size: .94em; color: var(--ef-muted); }
.ef-result.is-ok .ef-result-v { color: var(--ef-ok); }
.ef-result.is-ng .ef-result-v { color: var(--ef-ng); }

/* ---- 進み具合のバー ----
 * <div class="ef-progress"> <span class="ef-progress-t">必修 2/4</span> <span class="ef-progress-bar"><span style="width: 50%"></span></span> </div>
 */
.ef-progress { display: flex; align-items: center; gap: var(--ef-sp-2); font-size: var(--ef-fs-s); font-weight: 700; }
.ef-progress-bar { flex: 1; min-width: 4em; height: 8px; border: var(--ef-bw) solid var(--ef-ink); background: var(--ef-surface); }
.ef-progress-bar > span { display: block; height: 100%; background: var(--ef-accent); }

/* ---- タブの中の小さな切りかえ ----
 * <div class="ef-subtabs" role="tablist"> <button role="tab" aria-selected="true">…</button> … </div>
 * アプリのタブ(.ef-apptabs)と同じ「字＋下線」で、ひとまわり小さい
 */
.ef-subtabs { display: flex; flex-wrap: wrap; gap: 0 var(--ef-sp-4); margin: var(--ef-sp-2) 0 var(--ef-sp-3); border-bottom: var(--ef-bw) solid var(--ef-line); }
.ef-subtabs > button, .ef-subtabs > a {
  min-height: var(--ef-tap-s); padding: 0 var(--ef-sp-1); margin: 0 0 -1px; cursor: pointer;
  border: 0; border-bottom: var(--ef-mark) solid transparent; border-radius: 0; background: none; color: var(--ef-muted);
  font: inherit; font-size: .94em; font-weight: 700; text-decoration: none; white-space: nowrap;
}
.ef-subtabs > :hover { color: var(--ef-text); }
.ef-subtabs > [aria-selected="true"], .ef-subtabs > [aria-current], .ef-subtabs > .is-on { color: var(--ef-text); border-bottom-color: var(--ef-accent); }
.ef-subtabs > :focus-visible { outline: 3px solid var(--ef-focus); outline-offset: -3px; }

/* ---- 記号の印(A1・B2・C3・D4 など。メニューの上のバー・アプリの上のバー・切りかえボタン・カード) ---- */
.ef-code {
  display: inline-flex; align-items: center; justify-content: flex-start; min-width: 1.6em; padding: 0;
  background: none; color: var(--ef-accent);
  font: 700 1em/1.5 var(--ef-font); letter-spacing: .02em; white-space: nowrap; vertical-align: .05em;
}
.ef-btn .ef-code { font-size: 13px; min-width: 0; margin-right: 2px; }


/* ======================================================================
 * 4. 上のバー・メニュー・アプリのタブ・フッター・ダイアログ
 *    上のバー(ヘッダー)の字とボタンは、文字の大きさのボタンで変えない(px のまま)。
 * ====================================================================== */

/* ---- ヘッダー ----
 * メニュー:   <header class="ef-header"> <h1 class="ef-title"><span class="ef-code">A</span> 材料と加工の技術 教材集</h1>
 *               <div class="ef-tools"> ふりがな / 文字 中 / 使い方 / 先生用 </div> </header>   (4分野でこの4つだけ・字だけ)
 * アプリ:     下の .ef-appbar
 */
.ef-header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  min-height: var(--ef-header-h); padding: 6px 14px;
  background: var(--ef-surface); color: var(--ef-text);
  border-bottom: var(--ef-bw) solid var(--ef-ink);
  font-family: var(--ef-font);
  box-sizing: border-box;
}
.ef-title {
  display: flex; align-items: center; gap: 8px;
  margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--ef-text);
}
.ef-title .ef-icon { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; font-size: 22px; }
.ef-title .ef-sub { font-size: 13px; font-weight: 400; color: var(--ef-muted); }
.ef-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.ef-title .ef-code { font-size: 22px; min-width: 0; margin-right: 4px; }

/* ---- メニューのカード ----
 * <article class="ef-card"> <p class="ef-card-tag">A1</p> <h3 class="ef-card-title">…</h3> <p>…</p> <a class="ef-btn-primary">ひらく ▶</a> </article>
 * メニューのカードは EduitFrame.card() で作る(下の .ef-mcard)。
 */
.ef-card {
  background: var(--ef-surface); border: 0; border-top: var(--ef-bw-strong) solid var(--ef-ink); padding: 14px 4px;
}
.ef-card-tag { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ef-accent); }
.ef-card-title { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: var(--ef-text); }

/* EduitFrame.card が作るメニューのカード(4分野同じ形)
 * 教科書の目次のように1行ずつ: 左に記号、まん中に名前と説明、右に「ひらく ▶」。行の上下は細い線 */
.ef-mcard {
  display: grid; grid-template-columns: 4.2em minmax(0, 1fr) auto; column-gap: 16px; row-gap: 2px; align-items: baseline;
  padding: 14px 4px; border: 0; border-bottom: var(--ef-bw) solid var(--ef-line); border-radius: 0; box-shadow: none;
  cursor: pointer; font-family: var(--ef-font); color: var(--ef-text);
}
.ef-mcard:hover { background: var(--ef-surface-2); }
.ef-mcard-hd, .ef-mcard-ht { display: contents; }
.ef-mcard-ic { display: none; }
.ef-mcard > *, .ef-mcard-ht > * { grid-column: 2; }
.ef-mcard .ef-card-tag { grid-column: 1; grid-row: 1 / span 3; margin: 0; font-size: 1.35em; line-height: 1.2; }
.ef-mcard .ef-card-tag .ef-code { font-size: 1em; }
.ef-mcard .ef-card-title { margin: 0; font-size: 1.12em; line-height: 1.4; }
.ef-mcard-desc { margin: 0; font-size: .95em; line-height: 1.6; color: var(--ef-muted); }
.ef-mcard-extra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .88em; color: var(--ef-muted); }
.ef-mcard-go {
  grid-column: 3; grid-row: 1; align-self: baseline; min-height: 0; padding: 0; border: 0; background: none;
  color: var(--ef-accent); font-size: 15px; white-space: nowrap;
}
.ef-mcard-go:hover { background: none; text-decoration: underline; }

/* ---- フッター(作成者・このアプリについて) ---- */
.ef-footer {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 14px;
  margin: 24px 0 0; padding: 12px 16px;
  border-top: var(--ef-bw) solid var(--ef-line); background: var(--ef-surface-2);
  font: 13px/1.6 var(--ef-font); color: var(--ef-muted);
}
.ef-footer .ef-author { font-weight: 700; color: var(--ef-text); }
.ef-about-link {
  border: 0; background: none; padding: 2px 4px; cursor: pointer;
  font: inherit; color: var(--ef-accent); text-decoration: underline;
}
/* ヘッダーなどに置く小さい「このアプリについて」ボタン */
.ef-about-btn { font-size: 14px; }

/* ---- このアプリについて(ダイアログ) ---- */
.ef-dialog {
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  padding: 0; border: var(--ef-bw) solid var(--ef-ink); border-radius: var(--ef-radius);
  background: var(--ef-surface); color: var(--ef-text); font: 15px/1.7 var(--ef-font);
  box-shadow: none;
}
.ef-dialog::backdrop { background: var(--ef-backdrop); }
.ef-dialog-in { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.ef-dialog-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: var(--ef-bw) solid var(--ef-ink); }
.ef-dialog-head h2 { margin: 0; font-size: 18px; flex: 1; }
.ef-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px 0; }
.ef-tab { border: 0; border-bottom: 3px solid transparent; background: none;
  padding: 6px 10px; font: 600 14px/1.3 var(--ef-font); color: var(--ef-muted); cursor: pointer; min-height: 36px; }
.ef-tab[aria-selected="true"] { color: var(--ef-text); border-bottom-color: var(--ef-accent); }
.ef-panel { padding: 14px 18px 18px; overflow: auto; border-top: var(--ef-bw) solid var(--ef-line); }
.ef-panel h3 { margin: 12px 0 4px; font-size: 16px; }
.ef-panel ul { margin: 4px 0 8px; padding-left: 1.3em; }
.ef-panel p { margin: 4px 0 8px; }
.ef-howto .ef-panel { border-top: 0; }
.ef-howto .ef-panel ol { margin: 4px 0 8px; padding-left: 1.5em; }
.ef-howto .ef-panel li { margin: 2px 0; }
.ef-hist-ver { font-weight: 700; color: var(--ef-accent); }
.ef-hist-date { color: var(--ef-muted); font-size: 13px; margin-left: 6px; }

/* ---- 基本編・発展編のタブ(メニュー。EduitFrame.levels が作る) ---- */
.ef-levels { margin: 0 0 18px; font-family: var(--ef-font); }
.ef-level-tabs { display: flex; gap: 24px; border-bottom: var(--ef-bw) solid var(--ef-line); }
.ef-level-tab {
  display: inline-flex; align-items: baseline; gap: 4px; min-height: 48px; padding: 8px 0; margin: 0 0 -1px;
  font: inherit; font-size: 1.15em; font-weight: 700 !important; color: var(--ef-muted) !important; cursor: pointer;
  background: none !important; border: 0 !important; border-bottom: 3px solid transparent !important; border-radius: 0 !important;
}
.ef-level-tab:hover { color: var(--ef-text) !important; }
/* 教材ごとのボタンの色指定(#hub button など)に負けないように !important にする */
.ef-level-tab[aria-selected="true"], .ef-level-tab[aria-selected="true"]:hover { color: var(--ef-text) !important; border-bottom-color: var(--ef-accent) !important; }
.ef-level-tab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }
.ef-level-count { font-size: .85em; font-weight: 700; }
.ef-level-count::before { content: "("; }
.ef-level-count::after { content: ")"; }
.ef-level-panel { padding: 12px 0 0; }
.ef-level-panel:focus { outline: none; }
.ef-level-lead { margin: 0 0 12px; color: var(--ef-muted); line-height: 1.6; }
.ef-level-advanced[aria-selected="true"], .ef-level-advanced[aria-selected="true"]:hover { border-bottom-color: var(--ef-advanced) !important; }
.ef-level-parts { margin: .3em 0 0; font-size: .9em; line-height: 1.5; color: var(--ef-text); }
.ef-level-parts summary { cursor: pointer; color: var(--ef-muted); }
.ef-level-parts p { margin: .2em 0 0; }
.ef-mcard-tb { margin: .3em 0 0; font-size: .85em; line-height: 1.5; color: var(--ef-muted); }
.ef-level-group { display: flex; align-items: baseline; gap: .7em; margin: 24px 0 0; padding: 0 0 6px; border-bottom: var(--ef-bw-strong) solid var(--ef-ink); font-size: 1.1em; color: var(--ef-text); }
.ef-level-group:first-of-type { margin-top: 4px; }
.ef-level-group-ch { flex: none; white-space: nowrap; font-size: .8em; font-weight: 700; color: var(--ef-accent); }
/* 区切りのはじめ・おわりの M・F へのリンクの行(EDUIT_INFO.textbook.links) */
.ef-level-link { margin: 6px 0 12px; line-height: 1.6; }
.ef-level-link a { display: inline-flex; align-items: center; gap: 8px; padding: 4px 0; color: var(--ef-text); text-decoration: none; font-weight: 600; }
.ef-level-link a:hover, .ef-level-link a:focus-visible { text-decoration: underline; }
.ef-level-link-go { color: var(--ef-accent); font-weight: 700; }
.ef-level-matome { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 14px; border: var(--ef-bw) solid var(--ef-ink); border-radius: 0; background: var(--ef-surface); color: var(--ef-text); font: inherit; cursor: pointer; text-align: left; }
.ef-level-matome:hover, .ef-level-matome:focus-visible { background: var(--ef-surface-2); }
.ef-level-matome-t { font-weight: 700; }
.ef-level-matome-d { color: var(--ef-muted); font-size: .92em; }
.ef-matome-score { font-weight: 700; }
.ef-matome-h { display: flex; align-items: center; gap: 6px; margin: 16px 0 4px; font-size: 1.05em; }
.ef-level-parts-k {
  display: inline-block; margin-right: .6em; padding: 0; font-size: .9em; font-weight: 700; color: var(--ef-text);
}

/* ---- メニューの中身の箱と、カードの並べ方(4分野共通) ----
 * メニューの中身(タブ・カード)を入れる箱は .ef-menu(はば 1040px まで・真ん中)。カードは EduitFrame.levels({ gridClass: 'ef-mgrid' }) で1列にならべる。 */
.ef-menu { max-width: var(--ef-read-w); margin: 0 auto; padding: 6px 32px 0; box-sizing: border-box; }
.ef-mgrid { display: flex; flex-direction: column; padding: 0 0 24px; }
.ef-mgrid > .ef-mcard { touch-action: manipulation; }
.ef-mgrid { border-top: var(--ef-bw) solid var(--ef-line); }
.ef-level-group + .ef-mgrid { border-top: 0; }
.ef-mgrid .ef-mcard-desc { line-height: 1.5; }

/* ---- アプリを開いたときの上のバー・教材の切りかえ・タブの帯(4分野共通) ----
 * <header class="ef-header ef-appbar">
 *   <a class="ef-btn ef-back">◀ メニュー</a>
 *   <h1 class="ef-title ef-apptitle">[A2] 木材の繊維・収縮ラボ</h1>   … はばが広いとき(1441px 以上)とスマホだけ出す
 *   <nav class="ef-switch"> <a class="ef-swchip" aria-current="page"><span class="ef-code">A2</span><span class="ef-sw-n">木材</span></a> … </nav>
 *   <div class="ef-tools"> ふりがな / 文字 中 / (くっきり) / (使い方) / <span data-ef-fs></span> 全画面 / <span data-ef-about></span> ⓘ </div>
 * </header>
 * <nav class="ef-apptabs"> <button class="ef-apptab" aria-selected="true">はじめに</button> … <div class="ef-apptabs-tools">使い方 記録</div> </nav>
 *   … アプリの中のタブ(字＋下線)。右はしにそのアプリの道具(使い方・記録など)を置くときは .ef-apptabs-tools に入れる
 * 開いている教材は名前も出し、ほかの教材は記号だけ(はばが 1441px 以上なら名前も)。スマホは1行目に ◀ メニューと名前、2行目に道具と切りかえ。
 */
.ef-appbar { min-height: 52px; padding: 0 6px; gap: 6px; flex-wrap: nowrap; }
.ef-appbar .ef-btn { min-height: 42px; padding: 0 12px; font-size: 15px; white-space: nowrap; flex: none; }
.ef-appbar .ef-tools { flex: none; flex-wrap: nowrap; }
.ef-appbar .ef-apptitle { margin: 0 6px 0 4px; font-size: 17px; white-space: nowrap; flex: none; }
.ef-appbar .ef-apptitle .ef-code { margin-right: 0; }
.ef-switch { display: flex; gap: 4px; flex: 1; min-width: 0; align-self: stretch; align-items: flex-end; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.ef-switch::-webkit-scrollbar { display: none; }
.ef-swchip {
  font: inherit; font-family: var(--ef-font); font-size: 15px; line-height: 1.2; color: var(--ef-muted); text-decoration: none;
  background: transparent; border: 0; border-bottom: var(--ef-mark) solid transparent; border-radius: 0;
  min-height: 44px; padding: 0 10px; margin-bottom: 1px; cursor: pointer; white-space: nowrap; flex: none;
  display: inline-flex; align-items: center; gap: 5px; touch-action: manipulation;
}
.ef-swchip:hover { color: var(--ef-text); border-bottom-color: var(--ef-line); }
.ef-swchip[aria-current="page"], .ef-swchip[aria-current="true"] { color: var(--ef-text); font-weight: 700; border-bottom-color: var(--ef-accent); }
.ef-swchip .ef-code { font-size: 13px; min-width: 0; margin: 0; }
.ef-swchip:focus-visible, .ef-apptab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: -3px; }
.ef-fs-btn[hidden] { display: none; }
.ef-apptabs {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 18px; padding: 0 14px;
  background: var(--ef-surface); border-bottom: var(--ef-bw) solid var(--ef-ink); font-family: var(--ef-font); box-sizing: border-box;
}
.ef-apptab {
  font: inherit; font-family: var(--ef-font); font-size: 15px; font-weight: 700; line-height: 1.3; text-decoration: none;
  flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; box-sizing: border-box;
  border: 0; border-bottom: var(--ef-mark) solid transparent; border-radius: 0; background: none; cursor: pointer; white-space: nowrap; touch-action: manipulation;
  color: var(--ef-muted);
}
.ef-apptab:hover { color: var(--ef-text); border-bottom-color: var(--ef-line); }
.ef-apptab[aria-selected="true"], .ef-apptab[aria-current="page"], .ef-apptab[aria-current="true"], .ef-apptab.is-on {
  color: var(--ef-text); border-bottom-color: var(--ef-accent);
}
.ef-apptab[aria-selected="true"] rt, .ef-apptab[aria-current] rt, .ef-apptab.is-on rt { color: inherit; }
.ef-apptab.is-advanced { color: var(--ef-advanced); }  /* 発展のタブ(字だけむらさき。開いたときの下線は分野の色) */
.ef-apptab.is-done::after { content: " ✓"; }        /* 書き終えたページ */
/* タブの帯の右はしの道具(使い方・記録・音 など) */
.ef-apptabs-tools { display: flex; align-items: center; gap: 6px; margin-left: auto; padding: 4px 0; }


/* ======================================================================
 * 5. 学習のまとめの問題・まず考えよう・振り返りを隠す設定
 * ====================================================================== */

/* 振り返りを隠す設定(EduitFrame.furikaeri)。振り返りのタブ・欄・印には data-ef-reflect を付ける */
html[data-ef-furikaeri="off"] [data-ef-reflect] { display: none !important; }

/* ---- 学習のまとめのたしかめ問題(EduitFrame が作る) ---- */
.ef-jishu-qs { list-style: none; margin: 0; padding: 0; }
.ef-jishu-q { margin: 0 0 12px; padding: 10px 12px; border: var(--ef-bw) solid var(--ef-line); border-radius: var(--ef-radius-s); }
.ef-jishu-qt { font-weight: 700; }
.ef-jishu-choices { display: flex; flex-direction: column; gap: 6px; }
.ef-jishu-choice {
  min-height: 38px; padding: 6px 10px; text-align: left; cursor: pointer;
  font: 14px/1.5 var(--ef-font); color: var(--ef-text); background: var(--ef-surface); border: var(--ef-bw) solid var(--ef-line); border-radius: var(--ef-radius-s);
}
.ef-jishu-choice:hover { border-color: var(--ef-accent); }
.ef-jishu-choice:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 1px; }
.ef-jishu-choice.is-ok { background: var(--ef-ok-soft); border-color: var(--ef-ok); font-weight: 700; }
.ef-jishu-choice.is-ok::before { content: "○ "; color: var(--ef-ok); }
.ef-jishu-choice.is-ng { background: var(--ef-ng-soft); border-color: var(--ef-ng); }
.ef-jishu-choice.is-ng::before { content: "× "; color: var(--ef-ng); }
.ef-jishu-res { margin: 6px 0 0; font-size: 14px; }
.ef-jishu-res.is-ok strong { color: var(--ef-ok); }
.ef-jishu-res.is-ng strong { color: var(--ef-ng); }

/* ---- まず考えよう(各節の導入の問い。shared/eduit-frame.js の LETS) ---- */
.ef-lets { margin: 0 0 12px; padding: 8px 16px 8px 14px; background: none; border-left: var(--ef-mark) solid var(--ef-accent); border-radius: 0; color: inherit; line-height: 1.6; font-size: 1.05em; }
.ef-lets-k { margin: 0; font-size: .85em; font-weight: bold; color: var(--ef-accent); letter-spacing: .05em; }
.ef-lets-q { margin: 2px 0 0; font-weight: bold; font-size: 1.1em; }
.ef-lets .ef-lets-hint { margin: 4px 0 0; padding: 0; background: none; border: 0; border-radius: 0; box-shadow: none; }
/* 教材ごとの details・summary の見た目(白い箱など)を受けつがない */
.ef-lets .ef-lets-hint > summary { display: list-item; min-height: 0; padding: 0; margin: 0; background: none; border: 0; cursor: pointer; color: var(--ef-accent); font-size: .9em; font-weight: normal; width: max-content; }
.ef-lets-hint p { margin: 4px 0 0; }


/* ======================================================================

        { q: '家のパソコンと家のルータの間の1本の線が切れると、どうなる？', choices: ['ほかのルータを通って届く', 'DNSサーバが代わりに届ける', 'ほかに道がないので届かなくなる'], answer: 2, explain: '道が1本しかないところが切れると、回り道がありません。大事なところは、道を2本以上にしておきます。', sec: 'd14' },
        { q: 'HTTPSで送ったとき、のぞき見している人に見えてしまうものはどれ？', choices: ['送り先のIPアドレスやデータの量', '入力したパスワード', 'Webページの文章'], answer: 0, explain: 'HTTPSでは、中身が暗号化されるので読めません。でも、送り先やデータの量は見えることがあります。', sec: 'd14' }
      ]
    },
    D4: {
      goal: '情報を守る3つの見方と、守るしくみ(対策ソフト・パスワード・暗号化など)を説明できる。ネットでの危険への対策や情報モラルも、理由とあわせて説明できる。',
      time: '3時間ほど',
      steps: [
        { where: '理解度チェック', do: 'はじめに「事前テスト」を受けて、いまの力を確かめよう。', hint: '答えと解説は、事後テストが終わると見られます。わからない問題があっても大丈夫です。', go: '#/check', sec: 'd15' },
        { where: '① 情報を守るしくみ', do: '守る3つの見方(もれない・こわれない・使える)を読んで、場面の問題に答えよう。守る道具を選ぶ問題にも答えよう。', hint: '対策ソフト・ファイアウォール・フィルタリング・多要素認証が出てきます。', go: '#/protect', sec: 'd15' },
        { where: '② パスワード強度ラボ', do: '練習用の文字を入れよう。長さと文字の種類で、解読時間がどう変わるかくらべよう。', hint: '本物のパスワードは入れないこと。1文字ずつ長くしたときと、記号を足したときの時間を見くらべよう。', go: '#/password', sec: 'd15' },
        { where: '③ 暗号ラボ', do: 'シーザー暗号で暗号文を作ろう。総当たりと頻度分析で破ってみよう。', hint: '鍵(ずらす数)の候補は25通りしかないので、全部ためせます。ローマ字の日本語では、A・I・O・U がよく出ます。これを手がかりにしよう。', go: '#/crypto', sec: 'd15' },
        { where: '④ フィッシング見分け', do: '怪しいと思うところを押して、「答え合わせ」を押そう。すべての場面に挑戦しよう。', hint: '差出人のアドレス、リンク先のアドレス、急がせる言葉を見てみよう。', go: '#/phishing', sec: 'd15' },
        { where: '⑤ SNS投稿の個人情報チェック', do: '写真と文章から、場所や学校がわかる手がかりを探そう。⑥ デジタルタトゥーで、投稿が広がるようすも見よう。', hint: '駅の看板、電柱の住所表示、制服の校章、影の長さを見てみよう。⑥は「▶ 時間を進める」を押そう。見た人が8人以上になってから、消してみよう。', go: '#/sns', sec: 'd16' },
        { where: '⑦ 著作権・利用ルールクイズ', do: '場面ごとに、使ってよいか考えて答えよう。⑧ 判断ロールプレイで、自分ならどうするかも選ぼう。', hint: 'ロールプレイは、正解を当てなくてかまいません。ちがう道も選んで、結末をくらべてみよう。', go: '#/copyright', sec: 'd16' },
        { where: '⑨ まとめ・行動宣言', do: '今日から実行する対策を3つ選んで、「この3つで宣言する」を押そう。そのあと、理解度チェックの「事後テスト」を受けよう。', hint: '事後テストでまちがえた問題は、「復習」で確かめよう。体験したステップにもどれます。', go: '#/declare', sec: 'd16' },
        { where: 'ふりかえり', do: '①〜⑨の各ページのいちばん下に「ふりかえり」があります。なぜその対策で安全になるのか、書こう。', hint: '理由を入れて書こう。「〜だから、〜すると安全になる」の形です。', reflect: true },
        { where: 'ふりかえり・記録', do: 'クラス(組)と出席番号を入れて、「JSONで書き出す」を押そう。できたファイルを、先生の言う場所に出そう。', hint: 'テストの点も、ファイルに入ります。パスワード強度ラボで入れた文字は入りません。', go: '#/records' }
      ],
      check: [
        { q: 'ネットワークの外からのあやしい通信を止めるしくみは？', choices: ['ファイアウォール', 'フィルタリング', 'パスフレーズ'], answer: 0, explain: '通してよい通信だけを通す「防火かべ」です。', sec: 'd15' },
        { q: 'パスフレーズ(単語をいくつかランダムに選んでつなげたパスワード)のよいところはどれ？', choices: ['短いので、すぐに入力できる', '長いのに覚えやすく、総当たりで見つけにくい', '記号を入れなくても、どのサービスでも同じものを使える'], answer: 1, explain: 'パスワードは長いほど、組み合わせが増えます。総当たりで解読するのに時間がかかります。サービスごとに別のものにするのは、同じです。', sec: 'd15' },
        { q: '2段階認証(多要素認証)を使うと、どんなよいことがある？', choices: ['パスワードを人に教えても大丈夫になる', 'パスワードを決めなくてよくなる', 'パスワードが知られても、スマホなどでの確認がないとログインされない'], answer: 2, explain: 'パスワードに加えて、別の方法でも本人か確かめます。だから、パスワードだけ知られても、不正にログインされにくくなります。', sec: 'd15' },
        { q: 'フィッシングで、だます人がいちばんねらっているものはどれ？', choices: ['パスワードや個人情報', 'パソコンの画面の明るさ', 'メールの文字の大きさ'], answer: 0, explain: '本物そっくりのメールやページで入力させます。そして、パスワードや個人情報、お金をだまし取ろうとします。', sec: 'd15' }
      ]
    },
    D5: {
      goal: 'ネットの詐欺の手口(あわてさせる・気持ちをゆさぶる・お金や情報を求める)に気づく。「とまる・たしかめる・そうだんする」で行動できる。',
      time: '50分',
      steps: [
        { where: '① ワンクリック詐欺', do: '「体験をはじめる」を押そう。右の「あなたの行動」から選んで、やることリストの「？」を全部うめよう。', hint: '「お客様の情報」に、名前や住所は本当に出ているかな。こまったら「💡 ヒント」を押そう。だまされても、本当には何も起きません。', go: '#oneclick', sec: 'xd7' },
        { where: '② 「当選しました」メール', do: 'メールのリンクを使わずに、本物かどうかを確かめてクリアしよう。', hint: 'そもそも、このお店のプレゼントに応募したかな。メールの中ではなく、別の方法で確かめよう。', go: '#prize', sec: 'xd7' },
        { where: '③ ウイルス付きメール', do: '添付ファイルを開く前に、本当に友達からのメールか確かめよう。そしてクリアしよう。', hint: '名前はだれでも名乗れます。「差出人のくわしい情報を見る」を押して、アドレスを見てみよう。', go: '#virus', sec: 'xd7' },
        { where: '④ にせのウイルス警告', do: '電話もソフトのインストールもしないで、警告の画面からぬけ出そう。', hint: 'これは、ブラウザに出ているWebページです。パソコンの中のソフトではありません。画面いっぱいの表示は、キーボードの左上のキーで終わらせられます。', go: '#support', sec: 'xd7' },
        { where: '⑤ にせの通販サイト', do: '買う前に、このお店で買ってよいかを確かめてクリアしよう。', hint: 'ほかのお店の値段・お店の情報(特定商取引法に基づく表記)・検索したときの評判の3つを見よう。', go: '#shop', sec: 'xd7' },
        { where: '⑥ まとめとふりかえり', do: 'どの詐欺にも共通する手口を読もう。そして、ふりかえり3つを書こう。', hint: '体験した場面の「だます人の手口」を思い出そう。自分ならどんな順番で行動するかを書こう。', go: '#matome', reflect: true },
        { where: 'ふりかえり・記録', do: '組と番号を入れて、「記録を書き出す(JSON・提出用)」を押そう。ファイルを、先生の言う場所に出そう。', hint: 'ファイルができないときは、「記録をコピーする」を押そう。先生の言う場所にはりつけよう。', go: '#records' }
      ],
      check: [
        { q: '動画サイトでボタンを1回押した。すると「登録完了・料金をはらってください」と出た。正しい考え方はどれ？', choices: ['料金の説明もなくボタンを1回押しただけでは、契約したことにならない', 'IPアドレスが出ているので、住所も知られている', 'まちがえたことを、問い合わせから伝える'], answer: 0, explain: 'IPアドレスや端末の種類からは、名前や住所はわかりません。連絡も支払いもせずに、画面を閉じます。', sec: 'xd7' },
        { q: 'パソコンに「ウイルスが検出されました。この番号に電話してください」と出た。どうする？', choices: ['データが消える前に電話する', '無料スキャンのソフトを入れる', 'Esc キーで全画面を終わらせ、タブを閉じて大人に伝える'], answer: 2, explain: 'Webページには、パソコンの中を調べる力はありません。電話やインストールをさせるのが、だます人のねらいです。', sec: 'xd7' },
        { q: 'ネットでお金をはらってしまった。家の人と相談できる「消費者ホットライン」の番号は？', choices: ['110', '188', '119'], answer: 1, explain: '188(いやや！)は、近くの消費生活センターにつながる番号です。まずは、家の人や先生に話しましょう。', sec: 'xd7' }
      ]
    },
    D6: {
      goal: '使う人の入力に反応する作品(双方向性のあるコンテンツ)を作る。サーバーとデータをやりとりさせ、動かして改善できるようになる。',
      time: '3時間ほど',
      steps: [
        { where: '作品', do: '「企画・改善メモ」に、だれのどんな困りごとを解決するかを書こう。「新しく作る」から見本を1つ選ぼう。', hint: '迷ったら「アンケート集計」か「計算チャレンジ（ランキング）」から始めよう。どちらもサーバーとやりとりする見本です。', go: '#/works', sec: 'd21' },
        { where: 'エディタ', do: '部品を置き、パレットのブロックで処理を作ろう。サーバーとのやりとり(server の命令)を1つ以上入れよう。', hint: 'ブロックとブロックのすき間を押すと、追加する場所が動きます。server の命令は、パレットの「サーバー」にあります。', go: '#/editor', sec: 'd23' },
        { where: '実行', do: '「▶ 実行」を押して、ボタンや入力に思ったとおり反応するか確かめよう。', hint: 'ブロックを変えたら、もう一度「▶ 実行」を押そう。入力→処理→出力の順に、どこまで動いたかを見てみよう。', go: '#/run', sec: 'd24' },
        { where: 'デバッグ', do: 'うまく動かないところは「⏭ 1つずつ実行」で動かそう。変数ウォッチで値の変化を見て、原因を見つけよう。', hint: '行番号を押すと、その行の前で止まります。練習には見本の「バグを直そう（デバッグ練習）」が使えます。', go: '#/debug', sec: 'd24' },
        { where: 'サーバーのデータ', do: '友だちに使ってもらおう。集まったデータを、サーバーの箱と通信ログで見よう。改善点は「企画・改善メモ」に書いて、エディタで直そう。', hint: 'この教材のサーバーは、端末ごとの模型です。1台の端末を回して答えてもらおう。ランキングにはニックネームを使おう。', go: '#/server', sec: 'd24' },
        { where: 'ふりかえり・記録', do: 'ふりかえりに、双方向性とサーバーとのやりとりをどう工夫したかを書こう。', hint: '使う人の入力に、作品がどう反応したか(出力)を書こう。サーバーに何を保存したかも入れよう。', go: '#/records', reflect: true },
        { where: 'ふりかえり・記録', do: '組と番号を入れて「記録を書き出す（JSON）」を押そう。できたファイルを先生の言う場所に出そう。', hint: '作品タブの「ファイルに保存（.json）」は、作品を別の端末へ移すためのものです。提出するのは「記録を書き出す（JSON）」のファイルです。', go: '#/records' }
      ],
      check: [
        { q: '双方向性のあるコンテンツの「双方向性」とは何？', choices: ['使う人の働きかけ(入力)に応じて、応答(出力)すること', '文字と画像の両方を使うこと', '2台の端末で同じ画面を表示すること'], answer: 0, explain: '使う人の入力に応じて応答する機能を、双方向性といいます。ネットワークでサーバーとやりとりするものも多くあります。', sec: 'd21' },
        { q: '作品が server.save などで、サーバーにお願いを送ります。このとき作品(を動かす端末)は何とよばれる？', choices: ['ルータ', 'サーバー', 'クライアント'], answer: 2, explain: 'サービスを受け取る側がクライアントです。クライアントがお願い(リクエスト)を送ります。サーバーは返事(レスポンス)を返します。', sec: 'd24' },
        { q: '「ボタンが押されたとき」のブロックの中は、いつ実行される？', choices: ['プログラムの最初に1回だけ', 'ボタンが押されるたび', '上から順に、いつもくり返し'], answer: 1, explain: 'ボタンが押されることをイベントといいます。中の処理は、イベントが起きるたびに実行されます。', sec: 'd24' }
      ]
    },
    D7: {
      goal: 'センサの値をプログラムで判断して、LED・モーター・ランプを自動で制御できるようになる。テストで確かめて直す流れも身につける。',
      time: '3時間',
      steps: [
        { where: 'はじめに', do: 'はじめにを読もう。そのあと「場面をえらぶ」の場面①を開こう。', hint: '場面は①から順に進めよう。しくみの図は「くわしく」を開くと見られます。プログラムは自動で保存されるので、続きは次の時間にできます。', go: '#/', sec: 'd31' },
        { where: '① 街灯', do: 'めあてと「場面の説明」を読もう。暗くなったらつき、明るくなったら消えるプログラムにしよう。「✔ テストを実行」で全部合格をめざそう。', hint: 'はじめは、つける命令しかありません。「もし」の「＋「でなければ」を付ける」を押して、消す命令を入れよう。こまったら「ヒントを見る」。', go: '#/s/streetlight', sec: 'd31' },
        { where: '② 自動ドア', do: '人が近づいたら開き、いなくなったら閉まるドアにしよう。しきい値(距離の数)を変えながら、4つのテストに全部合格しよう。', hint: 'ドアは開くのに1秒、人は1秒に約100cm歩きます。しきい値が小さすぎるとぶつかり、大きすぎると「店の前を通りすぎる」で不合格です。理由を読んで、数を少しずつ変えよう。', go: '#/s/door', sec: 'd33' },
        { where: '③ 信号機', do: '「待つ」を使って、車の信号を 青→黄→赤→青 にしよう。歩行者は、車が赤のときだけ青にしよう。合格したら「改善メモ」に直したところを書き、「メモを保存」を押そう。', hint: '黄は3秒以上、歩行者の青は4秒以上、車も歩行者も赤の時間(全赤)は1秒以上です。不合格のときは「▶ このケースを再生」を押そう。「デバッグ」のグラフで、赤い点線の時刻を見てみよう。', go: '#/s/traffic', sec: 'd33' },
        { where: '④ 押しボタン式信号機', do: 'ボタンが押されたときだけ、車を止めて歩行者をわたらせよう。わたり終わったら、車を青にもどそう。', hint: '続きは「# ここに…」のメモの下(「もし ボタン == オン なら」の中)に入れます。場面③で作った順番と時間を思い出そう。ボタンを押してから12秒以内に歩行者を青にします。', go: '#/s/traffic-button', sec: 'd33' },
        { where: '⑤ 自由に作る（仮想マイコン）', do: '身のまわりの計測・制御を1つ考えて、センサと出力を自由に組み合わせて動かそう。', hint: 'テストはありません。「手動で動かす（スライダ）」でセンサの値を変えよう。思ったとおりに動くか確かめよう。', level: 'advanced', go: '#/s/sandbox', sec: 'xd5' },
        { where: 'ふりかえり', do: '各場面のいちばん下に「ふりかえり」があります。センサの値をどう使ったか、どんな工夫をしたかを書こう。', hint: '欄の中の「例:」の文を参考にします。しきい値の数や、テストで直したことを具体的に書くとよいです。', reflect: true },
        { where: 'ふりかえり・記録', do: '組と番号を入れて「JSONで書き出す（先生に出す）」を押そう。できたファイルを先生の言う場所に出そう。', hint: '組と番号が空だと書き出せません。CSV は表計算ソフトで見るためのものです。先生に出すのは JSON です。', go: '#/records' }
      ],
      check: [
        { q: '計測・制御システムで、センサの役割はどれ？', choices: ['計測した値をプログラムに従って処理する', '光・温度・距離など周囲の状況を計測する', 'LEDやモーターを動かして仕事をする'], answer: 1, explain: 'センサは入力の部品で、周囲の状況を計測します。判断するのはコンピュータです。仕事をするのはアクチュエータ(仕事を行う部分)です。', sec: 'd31' },
        { q: '「もし 明るさ < 30 なら」の 30 のように、判断を切りかえる境目の値を何という？', choices: ['A/D変換', '変数', 'しきい値'], answer: 2, explain: 'しきい値です。しきい値を変えると、どこで動きが切りかわるかが変わります。', sec: 'd33' },
        { q: '押しボタン式の信号機が、時間だけで切りかえる信号機よりよいところは？', choices: ['歩行者がいないときは車を止めないので、車をむだに待たせない', 'ランプの数が少なくてすむので、部品の費用が安くなる', '黄色のランプをつけなくても、安全に切りかえられる'], answer: 0, explain: 'ボタン(センサ)で、歩行者がいることを計測します。必要なときだけ車を止めるので、むだな待ち時間がへります。', sec: 'd33' }
      ]
    },
    D8: {
      goal: '距離センサとモーターでロボットを設計する。センサの値で動きを変えるプログラムで、火星の課題を解決する。テストとレーダーチャートで評価して、改善を考えられるようになる。',
      time: '3時間',
      steps: [
        { where: 'はじめに', do: '「問題解決の流れ」を読もう。「1 問題の発見・課題の設定」の欄に、自分の言葉で課題を書こう。そのあとステージ①を開こう。', hint: '「例: 問題の発見 → 課題の設定」を参考にします。書いた課題は自動で保存され、記録にも入ります。', go: '#/', sec: 'd34' },
        { where: '① まっすぐ走って止まる', do: '前進する時間を考えて、調査地点(青い円)の中で止まるようにしよう。「✔ テストを実行」で合格をめざそう。', hint: 'ふつうの速さは1秒に20cmです。調査地点までは200cmです。何秒前進すればよいか計算して、「〜秒待つ」の数を変えよう。', go: '#/s/straight', sec: ['d34', 'i2'] },

 * 使い方(classic script。file:// でも動く):
 *   <link rel="stylesheet" href="…/shared/eduit-frame.css">
 *   <script src="…/<分野>/eduit-info.js"><\/script>   … window.EDUIT_INFO を決める
 *   <script src="…/shared/eduit-frame.js"><\/script>
 * 置き場所(どれか):
 *   - <div data-ef-footer></div> があればそこにフッターを出す
 *   - <span data-ef-about></span> があればそこに「ⓘ このアプリについて」ボタンを出す(data-ef-footer がなければフッターは出さない)
 *   - <span data-ef-fs></span> があればそこに「全画面」ボタンを出す(いちばん外のページごと全画面。できない端末では出さない)
 *   - どちらもなければ <body> の最後にフッターを足す
 *   - EDUIT_INFO.app.footer === false なら自動では何も出さない(EduitFrame.open() だけ使う)
 * EDUIT_INFO = {
 *   domain: 'A',                     分野(A/B/C/D)。色が切りかわる
 *   domainName: '材料と加工の技術',
 *   suite: '材料と加工 教材アプリ',     教材集の名前
 *   version: '2.1', updated: '2026-10-15',
 *   safety: ['この分野だけの安全の説明', …],   共通の説明のあとに足す
 *   history: [{ version: '2.1', date: '2026-10-15', items: ['…', …] }, …]   新しい順
 *   app: { name: 'A3 構造強化ラボ' }   アプリごとに上書き(EDUIT_INFO.app を各ページで決めてもよい)
 *   levels: { basic: {...}, advanced: {...} }   基本編・発展編の分け方(メニューが EduitFrame.levels で使う)
 * }
 *
 * メニューのカード(4分野共通の形): EduitFrame.card({ code: 'A1', title: '…', desc: '…', parts: 「使うところ」の要素,
 *   extra: [分野ごとの追加の要素…], href: 'ひらく先' か onOpen: function () {…}, openAttrs: { 'data-go': 'b1' } })
 *   → <article class="ef-card ef-mcard">。記号・アイコン・名前・説明・使うところ・追加の欄・「ひらく ▶」の順。カードのどこを押しても開く。
 * メニューの上のバー(4分野で同じ): 左に EduitFrame.menuTitle の「[A] 材料と加工の技術 教材集」、右に「ふりがな」「文字 中」「使い方」「先生用」の4つだけ。
 *   ボタンは字だけ(絵文字を付けない)。くっきり・全画面・教材の切りかえボタンは、アプリを開いたときの上のバーにだけ出す。
 * 使い方のダイアログ: EduitFrame.howto(本文の HTML, { onOpen: function (dialogの中身) {…} }) → 「使い方」の題のダイアログを開く
 *   (別の「使い方」の画面がない分野のメニューで使う。onOpen はふりがなを付けるときなどに)
 * 記号の印: EduitFrame.code('A2') → <span class="ef-code">A2</span>(メニューの上のバー・アプリの上のバー・切りかえボタンで使う)
 * メニューの上のバーの名前: EduitFrame.menuTitle(h1) → h1 の中を「[A] 材料と加工の技術 教材集」にする
 * 上のバーの表示の道具(4分野で同じ形):
 *   ふりがな・くっきり: <button class="ef-btn ef-toggle" aria-pressed="true|false">ふりがな</button>(ON は分野の色で塗り、✓ が付く)
 *   文字の大きさ: <button class="ef-btn ef-size"></button> に EduitFrame.sizeButton(btn, { steps: [[値, '中'], [値, '大'], …], get: 今の値, set: function (値) {…} })
 *     →「文字 中」のボタンになり、押すたびに次の大きさへ(最後のつぎは最初へ)。もどり値の関数を呼ぶと表示を今の値に合わせる。
 *     「ふつう・大きい」の2段だけのときは、<button class="ef-btn ef-size" aria-pressed="false">文字 <span class="ef-size-v"></span></button> にして aria-pressed を切りかえるだけでよい(「中」「大」は CSS が出す)。
 * 表示の設定(全教材で1つ): EduitFrame.prefs。上のバーのボタンに data-ef-pref="ruby" / "fs" / "kukkiri" を付けると、
 *   ふりがな・「文字 中」(小・中・大・特大)・くっきりのボタンになる。ボタンのない教材は EduitFrame.prefs.use()。
 *   EduitFrame.prefs.get('fs') / set('ruby', true) / on(function (key, value) {…})。JS でバーを作る教材は prefs.button('fs') でボタンを受け取る。くわしくは下の「表示の設定」。
 * タブの帯をスクロールで隠す: 上に固定(position: sticky)したタブの帯に data-ef-autohide を付けるだけ。
 *   下へ読み進めると上へ引っこみ、少しでも上へ戻すと出てくる(帯の中にフォーカスがあるときは隠さない)。
 *   画面のはばの半分より細いもの(PC で左にたてに並ぶメニュー)は隠さない。スマホで横1行の帯になったときだけ隠れる。
 *
 * 振り返りを隠す設定: EduitFrame.furikaeri(true = 出す / false = 隠す)。隠すときは <html data-ef-furikaeri="off"> になり、
 *   data-ef-reflect の付いた要素(振り返りのタブ・欄・カードの印など)が出なくなる(eduit-frame.css)。決め方(先のものが勝つ):
 *   1. アドレスの ?furikaeri=off / ?furikaeri=on(自分か、同じサイトの親の画面のアドレス)。localStorage 'eduit.furikaeri' に覚える
 *   2. window.EDUIT_FURIKAERI = 'off' / 'on'(自分か親の画面。配布用の「振り返りなし」版はこれを入れてある)
 *   3. localStorage 'eduit.furikaeri'(前に 1 で決めたもの)
 *   JS で振り返りを出し分けるとき(振り返りを書かないと先へ進めない、など)は EduitFrame.furikaeri を見る。
 *
 * 節ごとの手順(EDUIT_INFO.jishu): 教科書の目次(T-textbook/index.html)の「この節の進め方」と、学習のまとめが使う。教材の中には出さない。
 *   中身は分野ごとの eduit-info.js の EDUIT_INFO.jishu.apps[記号](記号はアプリ名 EDUIT_INFO.app.name の先頭の「A3」など):
 *   { goal: 'ねらい', time: '30分', steps: [{ where: 'タブの名前', do: 'やること', hint: 'ヒント', go: '#/hash' か 'CSSセレクタ', level: 'advanced', reflect: true }],
 *     check: [{ q: '問い', choices: ['…', …], answer: 正解の番号(0から), explain: '解説' }] }
 *   go は進め方の「この場所へ」ボタンの行き先(# で始まれば location.hash、それ以外はその要素を click)。level: 'advanced' は「発展」にまとめ、reflect: true は振り返りを隠す設定のとき出さない。
 *   手順とたしかめ問題の sec: '節の id'(T-textbook/course-data.js の節。2つ以上は配列)は、教科書の節ごとの進め方に使う(節の画面に出す手順・使うタブ・たしかめ)。
 *   1つのページの中でアプリを切りかえる教材集は、開いたときに EduitFrame.jishuApp('C4')、メニューにもどったら EduitFrame.jishuApp(null) を呼ぶ(節の画面がどのアプリかを知るため)。
 *
 * まず考えよう(教科書の各節の「レッツスタート」にあたる導入): 下の LETS に、学習コース(T-textbook/course-data.js)の節の id ごとに
 *   { q: '問い', hint: 'ヒント' } を書く。文は教科書を写さず、この教材のために書いたもの(1文40字くらい)。
 *   教材の画面では、そのタブのいちばん上に <div data-ef-lets="a12"></div> を置くだけで、カードが入る(JS で後から作る画面でもよい)。
 *   学習コースは EduitFrame.lets(id) でデータを、EduitFrame.letsCard(id) でカードを取る。
 *
 * 基本編・発展編(メニュー用): EduitFrame.levels(置き場所, { card: function (item, parts, levelKey) { return カードの要素; }, code: function (item) { return 'A1'; } })
 *   code は「学習のまとめ」の行で使う(教材の記号を返す)。
 *   EDUIT_INFO.levels = {
 *     basic:    { title: '基本編', lead: '…', items: [{ id: 'M1', parts: ['材料カード', …], curr: 'A(1)ア', why: '…' }, …] },
 *     advanced: { title: '発展編', lead: '…', items: [ … ] }
 *   }
 *   id はメニューごとのアプリの id。parts は生徒の画面に出るタブ・ページの名前(「使うところ」に出す)。
 *   EDUIT_INFO.textbook があれば、カードを教科書の章ごとに見出しで区切り、カードに「教科書 1編1章 2」の行を出す:
 *   EDUIT_INFO.textbook = {
 *     groups: [{ key: 'know', ch: '1章', title: 'しくみを知る' }, { key: 'solve', ch: '2章', title: '問題を解決する' }, …],  見出しの順
 *     items: { 'material-navi': { g: 'know', ref: '1編1章 1・2' }, … }   id ごとの区切りと、カードに出す教科書の節
 *   }
 *   curr(学習指導要領の項目)と why(分けた理由)は先生用の一覧だけに出し、生徒のカードには出さない。
 *   選んだ編は localStorage の 'eduit.level.<分野>' に覚える(表示の設定なので「はじめから」でも消さない)。
 */
(function () {
  'use strict';
  var AUTHOR = '技術　岡田';
  var info = window.EDUIT_INFO || {};
  var app = info.app || {};
  if (info.domain) document.documentElement.setAttribute('data-ef-domain', info.domain);

  // ---- 振り返りを隠す設定 ----
  // 決め方(先のものが勝つ): アドレスの ?名前=on|off(自分か、同じサイトの親の画面。localStorage に覚える)→ window.変数 → localStorage
  function setting(param, globalName, key) {
    var w = window, v = null, re = new RegExp('[?&]' + param + '=(on|off)(?:&|$)');
    for (var i = 0; i < 8 && v === null; i++) {
      try {
        var m = re.exec(w.location.search || '');
        if (m) { v = m[1]; try { localStorage.setItem(key, v); } catch (e) {} }
        else if (w[globalName] === 'on' || w[globalName] === 'off') v = w[globalName];
      } catch (e) { break; }  // ちがうサイトの親は見ない
      if (w === w.parent) break;
      w = w.parent;
    }
    if (v === null) try { v = localStorage.getItem(key); } catch (e) {}
    return v;
  }
  function furikaeriSetting() { return setting('furikaeri', 'EDUIT_FURIKAERI', 'eduit.furikaeri') !== 'off'; }
  var furikaeri = furikaeriSetting();
  if (!furikaeri) document.documentElement.setAttribute('data-ef-furikaeri', 'off');


  var SAFETY = [
    'この教材は、インターネットにつながりません。入力したことや学習の記録を、外のサイトに送ることはありません。',
    '学習の記録は、開いた端末のブラウザの中だけに保存されます。ほかの端末や先生のパソコンには送られません。',
    '提出するときは、「書き出す」などのボタンでファイルにします。そのファイルを、先生の指示どおりに出します。',
    '名前などの個人情報は、先生の指示がないときは入力しないでください。',
    '端末をほかの人と共有するときは、提出したあとに記録を消してください。',
    '教材に出てくる会社名・人名・アドレスは、学習のために作ったものです。実在しません。数値は目安です。',
    '広告・アクセス解析・Cookie による追跡はありません。外部のプログラム(CDN など)も読み込みません。'
  ];
  var LICENSE = [
    '著作権: © 2026 ' + AUTHOR,
    '学習のためなら、だれでも無料で使い、コピーし、配ることができます。ほかの学校の先生も使えます。',
    '授業に合わせて直して使うこともできます。直したものを配るときは、直したことと、もとの作者(' + AUTHOR + ')を書いてください。',
    '販売すること、有料の教材や商品に入れて配ることはできません。',
    'この教材は、今のまま提供します。使って起きた不具合や損害に、作者は責任を負いません。',
    '教科書の図や文章は使っていません。図や文章はこの教材のために作ったものです。'
  ];

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'class') e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function list(items) { return el('ul', null, items.map(function (t) { return el('li', { text: t }); })); }
  function appName() { return app.name || info.suite || document.title; }

  var dlg = null;
  function build() {
    var safety = SAFETY.concat(info.safety || []).concat(app.safety || []);
    var hist = info.history || [];
    var panels = [
      ['安全と個人情報', [el('h3', { text: 'この教材の安全について' }), list(safety)]],
      ['ライセンス', [el('h3', { text: '使ってよい条件' }), list(LICENSE)]],
      ['更新履歴', hist.length ? hist.map(function (h) {
        return el('section', null, [
          el('h3', null, [el('span', { class: 'ef-hist-ver', text: h.version ? '第' + h.version + '版' : '' }),
            el('span', { class: 'ef-hist-date', text: h.date || '' })]),
          list(h.items || [])
        ]);
      }) : [el('p', { text: 'まだありません。' })]],
      ['作った人', [
        el('h3', { text: appName() }),
        el('p', { text: (info.domainName ? '中学校 技術・家庭科(技術分野)「' + info.domainName + '」の教材です。' : '中学校 技術・家庭科(技術分野)の教材です。') }),
        el('p', { text: '作成: ' + AUTHOR }),
        el('p', { text: (info.version ? '第' + info.version + '版' : '') + (info.updated ? '(' + info.updated + ' 更新)' : '') })
      ]]
    ];
    var tabs = el('div', { class: 'ef-tabs', role: 'tablist' });
    var body = el('div');
    var tabEls = [], panelEls = [];
    panels.forEach(function (p, i) {
      var t = el('button', { type: 'button', class: 'ef-tab', role: 'tab', id: 'ef-tab-' + i, 'aria-controls': 'ef-panel-' + i, 'aria-selected': i ? 'false' : 'true', tabindex: i ? '-1' : '0', text: p[0] });
      var pn = el('div', { class: 'ef-panel', role: 'tabpanel', id: 'ef-panel-' + i, 'aria-labelledby': 'ef-tab-' + i }, p[1]);
      if (i) pn.hidden = true;
      t.addEventListener('click', function () { select(i); });
      t.addEventListener('keydown', function (e) {
        var n = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!n) return;
        var j = (i + n + panels.length) % panels.length;
        e.preventDefault(); select(j); tabEls[j].focus();
      });
      tabEls.push(t); panelEls.push(pn); tabs.appendChild(t); body.appendChild(pn);
    });
    function select(i) {
      tabEls.forEach(function (t, j) { t.setAttribute('aria-selected', i === j ? 'true' : 'false'); t.tabIndex = i === j ? 0 : -1; });
      panelEls.forEach(function (p, j) { p.hidden = i !== j; });
    }
    var close = el('button', { type: 'button', class: 'ef-btn', text: '閉じる' });
    close.addEventListener('click', function () { dlg.close(); });
    dlg = el('dialog', { class: 'ef-dialog', 'aria-labelledby': 'ef-dialog-title' }, [
      el('div', { class: 'ef-dialog-in' }, [
        el('div', { class: 'ef-dialog-head' }, [el('h2', { id: 'ef-dialog-title', text: 'このアプリについて' }), close]),
        tabs, body
      ])
    ]);
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
    dlg._select = select;
    document.body.appendChild(dlg);
  }
  function open(tab) {
    if (!dlg) build();
    dlg._select(typeof tab === 'number' ? tab : 0);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  }

  var howtoDlg = null;
  function howto(html, opts) {
    opts = opts || {};
    if (!howtoDlg) {
      var close = el('button', { type: 'button', class: 'ef-btn', text: '閉じる' });
      close.addEventListener('click', function () { howtoDlg.close(); });
      howtoDlg = el('dialog', { class: 'ef-dialog ef-howto', 'aria-labelledby': 'ef-howto-title' }, [
        el('div', { class: 'ef-dialog-in' }, [
          el('div', { class: 'ef-dialog-head' }, [el('h2', { id: 'ef-howto-title', text: '使い方' }), close]),
          el('div', { class: 'ef-panel' })
        ])
      ]);
      howtoDlg.addEventListener('click', function (e) { if (e.target === howtoDlg) howtoDlg.close(); });
      document.body.appendChild(howtoDlg);
    }
    var body = howtoDlg.querySelector('.ef-panel');
    body.innerHTML = html;
    if (opts.onOpen) opts.onOpen(body);
    if (typeof howtoDlg.showModal === 'function') howtoDlg.showModal(); else howtoDlg.setAttribute('open', '');
    body.scrollTop = 0;
  }

  function aboutButton(cls) {
    var b = el('button', { type: 'button', class: cls || 'ef-btn ef-about-btn', title: '作った人・安全と個人情報・ライセンス・更新履歴', 'aria-label': 'このアプリについて(作った人・安全と個人情報・ライセンス・更新履歴)' },
      ['ⓘ', el('span', { class: 't', text: ' このアプリについて' })]);
    b.addEventListener('click', function () { open(0); });
    return b;
  }
  // 全画面(C エネルギー変換の「全画面」と同じ)。枠(生徒用サイト・1ファイル版のメニュー)の中で開いたときは、いちばん外のページごと全画面にする
  function fsDoc() {
    var d = document;
    try { for (var w = window; w !== w.parent; w = w.parent) { var pd = w.parent.document; if (!pd) break; d = pd; } } catch (e) {}
    return d;
  }
  function fsButton() {
    var D = fsDoc(), W = D.defaultView || window;
    var b = el('button', { type: 'button', class: 'ef-btn ef-fs-btn' });
    var keyMq = W.matchMedia ? W.matchMedia('(display-mode: fullscreen)') : null;
    function isFull() { return !!(D.fullscreenElement || D.webkitFullscreenElement); }
    function isKeyFull() { return !isFull() && !!(keyMq && keyMq.matches); }
    function upd() {
      var on = isFull() || isKeyFull();
      b.hidden = !(D.fullscreenEnabled || D.webkitFullscreenEnabled);
      b.textContent = '';
      b.appendChild(el('span', { class: 't', text: on ? '全画面をやめる' : '全画面' }));
      b.setAttribute('aria-label', on ? '全画面をやめる' : '全画面にする');
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    b.addEventListener('click', function () {
      var r = D.documentElement;
      try {
        if (isFull()) (D.exitFullscreen || D.webkitExitFullscreen).call(D);
        else if (isKeyFull()) window.alert('キーで全画面にしたときは、同じキー(F11 など)でもどせます');
        else { var p = (r.requestFullscreen || r.webkitRequestFullscreen).call(r); if (p && p.catch) p.catch(function () {}); }
      } catch (e) {}
    });
    D.addEventListener('fullscreenchange', upd);
    D.addEventListener('webkitfullscreenchange', upd);
    if (keyMq) { if (keyMq.addEventListener) keyMq.addEventListener('change', upd); else if (keyMq.addListener) keyMq.addListener(upd); }
    upd();
    return b;
  }
  function footer() {
    var link = aboutButton('ef-about-link');
    link.textContent = '安全と個人情報・ライセンス・更新履歴';
    return el('footer', { class: 'ef-footer', role: 'contentinfo' }, [
      el('span', null, ['作成: ', el('span', { class: 'ef-author', text: AUTHOR })]),
      info.version ? el('span', { text: '第' + info.version + '版' + (info.updated ? '(' + info.updated + ')' : '') }) : null,
      link
    ]);
  }
  function mount() {
    prefsMount();
    if (app.footer === false) return;
    var slot = document.querySelector('[data-ef-footer]');
    var about = document.querySelector('[data-ef-about]');
    Array.prototype.forEach.call(document.querySelectorAll('[data-ef-fs]'), function (f) { if (!f.querySelector('button')) f.appendChild(fsButton()); });
    if (about && !about.querySelector('button')) about.appendChild(aboutButton());
    if (slot) { if (!slot.querySelector('.ef-footer')) slot.appendChild(footer()); }
    else if (!about && !document.querySelector('body > .ef-footer')) document.body.appendChild(footer());
  }

  // ---- 基本編・発展編のタブ(メニュー用) ----
  var LEVEL_KEYS = ['basic', 'advanced'];
  // メニューから開く M・F(分野をまたぐ教材)。配るフォルダ(生徒に配る/)では同じフォルダにある。site/build.py がこの行を公開用の名前にする
  var SIBLINGS = { M: { file: 'M_身の回りの技術さがし.html', name: '身の回りの技術さがし' }, F: { file: 'F_これからの技術ラボ.html', name: 'これからの技術ラボ' } };
  // textbook.links の1つ: { code: 'M', area: 'a', when: '1章のはじめに', tab: '' }。M・F は ?bunya=a でその分野だけを開く(学習コースと同じ)
  function linkRow(L) {
    var S = SIBLINGS[L.code];
    if (!S) return null;
    var q = [L.area ? 'bunya=' + L.area : ''].filter(Boolean).join('&');
    var href = S.file + (q ? '?' + q : '') + (L.area ? '#' + L.area : '');

<script>
/* 教科書順コースと、M 身の回りの技術さがし・F これからの技術ラボ・Z 学習を終えて で使う共通の部品。
 * もとは G-guidance/index.html の中の部品(保存・ふりがな・表示の設定・タブ・クイズ・えらぶボタン・自己評価・書き出し)。
 * 使い方(classic script。file:// でも動く。build.py がページの中に入れる):
 *   <link rel="stylesheet" href="../../shared/eduit-frame.css">  <link rel="stylesheet" href="../common/t-core.css">
 *   <script src="eduit-info.js"><\/script> <script>EDUIT_INFO.app = { name: 'M 身の回りの技術さがし' };<\/script>
 *   <script src="../../shared/eduit-frame.js"><\/script> <script src="../common/t-ruby.js"><\/script> <script src="../common/t-core.js"><\/script>
 *   var T = TCore.init({ key: 'eduit.m.v1', blank: function () { return {…}; } });
 *   … T.quiz(…)・T.picker(…)・T.self(…) で中身を作り …
 *   T.start({ status: function (S) { return { intro: true, … }; }, prog: [[タブ, 名前, 点数の関数], …], exp: { code, title, file, score } });
 * ページの形: <div id="tapp"> の中に、上のバー(.t-top: ふりがな [data-ef-pref=ruby]・文字 [data-ef-pref=fs]・使い方 #t-howto)、
 *   タブ(.t-tabs [data-tab])、ページ(.t-sec[data-sec])。書く欄は data-k="t1.memo" のように S の中の場所を書く。
 *   記録のページには #t-prog・#t-export・#t-print・#t-reset・#t-export-msg を置く。
 * 分野ごとに開く(教科書順コースから ?bunya=a のように開く): data-area="a" の部分は、その分野のときと全部のときだけ出す。
 *   data-area="-" は全部のときだけ出す。分野のときは T.area がその記号になり、保存の場所も分野ごとに分かれる(key + '.a')。
 *   ほかの分野へ行くタブやボタンは消えるので、操作に慣れない生徒が分野を行き来して迷わない。
 */
(function () {
  'use strict';

  function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
  // 保存していた中身を blank() に重ねる。形のちがう値(配列のはずが文字など)は入れない(こわれた保存で止まらないように)
  function merge(a, b) {
    for (var k in b) {
      if (k === '__proto__') continue;
      var av = a[k], bv = b[k];
      if (isObj(av) && isObj(bv)) merge(av, bv);
      else if (av === undefined || (typeof av === typeof bv && Array.isArray(av) === Array.isArray(bv))) a[k] = bv;
    }
    return a;
  }
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function filled(v) { return String(v || '').trim().length > 0; }
  // 毎回同じ順にまぜる(答えがいつも同じ場所にならないように)
  function seeded(n, seed) {
    var a = [], s = seed;
    for (var i = 0; i < n; i++) a.push(i);
    for (var j = n - 1; j > 0; j--) { s = (s * 9301 + 49297) % 233280; var k = Math.floor(s / 233280 * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; }
    return a;
  }

  // ?bunya=a の分野の記号(そのページのタブに data-area があるときだけ。ないときは null)
  function areaOf() {
    var m = /[?&]bunya=([a-z])(?:&|$)/.exec(location.search);
    return m && document.querySelector('.t-tabs [data-tab="' + m[1] + '"][data-area]') ? m[1] : null;
  }

  function init(opts) {
    var $ = function (id) { return document.getElementById(id); };
    var root = $('tapp');
    var AREA = areaOf();
    // 分野のときは、ほかの分野の部分を消す(タブ・ページ・目次・書く欄)
    if (AREA) Array.prototype.forEach.call(root.querySelectorAll('[data-area]'), function (e) {
      if (e.getAttribute('data-area').split(' ').indexOf(AREA) < 0) e.parentNode.removeChild(e);
    });
    var KEY = opts.key && AREA ? opts.key + '.' + AREA : opts.key;
    var S = opts.blank();
    if (KEY) try { var raw = JSON.parse(localStorage.getItem(KEY) || 'null'); if (raw && typeof raw === 'object') S = merge(opts.blank(), raw); } catch (e) {}
    var onSave = [];
    function save() { if (KEY) try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} onSave.forEach(function (f) { f(); }); }
    function getK(path) { return path.split('.').reduce(function (o, k) { return o == null ? '' : o[k]; }, S); }
    function setK(path, v) {
      var ks = path.split('.'), o = S;
      for (var i = 0; i < ks.length - 1; i++) { if (!isObj(o[ks[i]])) o[ks[i]] = {}; o = o[ks[i]]; }
      o[ks[ks.length - 1]] = v;
    }

    // ---------- ふりがな(t-ruby.js の読み。長い言葉が先に当たる) ----------
    var RUBY = window.T_RUBY || {};
    var RUBY_RE = new RegExp(Object.keys(RUBY).sort(function (a, b) { return b.length - a.length; }).map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') || '(?!)', 'g');
    var SKIP = /^(RUBY|RT|RP|SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION)$/;
    // tab を渡すと、その表の読みを先に使う(分野の自習ガイドの文は、その分野の読みで)
    function reOf(tab) {
      if (!tab) return { R: RUBY, re: RUBY_RE };
      if (!tab.__rb) {
        var R = {}; Object.keys(RUBY).forEach(function (k) { R[k] = RUBY[k]; }); Object.keys(tab).forEach(function (k) { R[k] = tab[k]; });
        Object.defineProperty(tab, '__rb', { value: { R: R, re: new RegExp(Object.keys(R).sort(function (a, b) { return b.length - a.length; }).map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') || '(?!)', 'g') } });

      var top = node || root, T0 = reOf(tab), RB = T0.R, RE = T0.re;
      var walker = document.createTreeWalker(top, NodeFilter.SHOW_TEXT, {
        acceptNode: function (n) {
          for (var p = n.parentNode; p && p !== root.parentNode; p = p.parentNode) if (SKIP.test(p.nodeName) || (p.hasAttribute && p.hasAttribute('data-noruby'))) return NodeFilter.FILTER_REJECT;

        }

      while (walker.nextNode()) list.push(walker.currentNode);
      list.forEach(function (n) {
        var s = n.nodeValue, f = document.createDocumentFragment(), last = 0, m;
        RE.lastIndex = 0;

          var r = document.createElement('ruby');
          r.appendChild(document.createTextNode(m[0]));
          var rt = document.createElement('rt'); rt.textContent = RB[m[0]];
          r.appendChild(rt); f.appendChild(r);
          last = m.index + m[0].length;
        }
        if (last === 0) return;
        if (last < s.length) f.appendChild(document.createTextNode(s.slice(last)));
        // span でつつむ(親が flex・grid のボタンなどだと、つつまないと言葉ごとに間があく)
        var w = document.createElement('span'); w.appendChild(f); f = w;
        n.parentNode.replaceChild(f, n);
      });
    }
    // 文を入れかえてからふりがなを付ける(説明・点数など、あとから変わる文に使う)
    function text(node, s, tab) { node.textContent = s; ruby(node, tab); }

    // ---------- 表示の設定(ふりがな・文字の大きさ) ----------
    // 上のバーの data-ef-pref のボタンを EduitFrame がボタンにする(全教材で同じ設定 EduitFrame.prefs)。ふりがなは付けておき、オフのときは CSS でかくす
    if (opts.howto) $('t-howto').addEventListener('click', function () {
      EduitFrame.howto(opts.howto, { onOpen: function (box) { ruby(box); } });
    });

    // ---------- 書く欄(data-k)は自動で保存 ----------
    function fields(box) {
      Array.prototype.forEach.call((box || root).querySelectorAll('[data-k]'), function (f) {
        if (f._tk) return;
        f._tk = 1;
        var k = f.getAttribute('data-k');

        f.addEventListener('input', function () { setK(k, f.value); save(); });

    // ---------- 選ぶクイズ ----------
    // items: [{ t: 文, a: 正解の番号, x: 説明, c: この問いだけの選択肢 }], choices: 選択肢, store: 答えを入れる S の中のオブジェクトを返す関数
    // opts.mix: 数(seed)を渡すと、問いごとに選択肢の順をまぜて出す(答えの番号は元の順のまま保存する)
    function quiz(box, score, choices, items, store, qopts) {
      qopts = qopts || {};

      if (typeof score === 'string') score = $(score);
      function paintScore() {

        text(score, n ? '(' + ok + ' / ' + items.length + ' 正解' + (n < items.length ? '・のこり ' + (items.length - n) : '') + ')' : '');

          var mx = seeded(cs.length, qopts.mix + i * 7), sh = (qopts.mix + i) % cs.length;
          order = mx.slice(sh).concat(mx.slice(0, sh));
        }
        var ex = el('p', { class: 't-explain', hidden: '' });
        var btns = [];
        order.forEach(function (j) {
          var b = el('button', { type: 'button', class: 't-choice', text: cs[j] });
          b._j = j;
          b.addEventListener('click', function () { store()[i] = j; save(); paint(); paintScore(); });
          btns.push(b);
        });
        function paint() {
          var v = store()[i];
          btns.forEach(function (b) {
            var j = b._j;
            b.classList.toggle('is-ok', v != null && j === it.a && +v === j);
            b.classList.toggle('is-ng', v != null && +v === j && j !== it.a);
            b.setAttribute('aria-pressed', String(v != null && +v === j));
          });
          if (v != null) {
            text(ex, (+v === it.a ? '正解! ' : 'ざんねん。正しくは「' + cs[it.a] + '」。 ') + (it.x || ''), it.rb);
            ex.hidden = false;
          } else ex.hidden = true;
        }
        var li = el('li', { class: 't-q' }, [el('p', { class: 't-q-text', text: it.t }), el('div', { class: 't-choices' }, btns), ex]);
        box.appendChild(li);
        paint();
        if (it.rb) ruby(li, it.rb);  // it.rb: その問題の分野のふりがなの表
      });
      paintScore();
    }
    function quizDone(items, st) { return items.every(function (it, i) { return st[i] != null; }); }
    function quizOk(items, st) { return items.filter(function (it, i) { return st[i] != null && +st[i] === it.a; }).length; }

    // 1つだけ・いくつでも えらぶボタン(options: 文字か { id, label })。onChange は押したあとに呼ぶ。もどり値の関数で、表示を今の値に合わせる
    function picker(box, options, get, set, multi, onChange) {
      if (typeof box === 'string') box = $(box);
      var bs = options.map(function (o) {
        var id = o.id || o;
        var b = el('button', { type: 'button', class: 't-choice t-pick', text: o.label || o });
        b.addEventListener('click', function () {
          if (multi) { var a = get(), i = a.indexOf(id); if (i >= 0) a.splice(i, 1); else a.push(id); }
          else set(id);
          save(); paint();
          if (onChange) onChange();
        });
        box.appendChild(b);
        return { b: b, id: id };
      });
      function paint() {
        var v = get();
        bs.forEach(function (x) { x.b.setAttribute('aria-pressed', String(multi ? v.indexOf(x.id) >= 0 : v === x.id)); });
      }
      paint();
      return paint;
    }

    // 自己評価の表(◎○△)。items: [[キー, 文], …]、store: 評価を入れる S の中のオブジェクトを返す関数
    var LV = [['3', 'できた', '◎'], ['2', 'だいたい', '○'], ['1', 'もう少し', '△']];
    function self(tbody, items, store, name) {
      if (typeof tbody === 'string') tbody = $(tbody);
      items.forEach(function (s) {
        var tr = el('tr', null, [el('th', { scope: 'row', text: s[1] })]);
        LV.forEach(function (l) {
          var inp = el('input', { type: 'radio', name: (name || 't-self') + '-' + s[0], value: l[0] });
          inp.checked = store()[s[0]] === l[0];
          inp.addEventListener('change', function () { if (inp.checked) { store()[s[0]] = l[0]; save(); } });
          tr.appendChild(el('td', null, [el('label', null, [inp, el('span', { text: l[2] }), el('span', { class: 't-sr', text: l[1] })])]));
        });
        tbody.appendChild(tr);
      });
    }
    function selfDone(items, st) { return items.every(function (s) { return st[s[0]]; }); }

    // ---------- タブ ----------
    var TABS = Array.prototype.slice.call(document.querySelectorAll('.t-tabs [data-tab]'));
    var SECS = Array.prototype.slice.call(document.querySelectorAll('.t-sec'));
    var onShow = {};
    function visibleTabs() { return TABS.filter(function (t) { return EduitFrame.furikaeri || !t.hasAttribute('data-ef-reflect'); }); }
    function select(name, scroll) {
      if (!SECS.length) return;  // タブのないページ(教科書順コース)
      if (!EduitFrame.furikaeri && name === 'refl') name = 'rec';
      if (!SECS.some(function (s) { return s.getAttribute('data-sec') === name; })) name = SECS[0].getAttribute('data-sec');
      TABS.forEach(function (t) { var on = t.getAttribute('data-tab') === name; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; });
      SECS.forEach(function (s) { s.hidden = s.getAttribute('data-sec') !== name; });
      if (onShow[name]) onShow[name]();
      if (scroll) window.scrollTo(0, 0);
      // Claude のプレビューなど about:srcdoc で開くとアドレスを書きかえられないので、失敗しても止めない
      try { if (location.hash.slice(1) !== name) history.replaceState(null, '', location.pathname + location.search + '#' + name); } catch (e) {}
      if (KEY) try { localStorage.setItem(KEY + '.tab', name); } catch (e) {}
    }
    TABS.forEach(function (t) {
      t.setAttribute('aria-controls', 't-' + t.getAttribute('data-tab'));
      t.addEventListener('click', function () { select(t.getAttribute('data-tab'), true); });
      t.addEventListener('keydown', function (e) {
        var v = visibleTabs(), j = v.indexOf(t);
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          e.preventDefault();
          var n = v[(j + (e.key === 'ArrowRight' ? 1 : v.length - 1)) % v.length];
          n.focus(); n.click();
        }
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-goto]'), function (b) {
      b.addEventListener('click', function () { select(b.getAttribute('data-goto'), true); });
    });
    window.addEventListener('hashchange', function () { select(location.hash.slice(1)); });

    // ---------- 進み具合・書き出し・はじめから(T.start で始める) ----------
    function start(o) {
      function marks() {
        var st = o.status(S);
        TABS.forEach(function (t) { t.classList.toggle('is-done', !!st[t.getAttribute('data-tab')]); });
      }
      onSave.push(marks);
      function progress() {
        var st = o.status(S), ul = $('t-prog');
        if (!ul) return;
        ul.innerHTML = '';
        o.prog.forEach(function (p) {
          if (p[0] === 'refl' && !EduitFrame.furikaeri) return;
          ul.appendChild(el('li', null, [el('span', { class: st[p[0]] ? 'ok' : 'no', text: st[p[0]] ? '✓ できた ' : '・ まだ ' }), p[1], p[2] ? '(' + p[2]() + ')' : '']));
        });
        ruby(ul);
      }
      var prevRec = onShow.rec;
      onShow.rec = function () { if (prevRec) prevRec(); progress(); };
      // 書き出し(振り返り一覧 teacher-tools/furikaeri-ichiran で読める)
      function exportObj() {
        var EI = window.EDUIT_INFO || {}, data = S;
        if (!EduitFrame.furikaeri && o.exp.noRefl) data = o.exp.noRefl(JSON.parse(JSON.stringify(S)));
        var ob = {
          schema: 'eduit-textbook/1', app: o.exp.code, title: o.exp.title, version: EI.version || '', exported: new Date().toISOString(),
          student: { cls: S.who.cls, no: S.who.no, name: S.who.name }, score: o.exp.score ? o.exp.score(S) : {}, data: data
        };
        if (AREA) ob.area = AREA;  // 分野ごとに開いたとき(振り返り一覧は、その分野だけを出す)
        return ob;
      }
      if ($('t-export')) $('t-export').addEventListener('click', function () {
        // ファイル名に使えない文字(/ : * など)は組・番号・名前から除く
        var safe = function (v) { return String(v || '').replace(/[\\/:*?"<>|\s]/g, ''); };
        var who = [safe(S.who.cls), safe(S.who.no)].filter(Boolean).join('-');
        var d = new Date(), ds = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
        var name = o.exp.file + '_' + (who ? who + '_' : '') + (safe(S.who.name) ? safe(S.who.name) + '_' : '') + ds + '.json';
        try {
          var blob = new Blob([JSON.stringify(exportObj(), null, 2)], { type: 'application/json' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob); a.download = name;
          document.body.appendChild(a); a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
          text($('t-export-msg'), '「' + name + '」を作りました。' + (S.who.name || S.who.no ? '' : '(組・番号・名前が空です。先生に言われたら入れて、もう一度書き出してください)'));
        } catch (e) {
          text($('t-export-msg'), 'ファイルを作れませんでした。先生に聞いてください。');
        }
      });
      if ($('t-print')) $('t-print').addEventListener('click', function () { window.print(); });
      if ($('t-reset')) $('t-reset').addEventListener('click', function () {
        if (!confirm('この教材で書いたこと・答えを全部消して、はじめからにします。よいですか?')) return;
        try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + '.tab'); } catch (e) {}
        location.reload();
      });
      fields();
      ruby(root);
      marks();
      var first = location.hash.slice(1);
      if (!first && KEY) try { first = localStorage.getItem(KEY + '.tab') || ''; } catch (e) {}
      select(first || SECS[0].getAttribute('data-sec'));
      return { marks: marks };
    }

    return {
      S: S, $: $, el: el, root: root, save: save, ruby: ruby, text: text, filled: filled, seeded: seeded, fields: fields,
      quiz: quiz, quizDone: quizDone, quizOk: quizOk, picker: picker, self: self, selfDone: selfDone,
      select: select, onShow: onShow, onSave: onSave, start: start, area: AREA
    };
  }

  window.TCore = { init: init, area: areaOf };  // area: init の前に分野を知りたいとき(使い方の文を変えるなど)
})();
