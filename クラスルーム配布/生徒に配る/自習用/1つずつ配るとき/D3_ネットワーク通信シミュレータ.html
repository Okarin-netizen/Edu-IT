  <!-- 4分野共通の枠（色・ヘッダー・ボタン・フッター・このアプリについて）。1ファイル版では中に入れる -->
  <style id="eduit-frame-css">
/* Edu-IT 共通の枠(4分野・全アプリ共通)
 * 色・文字・ボタン・カード・ヘッダー・フッターの見た目をそろえるための部品。
 * 分野の色は <html data-ef-domain="A|B|C|D|G|T|M|F|Z"> で切りかわる(G は分野に入らない「技術分野のガイダンス」。T・M・F・Z は T-textbook/ の教科書順コースと3つの教材)。
 * アプリ固有の見た目は各アプリの CSS に残し、ここでは「枠」だけを決める。
 */
:root {
  color-scheme: light;      /* 端末がダークモードでも、4分野とも明るい画面で出す */
  --ef-font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --ef-bg: #f5f4f0;          /* 画面の地 */
  --ef-surface: #ffffff;     /* カード・ヘッダー */
  --ef-surface-2: #f8f7f4;   /* 一段下げた面 */
  --ef-line: #d6d3cb;        /* 枠線 */
  --ef-text: #1f2328;
  --ef-muted: #565d68;
  --ef-focus: #f08c00;       /* キーボード操作の枠 */
  --ef-radius: 12px;
  --ef-radius-s: 8px;
  --ef-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .04);
  --ef-header-h: 52px;
  --ef-tap: 40px;            /* ボタンの最小の高さ */
  /* 分野の色(既定は D) */
  --ef-accent: #1a5fc8;
  --ef-accent-ink: #ffffff;
  --ef-accent-soft: #e6eefb;
}
:root[data-ef-domain="A"] { --ef-accent: #985a26; --ef-accent-soft: #f5e9dc; }  /* 材料と加工: 木の茶 */
:root[data-ef-domain="B"] { --ef-accent: #2e7d32; --ef-accent-soft: #e4f2e5; }  /* 生物育成: 緑 */
:root[data-ef-domain="C"] { --ef-accent: #b45309; --ef-accent-soft: #fbeedd; }  /* エネルギー変換: だいだい */
:root[data-ef-domain="D"] { --ef-accent: #1a5fc8; --ef-accent-soft: #e6eefb; }  /* 情報: 青 */
:root[data-ef-domain="G"] { --ef-accent: #0f766e; --ef-accent-soft: #e0f2ef; }  /* 技術分野のガイダンス(4分野の前): 青緑 */
:root[data-ef-domain="T"] { --ef-accent: #475569; --ef-accent-soft: #eef1f5; }  /* 教科書の順に進む学習コース(T-textbook/): 灰青 */
:root[data-ef-domain="M"] { --ef-accent: #9d174d; --ef-accent-soft: #fbe7ef; }  /* M 身の回りの技術さがし(各編のはじめ): 赤紫 */
:root[data-ef-domain="F"] { --ef-accent: #4338ca; --ef-accent-soft: #e8e8fb; }  /* F これからの技術ラボ(各編の最後): あい色 */
:root[data-ef-domain="Z"] { --ef-accent: #7c4a03; --ef-accent-soft: #f6ecdc; }  /* Z 学習を終えて(3年間のまとめ): こげ茶 */

/* ---- ヘッダー ----
 * メニュー:   <header class="ef-header"> <h1 class="ef-title"><span class="ef-code">A</span> 材料と加工の技術 教材集</h1>
 *               <div class="ef-tools"> ふりがな / 文字 中 / 使い方 / 先生用 </div> </header>   (4分野でこの4つだけ・字だけ)
 * アプリ:     <header class="ef-header"> <a class="ef-btn ef-back" href="…">◀ メニュー</a>
 *               <h1 class="ef-title"><span class="ef-code">A2</span> アプリ名</h1>
 *               <div class="ef-tools"> ふりがな / 文字の大きさ / くっきり / 使い方 / そのアプリだけのボタン </div> </header>
 *   同じ分野の教材を切りかえるボタンにも記号を出す(<button class="ef-btn"><span class="ef-code">D2</span> CPU</button>)。
 */
.ef-header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  min-height: var(--ef-header-h); padding: 6px 14px;
  background: var(--ef-surface); color: var(--ef-text);
  border-bottom: 3px solid var(--ef-accent);
  font-family: var(--ef-font);
  box-sizing: border-box;
}
.ef-title {
  display: flex; align-items: center; gap: 8px;
  margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--ef-text);
}
.ef-title .ef-icon { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; font-size: 22px; }
.ef-title .ef-sub { font-size: 13px; font-weight: 400; color: var(--ef-muted); }
.ef-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }

/* ---- ボタン ----
 * .ef-btn          ふつうのボタン(白地・枠線・丸角)
 * .ef-btn.is-on    ON の状態(分野の色で塗る)。aria-pressed="true" でも同じ
 * .ef-btn-primary  いちばん大事な操作(はじめる・ひらく など)
 */
.ef-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--ef-tap); padding: 0 14px;
  border: 1px solid var(--ef-line); border-radius: 999px;
  background: var(--ef-surface); color: var(--ef-text);
  font: 600 15px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
  box-sizing: border-box; white-space: nowrap;
}
.ef-btn:hover { border-color: var(--ef-accent); }
.ef-btn.is-on, .ef-btn[aria-pressed="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-back { color: var(--ef-accent); border-color: transparent; background: var(--ef-accent-soft); }
/* 上のバーの表示の道具(4分野で同じ形)。ふりがな・くっきりは .ef-toggle(ON で ✓)、文字の大きさは .ef-size(EduitFrame.sizeButton) */
.ef-toggle[aria-pressed="true"]::before { content: "✓"; }
.ef-size .ef-size-v {
  display: inline-block; min-width: 2em; padding: 0 .3em; border-radius: 6px;
  background: var(--ef-accent-soft); color: var(--ef-accent); font-weight: 700; text-align: center;
}
/* 「ふつう・大きい」の2段だけのとき: <button class="ef-btn ef-size" aria-pressed="false|true">文字 <span class="ef-size-v"></span></button>
 * (中身が空の .ef-size-v に「中」「大」を出す。ON でもボタンは塗らない) */
.ef-size[aria-pressed="true"] { background: var(--ef-surface); border-color: var(--ef-line); color: var(--ef-text); }
.ef-size[aria-pressed]::before { content: none; }
.ef-size[aria-pressed] .ef-size-v:empty::after { content: "中"; }
.ef-size[aria-pressed="true"] .ef-size-v:empty::after { content: "大"; }
/* タブの帯をスクロールで隠す(data-ef-autohide。隠すのは eduit-frame.js) */
[data-ef-autohide] { transition: transform .2s ease; }
[data-ef-autohide].ef-ah-hide { transform: translateY(var(--ef-ah-y, -110%)); }
@media (prefers-reduced-motion: reduce) { [data-ef-autohide] { transition: none; } }
.ef-btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 20px;
  border: 0; border-radius: var(--ef-radius-s);
  background: var(--ef-accent); color: var(--ef-accent-ink);
  font: 700 16px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
}
.ef-btn-primary:hover { filter: brightness(1.08); }
.ef-btn:focus-visible, .ef-btn-primary:focus-visible, .ef-about-link:focus-visible, .ef-dialog :focus-visible {
  outline: 3px solid var(--ef-focus); outline-offset: 2px;
}

/* ---- メニューのカード ----
 * <article class="ef-card"> <p class="ef-card-tag">A1</p> <h3 class="ef-card-title">…</h3> <p>…</p> <a class="ef-btn-primary">ひらく ▶</a> </article>
 * メニューのカードは EduitFrame.card() で作る(下の .ef-mcard)。
 */
.ef-page { background: var(--ef-bg); color: var(--ef-text); font-family: var(--ef-font); }
.ef-card {
  background: var(--ef-surface); border: 1px solid var(--ef-line); border-top: 4px solid var(--ef-accent);
  border-radius: var(--ef-radius); box-shadow: var(--ef-shadow); padding: 16px 18px;
}
.ef-card-tag { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ef-accent); }
.ef-card-title { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: var(--ef-text); }

/* ---- 記号の印(A1・B2・C3・D4 など。メニューの上のバー・アプリの上のバー・切りかえボタン・カード) ---- */
.ef-code {
  display: inline-flex; align-items: center; justify-content: center; min-width: 1.9em; padding: 0 .35em;
  border-radius: 6px; background: var(--ef-accent); color: var(--ef-accent-ink);
  font: 700 .9em/1.5 var(--ef-font); letter-spacing: .02em; white-space: nowrap; vertical-align: .05em;
}
.ef-title .ef-code { font-size: 15px; }
.ef-btn .ef-code { font-size: 13px; min-width: 0; margin-right: 2px; }
.ef-btn.is-on .ef-code, .ef-btn[aria-pressed="true"] .ef-code, .ef-btn[aria-current] .ef-code { background: var(--ef-accent-ink); color: var(--ef-accent); }

/* ---- メニューのカード(EduitFrame.card が作る。4分野同じ形) ---- */
.ef-mcard { display: flex; flex-direction: column; gap: 6px; min-height: 9rem; padding: 12px 16px 14px; cursor: pointer; font-family: var(--ef-font); color: var(--ef-text); transition: box-shadow .1s; }
.ef-mcard:hover { box-shadow: 0 2px 12px rgba(0, 0, 0, .14); }
.ef-mcard-hd { display: flex; align-items: center; gap: 10px; }
.ef-mcard-ic { flex: 0 0 auto; width: 1.4em; font-size: 2em; line-height: 1; text-align: center; }
.ef-mcard-ht { min-width: 0; }
.ef-mcard .ef-card-tag { margin: 0 0 2px; font-size: 14px; }
.ef-mcard .ef-card-title { margin: 0; font-size: 1.12em; line-height: 1.4; }
.ef-mcard-desc { margin: 0; font-size: .95em; line-height: 1.6; }
.ef-mcard-extra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: .88em; color: var(--ef-muted); }
.ef-mcard-go { margin-top: auto; align-self: flex-end; }
.ef-level-order { margin: -4px 0 12px; font-size: .95em; line-height: 1.6; }

/* ---- フッター(作成者・このアプリについて) ---- */
.ef-footer {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 14px;
  margin: 24px 0 0; padding: 12px 16px;
  border-top: 1px solid var(--ef-line); background: var(--ef-surface-2);
  font: 13px/1.6 var(--ef-font); color: var(--ef-muted);
}
.ef-footer .ef-author { font-weight: 700; color: var(--ef-text); }
.ef-about-link {
  border: 0; background: none; padding: 2px 4px; cursor: pointer;
  font: inherit; color: var(--ef-accent); text-decoration: underline;
}
/* ヘッダーなどに置く小さい「このアプリについて」ボタン */
.ef-about-btn { font-size: 14px; }

/* ---- このアプリについて(ダイアログ) ---- */
.ef-dialog {
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  padding: 0; border: 1px solid var(--ef-line); border-radius: var(--ef-radius);
  background: var(--ef-surface); color: var(--ef-text); font: 15px/1.7 var(--ef-font);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
}
.ef-dialog::backdrop { background: rgba(0, 0, 0, .4); }
.ef-dialog-in { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.ef-dialog-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 3px solid var(--ef-accent); }
.ef-dialog-head h2 { margin: 0; font-size: 18px; flex: 1; }
.ef-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px 0; }
.ef-tab { border: 1px solid var(--ef-line); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--ef-surface-2);
  padding: 6px 12px; font: 600 14px/1.3 var(--ef-font); color: var(--ef-text); cursor: pointer; min-height: 36px; }
.ef-tab[aria-selected="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-panel { padding: 14px 18px 18px; overflow: auto; border-top: 1px solid var(--ef-line); }
.ef-panel h3 { margin: 12px 0 4px; font-size: 16px; }
.ef-panel ul { margin: 4px 0 8px; padding-left: 1.3em; }
.ef-panel p { margin: 4px 0 8px; }
.ef-howto .ef-panel { border-top: 0; }
.ef-howto .ef-panel ol { margin: 4px 0 8px; padding-left: 1.5em; }
.ef-howto .ef-panel li { margin: 2px 0; }
.ef-hist-ver { font-weight: 700; color: var(--ef-accent); }
.ef-hist-date { color: var(--ef-muted); font-size: 13px; margin-left: 6px; }

/* 文字を大きくした・くっきりのときも読めるように */
/* 基本編・発展編のタブ(メニュー。EduitFrame.levels が作る) */
.ef-levels { margin: 0 0 18px; font-family: var(--ef-font); }
.ef-level-tabs { display: flex; gap: 0; border-bottom: 3px solid var(--ef-accent); }
.ef-level-tab {
  display: inline-flex; align-items: baseline; gap: 8px; min-height: 48px; padding: 8px 22px; margin: 0 6px -3px 0;
  font: inherit; font-size: 1.15em; font-weight: 700 !important; color: var(--ef-muted) !important; cursor: pointer;
  background: var(--ef-surface-2); border: 1px solid var(--ef-line); border-bottom: 3px solid var(--ef-accent);
  border-radius: var(--ef-radius-s) var(--ef-radius-s) 0 0;
}
.ef-level-tab:hover { color: var(--ef-text) !important; }
/* 教材ごとのボタンの色指定(#hub button など)に負けないように !important にする */
.ef-level-tab[aria-selected="true"], .ef-level-tab[aria-selected="true"]:hover { color: var(--ef-accent-ink) !important; background: var(--ef-accent) !important; border-color: var(--ef-accent) !important; }
.ef-level-tab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }
.ef-level-count { font-size: .72em; font-weight: 400; }
.ef-level-panel { padding: 12px 0 0; }
.ef-level-panel:focus { outline: none; }
.ef-level-lead { margin: 0 0 12px; color: var(--ef-muted); line-height: 1.6; }
.ef-level-advanced[aria-selected="true"], .ef-level-advanced[aria-selected="true"]:hover { background: #5b3fa8 !important; border-color: #5b3fa8 !important; }
.ef-level-tabs:has(.ef-level-advanced[aria-selected="true"]) { border-bottom-color: #5b3fa8; }
.ef-level-parts { margin: .3em 0 0; font-size: .9em; line-height: 1.5; color: var(--ef-text); }
.ef-mcard-tb { margin: .3em 0 0; font-size: .85em; line-height: 1.5; color: var(--ef-muted); }
.ef-level-group { display: flex; align-items: baseline; gap: .5em; margin: 18px 0 10px; padding: 0 0 4px; border-bottom: 1px solid var(--ef-line); font-size: 1.1em; color: var(--ef-text); }
.ef-level-group:first-of-type { margin-top: 4px; }
.ef-level-group-ch { font-size: .8em; font-weight: 700; color: var(--ef-accent); }
.ef-level-parts-k {
  display: inline-block; margin-right: .5em; padding: 0 .5em; font-size: .85em; font-weight: 700;
  color: var(--ef-accent); background: var(--ef-accent-soft); border-radius: 999px;
}

/* 振り返りを隠す設定(EduitFrame.furikaeri)。振り返りのタブ・欄・印には data-ef-reflect を付ける */
html[data-ef-furikaeri="off"] [data-ef-reflect] { display: none !important; }

/* ---- スマホ(せまい画面) ----
 * 上のバー: 名前を1行目に、道具が入りきらないときは次の行へ。ボタンは少し小さくする。
 * 名前(.ef-title)は 9em 以上の幅を取るので、せまい画面では道具が下の行に回る。
 */
@media (max-width: 640px) {
  .ef-header { gap: 6px; padding: 6px 10px; }
  .ef-title { flex: 1 1 9em; min-width: 0; font-size: 16px; }
  .ef-tools { gap: 4px; }
  .ef-header .ef-btn { min-height: 36px; padding: 0 10px; font-size: 14px; }
  .ef-level-tab { padding: 6px 14px; min-height: 44px; font-size: 1.05em; }
  .ef-mcard { min-height: 0; }
  .ef-dialog { width: calc(100vw - 16px); max-height: calc(100vh - 16px); }
  .ef-panel { padding: 12px; }
}

@media print { .ef-footer, .ef-dialog { display: none !important; } }

/* ---- 自習ガイド(自習モードのとき。EduitFrame が作る) ----
 * .ef-jishu-fab  右はしのたてのボタン「自習ガイド 2/5」
 * .ef-jishu      右に開くパネル(スマホは下から出る)。教材を操作しながら読めるように、まわりを暗くしない
 */
.ef-jishu-fab {
  position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 2147483000;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 7px; border: 0; border-radius: 10px 0 0 10px;
  background: var(--ef-accent); color: var(--ef-accent-ink); cursor: pointer;
  font: 700 15px/1.2 var(--ef-font); box-shadow: -2px 2px 10px rgba(0, 0, 0, .25);
}
.ef-jishu-fab-t { display: block; width: 1.05em; line-height: 1.15; word-break: break-all; text-align: center; }  /* 1字ずつ縦にならべる(writing-mode だと字が重なる端末がある) */
.ef-jishu-fab-p { font-size: 12px; font-weight: 700; background: rgba(255, 255, 255, .25); border-radius: 999px; padding: 1px 5px; }
.ef-jishu-fab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }
html.ef-jishu-open .ef-jishu-fab { display: none; }
.ef-jishu {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 2147483001;
  width: min(380px, 100vw); display: flex; flex-direction: column; box-sizing: border-box;
  background: var(--ef-surface); color: var(--ef-text); border-left: 1px solid var(--ef-line);
  box-shadow: -6px 0 24px rgba(0, 0, 0, .18); font: 15px/1.65 var(--ef-font); font-size: max(15px, .95rem); text-align: left;
}
.ef-jishu[hidden] { display: none; }
.ef-jishu *, .ef-jishu *::before { box-sizing: border-box; }
.ef-jishu-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 3px solid var(--ef-accent); }
.ef-jishu rt { display: ruby-text !important; font-size: .55em; font-weight: 400; }  /* 教材のふりがなをオフにしても、ガイドのふりがなはガイドのボタンで決める */
.ef-jishu-head h2 { flex: 1; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 0; font-size: 16px; line-height: 1.35; }
.ef-jishu-k { color: var(--ef-accent); }
.ef-jishu-name { font-weight: 700; }
.ef-jishu-body { flex: 1; overflow-y: auto; padding: 4px 14px 24px; overscroll-behavior: contain; }
.ef-jishu h3 { margin: 14px 0 6px; font-size: 15px; color: var(--ef-accent); }
.ef-jishu p { margin: 0 0 6px; line-height: 1.85; }
.ef-jishu-goal { padding: 2px 0 4px; border-bottom: 1px solid var(--ef-line); }
.ef-jishu-time, .ef-jishu-note { font-size: 13px; color: var(--ef-muted); }
.ef-jishu-steps, .ef-jishu-qs { list-style: none; margin: 0; padding: 0; }
.ef-jishu-step { margin: 0 0 10px; padding: 10px 12px; border: 1px solid var(--ef-line); border-radius: var(--ef-radius-s); background: var(--ef-surface-2); }
.ef-jishu-step.is-done { background: var(--ef-accent-soft); border-color: var(--ef-accent); }
.ef-jishu-step-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ef-jishu-n { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%;
  background: var(--ef-accent); color: var(--ef-accent-ink); font-size: 13px; font-weight: 700; }
.ef-jishu-where { font-size: 13px; font-weight: 700; color: var(--ef-accent); }
.ef-jishu-do { font-weight: 600; }
.ef-jishu-line { display: block; }
.ef-jishu-tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.ef-jishu .ef-jishu-small { min-height: 32px; padding: 0 10px; font-size: 13px; }
.ef-jishu-hint { margin: 6px 0; padding: 8px 10px; border-left: 4px solid var(--ef-focus); background: #fff8e6; font-size: 14px; }
.ef-jishu-hint[hidden] { display: none; }
.ef-jishu-done { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 14px; font-weight: 700; cursor: pointer; }
.ef-jishu-done input { width: 20px; height: 20px; accent-color: var(--ef-accent); }
.ef-jishu-q { margin: 0 0 12px; padding: 10px 12px; border: 1px solid var(--ef-line); border-radius: var(--ef-radius-s); }
.ef-jishu-qt { font-weight: 700; }
.ef-jishu-choices { display: flex; flex-direction: column; gap: 6px; }
.ef-jishu-choice {
  min-height: 38px; padding: 6px 10px; text-align: left; cursor: pointer;
  font: 14px/1.5 var(--ef-font); color: var(--ef-text); background: var(--ef-surface); border: 1px solid var(--ef-line); border-radius: var(--ef-radius-s);
}
.ef-jishu-choice:hover { border-color: var(--ef-accent); }
.ef-jishu-choice:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 1px; }
.ef-jishu-choice.is-ok { background: #e3f4e4; border-color: #2e7d32; font-weight: 700; }
.ef-jishu-choice.is-ok::before { content: "○ "; color: #2e7d32; }
.ef-jishu-choice.is-ng { background: #fdecea; border-color: #c62828; }
.ef-jishu-choice.is-ng::before { content: "× "; color: #c62828; }
.ef-jishu-res { margin: 6px 0 0; font-size: 14px; }
.ef-jishu-res.is-ok strong { color: #2e7d32; }
.ef-jishu-res.is-ng strong { color: #c62828; }
.ef-jishu-end { margin: 6px 0 10px; padding: 10px 12px; border-radius: var(--ef-radius-s); background: var(--ef-surface-2); border: 1px dashed var(--ef-line); font-size: 14px; }
.ef-jishu-end.is-clear { background: #e3f4e4; border: 2px solid #2e7d32; }
.ef-jishu-prog { font-weight: 700; }
.ef-jishu-adv { margin-top: 8px; }
.ef-jishu-adv summary { cursor: pointer; font-weight: 700; color: #5b3fa8; padding: 6px 0; }
/* メニュー: 進め方の説明と、カードの進み具合 */
.ef-jishu-menu { margin: 0 0 14px; padding: 12px 16px; background: var(--ef-surface); border: 2px solid var(--ef-accent); border-radius: var(--ef-radius); line-height: 1.7; }
.ef-jishu-menu h3 { margin: 0 0 4px; font-size: 1.05em; color: var(--ef-accent); }
.ef-jishu-menu p { margin: 0 0 4px; }

  // ---- 文字の大きさのボタン(4分野で同じ形:「文字 中」。押すたびに次の大きさへ) ----

  // ---- タブの帯をスクロールで隠す([data-ef-autohide]。下へ読み進めると隠れ、上へ戻すと出る) ----

        if (bar.classList.contains('ef-ah-hide')) return;

        // 上に固定されている(画面の上にはりついている)ときだけ隠す

        if (bar.getBoundingClientRect().top > top + 1) return;
        bar.style.setProperty('--ef-ah-y', -(top + bar.offsetHeight + 4) + 'px');

    }
    window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(run); } }, { passive: true });

    function reveal() {

            var r = t.getBoundingClientRect(), b = sc.getBoundingClientRect();
            if (r.left < b.left) sc.scrollLeft -= b.left - r.left + 12;
            else if (r.right > b.right) sc.scrollLeft += r.right - b.right + 12;
            return;
          }
        }
      });
    }
    document.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('[data-ef-autohide]')) setTimeout(reveal, 50);
    });

  }

  // ---- 自習ガイド(自習モードのときだけ。アプリの右はしに「自習ガイド」を出す) ----
  function jishuData(c) {

  function jishuSteps(d) {

  // 自習ガイドのふりがな: EDUIT_INFO.jishu.ruby(言葉 → 読み。shared/jishu-ruby.py で作る)の言葉に、長いものから順に付ける。
  // ガイドの上の「ふりがな」で消せる(はじめは付いている。その端末で覚える)

    var parts = k.match(/[一-鿿々〆]+|[^一-鿿々〆]+/g);
    var m = new RegExp('^' + parts.map(function (p) { return KJ.test(p) ? '(.+?)' : '(' + p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')'; }).join('') + '$').exec(r);
    if (!m) return [[k, r]];

  // 振り返りを隠す設定のときは、タブの名前から「ふりかえり」を消す(D の「ふりかえり・記録」→「記録」など。教材の側も同じように変わる)

  }
  // c: 記号(なければアプリ名から)。1つのページの中でアプリを切りかえる教材集(C)は、開いたアプリの記号で呼びなおす(null でかくす)
  function jishuMount(c, appTitle) {

    var fab = el('button', { type: 'button', class: 'ef-jishu-fab kz-norb no-ruby', 'data-noruby': '', 'aria-expanded': 'false', 'aria-controls': 'ef-jishu', title: '自習ガイド(ひとりで進めるときの案内)' }, [
      el('span', { class: 'ef-jishu-fab-t', text: '自習ガイド' }), el('span', { class: 'ef-jishu-fab-p' })
    ]);
    var close = el('button', { type: 'button', class: 'ef-btn', text: '閉じる' });
    var rb = Object.keys(rubyDict()).length ? el('button', { type: 'button', class: 'ef-btn ef-toggle ef-jishu-small', 'aria-pressed': String(jishuRubyOn()), text: 'ふりがな' }) : null;
    var body = el('div', { class: 'ef-jishu-body' });

    }

      var tools = el('div', { class: 'ef-jishu-tools' });

        return b;
      });

      endBox.appendChild(el('p', { text: all
        ? '基本はクリアです。発展に挑戦しよう。または、メニューにもどって次の教材へ進もう。'
        : 'できた手順に ✓ を付けよう。手順が全部できて、たしかめ問題が全部正解ならクリアです。' }));

    function render() {
      while (body.firstChild) body.removeChild(body.firstChild);

      var basic = steps.filter(function (x) { return x.s.level !== 'advanced'; });
      var adv = steps.filter(function (x) { return x.s.level === 'advanced'; });
      body.appendChild(el('section', { class: 'ef-jishu-goal' }, [
        el('h3', { text: 'ねらい' }), el('p', null, lines(d.goal)),
        d.time ? el('p', { class: 'ef-jishu-time', text: '時間の目安: ' + d.time }) : null
      ]));
      body.appendChild(el('section', null, [el('h3', { text: '進め方' }), el('ol', { class: 'ef-jishu-steps' }, basic.map(function (x, k) { return stepEl(x, k + 1); }))]));
      if (d.check && d.check.length) body.appendChild(el('section', null, [
        el('h3', { text: 'たしかめ問題' }),
        el('p', { class: 'ef-jishu-note', text: '進め方が終わったら答えよう。わからないときは、教材にもどって確かめよう。' }),
        el('ol', { class: 'ef-jishu-qs' }, d.check.map(checkEl))
      ]));
      body.appendChild(endBox);
      renderEnd();
      if (adv.length) {
        var det = el('details', { class: 'ef-jishu-adv' }, [
          el('summary', { text: '発展(基本が終わった人)' }),
          el('ol', { class: 'ef-jishu-steps' }, adv.map(function (x, k) { return stepEl(x, k + 1); }))
        ]);
        body.appendChild(det);
      }
      if (rb && jishuRubyOn()) jishuRuby(body);
      document.dispatchEvent(new CustomEvent('eduit-jishu-render', { detail: panel }));
    }
    function show(on) {
      panel.hidden = !on;
      fab.setAttribute('aria-expanded', String(on));
      document.documentElement.classList.toggle('ef-jishu-open', on);
      if (on && !st.seen) { st.seen = true; save(); }
    }
    fab.addEventListener('click', function () { show(panel.hidden); if (!panel.hidden) close.focus(); });
    close.addEventListener('click', function () { show(false); fab.focus(); });
    if (rb) rb.addEventListener('click', function () {
      var on = !jishuRubyOn();
      try { localStorage.setItem(JS_RUBY, on ? 'on' : 'off'); } catch (e) {}
      rb.setAttribute('aria-pressed', String(on));
      render();
    });
    panel.addEventListener('keydown', function (e) { if (e.key === 'Escape') { show(false); fab.focus(); } });
    render();
    updateFab();
    document.body.appendChild(fab);
    document.body.appendChild(panel);
    // はじめて開いた教材では、ガイドを開いておく
    if (!st.seen) show(true);
  }

  // メニュー(自習モードのとき): 基本編・発展編の上に進め方の説明、カードに進み具合
  function jishuMenuBox() {
    var J = info.jishu || {};
    return el('section', { class: 'ef-jishu-menu', 'aria-label': 'ひとりで進めるとき' }, [
      el('h3', { text: 'ひとりで進めるとき(自習モード)' }),
      J.lead ? el('p', { text: J.lead }) : null,
      el('ol', null, [
        el('li', { text: '基本編のカードを、おすすめの順番に開きます。' }),
        el('li', { text: '教材の右はしの「自習ガイド」を押すと、ねらいと進め方が出ます。上から順に進めます。できたら「できた」に ✓ を付けます。' }),
        el('li', { text: 'こまったら「ヒント」を押します。「この場所へ」を押すと、その手順のページに移ります。' }),
        el('li', { text: '最後に「たしかめ問題」に答えます。全部正解したら、次の教材へ進みます。' }),
        furikaeri ? el('li', { text: '振り返りを書きます。記録を書き出して、先生の指示どおりに出します。' }) : el('li', { text: '記録を書き出して、先生の指示どおりに出します。' })
      ])
    ]);
  }
  function jishuBadge(c) {
    var p = jishuProgress(c);
    if (!p) return null;
    var b = el('p', { class: 'ef-mcard-jishu', 'data-jishu-code': c }, [el('span', { class: 'ef-level-parts-k', text: '自習' }), progressText(p)]);
    if (p.done === p.steps && p.ok === p.checks) b.classList.add('is-clear');
    return b;
  }
  if (jishu) window.addEventListener('storage', function (e) {
    if (!e.key || e.key.indexOf(JS_STORE) !== 0) return;
    Array.prototype.forEach.call(document.querySelectorAll('.ef-mcard-jishu'), function (b) {
      var n = jishuBadge(b.getAttribute('data-jishu-code'));
      if (n) b.parentNode.replaceChild(n, b);
    });
  });

  window.EduitFrame = { AUTHOR: AUTHOR, furikaeri: furikaeri, jishu: jishu, open: open, howto: howto, footer: footer, aboutButton: aboutButton, mount: mount, levels: levels, card: card, code: code, menuTitle: menuTitle, sizeButton: sizeButton, jishuProgress: jishuProgress, jishuApp: function (c, title) { jishuSet = true; jishuMount(c, title); } };
  var jishuSet = false;  // 教材集が jishuApp で決めたときは、アプリ名から決めなおさない
  function start() { mount(); if (!jishuSet) jishuMount(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>

<script>
"use strict";
// ---- js/netlib.js ----
const __m_js_netlib_js = (() => {

// ネットワークの計算（画面に依存しない部分。tests/unit.test.mjs でテストする）
// すべてブラウザの中の「模型のネットワーク」。実際のネットワークには一切さわらない。

// 機器の種類。forward: true の機器（ルータ）だけが、他の機器あてのパケットを中継する
const NODE_TYPES = {
  pc: { label: "パソコン", icon: "💻", forward: false, client: true },
  phone: { label: "スマホ", icon: "📱", forward: false, client: true },
  router: { label: "ルータ", icon: "🔀", forward: true, client: false },
  server: { label: "Webサーバ", icon: "🖥", forward: false, client: false },
  dns: { label: "DNSサーバ", icon: "📖", forward: false, client: false },
};

// はじめのネットワーク（家庭 → プロバイダの網の目 → サーバ）
// IPアドレスは、家の中はプライベートアドレス、外は説明用に予約されたアドレス（203.0.113.x など）を使う
function defaultNetwork() {
  const nodes = [
    { id: "pc1", type: "pc", name: "わたしのPC", ip: "192.168.1.10", x: 80, y: 170 },
    { id: "phone1", type: "phone", name: "スマホ", ip: "192.168.1.11", x: 80, y: 370 },
    { id: "home", type: "router", name: "家のルータ", ip: "192.168.1.1", x: 240, y: 270 },
    { id: "rA", type: "router", name: "ルータA", ip: "10.0.0.1", x: 420, y: 140 },
    { id: "rB", type: "router", name: "ルータB", ip: "10.0.0.2", x: 420, y: 400 },
    { id: "rC", type: "router", name: "ルータC", ip: "10.0.0.3", x: 620, y: 140 },
    { id: "rD", type: "router", name: "ルータD", ip: "10.0.0.4", x: 620, y: 400 },
    { id: "web", type: "server", name: "クモストア", host: "kumo-store.example", ip: "203.0.113.10", x: 840, y: 170 },
    { id: "dns1", type: "dns", name: "DNSサーバ", ip: "198.51.100.53", x: 840, y: 400 },
  ];
  const pairs = [
    ["pc1", "home"], ["phone1", "home"], ["home", "rA"], ["home", "rB"], ["rA", "rB"],
    ["rA", "rC"], ["rB", "rD"], ["rC", "rD"], ["rC", "web"], ["rD", "web"], ["rD", "dns1"],
  ];
  return { nodes, links: pairs.map(([a, b]) => ({ id: `${a}-${b}`, a, b })) };
}

// 前の版の店の名前（くもストア／www.kumo-store.example）を、情報セキュリティ体験ラボと同じ
// 「クモストア」「kumo-store.example」に直す（NW-18）。生徒が自分で変えた名前はそのまま。
function migrateShopNames(net) {
  for (const n of net?.nodes || []) {
    if (n.type !== "server") continue;
    if (n.host === "www.kumo-store.example") n.host = "kumo-store.example";
    if (n.name === "くもストア") n.name = "クモストア";
  }
  return net;
}

function cloneNet(net) {
  return JSON.parse(JSON.stringify(net));
}

const nodeById = (net, id) => net.nodes.find((n) => n.id === id);
const linkBetween = (net, a, b) => net.links.find((l) => (l.a === a && l.b === b) || (l.a === b && l.b === a));
const canForward = (node) => Boolean(NODE_TYPES[node?.type]?.forward);

// 使える隣の機器（回線が切れていない・相手が止まっていない）
function neighbors(net, id) {
  const out = [];
  for (const l of net.links) {
    if (l.cut) continue;
    const other = l.a === id ? l.b : l.b === id ? l.a : null;
    if (!other) continue;
    const n = nodeById(net, other);
    if (n && !n.down) out.push({ id: other, cost: l.cost || 1 });
  }
  return out;
}

// ダイクストラ法で、いちばん近い道（通る回線の数が少ない道）を探す。
// 同じ長さの道が複数あるときは rng で選ぶ（パケットごとに道が変わることがある）。
// 途中で中継できるのはルータだけ。届かないときは null。
function shortestPath(net, from, to, rng = Math.random) {
  const src = nodeById(net, from);
  const dst = nodeById(net, to);
  if (!src || !dst || src.down || dst.down) return null;
  if (from === to) return [from];
  const dist = new Map([[from, 0]]);
  const preds = new Map([[from, []]]);
  const done = new Set();
  const queue = [from];
  while (queue.length) {
    queue.sort((x, y) => dist.get(x) - dist.get(y));
    const u = queue.shift();
    if (done.has(u)) continue;
    done.add(u);
    if (u !== from && !canForward(nodeById(net, u))) continue; // ルータ以外は中継しない
    for (const { id: v, cost } of neighbors(net, u)) {
      const d = dist.get(u) + cost;
      const cur = dist.get(v);
      if (cur === undefined || d < cur) {
        dist.set(v, d);
        preds.set(v, [u]);
        queue.push(v);
      } else if (d === cur) {
        preds.get(v).push(u);
      }
    }
  }
  if (!dist.has(to)) return null;
  const path = [to];
  let cur = to;
  while (cur !== from) {
    const ps = preds.get(cur);
    cur = ps[Math.min(ps.length - 1, Math.floor(rng() * ps.length))];
    path.unshift(cur);
  }
  return path;
}

// 同じ長さの道がいくつあるか（テストと説明用）
function countShortestPaths(net, from, to) {
  const seen = new Set();
  for (let i = 0; i < 200; i++) {
    const p = shortestPath(net, from, to, () => Math.random());
    if (!p) return 0;
    seen.add(p.join(">"));
  }
  return seen.size;
}

// 道がいまも使えるか（回線が切れていない・機器が止まっていない・途中はルータだけ）
function routeWorks(net, path) {
  if (!Array.isArray(path) || !path.length) return false;
  for (let i = 0; i < path.length; i++) {
    const n = nodeById(net, path[i]);
    if (!n || n.down) return false;
    if (i > 0 && i < path.length - 1 && !canForward(n)) return false;
    if (i > 0) {
      const l = linkBetween(net, path[i - 1], path[i]);
      if (!l || l.cut) return false;
    }
  }
  return true;
}
const routeCost = (net, path) => {
  let c = 0;
  for (let i = 1; i < path.length; i++) c += linkBetween(net, path[i - 1], path[i])?.cost || 1;
  return c;
};
const sameRoute = (a, b) => Boolean(a && b && a.join(">") === b.join(">"));

// 図に太い線で出す道を決める（くじは使わない。くじで道を変えるのは「2」のパケットのアニメだけ）。
// prefer にあげた道が、まだ使えて、いちばん近い道と同じ長さなら、その道をそのまま使う（前から順に）。
// そうでなければ、毎回同じ決まった道を選ぶ。届かないときは null。
function stableRoute(net, from, to, ...prefer) {
  const best = shortestPath(net, from, to, () => 0);
  if (!best) return null;
  const cost = routeCost(net, best);
  for (const p of prefer) {
    if (p && p[0] === from && p[p.length - 1] === to && routeWorks(net, p) && routeCost(net, p) === cost) return p;
  }
  return best;
}

// 道の上で、こわれているところ（切れた回線・止まった機器）
function brokenOnRoute(net, path) {
  const out = { links: [], nodes: [] };
  if (!path) return out;
  for (let i = 0; i < path.length; i++) {
    const n = nodeById(net, path[i]);
    if (n?.down) out.nodes.push(n.id);
    if (i > 0) {
      const l = linkBetween(net, path[i - 1], path[i]);
      if (!l || l.cut) out.links.push([path[i - 1], path[i]]);
    }
  }
  return out;
}

// こわす前の道（before）と、いまの道（now）をくらべる。
// kind: "ok"（こわれたところがない）| "same"（こわれたところは通り道ではない）| "detour"（別の道になった）| "unreachable"
function compareRoutes(net, before, now) {
  const faults = net.links.filter((l) => l.cut).length + net.nodes.filter((n) => n.down).length;
  const name = (id) => nodeById(net, id)?.name || id;
  const broken = brokenOnRoute(net, before);
  const brokenNames = [...broken.links.map(([a, b]) => `${name(a)}–${name(b)}`), ...broken.nodes.map(name)];
  if (!now) return { kind: "unreachable", faults, brokenNames };
  if (!faults) return { kind: "ok", faults, brokenNames };
  if (sameRoute(before, now)) return { kind: "same", faults, brokenNames };
  return { kind: "detour", faults, brokenNames, middle: now.slice(1, -1).map(name) };
}

// from から届く機器（中継はルータだけ）
function reachableFrom(net, from) {
  const start = nodeById(net, from);
  if (!start || start.down) return new Set();
  const seen = new Set([from]);
  const stack = [from];
  while (stack.length) {
    const u = stack.pop();
    if (u !== from && !canForward(nodeById(net, u))) continue;
    for (const { id: v } of neighbors(net, u)) {
      if (!seen.has(v)) {
        seen.add(v);
        stack.push(v);
      }
    }
  }
  return seen;
}

// DNSの名前解決。届くDNSサーバに聞いて、名前（host）からIPアドレスを調べる
function resolveName(net, clientId, host) {
  const dnsServers = net.nodes.filter((n) => n.type === "dns");
  if (!dnsServers.length) return { ok: false, reason: "no-dns" };
  let path = null;
  let dns = null;
  for (const d of dnsServers) {
    const p = shortestPath(net, clientId, d.id);
    if (p && (!path || p.length < path.length)) {
      path = p;
      dns = d;
    }
  }
  if (!path) return { ok: false, reason: "dns-unreachable" };
  const target = net.nodes.find((n) => n.type === "server" && n.host && n.host.toLowerCase() === String(host).trim().toLowerCase());
  if (!target) return { ok: false, reason: "not-found", dns, path };
  return { ok: true, dns, path, ip: target.ip, server: target };
}

// 届かないわけ（NW-07）。中継できるのはルータだけ、というきまりも説明に使う。
// kind: "ok" | "missing" | "to-down" | "from-down" | "isolated"（node がどこにもつながっていない）
//   | "broken"（こわれたところのせい） | "no-relay"（線はつながっているが、途中にルータでない機器 node がある） | "no-line"（線でつながっていない）
function unreachableReason(net, fromId, toId) {
  const from = nodeById(net, fromId);
  const to = nodeById(net, toId);
  if (!from || !to) return { kind: "missing" };
  if (shortestPath(net, fromId, toId, () => 0)) return { kind: "ok" };
  if (to.down) return { kind: "to-down", node: to };
  if (from.down) return { kind: "from-down", node: from };
  const wired = (id) => net.links.some((l) => (l.a === id || l.b === id) && nodeById(net, l.a) && nodeById(net, l.b));
  if (!wired(fromId)) return { kind: "isolated", node: from };
  if (!wired(toId)) return { kind: "isolated", node: to };
  const healed = cloneNet(net);
  healed.links.forEach((l) => delete l.cut);
  healed.nodes.forEach((n) => delete n.down);
  if (shortestPath(healed, fromId, toId, () => 0)) return { kind: "broken" };
  // ルータでない機器も中継できるとしたら届くか（線だけを見て、近い順にさがす）
  const prev = new Map([[fromId, null]]);
  const queue = [fromId];
  while (queue.length && !prev.has(toId)) {
    const u = queue.shift();
    for (const l of net.links) {
      const v = l.a === u ? l.b : l.b === u ? l.a : null;
      if (v && !prev.has(v) && nodeById(net, v)) {
        prev.set(v, u);
        queue.push(v);
      }
    }
  }
  if (!prev.has(toId)) return { kind: "no-line" };
  const path = [];
  for (let v = toId; v !== null; v = prev.get(v)) path.unshift(v);
  const node = path
    .slice(1, -1)
    .map((id) => nodeById(net, id))
    .find((n) => !canForward(n));
  return { kind: "no-relay", node, path };
}
// 届かないわけを、中学生向けの文にする（HTMLではない、ふつうの文字）
function reasonText(r, toName) {
  switch (r?.kind) {
    case "to-down":
      return `「${r.node.name}」そのものが止まっています。`;
    case "from-down":
      return `送る側の「${r.node.name}」が止まっています。`;
    case "isolated":
      return `「${r.node.name}」は、どこにもつながっていません。線でつなごう。`;
    case "broken":
      return `こわれたところのせいで、${toName} までの道がすべてとぎれています。`;
    case "no-relay":
      return `「${r.node.name}」の先へは進めません。${NODE_TYPES[r.node.type]?.label || "この機器"}はパケットを中継しないからです（中継するのはルータだけ）。ルータにつなごう。`;
    case "no-line":
      return `${toName} まで、線がつながっていません。`;
    default:
      return "";

      explainCard("安心して使えます", "この教材は、ブラウザの中だけで動きます。本物のネットワークや外部のサイトには、まったくつながりません。出てくるサイト名は架空（<code>.example</code>）です。IPアドレスは、家の中で使う番号（プライベートアドレス）と、説明用に予約された番号です。"),
      h("p", { class: "hint" }, "おすすめの順番：① → ② → ③ → ④ → ⑤（⑤は発展）。①で作ったネットワークを、②〜④で使います。はじめから用意された形のままでも体験できます。"),
    ),
    // 授業の区切り（NW-17）。2時間で使う
    h(
      "div",
      { class: "card lesson-plan" },
      h("h2", {}, "授業で使うとき（2時間）"),
      h(
        "table",
        { class: "data" },
        h("thead", {}, h("tr", {}, h("th", {}, "時間"), h("th", {}, "やること"), h("th", {}, "目安"))),
        h(
          "tbody",
          {},
          [1, 2].map((p) => {
            const ms = MODULES.filter((m) => m.period === p);
            return h("tr", {}, h("th", { scope: "row" }, `${p}時間目`), h("td", {}, ms.map((m) => `${m.label} ${m.title}`).join("、")), h("td", {}, ms.map((m) => m.minutes).join(" ＋ ")));
          }),
        ),
      ),
      h("p", { class: "hint" }, h("span", REFLECT_ATTR, "どのページも、終わりに「ふりかえり」を書きます。"), "⑤のドリル（発展）の「チャレンジ問題」は、時間がある人だけでかまいません。"),
    ),
    grid,
    // ことばの一覧（読み方つき）（NW-13）
    h(
      "details",
      { class: "card glossary" },
      h("summary", {}, h("strong", {}, "ことばの一覧（読み方つき）")),
      h(
        "dl",
        {},
        GLOSSARY.map(([w, r, d]) => [h("dt", {}, w, r ? h("span", { class: "ruby-note" }, `（${r}）`) : null), h("dd", {}, d)]),
      ),
    ),
  );
}

function renderRecords() {
  const st = store.state;
  const fields = [
    ["cls", "組"],
    ["num", "番号"],
    ["name", "名前"],
  ].map(([k, label]) => {
    const input = h("input", { type: "text", id: `stu-${k}`, maxlength: "20", value: st.student[k] || "" });
    input.addEventListener("change", () => store.setStudent({ [k]: input.value.trim() }));
    return h("div", { class: "field" }, h("label", { for: `stu-${k}` }, label), input);
  });
  const rows = MODULES.map((m) => {
    const p = progress(m);
    return h("tr", {}, h("td", {}, `${m.label} ${m.title}`), h("td", {}, `${p.done} / ${p.total}`), h("td", REFLECT_ATTR, store.getReflection(m.id) || "—"));
  });
  // 書き出す前に、組と番号が入っているかを確かめる。書き出したら、ファイル名と出し方を知らせる（共通のきまり）
  const exportNote = h("p", { class: "export-note", "aria-live": "polite" });
  const readyToExport = () => {
    const vals = Object.fromEntries(fields.map((f) => f.querySelector("input")).map((inp) => [inp.id.replace("stu-", ""), inp.value.trim()]));
    store.setStudent(vals);
    if (!vals.cls || !vals.num) {
      exportNote.className = "export-note warn";
      exportNote.textContent = "組と番号を入れてから書き出そう";
      (vals.cls ? fields[1] : fields[0]).querySelector("input").focus();
      return false;
    }
    return true;
  };
  // ファイル名の「組-番号-名前」（JSON と CSV で同じにする）
  const who = (st) => [st.cls, st.num, st.name].filter(Boolean).join("-") || "記録";
  const exported = (filename) => {
    exportNote.className = "export-note good";
    exportNote.textContent = `ファイルを保存しました（ファイル名: ${filename}）。先生に言われた場所に出そう。`;
  };
  const exportBtn = h("button", { type: "button", class: "btn" }, "記録を書き出す（JSON）");
  exportBtn.addEventListener("click", () => {
    if (!readyToExport()) return;
    const s = store.state;
    const data = {
      app: "network-sim",
      version: 1,
      exportedAt: new Date().toISOString(),
      student: s.student,
      modules: Object.fromEntries(MODULES.map((m) => [m.id, { title: m.title, ...progress(m), steps: s.modules[m.id]?.steps || {}, score: s.modules[m.id]?.score || {} }])),
      reflections: s.reflections,
    };
    const filename = `ネットワーク_${who(s.student)}.json`;
    downloadFile(filename, JSON.stringify(data, null, 2));
    exported(filename);
  });
  const csvBtn = h("button", { type: "button", class: "btn secondary" }, "CSVで書き出す");
  csvBtn.addEventListener("click", () => {
    if (!readyToExport()) return;
    const s = store.state;
    const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const lines = [["組", "番号", "名前", "モジュール", "できたステップ", "全ステップ", "ドリル最高点", "ふりかえり"].map(q).join(",")];
    for (const m of MODULES) {
      const p = progress(m);
      lines.push([s.student.cls, s.student.num, s.student.name, m.title, p.done, p.total, m.id === "drill" ? (store.getScore("drill", "best") ?? "") : "", store.getReflection(m.id)].map(q).join(","));
    }
    const filename = `ネットワーク_${who(s.student)}.csv`;
    downloadFile(filename, "﻿" + lines.join("\r\n"), "text/csv");
    exported(filename);
  });
  const resetBtn = h("button", { type: "button", class: "btn secondary" }, "この端末の記録をすべて消す");
  resetBtn.addEventListener("click", () => {
    if (!confirm("進み具合・ふりかえり・作ったネットワークをすべて消します。よろしいですか？")) return;
    store.reset();
    toast("記録を消しました");
    route();
  });
  view.replaceChildren(
    h("div", { class: "module-head" }, h("h1", {}, recordsTitle()), h("p", { class: "meta" }, "記録はこの端末のブラウザの中だけに保存されます。提出するときは書き出したファイルを先生に渡します。")),
    h("div", { class: "card" }, h("h2", {}, "名前"), h("div", { class: "field-row" }, fields)),
    h("div", { class: "card" }, h("h2", {}, "進み具合", h("span", REFLECT_ATTR, "とふりかえり")), h("div", { class: "table-wrap" }, h("table", { class: "data" }, h("thead", {}, h("tr", {}, h("th", {}, "モジュール"), h("th", {}, "ステップ"), h("th", REFLECT_ATTR, "ふりかえり"))), h("tbody", {}, rows))), h("p", {}, `IPアドレス・ドリルの最高点：${store.getScore("drill", "best") ?? "—"} / 10`), h("p", { class: "hint" }, h("strong", {}, "先生に出すのは JSON のファイルです。"), "CSV は、表計算ソフトで見るためのものです。"), h("div", { class: "btn-row" }, exportBtn, csvBtn), exportNote),
    h("div", { class: "card" }, h("h2", {}, "記録を消す"), h("p", { class: "hint" }, "次の人に端末をわたすときに使います。"), h("div", { class: "btn-row" }, resetBtn)),
  );
}

function renderModule(m) {
  const head = h("div", { class: "module-head" }, h("h1", {}, `${m.label} ${m.title}`), h("p", { class: "meta" }, `目安 ${m.minutes}（2時間で使うときは ${m.period}時間目）`), h("p", {}, m.lead));
  view.replaceChildren(head);
  m.render(view);
  const idx = MODULES.indexOf(m);
  const next = MODULES[idx + 1];
  view.append(h("div", { class: "btn-row module-next" }, idx > 0 ? h("a", { class: "btn secondary", href: `#/${MODULES[idx - 1].id}` }, `← ${MODULES[idx - 1].title}`) : null, next ? h("a", { class: "btn", href: `#/${next.id}` }, `次へ：${next.title} →`) : h("a", { class: "btn", href: "#/records" }, `${recordsTitle()}へ →`)));
}

let lastId = null;
function route() {
  flushDrafts(); // 書きかけのふりかえりを、ページを移る前に保存する
  const id = location.hash.replace(/^#\/?/, "").split("/")[0] || "home";
  const m = MODULES.find((x) => x.id === id);
  if (m) renderModule(m);
  else if (id === "records") renderRecords();
  else renderHome();
  renderNav(m ? m.id : id);
  renderOverall();
  if (lastId !== null && lastId !== id) {
    window.scrollTo(0, 0);
    view.focus({ preventScroll: true });
  }
  lastId = id;
}

store.subscribe(() => {
  renderOverall();
  const id = location.hash.replace(/^#\/?/, "").split("/")[0] || "home";
  renderNav(id);
});
window.addEventListener("hashchange", route);
renderToggles();
route();

// オフライン用（サーバーから配信したときだけ。1ファイル版では使わない）
if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !window.__NETSIM_STANDALONE) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

return { MODULES };
})();
</script>
</body>
</html>
