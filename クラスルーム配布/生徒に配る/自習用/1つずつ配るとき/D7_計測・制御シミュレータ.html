  <!-- 4分野共通の枠（色・ヘッダー・ボタン・フッター・このアプリについて）。1ファイル版では中に入れる -->
  <style id="eduit-frame-css">
/* Edu-IT 共通の枠(4分野・全アプリ共通)
 * 色・文字・ボタン・カード・ヘッダー・フッターの見た目をそろえるための部品。
 * 分野の色は <html data-ef-domain="A|B|C|D|G|T|M|F|Z"> で切りかわる(G は分野に入らない「技術分野のガイダンス」。T・M・F・Z は T-textbook/ の教科書順コースと3つの教材)。
 * アプリ固有の見た目は各アプリの CSS に残し、ここでは「枠」だけを決める。
 */
:root {
  color-scheme: light;      /* 端末がダークモードでも、4分野とも明るい画面で出す */
  --ef-font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --ef-bg: #f5f4f0;          /* 画面の地 */
  --ef-surface: #ffffff;     /* カード・ヘッダー */
  --ef-surface-2: #f8f7f4;   /* 一段下げた面 */
  --ef-line: #d6d3cb;        /* 枠線 */
  --ef-text: #1f2328;
  --ef-muted: #565d68;
  --ef-focus: #f08c00;       /* キーボード操作の枠 */
  --ef-radius: 12px;
  --ef-radius-s: 8px;
  --ef-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .04);
  --ef-header-h: 52px;
  --ef-tap: 40px;            /* ボタンの最小の高さ */
  /* 分野の色(既定は D) */
  --ef-accent: #1a5fc8;
  --ef-accent-ink: #ffffff;
  --ef-accent-soft: #e6eefb;
}
:root[data-ef-domain="A"] { --ef-accent: #985a26; --ef-accent-soft: #f5e9dc; }  /* 材料と加工: 木の茶 */
:root[data-ef-domain="B"] { --ef-accent: #2e7d32; --ef-accent-soft: #e4f2e5; }  /* 生物育成: 緑 */
:root[data-ef-domain="C"] { --ef-accent: #b45309; --ef-accent-soft: #fbeedd; }  /* エネルギー変換: だいだい */
:root[data-ef-domain="D"] { --ef-accent: #1a5fc8; --ef-accent-soft: #e6eefb; }  /* 情報: 青 */
:root[data-ef-domain="G"] { --ef-accent: #0f766e; --ef-accent-soft: #e0f2ef; }  /* 技術分野のガイダンス(4分野の前): 青緑 */
:root[data-ef-domain="T"] { --ef-accent: #475569; --ef-accent-soft: #eef1f5; }  /* 教科書の順に進む学習コース(T-textbook/): 灰青 */
:root[data-ef-domain="M"] { --ef-accent: #9d174d; --ef-accent-soft: #fbe7ef; }  /* M 身の回りの技術さがし(各編のはじめ): 赤紫 */
:root[data-ef-domain="F"] { --ef-accent: #4338ca; --ef-accent-soft: #e8e8fb; }  /* F これからの技術ラボ(各編の最後): あい色 */
:root[data-ef-domain="Z"] { --ef-accent: #7c4a03; --ef-accent-soft: #f6ecdc; }  /* Z 学習を終えて(3年間のまとめ): こげ茶 */

/* ---- ヘッダー ----
 * メニュー:   <header class="ef-header"> <h1 class="ef-title"><span class="ef-code">A</span> 材料と加工の技術 教材集</h1>
 *               <div class="ef-tools"> ふりがな / 文字 中 / 使い方 / 先生用 </div> </header>   (4分野でこの4つだけ・字だけ)
 * アプリ:     <header class="ef-header"> <a class="ef-btn ef-back" href="…">◀ メニュー</a>
 *               <h1 class="ef-title"><span class="ef-code">A2</span> アプリ名</h1>
 *               <div class="ef-tools"> ふりがな / 文字の大きさ / くっきり / 使い方 / そのアプリだけのボタン </div> </header>
 *   同じ分野の教材を切りかえるボタンにも記号を出す(<button class="ef-btn"><span class="ef-code">D2</span> CPU</button>)。
 */
.ef-header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  min-height: var(--ef-header-h); padding: 6px 14px;
  background: var(--ef-surface); color: var(--ef-text);
  border-bottom: 3px solid var(--ef-accent);
  font-family: var(--ef-font);
  box-sizing: border-box;
}
.ef-title {
  display: flex; align-items: center; gap: 8px;
  margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--ef-text);
}
.ef-title .ef-icon { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; font-size: 22px; }
.ef-title .ef-sub { font-size: 13px; font-weight: 400; color: var(--ef-muted); }
.ef-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }

/* ---- ボタン ----
 * .ef-btn          ふつうのボタン(白地・枠線・丸角)
 * .ef-btn.is-on    ON の状態(分野の色で塗る)。aria-pressed="true" でも同じ
 * .ef-btn-primary  いちばん大事な操作(はじめる・ひらく など)
 */
.ef-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--ef-tap); padding: 0 14px;
  border: 1px solid var(--ef-line); border-radius: 999px;
  background: var(--ef-surface); color: var(--ef-text);
  font: 600 15px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
  box-sizing: border-box; white-space: nowrap;
}
.ef-btn:hover { border-color: var(--ef-accent); }
.ef-btn.is-on, .ef-btn[aria-pressed="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-back { color: var(--ef-accent); border-color: transparent; background: var(--ef-accent-soft); }
/* 上のバーの表示の道具(4分野で同じ形)。ふりがな・くっきりは .ef-toggle(ON で ✓)、文字の大きさは .ef-size(EduitFrame.sizeButton) */
.ef-toggle[aria-pressed="true"]::before { content: "✓"; }
.ef-size .ef-size-v {
  display: inline-block; min-width: 2em; padding: 0 .3em; border-radius: 6px;
  background: var(--ef-accent-soft); color: var(--ef-accent); font-weight: 700; text-align: center;
}
/* 「ふつう・大きい」の2段だけのとき: <button class="ef-btn ef-size" aria-pressed="false|true">文字 <span class="ef-size-v"></span></button>
 * (中身が空の .ef-size-v に「中」「大」を出す。ON でもボタンは塗らない) */
.ef-size[aria-pressed="true"] { background: var(--ef-surface); border-color: var(--ef-line); color: var(--ef-text); }
.ef-size[aria-pressed]::before { content: none; }
.ef-size[aria-pressed] .ef-size-v:empty::after { content: "中"; }
.ef-size[aria-pressed="true"] .ef-size-v:empty::after { content: "大"; }
/* タブの帯をスクロールで隠す(data-ef-autohide。隠すのは eduit-frame.js) */
[data-ef-autohide] { transition: transform .2s ease; }
[data-ef-autohide].ef-ah-hide { transform: translateY(var(--ef-ah-y, -110%)); }
@media (prefers-reduced-motion: reduce) { [data-ef-autohide] { transition: none; } }
.ef-btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 20px;
  border: 0; border-radius: var(--ef-radius-s);
  background: var(--ef-accent); color: var(--ef-accent-ink);
  font: 700 16px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
}
.ef-btn-primary:hover { filter: brightness(1.08); }
.ef-btn:focus-visible, .ef-btn-primary:focus-visible, .ef-about-link:focus-visible, .ef-dialog :focus-visible {
  outline: 3px solid var(--ef-focus); outline-offset: 2px;
}

/* ---- メニューのカード ----
 * <article class="ef-card"> <p class="ef-card-tag">A1</p> <h3 class="ef-card-title">…</h3> <p>…</p> <a class="ef-btn-primary">ひらく ▶</a> </article>
 * メニューのカードは EduitFrame.card() で作る(下の .ef-mcard)。
 */
.ef-page { background: var(--ef-bg); color: var(--ef-text); font-family: var(--ef-font); }
.ef-card {
  background: var(--ef-surface); border: 1px solid var(--ef-line); border-top: 4px solid var(--ef-accent);
  border-radius: var(--ef-radius); box-shadow: var(--ef-shadow); padding: 16px 18px;
}
.ef-card-tag { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ef-accent); }
.ef-card-title { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: var(--ef-text); }

/* ---- 記号の印(A1・B2・C3・D4 など。メニューの上のバー・アプリの上のバー・切りかえボタン・カード) ---- */
.ef-code {
  display: inline-flex; align-items: center; justify-content: center; min-width: 1.9em; padding: 0 .35em;
  border-radius: 6px; background: var(--ef-accent); color: var(--ef-accent-ink);
  font: 700 .9em/1.5 var(--ef-font); letter-spacing: .02em; white-space: nowrap; vertical-align: .05em;
}
.ef-title .ef-code { font-size: 15px; }
.ef-btn .ef-code { font-size: 13px; min-width: 0; margin-right: 2px; }
.ef-btn.is-on .ef-code, .ef-btn[aria-pressed="true"] .ef-code, .ef-btn[aria-current] .ef-code { background: var(--ef-accent-ink); color: var(--ef-accent); }

/* ---- メニューのカード(EduitFrame.card が作る。4分野同じ形) ---- */
.ef-mcard { display: flex; flex-direction: column; gap: 6px; min-height: 9rem; padding: 12px 16px 14px; cursor: pointer; font-family: var(--ef-font); color: var(--ef-text); transition: box-shadow .1s; }
.ef-mcard:hover { box-shadow: 0 2px 12px rgba(0, 0, 0, .14); }
.ef-mcard-hd { display: flex; align-items: center; gap: 10px; }
.ef-mcard-ic { flex: 0 0 auto; width: 1.4em; font-size: 2em; line-height: 1; text-align: center; }
.ef-mcard-ht { min-width: 0; }
.ef-mcard .ef-card-tag { margin: 0 0 2px; font-size: 14px; }
.ef-mcard .ef-card-title { margin: 0; font-size: 1.12em; line-height: 1.4; }
.ef-mcard-desc { margin: 0; font-size: .95em; line-height: 1.6; }
.ef-mcard-extra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: .88em; color: var(--ef-muted); }
.ef-mcard-go { margin-top: auto; align-self: flex-end; }
.ef-level-order { margin: -4px 0 12px; font-size: .95em; line-height: 1.6; }

/* ---- フッター(作成者・このアプリについて) ---- */
.ef-footer {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 14px;
  margin: 24px 0 0; padding: 12px 16px;
  border-top: 1px solid var(--ef-line); background: var(--ef-surface-2);
  font: 13px/1.6 var(--ef-font); color: var(--ef-muted);
}
.ef-footer .ef-author { font-weight: 700; color: var(--ef-text); }
.ef-about-link {
  border: 0; background: none; padding: 2px 4px; cursor: pointer;
  font: inherit; color: var(--ef-accent); text-decoration: underline;
}
/* ヘッダーなどに置く小さい「このアプリについて」ボタン */
.ef-about-btn { font-size: 14px; }

/* ---- このアプリについて(ダイアログ) ---- */
.ef-dialog {
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  padding: 0; border: 1px solid var(--ef-line); border-radius: var(--ef-radius);
  background: var(--ef-surface); color: var(--ef-text); font: 15px/1.7 var(--ef-font);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
}
.ef-dialog::backdrop { background: rgba(0, 0, 0, .4); }
.ef-dialog-in { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.ef-dialog-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 3px solid var(--ef-accent); }
.ef-dialog-head h2 { margin: 0; font-size: 18px; flex: 1; }
.ef-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px 0; }
.ef-tab { border: 1px solid var(--ef-line); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--ef-surface-2);
  padding: 6px 12px; font: 600 14px/1.3 var(--ef-font); color: var(--ef-text); cursor: pointer; min-height: 36px; }
.ef-tab[aria-selected="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-panel { padding: 14px 18px 18px; overflow: auto; border-top: 1px solid var(--ef-line); }
.ef-panel h3 { margin: 12px 0 4px; font-size: 16px; }
.ef-panel ul { margin: 4px 0 8px; padding-left: 1.3em; }
.ef-panel p { margin: 4px 0 8px; }
.ef-howto .ef-panel { border-top: 0; }
.ef-howto .ef-panel ol { margin: 4px 0 8px; padding-left: 1.5em; }
.ef-howto .ef-panel li { margin: 2px 0; }
.ef-hist-ver { font-weight: 700; color: var(--ef-accent); }
.ef-hist-date { color: var(--ef-muted); font-size: 13px; margin-left: 6px; }

/* 文字を大きくした・くっきりのときも読めるように */
/* 基本編・発展編のタブ(メニュー。EduitFrame.levels が作る) */
.ef-levels { margin: 0 0 18px; font-family: var(--ef-font); }
.ef-level-tabs { display: flex; gap: 0; border-bottom: 3px solid var(--ef-accent); }
.ef-level-tab {
  display: inline-flex; align-items: baseline; gap: 8px; min-height: 48px; padding: 8px 22px; margin: 0 6px -3px 0;
  font: inherit; font-size: 1.15em; font-weight: 700 !important; color: var(--ef-muted) !important; cursor: pointer;
  background: var(--ef-surface-2); border: 1px solid var(--ef-line); border-bottom: 3px solid var(--ef-accent);
  border-radius: var(--ef-radius-s) var(--ef-radius-s) 0 0;
}
.ef-level-tab:hover { color: var(--ef-text) !important; }
/* 教材ごとのボタンの色指定(#hub button など)に負けないように !important にする */
.ef-level-tab[aria-selected="true"], .ef-level-tab[aria-selected="true"]:hover { color: var(--ef-accent-ink) !important; background: var(--ef-accent) !important; border-color: var(--ef-accent) !important; }
.ef-level-tab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }
.ef-level-count { font-size: .72em; font-weight: 400; }
.ef-level-panel { padding: 12px 0 0; }
.ef-level-panel:focus { outline: none; }
.ef-level-lead { margin: 0 0 12px; color: var(--ef-muted); line-height: 1.6; }
.ef-level-advanced[aria-selected="true"], .ef-level-advanced[aria-selected="true"]:hover { background: #5b3fa8 !important; border-color: #5b3fa8 !important; }
.ef-level-tabs:has(.ef-level-advanced[aria-selected="true"]) { border-bottom-color: #5b3fa8; }
.ef-level-parts { margin: .3em 0 0; font-size: .9em; line-height: 1.5; color: var(--ef-text); }
.ef-mcard-tb { margin: .3em 0 0; font-size: .85em; line-height: 1.5; color: var(--ef-muted); }
.ef-level-group { display: flex; align-items: baseline; gap: .5em; margin: 18px 0 10px; padding: 0 0 4px; border-bottom: 1px solid var(--ef-line); font-size: 1.1em; color: var(--ef-text); }
.ef-level-group:first-of-type { margin-top: 4px; }
.ef-level-group-ch { font-size: .8em; font-weight: 700; color: var(--ef-accent); }
.ef-level-parts-k {
  display: inline-block; margin-right: .5em; padding: 0 .5em; font-size: .85em; font-weight: 700;
  color: var(--ef-accent); background: var(--ef-accent-soft); border-radius: 999px;
}

/* 振り返りを隠す設定(EduitFrame.furikaeri)。振り返りのタブ・欄・印には data-ef-reflect を付ける */
html[data-ef-furikaeri="off"] [data-ef-reflect] { display: none !important; }

/* ---- スマホ(せまい画面) ----
 * 上のバー: 名前を1行目に、道具が入りきらないときは次の行へ。ボタンは少し小さくする。
 * 名前(.ef-title)は 9em 以上の幅を取るので、せまい画面では道具が下の行に回る。
 */
@media (max-width: 640px) {
  .ef-header { gap: 6px; padding: 6px 10px; }
  .ef-title { flex: 1 1 9em; min-width: 0; font-size: 16px; }
  .ef-tools { gap: 4px; }
  .ef-header .ef-btn { min-height: 36px; padding: 0 10px; font-size: 14px; }
  .ef-level-tab { padding: 6px 14px; min-height: 44px; font-size: 1.05em; }
  .ef-mcard { min-height: 0; }
  .ef-dialog { width: calc(100vw - 16px); max-height: calc(100vh - 16px); }
  .ef-panel { padding: 12px; }
}

@media print { .ef-footer, .ef-dialog { display: none !important; } }

/* ---- 自習ガイド(自習モードのとき。EduitFrame が作る) ----
 * .ef-jishu-fab  右はしのたてのボタン「自習ガイド 2/5」
 * .ef-jishu      右に開くパネル(スマホは下から出る)。教材を操作しながら読めるように、まわりを暗くしない
 */
.ef-jishu-fab {
  position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 2147483000;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 7px; border: 0; border-radius: 10px 0 0 10px;
  background: var(--ef-accent); color: var(--ef-accent-ink); cursor: pointer;
  font: 700 15px/1.2 var(--ef-font); box-shadow: -2px 2px 10px rgba(0, 0, 0, .25);
}
.ef-jishu-fab-t { display: block; width: 1.05em; line-height: 1.15; word-break: break-all; text-align: center; }  /* 1字ずつ縦にならべる(writing-mode だと字が重なる端末がある) */
.ef-jishu-fab-p { font-size: 12px; font-weight: 700; background: rgba(255, 255, 255, .25); border-radius: 999px; padding: 1px 5px; }
.ef-jishu-fab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }
html.ef-jishu-open .ef-jishu-fab { display: none; }
.ef-jishu {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 2147483001;
  width: min(380px, 100vw); display: flex; flex-direction: column; box-sizing: border-box;
  background: var(--ef-surface); color: var(--ef-text); border-left: 1px solid var(--ef-line);
  box-shadow: -6px 0 24px rgba(0, 0, 0, .18); font: 15px/1.65 var(--ef-font); font-size: max(15px, .95rem); text-align: left;
}
.ef-jishu[hidden] { display: none; }
.ef-jishu *, .ef-jishu *::before { box-sizing: border-box; }
.ef-jishu-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 3px solid var(--ef-accent); }
.ef-jishu rt { display: ruby-text !important; font-size: .55em; font-weight: 400; }  /* 教材のふりがなをオフにしても、ガイドのふりがなはガイドのボタンで決める */
.ef-jishu-head h2 { flex: 1; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 0; font-size: 16px; line-height: 1.35; }
.ef-jishu-k { color: var(--ef-accent); }
.ef-jishu-name { font-weight: 700; }
.ef-jishu-body { flex: 1; overflow-y: auto; padding: 4px 14px 24px; overscroll-behavior: contain; }
.ef-jishu h3 { margin: 14px 0 6px; font-size: 15px; color: var(--ef-accent); }
.ef-jishu p { margin: 0 0 6px; line-height: 1.85; }
.ef-jishu-goal { padding: 2px 0 4px; border-bottom: 1px solid var(--ef-line); }
.ef-jishu-time, .ef-jishu-note { font-size: 13px; color: var(--ef-muted); }
.ef-jishu-steps, .ef-jishu-qs { list-style: none; margin: 0; padding: 0; }
.ef-jishu-step { margin: 0 0 10px; padding: 10px 12px; border: 1px solid var(--ef-line); border-radius: var(--ef-radius-s); background: var(--ef-surface-2); }
.ef-jishu-step.is-done { background: var(--ef-accent-soft); border-color: var(--ef-accent); }
.ef-jishu-step-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ef-jishu-n { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%;
  background: var(--ef-accent); color: var(--ef-accent-ink); font-size: 13px; font-weight: 700; }
.ef-jishu-where { font-size: 13px; font-weight: 700; color: var(--ef-accent); }
.ef-jishu-do { font-weight: 600; }
.ef-jishu-line { display: block; }
.ef-jishu-tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.ef-jishu .ef-jishu-small { min-height: 32px; padding: 0 10px; font-size: 13px; }
.ef-jishu-hint { margin: 6px 0; padding: 8px 10px; border-left: 4px solid var(--ef-focus); background: #fff8e6; font-size: 14px; }
.ef-jishu-hint[hidden] { display: none; }
.ef-jishu-done { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 14px; font-weight: 700; cursor: pointer; }
.ef-jishu-done input { width: 20px; height: 20px; accent-color: var(--ef-accent); }
.ef-jishu-q { margin: 0 0 12px; padding: 10px 12px; border: 1px solid var(--ef-line); border-radius: var(--ef-radius-s); }
.ef-jishu-qt { font-weight: 700; }
.ef-jishu-choices { display: flex; flex-direction: column; gap: 6px; }
.ef-jishu-choice {
  min-height: 38px; padding: 6px 10px; text-align: left; cursor: pointer;
  font: 14px/1.5 var(--ef-font); color: var(--ef-text); background: var(--ef-surface); border: 1px solid var(--ef-line); border-radius: var(--ef-radius-s);
}
.ef-jishu-choice:hover { border-color: var(--ef-accent); }
.ef-jishu-choice:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 1px; }
.ef-jishu-choice.is-ok { background: #e3f4e4; border-color: #2e7d32; font-weight: 700; }
.ef-jishu-choice.is-ok::before { content: "○ "; color: #2e7d32; }
.ef-jishu-choice.is-ng { background: #fdecea; border-color: #c62828; }
.ef-jishu-choice.is-ng::before { content: "× "; color: #c62828; }
.ef-jishu-res { margin: 6px 0 0; font-size: 14px; }
.ef-jishu-res.is-ok strong { color: #2e7d32; }
.ef-jishu-res.is-ng strong { color: #c62828; }
.ef-jishu-end { margin: 6px 0 10px; padding: 10px 12px; border-radius: var(--ef-radius-s); background: var(--ef-surface-2); border: 1px dashed var(--ef-line); font-size: 14px; }
.ef-jishu-end.is-clear { background: #e3f4e4; border: 2px solid #2e7d32; }
.ef-jishu-prog { font-weight: 700; }
.ef-jishu-adv { margin-top: 8px; }
.ef-jishu-adv summary { cursor: pointer; font-weight: 700; color: #5b3fa8; padding: 6px 0; }
/* メニュー: 進め方の説明と、カードの進み具合 */

  <script id="eduit-frame">
/* Edu-IT 共通の枠: 作成者・安全と個人情報・ライセンス・更新履歴
 * 使い方(classic script。file:// でも動く):
 *   <link rel="stylesheet" href="…/shared/eduit-frame.css">
 *   <script src="…/<分野>/eduit-info.js"><\/script>   … window.EDUIT_INFO を決める
 *   <script src="…/shared/eduit-frame.js"><\/script>
 * 置き場所(どれか):
 *   - <div data-ef-footer></div> があればそこにフッターを出す
 *   - <span data-ef-about></span> があればそこに「ⓘ このアプリについて」ボタンを出す(フッターは出さない)
 *   - どちらもなければ <body> の最後にフッターを足す
 *   - EDUIT_INFO.app.footer === false なら自動では何も出さない(EduitFrame.open() だけ使う)
 * EDUIT_INFO = {
 *   domain: 'A',                     分野(A/B/C/D)。色が切りかわる
 *   domainName: '材料と加工の技術',
 *   suite: '材料と加工 教材アプリ',     教材集の名前
 *   version: '2.1', updated: '2026-10-15',
 *   safety: ['この分野だけの安全の説明', …],   共通の説明のあとに足す
 *   history: [{ version: '2.1', date: '2026-10-15', items: ['…', …] }, …]   新しい順
 *   app: { name: 'A3 構造強化ラボ' }   アプリごとに上書き(EDUIT_INFO.app を各ページで決めてもよい)
 *   levels: { basic: {...}, advanced: {...} }   基本編・発展編の分け方(メニューが EduitFrame.levels で使う)
 * }
 *
 * メニューのカード(4分野共通の形): EduitFrame.card({ code: 'A1', icon: '🪵', title: '…', desc: '…', parts: 「使うところ」の要素,
 *   extra: [分野ごとの追加の要素…], href: 'ひらく先' か onOpen: function () {…}, openAttrs: { 'data-go': 'b1' } })
 *   → <article class="ef-card ef-mcard">。記号・アイコン・名前・説明・使うところ・追加の欄・「ひらく ▶」の順。カードのどこを押しても開く。
 * メニューの上のバー(4分野で同じ): 左に EduitFrame.menuTitle の「[A] 材料と加工の技術 教材集」、右に「ふりがな」「文字 中」「使い方」「先生用」の4つだけ。
 *   ボタンは字だけ(絵文字を付けない)。くっきり・全画面・教材の切りかえボタンは、アプリを開いたときの上のバーにだけ出す。
 * 使い方のダイアログ: EduitFrame.howto(本文の HTML, { onOpen: function (dialogの中身) {…} }) → 「使い方」の題のダイアログを開く
 *   (別の「使い方」の画面がない分野のメニューで使う。onOpen はふりがなを付けるときなどに)
 * 記号の印: EduitFrame.code('A2') → <span class="ef-code">A2</span>(メニューの上のバー・アプリの上のバー・切りかえボタンで使う)
 * メニューの上のバーの名前: EduitFrame.menuTitle(h1) → h1 の中を「[A] 材料と加工の技術 教材集」にする
 * 上のバーの表示の道具(4分野で同じ形):
 *   ふりがな・くっきり: <button class="ef-btn ef-toggle" aria-pressed="true|false">ふりがな</button>(ON は分野の色で塗り、✓ が付く)
 *   文字の大きさ: <button class="ef-btn ef-size"></button> に EduitFrame.sizeButton(btn, { steps: [[値, '中'], [値, '大'], …], get: 今の値, set: function (値) {…} })
 *     →「文字 中」のボタンになり、押すたびに次の大きさへ(最後のつぎは最初へ)。もどり値の関数を呼ぶと表示を今の値に合わせる。
 *     「ふつう・大きい」の2段だけのときは、<button class="ef-btn ef-size" aria-pressed="false">文字 <span class="ef-size-v"></span></button> にして aria-pressed を切りかえるだけでよい(「中」「大」は CSS が出す)。

 *
 * 振り返りを隠す設定: EduitFrame.furikaeri(true = 出す / false = 隠す)。隠すときは <html data-ef-furikaeri="off"> になり、
 *   data-ef-reflect の付いた要素(振り返りのタブ・欄・カードの印など)が出なくなる(eduit-frame.css)。決め方(先のものが勝つ):
 *   1. アドレスの ?furikaeri=off / ?furikaeri=on(自分か、同じサイトの親の画面のアドレス)。localStorage 'eduit.furikaeri' に覚える
 *   2. window.EDUIT_FURIKAERI = 'off' / 'on'(自分か親の画面。配布用の「振り返りなし」版はこれを入れてある)
 *   3. localStorage 'eduit.furikaeri'(前に 1 で決めたもの)
 *   JS で振り返りを出し分けるとき(振り返りを書かないと先へ進めない、など)は EduitFrame.furikaeri を見る。
 *
 * 自習モード: EduitFrame.jishu(true = 入っている。既定は切)。決め方は振り返りと同じで、?jishu=on|off → window.EDUIT_JISHU → localStorage 'eduit.jishu'。
 *   入っているときは <html data-ef-jishu="on"> になり、アプリの右はしに「自習ガイド」のボタンとパネル(ねらい・進め方・ヒント・たしかめ問題)を出す。
 *   中身は分野ごとの eduit-info.js の EDUIT_INFO.jishu.apps[記号](記号はアプリ名 EDUIT_INFO.app.name の先頭の「A3」など):
 *   { goal: 'ねらい', time: '30分', steps: [{ where: 'タブの名前', do: 'やること', hint: 'ヒント', go: '#/hash' か 'CSSセレクタ', level: 'advanced', reflect: true }],
 *     check: [{ q: '問い', choices: ['…', …], answer: 正解の番号(0から), explain: '解説' }] }
 *   go は「この場所へ」ボタンの行き先(# で始まれば location.hash、それ以外はその要素を click)。level: 'advanced' は「発展」にまとめ、reflect: true は振り返りを隠す設定のとき出さない。
 *   1つのページの中でアプリを切りかえる教材集は、開いたときに EduitFrame.jishuApp('C2')、メニューにもどったら EduitFrame.jishuApp(null) を呼ぶ。
 *   できた印と答えは localStorage 'eduit.jishu.v1.<記号>'。メニュー(levels に code を渡したとき)は基本編の上に進め方の説明、カードに進み具合を出す。
 *
 * 基本編・発展編(メニュー用): EduitFrame.levels(置き場所, { card: function (item, parts, levelKey) { return カードの要素; }, code: function (item) { return 'A1'; } })
 *   code を渡すと、基本編の上に「おすすめの順番: A1 → A2 → …」の1行を出す(カードの順 = 番号の順 = おすすめの順)。
 *   EDUIT_INFO.levels = {
 *     basic:    { title: '基本編', lead: '…', items: [{ id: 'M1', parts: ['材料カード', …], curr: 'A(1)ア', why: '…' }, …] },
 *     advanced: { title: '発展編', lead: '…', items: [ … ] }
 *   }
 *   id はメニューごとのアプリの id。parts は生徒の画面に出るタブ・ページの名前(「使うところ」に出す)。
 *   EDUIT_INFO.textbook があれば、カードを教科書の章ごとに見出しで区切り、カードに「教科書 1編1章 2」の行を出す:
 *   EDUIT_INFO.textbook = {
 *     groups: [{ key: 'know', ch: '1章', title: 'しくみを知る' }, { key: 'solve', ch: '2章', title: '問題を解決する' }, …],  見出しの順
 *     items: { 'material-navi': { g: 'know', ref: '1編1章 1・2' }, … }   id ごとの区切りと、カードに出す教科書の節

    var basic = jishuSteps(d).filter(function (x) { return x.s.level !== 'advanced'; });
    var ok = 0;
    (d.check || []).forEach(function (q, i) { if (st.q[i] === q.answer) ok++; });
    return {
      done: basic.filter(function (x) { return st.s[x.i]; }).length, steps: basic.length,
      ok: ok, checks: (d.check || []).length
    };
  }
  function progressText(p) {
    return '進め方 ' + p.done + '/' + p.steps + (p.checks ? '・たしかめ ' + p.ok + '/' + p.checks : '');
  }

  // 自習ガイドのふりがな: EDUIT_INFO.jishu.ruby(言葉 → 読み。shared/jishu-ruby.py で作る)の言葉に、長いものから順に付ける。
  // ガイドの上の「ふりがな」で消せる(はじめは付いている。その端末で覚える)
  var JS_RUBY = 'eduit.jishu.ruby', KJ = /[一-鿿々〆]/, rubyRe = null;
  function jishuRubyOn() { try { return localStorage.getItem(JS_RUBY) !== 'off'; } catch (e) { return true; } }
  function rubyDict() { var J = (window.EDUIT_INFO || info).jishu; return (J && J.ruby) || {}; }
  // 言葉の中のかなのところには付けない(「下げる」→ 下(さ)げる)。読みと合わないときは、言葉ぜんぶに付ける
  function rubyParts(k, r) {
    var parts = k.match(/[一-鿿々〆]+|[^一-鿿々〆]+/g);
    var m = new RegExp('^' + parts.map(function (p) { return KJ.test(p) ? '(.+?)' : '(' + p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')'; }).join('') + '$').exec(r);
    if (!m) return [[k, r]];
    return parts.map(function (p, i) { return [p, KJ.test(p) ? m[i + 1] : null]; });
  }
  function jishuRuby(node) {
    var D = rubyDict(), keys = Object.keys(D);
    if (!keys.length) return;
    if (!rubyRe) rubyRe = new RegExp(keys.sort(function (a, b) { return b.length - a.length; }).map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|'), 'g');
    var w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null), list = [];
    while (w.nextNode()) if (KJ.test(w.currentNode.nodeValue) && !w.currentNode.parentNode.closest('ruby, rt, script, style')) list.push(w.currentNode);
    list.forEach(function (n) {
      var s = n.nodeValue, f = document.createDocumentFragment(), last = 0, m;
      rubyRe.lastIndex = 0;
      while ((m = rubyRe.exec(s))) {
        if (m.index > last) f.appendChild(document.createTextNode(s.slice(last, m.index)));
        rubyParts(m[0], D[m[0]]).forEach(function (x) {
          f.appendChild(x[1] ? el('ruby', null, [x[0], el('rt', { text: x[1] })]) : document.createTextNode(x[0]));
        });
        last = m.index + m[0].length;
      }
      if (!last) return;
      if (last < s.length) f.appendChild(document.createTextNode(s.slice(last)));
      n.parentNode.replaceChild(f, n);
    });
  }

  // 振り返りを隠す設定のときは、タブの名前から「ふりかえり」を消す(D の「ふりかえり・記録」→「記録」など。教材の側も同じように変わる)
  function whereText(w) {
    return furikaeri ? w : w.replace(/(ふりかえり|振り返り)・/g, '').replace(/と(ふりかえり|振り返り)/g, '');
  }
  // c: 記号(なければアプリ名から)。1つのページの中でアプリを切りかえる教材集(C)は、開いたアプリの記号で呼びなおす(null でかくす)
  function jishuMount(c, appTitle) {
    if (!jishu) return;
    Array.prototype.forEach.call(document.querySelectorAll('.ef-jishu, .ef-jishu-fab'), function (e) { e.parentNode.removeChild(e); });
    document.documentElement.classList.remove('ef-jishu-open');
    if (c === undefined) c = appCode();
    var d = jishuData(c);
    if (!d) return;
    var st = jishuLoad(c);
    var narrow = function () { return window.innerWidth <= 640; };
    var fab = el('button', { type: 'button', class: 'ef-jishu-fab kz-norb no-ruby', 'data-noruby': '', 'aria-expanded': 'false', 'aria-controls': 'ef-jishu', title: '自習ガイド(ひとりで進めるときの案内)' }, [
      el('span', { class: 'ef-jishu-fab-t', text: '自習ガイド' }), el('span', { class: 'ef-jishu-fab-p' })
    ]);
    var close = el('button', { type: 'button', class: 'ef-btn', text: '閉じる' });
    var rb = Object.keys(rubyDict()).length ? el('button', { type: 'button', class: 'ef-btn ef-toggle ef-jishu-small', 'aria-pressed': String(jishuRubyOn()), text: 'ふりがな' }) : null;
    var body = el('div', { class: 'ef-jishu-body' });
    var name = appTitle || ((window.EDUIT_INFO || info).app || app).name || '';
    var panel = el('aside', { class: 'ef-jishu kz-norb no-ruby', 'data-noruby': '', id: 'ef-jishu', 'aria-label': '自習ガイド', hidden: '' }, [
      el('div', { class: 'ef-jishu-head' }, [
        el('h2', null, [el('span', { class: 'ef-jishu-k', text: '自習ガイド' }), code(c), el('span', { class: 'ef-jishu-name', text: name.replace(/^(?:[A-D]\d+|[GMFZ])\s*/, '') })]),
        rb, close
      ]),
      body
    ]);
    function save() { jishuSave(c, st); updateFab(); }
    function updateFab() {
      var p = jishuProgress(c);
      fab.querySelector('.ef-jishu-fab-p').textContent = p.done + '/' + p.steps;
    }
    function go(where) {
      if (!where) return;
      if (where.charAt(0) === '#') location.hash = where;
      else { var t = document.querySelector(where); if (t) t.click(); }
      if (narrow()) show(false);
    }
    function canGo(where) {
      if (!where) return false;
      if (where.charAt(0) === '#') return true;
      try { return !!document.querySelector(where); } catch (e) { return false; }
    }
    // 1つの手順に文が2つ以上あるときは、文ごとに行を分ける(読む人が、いまどこをしているか追いやすいように)
    function lines(t) {
      return String(t || '').replace(/。(?=[^」』）)])/g, '。\n').split('\n').map(function (x) { return el('span', { class: 'ef-jishu-line', text: x }); });
    }
    function stepEl(x, n) {
      var s = x.s;
      var cb = el('input', { type: 'checkbox', id: 'ef-js-s' + x.i });
      cb.checked = !!st.s[x.i];
      cb.addEventListener('change', function () { if (cb.checked) st.s[x.i] = 1; else delete st.s[x.i]; li.classList.toggle('is-done', cb.checked); save(); renderEnd(); });
      var tools = el('div', { class: 'ef-jishu-tools' });
      if (s.hint) {
        var hint = el('p', { class: 'ef-jishu-hint', hidden: '', text: s.hint });
        var hb = el('button', { type: 'button', class: 'ef-btn ef-jishu-small', 'aria-expanded': 'false', text: 'ヒント' });
        hb.addEventListener('click', function () { hint.hidden = !hint.hidden; hb.setAttribute('aria-expanded', String(!hint.hidden)); });
        tools.appendChild(hb);
      }
      if (canGo(s.go)) {
        var gb = el('button', { type: 'button', class: 'ef-btn ef-jishu-small', text: 'この場所へ ▶' });
        gb.addEventListener('click', function () { go(s.go); });
        tools.appendChild(gb);
      }
      var li = el('li', { class: 'ef-jishu-step' + (cb.checked ? ' is-done' : '') }, [
        el('div', { class: 'ef-jishu-step-hd' }, [
          el('span', { class: 'ef-jishu-n', text: String(n) }),
          s.where ? el('span', { class: 'ef-jishu-where', text: whereText(s.where) }) : null
        ]),
        el('p', { class: 'ef-jishu-do' }, lines(s.do)),
        tools,
        hint || null,
        el('label', { class: 'ef-jishu-done', for: 'ef-js-s' + x.i }, [cb, 'できた'])
      ]);
      if (s.reflect) li.setAttribute('data-ef-reflect', '');
      return li;
    }
    function checkEl(q, i) {
      var res = el('p', { class: 'ef-jishu-res', 'aria-live': 'polite' });
      var btns = (q.choices || []).map(function (t, j) {
        var b = el('button', { type: 'button', class: 'ef-jishu-choice', text: t });
        b.addEventListener('click', function () { st.q[i] = j; save(); paint(); renderEnd(); });
        return b;
      });
      function paint() {
        var a = st.q[i];
        btns.forEach(function (b, j) {
          b.classList.toggle('is-ok', a !== undefined && j === q.answer && a === q.answer);
          b.classList.toggle('is-ng', a !== undefined && j === a && a !== q.answer);
          b.setAttribute('aria-pressed', String(a === j));
        });
        while (res.firstChild) res.removeChild(res.firstChild);
        if (a === undefined) return;
        res.className = 'ef-jishu-res ' + (a === q.answer ? 'is-ok' : 'is-ng');
        res.appendChild(el('strong', { text: a === q.answer ? '正解!' : 'ちがいます。もう一度考えて、ほかのものを選んでみよう。' }));
        if (a === q.answer && q.explain) res.appendChild(el('span', { text: ' ' + q.explain }));
        if (rb && jishuRubyOn()) jishuRuby(res);
      }
      paint();
      return el('li', { class: 'ef-jishu-q' }, [el('p', { class: 'ef-jishu-qt', text: q.q }), el('div', { class: 'ef-jishu-choices' }, btns), res]);
    }
    var endBox = el('div', { class: 'ef-jishu-end' });
    function renderEnd() {
      var p = jishuProgress(c);
      while (endBox.firstChild) endBox.removeChild(endBox.firstChild);
      var all = p.done === p.steps && p.ok === p.checks;
      endBox.classList.toggle('is-clear', all);
      endBox.appendChild(el('p', { class: 'ef-jishu-prog', text: progressText(p) }));
      endBox.appendChild(el('p', { text: all
        ? 'この教材の基本はクリアです。発展に挑戦するか、メニューにもどって、おすすめの順番の次の教材へ進もう。'
        : 'できた手順に ✓ を付けよう。全部できて、たしかめ問題に全部正解したらクリアです。' }));
      if (rb && jishuRubyOn()) jishuRuby(endBox);
    }
    function render() {
      while (body.firstChild) body.removeChild(body.firstChild);
      var steps = jishuSteps(d);
      var basic = steps.filter(function (x) { return x.s.level !== 'advanced'; });
      var adv = steps.filter(function (x) { return x.s.level === 'advanced'; });
      body.appendChild(el('section', { class: 'ef-jishu-goal' }, [
        el('h3', { text: 'ねらい' }), el('p', null, lines(d.goal)),
        d.time ? el('p', { class: 'ef-jishu-time', text: '時間の目安: ' + d.time }) : null
      ]));
      body.appendChild(el('section', null, [el('h3', { text: '進め方' }), el('ol', { class: 'ef-jishu-steps' }, basic.map(function (x, k) { return stepEl(x, k + 1); }))]));
      if (d.check && d.check.length) body.appendChild(el('section', null, [
        el('h3', { text: 'たしかめ問題' }),
        el('p', { class: 'ef-jishu-note', text: '進め方が終わったら答えよう。わからないときは、教材にもどって確かめてからでよい。' }),
        el('ol', { class: 'ef-jishu-qs' }, d.check.map(checkEl))
      ]));
      body.appendChild(endBox);
      renderEnd();
      if (adv.length) {
        var det = el('details', { class: 'ef-jishu-adv' }, [
          el('summary', { text: '発展(基本が終わった人)' }),
          el('ol', { class: 'ef-jishu-steps' }, adv.map(function (x, k) { return stepEl(x, k + 1); }))
        ]);
        body.appendChild(det);
      }
      if (rb && jishuRubyOn()) jishuRuby(body);
      document.dispatchEvent(new CustomEvent('eduit-jishu-render', { detail: panel }));
    }
    function show(on) {
      panel.hidden = !on;
      fab.setAttribute('aria-expanded', String(on));
      document.documentElement.classList.toggle('ef-jishu-open', on);
      if (on && !st.seen) { st.seen = true; save(); }
    }
    fab.addEventListener('click', function () { show(panel.hidden); if (!panel.hidden) close.focus(); });
    close.addEventListener('click', function () { show(false); fab.focus(); });
    if (rb) rb.addEventListener('click', function () {
      var on = !jishuRubyOn();
      try { localStorage.setItem(JS_RUBY, on ? 'on' : 'off'); } catch (e) {}
      rb.setAttribute('aria-pressed', String(on));
      render();
    });
    panel.addEventListener('keydown', function (e) { if (e.key === 'Escape') { show(false); fab.focus(); } });
    render();
    updateFab();
    document.body.appendChild(fab);
    document.body.appendChild(panel);
    // はじめて開いた教材では、ガイドを開いておく
    if (!st.seen) show(true);
  }

  // メニュー(自習モードのとき): 基本編・発展編の上に進め方の説明、カードに進み具合
  function jishuMenuBox() {
    var J = info.jishu || {};
    return el('section', { class: 'ef-jishu-menu', 'aria-label': 'ひとりで進めるとき' }, [
      el('h3', { text: 'ひとりで進めるとき(自習モード)' }),
      J.lead ? el('p', { text: J.lead }) : null,
      el('ol', null, [
        el('li', { text: '基本編のカードを、おすすめの順番に開きます。' }),
        el('li', { text: '教材の右はしの「自習ガイド」を押すと、ねらいと進め方が出ます。上から順に進め、できたら「できた」に ✓ を付けます。' }),
        el('li', { text: 'こまったら「ヒント」を押します。「この場所へ」を押すと、その手順のタブやページに移ります。' }),
        el('li', { text: '最後に「たしかめ問題」に答えます。全部正解したら、次の教材へ進みます。' }),
        furikaeri ? el('li', { text: '振り返りを書いて、記録を書き出し、先生の指示どおりに出します。' }) : el('li', { text: '記録を書き出して、先生の指示どおりに出します。' })
      ])
    ]);
  }
  function jishuBadge(c) {
    var p = jishuProgress(c);
    if (!p) return null;
    var b = el('p', { class: 'ef-mcard-jishu', 'data-jishu-code': c }, [el('span', { class: 'ef-level-parts-k', text: '自習' }), progressText(p)]);
    if (p.done === p.steps && p.ok === p.checks) b.classList.add('is-clear');
    return b;
  }
  if (jishu) window.addEventListener('storage', function (e) {
    if (!e.key || e.key.indexOf(JS_STORE) !== 0) return;
    Array.prototype.forEach.call(document.querySelectorAll('.ef-mcard-jishu'), function (b) {
      var n = jishuBadge(b.getAttribute('data-jishu-code'));
      if (n) b.parentNode.replaceChild(n, b);
    });
  });

  window.EduitFrame = { AUTHOR: AUTHOR, furikaeri: furikaeri, jishu: jishu, open: open, howto: howto, footer: footer, aboutButton: aboutButton, mount: mount, levels: levels, card: card, code: code, menuTitle: menuTitle, sizeButton: sizeButton, jishuProgress: jishuProgress, jishuApp: function (c, title) { jishuSet = true; jishuMount(c, title); } };
  var jishuSet = false;  // 教材集が jishuApp で決めたときは、アプリ名から決めなおさない
  function start() { mount(); if (!jishuSet) jishuMount(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>

const __m_js_ui_js = (() => {

// 共通UI部品（要素ビルダー、トースト、ファイルの書き出し）

// 小さな要素ビルダー: h("div", { class: "card" }, "text", child)
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

// 解説カード。kind: "info" | "warn" | "good" | "bad"
function explainCard(label, body, kind = "info") {
  const card = h("div", { class: `explain ${kind === "info" ? "" : kind}` });
  card.append(h("span", { class: "explain-label" }, label));
  if (typeof body === "string") card.append(h("p", {}, body));
  else card.append(body);
  return card;
}

// タブ（ボタンの列）。items: [[id, label]]
function tabs(items, current, onPick, label) {
  const row = h("div", { class: "tabs", role: "tablist", "aria-label": label });
  for (const [id, text] of items) {
    row.append(h("button", { type: "button", role: "tab", "aria-selected": id === current ? "true" : "false", onclick: () => onPick(id) }, text));
  }
  return row;
}

let toastTimer;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) {
    t = h("div", { class: "toast", role: "status" });
    document.body.append(t);
  }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

// 端末内でファイルを作ってダウンロードさせる（送信はしない）
function downloadFile(filename, text, type = "application/json") {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

return { h, escapeHtml, explainCard, tabs, toast, downloadFile };
})();

// ---- js/store.js ----
const __m_js_store_js = (() => {

// 保存（この端末のブラウザ内 localStorage のみ。外部には送らない）
const KEY = "mcsim.v1";

function empty() {
  return { version: 1, student: { cls: "", num: "", name: "" }, programs: {}, records: [], prefs: {}, reflections: {} };
}

// load() の中で使うので、読みこみより前に用意しておく
const isObj = (v) => Boolean(v) && typeof v === "object" && !Array.isArray(v);

let state = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return empty();
    const d = JSON.parse(raw);
    if (!isObj(d)) return empty();
    // こわれた所(形のちがう値)があっても、その所だけ空にして使い続ける
    const st = { ...empty(), ...d };
    for (const k of ["student", "programs", "prefs", "reflections"]) if (!isObj(st[k])) st[k] = empty()[k];
    if (!Array.isArray(st.records)) st.records = [];
    st.records = st.records.filter(isObj);
    return st;
  } catch {
    return empty();
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch {
    // 保存できない環境（プライベートモード等）でも、その場の操作は続けられる
  }
}

const MAX_RECORDS = 500;

const store = {
  get state() {
    return state;
  },
  getProgram: (sid) => state.programs[sid],
  setProgram(sid, text) {
    state.programs[sid] = text;
    save();
  },
  clearProgram(sid) {
    delete state.programs[sid];
    save();
  },
  addRecord(rec) {
    state.records.push({ id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), at: new Date().toISOString(), memo: "", ...rec });
    if (state.records.length > MAX_RECORDS) state.records.splice(0, state.records.length - MAX_RECORDS);
    save();
    return state.records[state.records.length - 1];
  },
  setMemo(id, memo) {
    const r = state.records.find((x) => x.id === id);
    if (r) {
      r.memo = memo;
      save();
    }
  },
  recordsOf: (sid) => state.records.filter((r) => r.sid === sid),
  best(sid) {
    const rs = state.records.filter((r) => r.sid === sid);
    if (!rs.length) return null;
    return rs.reduce((a, r) => (r.passed > a.passed ? r : a), rs[0]);
  },
  // 書いた文が空になったら、記録からも外す（書き出しに空の行を出さない）
  setReflection(sid, text) {
    if (text) state.reflections[sid] = { text, at: new Date().toISOString() };
    else delete state.reflections[sid];
    save();
  },
  getReflection: (sid) => state.reflections[sid]?.text || "",
  setStudent(info) {
    state.student = { ...state.student, ...info };
    save();
  },
  pref: (k) => state.prefs[k],
  setPref(k, v) {
    state.prefs[k] = v;
    save();
  },
  clearRecords() {
    state.records = [];
    save();
  },
  // 次の人に端末をわたすとき: 名前・プログラム・テストの記録・ふりかえりをすべて消す（表示の設定は残す）
  reset() {
    state = { ...empty(), prefs: state.prefs };
    save();
  },
};

return { store };
})();

const __m_js_data_js = (() => {

// data/*.json の読み込み（単一HTML版では埋め込みデータを使う）
const cache = new Map();

async function loadData(name) {
  if (cache.has(name)) return cache.get(name);
  const embedded = globalThis.__MCSIM_DATA?.[name];
  let value = embedded;
  if (!value) {
    const r = await fetch(`data/${name}.json`);
    if (!r.ok) throw new Error(`data/${name}.json を読み込めませんでした`);
    value = await r.json();
  }
  cache.set(name, value);
  return value;
}

return { loadData };
})();

  constructor(message, line) {

const WORD_OPS = ["かつ", "または"];

function normalize(s) {
  return String(s)
    .normalize("NFKC")
    .replace(/[≦≤]/g, "<=")
    .replace(/[≧≥]/g, ">=")
    .replace(/≠/g, "!=")
    .replace(/×/g, "*")

const UNIT_RE = /^([+-]?(?:\d+\.?\d*|\.\d+))(cm|センチメートル|センチ|°C|℃|度|秒|びょう|%|回|°)?$/i;

// ---- js/chart.js ----
const __m_js_chart_js = (() => {

// グラフ: センサ・出力・変数の値の変化を、1つずつ横長の帯（レーン）にして並べる
// （ロジックアナライザのように、センサの変化と出力の切りかわりを同じ時間軸で見くらべられる）

function css(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}

const LANE_H = 44;
const LEFT = 96;

// series: [{ name, min, max, label?, color?（線の色）, marks?（しきい値の数の配列）, scale?（0と最大の数を書く） }] / samples: [{t, ...}] / windowSec: 表示する秒数（null なら全部）
function drawChart(canvas, series, samples, windowSec = 30, markT = null) {
  const dpr = window.devicePixelRatio || 1;
  const width = canvas.clientWidth || 600;
  const height = series.length * LANE_H + 26;
  canvas.style.height = `${height}px`;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, width, height);
  const colors = [css("--series-1", "#2a78d6"), css("--series-2", "#eb6834"), css("--series-3", "#1baf7a"), css("--series-4", "#eda100"), css("--series-5", "#8a5cd1")];
  const text = css("--text-secondary", "#555");
  const muted = css("--text-muted", "#777");
  const grid = css("--border", "#ddd");
  const band = css("--surface-2", "#f0f0f0");
  const font = getComputedStyle(document.body).fontFamily;

  const lastT = samples.length ? samples[samples.length - 1].t : 0;
  const t1 = windowSec ? Math.max(windowSec, lastT) : Math.max(lastT, 1);
  const t0 = windowSec ? t1 - windowSec : 0;
  const plotW = width - LEFT - 12;
  const x = (t) => LEFT + ((t - t0) / (t1 - t0)) * plotW;
  const vis = samples.filter((s) => s.t >= t0 - 0.2);

  series.forEach((s, i) => {
    const top = i * LANE_H;
    if (i % 2 === 0) {
      g.fillStyle = band;
      g.fillRect(0, top, width, LANE_H);
    }
    g.fillStyle = text;
    g.font = `13px ${font}`;
    g.textBaseline = "middle";
    g.fillText(s.label || s.name, 6, top + LANE_H / 2 - 7, LEFT - 10);
    const last = vis.length ? vis[vis.length - 1][s.name] : undefined;
    g.fillStyle = muted;
    g.font = `12px ${font}`;
    g.fillText(last === undefined ? "" : s.show ? s.show(last) : String(Math.round(last * 10) / 10), 6, top + LANE_H / 2 + 9, LEFT - 10);
    // 値の範囲
    let lo = s.min;
    let hi = s.max;
    if (lo === undefined || hi === undefined) {
      const vals = vis.map((v) => v[s.name]).filter((v) => typeof v === "number");
      lo = Math.min(0, ...vals);
      hi = Math.max(1, ...vals);
    }
    if (hi === lo) hi = lo + 1;
    const y = (v) => top + LANE_H - 6 - ((v - lo) / (hi - lo)) * (LANE_H - 12);
    g.font = `12px ${font}`;
    // 縦の目もり（いちばん下と上の数）と、しきい値（プログラムの中の数）の線
    if (s.scale) {
      g.fillStyle = muted;
      g.textAlign = "right";
      g.fillText(String(hi), LEFT - 4, y(hi));
      g.fillText(String(lo), LEFT - 4, y(lo));
      g.textAlign = "left";
    }
    for (const m of s.marks || []) {
      if (m < lo || m > hi) continue;
      g.strokeStyle = muted;
      g.lineWidth = 1;
      g.setLineDash([2, 3]);
      g.beginPath();
      g.moveTo(LEFT, y(m));
      g.lineTo(LEFT + plotW, y(m));
      g.stroke();
      g.setLineDash([]);
      g.fillStyle = muted;
      g.textAlign = "right";
      g.fillText(`しきい値 ${m}`, LEFT + plotW - 2, Math.max(top + 6, y(m) - 6));
      g.textAlign = "left";
    }
    g.strokeStyle = s.color || colors[i % colors.length];
    g.lineWidth = 2;
    g.beginPath();
    let started = false;
    let prevY = null;
    for (const smp of vis) {
      const v = smp[s.name];
      if (typeof v !== "number") continue;
      const px = x(smp.t);
      const py = y(v);
      if (!started) {
        g.moveTo(px, py);
        started = true;
      } else if (s.step) {
        g.lineTo(px, prevY);
        g.lineTo(px, py);
      } else g.lineTo(px, py);
      prevY = py;
    }
    g.stroke();
  });
  // 時間の目もり
  const axisY = series.length * LANE_H;
  g.strokeStyle = grid;
  g.lineWidth = 1;
  g.fillStyle = muted;
  g.font = `12px ${font}`;
  g.textBaseline = "top";
  const stepT = t1 - t0 > 60 ? 10 : 5;
  for (let t = Math.ceil(t0 / stepT) * stepT; t <= t1 + 1e-9; t += stepT) {
    const px = x(t);
    g.beginPath();
    g.moveTo(px, 0);
    g.lineTo(px, axisY);
    g.stroke();
    g.fillText(`${t}秒`, px - 10, axisY + 6);
  }
  if (markT !== null && markT >= t0) {
    const bad = css("--bad", "#b3261e");
    // 不合格になった時刻の印（線の上に「× 9.7秒」）
    g.font = `bold 12px ${font}`;
    g.textBaseline = "top";
    const lab = `× ${Math.round(markT * 10) / 10}秒 不合格`;
    const lw = g.measureText(lab).width;
    const lx = x(markT) + 4 + lw > width - 2 ? x(markT) - 4 - lw : x(markT) + 4;
    g.fillStyle = css("--surface-1", "#fff");
    g.fillRect(lx - 2, 1, lw + 4, 15);
    g.fillStyle = bad;
    g.fillText(lab, lx, 2);
    g.strokeStyle = bad;
    g.lineWidth = 2;
    g.setLineDash([4, 3]);
    g.beginPath();
    g.moveTo(x(markT), 0);
    g.lineTo(x(markT), axisY);
    g.stroke();
    g.setLineDash([]);
  }
}

return { drawChart };
})();

const __m_js_autosave_js = (() => {

// 書いた文（ふりかえり・改善メモ）を自動で保存する（ほかの教材と同じ決まり）
// ・書いているあいだは、手を止めて約0.4秒たったら保存する
// ・ページ（場面）を移るとき、ページを閉じるときにも、まだ保存していない文を保存する
// 保存の中身は「保存」ボタンを押したときと同じ（同じ場所に入り、書き出しにも入る）。DOM の要素を直接は作らない。

const AUTOSAVE_HINT = "書いた文は、自動でこの端末に保存されます。";
const AUTOSAVE_DONE = "保存しました";

const pending = new Set();

// el: textarea など（value と "input" イベントがあるもの） / save(text): 保存する関数
// 返り値: いますぐ保存する関数（保存していない文がなければ何もしない）
function attachAutosave(el, save, { delay = 400, onSaved } = {}) {
  let timer = null;
  const flush = () => {
    if (timer === null) return false;
    clearTimeout(timer);
    timer = null;
    pending.delete(flush);
    save(el.value);
    onSaved?.();
    return true;
  };
  el.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(flush, delay);
    pending.add(flush);
  });
  return flush;
}

// まだ保存していない文を、すべていますぐ保存する（ページを移るとき・閉じるとき）
function flushAutosaves() {
  for (const f of [...pending]) f();
}

return { AUTOSAVE_HINT, AUTOSAVE_DONE, attachAutosave, flushAutosaves };
})();

// ---------------- 場面（エディタ・仮想世界・デバッグ・テスト） ----------------
function renderScenario(sid) {
  const s = scenarios.find((x) => x.id === sid);
  if (!s) {
    location.hash = "#/";
    return;
  }
  const model = MODELS[s.model];
  const device = model.device;
  const outputNames = new Set(device.outputs.map((o) => o.name));

  // プログラムの状態
  let text = store.getProgram(s.id) ?? s.starter;
  let first = compile(text, device);
  let program = first.errors.length && !first.program.length ? compile(s.starter, device).program : first.program;
  let errors = first.errors;
  // テキストにまちがいがあって、ブロックがまちがえる前のプログラムのままのとき true（ブロックでは直せないようにする）
  let textBroken = first.errors.length > 0;
  if (!undoHistories.has(s.id)) undoHistories.set(s.id, [text]);
  const history = undoHistories.get(s.id);
  if (history.at(-1) !== text) history.push(text);
  let editorTab = store.pref("editorTab") || "blocks";

  // シミュレーションの状態
  const manual = Object.fromEntries(model.env.map((e) => [e.name, e.default]));
  let caseId = "manual";
  let sim = null;
  let running = false;
  let speed = 1;
  let raf = null;
  let lastTs = null;
  let acc = 0;
  let lastChart = 0;
  let chartAll = false;
  let failMarkT = null; // ケース再生で不合格になった時刻（グラフに赤い点線をかく）
  let soundOn = false;
  let audio = null;
  let lastResults = null;
  let resultsStale = false;

  // ---- 見出し ----
  const deviceList = h(
    "div",
    { class: "device-list" },
    device.sensors.length ? h("div", {}, h("h3", {}, "センサ（入力）"), h("ul", {}, device.sensors.map((x) => h("li", {}, h("code", {}, x.name), "：", x.note)))) : h("div", {}, h("h3", {}, "センサ（入力）"), h("p", {}, "なし（時間で切りかえる）")),
    h("div", {}, h("h3", {}, "出力（制御するもの）"), h("ul", {}, device.outputs.map((x) => h("li", {}, h("code", {}, x.name), "：", x.note)))),
  );
  // 場面の説明は、はじめて開いたときだけ開いておく（2回目からはたたんで、プログラムとテストを上に出す）
  const seen = store.pref("seenScenes") || [];
  const firstVisit = !seen.includes(s.id);
  if (firstVisit) store.setPref("seenScenes", [...seen, s.id]);
  const head = h(
    "section",
    { class: "card scn-head" },
    h("div", { class: "scn-title-row" }, h("h1", {}, h("span", { "aria-hidden": "true" }, s.icon, " "), `${s.label} ${s.title}`), s.time ? h("span", { class: "scn-time" }, `目安 ${s.time}（${s.period}時間目）`) : null),
    h("p", { class: "scn-goal" }, h("strong", {}, "めあて："), s.goal),
    h(
      "details",
      { class: "scn-story", open: firstVisit ? "open" : null },
      h("summary", {}, "場面の説明（お話・しくみの図・使えるセンサと出力）"),
      h("p", {}, s.story),
      flowDiagram(s.flow.split("→").map((x) => x.trim())),
      h("div", { class: "dev-details" }, h("h2", { class: "dev-title" }, "使えるセンサと出力"), deviceList),
    ),
    h("details", { class: "hints" }, h("summary", {}, "ヒントを見る"), h("ol", {}, s.hints.map((x) => h("li", {}, x)))),
  );

  // ---- エディタ ----
  const blockEd = createBlockEditor(device, () => programChanged("blocks"), () => {
    // ブロックの数の欄に読めない文字があるときは、まちがいの箱に出して、テストと実行を止める
    errors = [...validate(program, device).errors, ...blockEd.inputErrors()];
    showErrors();
  });
  blockEd.setProgram(program, { memoCursor: true });
  const flowBox = h("div", { class: "flow-box" });
  const ta = h("textarea", { class: "code", spellcheck: "false", wrap: "off", "aria-label": "プログラム（テキスト）", autocapitalize: "off", autocomplete: "off" });
  const gutter = h("div", { class: "gutter", "aria-hidden": "true" });
  const textWrap = h("div", { class: "code-wrap" }, gutter, ta);
  const errBox = h("div", { class: "err-box", "aria-live": "polite" });
  const edBody = h("div", { class: "editor-body" });
  const edTabs = h("div");
  let textTimer = null;

  ta.addEventListener("input", () => {
    updateGutter();
    clearTimeout(textTimer);
    textTimer = setTimeout(() => applyText(ta.value), 400);
  });
  ta.addEventListener("scroll", () => (gutter.scrollTop = ta.scrollTop));
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Tab" && !e.shiftKey) {
      e.preventDefault();
      const { selectionStart: a, selectionEnd: b } = ta;
      ta.setRangeText("  ", a, b, "end");
      ta.dispatchEvent(new Event("input"));
    }
  });
  function updateGutter() {
    const n = ta.value.split("\n").length;
    gutter.replaceChildren(...Array.from({ length: n }, (_, i) => h("div", { "data-line": i + 1 }, i + 1)));
    highlight();
  }

  function applyText(t, fromUndo = false) {
    text = t;
    store.setProgram(s.id, text);
    const c = compile(text, device);
    errors = c.errors;
    textBroken = errors.length > 0;
    if (!fromUndo && history.at(-1) !== text) history.push(text);
    if (history.length > 60) history.shift();
    if (!errors.length) {
      program = c.program;
      blockEd.setProgram(program);
      afterProgramChange();
    } else showErrors();
  }

  function programChanged(from) {
    textBroken = false;
    text = programToText(program);
    store.setProgram(s.id, text);
    if (history.at(-1) !== text) history.push(text);
    errors = [...validate(program, device).errors, ...blockEd.inputErrors()];
    afterProgramChange(from);
  }

  function afterProgramChange(from) {
    showErrors();
    if (lastResults) {
      resultsStale = true;
      renderResults();
    }
    newSim();
    if (editorTab === "flow") renderFlow();
    if (editorTab === "text" && from === "blocks") {
      ta.value = text;
      updateGutter();
    }
  }

  function showErrors() {
    if (!errors.length) {
      // まちがいではないが、出力に合わない言葉（ドア = オフ など）を使っているときの注意
      const warns = outputWordWarnings(program, device);
      errBox.replaceChildren(...(warns.length ? [explainCard("注意", h("ul", {}, warns.slice(0, 4).map((w) => h("li", {}, w.message))), "warn")] : []));
      return;
    }
    errBox.replaceChildren(
      explainCard(
        textBroken ? "テキストにまちがいがあります（直すまで、前のプログラムのまま動きます）" : "まちがいがあります",
        h("ul", {}, errors.slice(0, 6).map((e) => h("li", {}, e.message))),
        "bad",
      ),
    );
  }

  function renderFlow() {
    flowBox.innerHTML = flowchartSvg(program, outputNames);
    highlight();
  }

  function setEditorTab(t) {
    editorTab = t;
    store.setPref("editorTab", t);
    edTabs.replaceChildren(tabs([["blocks", "ブロック"], ["flow", "フローチャート"], ["text", "テキスト"]], t, setEditorTab, "プログラムの見方"));
    if (t === "blocks") {
      blockEd.render();
      showBlocks();
    } else if (t === "flow") {
      renderFlow();
      edBody.replaceChildren(h("p", { class: "hint" }, "フローチャートはプログラムから自動でかかれます。直すときは「ブロック」か「テキスト」で。"), flowBox);
    } else {
      ta.value = text;
      edBody.replaceChildren(textWrap);
      updateGutter();
    }
    showErrors();
    highlight();
  }

  // テキストにまちがいがあるままブロックを見たとき: どちらが今のプログラムかを知らせ、ブロックでは直せないようにする
  // （ブロックを変えると、テキストの書きかけが上書きされて消えてしまうため）
  function showBlocks() {
    blockEd.el.inert = textBroken;
    blockEd.el.classList.toggle("locked", textBroken);
    if (!textBroken) {
      edBody.replaceChildren(blockEd.el);
      return;
    }
    const note = explainCard(
      "テキストにまちがいがあります",
      h(
        "div",
        {},
        h("p", {}, "下のブロックは、まちがえる前のプログラムです（今のテキストとはちがいます）。テキストを直すか、テキストの書きかけをやめてブロックで続けるかをえらぼう。"),
        h("ul", {}, errors.slice(0, 3).map((e) => h("li", {}, e.message))),
        h(
          "div",
          { class: "btn-row" },
          h("button", { type: "button", class: "btn small", onclick: () => setEditorTab("text") }, "テキストにもどって直す"),
          h("button", { type: "button", class: "btn secondary small", onclick: () => {
            if (!confirm("テキストの書きかけを消して、下のブロックのプログラムにします。いいですか？（「元にもどす」で書きかけにもどせます）")) return;
            applyText(programToText(program));
            setEditorTab("blocks");
          } }, "書きかけをやめて、ブロックで続ける"),
        ),
      ),
      "warn",
    );
    edBody.replaceChildren(note, blockEd.el);
  }

  const undoBtn = h("button", { type: "button", class: "btn secondary small", onclick: () => {
    if (history.length < 2) return toast("これ以上もどせません");
    history.pop();
    const prev = history.at(-1);
    applyText(prev, true);

    gutter.querySelectorAll(".current").forEach((x) => x.classList.remove("current"));
    const node = findNode(id);
    if (node?.line && editorTab === "text") gutter.querySelector(`[data-line="${node.line}"]`)?.classList.add("current");
  }

  function refreshAll(force = false) {
    refreshWorld();
    refreshState();
    highlight();
    renderChart(force);
    renderLog();
    if (force && !running) nextEl.replaceChildren();
    updateSound();
  }

  function updateSound() {
    const want = soundOn && running && sim && sim.outputs.ブザー;
    if (want && !audio) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = 880;
        gain.gain.value = 0.05;
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        audio = { ctx, osc };
      } catch {
        audio = null;
      }
    } else if (!want && audio) {
      audio.osc.stop();
      audio.ctx.close();
      audio = null;
    }
  }

  // ---- 組み立て ----
  view.replaceChildren(head, h("div", { class: "workbench" }, editorCard, worldCard), debugCard, testCard);
  buildManual();
  setEditorTab(editorTab);
  newSim();
  setDebugTab("graph");
  renderHistory();
  // 前に書いた改善メモを、ページを開き直しても続きから書けるように出す
  const lastRec = s.tests.length ? store.recordsOf(s.id).at(-1) : null;
  if (lastRec) renderMemo(lastRec, true);
  showErrors();

  const onResize = () => renderChart(true);
  window.addEventListener("resize", onResize);
  cleanup = () => {
    pause();
    soundOn = false;
    updateSound();
    window.removeEventListener("resize", onResize);
  };
}

// 先生用ページへのかくれた入り口: 文字の欄の外で t e a c h e r と打つ
function setupTeacherKeys() {
  const word = "teacher";
  let typed = "";
  window.addEventListener("keydown", (e) => {
    const t = e.target;
    if (e.ctrlKey || e.metaKey || e.altKey || (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))) return;
    if (e.key.length !== 1) return;
    typed = (typed + e.key.toLowerCase()).slice(-word.length);
    if (typed === word) {
      typed = "";
      location.hash = "#/teacher";
    }
  });
}

// ---------------- 左メニュー（ほかの教材と同じ形） ----------------
// 「信号機（時間で切りかえ）」の（…）は、メニューを細くしたときにかくせるように分けておく
function navTitle(title) {
  const m = /^(.+?)(（.+）)$/.exec(title);
  return m ? [m[1], h("span", { class: "nav-sub" }, m[2])] : [title];
}

function renderNav(current) {
  const link = (href, num, title, id, done) =>
    h(
      "li",
      { class: done ? "done" : "" },
      h("a", { href, "aria-current": current === id ? "page" : null }, h("span", { class: "num", "aria-hidden": "true" }, done ? "✓" : num), h("span", { class: "nav-title" }, ...navTitle(title), done ? h("span", { class: "visually-hidden" }, "（全部合格）") : null)),
    );
  const group = (title) => h("li", { class: "nav-group", "aria-hidden": "true" }, title);
  const ol = h("ol");
  ol.append(link("#/", "⌂", "はじめに", "", false));
  ol.append(group("場面"));
  for (const s of scenarios) {
    const best = store.best(s.id);
    ol.append(link(`#/s/${s.id}`, s.num, s.title, `s/${s.id}`, Boolean(s.tests.length && best && best.passed === best.total)));
  }
  ol.append(group("調べる・記録する"));
  ol.append(link("#/guide", "?", "書き方ガイド", "guide", false));
  ol.append(link("#/records", "✎", T_REC, "records", false));
  nav.replaceChildren(h("nav", { "aria-label": "ページ" }, ol));
}

// ---------------- ルーティング ----------------
function route() {
  flushAutosaves(); // ページを移る前に、まだ保存していない文を保存する
  cleanup?.();
  cleanup = null;
  const [page = "", arg] = location.hash.replace(/^#\/?/, "").split("/");
  renderNav(page === "s" ? `s/${arg}` : page);
  if (page === "s") {
    const sc = scenarios.find((x) => x.id === decodeURIComponent(arg || ""));
    renderScenario(decodeURIComponent(arg || ""));
    if (sc) view.append(reflectionBox(sc));
  }
  else if (page === "guide") renderGuide();
  else if (page === "records") renderRecords();
  else if (page === "teacher") renderTeacher();
  else renderHome();
  // 場面のページだけ、タブレット横では左のメニューを細くして、プログラムと仮想世界を広くする
  document.querySelector(".layout")?.classList.toggle("scn-mode", page === "s");
  window.scrollTo(0, 0);
}

function setupToggles() {
  const box = document.getElementById("display-toggles");
  const apply = () => document.documentElement.classList.toggle("large-text", Boolean(store.pref("largeText")));
  // 文字の大きさ: 4分野共通の「文字 中/大」ボタン(shared/eduit-frame.css の .ef-size)
  const b = h("button", { type: "button", class: "ef-btn ef-size", "data-kz-label": "大きな文字", "aria-label": "文字の大きさ(大きな文字)", "aria-pressed": store.pref("largeText") ? "true" : "false" }, "文字 ", h("span", { class: "ef-size-v" }));
  b.addEventListener("click", () => {
    store.setPref("largeText", !store.pref("largeText"));
    b.setAttribute("aria-pressed", store.pref("largeText") ? "true" : "false");
    apply();
  });
  box.replaceChildren(b);
  apply();
}

async function start() {
  try {
    scenarios = (await loadData("scenarios")).scenarios;
    // 画面に出す番号は丸数字（①〜④ 基本編、⑤ 発展編）。num は並びの番号
    for (const s of scenarios) s.label = "①②③④⑤⑥⑦⑧⑨"[s.num - 1] || String(s.num);
  } catch (e) {
    view.replaceChildren(h("p", {}, "データを読み込めませんでした。単一ファイル版（dist/計測制御シミュレータ.html）を使うか、Webサーバー経由で開いてください。"));
    return;
  }
  setupToggles();
  setupTeacherKeys();
  // 上の見出し（app-header）の高さ。ブロックの命令ボタンを、スクロールしてもその下に残すために使う
  const header = document.querySelector(".app-header");
  const setHeaderH = () => document.documentElement.style.setProperty("--header-h", `${header?.offsetHeight || 0}px`);
  setHeaderH();
  if (header && "ResizeObserver" in window) new ResizeObserver(setHeaderH).observe(header);
  window.addEventListener("hashchange", route);
  // ページを閉じる・ほかのページへ行く・アプリを切りかえるときにも、書いた文を保存する
  window.addEventListener("pagehide", flushAutosaves);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") flushAutosaves();
  });
  route();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
}

start();

return {  };
})();
</script>
