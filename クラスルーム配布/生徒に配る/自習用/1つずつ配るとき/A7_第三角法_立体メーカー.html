<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第三角法 立体メーカー</title>
<meta name="theme-color" content="#8a5a2b">
<style>
/* Edu-IT 共通の見た目(4分野・全アプリ共通)
 * 見た目は案1「教科書の目次」: 白地・黒の細い線・角なし・影なし・絵文字なし。色は分野の色を、記号・開いているタブの下線・ON の下線にだけ使う。
 *
 * このファイルは3つの層の、上の2つ。
 *   ① 設定(トークン) … 色・文字・余白・線・はばの「値」はここにだけ書く。教材の CSS は var(--ef-…) で使う
 *   ② 共通の部品     … ボタン・箱・注意の箱・ラベル・入力欄・表・タブ など。教材はクラス名を付けるだけ
 *   ③ 教材だけの見た目 … 各教材の CSS。図・盤面・シミュレーションの絵だけ。図の色は教材の CSS の上で --fig-… の名前を付ける
 * 部品の見本は shared/ef-mihon.html。決まりに合っているかは python3 shared/style-check.py で調べる。
 *
 * 目次
 *   1. 設定(トークン)と分野の色
 *   2. 文字と中身の基本(.ef-main の中の見出し・文・入力欄)
 *   3. 部品(ボタン・箱・注意・ラベル・えらぶボタン・クイズの答え・表・結果の数字・進み具合・小さな切りかえ)
 *   4. 上のバー・メニュー・アプリのタブ・フッター・ダイアログ
 *   5. 自習ガイド・まず考えよう・振り返りを隠す設定
 *   6. はばに合わせた形(せまい画面・スマホ)と印刷
 */


/* ======================================================================
 * 1. 設定(トークン)と分野の色
 *    色をあとで変えたいときは、ここの1行を変えれば全分野が変わる。
 * ====================================================================== */
:root {
  color-scheme: light;        /* 端末がダークモードでも、明るい画面で出す */

  /* 地・面・線・文字 */
  --ef-bg: #ffffff;           /* 画面の地 */
  --ef-surface: #ffffff;      /* 箱・カード・上のバー */
  --ef-surface-2: #f7f7f5;    /* 一段下げた面(押したとき・表の見出し) */
  --ef-line: #c8c8c8;         /* 細い区切りの線・箱の枠 */
  --ef-ink: #222222;          /* 黒の線(上のバーの下・見出しの下・ボタンの枠)と、黒でぬるボタン */
  --ef-ink-hover: #444444;    /* 黒でぬるボタンにマウスをのせたとき */
  --ef-on-ink: #ffffff;       /* 黒・分野の色でぬった上の字 */
  --ef-text: #222222;         /* ふだんの字 */
  --ef-muted: #565d68;        /* 説明の字 */
  --ef-focus: #f08c00;        /* キーボード操作の枠 */
  --ef-backdrop: rgba(0, 0, 0, .4);  /* ダイアログのうしろ */

  /* 分野の色(既定は D。下の data-ef-domain で切りかわる) */
  --ef-accent: #1a5fc8;
  --ef-accent-ink: #ffffff;
  --ef-accent-soft: #e6eefb;
  /* 発展の印(むらさき) */
  --ef-advanced: #5b3fa8;
  --ef-advanced-soft: #efeaf8;

  /* 状態の色(正解・まちがい・注意・お知らせ)。-soft はうすい地 */
  --ef-ok: #1f7a3a;   --ef-ok-soft: #e3f3e7;
  --ef-ng: #b3261e;   --ef-ng-soft: #fbe5e3;
  --ef-warn: #8a5a00; --ef-warn-soft: #fff4d6;
  --ef-info: #1a5fc8; --ef-info-soft: #eaf1fc;

  /* グラフの線の色(分野をまたいで同じ順に使う) */
  --ef-series-1: #1a5fc8;
  --ef-series-2: #b45309;
  --ef-series-3: #1f7a3a;
  --ef-series-4: #b3261e;
  --ef-series-5: #5b3fa8;

  /* 文字。--ef-fs は「文字 中」のボタンで変わる(EduitFrame.prefs)。見出しなどは em で --ef-fs からの倍にする */
  --ef-font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --ef-mono: "BIZ UDGothic", ui-monospace, "SFMono-Regular", Consolas, monospace;  /* プログラム・数字をそろえる所 */
  --ef-fs: 17px;
  --ef-fs-h1: 1.6em;
  --ef-fs-h2: 1.3em;
  --ef-fs-h3: 1.1em;
  --ef-fs-s: .88em;           /* 小さい字(説明・ラベル) */
  --ef-lh: 1.75;              /* 行の間 */
  --ef-lh-tight: 1.4;         /* 見出し・ボタンの行の間 */

  /* 余白(4・8・12・16・24・32px) */
  --ef-sp-1: 4px;
  --ef-sp-2: 8px;
  --ef-sp-3: 12px;
  --ef-sp-4: 16px;
  --ef-sp-5: 24px;
  --ef-sp-6: 32px;

  /* 線の太さ・角・影 */
  --ef-bw: 1px;               /* ふつうの線 */
  --ef-bw-strong: 2px;        /* 見出しの下・章の区切り */
  --ef-mark: 4px;             /* 開いているタブ・ON のボタンの下線、注意の箱の左の線 */
  --ef-radius: 0;
  --ef-radius-s: 0;
  --ef-shadow: none;

  /* 大きさ・はば */
  --ef-header-h: 52px;
  --ef-tap: 44px;             /* ボタン・入力欄の高さ(指で押しやすい大きさ) */
  --ef-tap-s: 36px;           /* 小さいボタン(.ef-btn.is-s) */
  --ef-tap-bar: 40px;         /* メニューの上のバーのボタン */
  --ef-read-w: 1040px;        /* 読む画面の中身のはば(.ef-main)。作業の画面(.ef-main.is-wide)は画面いっぱい */
}
:root[data-ef-domain="A"] { --ef-accent: #985a26; --ef-accent-soft: #f5e9dc; }  /* 材料と加工: 木の茶 */
:root[data-ef-domain="B"] { --ef-accent: #2e7d32; --ef-accent-soft: #e4f2e5; }  /* 生物育成: 緑 */
:root[data-ef-domain="C"] { --ef-accent: #b45309; --ef-accent-soft: #fbeedd; }  /* エネルギー変換: だいだい */
:root[data-ef-domain="D"] { --ef-accent: #1a5fc8; --ef-accent-soft: #e6eefb; }  /* 情報: 青 */
:root[data-ef-domain="G"] { --ef-accent: #0f766e; --ef-accent-soft: #e0f2ef; }  /* 技術分野のガイダンス(4分野の前): 青緑 */
:root[data-ef-domain="T"] { --ef-accent: #475569; --ef-accent-soft: #eef1f5; }  /* 教科書の順に進む学習コース(T-textbook/): 灰青 */
:root[data-ef-domain="M"] { --ef-accent: #9d174d; --ef-accent-soft: #fbe7ef; }  /* M 身の回りの技術さがし(各編のはじめ): 赤紫 */
:root[data-ef-domain="F"] { --ef-accent: #4338ca; --ef-accent-soft: #e8e8fb; }  /* F これからの技術ラボ(各編の最後): あい色 */
:root[data-ef-domain="Z"] { --ef-accent: #7c4a03; --ef-accent-soft: #f6ecdc; }  /* Z 学習を終えて(3年間のまとめ): こげ茶 */
/* くっきり(EduitFrame.prefs の kukkiri): 字と線を濃くする */
:root[data-ef-kukkiri="on"] { --ef-text: #000000; --ef-muted: #222222; --ef-line: #555555; --ef-surface-2: #ffffff; }


/* ======================================================================
 * 2. 文字と中身の基本
 *    教材の中身は <main class="ef-main"> に入れる(読む画面は 1040px まで真ん中、作業の画面は .is-wide で画面いっぱい)。
 *    中の見出し・文・リスト・入力欄は、クラスを付けなくてもこの形になる。
 *    文字の大きさ: EduitFrame.prefs を使うページ(<html data-ef-prefs>)は、<html> の字が --ef-fs になる。
 *    教材の CSS は字の大きさを rem・em で書く(px で書くと「文字 中」のボタンで変わらない)。
 * ====================================================================== */
html[data-ef-prefs] { font-size: var(--ef-fs); }
.ef-page { background: var(--ef-bg); color: var(--ef-text); font-family: var(--ef-font); }
.ef-main {
  box-sizing: border-box; max-width: var(--ef-read-w); margin: 0 auto; padding: var(--ef-sp-5) var(--ef-sp-6) var(--ef-sp-6);
  font-family: var(--ef-font); font-size: 1rem; line-height: var(--ef-lh); color: var(--ef-text);
}
.ef-main.is-wide { max-width: none; padding: var(--ef-sp-3) var(--ef-sp-4) var(--ef-sp-5); }
.ef-main h1, .ef-main h2, .ef-main h3 { margin: 1.4em 0 .5em; line-height: var(--ef-lh-tight); font-weight: 700; color: var(--ef-text); }
.ef-main h1 { font-size: var(--ef-fs-h1); margin-top: .4em; }
.ef-main h2 { font-size: var(--ef-fs-h2); padding-bottom: var(--ef-sp-1); border-bottom: var(--ef-bw-strong) solid var(--ef-ink); }
.ef-main h3 { font-size: var(--ef-fs-h3); }
.ef-main > :first-child { margin-top: 0; }
.ef-main p { margin: .5em 0; }
.ef-main ul, .ef-main ol { margin: .5em 0; padding-left: 1.5em; }
.ef-main li { margin: .2em 0; }
.ef-main small, .ef-small { font-size: var(--ef-fs-s); color: var(--ef-muted); }
.ef-main code, .ef-main kbd { font-family: var(--ef-mono); font-size: .95em; }
/* 入力欄: 灰の細い枠・高さ 44px。押している(フォーカス)ときは分野の色の枠 */
.ef-main :is(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]), select, textarea) {
  box-sizing: border-box; min-height: var(--ef-tap); padding: var(--ef-sp-2) var(--ef-sp-3);
  border: var(--ef-bw) solid var(--ef-ink); border-radius: 0; background: var(--ef-surface); color: var(--ef-text);
  font: inherit; line-height: var(--ef-lh-tight);
}
.ef-main textarea { width: 100%; line-height: var(--ef-lh); }
.ef-main :is(input, select, textarea):focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 1px; }
.ef-main :is(input[type=checkbox], input[type=radio], input[type=range]) { accent-color: var(--ef-accent); }
.ef-main label { line-height: var(--ef-lh-tight); }


/* ======================================================================
 * 3. 部品
 *    名前は ef- で始め、形のちがいは is-〜 で表す。書き方の見本は shared/ef-mihon.html。
 * ====================================================================== */

/* ---- ボタン ----
 * .ef-btn           ふつうのボタン(白地・黒の細い枠・角なし)
 * .ef-btn.is-s      小さいボタン(高さ 36px)
 * .ef-btn.is-on     ON の状態(下に分野の色の線)。aria-pressed="true" でも同じ
 * .ef-btn.is-danger 消す・取り消す(赤の字と枠)
 * .ef-btn-primary   いちばん大事な操作(はじめる・ひらく など。黒でぬる)
 */
.ef-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--ef-tap-bar); padding: 0 14px;
  border: var(--ef-bw) solid var(--ef-ink); border-radius: 0;
  background: var(--ef-surface); color: var(--ef-text);
  font: 600 15px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
  box-sizing: border-box; white-space: nowrap;
}
.ef-btn:hover { background: var(--ef-surface-2); }
/* ON は下に分野の色の太い線(ぬりつぶさない) */
.ef-btn.is-on, .ef-btn[aria-pressed="true"] { box-shadow: inset 0 calc(-1 * var(--ef-mark)) 0 var(--ef-accent); }
.ef-btn:disabled, .ef-btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; background: var(--ef-surface); }
.ef-btn.is-danger { color: var(--ef-ng); border-color: var(--ef-ng); }
.ef-btn.is-danger:hover { background: var(--ef-ng-soft); }
/* 中身の中のボタン(上のバーより大きく、字の大きさに合わせて大きくなる) */
.ef-main .ef-btn, .ef-box .ef-btn { min-height: var(--ef-tap); font-size: .94rem; }
.ef-btn.is-s, .ef-main .ef-btn.is-s { min-height: var(--ef-tap-s); padding: 0 10px; font-size: var(--ef-fs-s); }
.ef-back { color: var(--ef-text); border-color: transparent; background: none; }
.ef-back:hover { background: none; text-decoration: underline; }
/* 上のバーの表示の道具(4分野で同じ形)。ふりがな・くっきりは .ef-toggle(ON で ✓)、文字の大きさは .ef-size(EduitFrame.sizeButton) */
.ef-toggle[aria-pressed="true"]::before { content: "✓"; }
.ef-size .ef-size-v {
  display: inline-block; min-width: 1.4em; padding: 0 .1em;
  color: var(--ef-text); font-weight: 700; text-align: center; text-decoration: underline; text-underline-offset: 3px;
}
/* 「ふつう・大きい」の2段だけのとき: <button class="ef-btn ef-size" aria-pressed="false|true">文字 <span class="ef-size-v"></span></button>
 * (中身が空の .ef-size-v に「中」「大」を出す。ON でもボタンは塗らない) */
.ef-size[aria-pressed="true"] { background: var(--ef-surface); box-shadow: none; color: var(--ef-text); }
.ef-size[aria-pressed]::before { content: none; }
.ef-size[aria-pressed] .ef-size-v:empty::after { content: "中"; }
.ef-size[aria-pressed="true"] .ef-size-v:empty::after { content: "大"; }
/* タブの帯をスクロールで隠す(data-ef-autohide。隠すのは eduit-frame.js) */
[data-ef-autohide] { transition: transform .2s ease; }
[data-ef-autohide].ef-ah-hide { transform: translateY(var(--ef-ah-y, -110%)); }
@media (prefers-reduced-motion: reduce) { [data-ef-autohide] { transition: none; } }
.ef-btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--ef-tap); padding: 0 20px;
  border: var(--ef-bw) solid var(--ef-ink); border-radius: 0;
  background: var(--ef-ink); color: var(--ef-on-ink);
  font: 700 16px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
}
.ef-btn-primary:hover { background: var(--ef-ink-hover); }
.ef-btn-primary:disabled { opacity: .45; cursor: not-allowed; background: var(--ef-ink); }
.ef-main .ef-btn-primary, .ef-box .ef-btn-primary { font-size: 1rem; }
.ef-btn:focus-visible, .ef-btn-primary:focus-visible, .ef-about-link:focus-visible, .ef-dialog :focus-visible {
  outline: 3px solid var(--ef-focus); outline-offset: 2px;
}
/* ボタンをならべる行 */
.ef-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ef-sp-2); margin: var(--ef-sp-3) 0; }

/* ---- 箱 ----
 * <section class="ef-box"> <h3 class="ef-box-h">見出し</h3> … </section>
 * 白地・灰の細い線・影なし。.is-soft は一段下げた面(灰の地)、.is-accent は左に分野の色の線
 */
.ef-box {
  box-sizing: border-box; margin: var(--ef-sp-4) 0; padding: var(--ef-sp-4);
  background: var(--ef-surface); border: var(--ef-bw) solid var(--ef-line); border-radius: 0; box-shadow: none;
}
.ef-box.is-soft { background: var(--ef-surface-2); }
.ef-box.is-accent { border-left: var(--ef-mark) solid var(--ef-accent); }
.ef-box > :first-child { margin-top: 0; }
.ef-box > :last-child { margin-bottom: 0; }
.ef-box-h, .ef-main .ef-box-h {
  margin: 0 0 var(--ef-sp-2); padding: 0; border: 0;
  font-size: var(--ef-fs-h3); font-weight: 700; line-height: var(--ef-lh-tight); color: var(--ef-text);
}

/* ---- 注意・お知らせの箱 ----
 * <div class="ef-note is-warn">…</div>  左に 4px の線と、うすい地。
 * .is-warn 注意(黄)・.is-info お知らせ(青)・.is-ok よい(緑)・.is-ng 危ない(赤)。なしは分野の色の線と白地
 */
.ef-note {
  box-sizing: border-box; margin: var(--ef-sp-3) 0; padding: var(--ef-sp-2) var(--ef-sp-3);
  border: 0; border-left: var(--ef-mark) solid var(--ef-accent); border-radius: 0; background: var(--ef-surface);
  line-height: var(--ef-lh); color: var(--ef-text);
}
.ef-note > :first-child { margin-top: 0; }
.ef-note > :last-child { margin-bottom: 0; }
.ef-note.is-warn { border-left-color: var(--ef-warn); background: var(--ef-warn-soft); }
.ef-note.is-info { border-left-color: var(--ef-info); background: var(--ef-info-soft); }
.ef-note.is-ok { border-left-color: var(--ef-ok); background: var(--ef-ok-soft); }
.ef-note.is-ng { border-left-color: var(--ef-ng); background: var(--ef-ng-soft); }
.ef-note-k { display: block; font-weight: 700; }  /* 「注意」「ポイント」などの見出しの字 */
.ef-note.is-warn .ef-note-k { color: var(--ef-warn); }
.ef-note.is-info .ef-note-k { color: var(--ef-info); }
.ef-note.is-ok .ef-note-k { color: var(--ef-ok); }
.ef-note.is-ng .ef-note-k { color: var(--ef-ng); }

/* ---- 小さなラベル ----
 * <span class="ef-tag">切断</span>  白地に細い枠。.is-advanced 発展(むらさき)・.is-accent 分野の色・.is-ok / .is-ng / .is-warn
 */
.ef-tag {
  display: inline-flex; align-items: center; gap: .3em; padding: 0 .5em; vertical-align: .08em;
  border: var(--ef-bw) solid var(--ef-line); border-radius: 0; background: var(--ef-surface); color: var(--ef-text);
  font-size: var(--ef-fs-s); font-weight: 700; line-height: 1.6; white-space: nowrap;
}
.ef-tag.is-accent { border-color: var(--ef-accent); color: var(--ef-accent); }
.ef-tag.is-advanced { border-color: var(--ef-advanced); color: var(--ef-advanced); }
.ef-tag.is-ok { border-color: var(--ef-ok); color: var(--ef-ok); }
.ef-tag.is-ng { border-color: var(--ef-ng); color: var(--ef-ng); }
.ef-tag.is-warn { border-color: var(--ef-warn); color: var(--ef-warn); }

/* ---- 1つえらぶボタンの組 ----
 * <div class="ef-seg" role="group"> <button aria-pressed="true">回転</button> <button aria-pressed="false">往復</button> … </div>
 * えらんだもの(aria-pressed="true" か .is-on)は太字と分野の色の下線
 */
.ef-seg { display: inline-flex; flex-wrap: wrap; gap: 0; border: var(--ef-bw) solid var(--ef-ink); background: var(--ef-surface); }
.ef-seg > button {
  min-height: var(--ef-tap); padding: 0 14px; margin: 0; cursor: pointer;
  border: 0; border-right: var(--ef-bw) solid var(--ef-line); border-radius: 0; background: none; color: var(--ef-text);
  font: inherit; font-size: .94rem; line-height: var(--ef-lh-tight); white-space: nowrap;
}
.ef-seg > button:last-child { border-right: 0; }
.ef-seg > button:hover { background: var(--ef-surface-2); }
.ef-seg > button[aria-pressed="true"], .ef-seg > button.is-on { font-weight: 700; box-shadow: inset 0 calc(-1 * var(--ef-mark)) 0 var(--ef-accent); }
.ef-seg > button:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: -3px; }

/* ---- クイズの答え ----
 * <div class="ef-choices"> <button class="ef-choice">…</button> … </div>
 * 答えたあと、正解は .is-ok(○ と緑)、まちがいは .is-ng(× と赤)。色だけでなく ○ × の字も出す
 */
.ef-choices { display: flex; flex-direction: column; gap: var(--ef-sp-2); margin: var(--ef-sp-2) 0; }
.ef-choice {
  display: block; width: 100%; min-height: var(--ef-tap); padding: var(--ef-sp-2) var(--ef-sp-3); cursor: pointer; text-align: left;
  border: var(--ef-bw) solid var(--ef-line); border-radius: 0; background: var(--ef-surface); color: var(--ef-text);
  font: inherit; line-height: var(--ef-lh-tight);
}
.ef-choice:hover { border-color: var(--ef-ink); }
.ef-choice:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 1px; }
.ef-choice.is-ok { border-color: var(--ef-ok); background: var(--ef-ok-soft); font-weight: 700; }
.ef-choice.is-ok::before { content: "○ "; color: var(--ef-ok); }
.ef-choice.is-ng { border-color: var(--ef-ng); background: var(--ef-ng-soft); }
.ef-choice.is-ng::before { content: "× "; color: var(--ef-ng); }

/* ---- 表 ----
 * <table class="ef-table"> 見出しの行は灰の地、線は細い灰。はばが足りないときは <div class="ef-scroll"> で包むと、表だけ横にスクロールする
 */
.ef-table { border-collapse: collapse; margin: var(--ef-sp-3) 0; font-size: .94em; line-height: var(--ef-lh-tight); }
.ef-table th, .ef-table td { padding: var(--ef-sp-2) var(--ef-sp-3); border: var(--ef-bw) solid var(--ef-line); text-align: left; vertical-align: top; }
.ef-table th { background: var(--ef-surface-2); font-weight: 700; }
.ef-table .is-num { text-align: right; font-variant-numeric: tabular-nums; }
.ef-scroll { max-width: 100%; overflow-x: auto; }

/* ---- 結果の数字 ----
 * <div class="ef-result"> <span class="ef-result-k">たわみ</span> <span class="ef-result-v">1.05</span> <span class="ef-result-u">mm</span> </div>
 */
.ef-result { display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: .1em .4em; }
.ef-result-k { font-size: var(--ef-fs-s); font-weight: 700; color: var(--ef-muted); }
.ef-result-v { font-size: 1.6em; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--ef-text); }
.ef-result-u { font-size: .94em; color: var(--ef-muted); }
.ef-result.is-ok .ef-result-v { color: var(--ef-ok); }
.ef-result.is-ng .ef-result-v { color: var(--ef-ng); }

/* ---- 進み具合のバー ----
 * <div class="ef-progress"> <span class="ef-progress-t">必修 2/4</span> <span class="ef-progress-bar"><span style="width: 50%"></span></span> </div>
 */
.ef-progress { display: flex; align-items: center; gap: var(--ef-sp-2); font-size: var(--ef-fs-s); font-weight: 700; }
.ef-progress-bar { flex: 1; min-width: 4em; height: 8px; border: var(--ef-bw) solid var(--ef-ink); background: var(--ef-surface); }
.ef-progress-bar > span { display: block; height: 100%; background: var(--ef-accent); }

/* ---- タブの中の小さな切りかえ ----
 * <div class="ef-subtabs" role="tablist"> <button role="tab" aria-selected="true">…</button> … </div>
 * アプリのタブ(.ef-apptabs)と同じ「字＋下線」で、ひとまわり小さい
 */
.ef-subtabs { display: flex; flex-wrap: wrap; gap: 0 var(--ef-sp-4); margin: var(--ef-sp-2) 0 var(--ef-sp-3); border-bottom: var(--ef-bw) solid var(--ef-line); }
.ef-subtabs > button, .ef-subtabs > a {
  min-height: var(--ef-tap-s); padding: 0 var(--ef-sp-1); margin: 0 0 -1px; cursor: pointer;
  border: 0; border-bottom: var(--ef-mark) solid transparent; border-radius: 0; background: none; color: var(--ef-muted);
  font: inherit; font-size: .94em; font-weight: 700; text-decoration: none; white-space: nowrap;
}
.ef-subtabs > :hover { color: var(--ef-text); }
.ef-subtabs > [aria-selected="true"], .ef-subtabs > [aria-current], .ef-subtabs > .is-on { color: var(--ef-text); border-bottom-color: var(--ef-accent); }
.ef-subtabs > :focus-visible { outline: 3px solid var(--ef-focus); outline-offset: -3px; }

/* ---- 記号の印(A1・B2・C3・D4 など。メニューの上のバー・アプリの上のバー・切りかえボタン・カード) ---- */
.ef-code {
  display: inline-flex; align-items: center; justify-content: flex-start; min-width: 1.6em; padding: 0;
  background: none; color: var(--ef-accent);
  font: 700 1em/1.5 var(--ef-font); letter-spacing: .02em; white-space: nowrap; vertical-align: .05em;
}
.ef-btn .ef-code { font-size: 13px; min-width: 0; margin-right: 2px; }


/* ======================================================================
 * 4. 上のバー・メニュー・アプリのタブ・フッター・ダイアログ
 *    上のバー(ヘッダー)の字とボタンは、文字の大きさのボタンで変えない(px のまま)。
 * ====================================================================== */

/* ---- ヘッダー ----
 * メニュー:   <header class="ef-header"> <h1 class="ef-title"><span class="ef-code">A</span> 材料と加工の技術 教材集</h1>
 *               <div class="ef-tools"> ふりがな / 文字 中 / 使い方 / 先生用 </div> </header>   (4分野でこの4つだけ・字だけ)
 * アプリ:     下の .ef-appbar
 */
.ef-header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  min-height: var(--ef-header-h); padding: 6px 14px;
  background: var(--ef-surface); color: var(--ef-text);
  border-bottom: var(--ef-bw) solid var(--ef-ink);
  font-family: var(--ef-font);
  box-sizing: border-box;
}
.ef-title {
  display: flex; align-items: center; gap: 8px;
  margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--ef-text);
}
.ef-title .ef-icon { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; font-size: 22px; }
.ef-title .ef-sub { font-size: 13px; font-weight: 400; color: var(--ef-muted); }
.ef-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.ef-title .ef-code { font-size: 22px; min-width: 0; margin-right: 4px; }

/* ---- メニューのカード ----
 * <article class="ef-card"> <p class="ef-card-tag">A1</p> <h3 class="ef-card-title">…</h3> <p>…</p> <a class="ef-btn-primary">ひらく ▶</a> </article>
 * メニューのカードは EduitFrame.card() で作る(下の .ef-mcard)。
 */
.ef-card {
  background: var(--ef-surface); border: 0; border-top: var(--ef-bw-strong) solid var(--ef-ink); padding: 14px 4px;
}
.ef-card-tag { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ef-accent); }
.ef-card-title { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: var(--ef-text); }

/* EduitFrame.card が作るメニューのカード(4分野同じ形)
 * 教科書の目次のように1行ずつ: 左に記号、まん中に名前と説明、右に「ひらく ▶」。行の上下は細い線 */
.ef-mcard {
  display: grid; grid-template-columns: 4.2em minmax(0, 1fr) auto; column-gap: 16px; row-gap: 2px; align-items: baseline;
  padding: 14px 4px; border: 0; border-bottom: var(--ef-bw) solid var(--ef-line); border-radius: 0; box-shadow: none;
  cursor: pointer; font-family: var(--ef-font); color: var(--ef-text);
}
.ef-mcard:hover { background: var(--ef-surface-2); }
.ef-mcard-hd, .ef-mcard-ht { display: contents; }
.ef-mcard-ic { display: none; }
.ef-mcard > *, .ef-mcard-ht > * { grid-column: 2; }
.ef-mcard .ef-card-tag { grid-column: 1; grid-row: 1 / span 3; margin: 0; font-size: 1.35em; line-height: 1.2; }
.ef-mcard .ef-card-tag .ef-code { font-size: 1em; }
.ef-mcard .ef-card-title { margin: 0; font-size: 1.12em; line-height: 1.4; }
.ef-mcard-desc { margin: 0; font-size: .95em; line-height: 1.6; color: var(--ef-muted); }
.ef-mcard-extra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .88em; color: var(--ef-muted); }
.ef-mcard-go {
  grid-column: 3; grid-row: 1; align-self: baseline; min-height: 0; padding: 0; border: 0; background: none;
  color: var(--ef-accent); font-size: 15px; white-space: nowrap;
}
.ef-mcard-go:hover { background: none; text-decoration: underline; }
.ef-level-order { margin: -4px 0 12px; font-size: .95em; line-height: 1.6; }

/* ---- フッター(作成者・このアプリについて) ---- */
.ef-footer {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 14px;
  margin: 24px 0 0; padding: 12px 16px;
  border-top: var(--ef-bw) solid var(--ef-line); background: var(--ef-surface-2);
  font: 13px/1.6 var(--ef-font); color: var(--ef-muted);
}
.ef-footer .ef-author { font-weight: 700; color: var(--ef-text); }
.ef-about-link {
  border: 0; background: none; padding: 2px 4px; cursor: pointer;
  font: inherit; color: var(--ef-accent); text-decoration: underline;
}
/* ヘッダーなどに置く小さい「このアプリについて」ボタン */
.ef-about-btn { font-size: 14px; }

/* ---- このアプリについて(ダイアログ) ---- */
.ef-dialog {
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  padding: 0; border: var(--ef-bw) solid var(--ef-ink); border-radius: var(--ef-radius);
  background: var(--ef-surface); color: var(--ef-text); font: 15px/1.7 var(--ef-font);
  box-shadow: none;
}
.ef-dialog::backdrop { background: var(--ef-backdrop); }
.ef-dialog-in { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.ef-dialog-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: var(--ef-bw) solid var(--ef-ink); }
.ef-dialog-head h2 { margin: 0; font-size: 18px; flex: 1; }
.ef-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px 0; }
.ef-tab { border: 0; border-bottom: 3px solid transparent; background: none;
  padding: 6px 10px; font: 600 14px/1.3 var(--ef-font); color: var(--ef-muted); cursor: pointer; min-height: 36px; }
.ef-tab[aria-selected="true"] { color: var(--ef-text); border-bottom-color: var(--ef-accent); }
.ef-panel { padding: 14px 18px 18px; overflow: auto; border-top: var(--ef-bw) solid var(--ef-line); }
.ef-panel h3 { margin: 12px 0 4px; font-size: 16px; }
.ef-panel ul { margin: 4px 0 8px; padding-left: 1.3em; }
.ef-panel p { margin: 4px 0 8px; }
.ef-howto .ef-panel { border-top: 0; }
.ef-howto .ef-panel ol { margin: 4px 0 8px; padding-left: 1.5em; }
.ef-howto .ef-panel li { margin: 2px 0; }
.ef-hist-ver { font-weight: 700; color: var(--ef-accent); }
.ef-hist-date { color: var(--ef-muted); font-size: 13px; margin-left: 6px; }

/* ---- 基本編・発展編のタブ(メニュー。EduitFrame.levels が作る) ---- */
.ef-levels { margin: 0 0 18px; font-family: var(--ef-font); }
.ef-level-tabs { display: flex; gap: 24px; border-bottom: var(--ef-bw) solid var(--ef-line); }
.ef-level-tab {
  display: inline-flex; align-items: baseline; gap: 4px; min-height: 48px; padding: 8px 0; margin: 0 0 -1px;
  font: inherit; font-size: 1.15em; font-weight: 700 !important; color: var(--ef-muted) !important; cursor: pointer;
  background: none !important; border: 0 !important; border-bottom: 3px solid transparent !important; border-radius: 0 !important;
}
.ef-level-tab:hover { color: var(--ef-text) !important; }
/* 教材ごとのボタンの色指定(#hub button など)に負けないように !important にする */
.ef-level-tab[aria-selected="true"], .ef-level-tab[aria-selected="true"]:hover { color: var(--ef-text) !important; border-bottom-color: var(--ef-accent) !important; }
.ef-level-tab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }
.ef-level-count { font-size: .85em; font-weight: 700; }
.ef-level-count::before { content: "("; }
.ef-level-count::after { content: ")"; }
.ef-level-panel { padding: 12px 0 0; }
.ef-level-panel:focus { outline: none; }
.ef-level-lead { margin: 0 0 12px; color: var(--ef-muted); line-height: 1.6; }
.ef-level-advanced[aria-selected="true"], .ef-level-advanced[aria-selected="true"]:hover { border-bottom-color: var(--ef-advanced) !important; }
.ef-level-parts { margin: .3em 0 0; font-size: .9em; line-height: 1.5; color: var(--ef-text); }
.ef-level-parts summary { cursor: pointer; color: var(--ef-muted); }
.ef-level-parts p { margin: .2em 0 0; }
.ef-mcard-tb { margin: .3em 0 0; font-size: .85em; line-height: 1.5; color: var(--ef-muted); }
.ef-level-group { display: flex; align-items: baseline; gap: .7em; margin: 24px 0 0; padding: 0 0 6px; border-bottom: var(--ef-bw-strong) solid var(--ef-ink); font-size: 1.1em; color: var(--ef-text); }
.ef-level-group:first-of-type { margin-top: 4px; }
.ef-level-group-ch { font-size: .8em; font-weight: 700; color: var(--ef-accent); }
/* 区切りのはじめ・おわりの M・F へのリンクの行(EDUIT_INFO.textbook.links) */
.ef-level-link { margin: 6px 0 12px; line-height: 1.6; }
.ef-level-link a { display: inline-flex; align-items: center; gap: 8px; padding: 4px 0; color: var(--ef-text); text-decoration: none; font-weight: 600; }
.ef-level-link a:hover, .ef-level-link a:focus-visible { text-decoration: underline; }
.ef-level-link-go { color: var(--ef-accent); font-weight: 700; }
.ef-level-matome { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 14px; border: var(--ef-bw) solid var(--ef-ink); border-radius: 0; background: var(--ef-surface); color: var(--ef-text); font: inherit; cursor: pointer; text-align: left; }
.ef-level-matome:hover, .ef-level-matome:focus-visible { background: var(--ef-surface-2); }
.ef-level-matome-t { font-weight: 700; }
.ef-level-matome-d { color: var(--ef-muted); font-size: .92em; }
.ef-matome-score { font-weight: 700; }
.ef-matome-h { display: flex; align-items: center; gap: 6px; margin: 16px 0 4px; font-size: 1.05em; }
.ef-level-parts-k {
  display: inline-block; margin-right: .6em; padding: 0; font-size: .9em; font-weight: 700; color: var(--ef-text);
}

/* ---- メニューの中身の箱と、カードの並べ方(4分野共通) ----
 * メニューの中身(タブ・カード)を入れる箱は .ef-menu(はば 1040px まで・真ん中)。カードは EduitFrame.levels({ gridClass: 'ef-mgrid' }) で1列にならべる。 */
.ef-menu { max-width: var(--ef-read-w); margin: 0 auto; padding: 6px 32px 0; box-sizing: border-box; }
.ef-mgrid { display: flex; flex-direction: column; padding: 0 0 24px; }
.ef-mgrid > .ef-mcard { touch-action: manipulation; }
.ef-mgrid { border-top: var(--ef-bw) solid var(--ef-line); }
.ef-level-group + .ef-mgrid { border-top: 0; }
.ef-mgrid .ef-mcard-desc { line-height: 1.5; }

/* ---- アプリを開いたときの上のバー・教材の切りかえ・タブの帯(4分野共通) ----
 * <header class="ef-header ef-appbar">
 *   <a class="ef-btn ef-back">◀ メニュー</a>
 *   <h1 class="ef-title ef-apptitle">[A2] 木材の繊維・収縮ラボ</h1>   … はばが広いとき(1441px 以上)とスマホだけ出す
 *   <nav class="ef-switch"> <a class="ef-swchip" aria-current="page"><span class="ef-code">A2</span><span class="ef-sw-n">木材</span></a> … </nav>
 *   <div class="ef-tools"> ふりがな / 文字 中 / (くっきり) / (使い方) / <span data-ef-fs></span> 全画面 / <span data-ef-about></span> ⓘ </div>
 * </header>
 * <nav class="ef-apptabs"> <button class="ef-apptab" aria-selected="true">はじめに</button> … <div class="ef-apptabs-tools">使い方 記録</div> </nav>
 *   … アプリの中のタブ(字＋下線)。右はしにそのアプリの道具(使い方・記録など)を置くときは .ef-apptabs-tools に入れる
 * 開いている教材は名前も出し、ほかの教材は記号だけ(はばが 1441px 以上なら名前も)。スマホは1行目に ◀ メニューと名前、2行目に道具と切りかえ。
 */
.ef-appbar { min-height: 52px; padding: 0 6px; gap: 6px; flex-wrap: nowrap; }
.ef-appbar .ef-btn { min-height: 42px; padding: 0 12px; font-size: 15px; white-space: nowrap; flex: none; }
.ef-appbar .ef-tools { flex: none; flex-wrap: nowrap; }
.ef-appbar .ef-apptitle { margin: 0 6px 0 4px; font-size: 17px; white-space: nowrap; flex: none; }
.ef-appbar .ef-apptitle .ef-code { margin-right: 0; }
.ef-switch { display: flex; gap: 4px; flex: 1; min-width: 0; align-self: stretch; align-items: flex-end; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.ef-switch::-webkit-scrollbar { display: none; }
.ef-swchip {
  font: inherit; font-family: var(--ef-font); font-size: 15px; line-height: 1.2; color: var(--ef-muted); text-decoration: none;
  background: transparent; border: 0; border-bottom: var(--ef-mark) solid transparent; border-radius: 0;
  min-height: 44px; padding: 0 10px; margin-bottom: 1px; cursor: pointer; white-space: nowrap; flex: none;
  display: inline-flex; align-items: center; gap: 5px; touch-action: manipulation;
}
.ef-swchip:hover { color: var(--ef-text); border-bottom-color: var(--ef-line); }
.ef-swchip[aria-current="page"], .ef-swchip[aria-current="true"] { color: var(--ef-text); font-weight: 700; border-bottom-color: var(--ef-accent); }
.ef-swchip .ef-code { font-size: 13px; min-width: 0; margin: 0; }
.ef-swchip:focus-visible, .ef-apptab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: -3px; }
.ef-fs-btn[hidden] { display: none; }
.ef-apptabs {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 18px; padding: 0 14px;
  background: var(--ef-surface); border-bottom: var(--ef-bw) solid var(--ef-ink); font-family: var(--ef-font); box-sizing: border-box;
}
.ef-apptab {
  font: inherit; font-family: var(--ef-font); font-size: 15px; font-weight: 700; line-height: 1.3; text-decoration: none;
  flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; box-sizing: border-box;
  border: 0; border-bottom: var(--ef-mark) solid transparent; border-radius: 0; background: none; cursor: pointer; white-space: nowrap; touch-action: manipulation;
  color: var(--ef-muted);
}
.ef-apptab:hover { color: var(--ef-text); border-bottom-color: var(--ef-line); }
.ef-apptab[aria-selected="true"], .ef-apptab[aria-current="page"], .ef-apptab[aria-current="true"], .ef-apptab.is-on {
  color: var(--ef-text); border-bottom-color: var(--ef-accent);
}
.ef-apptab[aria-selected="true"] rt, .ef-apptab[aria-current] rt, .ef-apptab.is-on rt { color: inherit; }
.ef-apptab.is-advanced { color: var(--ef-advanced); }  /* 発展のタブ(字だけむらさき。開いたときの下線は分野の色) */
.ef-apptab.is-done::after { content: " ✓"; }        /* 書き終えたページ */
/* タブの帯の右はしの道具(使い方・記録・音 など) */
.ef-apptabs-tools { display: flex; align-items: center; gap: 6px; margin-left: auto; padding: 4px 0; }


/* ======================================================================
 * 5. 自習ガイド・まず考えよう・振り返りを隠す設定
 * ====================================================================== */

/* 振り返りを隠す設定(EduitFrame.furikaeri)。振り返りのタブ・欄・印には data-ef-reflect を付ける */
html[data-ef-furikaeri="off"] [data-ef-reflect] { display: none !important; }

/* ---- 自習ガイド(自習モードのとき。EduitFrame が作る) ----
 * .ef-jishu-fab  右はしのたてのボタン「自習ガイド 2/5」
 * .ef-jishu      右に開くパネル(スマホは下から出る)。教材を操作しながら読めるように、まわりを暗くしない
 */
.ef-jishu-fab {
  position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 2147483000;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 7px; border: var(--ef-bw) solid var(--ef-ink); border-right: 0; border-radius: 0;
  background: var(--ef-ink); color: var(--ef-on-ink); cursor: pointer;
  font: 700 15px/1.2 var(--ef-font);
}
.ef-jishu-fab-t { display: block; width: 1.05em; line-height: 1.15; word-break: break-all; text-align: center; }  /* 1字ずつ縦にならべる(writing-mode だと字が重なる端末がある) */
.ef-jishu-fab-p { font-size: 12px; font-weight: 700; padding: 1px 0; }
.ef-jishu-fab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }
html.ef-jishu-open .ef-jishu-fab { display: none; }
.ef-jishu {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 2147483001;
  width: min(380px, 100vw); display: flex; flex-direction: column; box-sizing: border-box;
  background: var(--ef-surface); color: var(--ef-text); border-left: var(--ef-bw) solid var(--ef-ink);
  font: 15px/1.65 var(--ef-font); font-size: max(15px, .95rem); text-align: left;
}
.ef-jishu[hidden] { display: none; }
.ef-jishu *, .ef-jishu *::before { box-sizing: border-box; }
.ef-jishu-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: var(--ef-bw) solid var(--ef-ink); }
.ef-jishu rt { display: ruby-text !important; font-size: .55em; font-weight: 400; }  /* 教材のふりがなをオフにしても、ガイドのふりがなはガイドのボタンで決める */
.ef-jishu-head h2 { flex: 1; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 0; font-size: 16px; line-height: 1.35; }
.ef-jishu-k { color: var(--ef-accent); }
.ef-jishu-name { font-weight: 700; }
.ef-jishu-body { flex: 1; overflow-y: auto; padding: 4px 14px 24px; overscroll-behavior: contain; }

  // ---- 表示の設定(文字の大きさ・ふりがな・くっきり。全教材で1つ) ----

  // ---- タブの帯をスクロールで隠す([data-ef-autohide]。下へ読み進めると隠れ、上へ戻すと出る) ----

        // 横長の帯だけを隠す。PC の左のメニュー(画面のはばの半分より細い)は、いつも見えるように残す

  };
  function letsCard(id) {
    var d = LETS[id];
    if (!d) return null;
    return el('section', { class: 'ef-lets', 'aria-label': 'まず考えよう' }, [
      el('p', { class: 'ef-lets-k', text: 'まず考えよう' }),
      el('p', { class: 'ef-lets-q', text: d.q }),
      d.hint ? el('details', { class: 'ef-lets-hint' }, [el('summary', { text: 'ヒント' }), el('p', { text: d.hint })]) : null
    ]);
  }
  // data-ef-lets の置き場所にカードを入れる(あとから作られた画面にも入れる)
  function fillLets() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-ef-lets]:not([data-ef-lets-done])'), function (box) {
      box.setAttribute('data-ef-lets-done', '');
      var c = letsCard(box.getAttribute('data-ef-lets'));
      if (c) box.appendChild(c);
    });
  }
  var letsTimer = 0;
  function watchLets() {
    fillLets();
    if (!window.MutationObserver) return;
    new MutationObserver(function () {
      if (letsTimer) return;
      letsTimer = setTimeout(function () { letsTimer = 0; fillLets(); }, 0);
    }).observe(document.documentElement, { childList: true, subtree: true });
  }

  // ---- 字だけの表示(見た目 案1「教科書の目次」) ----
  // ボタン・見出し・説明の文についた絵文字をとる。字の記号にできるもの(✅ → ✓ など)は字の記号にする。
  // 絵文字だけの部分は、2つ外までの要素に字があれば(「💾<span>記録</span>」など)とり、なければ(部品の絵・盤面の絵など)そのまま。絵として残したい所には data-ef-emoji を付ける。
  var VS_TEXT = '\uFE0E';  // 字の形で出す(色の絵にしない)しるし
  // 絵文字だけの所でも字の記号にするもの: ✅✔→✓ ☑ ⭕→○ ❌✖❎→× ⬜→□ ⚠ ➡⬅⬆⬇→矢印 ▶ ◀
  var EMOJI_TO_TEXT = {
    '\u2705': '\u2713', '\u2714': '\u2713', '\u2611': '\u2611' + VS_TEXT, '\u2B55': '\u25CB', '\u274C': '\u00D7', '\u2716': '\u00D7', '\u274E': '\u00D7',
    '\u2B1C': '\u25A1', '\u26A0': '\u26A0' + VS_TEXT, '\u27A1': '\u2192', '\u2B05': '\u2190', '\u2B06': '\u2191', '\u2B07': '\u2193', '\u25B6': '\u25B6' + VS_TEXT, '\u25C0': '\u25C0' + VS_TEXT
  };
  var EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u2600-\u27BF\u2B00-\u2BFF\u231A-\u23FF\u2190-\u21FF\u25A0-\u25FF](?:\uFE0F|\uFE0E|[\u{1F3FB}-\u{1F3FF}])?(?:\u200D[\u{1F000}-\u{1FAFF}\u2600-\u27BF]\uFE0F?)*/gu;
  var KEEP_RE = /^[\u2190-\u21FF\u25A0-\u25FF\u2605\u2606\u2713\u2717\u2715\u270E\u2661\u2610]$/;  // 矢印・■□○△・★☆・✓✗✕・✎・♡・☐ はもとから字の記号なので残す
  var LETTER_RE = /[0-9A-Za-z\u3040-\u30FF\u3400-\u9FFF\uFF10-\uFF5A]/;
  var CUT = '\u0000';
  // t の中か、t をすぐに包む要素(ボタン・見出しなど)に字があれば、絵文字は飾りなのでとる
  function plainText(t, around) {
    var deco = LETTER_RE.test(t) || !!(around && LETTER_RE.test(around));
    var r = t.replace(EMOJI_RE, function (m) {
      var b = m.replace(/[\uFE0E\uFE0F\u200D]|[\u{1F3FB}-\u{1F3FF}]/gu, '');
      if (EMOJI_TO_TEXT[b] != null) return EMOJI_TO_TEXT[b];
      if (KEEP_RE.test(b) || !deco) return m;
      return CUT;
    });
    if (r.indexOf(CUT) < 0) return r;
    return r.replace(/\u0000[ \u3000]?/g, '').replace(/[ \u3000]\u0000/g, '');
  }
  // 絵文字だけの所のまわりの字: 2つ外の要素まで見る(「<button><span class="ic">💾</span>記録</button>」など)
  function around(p) {
    for (var k = 0; k < 2 && p; k++, p = p.parentElement) if (LETTER_RE.test(p.textContent)) return p.textContent;
    return '';
  }
  var SKIP_TAGS = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, INPUT: 1, CODE: 1, PRE: 1, IFRAME: 1 };
  function plainNode(n) {
    if (n.nodeType === 3) {
      var p = n.parentNode;
      if (!p || SKIP_TAGS[p.nodeName] || (p.closest && p.closest('svg, [data-ef-emoji], [contenteditable]'))) return;
      var t = plainText(n.nodeValue, LETTER_RE.test(n.nodeValue) ? '' : around(p));
      if (t !== n.nodeValue) n.nodeValue = t;
      return;
    }
    if (n.nodeType !== 1 || SKIP_TAGS[n.nodeName]) return;
    var w = document.createTreeWalker(n, 4), x, list = [];
    while ((x = w.nextNode())) list.push(x);
    list.forEach(plainNode);
  }
  function watchPlain() {
    if (!window.MutationObserver) return;
    new MutationObserver(function (ms) {
      ms.forEach(function (m) {
        if (m.type === 'characterData') plainNode(m.target);
        else Array.prototype.forEach.call(m.addedNodes, plainNode);
      });
    }).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
    plainNode(document.documentElement);
  }
  watchPlain();  // 読みこみの途中から見はる(はじめに絵文字が一瞬出ないように)

  window.EduitFrame = { AUTHOR: AUTHOR, furikaeri: furikaeri, jishu: jishu, open: open, howto: howto, footer: footer, aboutButton: aboutButton, fsButton: fsButton, mount: mount, levels: levels, card: card, code: code, menuTitle: menuTitle, sizeButton: sizeButton, prefs: prefs, jishuProgress: jishuProgress, jishuApp: function (c, title) { jishuSet = true; jishuMount(c, title); }, lets: function (id) { return LETS[id] || null; }, letsCard: letsCard };
  var jishuSet = false;  // 教材集が jishuApp で決めたときは、アプリ名から決めなおさない
  function start() { mount(); if (!jishuSet) jishuMount(); watchLets(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

<body>
<header id="g-header"></header>
<main class="ef-main is-wide">
  <div class="ef-box no-print project-bar">
    <div class="g-row">
      <label class="g-field grow"><span>作品の名前</span><input id="pname" type="text" maxlength="40" placeholder="例: L字ブロック"></label>
      <div class="g-row">
        <button class="ef-btn" id="b-new" type="button">新しく作る</button>
        <button class="ef-btn" id="b-open" type="button">開く</button>
        <button class="ef-btn-primary" id="b-save" type="button">保存</button>
        <button class="ef-btn" id="b-export" type="button">ファイルに書き出す</button>
        <button class="ef-btn" id="b-import" type="button">ファイルから読み込む</button>
      </div>
    </div>
    <p class="g-muted" id="save-state" aria-live="polite"></p>
  </div>

  <div data-g-tabs>
    <div class="ef-apptabs" role="tablist" aria-label="作業の段階">
      <button class="ef-apptab" role="tab" data-tab="draw" type="button"><span class="num">①</span>三面図をかく</button>
      <button class="ef-apptab" role="tab" data-tab="view" type="button"><span class="num">②</span>立体を見る</button>
      <button class="ef-apptab" role="tab" data-tab="sheet" type="button"><span class="num">③</span>図面・印刷</button>
      <button class="ef-apptab" role="tab" data-tab="review" type="button" data-ef-reflect>ふりかえり</button>
    </div>

    <!-- 1 三面図をかく -->
    <section data-panel="draw">
      <div class="a7-draw">
        <div class="ef-box a7-editor-card">
          <div class="g-row space-between">
            <h2 style="margin:0">三面図(第三角法)</h2>
            <div class="g-row">
              <button class="ef-btn is-s" id="undo" type="button" title="元に戻す(Ctrl+Z)">↶ 元に戻す</button>
              <button class="ef-btn is-s" id="redo" type="button" title="やり直す(Ctrl+Y)">↷ やり直す</button>
              <button class="ef-btn is-s is-danger" id="clear" type="button">ぜんぶ消す</button>
            </div>
          </div>
          <div class="a7-tools" role="radiogroup" aria-label="マスにかく形">
            <span class="g-muted">かく形:</span>
          </div>
          <div class="a7-editor-wrap" id="editor-wrap"></div>
          <p class="g-muted" id="editor-help">マスをクリック(ドラッグ)してぬります。ぬったマスをもう一度押すと消えます。キーボードでは Tab で図を選び、矢印キーで動かして Space でぬります。</p>
        </div>
        <div class="a7-panel">
          <div class="ef-box">
            <div class="g-row space-between">
              <h2 style="margin:0">できる立体(等角図)</h2>
              <button class="ef-btn is-s" id="go-view" type="button">大きく見る ▶</button>
            </div>
            <div class="a7-preview-wrap"><canvas id="preview" aria-label="三面図から作った立体の等角図"></canvas></div>
            <div id="check" aria-live="polite"></div>
            <p class="g-muted" id="info"></p>
          </div>
          <div class="ef-box">
            <h2>大きさ</h2>
            <div class="g-row align-end">
              <label class="g-field"><span>幅(マス)</span><input id="sz-w" type="number" min="1" max="16" step="1"></label>
              <label class="g-field"><span>奥行き(マス)</span><input id="sz-d" type="number" min="1" max="16" step="1"></label>
              <label class="g-field"><span>高さ(マス)</span><input id="sz-h" type="number" min="1" max="16" step="1"></label>
              <label class="g-field"><span>1マス (mm)</span><input id="sz-cell" type="number" min="1" max="200" step="1"></label>
            </div>
            <div class="g-row align-end">
              <label class="g-field grow"><span>お手本の形</span><select id="sample"></select></label>
              <button class="ef-btn" id="load-sample" type="button">かきこむ</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 2 立体を見る -->
    <section data-panel="view" hidden>
      <div class="ef-box">
        <div class="g-row space-between">
          <div class="a7-seg" role="radiogroup" aria-label="立体の表し方">
            <button type="button" role="radio" data-mode="iso">等角図</button>
            <button type="button" role="radio" data-mode="cabinet">キャビネット図</button>
            <button type="button" role="radio" data-mode="3d">3D(回して見る)</button>
          </div>
          <div class="g-row">
            <label class="g-check" id="hid-wrap"><input type="checkbox" id="show-hidden"> かくれ線も表示</label>
            <button class="ef-btn" id="png-view" type="button">画像で保存</button>
            <button class="ef-btn" id="stl-view" type="button">STL で保存(3Dプリンタ)</button>
          </div>
        </div>
        <div class="a7-view-wrap"><canvas id="view-canvas" tabindex="0" aria-label="立体の図"></canvas></div>
        <div class="g-row" id="cam-btns" hidden>
          <span class="g-muted">見る向き:</span>
          <button class="ef-btn is-s" type="button" data-cam="iso">ななめ上から</button>
          <button class="ef-btn is-s" type="button" data-cam="front">正面</button>
          <button class="ef-btn is-s" type="button" data-cam="top">上</button>
          <button class="ef-btn is-s" type="button" data-cam="right">右</button>
          <button class="ef-btn is-s" type="button" data-cam="back">うしろ</button>
          <button class="ef-btn is-s" type="button" data-cam="under">下から</button>
        </div>
        <div id="mode-note"></div>
      </div>
    </section>

    <!-- 3 図面・印刷 -->
    <section data-panel="sheet" hidden>
      <div class="a7-sheet">
        <div class="ef-box a7-sheet-form">
          <h2>図面に書くこと</h2>
          <label class="g-field"><span>図名(作品の名前)</span><input id="sh-title" type="text" maxlength="30"></label>
          <label class="g-field"><span>材料</span><input id="sh-material" type="text" maxlength="20" placeholder="例: スギ・SPF材・アクリル"></label>
          <div class="g-row align-end">
            <label class="g-field"><span>学年</span><input id="sh-grade" type="text" inputmode="numeric" maxlength="2" class="narrow"></label>
            <label class="g-field"><span>組</span><input id="sh-cls" type="text" maxlength="6" class="narrow"></label>
            <label class="g-field"><span>番号</span><input id="sh-no" type="text" inputmode="numeric" maxlength="4" class="narrow"></label>
          </div>
          <label class="g-field"><span>氏名</span><input id="sh-name" type="text" maxlength="20"></label>
          <div class="g-row align-end">
            <label class="g-field"><span>日付</span><input id="sh-date" type="date"></label>
            <label class="g-field"><span>尺度</span><select id="sh-scale">
              <option value="auto">自動(用紙に入る大きさ)</option>
              <option value="2">2:1(2倍)</option>
              <option value="1">1:1(実物の大きさ)</option>
              <option value="0.5">1:2(1/2)</option>
              <option value="0.2">1:5(1/5)</option>
              <option value="0.1">1:10(1/10)</option>
            </select></label>
          </div>
          <label class="g-check"><input type="checkbox" id="sh-dims"> 寸法を入れる</label>
          <label class="g-check"><input type="checkbox" id="sh-detail"> 細かい寸法(区切りごと)も入れる</label>
          <label class="g-check"><input type="checkbox" id="sh-iso"> 等角図(参考)も入れる</label>
          <div class="g-row a7-sheet-btns">
            <button class="ef-btn-primary" id="print" type="button">印刷する</button>
            <button class="ef-btn" id="pdf" type="button">PDF で保存</button>
            <button class="ef-btn" id="stl-sheet" type="button">STL で保存</button>
          </div>
          <p class="g-muted">「印刷する」の画面で、送り先を「PDF に保存」にすると PDF にもできます。用紙は A4 横です。</p>
          <div id="sheet-msg" aria-live="polite"></div>
        </div>
        <div class="ef-box a7-sheet-preview">
          <div id="sheet-box" class="a7-sheet-box" aria-label="図面の見本"></div>
        </div>
      </div>
    </section>

    <!-- 4 ふりかえり -->
    <section data-panel="review" hidden data-ef-reflect>
      <div class="ef-box">
        <h2>問題解決の流れ</h2>
        <div id="ps"></div>
      </div>
      <div class="g-cols">
        <div class="ef-box">
          <h2>ふりかえりを書く</h2>
          <div class="g-row align-end">
            <label class="g-field"><span>組</span><input id="rf-cls" type="text" maxlength="6" class="narrow"></label>
            <label class="g-field"><span>番号</span><input id="rf-no" type="text" inputmode="numeric" maxlength="4" class="narrow"></label>
            <label class="g-field grow"><span>氏名</span><input id="rf-name" type="text" maxlength="20"></label>
          </div>
          <p class="g-muted">組・番号・氏名は図面と同じです。「ファイルに書き出す」で出すファイルにも入ります。</p>
          <label class="g-field"><span>わかったこと・できるようになったこと</span><textarea id="rf-learned"></textarea></label>
          <label class="g-field"><span>むずかしかったこと・次にがんばりたいこと</span><textarea id="rf-hard"></textarea></label>
          <label class="g-field"><span>自分の作品の構想や製作に、どう生かしたいか</span><textarea id="rf-use"></textarea></label>
        </div>
        <div class="ef-box">
          <h2>自己評価</h2>
          <div id="selfcheck"></div>
          <h2>記録</h2>
          <div id="record"></div>
        </div>
      </div>
    </section>
  </div>
</main>
<div id="print-area" aria-hidden="true"></div>

      if (dbp) return dbp;
      dbp = new Promise(function (res, rej) {
        if (!window.indexedDB) { rej(new Error('no idb')); return; }
        var rq;
        try { rq = indexedDB.open(DB, 1); } catch (e) { rej(e); return; }
        rq.onupgradeneeded = function () {
          var os = rq.result.createObjectStore(STORE, { keyPath: 'id' });
          os.createIndex('app', 'app');
        };
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { rej(rq.error); };
      }).catch(function (e) { console.warn('IndexedDB が使えないため localStorage に保存します', e); return null; });
      return dbp;
    }
    function lsAll() { try { return JSON.parse(localStorage.getItem(LSK)) || {}; } catch (e) { return {}; } }
    function lsSave(all) { localStorage.setItem(LSK, JSON.stringify(all)); }
    function tx(mode, fn) {
      return open().then(function (db) {
        if (!db) return fn(null);
        return new Promise(function (res, rej) {
          var t = db.transaction(STORE, mode), os = t.objectStore(STORE), out;
          var r = fn(os);
          if (r && 'onsuccess' in r) r.onsuccess = function () { out = r.result; };
          t.oncomplete = function () { res(out); };
          t.onerror = function () { rej(t.error); };
          t.onabort = function () { rej(t.error || new Error('保存が中止されました')); };  // 容量不足などで止まったとき
        });
      });
    }
    return {
      put: function (a) {
        if (!a || !a.id || !a.app) return Promise.reject(new Error('artifact に id と app が必要です'));
        a.schema = G.SCHEMA;
        a.updatedAt = new Date().toISOString();
        var copy = JSON.parse(JSON.stringify(a));
        return tx('readwrite', function (os) {
          if (!os) { var all = lsAll(); all[copy.id] = copy; lsSave(all); return null; }
          return os.put(copy);
        }).then(function () { return copy; });
      },
      get: function (id) {
        return open().then(function (db) {
          if (!db) return lsAll()[id] || null;
          return new Promise(function (res, rej) {
            var rq = db.transaction(STORE, 'readonly').objectStore(STORE).get(id);
            rq.onsuccess = function () { res(rq.result || null); };
            rq.onerror = function () { rej(rq.error); };
          });
        });
      },
      list: function (app) {
        return open().then(function (db) {
          if (!db) {
            var all = lsAll();
            return Object.keys(all).map(function (k) { return all[k]; }).filter(function (a) { return !app || a.app === app; });
          }
          return new Promise(function (res, rej) {
            var t = db.transaction(STORE, 'readonly'), os = t.objectStore(STORE);
            var rq = app ? os.index('app').getAll(app) : os.getAll();
            rq.onsuccess = function () { res(rq.result); };
            rq.onerror = function () { rej(rq.error); };
          });
        }).then(function (list) {
          return list.sort(function (a, b) { return (b.updatedAt || '').localeCompare(a.updatedAt || ''); });
        });
      },
      del: function (id) {
        return tx('readwrite', function (os) {
          if (!os) { var all = lsAll(); delete all[id]; lsSave(all); return null; }
          return os.delete(id);
        });
      }
    };
  })();

  // メニューで入れた組・番号・名前(先生用の振り返り一覧で、だれのファイルか分かるように書き出しに入れる)
  G.profile = function () {
    try {
      var p = JSON.parse(localStorage.getItem('gijutsu.profile')) || {};
      return { class: String(p.class || ''), no: String(p.no || ''), name: String(p.name || '') };
    } catch (e) { return { class: '', no: '', name: '' }; }
  };
  // JSON をファイルとして書き出す(作品・記録には、組・番号・名前が入っていればそれも入れる)
  G.exportJSON = function (obj, filename) {
    var st = G.profile();
    if (obj && typeof obj === 'object' && !Array.isArray(obj) && !obj.student && (st.class || st.no || st.name)) {
      obj = Object.assign({}, obj, { student: st });  // 保存している作品そのものは変えない
    }
    var blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    G.download(blob, filename || 'gijutsu.json');
  };
  G.download = function (blob, filename) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  // ファイルを選ばせて JSON を読み込む → Promise<object>
  G.pickJSON = function () {
    return new Promise(function (res, rej) {
      var inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.json,application/json';
      inp.onchange = function () {
        var f = inp.files[0];
        if (!f) { rej(new Error('ファイルが選ばれていません')); return; }
        var rd = new FileReader();
        rd.onload = function () {
          try { res(JSON.parse(rd.result)); } catch (e) { rej(new Error('JSON として読めませんでした')); }
        };
        rd.onerror = function () { rej(rd.error); };
        rd.readAsText(f);
      };
      inp.click();
    });
  };
  // 読み込んだ JSON を artifact の配列に正規化する(単体・配列・{artifacts:[]} に対応)
  G.normalizeImport = function (obj, app) {
    var list = Array.isArray(obj) ? obj : obj && Array.isArray(obj.artifacts) ? obj.artifacts : [obj];
    return list.filter(function (a) {
      return a && typeof a === 'object' && a.data && (!app || a.app === app);
    }).map(function (a) {
      var c = JSON.parse(JSON.stringify(a));
      c.schema = G.SCHEMA;
      if (!c.id) c.id = G.uid(c.app || app || 'x');
      return c;
    });
  };

  /* ---------- 小さな UI 部品 ---------- */
  G.toast = function (msg, ms) {
    var box = G.$('#g-toast');
    if (!box) { box = G.h('div', { id: 'g-toast', role: 'status', 'aria-live': 'polite' }); document.body.appendChild(box); }
    var t = G.h('div', { class: 'g-toast-item' }, msg);
    box.appendChild(t);
    setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 400); }, ms || 2600);
  };

  // タブ: <div data-g-tabs> 内の [role=tab][data-tab=X] と [data-panel=X] を結ぶ
  // 振り返りを隠す設定(EduitFrame.furikaeri === false)のときは、data-ef-reflect の付いたタブは選ばない
  G.furikaeriOff = function () { return !!(window.EduitFrame && EduitFrame.furikaeri === false); };
  G.tabs = function (root, onChange) {
    var tabs = G.$$('[role=tab]', root);
    function usable(t) { return !(G.furikaeriOff() && t.hasAttribute('data-ef-reflect')); }
    function show(name, focus) {
      var want = G.$('[role=tab][data-tab="' + name + '"]', root);
      if (want && !usable(want)) {
        var alt = tabs.filter(usable)[0];
        if (alt) name = alt.getAttribute('data-tab');
      }
      tabs.forEach(function (t) {
        var on = t.getAttribute('data-tab') === name;
        t.setAttribute('aria-selected', String(on));
        t.tabIndex = on ? 0 : -1;
        if (on && focus) t.focus();
      });
      G.$$('[data-panel]', root).forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== name; });
      try { sessionStorage.setItem('tab:' + (G.app || '') + location.pathname, name); } catch (e) {}
      if (onChange) onChange(name);
    }
    tabs.forEach(function (t) {
      var name = t.getAttribute('data-tab');
      var panel = G.$('[data-panel="' + name + '"]', root);
      t.id = t.id || 'tab-' + name;
      t.setAttribute('aria-controls', panel ? (panel.id = panel.id || 'panel-' + name) : '');
      if (panel) { panel.setAttribute('role', 'tabpanel'); panel.setAttribute('aria-labelledby', t.id); }
      t.addEventListener('click', function () { show(name); });
      t.addEventListener('keydown', function (e) {
        var vis = tabs.filter(usable), k = vis.indexOf(t);
        var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (e.key === 'Home') d = -k;
        if (e.key === 'End') d = vis.length - 1 - k;
        if (!d || k < 0) return;
        e.preventDefault();
        show(vis[(k + d + vis.length) % vis.length].getAttribute('data-tab'), true);
      });
    });
    var first = tabs[0] && tabs[0].getAttribute('data-tab'), saved = null;
    try { saved = sessionStorage.getItem('tab:' + (G.app || '') + location.pathname); } catch (e) {}
    show(saved && G.$('[data-tab="' + saved + '"]', root) ? saved : first);
    return { show: show };
  };

  // モーダル(<dialog>)。G.modal({title, body:Node, actions:[{label, value, primary}]}) → Promise<value>
  G.modal = function (opt) {
    return new Promise(function (res) {
      var dlg = G.h('dialog', { class: 'g-modal', 'aria-label': opt.title || '' });
      var form = G.h('form', { method: 'dialog' });
      if (opt.title) form.appendChild(G.h('h2', null, opt.title));
      if (opt.body) form.appendChild(typeof opt.body === 'string' ? G.h('p', null, opt.body) : opt.body);
      var acts = G.h('div', { class: 'g-row g-end' });
      (opt.actions || [{ label: '閉じる', value: 'close', primary: true }]).forEach(function (a) {
        acts.appendChild(G.h('button', { class: a.primary ? 'ef-btn-primary' : 'ef-btn', value: a.value }, a.label));
      });
      form.appendChild(acts);
      dlg.appendChild(form);
      document.body.appendChild(dlg);
      dlg.addEventListener('close', function () { res(dlg.returnValue); dlg.remove(); });
      dlg.showModal();
    });
  };
  G.confirm = function (msg, okLabel) {
    return G.modal({ title: '確認', body: msg, actions: [{ label: 'やめる', value: 'no' }, { label: okLabel || 'OK', value: 'yes', primary: true }] })
      .then(function (v) { return v === 'yes'; });
  };

  // 保存した作品の一覧を開く → Promise<artifact|null>
  G.openDialog = function (app) {
    return G.store.list(app).then(function (list) {
      return new Promise(function (res) {
        var chosen = null;
        var body = G.h('div', { class: 'g-filelist' });
        if (!list.length) body.appendChild(G.h('p', null, 'まだ保存された作品はありません。'));
        list.forEach(function (a) {
          var row = G.h('div', { class: 'g-filerow' },
            G.h('button', { class: 'g-linkbtn', type: 'button', onclick: function () { chosen = a; dlgClose(); } },
              a.title || '無題'),
            G.h('span', { class: 'g-muted' }, a.updatedAt ? new Date(a.updatedAt).toLocaleString('ja-JP') : ''),
            G.h('button', { class: 'ef-btn is-s is-danger', type: 'button', 'aria-label': (a.title || '無題') + ' を削除', onclick: function () {
              G.confirm('「' + (a.title || '無題') + '」を削除します。もとに戻せません。', '削除する').then(function (ok) {
                if (ok) G.store.del(a.id).then(function () { row.remove(); });
              });
            } }, '削除'));
          body.appendChild(row);
        });
        var p = G.modal({ title: '保存した作品を開く', body: body, actions: [{ label: '閉じる', value: 'close' }] });
        function dlgClose() { var d = G.$('dialog.g-modal[open]'); if (d) d.close('pick'); }
        p.then(function () { res(chosen); });
      });
    });
  };


  /* ---------- 保存データの管理(1件ずつ削除・すべて削除) ----------
   * G.clearAppData(app) … そのアプリの作品と localStorage を消す(app を省くと全アプリ)
   * G.dataDialog(app)   … 一覧と削除ボタンのダイアログ。何か消したら閉じたときに画面を読み込み直す
   */
  G.clearLocal = function (app) {
    var heads = [];
    Object.keys(G.LS_PREFIX).forEach(function (k) { if (!app || k === app) heads = heads.concat(G.LS_PREFIX[k]); });
    if (!app) heads.push('gijutsu.artifacts', 'gijutsu.profile');
    try {
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
      keys.forEach(function (k) {
        if (heads.some(function (h) { return k === h || k.indexOf(h) === 0; })) localStorage.removeItem(k);
      });
    } catch (e) {}
  };
  G.clearAppData = function (app) {
    return G.store.list(app).then(function (list) {
      return Promise.all(list.map(function (a) { return G.store.del(a.id); })).then(function () {
        G.clearLocal(app);
        return list.length;
      });
    });
  };
  G.dataDialog = function (app, appTitle) {
    var changed = false;
    return G.store.list(app).then(function (list) {
      var body = G.h('div', { class: 'g-filelist' });
      body.appendChild(G.h('p', null, (appTitle ? '「' + appTitle + '」で' : '') + 'この端末に保存されているデータです。消したデータはもとに戻せません。先生に出す前に消さないよう気をつけましょう。'));
      var listBox = G.h('div', null);
      function draw() {
        listBox.innerHTML = '';
        if (!list.length) listBox.appendChild(G.h('p', { class: 'g-muted' }, '保存されている作品・記録はありません。'));
        list.forEach(function (a) {
          var info = !app && G.APPS && G.APPS.filter(function (x) { return x.id === a.app; })[0];
          listBox.appendChild(G.h('div', { class: 'g-filerow' },
            G.h('span', null, info ? G.h('span', { class: 'ef-tag' }, info.code) : null, info ? ' ' : null, a.title || '無題'),
            G.h('span', { class: 'g-muted' }, a.updatedAt ? new Date(a.updatedAt).toLocaleString('ja-JP') : ''),
            G.h('button', { class: 'ef-btn is-s is-danger', type: 'button', 'aria-label': (a.title || '無題') + ' を削除', onclick: function () {
              G.confirm('「' + (a.title || '無題') + '」を削除します。もとに戻せません。', '削除する').then(function (ok) {
                if (!ok) return;
                G.store.del(a.id).then(function () { changed = true; list = list.filter(function (x) { return x !== a; }); G.toast('削除しました'); draw(); });
              });
            } }, '削除')));
        });
      }
      draw();
      body.appendChild(listBox);
      body.appendChild(G.h('div', { class: 'g-row', style: { marginTop: '.75rem' } },
        G.h('button', { class: 'ef-btn is-danger', type: 'button', onclick: function () {
          G.confirm((appTitle ? '「' + appTitle + '」の' : 'すべてのアプリの') + 'データをすべて削除します。とちゅうの作業や記録も消えます。もとに戻せません。', 'すべて削除する').then(function (ok) {
            if (!ok) return;
            G.clearAppData(app).then(function () { changed = true; list = []; G.toast('すべて削除しました'); draw(); });
          });
        } }, 'すべて削除する')));
      return G.modal({ title: '保存データの管理', body: body, actions: [{ label: '閉じる', value: 'close', primary: true }] }).then(function () {
        if (changed) location.reload();
      });
    });
  };

  /* ---------- アプリ共通のヘッダー ----------
   * G.initApp({ app:'kidori', title:'木取り・構想シミュレータ', home:'../index.html', files:[...] })
   * - ヘッダー(メニューへ戻る/名前/ルビ/文字サイズ/コントラスト)を <header id="g-header"> に描く
   * - 名前の前に記号(A5 など)の印を出す。記号は common/apps.js(G.APPS)の app と同じ id の code。opt.code で上書き、opt.code: '' で出さない
   * - ルビの自動付与と Service Worker 登録を行う
   */
  G.initApp = function (opt) {
    opt = opt || {};
    G.app = opt.app;
    G.applySettings();
    var header = G.$('#g-header');
    if (!header) { header = G.h('header', { id: 'g-header' }); document.body.insertBefore(header, document.body.firstChild); }
    // 4分野共通の枠(shared/eduit-frame.css の .ef-header / .ef-btn)
    header.classList.add('g-header', 'ef-header');
    header.innerHTML = '';
    // ふりがな・文字の大きさ・くっきりのボタンは、data-ef-pref を付けると共通の枠(EduitFrame.prefs)がボタンにする
    // 道具の並び: ふりがな → 文字の大きさ → くっきり(opt.contrast: false で出さない。メニューは4分野共通の4つだけにする) → 使い方(opt.help) → そのアプリだけのボタン(opt.tools)
    var help = null;
    if (typeof opt.help === 'function') help = G.h('button', { class: 'ef-btn', type: 'button', onclick: opt.help }, '使い方');
    else if (typeof opt.help === 'string') help = G.h('a', { class: 'ef-btn', href: opt.help }, '使い方');
    if (opt.home !== false) header.appendChild(G.h('a', { class: 'ef-btn ef-back g-home', href: opt.home || '../index.html' }, '◀ メニュー'));
    // 上のバーの名前: 「A2 木材の繊維・収縮ラボ」の形。記号は common/apps.js の code(opt.code で上書き)を .ef-code の印で出す
    var code = opt.code;
    if (code === undefined && opt.app) (G.APPS || []).forEach(function (a) { if (a.id === opt.app) code = a.code; });
    var title = G.h('h1', { class: 'ef-title g-title' },
      code ? G.h('span', { class: 'ef-code', 'data-noruby': true }, code) : null,
      code ? ' ' : null, opt.title || document.title);
    header.appendChild(title);
    // アプリの上のバーは4分野共通の形(C エネルギー変換と同じ): 名前は .ef-apptitle、A1〜A8 の切りかえ(.ef-switch)、右に 全画面・ⓘ
    var sw = null;
    if (opt.home !== false && code && /^A\d/.test(code)) {
      header.classList.add('ef-appbar');
      title.classList.add('ef-apptitle');
      var base = (opt.home || '../index.html').replace(/index\.html$/, '');
      sw = G.h('nav', { class: 'ef-switch', 'aria-label': 'アプリを切りかえる' });
      (G.APPS || []).forEach(function (a) {
        var cur = a.code === code;
        sw.appendChild(G.h('a', { class: 'ef-swchip', href: base + a.dir + 'index.html', title: a.code + ' ' + a.title, 'aria-current': cur ? 'page' : null },
          G.h('span', { class: 'ef-code', 'data-noruby': true }, a.code), G.h('span', { class: 'ef-sw-n' }, a.short || a.title)));
      });
      header.appendChild(sw);
    }
    header.appendChild(G.h('div', { class: 'ef-tools g-header-tools' },
      G.h('button', { class: 'ef-btn ef-toggle', type: 'button', 'data-ef-pref': 'ruby', title: 'ふりがなを表示する/しない' }, G.h('span', { 'data-noruby': true }, 'ふりがな')),
      G.h('button', { class: 'ef-btn ef-size', type: 'button', 'data-ef-pref': 'fs' }),
      opt.contrast === false ? null : G.h('button', { class: 'ef-btn ef-toggle', type: 'button', 'data-ef-pref': 'kukkiri', title: '色のコントラストを強くする' }, 'くっきり'),
      help,
      opt.tools || null,
      sw ? G.h('span', { 'data-ef-fs': true }) : null,
      sw ? G.h('span', { 'data-ef-about': true }) : null));
    if (window.EduitFrame && window.EduitFrame.prefs) window.EduitFrame.prefs.mount();
    G.applySettings();
    // 上のバーの「全画面」「ⓘ このアプリについて」(共通の枠がもう動いたあとでも出す)
    if (sw && window.EduitFrame && document.body) window.EduitFrame.mount();
    // 作成者の読みがな(フッターと「このアプリについて」で使う)
    G.ruby.add({ '岡田': 'おかだ', '作成': 'さくせい', '個人情報': 'こじんじょうほう' });
    if (!G.$('.g-footer')) {
      var dataBtn = opt.app && opt.app !== 'menu' && opt.data !== false
        ? G.h('button', { class: 'ef-btn is-s g-data-btn', type: 'button', onclick: function () { G.dataDialog(opt.app, opt.title); } }, '保存データの管理(削除)') : null;
      var foot;
      if (window.EduitFrame) {
        // 共通のフッター(作成者・版・安全と個人情報・ライセンス・更新履歴)。保存データの管理ボタンはその右に
        foot = G.h('div', { class: 'g-footer g-footer-ef', 'data-ef-footer': true });
      } else {
        foot = G.h('footer', { class: 'g-footer' },
          G.h('span', { class: 'g-credit' }, G.h('span', { 'data-noruby': true }, '作成: '), G.h('span', { 'data-credit': true }, G.CREDIT_RUBY)),
          dataBtn);
      }
      var addFoot = function () {
        document.body.appendChild(foot);
        if (window.EduitFrame) {
          // 枠がもう body の最後にフッターを出していたら、こちらへ移す(2つ出さない)
          var made = G.$('body > .ef-footer');
          if (made) foot.appendChild(made); else window.EduitFrame.mount();
          var ef = foot.querySelector('.ef-footer');
          if (ef && dataBtn) ef.appendChild(dataBtn);
        }
      };
      if (document.body) addFoot(); else document.addEventListener('DOMContentLoaded', addFoot);
    }
    // 一つのHTML版(build-single.py)の中で開かれているか
    if (window.parent !== window) {
      try { if (window.parent.GSingle) G.single = window.parent.GSingle; } catch (e) {}
    }
    // (リンクの付けかえは build-single.py が各ページに入れるスクリプトが行う)
    var start = function () {
      // タブの帯は、下へ読み進めると隠れ、上へ戻すと出る(shared/eduit-frame.js)
      Array.prototype.forEach.call(document.querySelectorAll('.ef-apptabs'), function (t) { t.setAttribute('data-ef-autohide', ''); });
      G.ruby.apply(document.body);
      G.ruby.observe();
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
    G.registerSW(opt.files || []);
  };

  /* ---------- オフライン(Service Worker) ----------
   * ルートの sw.js が common/ とメニューを先にキャッシュする。
   * 各アプリは自分のファイル一覧を渡すと、初回オープン時にまとめてキャッシュされる。
   * file:// で開いたときは Service Worker は使えない(ファイルはそのまま動く)。
   */
  G.registerSW = function (files) {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol) || G.single) return;

<script>
/* A7 第三角法 立体メーカー: 三面図(マス目)から立体を作る計算(画面に依存しない)
 * ブラウザでは window.SolidGeom、node では require('./geom.js')。
 *
 * 座標: x = 幅(左→右)、y = 奥行き(手前→おく)、z = 高さ(下→上)。1マス = 1。
 * 三面図のマス(u: 右へ、v: 上へ、0 から):
 *   正面図 front[v*W+u]: u = x, v = z(手前から見る)
 *   平面図 top[v*W+u]  : u = x, v = y(上から見る。正面図の上に置き、下が手前)
 *   右側面図 side[v*D+u]: u = y, v = z(右から見る。正面図の右に置き、左が手前)
 * マスの値: 0 = 空き, 1 = ぬる, 2 ◣ 3 ◢ 4 ◥ 5 ◤(斜めに半分ぬる)
 *
 * 立体 = 3つの図をそれぞれの向きにのばした柱の重なり(共通部分)。
 * 1つの立方体を、斜めのマスの面で切ると凸多面体になるので、それを集めて外側の面だけを残す。
 */
(function (root) {
  'use strict';
  var G = {};
  var EPS = 1e-9;

  // 斜めのマス: マスの中の座標 (a: 右へ, b: 上へ, 0〜1) で n0*a + n1*b <= c の側をぬる
  var HALF = {
    2: [1, 1, 1],     // ◣ 左下
    3: [-1, 1, 0],    // ◢ 右下
    4: [-1, -1, -1],  // ◥ 右上
    5: [1, -1, 0]     // ◤ 左上
  };
  G.CELL_KINDS = [0, 1, 2, 3, 4, 5];
  G.CELL_CHAR = { 0: '.', 1: '#', 2: 'a', 3: 'b', 4: 'c', 5: 'd' };

  // マスの形が点 (a,b) をふくむか(tol > 0 で少し広く、< 0 で少しせまく)
  function contains(val, a, b, tol) {
    tol = tol || 0;
    if (!val) return false;
    if (a < -tol || a > 1 + tol || b < -tol || b > 1 + tol) return false;
    if (val === 1) return true;
    var h = HALF[val];
    return h[0] * a + h[1] * b <= h[2] + tol * Math.SQRT2;
  }
  G.contains = contains;

  /* ---------- 小さなベクトル計算 ---------- */
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function mul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function len(a) { return Math.sqrt(dot(a, a)); }
  function norm(a) { var l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
  G.vec = { sub: sub, add: add, mul: mul, dot: dot, cross: cross, len: len, norm: norm };

  // 多角形の面積ベクトル(Newell)
  function areaVec(pts) {
    var s = [0, 0, 0];
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i], q = pts[(i + 1) % pts.length];
      s[0] += (p[1] - q[1]) * (p[2] + q[2]);
      s[1] += (p[2] - q[2]) * (p[0] + q[0]);
      s[2] += (p[0] - q[0]) * (p[1] + q[1]);

    return mul(s, 0.5);
  }
  function centroid(pts) {
    var c = [0, 0, 0];
    pts.forEach(function (p) { c = add(c, p); });
    return mul(c, 1 / pts.length);
  }
  // 平らな凸多角形の点を、法線 n のまわりに左回り(外から見て反時計回り)にならべる。同じ点は1つに
  function orderAround(pts, n) {
    var uniq = [];
    pts.forEach(function (p) {
      if (!uniq.some(function (q) { return Math.abs(p[0] - q[0]) < 1e-7 && Math.abs(p[1] - q[1]) < 1e-7 && Math.abs(p[2] - q[2]) < 1e-7; })) uniq.push(p);
    });
    if (uniq.length < 3) return uniq;
    var c = centroid(uniq);
    var e1 = Math.abs(n[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0];
    e1 = norm(sub(e1, mul(n, dot(e1, n))));

    var out = [];
    for (var i = 0; i < uniq.length; i++) {
      var a = uniq[(i + uniq.length - 1) % uniq.length], b = uniq[i], d = uniq[(i + 1) % uniq.length];

  /* ---------- 凸多面体(面の配列)と平面での切断 ---------- */

      F([1, 0, 0], [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]]),
      F([0, -1, 0], [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]]),
      F([0, 1, 0], [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]]),
      F([0, 0, -1], [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]]),

    if (!out.length) return [];
    var cap = orderAround(onPlane, nn);

  /* ---------- 三面図のデータ ---------- */
  G.emptyModel = function (W, D, H) {

  };
  function zeros(n) { var a = []; for (var i = 0; i < n; i++) a.push(0); return a; }
  // 文字の行(上の行から)から作る: '.' 空き '#' ぬる 'a' ◣ 'b' ◢ 'c' ◥ 'd' ◤
  var CH = { '.': 0, '#': 1, 'a': 2, 'b': 3, 'c': 4, 'd': 5 };
  function fromRows(rows, U, V) {
    var a = zeros(U * V);
    for (var r = 0; r < V; r++) {
      var line = rows[r] || '', v = V - 1 - r;
      for (var u = 0; u < U; u++) a[v * U + u] = CH[line.charAt(u)] || 0;
    }
    return a;
  }
  function toRows(a, U, V) {
    var rows = [];
    for (var v = V - 1; v >= 0; v--) {
      var s = '';
      for (var u = 0; u < U; u++) s += G.CELL_CHAR[a[v * U + u]] || '.';
      rows.push(s);
    }
    return rows;
  }
  // {W,D,H, front:[行...], top:[行...], side:[行...]} (行は上から) → model
  G.modelFromRows = function (o) {
    return { W: o.W, D: o.D, H: o.H, front: fromRows(o.front, o.W, o.H), top: fromRows(o.top, o.W, o.D), side: fromRows(o.side, o.D, o.H) };

    return { W: m.W, D: m.D, H: m.H, front: toRows(m.front, m.W, m.H), top: toRows(m.top, m.W, m.D), side: toRows(m.side, m.D, m.H) };

  // 3つの図 → 凸多面体の集まり(マスごと)
  function pieces(m) {
    var W = m.W, D = m.D, H = m.H, out = {};

  /* ---------- STL(3D プリンタ用) ----------

  /* ---------- 立体を3Dで見る(回す)ための投影 ---------- */
