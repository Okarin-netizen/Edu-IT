  <!-- 4分野共通の枠（色・ヘッダー・ボタン・フッター・このアプリについて）。1ファイル版では中に入れる -->
  <style id="eduit-frame-css">
/* Edu-IT 共通の枠(4分野・全アプリ共通)
 * 色・文字・ボタン・カード・ヘッダー・フッターの見た目をそろえるための部品。
 * 分野の色は <html data-ef-domain="A|B|C|D"> で切りかわる。
 * アプリ固有の見た目は各アプリの CSS に残し、ここでは「枠」だけを決める。
 */
:root {
  --ef-font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --ef-bg: #f5f4f0;          /* 画面の地 */
  --ef-surface: #ffffff;     /* カード・ヘッダー */
  --ef-surface-2: #f8f7f4;   /* 一段下げた面 */
  --ef-line: #d6d3cb;        /* 枠線 */
  --ef-text: #1f2328;
  --ef-muted: #565d68;
  --ef-focus: #f08c00;       /* キーボード操作の枠 */
  --ef-radius: 12px;
  --ef-radius-s: 8px;
  --ef-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .04);
  --ef-header-h: 52px;
  --ef-tap: 40px;            /* ボタンの最小の高さ */
  /* 分野の色(既定は D) */
  --ef-accent: #1a5fc8;
  --ef-accent-ink: #ffffff;
  --ef-accent-soft: #e6eefb;
}
:root[data-ef-domain="A"] { --ef-accent: #985a26; --ef-accent-soft: #f5e9dc; }  /* 材料と加工: 木の茶 */
:root[data-ef-domain="B"] { --ef-accent: #2e7d32; --ef-accent-soft: #e4f2e5; }  /* 生物育成: 緑 */
:root[data-ef-domain="C"] { --ef-accent: #b45309; --ef-accent-soft: #fbeedd; }  /* エネルギー変換: だいだい */
:root[data-ef-domain="D"] { --ef-accent: #1a5fc8; --ef-accent-soft: #e6eefb; }  /* 情報: 青 */

/* ---- ヘッダー ----
 * メニュー:   <header class="ef-header"> <h1 class="ef-title"><span class="ef-code">A</span> 材料と加工の技術 教材集</h1>
 *               <div class="ef-tools"> ふりがな / 文字の大きさ / (くっきり) / 使い方 / 先生用 </div> </header>
 * アプリ:     <header class="ef-header"> <a class="ef-btn ef-back" href="…">◀ メニュー</a>
 *               <h1 class="ef-title"><span class="ef-code">A2</span> アプリ名</h1>
 *               <div class="ef-tools"> ふりがな / 文字の大きさ / くっきり / 使い方 / そのアプリだけのボタン </div> </header>
 *   同じ分野の教材を切りかえるボタンにも記号を出す(<button class="ef-btn"><span class="ef-code">D2</span> CPU</button>)。
 */
.ef-header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  min-height: var(--ef-header-h); padding: 6px 14px;
  background: var(--ef-surface); color: var(--ef-text);
  border-bottom: 3px solid var(--ef-accent);
  font-family: var(--ef-font);
  box-sizing: border-box;
}
.ef-title {
  display: flex; align-items: center; gap: 8px;
  margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--ef-text);
}
.ef-title .ef-icon { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; font-size: 22px; }
.ef-title .ef-sub { font-size: 13px; font-weight: 400; color: var(--ef-muted); }
.ef-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }

/* ---- ボタン ----
 * .ef-btn          ふつうのボタン(白地・枠線・丸角)
 * .ef-btn.is-on    ON の状態(分野の色で塗る)。aria-pressed="true" でも同じ
 * .ef-btn-primary  いちばん大事な操作(はじめる・ひらく など)
 */
.ef-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--ef-tap); padding: 0 14px;
  border: 1px solid var(--ef-line); border-radius: 999px;
  background: var(--ef-surface); color: var(--ef-text);
  font: 600 15px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
  box-sizing: border-box; white-space: nowrap;
}
.ef-btn:hover { border-color: var(--ef-accent); }
.ef-btn.is-on, .ef-btn[aria-pressed="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-back { color: var(--ef-accent); border-color: transparent; background: var(--ef-accent-soft); }
.ef-btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 20px;
  border: 0; border-radius: var(--ef-radius-s);
  background: var(--ef-accent); color: var(--ef-accent-ink);
  font: 700 16px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
}
.ef-btn-primary:hover { filter: brightness(1.08); }
.ef-btn:focus-visible, .ef-btn-primary:focus-visible, .ef-about-link:focus-visible, .ef-dialog :focus-visible {
  outline: 3px solid var(--ef-focus); outline-offset: 2px;
}

/* ---- メニューのカード ----
 * <article class="ef-card"> <p class="ef-card-tag">A1</p> <h3 class="ef-card-title">…</h3> <p>…</p> <a class="ef-btn-primary">ひらく ▶</a> </article>
 * メニューのカードは EduitFrame.card() で作る(下の .ef-mcard)。
 */
.ef-page { background: var(--ef-bg); color: var(--ef-text); font-family: var(--ef-font); }
.ef-card {
  background: var(--ef-surface); border: 1px solid var(--ef-line); border-top: 4px solid var(--ef-accent);
  border-radius: var(--ef-radius); box-shadow: var(--ef-shadow); padding: 16px 18px;
}
.ef-card-tag { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ef-accent); }
.ef-card-title { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: var(--ef-text); }

/* ---- 記号の印(A1・B2・C3・D4 など。メニューの上のバー・アプリの上のバー・切りかえボタン・カード) ---- */
.ef-code {
  display: inline-flex; align-items: center; justify-content: center; min-width: 1.9em; padding: 0 .35em;
  border-radius: 6px; background: var(--ef-accent); color: var(--ef-accent-ink);
  font: 700 .9em/1.5 var(--ef-font); letter-spacing: .02em; white-space: nowrap; vertical-align: .05em;
}
.ef-title .ef-code { font-size: 15px; }
.ef-btn .ef-code { font-size: 13px; min-width: 0; margin-right: 2px; }
.ef-btn.is-on .ef-code, .ef-btn[aria-pressed="true"] .ef-code, .ef-btn[aria-current] .ef-code { background: var(--ef-accent-ink); color: var(--ef-accent); }

/* ---- メニューのカード(EduitFrame.card が作る。4分野同じ形) ---- */
.ef-mcard { display: flex; flex-direction: column; gap: 6px; min-height: 9rem; padding: 12px 16px 14px; cursor: pointer; font-family: var(--ef-font); color: var(--ef-text); transition: box-shadow .1s; }
.ef-mcard:hover { box-shadow: 0 2px 12px rgba(0, 0, 0, .14); }
.ef-mcard-hd { display: flex; align-items: center; gap: 10px; }
.ef-mcard-ic { flex: 0 0 auto; width: 1.4em; font-size: 2em; line-height: 1; text-align: center; }
.ef-mcard-ht { min-width: 0; }
.ef-mcard .ef-card-tag { margin: 0 0 2px; font-size: 14px; }
.ef-mcard .ef-card-title { margin: 0; font-size: 1.12em; line-height: 1.4; }
.ef-mcard-desc { margin: 0; font-size: .95em; line-height: 1.6; }
.ef-mcard-extra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: .88em; color: var(--ef-muted); }
.ef-mcard-go { margin-top: auto; align-self: flex-end; }
.ef-level-order { margin: -4px 0 12px; font-size: .95em; line-height: 1.6; }

/* ---- フッター(作成者・このアプリについて) ---- */
.ef-footer {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 14px;
  margin: 24px 0 0; padding: 12px 16px;
  border-top: 1px solid var(--ef-line); background: var(--ef-surface-2);
  font: 13px/1.6 var(--ef-font); color: var(--ef-muted);
}
.ef-footer .ef-author { font-weight: 700; color: var(--ef-text); }
.ef-about-link {
  border: 0; background: none; padding: 2px 4px; cursor: pointer;
  font: inherit; color: var(--ef-accent); text-decoration: underline;
}
/* ヘッダーなどに置く小さい「このアプリについて」ボタン */
.ef-about-btn { font-size: 14px; }

/* ---- このアプリについて(ダイアログ) ---- */
.ef-dialog {
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  padding: 0; border: 1px solid var(--ef-line); border-radius: var(--ef-radius);
  background: var(--ef-surface); color: var(--ef-text); font: 15px/1.7 var(--ef-font);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
}
.ef-dialog::backdrop { background: rgba(0, 0, 0, .4); }
.ef-dialog-in { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.ef-dialog-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 3px solid var(--ef-accent); }
.ef-dialog-head h2 { margin: 0; font-size: 18px; flex: 1; }
.ef-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px 0; }
.ef-tab { border: 1px solid var(--ef-line); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--ef-surface-2);
  padding: 6px 12px; font: 600 14px/1.3 var(--ef-font); color: var(--ef-text); cursor: pointer; min-height: 36px; }
.ef-tab[aria-selected="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-panel { padding: 14px 18px 18px; overflow: auto; border-top: 1px solid var(--ef-line); }
.ef-panel h3 { margin: 12px 0 4px; font-size: 16px; }
.ef-panel ul { margin: 4px 0 8px; padding-left: 1.3em; }
.ef-panel p { margin: 4px 0 8px; }
.ef-hist-ver { font-weight: 700; color: var(--ef-accent); }
.ef-hist-date { color: var(--ef-muted); font-size: 13px; margin-left: 6px; }

/* 文字を大きくした・くっきりのときも読めるように */
/* 基本編・発展編のタブ(メニュー。EduitFrame.levels が作る) */
.ef-levels { margin: 0 0 18px; font-family: var(--ef-font); }
.ef-level-tabs { display: flex; gap: 0; border-bottom: 3px solid var(--ef-accent); }
.ef-level-tab {
  display: inline-flex; align-items: baseline; gap: 8px; min-height: 48px; padding: 8px 22px; margin: 0 6px -3px 0;
  font: inherit; font-size: 1.15em; font-weight: 700 !important; color: var(--ef-muted) !important; cursor: pointer;
  background: var(--ef-surface-2); border: 1px solid var(--ef-line); border-bottom: 3px solid var(--ef-accent);
  border-radius: var(--ef-radius-s) var(--ef-radius-s) 0 0;
}
.ef-level-tab:hover { color: var(--ef-text) !important; }
/* 教材ごとのボタンの色指定(#hub button など)に負けないように !important にする */
.ef-level-tab[aria-selected="true"], .ef-level-tab[aria-selected="true"]:hover { color: var(--ef-accent-ink) !important; background: var(--ef-accent) !important; border-color: var(--ef-accent) !important; }
.ef-level-tab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }
.ef-level-count { font-size: .72em; font-weight: 400; }
.ef-level-panel { padding: 12px 0 0; }
.ef-level-panel:focus { outline: none; }
.ef-level-lead { margin: 0 0 12px; color: var(--ef-muted); line-height: 1.6; }
.ef-level-advanced[aria-selected="true"], .ef-level-advanced[aria-selected="true"]:hover { background: #5b3fa8 !important; border-color: #5b3fa8 !important; }
.ef-level-tabs:has(.ef-level-advanced[aria-selected="true"]) { border-bottom-color: #5b3fa8; }
.ef-level-parts { margin: .3em 0 0; font-size: .9em; line-height: 1.5; color: var(--ef-text); }
.ef-level-parts-k {
  display: inline-block; margin-right: .5em; padding: 0 .5em; font-size: .85em; font-weight: 700;
  color: var(--ef-accent); background: var(--ef-accent-soft); border-radius: 999px;
}

/* 振り返りを隠す設定(EduitFrame.furikaeri)。振り返りのタブ・欄・印には data-ef-reflect を付ける */
html[data-ef-furikaeri="off"] [data-ef-reflect] { display: none !important; }

@media print { .ef-footer, .ef-dialog { display: none !important; } }

</style>
  <style>
/* ネット詐欺 追体験ラボ。色・文字・ボタンは共通の枠(shared/eduit-frame.css)の --ef-* を使う */
:root {
  --gl-ok: #1a7f4b;
  --gl-ok-soft: #e3f4ea;
  --gl-ng: #c0362c;
  --gl-ng-soft: #fde7e4;
  --gl-warn: #b45309;
  --gl-warn-soft: #fdf0dc;
  --gl-info-soft: #eef3fb;
  --gl-chip-0: #dce8fb;
  --gl-chip-1: #fbe3c8;
  --gl-chip-2: #dff1d8;
  --gl-chip-3: #f1dcf3;
  --gl-nav-w: 262px;
}
/* 画面の枠は、ほかの情報の教材(デジタル化ラボ・情報セキュリティ体験ラボ・ネットワーク通信シミュレータ)と同じ形にそろえる */
html { font-size: 17px; }
html.big-text { font-size: 20px; }
body { margin: 0; background: var(--ef-bg); color: var(--ef-text); font-family: var(--ef-font); line-height: 1.75; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
h1, h2, h3 { line-height: 1.4; margin: 0 0 .5em; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.1rem; }
a { color: var(--ef-accent); }
rt { font-size: .6em; font-weight: 400; }
button, input, select, textarea { font: inherit; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: absolute; left: -999px; top: 0; }
.skip-link:focus { left: 8px; z-index: 10; background: var(--ef-surface); padding: 6px 10px; }
.ef-title { text-decoration: none; }
.ef-btn, .ef-btn-primary { font-size: 1rem; }

/* 上のバー: 表示の切りかえ・進み具合 */
.app-header { position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
.display-toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.overall-progress { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--ef-muted); white-space: nowrap; }
.overall-progress .bar { width: 120px; height: 10px; }
.overall-progress .bar-fill { background: var(--gl-ok); }

/* レイアウト: 左に章のメニュー、右に本文 */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; gap: 24px; padding: 20px; }
.chapter-nav { position: sticky; top: 72px; align-self: start; min-width: 0; }
.chapter-nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.nav-link { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ef-text); font-size: .92rem; line-height: 1.45; }
.nav-link:hover { background: var(--ef-surface-2); }
.nav-link[aria-current="page"] { background: var(--ef-accent-soft); font-weight: 700; }
.chapter-nav .num { flex: none; width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: .8rem; border: 1.5px solid var(--ef-line); background: var(--ef-surface); }
.chapter-nav .done .num { background: var(--gl-ok); border-color: var(--gl-ok); color: #fff; }
.chapter-nav .nav-group { font-size: .8rem; color: var(--ef-muted); margin: 14px 10px 4px; letter-spacing: .05em; }
main { min-width: 0; }
#view { outline: none; }
.app-footer { text-align: center; font-size: .85rem; color: var(--ef-muted); padding: 24px 16px 40px; }
.app-note { margin: 0 0 8px; }

.module-head { margin-bottom: 18px; }
.module-head .meta { color: var(--ef-muted); font-size: .9rem; margin: 0 0 4px; }
.module-head p.meta:not(:first-child) { font-size: 1rem; }
.module-head .author { margin-top: 6px; }
.sec-title { margin: 0 0 6px; font-size: 1.6rem; line-height: 1.4; text-wrap: balance; }
.sec-body { display: grid; gap: 18px; }
.lead { margin: 0; font-size: 1rem; max-width: 50em; }
.muted { color: var(--ef-muted); font-size: .9rem; margin: 0; }
.small-title { margin: 8px 0 4px; font-weight: 700; font-size: .95rem; }

/* カード(ほかの教材の .card と同じ) */
.panel, .card { background: #fcfcfb; border: 1px solid var(--ef-line); border-radius: var(--ef-radius); padding: 20px 22px; display: grid; gap: 12px; min-width: 0; box-shadow: var(--ef-shadow); }
.sec-body > .card, .sec-body > section { margin: 0; }
.panel-title, .card > h2 { margin: 0; font-size: 1.3rem; }
.panel p, .card p { margin: 0; }
.card ol, .card ul { margin: 0; padding-left: 1.4em; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.row, .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; background: #fcfcfb; border: 1px solid var(--ef-line); border-radius: var(--ef-radius); padding: 14px 18px; box-shadow: var(--ef-shadow); }
.ctl { display: grid; gap: 4px; min-width: 0; max-width: 100%; }
select.input { width: 100%; text-overflow: ellipsis; }
.ctl-label { font-size: .875rem; font-weight: 700; color: var(--ef-muted); }
.input { border: 1.5px solid var(--ef-line); border-radius: 8px; padding: 8px 10px; background: var(--ef-surface); color: var(--ef-text); min-height: 44px; max-width: 100%; }
textarea.input { width: 100%; resize: vertical; }
input[type="text"].input { flex: 1 1 260px; }
.range { display: flex; align-items: center; gap: 10px; }
.range input { width: 180px; accent-color: var(--ef-accent); }
.range output { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 6.5em; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }

  <script id="eduit-frame">
/* Edu-IT 共通の枠: 作成者・安全と個人情報・ライセンス・更新履歴
 * 使い方(classic script。file:// でも動く):
 *   <link rel="stylesheet" href="…/shared/eduit-frame.css">
 *   <script src="…/<分野>/eduit-info.js"><\/script>   … window.EDUIT_INFO を決める
 *   <script src="…/shared/eduit-frame.js"><\/script>
 * 置き場所(どれか):
 *   - <div data-ef-footer></div> があればそこにフッターを出す
 *   - <span data-ef-about></span> があればそこに「ⓘ このアプリについて」ボタンを出す(フッターは出さない)
 *   - どちらもなければ <body> の最後にフッターを足す
 *   - EDUIT_INFO.app.footer === false なら自動では何も出さない(EduitFrame.open() だけ使う)
 * EDUIT_INFO = {
 *   domain: 'A',                     分野(A/B/C/D)。色が切りかわる
 *   domainName: '材料と加工の技術',
 *   suite: '材料と加工 教材アプリ',     教材集の名前
 *   version: '2.1', updated: '2026-10-15',
 *   safety: ['この分野だけの安全の説明', …],   共通の説明のあとに足す
 *   history: [{ version: '2.1', date: '2026-10-15', items: ['…', …] }, …]   新しい順
 *   app: { name: 'A3 構造強化ラボ' }   アプリごとに上書き(EDUIT_INFO.app を各ページで決めてもよい)
 *   levels: { basic: {...}, advanced: {...} }   基本編・発展編の分け方(メニューが EduitFrame.levels で使う)
 * }
 *
 * メニューのカード(4分野共通の形): EduitFrame.card({ code: 'A1', icon: '🪵', title: '…', desc: '…', parts: 「使うところ」の要素,
 *   extra: [分野ごとの追加の要素…], href: 'ひらく先' か onOpen: function () {…}, openAttrs: { 'data-go': 'b1' } })
 *   → <article class="ef-card ef-mcard">。記号・アイコン・名前・説明・使うところ・追加の欄・「ひらく ▶」の順。カードのどこを押しても開く。
 * 記号の印: EduitFrame.code('A2') → <span class="ef-code">A2</span>(メニューの上のバー・アプリの上のバー・切りかえボタンで使う)
 * メニューの上のバーの名前: EduitFrame.menuTitle(h1) → h1 の中を「[A] 材料と加工の技術 教材集」にする
 *
 * 振り返りを隠す設定: EduitFrame.furikaeri(true = 出す / false = 隠す)。隠すときは <html data-ef-furikaeri="off"> になり、
 *   data-ef-reflect の付いた要素(振り返りのタブ・欄・カードの印など)が出なくなる(eduit-frame.css)。決め方(先のものが勝つ):
 *   1. アドレスの ?furikaeri=off / ?furikaeri=on(自分か、同じサイトの親の画面のアドレス)。localStorage 'eduit.furikaeri' に覚える
 *   2. window.EDUIT_FURIKAERI = 'off' / 'on'(自分か親の画面。配布用の「振り返りなし」版はこれを入れてある)
 *   3. localStorage 'eduit.furikaeri'(前に 1 で決めたもの)
 *   JS で振り返りを出し分けるとき(振り返りを書かないと先へ進めない、など)は EduitFrame.furikaeri を見る。
 *
 * 基本編・発展編(メニュー用): EduitFrame.levels(置き場所, { card: function (item, parts, levelKey) { return カードの要素; }, code: function (item) { return 'A1'; } })
 *   code を渡すと、基本編の上に「おすすめの順番: A1 → A2 → …」の1行を出す(カードの順 = 番号の順 = おすすめの順)。
 *   EDUIT_INFO.levels = {
 *     basic:    { title: '基本編', lead: '…', items: [{ id: 'M1', parts: ['材料カード', …], curr: 'A(1)ア', why: '…' }, …] },
 *     advanced: { title: '発展編', lead: '…', items: [ … ] }
 *   }
 *   id はメニューごとのアプリの id。parts は生徒の画面に出るタブ・ページの名前(「使うところ」に出す)。
 *   curr(学習指導要領の項目)と why(分けた理由)は先生用の一覧だけに出し、生徒のカードには出さない。
 *   選んだ編は localStorage の 'eduit.level.<分野>' に覚える(表示の設定なので「はじめから」でも消さない)。

        var n = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (n) { e.preventDefault(); select((i + n + panels.length) % panels.length); tabEls[(i + n + panels.length) % panels.length].focus(); }
      });
      tabEls.push(t); panelEls.push(pn); tabs.appendChild(t); body.appendChild(pn);
    });
    function select(i) {
      tabEls.forEach(function (t, j) { t.setAttribute('aria-selected', i === j ? 'true' : 'false'); t.tabIndex = i === j ? 0 : -1; });

    }
    var close = el('button', { type: 'button', class: 'ef-btn', text: '閉じる' });

      ])
    ]);

    dlg._select = select;
    document.body.appendChild(dlg);
  }
  function open(tab) {

  }

  // ---- 基本編・発展編のタブ(メニュー用) ----
  var LEVEL_KEYS = ['basic', 'advanced'];
  function levels(box, opts) {
    var L = info.levels;
    if (!box || !L) return null;
    opts = opts || {};
    var store = 'eduit.level.' + (info.domain || 'x');

    }
    function render() {
      var lv = L[cur] || { items: [] };
      tabEls.forEach(function (t, i) { var on = LEVEL_KEYS[i] === cur; t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = on ? 0 : -1; });
      panel.setAttribute('aria-labelledby', uid + '-' + cur);

      (lv.items || []).forEach(function (item) {
        var c = opts.card ? opts.card(item, partsEl(item), cur) : null;
        if (c) grid.appendChild(c);
      });
      while (panel.firstChild) panel.removeChild(panel.firstChild);
      if (lv.lead) panel.appendChild(el('p', { class: 'ef-level-lead', text: lv.lead }));

      }
      panel.appendChild(grid);
      if (opts.onRender) opts.onRender(panel, cur);
    }
    function select(k, byUser) {
      if (LEVEL_KEYS.indexOf(k) < 0) return;
      cur = k;
      if (byUser) try { localStorage.setItem(store, k); } catch (e) {}
      render();
    }
    while (box.firstChild) box.removeChild(box.firstChild);
    box.classList.add('ef-levels');
    box.appendChild(tabs);
    box.appendChild(panel);
    render();
    return { render: render, select: select, current: function () { return cur; } };
  }

  // ---- 記号の印・メニューの上のバーの名前・メニューのカード(4分野共通の形) ----
  function code(c) { return el('span', { class: 'ef-code', text: c }); }
  function menuTitle(h) {

    h.appendChild(el('span', { class: 'ef-title-name', text: (info.domainName || '') + ' 教材集' }));

  }
  function card(o) {
    o = o || {};
    var go = o.href
      ? el('a', { class: 'ef-btn-primary ef-mcard-go', href: o.href, text: 'ひらく ▶' })
      : el('button', { type: 'button', class: 'ef-btn-primary ef-mcard-go', text: 'ひらく ▶' });
    if (o.openAttrs) for (var k in o.openAttrs) go.setAttribute(k, o.openAttrs[k]);
    if (o.title) go.setAttribute('aria-label', (o.code ? o.code + ' ' : '') + o.title + ' をひらく');
    if (o.onOpen) go.addEventListener('click', function (e) { o.onOpen(e); });
    var extra = (o.extra || []).filter(Boolean);
    var c = el('article', { class: 'ef-card ef-mcard' }, [
      el('div', { class: 'ef-mcard-hd' }, [
        o.icon ? el('span', { class: 'ef-mcard-ic', 'aria-hidden': 'true', text: o.icon }) : null,
        el('div', { class: 'ef-mcard-ht' }, [
          o.code ? el('p', { class: 'ef-card-tag' }, [code(o.code)]) : null,
          el('h3', { class: 'ef-card-title', text: o.title || '' })
        ])
      ]),
      o.desc ? el('p', { class: 'ef-mcard-desc', text: o.desc }) : null,
      o.parts || null,
      extra.length ? el('div', { class: 'ef-mcard-extra' }, extra) : null,
      go
    ]);
    if (o.code) c.setAttribute('data-code', o.code);
    // カードのどこを押しても開く(カードの中のほかのボタン・リンク・入力は、そのまま)
    c.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('a, button, input, select, textarea, label, summary')) return;
      go.click();
    });
    return c;
  }

  window.EduitFrame = { AUTHOR: AUTHOR, furikaeri: furikaeri, open: open, footer: footer, aboutButton: aboutButton, mount: mount, levels: levels, card: card, code: code, menuTitle: menuTitle };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();

  <script>
// ネット詐欺 追体験ラボ: 場面を進めるしくみ(画面を使わない計算だけ。tests/unit.test.mjs から Node でも読める)。
//
// 場面(scenario)は「画面(node)」と「おわり(end)」のつながりでできている。
//   node.acts … その画面でできること。画面の中のボタン(screen の act: 'id' で指す)と、右の「あなたの行動」。
//     { id, label, to, step, need, needMsg, say, tone, panel }
//       to    … つぎの画面か、おわり(ends)の id
//       step  … やると「やることリスト」の1つが ✓ になる
//       need  … これをやる前に ✓ になっていないといけない step(なければ needMsg を出してその画面のまま)
//       say   … 押したあとに出す説明。tone は good(よい判断)・meh(それだけでは足りない)・info
//       panel … false なら「あなたの行動」には出さない(画面の中のボタンだけ)
//     acts に文字を書くと、scenario.shared の同じ名前の行動を使う(どの画面でも出したい行動)。
//   end.type … 'bad'(だまされた: その前の画面からやり直せる)・'clear'(クリア)
var ScamEngine = (function () {
  'use strict';

  function acts(sc, nodeId) {
    var node = sc.nodes[nodeId];
    if (!node) return [];
    return (node.acts || []).map(function (a) {
      if (typeof a === 'string') {
        var s = (sc.shared || {})[a];
        if (!s) throw new Error(sc.id + ': shared に ' + a + ' がありません');
        return Object.assign({ id: a }, s);
      }
      return a;
    });
  }
  function findAct(sc, nodeId, actId) {
    return acts(sc, nodeId).filter(function (a) { return a.id === actId; })[0] || null;
  }

  function init(sc) {
    return { started: false, node: sc.start, done: {}, misses: 0, hints: 0, hint: '', cleared: false, clearedAt: '', end: null, back: null, msg: null, log: [] };
  }
  function clone(st) { return JSON.parse(JSON.stringify(st)); }
  function missing(st, need) { return (need || []).filter(function (s) { return !st.done[s]; }); }

  // 行動を1つ行う。st は書きかえずに、新しい状態を返す。
  function apply(sc, st, act, now) {
    var n = clone(st);
    n.hint = '';
    if (n.end) return n;
    if (missing(n, act.need).length) {
      n.msg = { tone: 'need', text: act.needMsg || 'その前に、まだやることがあるよ。「やることリスト」の「？」を見てみよう。' };
      return n;
    }
    if (act.step) n.done[act.step] = true;
    n.msg = act.say ? { tone: act.tone || 'good', text: act.say } : null;
    n.log.push(n.node + ':' + (act.id || act.label));
    if (n.log.length > 60) n.log = n.log.slice(-60);
    if (act.to) {
      var e = sc.ends[act.to];
      if (e) {
        n.end = act.to;
        n.back = n.node;
        if (e.type === 'bad') n.misses += 1;
        else { n.cleared = true; n.clearedAt = n.clearedAt || now || ''; }
      } else {
        n.node = act.to;
      }
    }
    return n;
  }
  // だまされたあと、その前の画面にもどる(やったことの ✓ は残す)
  function back(sc, st) {
    var n = clone(st);
    n.node = n.back || sc.start;
    n.end = null;
    n.back = null;
    n.msg = null;
    return n;
  }
  // 場面をはじめから(クリアの記録・失敗の数・ヒントの数は残す)
  function restart(sc, st) {
    var n = init(sc);
    n.started = true;
    n.misses = st.misses;
    n.hints = st.hints;
    n.cleared = st.cleared;
    n.clearedAt = st.clearedAt;
    return n;
  }
  // つぎにやること(まだ ✓ になっていない、いちばん上の step)
  function nextStep(sc, st) {
    return sc.steps.filter(function (s) { return !st.done[s.id]; })[0] || null;
  }
  function useHint(sc, st) {
    var n = clone(st);
    var s = nextStep(sc, n);
    if (!s) return n;
    n.hints += 1;
    n.hint = s.hint;
    return n;
  }

  // データの点検(テスト用): 行き先があるか、クリアの前に全部の step が要るか
  function validate(sc) {
    var errs = [];
    var stepIds = sc.steps.map(function (s) { return s.id; });
    if (!sc.nodes[sc.start]) errs.push('start がない');
    Object.keys(sc.nodes).forEach(function (nid) {
      var node = sc.nodes[nid];
      var list;
      try { list = acts(sc, nid); } catch (e) { errs.push(e.message); return; }
      var ids = list.map(function (a) { return a.id; }).filter(Boolean);
      screenRefs(node.screen).forEach(function (r) {
        if (ids.indexOf(r) < 0) errs.push(nid + ': 画面のボタン ' + r + ' の行動がない');
      });
      list.forEach(function (a) {
        if (a.to && !sc.nodes[a.to] && !sc.ends[a.to]) errs.push(nid + ': 行き先 ' + a.to + ' がない');
        if (a.step && stepIds.indexOf(a.step) < 0) errs.push(nid + ': step ' + a.step + ' がない');
        (a.need || []).forEach(function (s) { if (stepIds.indexOf(s) < 0) errs.push(nid + ': need ' + s + ' がない'); });
        if (a.to && sc.ends[a.to] && sc.ends[a.to].type === 'clear') {
          var have = (a.need || []).concat(a.step ? [a.step] : []);
          stepIds.forEach(function (s) { if (have.indexOf(s) < 0) errs.push(nid + ': クリアの前に ' + s + ' が要らない'); });
        }
        if (!a.label && a.panel !== false) errs.push(nid + ': 行動の文がない');
      });
    });
    return errs;
  }
  // 画面のデータから act: 'id' を全部ひろう
  function screenRefs(x) {
    var out = [];
    (function walk(v) {
      if (Array.isArray(v)) v.forEach(walk);
      else if (v && typeof v === 'object') Object.keys(v).forEach(function (k) { if (k === 'act' && typeof v[k] === 'string') out.push(v[k]); else walk(v[k]); });
    })(x);
    return out;
  }
  // クリアまでの行動の順番を1つさがす(テスト用。状態 = 画面 + ✓ の組み合わせ)
  function solve(sc) {
    var start = init(sc);
    var key = function (st) { return st.node + '|' + Object.keys(st.done).sort().join(','); };
    var queue = [{ st: start, path: [] }];
    var seen = {};
    seen[key(start)] = true;
    while (queue.length) {
      var cur = queue.shift();
      var list = acts(sc, cur.st.node);
      for (var i = 0; i < list.length; i++) {
        var a = list[i];
        var n = apply(sc, cur.st, a, 'test');
        if (n.end && sc.ends[n.end].type === 'clear') return cur.path.concat([a.id || a.label]);
        if (n.end) continue;
        var k = key(n);
        if (seen[k]) continue;
        seen[k] = true;
        queue.push({ st: n, path: cur.path.concat([a.id || a.label]) });
      }
    }
    return null;
  }

  return { acts: acts, findAct: findAct, init: init, apply: apply, back: back, restart: restart, nextStep: nextStep, useHint: useHint, validate: validate, screenRefs: screenRefs, solve: solve };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = ScamEngine;

</script>
  <script>
// ネット詐欺 追体験ラボの場面。しくみは js/engine.js の説明を見る。
// 会社名・サイト名・アドレスはすべて架空(アドレスは例示用に予約された .example だけ)。
// IPアドレスは説明用に予約された 203.0.113.x、電話番号は実在しない 0000 をふくむ番号、口座番号も架空。
// 情報セキュリティ体験ラボ(フィッシング見分け・判断ロールプレイ)とは、場面も学ぶことも重ならないようにしている:
//   あちらは「メールのどこが怪しいか見つける」「DM・アプリの権限・パスワードを聞かれたときの判断」。
//   こちらは、だまされる画面を自分で操作して「正しい手順を最後までやりきる」体験。

  var scenarios = [

    {
      id: 'oneclick', no: '1', min: '10分', device: 'phone', title: 'ワンクリック詐欺',
      desc: '動画の再生ボタンを押しただけで「登録完了・99,800円」と出た！',
      story: 'SNSで「無料で見られる」と話題になっていた動画サイトを、自分のスマホで開いてみた。',
      goal: 'お金をはらわず、相手に連絡もせずに、この「請求」から安全にぬけ出そう。',
      steps: [
        { id: 'look', label: '「お客様の情報」で、名前や住所は知られていないと気づく', hint: '画面に出ている「お客様の情報」は、本当にあなたがだれかわかる情報？「あなたの行動」から考えてみよう。' },
        { id: 'nopay', label: 'ボタンを1回押しただけでは契約していない(はらわない)と気づく', hint: '料金の説明もなく、ボタンを1回押しただけ。これで本当に「契約」したことになるのか考えよう。' },
        { id: 'close', label: '連絡も支払いもしないで、画面を閉じる', hint: 'お金をはらうボタンも、問い合わせのボタンも押さずに、その画面から離れよう。' },
        { id: 'block', label: 'しつこい通知を止めて、閲覧履歴を消す', hint: '閉じたのに出てくるのは「通知」のしくみ。ブラウザの設定で止められるよ。' },
        { id: 'consult', label: '家の人に話す', hint: 'ひとりでかかえこまないで、だれかに話そう。' }
      ],
      start: 'site',
      shared: {
        look: { label: '「お客様の情報」で、自分のことがどこまで知られたのか考える', step: 'look',

    var d = Math.floor(sec / 86400), hh = Math.floor(sec % 86400 / 3600), mm = Math.floor(sec % 3600 / 60), ss = sec % 60;
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return (d ? d + '日 ' : '') + (d || hh ? p(hh) + ':' : '') + p(mm) + ':' + p(ss);
  }
  function blocks(list, onAct) {
    return (list || []).map(function (b) {
      switch (b.t) {
        case 'h': return h('p', { class: 'sb-h ' + (b.cls || ''), text: b.text });
        case 'p': return h('p', { class: 'sb-p ' + (b.cls || ''), text: b.text });
        case 'btn': return h('button', { type: 'button', class: 'sb-btn ' + (b.cls || ''), on: { click: onAct(b.act) } }, b.text);
        case 'link': return h('button', { type: 'button', class: 'sb-link', on: { click: onAct(b.act) } }, b.text);
        case 'box': {
          var box = h(b.act ? 'button' : 'div', { type: b.act ? 'button' : null, class: 'sb-box ' + (b.cls || ''), on: b.act ? { click: onAct(b.act) } : null },
            b.title ? h('b', { class: 'sb-box-title', text: b.title }) : null,
            b.lines.map(function (l) { return h('span', { class: 'sb-line', text: l }); }));
          return box;
        }
        case 'thumbs': return h('div', { class: 'sb-thumbs' }, b.items.map(function (it) {
          return h('div', { class: 'sb-thumb' }, h('span', { class: 'sb-emoji', 'aria-hidden': 'true', text: it.emoji }), h('span', { text: it.text }));
        }));
        case 'timer': {
          var key = timerKey + ':' + b.label;
          if (!timerStart[key]) timerStart[key] = Date.now();
          var since = function () { return Math.floor((Date.now() - timerStart[key]) / 1000); };
          var left = Math.max(0, b.sec - since());
          var out = h('b', { class: 'sb-timer-v', text: fmtTime(left) });
          timers.push(setInterval(function () { left = Math.max(0, b.sec - since()); out.textContent = fmtTime(left); }, 1000));
          return h('p', { class: 'sb-timer' }, b.label + ' ', out);
        }
        case 'field': return h('div', { class: 'sb-field' }, h('span', { text: b.label }), h('span', { class: 'sb-input', 'aria-hidden': 'true' }));
        case 'table': return h('table', { class: 'sb-table' }, h('tbody', null, b.rows.map(function (r) { return h('tr', null, h('th', { text: r[0] }), h('td', { text: r[1] })); })));
      }
      return null;
    });
  }
  function renderDevice(sc, scr, st, onAct) {

          scr.dialog ? h('div', { class: 'sb-dialog', role: 'group', 'aria-label': scr.dialog.title },
            h('b', { class: 'no-ruby', text: scr.dialog.title }), h('p', { text: scr.dialog.text }),
            h('div', { class: 'sb-dialog-btns' }, scr.dialog.buttons.map(function (x) { return h('button', { type: 'button', class: 'sb-btn', on: { click: onAct(x.act) } }, x.text); }))) : null
        ];
        break;
      case 'mail-list':
        inner = [h('div', { class: 'sb-appbar', text: scr.app || 'メール' }), h('ul', { class: 'sb-mails' }, scr.items.map(function (m) {
          var content = [h('span', { class: 'sb-mail-from' }, m.from, m.clip ? h('span', { class: 'sb-clip', 'aria-label': '添付ファイルあり', text: ' 📎' }) : null, h('span', { class: 'sb-mail-time', text: m.time })),

          h('p', { class: 'sb-mail-head' }, h('b', { text: scr.from }),
            showAddr ? h('span', { class: 'sb-addr no-ruby' + (scr.addrStep ? ' flagged' : ''), text: ' <' + scr.addr + '>' })
              : h('button', { type: 'button', class: 'sb-more', 'aria-label': '差出人のくわしい情報を見る', on: { click: onAct(scr.addrAct) } }, '▼'),
            h('span', { class: 'sb-mail-time', text: scr.time })),
          h('div', { class: 'sb-mail-body' }, scr.body.map(function (l) { return h('p', { text: l }); })),
          (scr.attach || []).map(function (a) {
            return h('button', { type: 'button', class: 'sb-attach', on: { click: onAct(a.act) } }, h('span', { 'aria-hidden': 'true', text: '📎 ' }), a.name, h('span', { class: 'sb-mail-time', text: a.size }));
          }),
          (scr.buttons || []).map(function (b) { return h('button', { type: 'button', class: 'sb-btn big', on: { click: onAct(b.act) } }, b.text); }),
          (scr.links || []).map(function (b) { return h('button', { type: 'button', class: 'sb-link small', on: { click: onAct(b.act) } }, b.text); }))];
        break;
      }
      case 'home':
        inner = [h('div', { class: 'sb-home' },
          h('p', { class: 'sb-clock', text: '19:24' }),
          scr.notice ? h('button', { type: 'button', class: 'sb-notice', on: { click: onAct(scr.notice.act) } },
            h('span', { class: 'sb-notice-app no-ruby', text: '🔔 ' + scr.notice.app }), h('span', { text: scr.notice.text })) : null,
          h('div', { class: 'sb-apps', 'aria-hidden': 'true' }, ['📞', '✉️', '🌐', '📷', '🎵', '⚙️', '🗓️', '🗺️'].map(function (x) { return h('span', { class: 'sb-app', text: x }); })))];
        break;
      case 'sns':
        inner = [h('div', { class: 'sb-appbar', text: 'SNS' }), h('div', { class: 'sb-page sb-feed' }, scr.posts.map(function (p) {
          return h('div', { class: 'sb-post' + (p.ad ? ' ad' : '') },
            h('p', { class: 'sb-post-name' }, p.name, p.ad ? h('span', { class: 'sb-ad', text: '広告' }) : null),
            p.emoji ? h('p', { class: 'sb-post-img', 'aria-hidden': 'true', text: p.emoji }) : null,
            h('p', { text: p.text }),
            p.btn ? h('button', { type: 'button', class: 'sb-btn', on: { click: onAct(p.btn.act) } }, p.btn.text) : null);
        }))];
        break;
      case 'doc':
        inner = [h('div', { class: 'sb-appbar no-ruby', text: '📄 ' + scr.file }),
          h('div', { class: 'sb-docbar' }, h('span', { text: '⚠ ' + scr.bar.text }), h('button', { type: 'button', class: 'sb-btn', on: { click: onAct(scr.bar.btn.act) } }, scr.bar.btn.text)),
          h('div', { class: 'sb-page' }, blocks(scr.body, onAct))];
        break;
      case 'search':
        inner = [h('div', { class: 'sb-urlbar' }, h('span', { 'aria-hidden': 'true', text: '🔍 ' }), h('span', { text: scr.query })),
          h('div', { class: 'sb-page' }, scr.results.map(function (r) {
            return h('div', { class: 'sb-result' }, h('span', { class: 'sb-result-url no-ruby', text: r.url }), h('b', { class: 'sb-result-title', text: r.title }), h('span', { text: r.text }));
          }))];
        break;
      case 'desktop':
        inner = [h('div', { class: 'sb-desktop' }, h('p', { text: '🖥 ' + scr.text }))];
        break;
    }
    return h('div', { class: 'device ' + sc.device + (scr.full ? ' full' : '') },
      h('p', { class: 'visually-hidden', text: (sc.device === 'pc' ? 'パソコン' : 'スマホ') + 'の画面' }),
      h('div', { class: 'device-screen' }, inner));
  }

  // ================= まとめとふりかえり =================
  function renderMatome(el) {
    var refl = saved.refl || {};
    var cleared = D.scenarios.filter(function (sc) { return scState(sc).cleared; }).length;
    append(el, [
      card('どの詐欺にも共通すること',
        h('p', { text: 'ワンクリック詐欺・当選メール・ウイルス付きメール・にせのウイルス警告・にせの通販サイト。見た目はちがっても、だます人のやり方は同じです。' }),
        h('div', { class: 'flow' }, D.common.map(function (c, i) {
          return h('div', { class: 'flow-box' }, h('b', { text: (i + 1) + '. ' + c.title }), h('span', { text: c.text }));
        }))),
      card('あやしいと思ったら、この3つ',
        h('div', { class: 'flow' }, D.rule.map(function (c, i) {
          return [i ? h('span', { class: 'flow-arrow', 'aria-hidden': 'true', text: '→' }) : null,
            h('div', { class: 'flow-box accent' }, h('b', { text: c.title }), h('span', { text: c.text }))];
        })),
        h('p', { class: 'muted', text: '情報セキュリティ体験ラボの「立ち止まる → 確認する → 相談する」と同じ考え方です。' })),
      card(D.consult.title,
        h('p', { text: D.consult.first }),
        h('ul', { class: 'consult' }, D.consult.lines.map(function (l) {
          return h('li', null, h('b', { text: l.name + '　' }), h('span', { class: 'tel', text: l.tel }), h('span', { class: 'muted', text: '　' + l.note }));
        }))),
      reflectOnly(card('ふりかえり',
        h('p', { class: 'muted', text: 'クリアした場面: ' + cleared + ' / ' + D.scenarios.length + '。書いた文は、この端末の中だけに保存されます。' }),
        D.reflQ.map(function (q) {
          var ta = h('textarea', { id: 'refl-' + q.id, class: 'input', rows: 3, maxlength: '600' });
          ta.value = refl[q.id] || '';
          ta.addEventListener('input', function () { var r = saved.refl || {}; r[q.id] = ta.value; save('refl', r); markNav(); });
          return h('div', { class: 'field' }, h('label', { for: 'refl-' + q.id, text: q.label }), ta);
        })))
    ]);
  }

  // ================= ふりかえり・記録 =================
  function buildRecord() {
    var st = saved.student || {};
    var refl = saved.refl || {};
    return {
      app: APP,
      exportedAt: new Date().toISOString(),
      student: { cls: st.cls || '', num: st.num || '', name: st.name || '' },
      scenarios: D.scenarios.map(function (sc) {
        var s = scState(sc);
        return { id: sc.id, no: '①②③④⑤⑥'.charAt(Number(sc.no) - 1), title: sc.title, cleared: !!s.cleared, clearedAt: s.clearedAt || '', misses: s.misses || 0, hints: s.hints || 0,
          steps: sc.steps.filter(function (x) { return s.done[x.id]; }).length + ' / ' + sc.steps.length };
      }),
      reflection: { r1: refl.r1 || '', r2: refl.r2 || '', r3: refl.r3 || '' }
    };
  }
  function recordCsv(r) {
    var cell = function (v) {
      var s = String(v == null ? '' : v);
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return '"' + s.replace(/"/g, '""') + '"';
    };
    var head = ['組', '番号', '名前', 'クリアした場面'].concat(r.scenarios.map(function (x) { return x.no + ' ' + x.title; })).concat(['ふりかえり1', 'ふりかえり2', 'ふりかえり3']);
    var row = [r.student.cls, r.student.num, r.student.name, r.scenarios.filter(function (x) { return x.cleared; }).length + ' / ' + r.scenarios.length]
      .concat(r.scenarios.map(function (x) { return (x.cleared ? 'クリア' : 'まだ') + '(だまされた ' + x.misses + '・ヒント ' + x.hints + ')'; }))
      .concat([r.reflection.r1, r.reflection.r2, r.reflection.r3]);
    return '﻿' + head.map(cell).join(',') + '\r\n' + row.map(cell).join(',');
  }
  function renderRecordsPage(el) {
    var st = saved.student || {};
    var note = h('p', { class: 'export-note', role: 'status', 'aria-live': 'polite' });
    function field(id, label, key, size) {
      var inp = h('input', { id: id, type: 'text', class: 'input', maxlength: '40', size: size });
      inp.value = st[key] || '';
      inp.addEventListener('input', function () { st[key] = inp.value.trim(); save('student', st); });
      return h('div', { class: 'field' }, h('label', { for: id, text: label }), inp);
    }
    function fileName(ext) {
      var who = [st.cls, st.num, st.name].filter(Boolean).join('_') || '記録';
      return (APP.replace(/\s/g, '_') + '_' + who + '.' + ext).replace(/[\\/:*?"<>|]/g, '_');
    }
    function ready() {
      if (!String(st.cls || '').trim() || !String(st.num || '').trim()) {
        note.className = 'export-note warn';
        note.textContent = '組と番号を入れてから書き出そう';
        document.getElementById(String(st.cls || '').trim() ? 'rec-num' : 'rec-cls').focus();
        return false;
      }
      return true;
    }
    function download(ext) {
      if (!ready()) return;
      var r = buildRecord();
      var text = ext === 'json' ? JSON.stringify(r, null, 2) : recordCsv(r);
      var name = fileName(ext);
      try {
        var url = URL.createObjectURL(new Blob([text], { type: ext === 'json' ? 'application/json' : 'text/csv' }));
        var a = h('a', { href: url, download: name });
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        note.className = 'export-note good';
        note.textContent = 'ファイルを保存しました(ファイル名: ' + name + ')。先生に言われた場所に出そう。ファイルができないときは「記録をコピーする」を使います。';
      } catch (e) {
        note.className = 'export-note warn';
        note.textContent = 'ファイルを作れませんでした。「記録をコピーする」を使ってください。';
      }
    }
    function copy() {
      if (!ready()) return;
      var r = buildRecord();
      var text = [r.app, '組: ' + r.student.cls + '　番号: ' + r.student.num + '　名前: ' + r.student.name]
        .concat(r.scenarios.map(function (x) { return x.no + ' ' + x.title + ': ' + (x.cleared ? 'クリア' : 'まだ') + '(だまされた ' + x.misses + '回・ヒント ' + x.hints + '回)'; }))
        .concat(['ふりかえり1: ' + r.reflection.r1, 'ふりかえり2: ' + r.reflection.r2, 'ふりかえり3: ' + r.reflection.r3]).join('\n');
      var done = function () { note.className = 'export-note good'; note.textContent = 'コピーしました。先生に言われた場所(Classroom など)にはりつけよう。'; };
      var fallback = function () {
        var ta = h('textarea', { class: 'input', rows: 6, readonly: true });
        ta.value = text;
        note.textContent = 'コピーできなかったので、下の文を全部えらんでコピーしてください。';
        note.className = 'export-note warn';
        note.appendChild(ta);
        ta.select();
      };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
    }
    var r = buildRecord();
    var refl = saved.refl || {};
    append(el, [
      h('div', { class: 'module-head' },
        h('h1', { class: 'sec-title', text: FK_OFF ? '記録' : 'ふりかえり・記録' }),
        h('p', { class: 'meta', text: (FK_OFF ? 'クリアした場面' : 'クリアした場面とふりかえり') + 'は、この端末のブラウザの中にだけ保存されています。提出するときは、ファイルに書き出してください。' })),
      card('名前',
        h('p', { class: 'muted', text: '名前は、先生の指示がないときは入れなくてかまいません。' }),
        h('div', { class: 'field-row' }, field('rec-cls', '組', 'cls', 4), field('rec-num', '番号', 'num', 4), field('rec-name', '名前(なくてもよい)', 'name', 12))),
      card(FK_OFF ? '進み具合' : '進み具合とふりかえり',
        h('div', { class: 'table-wrap' }, h('table', { class: 'data' },
          h('thead', null, h('tr', null, h('th', { text: '場面' }), h('th', { text: 'クリア' }), h('th', { text: 'だまされた' }), h('th', { text: 'ヒント' }))),
          h('tbody', null, r.scenarios.map(function (x) {
            return h('tr', null, h('td', { text: x.label + ' ' + x.title }), h('td', { text: x.cleared ? '✓' : '' }), h('td', { text: x.misses + ' 回' }), h('td', { text: x.hints + ' 回' }));
          })))),
        h('ul', { class: 'refl-list', 'data-ef-reflect': '' }, D.reflQ.map(function (q, i) {
          return h('li', null, h('b', { text: 'ふりかえり' + (i + 1) + ': ' }), refl[q.id] ? h('span', { text: refl[q.id] }) : h('span', { class: 'muted', text: '(まだ書いていません)' }));
        })),
        h('p', { class: 'muted', 'data-ef-reflect': '' }, 'ふりかえりは「', h('a', { href: '#matome', text: '⑥ まとめとふりかえり' }), '」で書きます。')),
      card('書き出す',
        h('p', null, h('strong', { text: '先生に出すのは JSON のファイルです。' }), 'CSV は、表計算ソフトで見るときに使います。ファイルができないときは「記録をコピーする」を使います。'),
        h('div', { class: 'btn-row' },
          btn('記録を書き出す(JSON・提出用)', function () { download('json'); }, 'ef-btn-primary'),
          btn('CSVで書き出す(表計算用)', function () { download('csv'); }),
          btn('記録をコピーする', copy)),
        note,
        point('書き出す中身', h('p', { text: '組・番号・名前、場面ごとのクリア・だまされた回数・ヒントの回数、ふりかえりの文章だけです。' }))),
      renderReset()
    ]);
  }

  // ---- はじめからやり直す(データリセット) ----
  // 確認は画面の中で行う。ふりがな・文字の大きさは表示の設定なので消さない(ほかの情報の教材と同じ)。
  var resetAsk = false;
  var resetMsg = '';
  function renderReset() {
    var box = card('はじめからやり直す',
      h('p', { text: '次の人に端末をわたすときや、最初からやり直したいときに使います。この端末に保存した組・番号・名前、クリアした場面、だまされた回数、ふりかえりを、すべて消します。ふりがな・文字の大きさの設定は残ります。' }));
    box.id = 'reset';
    box.classList.add('reset-card');
    if (!resetAsk) {
      box.appendChild(h('div', { class: 'btn-row' }, btn('この端末の記録をすべて消す', function () { resetAsk = true; resetMsg = ''; rerender(); }, 'ef-btn reset-btn')));
    } else {
      box.appendChild(h('div', { class: 'reset-confirm', role: 'alert' },
        h('p', null, h('strong', { text: '本当に消しますか？' }), '消した記録は元にもどせません。提出がまだなら、先に「書き出す」でファイルにしておこう。'),
        h('div', { class: 'btn-row' },
          btn('消す(はじめからやり直す)', function () { resetAll(); }, 'ef-btn-primary danger'),
          btn('やめる', function () { resetAsk = false; rerender(); }))));
    }
    if (resetMsg) box.appendChild(h('p', { class: 'export-note good', role: 'status', text: resetMsg }));
    return box;
  }
  function resetAll() {
    clearTimers();
    var keep = { furigana: saved.furigana, big: saved.big };
    saved = {};
    try { localStorage.removeItem(KEY); } catch (e) { /* 保存できない環境でも続ける */ }
    if (keep.furigana) save('furigana', true);
    if (keep.big) save('big', true);
    resetAsk = false;
    resetMsg = '記録をすべて消しました。はじめから使えます。';
    current = null;
    show('records');
    resetMsg = '';
    toast('記録を消しました');
    var b = document.querySelector('.reset-btn');
    if (b) try { b.focus({ preventScroll: true }); } catch (e) { b.focus(); }
    var r = document.getElementById('reset');
    if (r) r.scrollIntoView({ block: 'center' });
  }
  function toast(msg) {
    var t = document.querySelector('.toast') || document.body.appendChild(h('div', { class: 'toast', role: 'status' }));
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2500);
  }

  // ---- 表示の切りかえ(ふりがな・大きな文字) ----
  function setupToggles() {
    var tools = document.getElementById('display-toggles');
    [['furigana', 'ふりがな', 'show-ruby'], ['big', '大きな文字', 'big-text']].forEach(function (t) {
      var on = !!saved[t[0]];
      document.documentElement.classList.toggle(t[2], on);
      var b = h('button', { type: 'button', class: 'toggle ef-btn', 'aria-pressed': String(on) }, t[1]);
      b.addEventListener('click', function () {
        on = !on;
        save(t[0], on);
        b.setAttribute('aria-pressed', String(on));
        document.documentElement.classList.toggle(t[2], on);
        if (t[0] === 'furigana' && current) rerender();
      });
      tools.appendChild(b);
    });
  }

  buildNav();
  setupToggles();
  window.addEventListener('hashchange', route);
  route();
})();

</script>
