  :root:not([data-theme="light"]) { --cpu: #b393ec; --cpu-soft: #2a2140; --write: #f0955a; --write-soft: #3d2516; }
}
:root[data-theme="dark"] { --cpu: #b393ec; --cpu-soft: #2a2140; --write: #f0955a; --write-soft: #3d2516; }

.muted { color: var(--text-muted); }
.page { display: block; max-width: 1240px; margin: 0 auto; padding: 20px; outline: none; }
.main-nav { display: flex; gap: 4px; flex-wrap: wrap; }
.main-nav a { text-decoration: none; color: var(--text-primary); padding: 6px 12px; border-radius: 8px; font-size: 0.92rem; }
.main-nav a:hover { background: var(--surface-2); }
.main-nav a[aria-current="page"] { background: var(--accent-soft); font-weight: 700; }
@media (max-width: 860px) {
  .main-nav { width: 100%; overflow-x: auto; flex-wrap: nowrap; }
  .main-nav a { white-space: nowrap; }
  .page { padding: 12px 16px; }
}
.page-head { margin-bottom: 14px; }
.page-head .muted { margin: 0; }
.crumb { font-size: 0.85rem; margin: 0 0 4px; color: var(--text-muted); }
.hero { padding: 18px 0 22px; }
.hero h1 { font-size: 2rem; margin-bottom: 6px; }
.hero .lead { font-size: 1.05rem; color: var(--text-secondary); max-width: 46em; }
.hero .author { font-weight: 700; color: var(--text-secondary); margin: 0; }
.small-status { font-size: 0.78rem; padding: 0 8px; margin-left: 6px; align-self: flex-start; }
.status:not(.good):not(.warn):not(.bad) { background: var(--surface-2); color: var(--text-secondary); }
.module-card.cleared { border-color: var(--good); }
.stars { color: var(--focus); letter-spacing: 1px; }
.teacher { margin-top: 18px; }
.teacher summary { cursor: pointer; font-weight: 700; }
.next-link { justify-content: flex-end; }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
.linkish { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-weight: 700; }
.code-block { font-family: var(--mono); background: var(--surface-2); border-radius: 8px; padding: 10px 14px; overflow-x: auto; font-size: 0.9rem; line-height: 1.6; margin: 8px 0; }
.code-block.small { font-size: 0.8rem; max-height: 220px; }

/* 命令表 */
.isa-table { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 18px; }
.isa-table summary { cursor: pointer; font-weight: 700; }
.isa-table code.op { font-weight: 700; color: var(--accent); }
.syntax-notes { font-size: 0.88rem; color: var(--text-secondary); margin: 10px 0 0; padding-left: 1.3em; }

/* シミュレーター */
.sim-card { padding: 16px; }
.sim { display: grid; grid-template-columns: minmax(250px, 340px) minmax(0, 1fr); gap: 18px; }
/* 2列にするのは、記憶装置のマスが十分広くとれるときだけ（iPad 横 1080px などは1列） */
@media (max-width: 1180px) { .sim { grid-template-columns: minmax(0, 1fr); } }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.panel-head h3 { margin: 0; }
.editor { font-family: var(--mono); font-size: 0.95rem; line-height: 1.6; min-height: 320px; white-space: pre; tab-size: 4; }
.listing { list-style: none; margin: 0; padding: 6px 0; font-family: var(--mono); font-size: 0.92rem; line-height: 1.6; background: var(--surface-2); border-radius: 8px; max-height: 460px; overflow: auto; border: 1.5px solid var(--border); }
.listing li { display: flex; gap: 10px; padding: 0 10px; border-left: 4px solid transparent; }
.listing li .addr { flex: none; width: 2.2em; text-align: right; color: var(--text-muted); font-size: 0.8rem; padding-top: 0.15em; }
.listing li code { white-space: pre; }
.listing li.now { background: var(--accent-soft); border-left-color: var(--accent); font-weight: 700; }
.listing li.next { border-left-color: var(--border); }
.err-list { margin: 0; padding-left: 1.2em; }
.asm-errors .explain { margin-top: 8px; }

.sim-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
.sim-controls .btn-row { margin: 0; }
.step-help { flex-basis: 100%; margin: 0; font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5; }
.speed { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; min-width: 230px; flex: 1; max-width: 340px; }
.speed input { flex: 1; }
.speed-label { min-width: 6.5em; font-weight: 400; color: var(--text-secondary); }

.board {
  position: relative; display: grid; gap: 10px; margin-top: 12px;
  grid-template-columns: minmax(0, 0.8fr) minmax(0, 2fr) minmax(0, 0.8fr);
  grid-template-areas: "in cpu out" "mem mem mem";
}
@media (max-width: 640px) {
  .board { grid-template-columns: 1fr 1fr; grid-template-areas: "cpu cpu" "in out" "mem mem"; }
}
.unit { background: var(--surface-1); border: 2px solid var(--border); border-radius: 10px; padding: 8px 10px; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; min-width: 0; }
.unit h4 { margin: 0 0 2px; font-size: 0.95rem; }
.unit-sub { font-size: 0.75rem; color: var(--text-muted); font-weight: 400; }
.unit.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.u-in { grid-area: in; }
.u-out { grid-area: out; }
.u-mem { grid-area: mem; }
.cpu { grid-area: cpu; border: 2px dashed var(--cpu); border-radius: 12px; padding: 22px 8px 8px; position: relative; display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; background: var(--cpu-soft); }
@media (max-width: 420px) { .cpu { grid-template-columns: 1fr; } }
.cpu-label { position: absolute; top: 2px; left: 10px; font-size: 0.75rem; font-weight: 700; color: var(--cpu); }
.cpu .unit.active { border-color: var(--cpu); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cpu) 25%, transparent); }
.regs { font-size: 0.8rem; display: grid; gap: 2px; }
.regs > div { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.reg-name { color: var(--text-secondary); }
/* 用語の説明（押すと出る） */
.term-btn { font: inherit; font-size: 0.8rem; color: var(--text-secondary); background: none; border: 0; padding: 4px 2px; min-height: 34px; cursor: pointer; text-align: left; display: inline-flex; align-items: center; gap: 4px; text-decoration: underline dotted; text-underline-offset: 3px; }
.term-btn .term-mark { flex: none; display: inline-grid; place-items: center; width: 1.25em; height: 1.25em; border-radius: 50%; border: 1px solid currentColor; font-size: 0.7rem; text-decoration: none; }
.term-btn[aria-expanded="true"] { color: var(--accent); font-weight: 700; }
.term-note { display: block; font-size: 0.78rem; line-height: 1.5; background: var(--surface-2); border-radius: 6px; padding: 4px 8px; margin: 0 0 4px; color: var(--text-primary); }
.reg-val { font-family: var(--mono); font-weight: 700; font-size: 1.05rem; }
.reg-val.ir { color: var(--accent); }
.reg-val.small { font-size: 0.85rem; }
.steps-line { font-size: 0.75rem; color: var(--text-muted); }
.phase-pills { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
.phase-pills .pill { flex: 1 0 auto; text-align: center; font-size: 0.72rem; border-radius: 99px; padding: 1px 4px; background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); white-space: nowrap; }
.phase-pills .pill.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.acc-val { display: block; font-family: var(--mono); font-weight: 700; font-size: 1.9rem; line-height: 1.2; text-align: center; padding: 4px 0; }
.calc { font-family: var(--mono); font-size: 0.85rem; text-align: center; color: var(--cpu); min-height: 1.4em; }
.queue { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { font-family: var(--mono); font-weight: 700; font-size: 0.9rem; padding: 1px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.chip.used { background: var(--surface-2); color: var(--text-muted); text-decoration: line-through; font-weight: 400; }
.screen { margin-top: 6px; background: #10231a; color: #7cf0a6; font-family: var(--mono); font-weight: 700; border-radius: 6px; padding: 6px 8px; min-height: 88px; max-height: 150px; overflow-y: auto; font-size: 0.95rem; line-height: 1.4; }
.mem-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; margin-top: 6px; }
@media (max-width: 760px) { .mem-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.cell { border: 1.5px solid var(--border); border-radius: 6px; padding: 2px 5px; min-height: 44px; display: flex; flex-direction: column; justify-content: flex-start; background: var(--surface-1); min-width: 0; transition: background 0.2s; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.cell-addr { font-size: 0.68rem; color: var(--text-muted); display: flex; justify-content: space-between; gap: 2px; white-space: nowrap; overflow: hidden; }
.cell-label { color: var(--cpu); font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
/* 命令は切らずに2行まで出す（「STORE max」「JUMP loop」も読める） */
.cell-val { font-family: var(--mono); font-size: 0.8rem; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.cell-info { font-size: 0.85rem; color: var(--text-secondary); margin: 6px 0 0; min-height: 1.5em; }
.cell.instr .cell-val { color: var(--accent); }
.cell.data { background: var(--surface-2); }
.cell.unused .cell-val { color: var(--text-muted); font-weight: 400; }
.cell.pc { border-color: var(--accent); border-width: 2.5px; border-style: dashed; }
.cell.now { background: var(--accent-soft); border-color: var(--accent); border-style: solid; }
.cell.read { box-shadow: 0 0 0 3px var(--accent); }
.cell.write { background: var(--write-soft); border-color: var(--write); box-shadow: 0 0 0 3px var(--write); }
.cell.write .cell-val { color: var(--write); }
.fly-layer { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.fly-chip { position: absolute; left: 0; top: 0; background: var(--focus); color: #1b1b1a; font-family: var(--mono); font-weight: 700; padding: 2px 10px; border-radius: 99px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); white-space: nowrap; z-index: 3; }
.narration { margin-top: 8px; min-height: 3.2em; background: var(--surface-2); border-radius: 8px; padding: 8px 12px; font-size: 0.95rem; }
.phase-tag { display: inline-block; font-size: 0.75rem; font-weight: 700; border-radius: 99px; padding: 0 8px; background: var(--accent); color: var(--accent-ink); vertical-align: 1px; }
.phase-tag.error { background: var(--bad); }
.sim-status .explain { margin-bottom: 0; }
.sample-pick { margin: 0; max-width: 480px; }
.sample-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 8px 0 0; }
.sample-row label { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.sample-row select { width: auto; max-width: 100%; }
/* プログラムの読み方 */
.reading-list { margin: 6px 0 0; padding-left: 1.2em; font-size: 0.9rem; line-height: 1.6; }
.reading-list li { margin: 2px 0; }
.reading-list code { font-weight: 700; color: var(--accent); background: var(--surface-2); border-radius: 4px; padding: 0 4px; }
.reading-card h3 { margin-bottom: 0; }

/* 課題 */
.task-card .explain:first-child { margin-top: 0; }
.hint-list { margin: 6px 0; padding-left: 1.4em; }
.hint-list li { background: var(--warn-soft); border-radius: 6px; padding: 4px 10px; margin: 4px 0; }
.answer { margin: 8px 0; }
.answer summary { cursor: pointer; font-weight: 700; color: var(--text-secondary); }
.check-table tr.ok td:last-child { color: var(--good); font-weight: 700; }
.check-table tr.ng td:last-child { color: var(--bad); font-weight: 700; }
.check-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 8px; }
.check-bar .hint { margin: 0; }
.answer-note { font-size: 0.85rem; color: var(--text-secondary); margin: 4px 0; }
/* 課題の区分（必修・発展・チャレンジ） */
.tier-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 18px 0 8px; }
.tier-head h3 { margin: 0; }
.tier-badge { display: inline-block; font-size: 0.75rem; font-weight: 700; border-radius: 99px; padding: 0 8px; border: 1.5px solid currentColor; vertical-align: 2px; }
.tier-badge.must { color: var(--accent); }
.tier-badge.adv { color: var(--cpu); }
.tier-badge.challenge { color: var(--warn); }
.concept { font-size: 0.78rem; color: var(--text-secondary); }
.done-rule { font-size: 0.85rem; color: var(--text-secondary); margin: 6px 0 0; }

/* 図解 */
.diagram-wrap { overflow-x: auto; }
svg.five-units { width: 100%; min-width: 520px; max-width: 860px; height: auto; max-height: 50vh; display: block; margin: 0 auto 10px; font-family: var(--font); }
.five-units .box rect { fill: var(--surface-2); stroke: var(--border); stroke-width: 2; transition: fill 0.25s, stroke 0.25s; }
.five-units .box.cpu rect { fill: var(--cpu-soft); }
.five-units .box.active rect { stroke: var(--accent); stroke-width: 3; fill: var(--accent-soft); }
.five-units .box.cpu.active rect { stroke: var(--cpu); fill: var(--cpu-soft); }
.five-units .box-title { fill: var(--text-primary); font-size: 17px; font-weight: 700; }
.five-units .box-sub { fill: var(--text-secondary); font-size: 12px; }
.five-units .box-value { fill: var(--write); font-size: 15px; font-weight: 700; font-family: var(--mono); }
.five-units .arr { fill: none; stroke: var(--border); stroke-width: 2.5; transition: stroke 0.25s; }
.five-units .arr.ctrl { stroke-dasharray: 6 5; }
.five-units .arr.on { stroke: var(--accent); stroke-width: 3.5; }
.five-units .arr.ctrl.on { stroke: var(--cpu); }
.five-units .ah { fill: var(--text-muted); }
.five-units .ah-data-on { fill: var(--accent); }
.five-units .ah-ctrl-on { fill: var(--cpu); }
.five-units .legend-g .arr { stroke: var(--text-muted); }
.five-units .legend-t { fill: var(--text-secondary); font-size: 12px; }
.five-units .legend-cpu { fill: var(--cpu-soft); stroke: var(--cpu); stroke-dasharray: 4 3; }
.five-units .packet rect { fill: var(--focus); }
.five-units .packet text { fill: #1b1b1a; font-weight: 700; font-size: 14px; }
.sort-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px 16px; margin: 10px 0; }
.sort-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 400; border-bottom: 1px solid var(--border); padding: 4px 0; }
.sort-pick { display: flex; align-items: center; gap: 6px; flex: none; }
.sort-pick select { width: 11em; min-height: 38px; padding: 4px 8px; }
.mark { width: 1.2em; font-weight: 700; font-size: 1.1rem; }
.mark.good { color: var(--good); }
.mark.bad { color: var(--bad); }

/* 手計算くらべ */
.manual-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
.manual-row .btn-row input { width: 9em; }
.timer { font-family: var(--mono); min-width: 6em; }
tr.you td { background: var(--warn-soft); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* 左メニュー：ほかの教材（セキュリティラボなど）と同じ位置・同じ見た目。作業画面が広いので幅を広げる */
.layout.wide { grid-template-columns: 220px minmax(0, 1fr); max-width: 1480px; }
#view:focus { outline: none; }
/* 高さの小さい画面（ノートPC 1366×650 や、教材集の中）では見出しを上に固定しない（中身を広く見せる） */
html { scroll-padding-top: 64px; } /* 自動で動かしたとき、上に固定した見出しの下にかくれないように */
@media (max-height: 700px) {
  html { scroll-padding-top: 0; }
  .app-header { position: static; }
  .chapter-nav { top: 12px; }
}
@media (max-width: 860px) { .layout.wide { grid-template-columns: minmax(0, 1fr); } }
/* ふりかえり（ほかの教材と同じ形） */
.reflection label { font-weight: 700; display: block; }
.reflection textarea { margin-top: 6px; width: 100%; }
.saved-note { font-size: 0.85rem; color: var(--good); min-height: 1.2em; }
.export-msg { margin: 0; font-size: 0.9rem; font-weight: 700; flex-basis: 100%; }
.export-msg:empty { display: none; }
.export-msg.warn { color: var(--warn); }
.export-msg.good { color: var(--good); }
.concept-note { margin-top: 14px; }

/* 第3段: 入力欄の読めなかった文字・× の行の「この入力でためす」・仲間分けの理由・計算中 */
.input-note { margin: 0; font-size: 0.85rem; color: var(--warn); font-weight: 600; }
.check-table .try-input { display: block; margin-top: 6px; min-height: 40px; white-space: nowrap; }
.why-list { margin: 4px 0 8px; padding-left: 1.3em; }
.why-list li { margin: 2px 0; }
.calc-busy { padding: 12px 0; }
.next-guide { margin-top: 16px; }
.reflect-pointer { margin-top: 12px; }

/* ===== 11インチChromebook（1366×768・タッチ）向けの調整（2026-10-15） ===== */
/* CB-01: スライダーを指でつかみやすくする（つまみ28px・さわれる高さ40px） */
input[type="range"] { -webkit-appearance: none; appearance: none; height: 40px; margin: 0; padding: 0; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1.5px solid #8c8a82; }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 28px; height: 28px; margin-top: -11.5px; border-radius: 50%;
  background: var(--accent); border: 3px solid var(--surface-1); box-shadow: 0 0 0 1.5px var(--accent), 0 1px 3px rgba(0, 0, 0, 0.3);
}
input[type="range"]::-moz-range-track { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1.5px solid #8c8a82; }
input[type="range"]::-moz-range-progress { height: 8px; border-radius: 99px; background: var(--accent); }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface-1); box-shadow: 0 0 0 1.5px var(--accent); }
input[type="range"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
input[type="range"]:disabled { opacity: 0.45; cursor: not-allowed; }
/* CB-06: 補助のラベル（左メニューの見出し・ステップの札）を 13.6px 以上に */
.chapter-nav .nav-group { font-size: 0.8rem; }
.step-title .badge { font-size: 0.8rem; }
/* CB-02: 図解を小さくしすぎない（画面の高さの半分か 360px の大きいほう）。図の中の説明の文字も大きくする */
svg.five-units { max-height: max(50vh, 360px); }
.five-units .box-sub, .five-units .legend-t { font-size: 13px; }
/* CB-03: プログラム欄を広げ、長いコメントは折り返して全部見えるようにする */
@media (min-width: 1181px) { .sim { grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); } }
.editor { white-space: pre-wrap; overflow-wrap: anywhere; }
.listing li code { white-space: pre-wrap; overflow-wrap: anywhere; }
/* CB-06 */
.unit-sub, .cpu-label, .tier-badge, .phase-pills .pill { font-size: 0.8rem; }
.cell-addr { font-size: 0.75rem; }

/* ===== 4分野共通の枠に合わせる（第1.5版 2026-10-15） =====
   shared/eduit-frame.css と同じ形: 白いヘッダーに分野の色（青）の線3px、丸いボタン、主なボタンの角、フッター。
   教材の中の画面は変えない。共通の枠を読み込まない書き出し（スタジオの作品HTMLなど）でも崩れないように、予備の値を付ける。 */
.app-header {
  gap: 10px; min-height: var(--ef-header-h, 52px); padding: 6px 14px;
  background: var(--ef-surface, #ffffff); border-bottom: 3px solid var(--accent);
}
.app-header .brand { font-size: 18px; line-height: 1.3; color: var(--ef-text, var(--text-primary)); }
.app-header .ef-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.display-toggles .toggle.ef-btn {
  min-height: var(--ef-tap, 40px); padding: 0 14px; border: 1px solid var(--ef-line, var(--border)); border-radius: 999px;
  background: var(--ef-surface, var(--surface-1)); color: var(--ef-text, var(--text-primary)); font: 600 15px/1.2 var(--font);
}
.display-toggles .toggle.ef-btn:hover { border-color: var(--accent); }
.display-toggles .toggle.ef-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn { border-radius: var(--ef-radius-s, 8px); }
.app-footer { padding: 0; margin-top: 24px; }
.app-footer .app-note { margin: 0; padding: 0 16px 10px; font-size: 0.8rem; color: var(--text-muted); }
.app-footer .ef-footer { margin: 0; }
/* 暗い画面の設定のときは、共通の枠の色も教材の暗い色に合わせる */

  <script id="eduit-frame">
/* Edu-IT 共通の枠: 作成者・安全と個人情報・ライセンス・更新履歴
 * 使い方(classic script。file:// でも動く):
 *   <link rel="stylesheet" href="…/shared/eduit-frame.css">
 *   <script src="…/<分野>/eduit-info.js"><\/script>   … window.EDUIT_INFO を決める
 *   <script src="…/shared/eduit-frame.js"><\/script>
 * 置き場所(どれか):
 *   - <div data-ef-footer></div> があればそこにフッターを出す
 *   - <span data-ef-about></span> があればそこに「ⓘ このアプリについて」ボタンを出す(フッターは出さない)
 *   - どちらもなければ <body> の最後にフッターを足す
 *   - EDUIT_INFO.app.footer === false なら自動では何も出さない(EduitFrame.open() だけ使う)
 * EDUIT_INFO = {
 *   domain: 'A',                     分野(A/B/C/D)。色が切りかわる
 *   domainName: '材料と加工の技術',
 *   suite: '材料と加工 教材アプリ',     教材集の名前
 *   version: '2.1', updated: '2026-10-15',
 *   safety: ['この分野だけの安全の説明', …],   共通の説明のあとに足す
 *   history: [{ version: '2.1', date: '2026-10-15', items: ['…', …] }, …]   新しい順
 *   app: { name: 'A3 構造強化ラボ' }   アプリごとに上書き(EDUIT_INFO.app を各ページで決めてもよい)
 *   levels: { basic: {...}, advanced: {...} }   基本編・発展編の分け方(メニューが EduitFrame.levels で使う)
 * }
 *
 * メニューのカード(4分野共通の形): EduitFrame.card({ code: 'A1', icon: '🪵', title: '…', desc: '…', parts: 「使うところ」の要素,
 *   extra: [分野ごとの追加の要素…], href: 'ひらく先' か onOpen: function () {…}, openAttrs: { 'data-go': 'b1' } })
 *   → <article class="ef-card ef-mcard">。記号・アイコン・名前・説明・使うところ・追加の欄・「ひらく ▶」の順。カードのどこを押しても開く。
 * 記号の印: EduitFrame.code('A2') → <span class="ef-code">A2</span>(メニューの上のバー・アプリの上のバー・切りかえボタンで使う)
 * メニューの上のバーの名前: EduitFrame.menuTitle(h1) → h1 の中を「[A] 材料と加工の技術 教材集」にする
 *
 * 振り返りを隠す設定: EduitFrame.furikaeri(true = 出す / false = 隠す)。隠すときは <html data-ef-furikaeri="off"> になり、
 *   data-ef-reflect の付いた要素(振り返りのタブ・欄・カードの印など)が出なくなる(eduit-frame.css)。決め方(先のものが勝つ):
 *   1. アドレスの ?furikaeri=off / ?furikaeri=on(自分か、同じサイトの親の画面のアドレス)。localStorage 'eduit.furikaeri' に覚える
 *   2. window.EDUIT_FURIKAERI = 'off' / 'on'(自分か親の画面。配布用の「振り返りなし」版はこれを入れてある)
 *   3. localStorage 'eduit.furikaeri'(前に 1 で決めたもの)
 *   JS で振り返りを出し分けるとき(振り返りを書かないと先へ進めない、など)は EduitFrame.furikaeri を見る。
 *
 * 基本編・発展編(メニュー用): EduitFrame.levels(置き場所, { card: function (item, parts, levelKey) { return カードの要素; }, code: function (item) { return 'A1'; } })
 *   code を渡すと、基本編の上に「おすすめの順番: A1 → A2 → …」の1行を出す(カードの順 = 番号の順 = おすすめの順)。
 *   EDUIT_INFO.levels = {
 *     basic:    { title: '基本編', lead: '…', items: [{ id: 'M1', parts: ['材料カード', …], curr: 'A(1)ア', why: '…' }, …] },
 *     advanced: { title: '発展編', lead: '…', items: [ … ] }
 *   }
 *   id はメニューごとのアプリの id。parts は生徒の画面に出るタブ・ページの名前(「使うところ」に出す)。
 *   curr(学習指導要領の項目)と why(分けた理由)は先生用の一覧だけに出し、生徒のカードには出さない。
 *   選んだ編は localStorage の 'eduit.level.<分野>' に覚える(表示の設定なので「はじめから」でも消さない)。
 */
(function () {
  'use strict';
  var AUTHOR = '羽生市立南中学校　技術　岡田';
  var info = window.EDUIT_INFO || {};
  var app = info.app || {};
  if (info.domain) document.documentElement.setAttribute('data-ef-domain', info.domain);

  // ---- 振り返りを隠す設定 ----
  var FK_KEY = 'eduit.furikaeri';
  function furikaeriSetting() {
    var w = window, v = null;
    for (var i = 0; i < 8 && v === null; i++) {

        var m = /[?&]furikaeri=(on|off)(?:&|$)/.exec(w.location.search || '');

      } catch (e) { break; }  // ちがうサイトの親は見ない
      if (w === w.parent) break;
      w = w.parent;
    }
    if (v === null) try { v = localStorage.getItem(FK_KEY); } catch (e) {}
    return v !== 'off';

  if (!furikaeri) document.documentElement.setAttribute('data-ef-furikaeri', 'off');

  var SAFETY = [
    'この教材はインターネットに接続しません。外部のサイトやサーバーへ、入力した内容や学習の記録を送ることはありません。',
    '学習の記録は、開いた端末のブラウザの中だけに保存されます。ほかの端末や先生のパソコンへ自動で送られることはありません。',
    '提出するときは、自分で「書き出す」などのボタンでファイルにして、先生の指示どおりに出します。',
    '名前などの個人情報は、先生の指示がないときは入力しないでください。',
    '端末をほかの人と共有するときは、提出したあとに記録を消してください。',
    '教材に出てくる会社名・人名・アドレス・数値は、学習のために作ったものです(実在のものではありません。数値は目安です)。',
    '広告・アクセス解析・Cookie による追跡はありません。外部のプログラム(CDN など)も読み込みません。'
  ];
  var LICENSE = [
    '著作権: © 2026 ' + AUTHOR,
    '学校の授業・家庭学習など、学習のためであれば、だれでも無料で使用・コピー・配布できます(ほかの学校の先生も使えます)。',
    '授業に合わせて直して使うこともできます。直したものを配るときは、直したことと、もとの作者(' + AUTHOR + ')を書いてください。',
    '販売すること、有料の教材や商品に入れて配ることはできません。',
    'この教材は今のまま提供します。使ったことで起きた不具合や損害について、作者は責任を負いません。',
    '教科書の図や文章は使っていません。図や文章はこの教材のために作ったものです。'
  ];

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'class') e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function list(items) { return el('ul', null, items.map(function (t) { return el('li', { text: t }); })); }
  function appName() { return app.name || info.suite || document.title; }

  var dlg = null;
  function build() {
    var safety = SAFETY.concat(info.safety || []).concat(app.safety || []);
    var hist = info.history || [];
    var panels = [
      ['安全と個人情報', [el('h3', { text: 'この教材の安全について' }), list(safety)]],
      ['ライセンス', [el('h3', { text: '使ってよい条件' }), list(LICENSE)]],
      ['更新履歴', hist.length ? hist.map(function (h) {
        return el('section', null, [
          el('h3', null, [el('span', { class: 'ef-hist-ver', text: h.version ? '第' + h.version + '版' : '' }),
            el('span', { class: 'ef-hist-date', text: h.date || '' })]),
          list(h.items || [])
        ]);
      }) : [el('p', { text: 'まだありません。' })]],
      ['作った人', [
        el('h3', { text: appName() }),
        el('p', { text: (info.domainName ? '中学校 技術・家庭科(技術分野)「' + info.domainName + '」の教材です。' : '中学校 技術・家庭科(技術分野)の教材です。') }),
        el('p', { text: '作成: ' + AUTHOR }),
        el('p', { text: (info.version ? '第' + info.version + '版' : '') + (info.updated ? '(' + info.updated + ' 更新)' : '') })
      ]]
    ];
    var tabs = el('div', { class: 'ef-tabs', role: 'tablist' });
    var body = el('div');
    var tabEls = [], panelEls = [];
    panels.forEach(function (p, i) {
      var t = el('button', { type: 'button', class: 'ef-tab', role: 'tab', id: 'ef-tab-' + i, 'aria-controls': 'ef-panel-' + i, 'aria-selected': i ? 'false' : 'true', tabindex: i ? '-1' : '0', text: p[0] });
      var pn = el('div', { class: 'ef-panel', role: 'tabpanel', id: 'ef-panel-' + i, 'aria-labelledby': 'ef-tab-' + i }, p[1]);
      if (i) pn.hidden = true;
      t.addEventListener('click', function () { select(i); });
      t.addEventListener('keydown', function (e) {
        var n = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (n) { e.preventDefault(); select((i + n + panels.length) % panels.length); tabEls[(i + n + panels.length) % panels.length].focus(); }
      });
      tabEls.push(t); panelEls.push(pn); tabs.appendChild(t); body.appendChild(pn);
    });
    function select(i) {
      tabEls.forEach(function (t, j) { t.setAttribute('aria-selected', i === j ? 'true' : 'false'); t.tabIndex = i === j ? 0 : -1; });
      panelEls.forEach(function (p, j) { p.hidden = i !== j; });
    }
    var close = el('button', { type: 'button', class: 'ef-btn', text: '閉じる' });
    close.addEventListener('click', function () { dlg.close(); });
    dlg = el('dialog', { class: 'ef-dialog', 'aria-labelledby': 'ef-dialog-title' }, [
      el('div', { class: 'ef-dialog-in' }, [
        el('div', { class: 'ef-dialog-head' }, [el('h2', { id: 'ef-dialog-title', text: 'このアプリについて' }), close]),
        tabs, body
      ])
    ]);
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
    dlg._select = select;
    document.body.appendChild(dlg);
  }
  function open(tab) {
    if (!dlg) build();
    dlg._select(typeof tab === 'number' ? tab : 0);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  }

  function aboutButton(cls) {
    var b = el('button', { type: 'button', class: cls || 'ef-btn ef-about-btn', title: '作った人・安全と個人情報・ライセンス・更新履歴', text: 'ⓘ このアプリについて' });
    b.addEventListener('click', function () { open(0); });
    return b;
  }
  function footer() {
    var link = aboutButton('ef-about-link');
    link.textContent = '安全と個人情報・ライセンス・更新履歴';
    return el('footer', { class: 'ef-footer', role: 'contentinfo' }, [
      el('span', null, ['作成: ', el('span', { class: 'ef-author', text: AUTHOR })]),
      info.version ? el('span', { text: '第' + info.version + '版' + (info.updated ? '(' + info.updated + ')' : '') }) : null,
      link
    ]);
  }
  function mount() {
    if (app.footer === false) return;
    var slot = document.querySelector('[data-ef-footer]');
    var about = document.querySelector('[data-ef-about]');
    if (slot) { if (!slot.querySelector('.ef-footer')) slot.appendChild(footer()); }
    else if (about) { if (!about.querySelector('button')) about.appendChild(aboutButton()); }
    else if (!document.querySelector('body > .ef-footer')) document.body.appendChild(footer());
  }

  // ---- 基本編・発展編のタブ(メニュー用) ----
  var LEVEL_KEYS = ['basic', 'advanced'];
  function levels(box, opts) {
    var L = info.levels;
    if (!box || !L) return null;
    opts = opts || {};
    var store = 'eduit.level.' + (info.domain || 'x');
    var cur = 'basic';
    try { if (LEVEL_KEYS.indexOf(localStorage.getItem(store)) >= 0) cur = localStorage.getItem(store); } catch (e) {}
    var uid = 'ef-lv-' + (info.domain || 'x');
    var tabs = el('div', { class: 'ef-level-tabs', role: 'tablist', 'aria-label': '基本編と発展編' });
    var panel = el('div', { class: 'ef-level-panel', role: 'tabpanel', id: uid + '-panel', tabindex: '-1' });
    var tabEls = LEVEL_KEYS.map(function (k, i) {
      var lv = L[k] || { items: [] };
      var t = el('button', { type: 'button', role: 'tab', class: 'ef-level-tab ef-level-' + k, id: uid + '-' + k, 'aria-controls': uid + '-panel' }, [
        el('span', { class: 'ef-level-name', text: lv.title || (k === 'basic' ? '基本編' : '発展編') }),
        el('span', { class: 'ef-level-count', text: (lv.items || []).length + 'つ' })
      ]);
      t.addEventListener('click', function () { select(k, true); });
      t.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        var n = LEVEL_KEYS[(i + 1) % LEVEL_KEYS.length];
        select(n, true); tabEls[LEVEL_KEYS.indexOf(n)].focus();
      });
      tabs.appendChild(t);
      return t;
    });
    function partsEl(item) {
      if (!item.parts || !item.parts.length) return null;
      return el('p', { class: 'ef-level-parts' }, [el('span', { class: 'ef-level-parts-k', text: '使うところ' }), item.parts.join('・')]);
    }
    function render() {
      var lv = L[cur] || { items: [] };
      tabEls.forEach(function (t, i) { var on = LEVEL_KEYS[i] === cur; t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = on ? 0 : -1; });
      panel.setAttribute('aria-labelledby', uid + '-' + cur);
      var grid = el('div', { class: 'ef-level-grid ' + (opts.gridClass || '') });
      (lv.items || []).forEach(function (item) {
        var c = opts.card ? opts.card(item, partsEl(item), cur) : null;
        if (c) grid.appendChild(c);
      });
      while (panel.firstChild) panel.removeChild(panel.firstChild);
      if (lv.lead) panel.appendChild(el('p', { class: 'ef-level-lead', text: lv.lead }));
      if (opts.code && cur === 'basic') {
        var codes = (lv.items || []).map(opts.code).filter(Boolean);
        if (codes.length) panel.appendChild(el('p', { class: 'ef-level-order' }, [el('span', { class: 'ef-level-parts-k', text: 'おすすめの順番' }), codes.join(' → ')]));
      }
      panel.appendChild(grid);
      if (opts.onRender) opts.onRender(panel, cur);
    }
    function select(k, byUser) {
      if (LEVEL_KEYS.indexOf(k) < 0) return;
      cur = k;
      if (byUser) try { localStorage.setItem(store, k); } catch (e) {}
      render();
    }
    while (box.firstChild) box.removeChild(box.firstChild);
    box.classList.add('ef-levels');
    box.appendChild(tabs);
    box.appendChild(panel);
    render();
    return { render: render, select: select, current: function () { return cur; } };
  }

  // ---- 記号の印・メニューの上のバーの名前・メニューのカード(4分野共通の形) ----
  function code(c) { return el('span', { class: 'ef-code', text: c }); }
  function menuTitle(h) {
    if (!h) return h;
    while (h.firstChild) h.removeChild(h.firstChild);
    h.classList.add('ef-title');
    if (info.domain) h.appendChild(code(info.domain));
    h.appendChild(el('span', { class: 'ef-title-name', text: (info.domainName || '') + ' 教材集' }));
    return h;
  }
  function card(o) {
    o = o || {};
    var go = o.href
      ? el('a', { class: 'ef-btn-primary ef-mcard-go', href: o.href, text: 'ひらく ▶' })
      : el('button', { type: 'button', class: 'ef-btn-primary ef-mcard-go', text: 'ひらく ▶' });
    if (o.openAttrs) for (var k in o.openAttrs) go.setAttribute(k, o.openAttrs[k]);
    if (o.title) go.setAttribute('aria-label', (o.code ? o.code + ' ' : '') + o.title + ' をひらく');
    if (o.onOpen) go.addEventListener('click', function (e) { o.onOpen(e); });
    var extra = (o.extra || []).filter(Boolean);
    var c = el('article', { class: 'ef-card ef-mcard' }, [
      el('div', { class: 'ef-mcard-hd' }, [
        o.icon ? el('span', { class: 'ef-mcard-ic', 'aria-hidden': 'true', text: o.icon }) : null,
        el('div', { class: 'ef-mcard-ht' }, [
          o.code ? el('p', { class: 'ef-card-tag' }, [code(o.code)]) : null,
          el('h3', { class: 'ef-card-title', text: o.title || '' })
        ])
      ]),
      o.desc ? el('p', { class: 'ef-mcard-desc', text: o.desc }) : null,
      o.parts || null,
      extra.length ? el('div', { class: 'ef-mcard-extra' }, extra) : null,
      go
    ]);
    if (o.code) c.setAttribute('data-code', o.code);
    // カードのどこを押しても開く(カードの中のほかのボタン・リンク・入力は、そのまま)
    c.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('a, button, input, select, textarea, label, summary')) return;
      go.click();
    });
    return c;
  }

  window.EduitFrame = { AUTHOR: AUTHOR, furikaeri: furikaeri, open: open, footer: footer, aboutButton: aboutButton, mount: mount, levels: levels, card: card, code: code, menuTitle: menuTitle };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();

</script>

const __m_js_ui_js = (() => {

// 共通の小さな部品
// 要素ビルダー: h("div", { class: "card" }, "text", child)
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

// 振り返りを出すか（先生が「振り返りを隠す」設定にしたときは false。shared/eduit-frame.js の EduitFrame.furikaeri）
function furikaeriOn() {
  return !(globalThis.EduitFrame && globalThis.EduitFrame.furikaeri === false);
}
// 振り返りの欄・文字に付ける属性（隠す設定のときは eduit-frame.css で出なくなる）
const REFLECT_ATTR = { "data-ef-reflect": "" };
// 「ふりかえり・記録」のページの名前（隠す設定のときは「記録」）
const recordsTitle = () => (furikaeriOn() ? "ふりかえり・記録" : "記録");

const SVG_NS = "http://www.w3.org/2000/svg";
function s(tag, attrs = {}, ...children) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) el.setAttribute(k, v);
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

// 解説カード。kind: "info" | "warn" | "good" | "bad"
function explain(label, body, kind = "info") {
  return h("div", { class: `explain ${kind === "info" ? "" : kind}` }, h("span", { class: "explain-label" }, label), typeof body === "string" ? h("p", {}, body) : body);
}

let toastTimer;
function toast(text) {
  let el = document.getElementById("toast");
  if (!el) {
    el = h("div", { id: "toast", class: "toast", role: "status", "aria-live": "polite" });
    document.body.append(el);
  }
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

const reducedMotion = () => globalThis.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// 用語の説明: 指でも押して読める（マウスを乗せるだけの説明にしない）。押すと下に説明が出て、もう一度押すと閉じる
let termSeq = 0;
function term(label, note, cls = "") {
  const id = `term-note-${++termSeq}`;
  const noteEl = h("span", { class: "term-note", id, hidden: true }, note);
  const btn = h("button", { class: `term-btn ${cls}`, type: "button", "aria-expanded": "false", "aria-controls": id }, label, h("span", { class: "term-mark", "aria-hidden": "true" }, "?"));
  btn.addEventListener("click", () => {
    noteEl.hidden = !noteEl.hidden;
    btn.setAttribute("aria-expanded", String(!noteEl.hidden));
  });
  return { btn, note: noteEl };
}

// 次に開くページで、ふりかえり欄まで動かしてもらう（課題8クリア後の「ふりかえりを書こう」ボタンなど）
let reflectionFocus = false;
function requestReflectionFocus() {
  reflectionFocus = true;
}
function takeReflectionFocus() {
  const v = reflectionFocus;
  reflectionFocus = false;
  return v;
}

return { h, furikaeriOn, REFLECT_ATTR, recordsTitle, s, explain, toast, reducedMotion, sleep, term, requestReflectionFocus, takeReflectionFocus };
})();

// data/*.json の読み込み（単一HTML版では埋め込まれたデータを使う）
const cache = new Map();

async function loadData(name) {
  if (cache.has(name)) return cache.get(name);
  let value = globalThis.__VCPU_DATA?.[name];
  if (!value) {
    const r = await fetch(`data/${name}.json`);
    if (!r.ok) throw new Error(`data/${name}.json を読み込めませんでした`);

  cache.set(name, value);
  return value;
}

// ---- js/store.js ----
const __m_js_store_js = (() => {

// 進み具合・プログラム・ふりかえりの保存（この端末のブラウザ内 localStorage のみ。外部には送らない）
const KEY = "vcpu.v1";

function empty() {
  // visited: 開いたページ（記録用） / done: やり終えたページ（✓ をつける。図解は仲間分けの答え合わせ、手計算くらべは手計算と N のくらべ）
  // answerViewed: 課題の「答えの例」を開いた時刻 / sim: 仮想CPUページで選んだサンプルの番号と入力の数
  return { cleared: {}, drafts: {}, visited: {}, done: {}, answerViewed: {}, sim: null, manual: null, reflections: {}, student: { cls: "", num: "", name: "" } };
}

let state = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    return raw ? { ...empty(), ...JSON.parse(raw) } : empty();
  } catch {
    return empty();
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch {
    // 保存できない環境（プライベートモードなど）でも、その場の体験は続けられる
  }
}

const store = {
  get state() {
    return state;
  },
  markVisited(page) {
    if (state.visited[page]) return;
    state.visited[page] = new Date().toISOString();
    save();
  },
  // ページをやり終えた印（info は記録に残す中身。例: 仲間分けの正解数）
  markDone(page, info = {}) {
    state.done[page] = { ...(state.done[page] || {}), ...info, at: state.done[page]?.at || new Date().toISOString() };
    save();
  },
  isDone: (page) => Boolean(state.done?.[page]?.at),
  // 課題の「答えの例」を開いたことを記録する（はじめて開いた時刻）
  markAnswerViewed(id) {
    if (state.answerViewed[id]) return;
    state.answerViewed[id] = new Date().toISOString();
    save();
  },
  answerViewed: (id) => state.answerViewed?.[id] || null,
  setSimMeta(info) {
    state.sim = { ...(state.sim || {}), ...info };
    save();
  },
  isCleared: (id) => Boolean(state.cleared[id]),
  clear(id) {
    if (!state.cleared[id]) state.cleared[id] = new Date().toISOString();
    save();
  },
  getDraft: (id) => state.drafts[id],
  setDraft(id, text) {
    if (text === null) delete state.drafts[id];
    else state.drafts[id] = text;
    save();
  },
  setManual(rec) {
    state.manual = rec;
    save();
  },
  setReflection(id, text) {
    if (text) state.reflections[id] = { text, at: new Date().toISOString() };
    else delete state.reflections[id]; // 全部消したときは「書いていない」にもどす
    save();
  },
  getReflection: (id) => state.reflections[id]?.text || "",
  setStudent(info) {
    state.student = { ...state.student, ...info };
    save();
  },
  reset() {
    state = empty();
    save();
  },
};

return { store };
})();

const __m_js_vm_js = (() => {

// 仮想CPU（教育用の小さなコンピュータ）。画面（DOM）には触らない計算だけの部品。
// 記憶装置: memorySize 語。1語に「命令」か「数」が1つ入る（プログラムとデータが同じ記憶装置に入る＝プログラム内蔵方式）。
// レジスタ: PC（プログラムカウンタ＝次に取り出す番地）、IR（命令レジスタ＝いま実行中の命令）、ACC（アキュムレータ＝計算用の箱）。
// 1つの命令は「取り出し → 解読 → 実行」の3段階で進む。

const PHASE_NAMES = { fetch: "取り出し", decode: "解読", execute: "実行" };

const LABEL_RE = /^([\p{L}_][\p{L}\p{N}_]*)\s*:\s*(.*)$/u;
const NAME_RE = /^[\p{L}_][\p{L}\p{N}_]*$/u;

const DEC_RE = /^[+-]?\d*\.\d+$/; // 小数（2.5 など）
const JUMP_OPS = new Set(["JUMP", "JZ", "JN"]);

function isaTable(isa) {
  return Object.fromEntries(isa.instructions.map((i) => [i.op, i]));
}

// 全角の英数字・記号（ＬＯＡＤ、＃５、；、：など）を半角にそろえる
function normalizeSource(src) {
  return String(src ?? "").normalize("NFKC").replace(/\r\n?/g, "\n");
}

// プログラムの文字 → 記憶装置の中身

  const errors = [];

      text = m[2].trim();
    }
