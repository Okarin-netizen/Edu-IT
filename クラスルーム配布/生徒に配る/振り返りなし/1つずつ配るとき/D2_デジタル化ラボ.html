  --ef-tap: 40px;            /* ボタンの最小の高さ */
  /* 分野の色(既定は D) */
  --ef-accent: #1a5fc8;
  --ef-accent-ink: #ffffff;
  --ef-accent-soft: #e6eefb;
}
:root[data-ef-domain="A"] { --ef-accent: #985a26; --ef-accent-soft: #f5e9dc; }  /* 材料と加工: 木の茶 */
:root[data-ef-domain="B"] { --ef-accent: #2e7d32; --ef-accent-soft: #e4f2e5; }  /* 生物育成: 緑 */
:root[data-ef-domain="C"] { --ef-accent: #b45309; --ef-accent-soft: #fbeedd; }  /* エネルギー変換: だいだい */
:root[data-ef-domain="D"] { --ef-accent: #1a5fc8; --ef-accent-soft: #e6eefb; }  /* 情報: 青 */
:root[data-ef-domain="G"] { --ef-accent: #0f766e; --ef-accent-soft: #e0f2ef; }  /* 技術分野のガイダンス(4分野の前): 青緑 */
:root[data-ef-domain="T"] { --ef-accent: #475569; --ef-accent-soft: #eef1f5; }  /* 教科書の順に進む学習コース(T-textbook/): 灰青 */
:root[data-ef-domain="M"] { --ef-accent: #9d174d; --ef-accent-soft: #fbe7ef; }  /* M 身の回りの技術さがし(各編のはじめ): 赤紫 */
:root[data-ef-domain="F"] { --ef-accent: #4338ca; --ef-accent-soft: #e8e8fb; }  /* F これからの技術ラボ(各編の最後): あい色 */
:root[data-ef-domain="Z"] { --ef-accent: #7c4a03; --ef-accent-soft: #f6ecdc; }  /* Z 学習を終えて(3年間のまとめ): こげ茶 */

/* ---- ヘッダー ----
 * メニュー:   <header class="ef-header"> <h1 class="ef-title"><span class="ef-code">A</span> 材料と加工の技術 教材集</h1>
 *               <div class="ef-tools"> ふりがな / 文字 中 / 使い方 / 先生用 </div> </header>   (4分野でこの4つだけ・字だけ)
 * アプリ:     <header class="ef-header"> <a class="ef-btn ef-back" href="…">◀ メニュー</a>
 *               <h1 class="ef-title"><span class="ef-code">A2</span> アプリ名</h1>
 *               <div class="ef-tools"> ふりがな / 文字の大きさ / くっきり / 使い方 / そのアプリだけのボタン </div> </header>
 *   同じ分野の教材を切りかえるボタンにも記号を出す(<button class="ef-btn"><span class="ef-code">D1</span> CPU</button>)。
 */
.ef-header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  min-height: var(--ef-header-h); padding: 6px 14px;
  background: var(--ef-surface); color: var(--ef-text);
  border-bottom: 1px solid var(--ef-ink);
  font-family: var(--ef-font);
  box-sizing: border-box;
}
.ef-title {
  display: flex; align-items: center; gap: 8px;
  margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--ef-text);
}
.ef-title .ef-icon { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; font-size: 22px; }
.ef-title .ef-sub { font-size: 13px; font-weight: 400; color: var(--ef-muted); }
.ef-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }

/* ---- ボタン ----
 * .ef-btn          ふつうのボタン(白地・黒の細い枠・角なし)
 * .ef-btn.is-on    ON の状態(下に分野の色の線)。aria-pressed="true" でも同じ
 * .ef-btn-primary  いちばん大事な操作(はじめる・ひらく など)
 */
.ef-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--ef-tap); padding: 0 14px;
  border: 1px solid var(--ef-ink); border-radius: 0;
  background: var(--ef-surface); color: var(--ef-text);
  font: 600 15px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
  box-sizing: border-box; white-space: nowrap;
}
.ef-btn:hover { background: var(--ef-surface-2); }
/* ON は下に分野の色の太い線(ぬりつぶさない) */
.ef-btn.is-on, .ef-btn[aria-pressed="true"] { box-shadow: inset 0 -4px 0 var(--ef-accent); }
.ef-back { color: var(--ef-text); border-color: transparent; background: none; }
.ef-back:hover { background: none; text-decoration: underline; }
/* 上のバーの表示の道具(4分野で同じ形)。ふりがな・くっきりは .ef-toggle(ON で ✓)、文字の大きさは .ef-size(EduitFrame.sizeButton) */
.ef-toggle[aria-pressed="true"]::before { content: "✓"; }
.ef-size .ef-size-v {
  display: inline-block; min-width: 1.4em; padding: 0 .1em;
  color: var(--ef-text); font-weight: 700; text-align: center; text-decoration: underline; text-underline-offset: 3px;
}
/* 「ふつう・大きい」の2段だけのとき: <button class="ef-btn ef-size" aria-pressed="false|true">文字 <span class="ef-size-v"></span></button>
 * (中身が空の .ef-size-v に「中」「大」を出す。ON でもボタンは塗らない) */
.ef-size[aria-pressed="true"] { background: var(--ef-surface); box-shadow: none; color: var(--ef-text); }
.ef-size[aria-pressed]::before { content: none; }
.ef-size[aria-pressed] .ef-size-v:empty::after { content: "中"; }
.ef-size[aria-pressed="true"] .ef-size-v:empty::after { content: "大"; }
/* タブの帯をスクロールで隠す(data-ef-autohide。隠すのは eduit-frame.js) */
[data-ef-autohide] { transition: transform .2s ease; }
[data-ef-autohide].ef-ah-hide { transform: translateY(var(--ef-ah-y, -110%)); }
@media (prefers-reduced-motion: reduce) { [data-ef-autohide] { transition: none; } }
.ef-btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 20px;
  border: 1px solid var(--ef-ink); border-radius: 0;
  background: var(--ef-ink); color: #fff;
  font: 700 16px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
}
.ef-btn-primary:hover { background: #444; }
.ef-btn:focus-visible, .ef-btn-primary:focus-visible, .ef-about-link:focus-visible, .ef-dialog :focus-visible {
  outline: 3px solid var(--ef-focus); outline-offset: 2px;
}

/* ---- メニューのカード ----
 * <article class="ef-card"> <p class="ef-card-tag">A1</p> <h3 class="ef-card-title">…</h3> <p>…</p> <a class="ef-btn-primary">ひらく ▶</a> </article>
 * メニューのカードは EduitFrame.card() で作る(下の .ef-mcard)。
 */
.ef-page { background: var(--ef-bg); color: var(--ef-text); font-family: var(--ef-font); }
.ef-card {
  background: var(--ef-surface); border: 0; border-top: 2px solid var(--ef-ink); padding: 14px 4px;
}
.ef-card-tag { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ef-accent); }
.ef-card-title { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: var(--ef-text); }

/* ---- 記号の印(A1・B2・C3・D4 など。メニューの上のバー・アプリの上のバー・切りかえボタン・カード) ---- */
.ef-code {
  display: inline-flex; align-items: center; justify-content: flex-start; min-width: 1.6em; padding: 0;
  background: none; color: var(--ef-accent);
  font: 700 1em/1.5 var(--ef-font); letter-spacing: .02em; white-space: nowrap; vertical-align: .05em;
}
.ef-title .ef-code { font-size: 22px; min-width: 0; margin-right: 4px; }
.ef-btn .ef-code { font-size: 13px; min-width: 0; margin-right: 2px; }


/* ---- メニューのカード(EduitFrame.card が作る。4分野同じ形) ---- */
/* 教科書の目次のように1行ずつ: 左に記号、まん中に名前と説明、右に「ひらく →」。行の上下は細い線 */
.ef-mcard {
  display: grid; grid-template-columns: 4.2em minmax(0, 1fr) auto; column-gap: 16px; row-gap: 2px; align-items: baseline;
  padding: 14px 4px; border: 0; border-bottom: 1px solid var(--ef-line); border-radius: 0; box-shadow: none;
  cursor: pointer; font-family: var(--ef-font); color: var(--ef-text);
}
.ef-mcard:hover { background: var(--ef-surface-2); }
.ef-mcard-hd, .ef-mcard-ht { display: contents; }
.ef-mcard-ic { display: none; }
.ef-mcard > *, .ef-mcard-ht > * { grid-column: 2; }
.ef-mcard .ef-card-tag { grid-column: 1; grid-row: 1 / span 3; margin: 0; font-size: 1.35em; line-height: 1.2; }
.ef-mcard .ef-card-tag .ef-code { font-size: 1em; }
.ef-mcard .ef-card-title { margin: 0; font-size: 1.12em; line-height: 1.4; }
.ef-mcard-desc { margin: 0; font-size: .95em; line-height: 1.6; color: var(--ef-muted); }
.ef-mcard-extra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .88em; color: var(--ef-muted); }
.ef-mcard-go {
  grid-column: 3; grid-row: 1; align-self: baseline; min-height: 0; padding: 0; border: 0; background: none;
  color: var(--ef-accent); font-size: 15px; white-space: nowrap;
}
.ef-mcard-go:hover { background: none; text-decoration: underline; }
.ef-level-order { margin: -4px 0 12px; font-size: .95em; line-height: 1.6; }

/* ---- フッター(作成者・このアプリについて) ---- */
.ef-footer {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 14px;
  margin: 24px 0 0; padding: 12px 16px;
  border-top: 1px solid var(--ef-line); background: var(--ef-surface-2);
  font: 13px/1.6 var(--ef-font); color: var(--ef-muted);
}
.ef-footer .ef-author { font-weight: 700; color: var(--ef-text); }
.ef-about-link {
  border: 0; background: none; padding: 2px 4px; cursor: pointer;
  font: inherit; color: var(--ef-accent); text-decoration: underline;
}
/* ヘッダーなどに置く小さい「このアプリについて」ボタン */
.ef-about-btn { font-size: 14px; }

/* ---- このアプリについて(ダイアログ) ---- */
.ef-dialog {
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  padding: 0; border: 1px solid var(--ef-line); border-radius: var(--ef-radius);
  background: var(--ef-surface); color: var(--ef-text); font: 15px/1.7 var(--ef-font);
  box-shadow: none; border-color: var(--ef-ink);
}
.ef-dialog::backdrop { background: rgba(0, 0, 0, .4); }
.ef-dialog-in { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.ef-dialog-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--ef-ink); }
.ef-dialog-head h2 { margin: 0; font-size: 18px; flex: 1; }
.ef-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px 0; }
.ef-tab { border: 0; border-bottom: 3px solid transparent; background: none;
  padding: 6px 10px; font: 600 14px/1.3 var(--ef-font); color: var(--ef-muted); cursor: pointer; min-height: 36px; }
.ef-tab[aria-selected="true"] { color: var(--ef-text); border-bottom-color: var(--ef-accent); }
.ef-panel { padding: 14px 18px 18px; overflow: auto; border-top: 1px solid var(--ef-line); }
.ef-panel h3 { margin: 12px 0 4px; font-size: 16px; }
.ef-panel ul { margin: 4px 0 8px; padding-left: 1.3em; }
.ef-panel p { margin: 4px 0 8px; }
.ef-howto .ef-panel { border-top: 0; }
.ef-howto .ef-panel ol { margin: 4px 0 8px; padding-left: 1.5em; }
.ef-howto .ef-panel li { margin: 2px 0; }
.ef-hist-ver { font-weight: 700; color: var(--ef-accent); }
.ef-hist-date { color: var(--ef-muted); font-size: 13px; margin-left: 6px; }

/* 文字を大きくした・くっきりのときも読めるように */
/* 基本編・発展編のタブ(メニュー。EduitFrame.levels が作る) */
.ef-levels { margin: 0 0 18px; font-family: var(--ef-font); }
.ef-level-tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--ef-line); }
.ef-level-tab {
  display: inline-flex; align-items: baseline; gap: 4px; min-height: 48px; padding: 8px 0; margin: 0 0 -1px;
  font: inherit; font-size: 1.15em; font-weight: 700 !important; color: var(--ef-muted) !important; cursor: pointer;
  background: none !important; border: 0 !important; border-bottom: 3px solid transparent !important; border-radius: 0 !important;
}
.ef-level-tab:hover { color: var(--ef-text) !important; }
/* 教材ごとのボタンの色指定(#hub button など)に負けないように !important にする */
.ef-level-tab[aria-selected="true"], .ef-level-tab[aria-selected="true"]:hover { color: var(--ef-text) !important; border-bottom-color: var(--ef-accent) !important; }
.ef-level-tab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }
.ef-level-count { font-size: .85em; font-weight: 700; }
.ef-level-count::before { content: "("; }
.ef-level-count::after { content: ")"; }
.ef-level-panel { padding: 12px 0 0; }
.ef-level-panel:focus { outline: none; }
.ef-level-lead { margin: 0 0 12px; color: var(--ef-muted); line-height: 1.6; }
.ef-level-advanced[aria-selected="true"], .ef-level-advanced[aria-selected="true"]:hover { border-bottom-color: #5b3fa8 !important; }
.ef-level-parts { margin: .3em 0 0; font-size: .9em; line-height: 1.5; color: var(--ef-text); }
.ef-level-parts summary { cursor: pointer; color: var(--ef-sub, #5e6b64); }
.ef-level-parts p { margin: .2em 0 0; }
.ef-mcard-tb { margin: .3em 0 0; font-size: .85em; line-height: 1.5; color: var(--ef-muted); }
.ef-level-group { display: flex; align-items: baseline; gap: .7em; margin: 24px 0 0; padding: 0 0 6px; border-bottom: 2px solid var(--ef-ink); font-size: 1.1em; color: var(--ef-text); }
.ef-level-group:first-of-type { margin-top: 4px; }
.ef-level-group-ch { font-size: .8em; font-weight: 700; color: var(--ef-accent); }
/* 区切りのはじめ・おわりの M・F へのリンクの行(EDUIT_INFO.textbook.links) */
.ef-level-link { margin: 6px 0 12px; line-height: 1.6; }
.ef-level-link a { display: inline-flex; align-items: center; gap: 8px; padding: 4px 0; color: var(--ef-text); text-decoration: none; font-weight: 600; }
.ef-level-link a:hover, .ef-level-link a:focus-visible { text-decoration: underline; }
.ef-level-link-go { color: var(--ef-accent); font-weight: 700; }
.ef-level-matome { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 14px; border: 1px solid var(--ef-ink); border-radius: 0; background: #fff; color: var(--ef-text); font: inherit; cursor: pointer; text-align: left; }
.ef-level-matome:hover, .ef-level-matome:focus-visible { background: var(--ef-bg, #f6f7f5); }
.ef-level-matome-t { font-weight: 700; }
.ef-level-matome-d { color: var(--ef-sub, #5e6b64); font-size: .92em; }
.ef-matome-score { font-weight: 700; }
.ef-matome-h { display: flex; align-items: center; gap: 6px; margin: 16px 0 4px; font-size: 1.05em; }
.ef-level-parts-k {
  display: inline-block; margin-right: .6em; padding: 0; font-size: .9em; font-weight: 700; color: var(--ef-text);
}

/* 振り返りを隠す設定(EduitFrame.furikaeri)。振り返りのタブ・欄・印には data-ef-reflect を付ける */
html[data-ef-furikaeri="off"] [data-ef-reflect] { display: none !important; }

/* ---- メニューのカードの並べ方(4分野共通。C エネルギー変換と同じ) ----
 * EduitFrame.levels({ gridClass: 'ef-mgrid' }) で使う。3つずつ並べ、最後の行が2つ・1つのときは真ん中に寄せる。はば 1100px 以下は2つ、スマホは1つ。
 * メニューの中身(タブ・カード)を入れる箱は .ef-menu(左右の余白 32px。はばいっぱいに使う)。 */
.ef-menu { max-width: 1040px; margin: 0 auto; padding: 6px 32px 0; box-sizing: border-box; }
.ef-mgrid { display: flex; flex-direction: column; padding: 0 0 24px; }
.ef-mgrid > .ef-mcard { touch-action: manipulation; }
.ef-mgrid { border-top: 1px solid var(--ef-line); }
.ef-level-group + .ef-mgrid { border-top: 0; }
.ef-mgrid .ef-mcard-desc { line-height: 1.5; }
@media (max-width: 900px) { .ef-menu { padding: 6px 16px 0; } }
@media (max-width: 640px) { .ef-menu { padding: 6px 16px 0; } }

/* ---- アプリを開いたときの上のバー・教材の切りかえ・タブの帯(4分野共通。C エネルギー変換の形) ----
 * <header class="ef-header ef-appbar">
 *   <a class="ef-btn ef-back">◀ メニュー</a>
 *   <h1 class="ef-title ef-apptitle">[A2] 木材の繊維・収縮ラボ</h1>   … はばが広いとき(1441px 以上)とスマホだけ出す
 *   <nav class="ef-switch"> <a class="ef-swchip" aria-current="page"><span class="ef-code">A2</span><span class="ef-sw-n">木材</span></a> … </nav>
 *   <div class="ef-tools"> ふりがな / 文字 中 / (くっきり) / (使い方) / <span data-ef-fs></span> 全画面 / <span data-ef-about></span> ⓘ </div>
 * </header>
 * <nav class="ef-apptabs"> <button class="ef-apptab" aria-selected="true">はじめに</button> … </nav>   … アプリの中のタブ(丸いボタンの帯)
 * 開いている教材は名前も出し、ほかの教材は記号だけ(はばが 1441px 以上なら名前も)。スマホは1行目に ◀ メニューと名前、2行目に道具と切りかえ。
 */
.ef-appbar { min-height: 52px; padding: 0 6px; gap: 6px; flex-wrap: nowrap; }
.ef-appbar .ef-btn { min-height: 42px; padding: 0 12px; font-size: 15px; white-space: nowrap; flex: none; }
.ef-appbar .ef-tools { flex: none; flex-wrap: nowrap; }
.ef-appbar .ef-apptitle { margin: 0 6px 0 4px; font-size: 17px; white-space: nowrap; flex: none; }
.ef-appbar .ef-apptitle .ef-code { margin-right: 0; }
.ef-switch { display: flex; gap: 4px; flex: 1; min-width: 0; align-self: stretch; align-items: flex-end; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.ef-switch::-webkit-scrollbar { display: none; }
.ef-swchip {
  font: inherit; font-family: var(--ef-font); font-size: 15px; line-height: 1.2; color: var(--ef-muted); text-decoration: none;
  background: transparent; border: 0; border-bottom: 4px solid transparent; border-radius: 0;
  min-height: 44px; padding: 0 10px; margin-bottom: 1px; cursor: pointer; white-space: nowrap; flex: none;
  display: inline-flex; align-items: center; gap: 5px; touch-action: manipulation;
}
.ef-swchip:hover { color: var(--ef-text); border-bottom-color: var(--ef-line); }
.ef-swchip[aria-current="page"], .ef-swchip[aria-current="true"] { color: var(--ef-text); font-weight: 700; border-bottom-color: var(--ef-accent); }
.ef-swchip .ef-code { font-size: 13px; min-width: 0; margin: 0; }
.ef-swchip:focus-visible, .ef-apptab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: -3px; }
.ef-fs-btn[hidden] { display: none; }
.ef-apptabs {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 18px; padding: 0 14px;
  background: var(--ef-surface); border-bottom: 1px solid var(--ef-ink); font-family: var(--ef-font); box-sizing: border-box;
}
.ef-apptab {
  font: inherit; font-family: var(--ef-font); font-size: 15px; font-weight: 700; line-height: 1.3; color: var(--ef-text); text-decoration: none;
  flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; box-sizing: border-box;
  border: 0; border-bottom: 4px solid transparent; border-radius: 0; background: none; cursor: pointer; white-space: nowrap; touch-action: manipulation;
  color: var(--ef-muted);
}
.ef-apptab:hover { color: var(--ef-text); border-bottom-color: var(--ef-line); }
.ef-apptab[aria-selected="true"], .ef-apptab[aria-current="page"], .ef-apptab[aria-current="true"], .ef-apptab.is-on {
  color: var(--ef-text); border-bottom-color: var(--ef-accent);
}
.ef-apptab[aria-selected="true"] rt, .ef-apptab[aria-current] rt, .ef-apptab.is-on rt { color: inherit; }
@media (max-width: 1440px) { .ef-appbar .ef-apptitle { display: none; } .ef-swchip:not([aria-current]) .ef-sw-n { display: none; } }
@media (max-width: 1180px) { .ef-header .ef-about-btn .t { display: none; } }
@media (max-width: 900px) { .ef-header .ef-fs-btn .t { display: none; } .ef-swchip { padding: 0 8px; } }
@media (max-width: 760px) { .ef-swchip .ef-sw-n { display: none; } .ef-swchip { padding: 0 12px; } }
/* スマホ: タブの帯は1行にして横にスクロール(名前は折り返さない) */
@media (max-width: 640px) {
  .ef-appbar { flex-wrap: wrap; row-gap: 4px; padding: 4px 6px; }
  .ef-appbar .ef-btn { min-height: 38px; padding: 0 9px; font-size: 14px; }
  .ef-appbar .ef-apptitle { display: flex; flex: 1 1 calc(100% - 140px); min-width: 0; white-space: normal; font-size: 16px; line-height: 1.35; margin: 0 2px; }

/* デジタル化 */

/* 矢印は箱と箱のすき間（24px）のまん中に出す（次の箱の下にかくれないように） */
.pipeline li:not(:last-child)::after { content: "→"; position: absolute; right: -12px; top: 50%; transform: translate(50%, -50%); color: var(--text-muted); font-weight: 700; line-height: 1; z-index: 1; }

.goal-list { list-style: none; padding: 0; margin: 4px 0; display: flex; flex-wrap: wrap; gap: 6px 14px; }

/* ===== 11インチChromebook（1366×768・タッチ）向けの調整（2026-10-15） ===== */
/* CB-01: スライダーを指でつかみやすくする（つまみ28px・さわれる高さ40px） */
input[type="range"] { -webkit-appearance: none; appearance: none; height: 40px; margin: 0; padding: 0; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 0; background: var(--surface-2); border: 1.5px solid #8c8a82; }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 28px; height: 28px; margin-top: -11.5px; border-radius: 50%;
  background: var(--accent); border: 3px solid var(--surface-1); box-shadow: none;
}
input[type="range"]::-moz-range-track { height: 8px; border-radius: 0; background: var(--surface-2); border: 1.5px solid #8c8a82; }
input[type="range"]::-moz-range-progress { height: 8px; border-radius: 0; background: var(--accent); }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface-1); box-shadow: 0 0 0 1.5px var(--accent); }
input[type="range"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 0; }
input[type="range"]:disabled { opacity: 0.45; cursor: not-allowed; }
/* CB-06: 補助のラベル（左メニューの見出し・ステップの札）を 13.6px 以上に */
.chapter-nav .nav-group { font-size: 0.8rem; }
.step-title .badge { font-size: 0.8rem; }

/* ===== 4分野共通の枠に合わせる（第1.5版 2026-10-15） =====
   shared/eduit-frame.css と同じ形: 白いヘッダーに分野の色（青）の線3px、丸いボタン、主なボタンの角、フッター。
   教材の中の画面は変えない。共通の枠を読み込まない書き出し（スタジオの作品HTMLなど）でも崩れないように、予備の値を付ける。 */
.app-header {
  gap: 10px; min-height: var(--ef-header-h, 52px); padding: 6px 14px;
  background: var(--ef-surface, #ffffff); border-bottom: 3px solid var(--accent);
}
.app-header .brand { font-size: 18px; line-height: 1.3; color: var(--ef-text, var(--text-primary)); }
.app-header .ef-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.display-toggles .toggle.ef-btn {
  min-height: var(--ef-tap, 40px); padding: 0 14px; border: 1px solid var(--ef-line, var(--border)); border-radius: 0;
  background: var(--ef-surface, var(--surface-1)); color: var(--ef-text, var(--text-primary)); font: 600 15px/1.2 var(--font);
}
.display-toggles .toggle.ef-btn:hover { border-color: var(--accent); }
.display-toggles .toggle.ef-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn { border-radius: 0; }
.app-footer { padding: 0; margin-top: 24px; }
.app-footer .app-note { margin: 0; padding: 0 16px 10px; font-size: 0.8rem; color: var(--text-muted); }

  // ---- タブの帯をスクロールで隠す([data-ef-autohide]。下へ読み進めると隠れ、上へ戻すと出る) ----

        // 横長の帯だけを隠す。PC の左のメニュー(画面のはばの半分より細い)は、いつも見えるように残す
        if (bar.offsetWidth < window.innerWidth / 2) return;

  // ガイドの上の「ふりがな」で消せる(はじめは付いている。その端末で覚える)

    var parts = k.match(/[一-鿿々〆]+|[^一-鿿々〆]+/g);

    list.forEach(function (n) {

      rubyRe.lastIndex = 0;

        if (m.index > last) f.appendChild(document.createTextNode(s.slice(last, m.index)));
        rubyParts(m[0], D[m[0]]).forEach(function (x) {
          f.appendChild(x[1] ? el('ruby', null, [x[0], el('rt', { text: x[1] })]) : document.createTextNode(x[0]));

  function letsCard(id) {
    var d = LETS[id];
    if (!d) return null;
    return el('section', { class: 'ef-lets', 'aria-label': 'まず考えよう' }, [
      el('p', { class: 'ef-lets-k', text: 'まず考えよう' }),
      el('p', { class: 'ef-lets-q', text: d.q }),
      d.hint ? el('details', { class: 'ef-lets-hint' }, [el('summary', { text: 'ヒント' }), el('p', { text: d.hint })]) : null
    ]);
  }
  // data-ef-lets の置き場所にカードを入れる(あとから作られた画面にも入れる)
  function fillLets() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-ef-lets]:not([data-ef-lets-done])'), function (box) {
      box.setAttribute('data-ef-lets-done', '');
      var c = letsCard(box.getAttribute('data-ef-lets'));
      if (c) box.appendChild(c);
    });
  }
  var letsTimer = 0;
  function watchLets() {
    fillLets();
    if (!window.MutationObserver) return;
    new MutationObserver(function () {
      if (letsTimer) return;
      letsTimer = setTimeout(function () { letsTimer = 0; fillLets(); }, 0);
    }).observe(document.documentElement, { childList: true, subtree: true });
  }

  // ---- 字だけの表示(見た目 案1「教科書の目次」) ----
  // ボタン・見出し・説明の文についた絵文字をとる。字の記号にできるもの(✅ → ✓ など)は字の記号にする。
  // 絵文字だけの部分は、2つ外までの要素に字があれば(「💾<span>記録</span>」など)とり、なければ(部品の絵・盤面の絵など)そのまま。絵として残したい所には data-ef-emoji を付ける。
  var VS_TEXT = '\uFE0E';  // 字の形で出す(色の絵にしない)しるし
  // 絵文字だけの所でも字の記号にするもの: ✅✔→✓ ☑ ⭕→○ ❌✖❎→× ⬜→□ ⚠ ➡⬅⬆⬇→矢印 ▶ ◀
  var EMOJI_TO_TEXT = {
    '\u2705': '\u2713', '\u2714': '\u2713', '\u2611': '\u2611' + VS_TEXT, '\u2B55': '\u25CB', '\u274C': '\u00D7', '\u2716': '\u00D7', '\u274E': '\u00D7',
    '\u2B1C': '\u25A1', '\u26A0': '\u26A0' + VS_TEXT, '\u27A1': '\u2192', '\u2B05': '\u2190', '\u2B06': '\u2191', '\u2B07': '\u2193', '\u25B6': '\u25B6' + VS_TEXT, '\u25C0': '\u25C0' + VS_TEXT
  };
  var EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u2600-\u27BF\u2B00-\u2BFF\u231A-\u23FF\u2190-\u21FF\u25A0-\u25FF](?:\uFE0F|\uFE0E|[\u{1F3FB}-\u{1F3FF}])?(?:\u200D[\u{1F000}-\u{1FAFF}\u2600-\u27BF]\uFE0F?)*/gu;
  var KEEP_RE = /^[\u2190-\u21FF\u25A0-\u25FF\u2605\u2606\u2713\u2717\u2715\u270E\u2661\u2610]$/;  // 矢印・■□○△・★☆・✓✗✕・✎・♡・☐ はもとから字の記号なので残す
  var LETTER_RE = /[0-9A-Za-z\u3040-\u30FF\u3400-\u9FFF\uFF10-\uFF5A]/;
  var CUT = '\u0000';
  // t の中か、t をすぐに包む要素(ボタン・見出しなど)に字があれば、絵文字は飾りなのでとる
  function plainText(t, around) {
    var deco = LETTER_RE.test(t) || !!(around && LETTER_RE.test(around));
    var r = t.replace(EMOJI_RE, function (m) {
      var b = m.replace(/[\uFE0E\uFE0F\u200D]|[\u{1F3FB}-\u{1F3FF}]/gu, '');
      if (EMOJI_TO_TEXT[b] != null) return EMOJI_TO_TEXT[b];
      if (KEEP_RE.test(b) || !deco) return m;
      return CUT;
    });
    if (r.indexOf(CUT) < 0) return r;
    return r.replace(/\u0000[ \u3000]?/g, '').replace(/[ \u3000]\u0000/g, '');
  }
  // 絵文字だけの所のまわりの字: 2つ外の要素まで見る(「<button><span class="ic">💾</span>記録</button>」など)
  function around(p) {
    for (var k = 0; k < 2 && p; k++, p = p.parentElement) if (LETTER_RE.test(p.textContent)) return p.textContent;
    return '';
  }
  var SKIP_TAGS = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, INPUT: 1, CODE: 1, PRE: 1, IFRAME: 1 };
  function plainNode(n) {
    if (n.nodeType === 3) {
      var p = n.parentNode;
      if (!p || SKIP_TAGS[p.nodeName] || (p.closest && p.closest('svg, [data-ef-emoji], [contenteditable]'))) return;
      var t = plainText(n.nodeValue, LETTER_RE.test(n.nodeValue) ? '' : around(p));
      if (t !== n.nodeValue) n.nodeValue = t;
      return;
    }
    if (n.nodeType !== 1 || SKIP_TAGS[n.nodeName]) return;
    var w = document.createTreeWalker(n, 4), x, list = [];
    while ((x = w.nextNode())) list.push(x);
    list.forEach(plainNode);
  }
  function watchPlain() {
    if (!window.MutationObserver) return;
    new MutationObserver(function (ms) {
      ms.forEach(function (m) {
        if (m.type === 'characterData') plainNode(m.target);
        else Array.prototype.forEach.call(m.addedNodes, plainNode);
      });
    }).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
    plainNode(document.documentElement);
  }
  watchPlain();  // 読みこみの途中から見はる(はじめに絵文字が一瞬出ないように)

  window.EduitFrame = { AUTHOR: AUTHOR, furikaeri: furikaeri, jishu: jishu, open: open, howto: howto, footer: footer, aboutButton: aboutButton, fsButton: fsButton, mount: mount, levels: levels, card: card, code: code, menuTitle: menuTitle, sizeButton: sizeButton, jishuProgress: jishuProgress, jishuApp: function (c, title) { jishuSet = true; jishuMount(c, title); }, lets: function (id) { return LETS[id] || null; }, letsCard: letsCard };

  function start() { mount(); if (!jishuSet) jishuMount(); watchLets(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

"use strict";
// ---- js/store.js ----
const __m_js_store_js = (() => {

// 進捗・ふりかえりの保存（この端末のブラウザ内 localStorage のみ。外部には送らない）
// 注意: 写真や録音した音はここに絶対に渡さない（画面の中だけで使う）。

const STORE_KEY = "digilab.v1";

function emptyState() {
  return {
    version: 1,
    student: { cls: "", num: "", name: "" },
    modules: {}, // { [moduleId]: { steps: { [stepId]: isoDate }, score: {...} } }
    reflections: {}, // { [moduleId]: { text, at } }
    updatedAt: null,
  };
}

let state = load();
const listeners = new Set();

// 保存データを、はじめの形に重ねる。壊れたデータ（オブジェクトのはずの所が別の値など）は、はじめの形にもどす
function mergeSaved(base, saved) {
  if (!saved || typeof saved !== "object" || Array.isArray(saved)) return base;
  const out = { ...base, ...saved };
  for (const [k, v] of Object.entries(base)) {
    if (v && typeof v === "object" && (!out[k] || typeof out[k] !== "object" || Array.isArray(out[k]))) out[k] = v;
  }
  return out;
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return emptyState();
    return mergeSaved(emptyState(), JSON.parse(raw));
  } catch {
    return emptyState();
  }
}

function save() {
  state.updatedAt = new Date().toISOString();
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch {
    // プライベートモード等で保存できない場合も、画面上の体験は続けられる
  }
  listeners.forEach((fn) => fn(state));
}

const store = {
  get state() {
    return state;
  },
  subscribe(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  },
  completeStep(moduleId, stepId) {
    const m = (state.modules[moduleId] ||= { steps: {}, score: {} });
    if (m.steps[stepId]) return false;
    m.steps[stepId] = new Date().toISOString();
    save();
    return true;
  },
  isStepDone(moduleId, stepId) {
    return Boolean(state.modules[moduleId]?.steps?.[stepId]);
  },
  setScore(moduleId, key, value) {
    const m = (state.modules[moduleId] ||= { steps: {}, score: {} });
    m.score[key] = value;
    save();
  },
  getScore(moduleId, key) {
    return state.modules[moduleId]?.score?.[key];
  },
  setReflection(moduleId, text) {
    if (text) state.reflections[moduleId] = { text, at: new Date().toISOString() };
    else delete state.reflections[moduleId]; // 全部消したときは「まだ書いていません」にもどす
    save();
  },
  getReflection(moduleId) {
    return state.reflections[moduleId]?.text || "";
  },
  setStudent(info) {
    state.student = { ...state.student, ...info };
    save();
  },
  replaceAll(next) {
    state = mergeSaved(emptyState(), next);
    save();
  },
  reset() {
    state = emptyState();
    save();
  },
};

return { store };
})();

// ---- js/ui.js ----
const __m_js_ui_js = (() => {
const { store } = __m_js_store_js;
// 共通UI部品（解説カード、ステップ枠、ふりかえり、クイズ、トースト）

// 小さな要素ビルダー: h("div", { class: "card" }, "text", child)
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

// 振り返りを出すか（先生が「振り返りを隠す」設定にしたときは false。shared/eduit-frame.js の EduitFrame.furikaeri）
function furikaeriOn() {
  return !(globalThis.EduitFrame && globalThis.EduitFrame.furikaeri === false);
}
// 振り返りの欄・文字に付ける属性（隠す設定のときは eduit-frame.css で出なくなる）
const REFLECT_ATTR = { "data-ef-reflect": "" };

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

// 解説カード。kind: "info" | "warn" | "good" | "bad"
function explainCard(label, body, kind = "info") {
  const card = h("div", { class: `explain ${kind === "info" ? "" : kind}`, role: kind === "warn" ? "note" : null });
  card.append(h("span", { class: "explain-label" }, label));
  if (typeof body === "string") card.append(h("p", { html: body }));
  else card.append(body);
  return card;
}

// ステップ枠。done() を呼ぶとチェックが付き、進捗に記録される
function stepCard(moduleId, step, index) {
  const check = h("span", { class: "check", "aria-live": "polite" });
  const head = h(
    "h2",
    { class: "step-title", id: `step-${moduleId}-${step.id}` },
    h("span", { class: "badge" }, `ステップ${index + 1}`),
    h("span", {}, step.title),
    check,
  );
  const body = h("div");
  const card = h("section", { class: "card", "aria-labelledby": `step-${moduleId}-${step.id}`, "data-ef-reflect": step.id === "reflect" ? "" : null }, head, body);
  const refresh = () => {
    check.textContent = store.isStepDone(moduleId, step.id) ? "✓ できた" : "";
  };
  refresh();
  return {
    el: card,
    body,
    done() {

      ),

      h("span", { class: "mc-title" }, c.title),
      h("span", { class: "mc-desc" }, c.desc),
      h("div", { class: "bar", "aria-hidden": "true" }, h("span", { style: `width:${(p.done / p.total) * 100}%` })),
      h("span", { class: "hint" }, p.complete ? "✓ 完了" : `${p.done} / ${p.total} ステップ`),
    );
  });
  view.replaceChildren(
    h("div", { "data-ef-lets": "d13" }),
    h("div", { class: "module-head" }, h("h1", {}, "デジタル化ラボ"), h("p", { class: "meta" }, "コンピュータは、写真も音も文字も、0と1の数にして記録します。どうやって数にするのかを、手を動かして確かめよう。"), h("p", { class: "hint author" }, "作成：技術 岡田")),
    h(
      "section",
      { class: "card" },
      h("h2", {}, "アナログとデジタル"),
      h("p", {}, "針の時計は、針がなめらかに動きます。このように、切れめなく変わる量をアナログといいます。"),
      h("p", {}, "数字の時計は、1分ごとに数がとびとびに変わります。このように、数で表したものをデジタルといいます。"),
      h("details", {}, h("summary", {}, "くわしく: デジタルにする3つの手順(①〜③で出てくる)"), pipeline()),
      explainCard("安心して体験できます", "このラボは、このブラウザの中だけで動きます。インターネットには、まったくつながりません。写真を読み込んでも、マイクで声を録音しても、保存も送信もしません。"),
    ),
    h(
      "section",
      { class: "card" },
      h("h2", {}, "すすめ方"),
      h("ol", {}, h("li", {}, "①〜③を順に体験する", h("span", REFLECT_ATTR, "。それぞれのふりかえりを書く")), h("li", {}, "④の計算ドリルで、データ量の計算を練習する"), h("li", {}, "⑤の圧縮のしくみは発展。先生に言われたときや、早く終わったときに取り組む"), h("li", {}, h("a", { href: "#/records" }, recordsTitle()), "からファイルを書き出して提出する")),
    ),
    h("section", { class: "module-group" }, h("h2", {}, "体験する"), h("div", { class: "module-grid" }, cards)),
    h("div", { class: "btn-row start-row" }, h("a", { class: "btn", href: `#/${CATALOG[0].id}` }, `${CATALOG[0].label} ${CATALOG[0].title}からはじめよう →`)),
  );
}

async function renderModule(entry, stepId) {
  const m = entry.module;
  const root = h("div");
  view.replaceChildren(h("div", { class: "module-head" }, h("p", { class: "meta" }, entry.label), h("h1", {}, entry.title), h("p", {}, m.lead)), root);
  const idx = CATALOG.indexOf(entry);
  const prev = CATALOG[idx - 1];
  const next = CATALOG[idx + 1];
  const navRow = h(
    "div",
    { class: "btn-row" },
    prev ? h("a", { class: "btn secondary", href: `#/${prev.id}` }, "← 前へ") : null,
    next ? h("a", { class: "btn", href: `#/${next.id}` }, `次へ：${next.title} →`) : h("a", { class: "btn", href: "#/records" }, `${recordsTitle()}へ →`),
  );
  await m.render(root);
  view.append(navRow);
  if (stepId) document.getElementById(`step-${entry.id}-${stepId}`)?.scrollIntoView({ block: "start" });
}

let current = null;
async function route() {
  const { id, step } = parseHash();
  const entry = CATALOG.find((c) => c.id === id);
  flushReflections(); // 書きかけのふりかえりを、ページを移る前に保存する
  current?.module?.leave?.(); // 前のモジュールの後片付け（マイクを止めるなど）
  current = entry || null;
  renderNav(id);
  renderOverall();
  window.scrollTo(0, 0);
  if (entry) await renderModule(entry, step);
  else if (id === "records") renderRecords(view, CATALOG);
  else renderHome();
  document.title = `${entry ? entry.title : id === "records" ? recordsTitle() : "はじめに"} | デジタル化ラボ`;
  if (!step) view.focus({ preventScroll: true });
}

store.subscribe(() => {
  renderNav(parseHash().id);
  renderOverall();
});
window.addEventListener("hashchange", route);
renderToggles();
route();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

return {  };
})();
</script>
