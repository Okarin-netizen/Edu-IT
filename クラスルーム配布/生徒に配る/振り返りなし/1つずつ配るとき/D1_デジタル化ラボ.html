  <!-- 4分野共通の枠（色・ヘッダー・ボタン・フッター・このアプリについて）。1ファイル版では中に入れる -->
  <style id="eduit-frame-css">
/* Edu-IT 共通の枠(4分野・全アプリ共通)
 * 色・文字・ボタン・カード・ヘッダー・フッターの見た目をそろえるための部品。
 * 分野の色は <html data-ef-domain="A|B|C|D"> で切りかわる。
 * アプリ固有の見た目は各アプリの CSS に残し、ここでは「枠」だけを決める。
 */
:root {
  color-scheme: light;      /* 端末がダークモードでも、4分野とも明るい画面で出す */
  --ef-font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --ef-bg: #f5f4f0;          /* 画面の地 */
  --ef-surface: #ffffff;     /* カード・ヘッダー */
  --ef-surface-2: #f8f7f4;   /* 一段下げた面 */
  --ef-line: #d6d3cb;        /* 枠線 */
  --ef-text: #1f2328;
  --ef-muted: #565d68;
  --ef-focus: #f08c00;       /* キーボード操作の枠 */
  --ef-radius: 12px;
  --ef-radius-s: 8px;
  --ef-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .04);
  --ef-header-h: 52px;
  --ef-tap: 40px;            /* ボタンの最小の高さ */
  /* 分野の色(既定は D) */
  --ef-accent: #1a5fc8;
  --ef-accent-ink: #ffffff;
  --ef-accent-soft: #e6eefb;

.choice-list { display: grid; gap: 8px; margin: 10px 0; padding: 0; list-style: none; }

}

table.data { border-collapse: collapse; width: 100%; font-size: 0.9rem; }

.module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.module-card {
  display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--text-primary);

}

.reflection textarea { margin-top: 6px; }
.saved-note { font-size: 0.85rem; color: var(--good); min-height: 1.4em; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text-primary); color: var(--surface-1);
  padding: 10px 18px; border-radius: 99px; font-size: 0.9rem; z-index: 20; max-width: calc(100vw - 32px); width: max-content; opacity: 0; transition: opacity 0.2s; pointer-events: none;
}

/* グラフ */
.chart { width: 100%; position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid line { stroke: var(--border); stroke-width: 1; }
.chart .axis text, .chart text.axis { fill: var(--text-muted); font-size: 11px; font-family: var(--font); }
.chart text.label { fill: var(--text-primary); font-size: 12px; font-family: var(--font); }
.chart text.label-strong { fill: var(--text-primary); font-size: 12px; font-weight: 700; font-family: var(--font); }
.chart .tooltip {
  position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 0.8rem; box-shadow: var(--shadow); white-space: nowrap; display: none; z-index: 3;
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--text-secondary); margin: 6px 0; padding: 0; list-style: none; }
.legend .sw { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

/* 暗号 */
.cipher-wheel { font-family: var(--mono); overflow-x: auto; padding-bottom: 4px; }
.cipher-wheel .row { display: flex; gap: 2px; }
.cipher-wheel .row span {
  flex: none; width: 26px; text-align: center; padding: 2px 0; border-radius: 4px; background: var(--surface-2); font-size: 0.9rem;
}
.cipher-wheel .row.out span { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.cipher-wheel .arrow { font-size: 0.75rem; color: var(--text-muted); padding-left: 2px; }
.cipher-text {
  font-family: var(--mono); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; word-break: break-all;
  letter-spacing: 0.06em; min-height: 2.6em;
}
.shift-table td.mono { letter-spacing: 0.05em; }
.shift-table tr.hit td { background: var(--good-soft); font-weight: 700; }
.math-line { font-family: var(--mono); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; margin: 4px 0; overflow-x: auto; white-space: nowrap; }
.kx-diagram { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; text-align: center; margin: 12px 0; }
.kx-person { background: var(--surface-2); border-radius: 10px; padding: 10px; }
.kx-person .emoji { font-size: 1.8rem; display: block; }
.kx-mid { font-size: 0.85rem; color: var(--text-secondary); }

/* フィッシング */
.scenario-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.scenario-tabs button {
  font: inherit; font-size: 0.85rem; padding: 6px 12px; border-radius: 99px; border: 1.5px solid var(--border);
  background: var(--surface-1); color: var(--text-primary); cursor: pointer; min-height: 36px; position: relative;
}
.scenario-tabs button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.scenario-tabs button.done::after { content: " ✓"; color: var(--good); }
.mock {
  border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; background: #ffffff; color: #1b1b1a;
  max-width: 560px; margin: 0 auto;
}
.mock-bar { background: #eceae4; padding: 8px 12px; font-size: 0.8rem; color: #52514e; display: flex; gap: 8px; align-items: center; }

.mock-body { padding: 16px; }
.mock .hs {
  display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: transparent;
  border: 2px dashed transparent; border-radius: 6px; padding: 2px 6px; margin: 2px -6px; cursor: pointer;
}
.mock .hs:hover { border-color: #b9b6ad; }

.mock .mail-head { border-bottom: 1px solid #e3e1da; padding-bottom: 8px; margin-bottom: 10px; font-size: 0.9rem; }
.mock .mail-subject { font-weight: 700; font-size: 1.05rem; }
.mock .fake-btn { display: inline-block; background: #256abf; color: #fff; padding: 6px 14px; border-radius: 6px; font-weight: 700; }

.feedback-list { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 8px; }

.feedback-list li.missed .tag { color: var(--bad); }

@media (forced-colors: active) {
  .mock .hs.found, .mock .hs.missed, .mock .hs.picked { border-style: solid; }
  .bar > span { background: Highlight; }
}
@media print {
  .app-header, .chapter-nav, .btn-row, .app-footer { display: none; }
  .layout { display: block; }
}

/* ハッシュ */
.hash-view { font-size: 0.85rem; }

/* 通信の模擬 */
.net-route { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0 8px; padding-top: 34px; }
.net-node { background: var(--surface-2); border-radius: 10px; padding: 8px 4px; text-align: center; font-size: 0.82rem; position: relative; }

/* SNS */
.sns-photo { position: relative; line-height: 0; }
.sns-photo svg { width: 100%; height: auto; display: block; }
.photo-hs { position: absolute; border: 2px dashed transparent; background: transparent; border-radius: 6px; cursor: pointer; padding: 0; }
.photo-hs:hover { border-color: rgba(255,255,255,0.9); }
.photo-hs.picked { border: 3px solid #eda100; background: rgba(237,161,0,0.18); }
.photo-hs.found { border: 3px solid #1f7a3a; background: rgba(31,122,58,0.18); }
.photo-hs.missed { border: 3px solid #b3261e; background: rgba(179,38,30,0.18); }
.photo-hs.false-pick { border: 3px solid #8a8880; }
.check-list { display: grid; gap: 6px; align-content: start; }
.check-item { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.check-item input { width: 20px; height: 20px; flex: none; margin-top: 3px; accent-color: var(--accent); }

/* 拡散シミュレーション */
.spread-svg { width: 100%; max-width: 560px; display: block; margin: 8px auto; }
.spread-svg .edge { stroke: var(--border); stroke-width: 1.2; }
.spread-svg .node { fill: var(--surface-2); stroke: var(--text-muted); stroke-width: 1.5; transition: fill 0.3s; }
.spread-svg .node.seen { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
.spread-svg .node.copy { fill: var(--series-2); stroke: var(--text-primary); stroke-width: 2.5; }
.spread-svg .node.me { fill: var(--accent); stroke: var(--text-primary); stroke-width: 2.5; }
.spread-svg .node.deleted { fill: var(--surface-1); stroke: var(--text-muted); stroke-dasharray: 3 3; }
.spread-svg .node-label { font-size: 8px; fill: var(--surface-1); font-weight: 700; font-family: var(--font); pointer-events: none; }
.spread-stats { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; font-size: 0.92rem; }
.legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background: var(--surface-2); border: 1.5px solid var(--text-muted); }
.legend .dot.me { background: var(--accent); border-color: var(--text-primary); }
.legend .dot.seen { background: var(--series-1); border-color: var(--series-1); }
.legend .dot.copy { background: var(--series-2); border-color: var(--text-primary); }
@media (prefers-reduced-motion: reduce) { .spread-svg .node { transition: none; } }

/* 分岐型 */

.branch-a { margin: 0; font-weight: 700; color: var(--accent); }
.case-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }

/* 行動宣言 */
.action-group { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px 12px; margin: 0 0 10px; }
.action-group legend { font-weight: 700; padding: 0 6px; }
.check-item:has(input:disabled) { opacity: 0.55; cursor: not-allowed; }
.declare-card { border: 3px double var(--accent); border-radius: 14px; padding: 20px 24px; background: var(--surface-1); }

@media print {
  body.print-card main > *:not(:has(#declare-card)) { display: none; }
  body.print-card .card:not(:has(#declare-card)) { display: none; }
  body.print-card .module-head, body.print-card .btn-row, body.print-card .step-title { display: none; }
  body.print-card .card { border: none; box-shadow: none; }
}

/* 理解度チェック */
.check-q { border: 1px solid var(--border); }

.check-q .badge { font-size: 0.75rem; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }

.check-q.is-wrong { border-color: var(--bad); }

/* 表示の切りかえ */
.display-toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.display-toggles .toggle {
  font: inherit; font-size: 0.8rem; padding: 4px 10px; border-radius: 99px; border: 1.5px solid var(--border);
  background: var(--surface-1); color: var(--text-secondary); cursor: pointer; min-height: 32px;
}
.display-toggles .toggle[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.display-toggles .toggle[aria-pressed="true"]::before { content: "✓ "; }
html.large-text { font-size: 20px; }
.easy-summary { display: none; }
html.easy-mode .easy-summary { display: block; }
ruby rt { font-size: 0.55em; color: var(--text-secondary); font-weight: 400; }
ruby { ruby-align: center; }
@media (max-width: 860px) { html.large-text { font-size: 18px; } .display-toggles { order: 3; width: 100%; } }

/* デジタル化 */
.pixel-canvas { width: 100%; max-width: 320px; height: auto; image-rendering: pixelated; border-radius: 8px; border: 1px solid var(--border); display: block; }
.digital-row { align-items: start; }
.rle-grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 1px; width: 100%; max-width: 288px; background: var(--border); border: 1px solid var(--border); }
.rle-grid span { aspect-ratio: 1; background: #ffffff; }
.rle-grid span.on { background: #1b1b1a; }
.rle-codes { font-size: 0.8rem; margin: 6px 0 0; padding-left: 2.2em; line-height: 1.6; }
.app-footer p { margin: 0 0 4px; }
.app-footer .author { font-weight: 700; color: var(--text-secondary); }
.module-head .author { margin-top: -4px; }
main#view:focus { outline: none; }

/* ===== デジタル化ラボ用 ===== */
.pipeline { list-style: none; padding: 0; margin: 12px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; counter-reset: p; }
.pipeline li { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; position: relative; }
.pipeline li strong { font-size: 1.1rem; color: var(--accent); }
.pipeline li strong::before { counter-increment: p; content: counter(p) ". "; }
/* 矢印は箱と箱のすき間（24px）のまん中に出す（次の箱の下にかくれないように） */
.pipeline li:not(:last-child)::after { content: "→"; position: absolute; right: -12px; top: 50%; transform: translate(50%, -50%); color: var(--text-muted); font-weight: 700; line-height: 1; z-index: 1; }
@media (max-width: 560px) { .pipeline { grid-template-columns: 1fr; } .pipeline li:not(:last-child)::after { content: "↓"; right: 50%; top: auto; bottom: -12px; transform: translate(50%, 50%); } }

.paint-grid { display: grid; gap: 2px; width: 100%; max-width: 288px; background: var(--border); border: 2px solid var(--border); border-radius: 6px; }
.paint-grid .px-row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
.paint-grid.p16 { gap: 1px; max-width: 320px; }
.paint-grid.p16 .px-row { grid-template-columns: repeat(16, 1fr); gap: 1px; }
/* 指で塗るとき（タブレット）は、1マスを30px以上にする */
@media (pointer: coarse) {
  .digital-row.painting { grid-template-columns: minmax(0, 1fr); }
  .digital-row.painting .paint-grid.p16 { max-width: 512px; }
}
.paint-grid .px { aspect-ratio: 1; border: 0; padding: 0; margin: 0; background: #ffffff; cursor: pointer; min-width: 0; }
.paint-grid .px:hover { background: #d8e6f8; }
.paint-grid .px.on { background: #1b1b1a; }
.paint-grid .px:focus-visible { outline-offset: -3px; }
.row-compare { border-collapse: collapse; margin: 4px 0 8px; font-size: 0.95rem; }
.row-compare th, .row-compare td { padding: 1px 8px; text-align: center; letter-spacing: 0.12em; border-bottom: 1px solid var(--border); }
.row-compare thead th { font-family: var(--font); letter-spacing: 0; font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; }
.row-compare tbody th { color: var(--text-secondary); font-weight: 500; letter-spacing: 0; }
.row-compare tbody td:nth-child(2) { background: var(--surface-2); }

.row-compare td.ok { color: var(--good); font-weight: 700; }
.row-compare td.ng { color: var(--bad); font-weight: 700; }
.bit-rows { margin: 4px 0 8px; padding-left: 2.2em; font-size: 0.95rem; line-height: 1.55; letter-spacing: 0.12em; }
.bit-rows.target { background: var(--surface-2); border-radius: 8px; padding: 8px 8px 8px 2.6em; display: inline-block; }

.thumb { width: 48px; height: 48px; image-rendering: pixelated; border-radius: 4px; border: 1px solid var(--border); display: block; }
table.data td.num { text-align: right; white-space: nowrap; }

.swatch { width: 100%; max-width: 260px; aspect-ratio: 16 / 9; border-radius: 10px; border: 1px solid var(--border); }
.rgb-codes { margin-top: 8px; font-size: 0.95rem; line-height: 1.6; white-space: pre; }
.rgb-codes .wrap-note { white-space: normal; }
input.rgb-r { accent-color: #d33a2c; }
input.rgb-g { accent-color: #1f9a46; }
input.rgb-b { accent-color: #2a5fd6; }
.goal-list { list-style: none; padding: 0; margin: 4px 0; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.goal-list li.done { color: var(--good); font-weight: 700; }

.bit-cards { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 10px 0; }
.bit-card {
  display: grid; grid-template-rows: auto 1fr auto; place-items: center; gap: 2px; min-height: 108px; padding: 8px 2px;
  border: 2px solid var(--border); border-radius: 10px; background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 6px, var(--surface-1) 6px, var(--surface-1) 12px);
  color: var(--text-primary); font: inherit; cursor: pointer;
}
.bit-card[aria-pressed="true"] { background: var(--surface-1); border-color: var(--accent); }
.bit-card .bc-value { font-weight: 700; font-size: 1.15rem; min-height: 1.4em; }
.bit-card .bc-dots { font-size: 0.6rem; color: var(--accent); word-break: break-all; line-height: 1.1; text-align: center; }
.bit-card .bc-bit { font-family: var(--mono); font-weight: 700; font-size: 1.3rem; color: var(--text-secondary); }

@media (max-width: 560px) { .bit-card { min-height: 84px; } .bit-card .bc-value { font-size: 0.9rem; } }
.goal { margin: 8px 0; }
.btn-row[hidden] { display: none; }

.big-char { font-size: 1.4rem; font-weight: 700; }
.ascii-table { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.4em, 1fr)); gap: 4px; margin: 10px 0; font-size: 0.85rem; }

.hand-item { border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 10px; }

.inline-field { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.listen-log { margin: 4px 0 10px; padding-left: 1.4em; font-size: 0.9rem; }

.drill-head { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }

/* 第2段（2026-10-13 レビュー）: DL-03/04/05/15/16 */

details.advanced summary { padding: 8px 0; min-height: 40px; }
.drill-kind-note { margin: -4px 0 8px; }
.drill-kind-note:empty { display: none; }
.calc-ok { margin-left: 0.4em; }
.lesson-plan { margin-top: 12px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
.lesson-plan h3 { font-size: 1rem; margin-bottom: 6px; }
.lesson-plan ul { margin: 0; padding-left: 1.2em; }

 *   → <article class="ef-card ef-mcard">。記号・アイコン・名前・説明・使うところ・追加の欄・「ひらく ▶」の順。カードのどこを押しても開く。
 * 記号の印: EduitFrame.code('A2') → <span class="ef-code">A2</span>(メニューの上のバー・アプリの上のバー・切りかえボタンで使う)
 * メニューの上のバーの名前: EduitFrame.menuTitle(h1) → h1 の中を「[A] 材料と加工の技術 教材集」にする
 * 上のバーの表示の道具(4分野で同じ形):
 *   ふりがな・くっきり: <button class="ef-btn ef-toggle" aria-pressed="true|false">ふりがな</button>(ON は分野の色で塗り、✓ が付く)
 *   文字の大きさ: <button class="ef-btn ef-size"></button> に EduitFrame.sizeButton(btn, { steps: [[値, '中'], [値, '大'], …], get: 今の値, set: function (値) {…} })
 *     →「文字 中」のボタンになり、押すたびに次の大きさへ(最後のつぎは最初へ)。もどり値の関数を呼ぶと表示を今の値に合わせる。
 *     「ふつう・大きい」の2段だけのときは、<button class="ef-btn ef-size" aria-pressed="false">文字 <span class="ef-size-v"></span></button> にして aria-pressed を切りかえるだけでよい(「中」「大」は CSS が出す)。
 *
 * 振り返りを隠す設定: EduitFrame.furikaeri(true = 出す / false = 隠す)。隠すときは <html data-ef-furikaeri="off"> になり、
 *   data-ef-reflect の付いた要素(振り返りのタブ・欄・カードの印など)が出なくなる(eduit-frame.css)。決め方(先のものが勝つ):
 *   1. アドレスの ?furikaeri=off / ?furikaeri=on(自分か、同じサイトの親の画面のアドレス)。localStorage 'eduit.furikaeri' に覚える
 *   2. window.EDUIT_FURIKAERI = 'off' / 'on'(自分か親の画面。配布用の「振り返りなし」版はこれを入れてある)
 *   3. localStorage 'eduit.furikaeri'(前に 1 で決めたもの)
 *   JS で振り返りを出し分けるとき(振り返りを書かないと先へ進めない、など)は EduitFrame.furikaeri を見る。
 *
 * 基本編・発展編(メニュー用): EduitFrame.levels(置き場所, { card: function (item, parts, levelKey) { return カードの要素; }, code: function (item) { return 'A1'; } })
 *   code を渡すと、基本編の上に「おすすめの順番: A1 → A2 → …」の1行を出す(カードの順 = 番号の順 = おすすめの順)。
 *   EDUIT_INFO.levels = {
 *     basic:    { title: '基本編', lead: '…', items: [{ id: 'M1', parts: ['材料カード', …], curr: 'A(1)ア', why: '…' }, …] },
 *     advanced: { title: '発展編', lead: '…', items: [ … ] }
 *   }
 *   id はメニューごとのアプリの id。parts は生徒の画面に出るタブ・ページの名前(「使うところ」に出す)。
 *   curr(学習指導要領の項目)と why(分けた理由)は先生用の一覧だけに出し、生徒のカードには出さない。
 *   選んだ編は localStorage の 'eduit.level.<分野>' に覚える(表示の設定なので「はじめから」でも消さない)。
 */
(function () {
  'use strict';
  var AUTHOR = '技術　岡田';
  var info = window.EDUIT_INFO || {};
  var app = info.app || {};
  if (info.domain) document.documentElement.setAttribute('data-ef-domain', info.domain);

  // ---- 振り返りを隠す設定 ----
  var FK_KEY = 'eduit.furikaeri';
  function furikaeriSetting() {
    var w = window, v = null;
    for (var i = 0; i < 8 && v === null; i++) {
      try {
        var m = /[?&]furikaeri=(on|off)(?:&|$)/.exec(w.location.search || '');
        if (m) { v = m[1]; try { localStorage.setItem(FK_KEY, v); } catch (e) {} }
        else if (w.EDUIT_FURIKAERI === 'on' || w.EDUIT_FURIKAERI === 'off') v = w.EDUIT_FURIKAERI;
      } catch (e) { break; }  // ちがうサイトの親は見ない
      if (w === w.parent) break;
      w = w.parent;
    }
    if (v === null) try { v = localStorage.getItem(FK_KEY); } catch (e) {}
    return v !== 'off';
  }
  var furikaeri = furikaeriSetting();
  if (!furikaeri) document.documentElement.setAttribute('data-ef-furikaeri', 'off');

  var SAFETY = [
    'この教材はインターネットに接続しません。外部のサイトやサーバーへ、入力した内容や学習の記録を送ることはありません。',
    '学習の記録は、開いた端末のブラウザの中だけに保存されます。ほかの端末や先生のパソコンへ自動で送られることはありません。',
    '提出するときは、自分で「書き出す」などのボタンでファイルにして、先生の指示どおりに出します。',
    '名前などの個人情報は、先生の指示がないときは入力しないでください。',
    '端末をほかの人と共有するときは、提出したあとに記録を消してください。',
    '教材に出てくる会社名・人名・アドレス・数値は、学習のために作ったものです(実在のものではありません。数値は目安です)。',
    '広告・アクセス解析・Cookie による追跡はありません。外部のプログラム(CDN など)も読み込みません。'
  ];
  var LICENSE = [
    '著作権: © 2026 ' + AUTHOR,
    '学校の授業・家庭学習など、学習のためであれば、だれでも無料で使用・コピー・配布できます(ほかの学校の先生も使えます)。',
    '授業に合わせて直して使うこともできます。直したものを配るときは、直したことと、もとの作者(' + AUTHOR + ')を書いてください。',
    '販売すること、有料の教材や商品に入れて配ることはできません。',
    'この教材は今のまま提供します。使ったことで起きた不具合や損害について、作者は責任を負いません。',
    '教科書の図や文章は使っていません。図や文章はこの教材のために作ったものです。'
  ];

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'class') e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function list(items) { return el('ul', null, items.map(function (t) { return el('li', { text: t }); })); }
  function appName() { return app.name || info.suite || document.title; }

  var dlg = null;
  function build() {
    var safety = SAFETY.concat(info.safety || []).concat(app.safety || []);
    var hist = info.history || [];
    var panels = [
      ['安全と個人情報', [el('h3', { text: 'この教材の安全について' }), list(safety)]],
      ['ライセンス', [el('h3', { text: '使ってよい条件' }), list(LICENSE)]],
      ['更新履歴', hist.length ? hist.map(function (h) {
        return el('section', null, [
          el('h3', null, [el('span', { class: 'ef-hist-ver', text: h.version ? '第' + h.version + '版' : '' }),
            el('span', { class: 'ef-hist-date', text: h.date || '' })]),
          list(h.items || [])
        ]);
      }) : [el('p', { text: 'まだありません。' })]],
      ['作った人', [
        el('h3', { text: appName() }),
        el('p', { text: (info.domainName ? '中学校 技術・家庭科(技術分野)「' + info.domainName + '」の教材です。' : '中学校 技術・家庭科(技術分野)の教材です。') }),
        el('p', { text: '作成: ' + AUTHOR }),
        el('p', { text: (info.version ? '第' + info.version + '版' : '') + (info.updated ? '(' + info.updated + ' 更新)' : '') })
      ]]
    ];
    var tabs = el('div', { class: 'ef-tabs', role: 'tablist' });
    var body = el('div');
    var tabEls = [], panelEls = [];
    panels.forEach(function (p, i) {
      var t = el('button', { type: 'button', class: 'ef-tab', role: 'tab', id: 'ef-tab-' + i, 'aria-controls': 'ef-panel-' + i, 'aria-selected': i ? 'false' : 'true', tabindex: i ? '-1' : '0', text: p[0] });
      var pn = el('div', { class: 'ef-panel', role: 'tabpanel', id: 'ef-panel-' + i, 'aria-labelledby': 'ef-tab-' + i }, p[1]);
      if (i) pn.hidden = true;
      t.addEventListener('click', function () { select(i); });
      t.addEventListener('keydown', function (e) {
        var n = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (n) { e.preventDefault(); select((i + n + panels.length) % panels.length); tabEls[(i + n + panels.length) % panels.length].focus(); }
      });
      tabEls.push(t); panelEls.push(pn); tabs.appendChild(t); body.appendChild(pn);
    });
    function select(i) {
      tabEls.forEach(function (t, j) { t.setAttribute('aria-selected', i === j ? 'true' : 'false'); t.tabIndex = i === j ? 0 : -1; });
      panelEls.forEach(function (p, j) { p.hidden = i !== j; });
    }
    var close = el('button', { type: 'button', class: 'ef-btn', text: '閉じる' });
    close.addEventListener('click', function () { dlg.close(); });
    dlg = el('dialog', { class: 'ef-dialog', 'aria-labelledby': 'ef-dialog-title' }, [
      el('div', { class: 'ef-dialog-in' }, [
        el('div', { class: 'ef-dialog-head' }, [el('h2', { id: 'ef-dialog-title', text: 'このアプリについて' }), close]),
        tabs, body
      ])
    ]);
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
    dlg._select = select;
    document.body.appendChild(dlg);
  }
  function open(tab) {
    if (!dlg) build();
    dlg._select(typeof tab === 'number' ? tab : 0);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  }

  function aboutButton(cls) {
    var b = el('button', { type: 'button', class: cls || 'ef-btn ef-about-btn', title: '作った人・安全と個人情報・ライセンス・更新履歴', text: 'ⓘ このアプリについて' });
    b.addEventListener('click', function () { open(0); });
    return b;
  }
  function footer() {
    var link = aboutButton('ef-about-link');
    link.textContent = '安全と個人情報・ライセンス・更新履歴';
    return el('footer', { class: 'ef-footer', role: 'contentinfo' }, [
      el('span', null, ['作成: ', el('span', { class: 'ef-author', text: AUTHOR })]),
      info.version ? el('span', { text: '第' + info.version + '版' + (info.updated ? '(' + info.updated + ')' : '') }) : null,
      link
    ]);
  }
  function mount() {
    if (app.footer === false) return;
    var slot = document.querySelector('[data-ef-footer]');
    var about = document.querySelector('[data-ef-about]');
    if (slot) { if (!slot.querySelector('.ef-footer')) slot.appendChild(footer()); }
    else if (about) { if (!about.querySelector('button')) about.appendChild(aboutButton()); }
    else if (!document.querySelector('body > .ef-footer')) document.body.appendChild(footer());
  }

  // ---- 基本編・発展編のタブ(メニュー用) ----
  var LEVEL_KEYS = ['basic', 'advanced'];
  function levels(box, opts) {
    var L = info.levels;
    if (!box || !L) return null;
    opts = opts || {};
    var store = 'eduit.level.' + (info.domain || 'x');
    var cur = 'basic';
    try { if (LEVEL_KEYS.indexOf(localStorage.getItem(store)) >= 0) cur = localStorage.getItem(store); } catch (e) {}
    var uid = 'ef-lv-' + (info.domain || 'x');
    var tabs = el('div', { class: 'ef-level-tabs', role: 'tablist', 'aria-label': '基本編と発展編' });
    var panel = el('div', { class: 'ef-level-panel', role: 'tabpanel', id: uid + '-panel', tabindex: '-1' });
    var tabEls = LEVEL_KEYS.map(function (k, i) {
      var lv = L[k] || { items: [] };
      var t = el('button', { type: 'button', role: 'tab', class: 'ef-level-tab ef-level-' + k, id: uid + '-' + k, 'aria-controls': uid + '-panel' }, [
        el('span', { class: 'ef-level-name', text: lv.title || (k === 'basic' ? '基本編' : '発展編') }),
        el('span', { class: 'ef-level-count', text: (lv.items || []).length + 'つ' })
      ]);
      t.addEventListener('click', function () { select(k, true); });
      t.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        var n = LEVEL_KEYS[(i + 1) % LEVEL_KEYS.length];
        select(n, true); tabEls[LEVEL_KEYS.indexOf(n)].focus();
      });
      tabs.appendChild(t);
      return t;
    });
    function partsEl(item) {
      if (!item.parts || !item.parts.length) return null;
      return el('p', { class: 'ef-level-parts' }, [el('span', { class: 'ef-level-parts-k', text: '使うところ' }), item.parts.join('・')]);
    }
    function render() {
      var lv = L[cur] || { items: [] };
      tabEls.forEach(function (t, i) { var on = LEVEL_KEYS[i] === cur; t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = on ? 0 : -1; });
      panel.setAttribute('aria-labelledby', uid + '-' + cur);
      var grid = el('div', { class: 'ef-level-grid ' + (opts.gridClass || '') });
      (lv.items || []).forEach(function (item) {
        var c = opts.card ? opts.card(item, partsEl(item), cur) : null;
        if (c) grid.appendChild(c);
      });
      while (panel.firstChild) panel.removeChild(panel.firstChild);
      if (lv.lead) panel.appendChild(el('p', { class: 'ef-level-lead', text: lv.lead }));
      if (opts.code && cur === 'basic') {
        var codes = (lv.items || []).map(opts.code).filter(Boolean);
        if (codes.length) panel.appendChild(el('p', { class: 'ef-level-order' }, [el('span', { class: 'ef-level-parts-k', text: 'おすすめの順番' }), codes.join(' → ')]));
      }
      panel.appendChild(grid);
      if (opts.onRender) opts.onRender(panel, cur);
    }
    function select(k, byUser) {
      if (LEVEL_KEYS.indexOf(k) < 0) return;
      cur = k;
      if (byUser) try { localStorage.setItem(store, k); } catch (e) {}
      render();
    }
    while (box.firstChild) box.removeChild(box.firstChild);
    box.classList.add('ef-levels');
    box.appendChild(tabs);
    box.appendChild(panel);
    render();
    return { render: render, select: select, current: function () { return cur; } };
  }

  // ---- 記号の印・メニューの上のバーの名前・メニューのカード(4分野共通の形) ----
  function code(c) { return el('span', { class: 'ef-code', text: c }); }
  function menuTitle(h) {
    if (!h) return h;
    while (h.firstChild) h.removeChild(h.firstChild);
    h.classList.add('ef-title');
    if (info.domain) h.appendChild(code(info.domain));
    h.appendChild(el('span', { class: 'ef-title-name', text: (info.domainName || '') + ' 教材集' }));
    return h;
  }
  function card(o) {
    o = o || {};
    var go = o.href
      ? el('a', { class: 'ef-btn-primary ef-mcard-go', href: o.href, text: 'ひらく ▶' })
      : el('button', { type: 'button', class: 'ef-btn-primary ef-mcard-go', text: 'ひらく ▶' });
    if (o.openAttrs) for (var k in o.openAttrs) go.setAttribute(k, o.openAttrs[k]);
    if (o.title) go.setAttribute('aria-label', (o.code ? o.code + ' ' : '') + o.title + ' をひらく');
    if (o.onOpen) go.addEventListener('click', function (e) { o.onOpen(e); });
    var extra = (o.extra || []).filter(Boolean);
    var c = el('article', { class: 'ef-card ef-mcard' }, [
      el('div', { class: 'ef-mcard-hd' }, [
        o.icon ? el('span', { class: 'ef-mcard-ic', 'aria-hidden': 'true', text: o.icon }) : null,
        el('div', { class: 'ef-mcard-ht' }, [
          o.code ? el('p', { class: 'ef-card-tag' }, [code(o.code)]) : null,
          el('h3', { class: 'ef-card-title', text: o.title || '' })
        ])
      ]),
      o.desc ? el('p', { class: 'ef-mcard-desc', text: o.desc }) : null,
      o.parts || null,
      extra.length ? el('div', { class: 'ef-mcard-extra' }, extra) : null,
      go
    ]);
    if (o.code) c.setAttribute('data-code', o.code);
    // カードのどこを押しても開く(カードの中のほかのボタン・リンク・入力は、そのまま)
    c.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('a, button, input, select, textarea, label, summary')) return;
      go.click();
    });
    return c;
  }

  // ---- 文字の大きさのボタン(4分野で同じ形:「文字 中」。押すたびに次の大きさへ) ----
  function sizeButton(btn, opt) {
    var steps = opt.steps;
    btn.classList.add('ef-btn', 'ef-size');
    btn.type = 'button';
    btn.textContent = '';
    btn.appendChild(document.createTextNode('文字 '));
    var v = document.createElement('span');
    v.className = 'ef-size-v';
    v.setAttribute('data-noruby', '');
    btn.appendChild(v);
    function idx() {
      var cur = opt.get(), best = 0;
      for (var i = 1; i < steps.length; i++) if (Math.abs(steps[i][0] - cur) < Math.abs(steps[best][0] - cur)) best = i;
      return best;
    }
    function update() {
      var s = steps[idx()][1];
      v.textContent = s;
      btn.title = '文字の大きさ(いまは「' + s + '」。押すと変わる)';
      btn.setAttribute('aria-label', '文字の大きさ: ' + s);
    }
    btn.addEventListener('click', function () { opt.set(steps[(idx() + 1) % steps.length][0]); update(); });
    update();
    return update;
  }

  window.EduitFrame = { AUTHOR: AUTHOR, furikaeri: furikaeri, open: open, footer: footer, aboutButton: aboutButton, mount: mount, levels: levels, card: card, code: code, menuTitle: menuTitle, sizeButton: sizeButton };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();

</script>
</head>
<body>

  <script>
"use strict";
// ---- js/store.js ----
const __m_js_store_js = (() => {

// 進捗・ふりかえりの保存（この端末のブラウザ内 localStorage のみ。外部には送らない）
// 注意: 写真や録音した音はここに絶対に渡さない（画面の中だけで使う）。

const STORE_KEY = "digilab.v1";

function emptyState() {
  return {
    version: 1,
    student: { cls: "", num: "", name: "" },
    modules: {}, // { [moduleId]: { steps: { [stepId]: isoDate }, score: {...} } }
    reflections: {}, // { [moduleId]: { text, at } }
    updatedAt: null,
  };
}

let state = load();
const listeners = new Set();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return emptyState();
    const parsed = JSON.parse(raw);
    return { ...emptyState(), ...parsed };
  } catch {
    return emptyState();
  }
}

function save() {
  state.updatedAt = new Date().toISOString();
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch {
    // プライベートモード等で保存できない場合も、画面上の体験は続けられる
  }
  listeners.forEach((fn) => fn(state));
}

const store = {
  get state() {
    return state;
  },
  subscribe(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  },
  completeStep(moduleId, stepId) {
    const m = (state.modules[moduleId] ||= { steps: {}, score: {} });
    if (m.steps[stepId]) return false;
    m.steps[stepId] = new Date().toISOString();
    save();
    return true;
  },
  isStepDone(moduleId, stepId) {
    return Boolean(state.modules[moduleId]?.steps?.[stepId]);
  },
  setScore(moduleId, key, value) {
    const m = (state.modules[moduleId] ||= { steps: {}, score: {} });
    m.score[key] = value;
    save();
  },
  getScore(moduleId, key) {
    return state.modules[moduleId]?.score?.[key];

// 再生用に、スピーカーの標本化周波数まで点と点を直線でつなぐ
function resample(arr, fromRate, toRate) {
  const n = Math.floor((arr.length / fromRate) * toRate);
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i * fromRate) / toRate;
    const k = Math.floor(x);
    const a = arr[k] ?? 0;
    const b = arr[k + 1] ?? a;
    out[i] = a + (b - a) * (x - k);
  }
  return out;
}
// 録音した音を rate に標本化する（区間の平均をとって、高い成分を弱めてから間引く）
function downsample(arr, fromRate, rate) {
  const n = Math.floor((arr.length / fromRate) * rate);
  const out = new Float32Array(n);
  const w = fromRate / rate;
  for (let i = 0; i < n; i++) {
    const s = Math.floor(i * w);
    const e = Math.max(s + 1, Math.floor((i + 1) * w));
    let sum = 0;
    for (let j = s; j < e && j < arr.length; j++) sum += arr[j];
    out[i] = sum / (e - s);
  }
  return out;
}

let audioCtx = null;
let playing = null;
function ctx() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) throw new Error("このブラウザでは音を鳴らせません");
  audioCtx ||= new Ctx();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function playSamples(samples, volume = 0.3) {
  const ac = ctx();
  playing?.stop();
  const buf = ac.createBuffer(1, Math.max(1, samples.length), ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < samples.length; i++) data[i] = samples[i] * volume;
  const src = ac.createBufferSource();
  src.buffer = buf;
  src.connect(ac.destination);
  src.start();
  playing = src;
  src.onended = () => playing === src && (playing = null);
}
// デジタル化した音を作って鳴らす（rate=null のときは、もとの音）
function digitizeAndPlay(sound, rate, bits) {
  const ac = ctx();
  if (!rate) return playSamples(normalize(sampleAt(sound, ac.sampleRate)));
  const sampled = normalize(sampleAt(sound, rate));
  playSamples(resample(quantizeAll(sampled, bits), rate, ac.sampleRate));
}

let mic = null;
function stopMic() {
  if (!mic) return;
  mic.proc.disconnect();
  mic.source.disconnect();
  mic.stream.getTracks().forEach((t) => t.stop());
  clearTimeout(mic.timer);
  clearInterval(mic.tick);
  mic = null;
}

const { h, explainCard, flushReflections, furikaeriOn, REFLECT_ATTR } = __m_js_ui_js;
const { CATALOG, moduleProgress } = __m_js_catalog_js;
const { renderRecords } = __m_js_records_js;
// アプリ本体: 章ナビ、ルーティング、進捗表示、文字の大きさの切りかえ




const view = document.getElementById("view");
const nav = document.getElementById("chapter-nav");
const overall = document.getElementById("overall-progress");
const toggles = document.getElementById("display-toggles");
const PREF_KEY = "digilab.largeText";

function parseHash() {
  const [id = "home", step = null] = location.hash.replace(/^#\/?/, "").split("/");
  return { id: id || "home", step };
}

function renderNav(currentId) {
  const ol = h("ol");
  const link = (href, num, title, id, done) =>
    h(
      "li",
      { class: done ? "done" : "" },
      h("a", { href, "aria-current": currentId === id ? "page" : null }, h("span", { class: "num", "aria-hidden": "true" }, done ? "✓" : num), h("span", {}, title, done ? h("span", { class: "visually-hidden" }, "（完了）") : null)),
    );
  ol.append(link("#/", "⌂", "はじめに", "home", false));
  ol.append(h("li", { class: "nav-group", "aria-hidden": "true" }, "体験する"));
  for (const c of CATALOG) ol.append(link(`#/${c.id}`, c.num, c.title, c.id, moduleProgress(c).complete));
  ol.append(h("li", { class: "nav-group", "aria-hidden": "true" }, "記録する"));
  ol.append(link("#/records", "✎", recordsTitle(), "records", false));
  nav.replaceChildren(h("nav", { "aria-label": "章ナビゲーション" }, ol));
}

// 「ふりかえり・記録」のページの名前（振り返りを隠す設定のときは「記録」）
const recordsTitle = () => (furikaeriOn() ? "ふりかえり・記録" : "記録");

function renderOverall() {
  const all = CATALOG.map(moduleProgress);
  const done = all.reduce((a, p) => a + p.done, 0);
  const total = all.reduce((a, p) => a + p.total, 0);
  const pct = total ? Math.round((done / total) * 100) : 0;
  overall.replaceChildren(
    h("span", {}, "進み具合"),
    h("div", { class: "bar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": pct, "aria-label": "全体の進み具合" }, h("span", { style: `width:${pct}%` })),
    h("span", {}, `${pct}%`),
  );
}

function largeText() {
  try {
    return localStorage.getItem(PREF_KEY) === "1";
  } catch {
    return false;
  }
}
function renderToggles() {
  const on = largeText();
  document.documentElement.classList.toggle("large-text", on);
  // 文字の大きさ: 4分野共通の「文字 中/大」ボタン(shared/eduit-frame.css の .ef-size)
  const b = h("button", { type: "button", class: "ef-btn ef-size", "data-kz-label": "大きな文字", "aria-label": "文字の大きさ(大きな文字)", "aria-pressed": on ? "true" : "false" }, "文字 ", h("span", { class: "ef-size-v" }));
  b.addEventListener("click", () => {
    try {
      localStorage.setItem(PREF_KEY, on ? "0" : "1");
    } catch {}
    renderToggles();
  });
  toggles.replaceChildren(b);
}

// アナログ→デジタルの3つの手順（標本化・量子化・符号化）の図
function pipeline() {
  return h(
    "ol",
    { class: "pipeline", "aria-label": "デジタル化の3つの手順" },
    h("li", {}, h("strong", {}, "標本化"), h("span", {}, "一定の間かくで区切って、値を取り出す"), h("span", { class: "hint" }, "画像なら画素に分ける・音なら時間で区切る")),
    h("li", {}, h("strong", {}, "量子化"), h("span", {}, "取り出した値を、決まった段階の数にあてはめる"), h("span", { class: "hint" }, "画像なら色の段階・音なら波の高さの段階")),
    h("li", {}, h("strong", {}, "符号化"), h("span", {}, "段階の番号を、0と1の並び（2進数）にする"), h("span", { class: "hint" }, "例: 番号5 → 101")),
  );
}

function renderHome() {
  const cards = CATALOG.map((c) => {
    const p = moduleProgress(c);
    return h(
      "a",
      { class: "module-card", href: `#/${c.id}` },
      h("span", { class: "mc-num" }, `${c.label}・目安 ${c.module.minutes}`),
      h("span", { class: "mc-title" }, c.title),
      h("span", { class: "mc-desc" }, c.desc),
      h("div", { class: "bar", "aria-hidden": "true" }, h("span", { style: `width:${(p.done / p.total) * 100}%` })),
      h("span", { class: "hint" }, p.complete ? "✓ 完了" : `${p.done} / ${p.total} ステップ`),
    );
  });
  view.replaceChildren(
    h("div", { class: "module-head" }, h("h1", {}, "デジタル化ラボ"), h("p", { class: "meta" }, "コンピュータは、画像も音も文字も「0と1」にして扱います。どうやって0と1にするのか、そのときデータの量（情報量）がどう変わるのかを、手を動かして確かめよう。"), h("p", { class: "hint author" }, "作成：技術 岡田")),
    h(
      "section",
      { class: "card" },
      h("h2", {}, "デジタル化の3つの手順"),
      h("p", {}, "連続して変わる量（アナログ）を、とびとびの数（デジタル）にするには、次の3つの手順をふみます。どのモジュールでも、この手順が出てきます。"),
      pipeline(),
      explainCard("安心して体験できます", "このラボはすべてこのブラウザの中だけで動き、インターネットには一切つながりません。自分の写真を読み込んだり、マイクで声を録音したりしても、保存も送信もしません。"),
    ),
    h(
      "section",
      { class: "card" },
      h("h2", {}, "すすめ方"),
      h("ol", {}, h("li", {}, "①〜③のモジュールを順に体験する", h("span", REFLECT_ATTR, "。それぞれのふりかえりを書く")), h("li", {}, "④の計算ドリルで、データ量の計算を練習する"), h("li", {}, "⑤の圧縮のしくみは発展。先生に言われたときや、早く終わったときに取り組む"), h("li", {}, h("a", { href: "#/records" }, recordsTitle()), "からファイルを書き出して提出する")),
      h(
        "div",
        { class: "lesson-plan" },
        h("h3", {}, "2時間で行うときの例"),
        h(
          "ul",
          {},
          h("li", {}, h("strong", {}, "1時間目"), "「はじめに・① 画像・② 音」"),
          h("li", {}, h("strong", {}, "2時間目"), `「③ 2進数・④ ドリル・${recordsTitle()}」`),
          h("li", {}, h("strong", {}, "⑤ 圧縮（発展）"), "は、早く終わった人や、次の時間に使う"),
        ),
        h("p", { class: "hint", ...REFLECT_ATTR }, "時間の終わりには、ふりかえりを書いてから次へ進もう。"),
      ),
    ),
    h("section", { class: "module-group" }, h("h2", {}, "モジュール"), h("div", { class: "module-grid" }, cards)),
    h("div", { class: "btn-row start-row" }, h("a", { class: "btn", href: `#/${CATALOG[0].id}` }, `${CATALOG[0].label} ${CATALOG[0].title}からはじめよう →`)),
  );
}

async function renderModule(entry, stepId) {
  const m = entry.module;
  const root = h("div");
  view.replaceChildren(h("div", { class: "module-head" }, h("p", { class: "meta" }, `モジュール${entry.label}・目安 ${m.minutes}`), h("h1", {}, entry.title), h("p", {}, m.lead)), root);
  const idx = CATALOG.indexOf(entry);
  const prev = CATALOG[idx - 1];
  const next = CATALOG[idx + 1];
  const navRow = h(
    "div",
    { class: "btn-row" },
    prev ? h("a", { class: "btn secondary", href: `#/${prev.id}` }, "← 前のモジュール") : null,
    next ? h("a", { class: "btn", href: `#/${next.id}` }, `次へ：${next.title} →`) : h("a", { class: "btn", href: "#/records" }, `${recordsTitle()}へ →`),
  );
  await m.render(root);
  view.append(navRow);
  if (stepId) document.getElementById(`step-${entry.id}-${stepId}`)?.scrollIntoView({ block: "start" });
}

let current = null;
async function route() {
  const { id, step } = parseHash();
  const entry = CATALOG.find((c) => c.id === id);
  flushReflections(); // 書きかけのふりかえりを、ページを移る前に保存する
  current?.module?.leave?.(); // 前のモジュールの後片付け（マイクを止めるなど）
  current = entry || null;
  renderNav(id);
  renderOverall();
  window.scrollTo(0, 0);
  if (entry) await renderModule(entry, step);
  else if (id === "records") renderRecords(view, CATALOG);
  else renderHome();
  document.title = `${entry ? entry.title : id === "records" ? recordsTitle() : "はじめに"} | デジタル化ラボ`;
  if (!step) view.focus({ preventScroll: true });
}

store.subscribe(() => {
  renderNav(parseHash().id);
  renderOverall();
});
window.addEventListener("hashchange", route);
renderToggles();
route();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

return {  };
})();
</script>
</body>
</html>
