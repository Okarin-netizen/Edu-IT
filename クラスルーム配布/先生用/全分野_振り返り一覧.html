<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>振り返り一覧(先生用)</title>
<style>
/* Edu-IT 共通の見た目(4分野・全アプリ共通)
 * 見た目は案1「教科書の目次」: 白地・黒の細い線・角なし・影なし・絵文字なし。色は分野の色を、記号・開いているタブの下線・ON の下線にだけ使う。
 *
 * このファイルは3つの層の、上の2つ。
 *   ① 設定(トークン) … 色・文字・余白・線・はばの「値」はここにだけ書く。教材の CSS は var(--ef-…) で使う
 *   ② 共通の部品     … ボタン・箱・注意の箱・ラベル・入力欄・表・タブ など。教材はクラス名を付けるだけ
 *   ③ 教材だけの見た目 … 各教材の CSS。図・盤面・シミュレーションの絵だけ。図の色は教材の CSS の上で --fig-… の名前を付ける
 * 部品の見本は shared/ef-mihon.html。決まりに合っているかは python3 shared/style-check.py で調べる。
 *
 * 目次
 *   1. 設定(トークン)と分野の色
 *   2. 文字と中身の基本(.ef-main の中の見出し・文・入力欄)
 *   3. 部品(ボタン・箱・注意・ラベル・えらぶボタン・クイズの答え・表・結果の数字・進み具合・小さな切りかえ)
 *   4. 上のバー・メニュー・アプリのタブ・フッター・ダイアログ
 *   5. 自習ガイド・まず考えよう・振り返りを隠す設定
 *   6. はばに合わせた形(せまい画面・スマホ)と印刷
 */


/* ======================================================================
 * 1. 設定(トークン)と分野の色
 *    色をあとで変えたいときは、ここの1行を変えれば全分野が変わる。
 * ====================================================================== */
:root {
  color-scheme: light;        /* 端末がダークモードでも、明るい画面で出す */

  /* 地・面・線・文字 */
  --ef-bg: #ffffff;           /* 画面の地 */
  --ef-surface: #ffffff;      /* 箱・カード・上のバー */
  --ef-surface-2: #f7f7f5;    /* 一段下げた面(押したとき・表の見出し) */
  --ef-line: #c8c8c8;         /* 細い区切りの線・箱の枠 */
  --ef-ink: #222222;          /* 黒の線(上のバーの下・見出しの下・ボタンの枠)と、黒でぬるボタン */
  --ef-ink-hover: #444444;    /* 黒でぬるボタンにマウスをのせたとき */
  --ef-on-ink: #ffffff;       /* 黒・分野の色でぬった上の字 */
  --ef-text: #222222;         /* ふだんの字 */
  --ef-muted: #565d68;        /* 説明の字 */
  --ef-focus: #f08c00;        /* キーボード操作の枠 */
  --ef-backdrop: rgba(0, 0, 0, .4);  /* ダイアログのうしろ */

  /* 分野の色(既定は D。下の data-ef-domain で切りかわる) */
  --ef-accent: #1a5fc8;
  --ef-accent-ink: #ffffff;
  --ef-accent-soft: #e6eefb;
  /* 発展の印(むらさき) */
  --ef-advanced: #5b3fa8;
  --ef-advanced-soft: #efeaf8;

  /* 状態の色(正解・まちがい・注意・お知らせ)。-soft はうすい地 */
  --ef-ok: #1f7a3a;   --ef-ok-soft: #e3f3e7;
  --ef-ng: #b3261e;   --ef-ng-soft: #fbe5e3;
  --ef-warn: #8a5a00; --ef-warn-soft: #fff4d6;
  --ef-info: #1a5fc8; --ef-info-soft: #eaf1fc;

  /* グラフの線の色(分野をまたいで同じ順に使う) */
  --ef-series-1: #1a5fc8;
  --ef-series-2: #b45309;
  --ef-series-3: #1f7a3a;
  --ef-series-4: #b3261e;
  --ef-series-5: #5b3fa8;

  /* 文字。--ef-fs は「文字 中」のボタンで変わる(EduitFrame.prefs)。見出しなどは em で --ef-fs からの倍にする */
  --ef-font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --ef-mono: "BIZ UDGothic", ui-monospace, "SFMono-Regular", Consolas, monospace;  /* プログラム・数字をそろえる所 */
  --ef-fs: 17px;
  --ef-fs-h1: 1.6em;
  --ef-fs-h2: 1.3em;
  --ef-fs-h3: 1.1em;
  --ef-fs-s: .88em;           /* 小さい字(説明・ラベル) */
  --ef-lh: 1.75;              /* 行の間 */
  --ef-lh-tight: 1.4;         /* 見出し・ボタンの行の間 */

  /* 余白(4・8・12・16・24・32px) */
  --ef-sp-1: 4px;
  --ef-sp-2: 8px;
  --ef-sp-3: 12px;
  --ef-sp-4: 16px;
  --ef-sp-5: 24px;
  --ef-sp-6: 32px;

  /* 線の太さ・角・影 */
  --ef-bw: 1px;               /* ふつうの線 */
  --ef-bw-strong: 2px;        /* 見出しの下・章の区切り */
  --ef-mark: 4px;             /* 開いているタブ・ON のボタンの下線、注意の箱の左の線 */
  --ef-radius: 0;
  --ef-radius-s: 0;
  --ef-shadow: none;

  /* 大きさ・はば */
  --ef-header-h: 52px;
  --ef-tap: 44px;             /* ボタン・入力欄の高さ(指で押しやすい大きさ) */
  --ef-tap-s: 36px;           /* 小さいボタン(.ef-btn.is-s) */
  --ef-tap-bar: 40px;         /* メニューの上のバーのボタン */
  --ef-read-w: 1040px;        /* 読む画面の中身のはば(.ef-main)。作業の画面(.ef-main.is-wide)は画面いっぱい */
}
:root[data-ef-domain="A"] { --ef-accent: #985a26; --ef-accent-soft: #f5e9dc; }  /* 材料と加工: 木の茶 */
:root[data-ef-domain="B"] { --ef-accent: #2e7d32; --ef-accent-soft: #e4f2e5; }  /* 生物育成: 緑 */
:root[data-ef-domain="C"] { --ef-accent: #b45309; --ef-accent-soft: #fbeedd; }  /* エネルギー変換: だいだい */
:root[data-ef-domain="D"] { --ef-accent: #1a5fc8; --ef-accent-soft: #e6eefb; }  /* 情報: 青 */
:root[data-ef-domain="G"] { --ef-accent: #0f766e; --ef-accent-soft: #e0f2ef; }  /* 技術分野のガイダンス(4分野の前): 青緑 */
:root[data-ef-domain="T"] { --ef-accent: #475569; --ef-accent-soft: #eef1f5; }  /* 教科書の順に進む学習コース(T-textbook/): 灰青 */
:root[data-ef-domain="M"] { --ef-accent: #9d174d; --ef-accent-soft: #fbe7ef; }  /* M 身の回りの技術さがし(各編のはじめ): 赤紫 */
:root[data-ef-domain="F"] { --ef-accent: #4338ca; --ef-accent-soft: #e8e8fb; }  /* F これからの技術ラボ(各編の最後): あい色 */
:root[data-ef-domain="Z"] { --ef-accent: #7c4a03; --ef-accent-soft: #f6ecdc; }  /* Z 学習を終えて(3年間のまとめ): こげ茶 */
/* くっきり(EduitFrame.prefs の kukkiri): 字と線を濃くする */
:root[data-ef-kukkiri="on"] { --ef-text: #000000; --ef-muted: #222222; --ef-line: #555555; --ef-surface-2: #ffffff; }


/* ======================================================================
 * 2. 文字と中身の基本
 *    教材の中身は <main class="ef-main"> に入れる(読む画面は 1040px まで真ん中、作業の画面は .is-wide で画面いっぱい)。
 *    中の見出し・文・リスト・入力欄は、クラスを付けなくてもこの形になる。
 *    文字の大きさ: EduitFrame.prefs を使うページ(<html data-ef-prefs>)は、<html> の字が --ef-fs になる。
 *    教材の CSS は字の大きさを rem・em で書く(px で書くと「文字 中」のボタンで変わらない)。
 * ====================================================================== */
html[data-ef-prefs] { font-size: var(--ef-fs); }
html[data-ef-prefs][data-ef-ruby="off"] rt { display: none; }  /* ふりがな オフ(EduitFrame.prefs を使うページだけ) */
.ef-page { background: var(--ef-bg); color: var(--ef-text); font-family: var(--ef-font); }
.ef-main {
  box-sizing: border-box; max-width: var(--ef-read-w); margin: 0 auto; padding: var(--ef-sp-5) var(--ef-sp-6) var(--ef-sp-6);
  font-family: var(--ef-font); font-size: 1rem; line-height: var(--ef-lh); color: var(--ef-text);
}
.ef-main.is-wide { max-width: none; padding: var(--ef-sp-3) var(--ef-sp-4) var(--ef-sp-5); }
.ef-main h1, .ef-main h2, .ef-main h3 { margin: 1.4em 0 .5em; line-height: var(--ef-lh-tight); font-weight: 700; color: var(--ef-text); }
.ef-main h1 { font-size: var(--ef-fs-h1); margin-top: .4em; }
.ef-main h2 { font-size: var(--ef-fs-h2); padding-bottom: var(--ef-sp-1); border-bottom: var(--ef-bw-strong) solid var(--ef-ink); }
.ef-main h3 { font-size: var(--ef-fs-h3); }
.ef-main > :first-child { margin-top: 0; }
.ef-main p { margin: .5em 0; }
.ef-main ul, .ef-main ol { margin: .5em 0; padding-left: 1.5em; }
.ef-main li { margin: .2em 0; }
.ef-main small, .ef-small { font-size: var(--ef-fs-s); color: var(--ef-muted); }
.ef-main code, .ef-main kbd { font-family: var(--ef-mono); font-size: .95em; }
/* 入力欄: 灰の細い枠・高さ 44px。押している(フォーカス)ときは分野の色の枠 */
.ef-main :is(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]), select, textarea) {
  box-sizing: border-box; min-height: var(--ef-tap); padding: var(--ef-sp-2) var(--ef-sp-3);
  border: var(--ef-bw) solid var(--ef-ink); border-radius: 0; background: var(--ef-surface); color: var(--ef-text);
  font: inherit; line-height: var(--ef-lh-tight);
}
.ef-main textarea { width: 100%; line-height: var(--ef-lh); }
.ef-main :is(input, select, textarea):focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 1px; }
.ef-main :is(input[type=checkbox], input[type=radio], input[type=range]) { accent-color: var(--ef-accent); }
.ef-main label { line-height: var(--ef-lh-tight); }


/* ======================================================================
 * 3. 部品
 *    名前は ef- で始め、形のちがいは is-〜 で表す。書き方の見本は shared/ef-mihon.html。
 * ====================================================================== */

/* ---- ボタン ----
 * .ef-btn           ふつうのボタン(白地・黒の細い枠・角なし)
 * .ef-btn.is-s      小さいボタン(高さ 36px。.ef-btn-primary.is-s も同じ)
 * .ef-btn.is-on     ON の状態(下に分野の色の線)。aria-pressed="true" でも同じ
 * .ef-btn.is-danger 消す・取り消す(赤の字と枠)
 * .ef-btn-primary   いちばん大事な操作(はじめる・ひらく など。黒でぬる)
 */
.ef-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--ef-tap-bar); padding: 0 14px;
  border: var(--ef-bw) solid var(--ef-ink); border-radius: 0;
  background: var(--ef-surface); color: var(--ef-text);
  font: 600 15px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
  box-sizing: border-box; white-space: nowrap;
}
.ef-btn:hover { background: var(--ef-surface-2); }
/* ON は下に分野の色の太い線(ぬりつぶさない) */
.ef-btn.is-on, .ef-btn[aria-pressed="true"] { box-shadow: inset 0 calc(-1 * var(--ef-mark)) 0 var(--ef-accent); }
.ef-btn:disabled, .ef-btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; background: var(--ef-surface); }
.ef-btn.is-danger { color: var(--ef-ng); border-color: var(--ef-ng); }
.ef-btn.is-danger:hover { background: var(--ef-ng-soft); }
/* 中身の中のボタン(上のバーより大きく、字の大きさに合わせて大きくなる) */
.ef-main .ef-btn, .ef-box .ef-btn { min-height: var(--ef-tap); font-size: .94rem; }
.ef-btn.is-s, .ef-btn-primary.is-s, .ef-main .ef-btn.is-s, .ef-main .ef-btn-primary.is-s { min-height: var(--ef-tap-s); padding: 0 10px; font-size: var(--ef-fs-s); }
.ef-back { color: var(--ef-text); border-color: transparent; background: none; }
.ef-back:hover { background: none; text-decoration: underline; }
/* 上のバーの表示の道具(4分野で同じ形)。ふりがな・くっきりは .ef-toggle(ON で ✓)、文字の大きさは .ef-size(EduitFrame.sizeButton) */
.ef-toggle[aria-pressed="true"]::before { content: "✓"; }
.ef-size .ef-size-v {
  display: inline-block; min-width: 1.4em; padding: 0 .1em;
  color: var(--ef-text); font-weight: 700; text-align: center; text-decoration: underline; text-underline-offset: 3px;
}
/* 「ふつう・大きい」の2段だけのとき: <button class="ef-btn ef-size" aria-pressed="false|true">文字 <span class="ef-size-v"></span></button>
 * (中身が空の .ef-size-v に「中」「大」を出す。ON でもボタンは塗らない) */
.ef-size[aria-pressed="true"] { background: var(--ef-surface); box-shadow: none; color: var(--ef-text); }
.ef-size[aria-pressed]::before { content: none; }
.ef-size[aria-pressed] .ef-size-v:empty::after { content: "中"; }
.ef-size[aria-pressed="true"] .ef-size-v:empty::after { content: "大"; }
/* タブの帯をスクロールで隠す(data-ef-autohide。隠すのは eduit-frame.js) */
[data-ef-autohide] { transition: transform .2s ease; }
[data-ef-autohide].ef-ah-hide { transform: translateY(var(--ef-ah-y, -110%)); }
@media (prefers-reduced-motion: reduce) { [data-ef-autohide] { transition: none; } }
.ef-btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--ef-tap); padding: 0 20px;
  border: var(--ef-bw) solid var(--ef-ink); border-radius: 0;
  background: var(--ef-ink); color: var(--ef-on-ink);
  font: 700 16px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
}
.ef-btn-primary:hover { background: var(--ef-ink-hover); }
.ef-btn-primary:disabled { opacity: .45; cursor: not-allowed; background: var(--ef-ink); }
.ef-main .ef-btn-primary, .ef-box .ef-btn-primary { font-size: 1rem; }
.ef-btn:focus-visible, .ef-btn-primary:focus-visible, .ef-about-link:focus-visible, .ef-dialog :focus-visible {
  outline: 3px solid var(--ef-focus); outline-offset: 2px;
}
/* ボタンをならべる行 */
.ef-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ef-sp-2); margin: var(--ef-sp-3) 0; }

/* ---- 箱 ----
 * <section class="ef-box"> <h3 class="ef-box-h">見出し</h3> … </section>
 * 白地・灰の細い線・影なし。.is-soft は一段下げた面(灰の地)、.is-accent は左に分野の色の線
 */
.ef-box {
  box-sizing: border-box; margin: var(--ef-sp-4) 0; padding: var(--ef-sp-4);
  background: var(--ef-surface); border: var(--ef-bw) solid var(--ef-line); border-radius: 0; box-shadow: none;
}
.ef-box.is-soft { background: var(--ef-surface-2); }
.ef-box.is-accent { border-left: var(--ef-mark) solid var(--ef-accent); }
.ef-box > :first-child { margin-top: 0; }
.ef-box > :last-child { margin-bottom: 0; }
.ef-box-h, .ef-main .ef-box-h {
  margin: 0 0 var(--ef-sp-2); padding: 0; border: 0;
  font-size: var(--ef-fs-h3); font-weight: 700; line-height: var(--ef-lh-tight); color: var(--ef-text);
}

/* ---- 注意・お知らせの箱 ----
 * <div class="ef-note is-warn">…</div>  左に 4px の線と、うすい地。
 * .is-warn 注意(黄)・.is-info お知らせ(青)・.is-ok よい(緑)・.is-ng 危ない(赤)。なしは分野の色の線と白地
 */
.ef-note {
  box-sizing: border-box; margin: var(--ef-sp-3) 0; padding: var(--ef-sp-2) var(--ef-sp-3);
  border: 0; border-left: var(--ef-mark) solid var(--ef-accent); border-radius: 0; background: var(--ef-surface);
  line-height: var(--ef-lh); color: var(--ef-text);
}
.ef-note > :first-child { margin-top: 0; }
.ef-note > :last-child { margin-bottom: 0; }
.ef-note.is-warn { border-left-color: var(--ef-warn); background: var(--ef-warn-soft); }
.ef-note.is-info { border-left-color: var(--ef-info); background: var(--ef-info-soft); }
.ef-note.is-ok { border-left-color: var(--ef-ok); background: var(--ef-ok-soft); }
.ef-note.is-ng { border-left-color: var(--ef-ng); background: var(--ef-ng-soft); }
.ef-note-k { display: block; font-weight: 700; }  /* 「注意」「ポイント」などの見出しの字 */
.ef-note.is-warn .ef-note-k { color: var(--ef-warn); }
.ef-note.is-info .ef-note-k { color: var(--ef-info); }
.ef-note.is-ok .ef-note-k { color: var(--ef-ok); }
.ef-note.is-ng .ef-note-k { color: var(--ef-ng); }

/* ---- 小さなラベル ----
 * <span class="ef-tag">切断</span>  白地に細い枠。.is-advanced 発展(むらさき)・.is-accent 分野の色・.is-ok / .is-ng / .is-warn
 */
.ef-tag {
  display: inline-flex; align-items: center; gap: .3em; padding: 0 .5em; vertical-align: .08em;
  border: var(--ef-bw) solid var(--ef-line); border-radius: 0; background: var(--ef-surface); color: var(--ef-text);
  font-size: var(--ef-fs-s); font-weight: 700; line-height: 1.6; white-space: nowrap;
}
.ef-tag.is-accent { border-color: var(--ef-accent); color: var(--ef-accent); }
.ef-tag.is-advanced { border-color: var(--ef-advanced); color: var(--ef-advanced); }
.ef-tag.is-ok { border-color: var(--ef-ok); color: var(--ef-ok); }
.ef-tag.is-ng { border-color: var(--ef-ng); color: var(--ef-ng); }
.ef-tag.is-warn { border-color: var(--ef-warn); color: var(--ef-warn); }

/* ---- 1つえらぶボタンの組 ----
 * <div class="ef-seg" role="group"> <button aria-pressed="true">回転</button> <button aria-pressed="false">往復</button> … </div>
 * えらんだもの(aria-pressed="true" か .is-on)は太字と分野の色の下線
 */
.ef-seg { display: inline-flex; flex-wrap: wrap; gap: 0; border: var(--ef-bw) solid var(--ef-ink); background: var(--ef-surface); }
.ef-seg > button {
  min-height: var(--ef-tap); padding: 0 14px; margin: 0; cursor: pointer;
  border: 0; border-right: var(--ef-bw) solid var(--ef-line); border-radius: 0; background: none; color: var(--ef-text);
  font: inherit; font-size: .94rem; line-height: var(--ef-lh-tight); white-space: nowrap;
}
.ef-seg > button:last-child { border-right: 0; }
.ef-seg > button:hover { background: var(--ef-surface-2); }
.ef-seg > button[aria-pressed="true"], .ef-seg > button.is-on { font-weight: 700; box-shadow: inset 0 calc(-1 * var(--ef-mark)) 0 var(--ef-accent); }
.ef-seg > button:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: -3px; }

/* ---- クイズの答え ----
 * <div class="ef-choices"> <button class="ef-choice">…</button> … </div>
 * 答えたあと、正解は .is-ok(○ と緑)、まちがいは .is-ng(× と赤)。色だけでなく ○ × の字も出す
 */
.ef-choices { display: flex; flex-direction: column; gap: var(--ef-sp-2); margin: var(--ef-sp-2) 0; }
.ef-choice {
  display: block; width: 100%; min-height: var(--ef-tap); padding: var(--ef-sp-2) var(--ef-sp-3); cursor: pointer; text-align: left;
  border: var(--ef-bw) solid var(--ef-line); border-radius: 0; background: var(--ef-surface); color: var(--ef-text);
  font: inherit; line-height: var(--ef-lh-tight);
}
.ef-choice:hover { border-color: var(--ef-ink); }
.ef-choice:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 1px; }
.ef-choice.is-ok { border-color: var(--ef-ok); background: var(--ef-ok-soft); font-weight: 700; }
.ef-choice.is-ok::before { content: "○ "; color: var(--ef-ok); }
.ef-choice.is-ng { border-color: var(--ef-ng); background: var(--ef-ng-soft); }
.ef-choice.is-ng::before { content: "× "; color: var(--ef-ng); }

/* ---- 表 ----
 * <table class="ef-table"> 見出しの行は灰の地、線は細い灰。はばが足りないときは <div class="ef-scroll"> で包むと、表だけ横にスクロールする
 */
.ef-table { border-collapse: collapse; margin: var(--ef-sp-3) 0; font-size: .94em; line-height: var(--ef-lh-tight); }
.ef-table th, .ef-table td { padding: var(--ef-sp-2) var(--ef-sp-3); border: var(--ef-bw) solid var(--ef-line); text-align: left; vertical-align: top; }
.ef-table th { background: var(--ef-surface-2); font-weight: 700; }
.ef-table .is-num { text-align: right; font-variant-numeric: tabular-nums; }
.ef-scroll { max-width: 100%; overflow-x: auto; }

/* ---- 結果の数字 ----
 * <div class="ef-result"> <span class="ef-result-k">たわみ</span> <span class="ef-result-v">1.05</span> <span class="ef-result-u">mm</span> </div>
 */
.ef-result { display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: .1em .4em; }
.ef-result-k { font-size: var(--ef-fs-s); font-weight: 700; color: var(--ef-muted); }
.ef-result-v { font-size: 1.6em; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--ef-text); }
.ef-result-u { font-size: .94em; color: var(--ef-muted); }
.ef-result.is-ok .ef-result-v { color: var(--ef-ok); }
.ef-result.is-ng .ef-result-v { color: var(--ef-ng); }

/* ---- 進み具合のバー ----
 * <div class="ef-progress"> <span class="ef-progress-t">必修 2/4</span> <span class="ef-progress-bar"><span style="width: 50%"></span></span> </div>
 */
.ef-progress { display: flex; align-items: center; gap: var(--ef-sp-2); font-size: var(--ef-fs-s); font-weight: 700; }
.ef-progress-bar { flex: 1; min-width: 4em; height: 8px; border: var(--ef-bw) solid var(--ef-ink); background: var(--ef-surface); }
.ef-progress-bar > span { display: block; height: 100%; background: var(--ef-accent); }

/* ---- タブの中の小さな切りかえ ----
 * <div class="ef-subtabs" role="tablist"> <button role="tab" aria-selected="true">…</button> … </div>
 * アプリのタブ(.ef-apptabs)と同じ「字＋下線」で、ひとまわり小さい
 */
.ef-subtabs { display: flex; flex-wrap: wrap; gap: 0 var(--ef-sp-4); margin: var(--ef-sp-2) 0 var(--ef-sp-3); border-bottom: var(--ef-bw) solid var(--ef-line); }
.ef-subtabs > button, .ef-subtabs > a {
  min-height: var(--ef-tap-s); padding: 0 var(--ef-sp-1); margin: 0 0 -1px; cursor: pointer;
  border: 0; border-bottom: var(--ef-mark) solid transparent; border-radius: 0; background: none; color: var(--ef-muted);
  font: inherit; font-size: .94em; font-weight: 700; text-decoration: none; white-space: nowrap;
}
.ef-subtabs > :hover { color: var(--ef-text); }
.ef-subtabs > [aria-selected="true"], .ef-subtabs > [aria-current], .ef-subtabs > .is-on { color: var(--ef-text); border-bottom-color: var(--ef-accent); }
.ef-subtabs > :focus-visible { outline: 3px solid var(--ef-focus); outline-offset: -3px; }

/* ---- 記号の印(A1・B2・C3・D4 など。メニューの上のバー・アプリの上のバー・切りかえボタン・カード) ---- */
.ef-code {
  display: inline-flex; align-items: center; justify-content: flex-start; min-width: 1.6em; padding: 0;
  background: none; color: var(--ef-accent);
  font: 700 1em/1.5 var(--ef-font); letter-spacing: .02em; white-space: nowrap; vertical-align: .05em;
}
.ef-btn .ef-code { font-size: 13px; min-width: 0; margin-right: 2px; }


/* ======================================================================
 * 4. 上のバー・メニュー・アプリのタブ・フッター・ダイアログ
 *    上のバー(ヘッダー)の字とボタンは、文字の大きさのボタンで変えない(px のまま)。
 * ====================================================================== */

/* ---- ヘッダー ----
 * メニュー:   <header class="ef-header"> <h1 class="ef-title"><span class="ef-code">A</span> 材料と加工の技術 教材集</h1>
 *               <div class="ef-tools"> ふりがな / 文字 中 / 使い方 / 先生用 </div> </header>   (4分野でこの4つだけ・字だけ)
 * アプリ:     下の .ef-appbar
 */
.ef-header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  min-height: var(--ef-header-h); padding: 6px 14px;
  background: var(--ef-surface); color: var(--ef-text);
  border-bottom: var(--ef-bw) solid var(--ef-ink);
  font-family: var(--ef-font);
  box-sizing: border-box;
}
.ef-title {
  display: flex; align-items: center; gap: 8px;
  margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--ef-text);
}
.ef-title .ef-icon { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; font-size: 22px; }
.ef-title .ef-sub { font-size: 13px; font-weight: 400; color: var(--ef-muted); }
.ef-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.ef-title .ef-code { font-size: 22px; min-width: 0; margin-right: 4px; }

/* ---- メニューのカード ----
 * <article class="ef-card"> <p class="ef-card-tag">A1</p> <h3 class="ef-card-title">…</h3> <p>…</p> <a class="ef-btn-primary">ひらく ▶</a> </article>
 * メニューのカードは EduitFrame.card() で作る(下の .ef-mcard)。
 */
.ef-card {
  background: var(--ef-surface); border: 0; border-top: var(--ef-bw-strong) solid var(--ef-ink); padding: 14px 4px;
}
.ef-card-tag { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ef-accent); }
.ef-card-title { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: var(--ef-text); }

/* EduitFrame.card が作るメニューのカード(4分野同じ形)
 * 教科書の目次のように1行ずつ: 左に記号、まん中に名前と説明、右に「ひらく ▶」。行の上下は細い線 */
.ef-mcard {
  display: grid; grid-template-columns: 4.2em minmax(0, 1fr) auto; column-gap: 16px; row-gap: 2px; align-items: baseline;
  padding: 14px 4px; border: 0; border-bottom: var(--ef-bw) solid var(--ef-line); border-radius: 0; box-shadow: none;
  cursor: pointer; font-family: var(--ef-font); color: var(--ef-text);
}
.ef-mcard:hover { background: var(--ef-surface-2); }
.ef-mcard-hd, .ef-mcard-ht { display: contents; }
.ef-mcard-ic { display: none; }
.ef-mcard > *, .ef-mcard-ht > * { grid-column: 2; }
.ef-mcard .ef-card-tag { grid-column: 1; grid-row: 1 / span 3; margin: 0; font-size: 1.35em; line-height: 1.2; }
.ef-mcard .ef-card-tag .ef-code { font-size: 1em; }
.ef-mcard .ef-card-title { margin: 0; font-size: 1.12em; line-height: 1.4; }
.ef-mcard-desc { margin: 0; font-size: .95em; line-height: 1.6; color: var(--ef-muted); }
.ef-mcard-extra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .88em; color: var(--ef-muted); }
.ef-mcard-go {
  grid-column: 3; grid-row: 1; align-self: baseline; min-height: 0; padding: 0; border: 0; background: none;
  color: var(--ef-accent); font-size: 15px; white-space: nowrap;
}
.ef-mcard-go:hover { background: none; text-decoration: underline; }
.ef-level-order { margin: -4px 0 12px; font-size: .95em; line-height: 1.6; }

/* ---- フッター(作成者・このアプリについて) ---- */
.ef-footer {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 14px;
  margin: 24px 0 0; padding: 12px 16px;
  border-top: var(--ef-bw) solid var(--ef-line); background: var(--ef-surface-2);
  font: 13px/1.6 var(--ef-font); color: var(--ef-muted);
}
.ef-footer .ef-author { font-weight: 700; color: var(--ef-text); }
.ef-about-link {
  border: 0; background: none; padding: 2px 4px; cursor: pointer;
  font: inherit; color: var(--ef-accent); text-decoration: underline;
}
/* ヘッダーなどに置く小さい「このアプリについて」ボタン */
.ef-about-btn { font-size: 14px; }

/* ---- このアプリについて(ダイアログ) ---- */
.ef-dialog {
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  padding: 0; border: var(--ef-bw) solid var(--ef-ink); border-radius: var(--ef-radius);
  background: var(--ef-surface); color: var(--ef-text); font: 15px/1.7 var(--ef-font);
  box-shadow: none;
}
.ef-dialog::backdrop { background: var(--ef-backdrop); }
.ef-dialog-in { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.ef-dialog-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: var(--ef-bw) solid var(--ef-ink); }
.ef-dialog-head h2 { margin: 0; font-size: 18px; flex: 1; }
.ef-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px 0; }
.ef-tab { border: 0; border-bottom: 3px solid transparent; background: none;
  padding: 6px 10px; font: 600 14px/1.3 var(--ef-font); color: var(--ef-muted); cursor: pointer; min-height: 36px; }
.ef-tab[aria-selected="true"] { color: var(--ef-text); border-bottom-color: var(--ef-accent); }
.ef-panel { padding: 14px 18px 18px; overflow: auto; border-top: var(--ef-bw) solid var(--ef-line); }
.ef-panel h3 { margin: 12px 0 4px; font-size: 16px; }
.ef-panel ul { margin: 4px 0 8px; padding-left: 1.3em; }
.ef-panel p { margin: 4px 0 8px; }
.ef-howto .ef-panel { border-top: 0; }
.ef-howto .ef-panel ol { margin: 4px 0 8px; padding-left: 1.5em; }
.ef-howto .ef-panel li { margin: 2px 0; }
.ef-hist-ver { font-weight: 700; color: var(--ef-accent); }
.ef-hist-date { color: var(--ef-muted); font-size: 13px; margin-left: 6px; }

/* ---- 基本編・発展編のタブ(メニュー。EduitFrame.levels が作る) ---- */
.ef-levels { margin: 0 0 18px; font-family: var(--ef-font); }
.ef-level-tabs { display: flex; gap: 24px; border-bottom: var(--ef-bw) solid var(--ef-line); }
.ef-level-tab {
  display: inline-flex; align-items: baseline; gap: 4px; min-height: 48px; padding: 8px 0; margin: 0 0 -1px;
  font: inherit; font-size: 1.15em; font-weight: 700 !important; color: var(--ef-muted) !important; cursor: pointer;
  background: none !important; border: 0 !important; border-bottom: 3px solid transparent !important; border-radius: 0 !important;
}
.ef-level-tab:hover { color: var(--ef-text) !important; }
/* 教材ごとのボタンの色指定(#hub button など)に負けないように !important にする */
.ef-level-tab[aria-selected="true"], .ef-level-tab[aria-selected="true"]:hover { color: var(--ef-text) !important; border-bottom-color: var(--ef-accent) !important; }
.ef-level-tab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }
.ef-level-count { font-size: .85em; font-weight: 700; }
.ef-level-count::before { content: "("; }
.ef-level-count::after { content: ")"; }
.ef-level-panel { padding: 12px 0 0; }
.ef-level-panel:focus { outline: none; }
.ef-level-lead { margin: 0 0 12px; color: var(--ef-muted); line-height: 1.6; }
.ef-level-advanced[aria-selected="true"], .ef-level-advanced[aria-selected="true"]:hover { border-bottom-color: var(--ef-advanced) !important; }
.ef-level-parts { margin: .3em 0 0; font-size: .9em; line-height: 1.5; color: var(--ef-text); }
.ef-level-parts summary { cursor: pointer; color: var(--ef-muted); }
.ef-level-parts p { margin: .2em 0 0; }
.ef-mcard-tb { margin: .3em 0 0; font-size: .85em; line-height: 1.5; color: var(--ef-muted); }
.ef-level-group { display: flex; align-items: baseline; gap: .7em; margin: 24px 0 0; padding: 0 0 6px; border-bottom: var(--ef-bw-strong) solid var(--ef-ink); font-size: 1.1em; color: var(--ef-text); }
.ef-level-group:first-of-type { margin-top: 4px; }
.ef-level-group-ch { font-size: .8em; font-weight: 700; color: var(--ef-accent); }
/* 区切りのはじめ・おわりの M・F へのリンクの行(EDUIT_INFO.textbook.links) */
.ef-level-link { margin: 6px 0 12px; line-height: 1.6; }
.ef-level-link a { display: inline-flex; align-items: center; gap: 8px; padding: 4px 0; color: var(--ef-text); text-decoration: none; font-weight: 600; }
.ef-level-link a:hover, .ef-level-link a:focus-visible { text-decoration: underline; }
.ef-level-link-go { color: var(--ef-accent); font-weight: 700; }
.ef-level-matome { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 14px; border: var(--ef-bw) solid var(--ef-ink); border-radius: 0; background: var(--ef-surface); color: var(--ef-text); font: inherit; cursor: pointer; text-align: left; }
.ef-level-matome:hover, .ef-level-matome:focus-visible { background: var(--ef-surface-2); }
.ef-level-matome-t { font-weight: 700; }
.ef-level-matome-d { color: var(--ef-muted); font-size: .92em; }
.ef-matome-score { font-weight: 700; }
.ef-matome-h { display: flex; align-items: center; gap: 6px; margin: 16px 0 4px; font-size: 1.05em; }
.ef-level-parts-k {
  display: inline-block; margin-right: .6em; padding: 0; font-size: .9em; font-weight: 700; color: var(--ef-text);
}

/* ---- メニューの中身の箱と、カードの並べ方(4分野共通) ----
 * メニューの中身(タブ・カード)を入れる箱は .ef-menu(はば 1040px まで・真ん中)。カードは EduitFrame.levels({ gridClass: 'ef-mgrid' }) で1列にならべる。 */
.ef-menu { max-width: var(--ef-read-w); margin: 0 auto; padding: 6px 32px 0; box-sizing: border-box; }
.ef-mgrid { display: flex; flex-direction: column; padding: 0 0 24px; }
.ef-mgrid > .ef-mcard { touch-action: manipulation; }
.ef-mgrid { border-top: var(--ef-bw) solid var(--ef-line); }
.ef-level-group + .ef-mgrid { border-top: 0; }
.ef-mgrid .ef-mcard-desc { line-height: 1.5; }

/* ---- アプリを開いたときの上のバー・教材の切りかえ・タブの帯(4分野共通) ----
 * <header class="ef-header ef-appbar">
 *   <a class="ef-btn ef-back">◀ メニュー</a>
 *   <h1 class="ef-title ef-apptitle">[A2] 木材の繊維・収縮ラボ</h1>   … はばが広いとき(1441px 以上)とスマホだけ出す
 *   <nav class="ef-switch"> <a class="ef-swchip" aria-current="page"><span class="ef-code">A2</span><span class="ef-sw-n">木材</span></a> … </nav>
 *   <div class="ef-tools"> ふりがな / 文字 中 / (くっきり) / (使い方) / <span data-ef-fs></span> 全画面 / <span data-ef-about></span> ⓘ </div>
 * </header>
 * <nav class="ef-apptabs"> <button class="ef-apptab" aria-selected="true">はじめに</button> … <div class="ef-apptabs-tools">使い方 記録</div> </nav>
 *   … アプリの中のタブ(字＋下線)。右はしにそのアプリの道具(使い方・記録など)を置くときは .ef-apptabs-tools に入れる
 * 開いている教材は名前も出し、ほかの教材は記号だけ(はばが 1441px 以上なら名前も)。スマホは1行目に ◀ メニューと名前、2行目に道具と切りかえ。
 */
.ef-appbar { min-height: 52px; padding: 0 6px; gap: 6px; flex-wrap: nowrap; }
.ef-appbar .ef-btn { min-height: 42px; padding: 0 12px; font-size: 15px; white-space: nowrap; flex: none; }
.ef-appbar .ef-tools { flex: none; flex-wrap: nowrap; }
.ef-appbar .ef-apptitle { margin: 0 6px 0 4px; font-size: 17px; white-space: nowrap; flex: none; }
.ef-appbar .ef-apptitle .ef-code { margin-right: 0; }
.ef-switch { display: flex; gap: 4px; flex: 1; min-width: 0; align-self: stretch; align-items: flex-end; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.ef-switch::-webkit-scrollbar { display: none; }
.ef-swchip {
  font: inherit; font-family: var(--ef-font); font-size: 15px; line-height: 1.2; color: var(--ef-muted); text-decoration: none;
  background: transparent; border: 0; border-bottom: var(--ef-mark) solid transparent; border-radius: 0;
  min-height: 44px; padding: 0 10px; margin-bottom: 1px; cursor: pointer; white-space: nowrap; flex: none;
  display: inline-flex; align-items: center; gap: 5px; touch-action: manipulation;
}
.ef-swchip:hover { color: var(--ef-text); border-bottom-color: var(--ef-line); }
.ef-swchip[aria-current="page"], .ef-swchip[aria-current="true"] { color: var(--ef-text); font-weight: 700; border-bottom-color: var(--ef-accent); }
.ef-swchip .ef-code { font-size: 13px; min-width: 0; margin: 0; }
.ef-swchip:focus-visible, .ef-apptab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: -3px; }
.ef-fs-btn[hidden] { display: none; }
.ef-apptabs {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 18px; padding: 0 14px;
  background: var(--ef-surface); border-bottom: var(--ef-bw) solid var(--ef-ink); font-family: var(--ef-font); box-sizing: border-box;
}
.ef-apptab {
  font: inherit; font-family: var(--ef-font); font-size: 15px; font-weight: 700; line-height: 1.3; text-decoration: none;
  flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; box-sizing: border-box;
  border: 0; border-bottom: var(--ef-mark) solid transparent; border-radius: 0; background: none; cursor: pointer; white-space: nowrap; touch-action: manipulation;
  color: var(--ef-muted);
}
.ef-apptab:hover { color: var(--ef-text); border-bottom-color: var(--ef-line); }
.ef-apptab[aria-selected="true"], .ef-apptab[aria-current="page"], .ef-apptab[aria-current="true"], .ef-apptab.is-on {
  color: var(--ef-text); border-bottom-color: var(--ef-accent);
}
.ef-apptab[aria-selected="true"] rt, .ef-apptab[aria-current] rt, .ef-apptab.is-on rt { color: inherit; }
.ef-apptab.is-advanced { color: var(--ef-advanced); }  /* 発展のタブ(字だけむらさき。開いたときの下線は分野の色) */
.ef-apptab.is-done::after { content: " ✓"; }        /* 書き終えたページ */
/* タブの帯の右はしの道具(使い方・記録・音 など) */
.ef-apptabs-tools { display: flex; align-items: center; gap: 6px; margin-left: auto; padding: 4px 0; }


/* ======================================================================
 * 5. 自習ガイド・まず考えよう・振り返りを隠す設定
 * ====================================================================== */

/* 振り返りを隠す設定(EduitFrame.furikaeri)。振り返りのタブ・欄・印には data-ef-reflect を付ける */
html[data-ef-furikaeri="off"] [data-ef-reflect] { display: none !important; }

/* ---- 自習ガイド(自習モードのとき。EduitFrame が作る) ----
 * .ef-jishu-fab  右はしのたてのボタン「自習ガイド 2/5」
 * .ef-jishu      右に開くパネル(スマホは下から出る)。教材を操作しながら読めるように、まわりを暗くしない
 */
.ef-jishu-fab {
  position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 2147483000;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 7px; border: var(--ef-bw) solid var(--ef-ink); border-right: 0; border-radius: 0;
  background: var(--ef-ink); color: var(--ef-on-ink); cursor: pointer;
  font: 700 15px/1.2 var(--ef-font);
}
.ef-jishu-fab-t { display: block; width: 1.05em; line-height: 1.15; word-break: break-all; text-align: center; }  /* 1字ずつ縦にならべる(writing-mode だと字が重なる端末がある) */
.ef-jishu-fab-p { font-size: 12px; font-weight: 700; padding: 1px 0; }
.ef-jishu-fab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }
html.ef-jishu-open .ef-jishu-fab { display: none; }
.ef-jishu {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 2147483001;
  width: min(380px, 100vw); display: flex; flex-direction: column; box-sizing: border-box;
  background: var(--ef-surface); color: var(--ef-text); border-left: var(--ef-bw) solid var(--ef-ink);
  font: 15px/1.65 var(--ef-font); font-size: max(15px, .95rem); text-align: left;
}
.ef-jishu[hidden] { display: none; }
.ef-jishu *, .ef-jishu *::before { box-sizing: border-box; }
.ef-jishu-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: var(--ef-bw) solid var(--ef-ink); }
.ef-jishu rt { display: ruby-text !important; font-size: .55em; font-weight: 400; }  /* 教材のふりがなをオフにしても、ガイドのふりがなはガイドのボタンで決める */
.ef-jishu-head h2 { flex: 1; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 0; font-size: 16px; line-height: 1.35; }
.ef-jishu-k { color: var(--ef-accent); }
.ef-jishu-name { font-weight: 700; }
.ef-jishu-body { flex: 1; overflow-y: auto; padding: 4px 14px 24px; overscroll-behavior: contain; }
.ef-jishu h3 { margin: 14px 0 6px; font-size: 15px; color: var(--ef-accent); }
.ef-jishu p { margin: 0 0 6px; line-height: 1.85; }
.ef-jishu-goal { padding: 2px 0 4px; border-bottom: var(--ef-bw) solid var(--ef-line); }

  // ---- 文字の大きさのボタン(4分野で同じ形:「文字 中」。押すたびに次の大きさへ) ----

  // ---- 表示の設定(文字の大きさ・ふりがな・くっきり。全教材で1つ) ----
  // 覚える場所は localStorage 'eduit.prefs' の1つだけ。どの教材で変えても、ほかの教材(同じページの iframe もほかのタブも)に効く。
  //   fs:      文字の大きさ(px)。FS_STEPS の 15・17・20・24 のどれか → <html> の --ef-fs
  //   ruby:    ふりがな(true / false。はじめは false)→ <html data-ef-ruby="on|off">
  //   kukkiri: くっきり(true / false)→ <html data-ef-kukkiri="on|off">(eduit-frame.css が字と線を濃くする)
  // 使い方:
  //   上のバーのボタンに data-ef-pref="fs" / "ruby" / "kukkiri" を付けるだけで、EduitFrame.mount() がボタンにする。
  //   ボタンのない教材(教材集の iframe の中など)は EduitFrame.prefs.use() を呼ぶ。どちらでも <html data-ef-prefs> になり、<html> の字が --ef-fs になる。
  //   ふりがなを付ける・外すなど、変わったときに教材ですることは EduitFrame.prefs.on(function (key, value) {…}) で受ける。
  var PREFS_KEY = 'eduit.prefs';
  var FS_STEPS = [[15, '小'], [17, '中'], [20, '大'], [24, '特大']];
  var PREF_DEFAULTS = { fs: 17, ruby: false, kukkiri: false };
  var prefListeners = [];
  function prefsLoad() {
    var v = {};
    try { v = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') || {}; } catch (e) {}
    var out = {};
    Object.keys(PREF_DEFAULTS).forEach(function (k) { out[k] = typeof v[k] === typeof PREF_DEFAULTS[k] ? v[k] : PREF_DEFAULTS[k]; });
    return out;
  }
  var prefState = prefsLoad();
  function prefsApply() {
    var h = document.documentElement;
    h.style.setProperty('--ef-fs', prefState.fs + 'px');
    h.setAttribute('data-ef-ruby', prefState.ruby ? 'on' : 'off');
    h.setAttribute('data-ef-kukkiri', prefState.kukkiri ? 'on' : 'off');
  }
  function prefsNotify(changed) {
    changed.forEach(function (k) { prefListeners.forEach(function (fn) { try { fn(k, prefState[k]); } catch (e) {} }); });
    prefsPaintButtons();
  }
  function prefGet(k) { return prefState[k]; }
  function prefSet(k, value) {
    if (!(k in PREF_DEFAULTS) || prefState[k] === value) return;
    prefState[k] = value;
    try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefState)); } catch (e) {}
    prefsApply();
    prefsNotify([k]);
  }
  function prefsUse() { document.documentElement.setAttribute('data-ef-prefs', ''); prefsApply(); }
  // ほかの教材(ほかのタブ・同じページの iframe)で変えたとき
  window.addEventListener('storage', function (e) {
    if (e.key !== PREFS_KEY) return;
    var old = prefState;
    prefState = prefsLoad();
    prefsApply();
    prefsNotify(Object.keys(PREF_DEFAULTS).filter(function (k) { return old[k] !== prefState[k]; }));
  });
  var prefSizeUpdates = [];
  function prefsPaintButtons() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-ef-pref="ruby"], [data-ef-pref="kukkiri"]'), function (b) {
      b.setAttribute('aria-pressed', prefState[b.getAttribute('data-ef-pref')] ? 'true' : 'false');
    });
    prefSizeUpdates.forEach(function (u) { u(); });
  }
  function prefsMount() {
    var btns = document.querySelectorAll('[data-ef-pref]:not([data-ef-pref-done])');
    if (!btns.length) return;
    prefsUse();
    Array.prototype.forEach.call(btns, function (b) {
      var k = b.getAttribute('data-ef-pref');
      b.setAttribute('data-ef-pref-done', '');
      if (k === 'fs') {
        prefSizeUpdates.push(sizeButton(b, { steps: FS_STEPS, get: function () { return prefState.fs; }, set: function (v) { prefSet('fs', v); } }));
      } else if (k === 'ruby' || k === 'kukkiri') {
        b.classList.add('ef-btn', 'ef-toggle');
        b.type = 'button';
        if (!b.textContent.trim()) b.textContent = k === 'ruby' ? 'ふりがな' : 'くっきり';
        b.addEventListener('click', function () { prefSet(k, !prefState[k]); });
      }
    });
    prefsPaintButtons();
  }
  prefsApply();
  var prefs = {
    FS_STEPS: FS_STEPS, get: prefGet, set: prefSet, use: prefsUse, mount: prefsMount,
    on: function (fn) { prefListeners.push(fn); }
  };

  // ---- タブの帯をスクロールで隠す([data-ef-autohide]。下へ読み進めると隠れ、上へ戻すと出る) ----
  function autoHide() {
    var lastY = window.pageYOffset || 0, ticking = false;
    function bars() { return document.querySelectorAll('[data-ef-autohide]'); }
    function show(bar) { bar.classList.remove('ef-ah-hide'); }
    function run() {
      ticking = false;
      var y = window.pageYOffset || 0, dy = y - lastY;
      if (Math.abs(dy) < 6 && y > 0) return;
      lastY = y;
      Array.prototype.forEach.call(bars(), function (bar) {
        if (dy < 0 || y <= 0 || bar.contains(document.activeElement)) { show(bar); return; }
        if (bar.classList.contains('ef-ah-hide')) return;
        var cs = getComputedStyle(bar), top = parseFloat(cs.top) || 0;
        // 上に固定されている(画面の上にはりついている)ときだけ隠す
        if (cs.position !== 'sticky' && cs.position !== 'fixed') return;
        // 横長の帯だけを隠す。PC の左のメニュー(画面のはばの半分より細い)は、いつも見えるように残す
        if (bar.offsetWidth < window.innerWidth / 2) return;
        if (bar.getBoundingClientRect().top > top + 1) return;
        bar.style.setProperty('--ef-ah-y', -(top + bar.offsetHeight + 4) + 'px');
        bar.classList.add('ef-ah-hide');

    }
    window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(run); } }, { passive: true });
    document.addEventListener('focusin', function (e) {
      var bar = e.target.closest && e.target.closest('[data-ef-autohide]');
      if (bar) show(bar);
    });
    // 帯が横にスクロールするとき(スマホ)は、えらんでいるタブが見える位置まで帯を動かす
    function reveal() {
      Array.prototype.forEach.call(bars(), function (bar) {
        var t = bar.querySelector('[role=tab][aria-selected="true"], [aria-current="page"]');
        if (!t) return;
        for (var sc = t.parentElement; sc && sc !== bar.parentElement; sc = sc.parentElement) {
          if (sc.scrollWidth > sc.clientWidth + 1) {
            var r = t.getBoundingClientRect(), b = sc.getBoundingClientRect();
            if (r.left < b.left) sc.scrollLeft -= b.left - r.left + 12;
            else if (r.right > b.right) sc.scrollLeft += r.right - b.right + 12;
            return;
          }
        }
      });
    }
    document.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('[data-ef-autohide]')) setTimeout(reveal, 50);
    });
    window.addEventListener('hashchange', function () { setTimeout(reveal, 50); });
    window.addEventListener('load', function () { setTimeout(reveal, 300); });
  }
  autoHide();

  // ---- 自習ガイド(自習モードのときだけ。アプリの右はしに「自習ガイド」を出す) ----
  function jishuData(c) {
    var J = (window.EDUIT_INFO || info).jishu;
    return c && J && J.apps ? J.apps[c] || null : null;
  }
  function appCode() {
    var a = (window.EDUIT_INFO || info).app || app;
    var m = /^([A-D]\d+|[GMFZ])\s/.exec(a.name || '');
    return m ? m[1] : null;
  }
  function jishuLoad(c) {
    try { var v = JSON.parse(localStorage.getItem(JS_STORE + c) || 'null'); if (v && typeof v === 'object') return { s: v.s || {}, q: v.q || {}, seen: !!v.seen }; } catch (e) {}
    return { s: {}, q: {}, seen: false };
  }
  function jishuSave(c, st) { try { localStorage.setItem(JS_STORE + c, JSON.stringify(st)); } catch (e) {} }
  function jishuSteps(d) {
    // 振り返りを隠す設定のときは、振り返りの手順を出さない。i は steps の中の番号(できたの印はこれで覚える)
    return (d.steps || []).map(function (s, i) { return { s: s, i: i }; }).filter(function (x) { return furikaeri || !x.s.reflect; });
  }
  // 進み具合: 基本の手順のうち「できた」の数、たしかめ問題の正解の数
  function jishuProgress(c) {
    var d = jishuData(c);
    if (!d) return null;
    var st = jishuLoad(c);
    var basic = jishuSteps(d).filter(function (x) { return x.s.level !== 'advanced'; });
    var ok = 0;
    (d.check || []).forEach(function (q, i) { if (st.q[i] === q.answer) ok++; });
    return {
      done: basic.filter(function (x) { return st.s[x.i]; }).length, steps: basic.length,
      ok: ok, checks: (d.check || []).length

  function progressText(p) {
    return '進め方 ' + p.done + '/' + p.steps + (p.checks ? '・たしかめ ' + p.ok + '/' + p.checks : '');
  }

  // 自習ガイドのふりがな: EDUIT_INFO.jishu.ruby(言葉 → 読み。shared/jishu-ruby.py で作る)の言葉に、長いものから順に付ける。
  // ガイドの上の「ふりがな」で消せる(はじめは付いている。その端末で覚える)
  var JS_RUBY = 'eduit.jishu.ruby', KJ = /[一-鿿々〆]/, rubyRe = null;
  function jishuRubyOn() { try { return localStorage.getItem(JS_RUBY) !== 'off'; } catch (e) { return true; } }
  function rubyDict() { var J = (window.EDUIT_INFO || info).jishu; return (J && J.ruby) || {}; }
  // 言葉の中のかなのところには付けない(「下げる」→ 下(さ)げる)。読みと合わないときは、言葉ぜんぶに付ける
  function rubyParts(k, r) {
    var parts = k.match(/[一-鿿々〆]+|[^一-鿿々〆]+/g);
    var m = new RegExp('^' + parts.map(function (p) { return KJ.test(p) ? '(.+?)' : '(' + p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')'; }).join('') + '$').exec(r);
    if (!m) return [[k, r]];
    return parts.map(function (p, i) { return [p, KJ.test(p) ? m[i + 1] : null]; });
  }
  function jishuRuby(node) {
    var D = rubyDict(), keys = Object.keys(D);
    if (!keys.length) return;
    if (!rubyRe) rubyRe = new RegExp(keys.sort(function (a, b) { return b.length - a.length; }).map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|'), 'g');
    var w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null), list = [];
    while (w.nextNode()) if (KJ.test(w.currentNode.nodeValue) && !w.currentNode.parentNode.closest('ruby, rt, script, style')) list.push(w.currentNode);
    list.forEach(function (n) {
      var s = n.nodeValue, f = document.createDocumentFragment(), last = 0, m;
      rubyRe.lastIndex = 0;
      while ((m = rubyRe.exec(s))) {
        if (m.index > last) f.appendChild(document.createTextNode(s.slice(last, m.index)));
        rubyParts(m[0], D[m[0]]).forEach(function (x) {
          f.appendChild(x[1] ? el('ruby', null, [x[0], el('rt', { text: x[1] })]) : document.createTextNode(x[0]));
        });
        last = m.index + m[0].length;
      }
      if (!last) return;
      if (last < s.length) f.appendChild(document.createTextNode(s.slice(last)));
      n.parentNode.replaceChild(f, n);
    });
  }

  // 振り返りを隠す設定のときは、タブの名前から「ふりかえり」を消す(D の「ふりかえり・記録」→「記録」など。教材の側も同じように変わる)
  function whereText(w) {

  }
  // c: 記号(なければアプリ名から)。1つのページの中でアプリを切りかえる教材集(C)は、開いたアプリの記号で呼びなおす(null でかくす)
  function jishuMount(c, appTitle) {
    if (!jishu) return;
    Array.prototype.forEach.call(document.querySelectorAll('.ef-jishu, .ef-jishu-fab'), function (e) { e.parentNode.removeChild(e); });
    document.documentElement.classList.remove('ef-jishu-open');

    var d = jishuData(c);
    if (!d) return;
    var st = jishuLoad(c);
    var narrow = function () { return window.innerWidth <= 640; };
    var fab = el('button', { type: 'button', class: 'ef-jishu-fab kz-norb no-ruby', 'data-noruby': '', 'aria-expanded': 'false', 'aria-controls': 'ef-jishu', title: '自習ガイド(ひとりで進めるときの案内)' }, [
      el('span', { class: 'ef-jishu-fab-t', text: '自習ガイド' }), el('span', { class: 'ef-jishu-fab-p' })
    ]);
    var close = el('button', { type: 'button', class: 'ef-btn', text: '閉じる' });
    var rb = Object.keys(rubyDict()).length ? el('button', { type: 'button', class: 'ef-btn ef-toggle ef-jishu-small', 'aria-pressed': String(jishuRubyOn()), text: 'ふりがな' }) : null;
    var body = el('div', { class: 'ef-jishu-body' });
    var name = appTitle || ((window.EDUIT_INFO || info).app || app).name || '';
    var panel = el('aside', { class: 'ef-jishu kz-norb no-ruby', 'data-noruby': '', id: 'ef-jishu', 'aria-label': '自習ガイド', hidden: '' }, [
      el('div', { class: 'ef-jishu-head' }, [
        el('h2', null, [el('span', { class: 'ef-jishu-k', text: '自習ガイド' }), code(d.label || c), el('span', { class: 'ef-jishu-name', text: name.replace(/^(?:[A-D]\d+|[GMFZ])\s*/, '') })]),
        rb, close
      ]),
      body
    ]);
    function save() { jishuSave(c, st); updateFab(); }
    function updateFab() {
      var p = jishuProgress(c);
      fab.querySelector('.ef-jishu-fab-p').textContent = p.done + '/' + p.steps;
    }
    function go(where) {
      if (!where) return;
      if (where.charAt(0) === '#') location.hash = where;
      else { var t = document.querySelector(where); if (t) t.click(); }
      if (narrow()) show(false);
    }
    function canGo(where) {
      if (!where) return false;

      try { return !!document.querySelector(where); } catch (e) { return false; }
    }
    // 1つの手順に文が2つ以上あるときは、文ごとに行を分ける(読む人が、いまどこをしているか追いやすいように)
    function lines(t) {
      return String(t || '').replace(/。(?=[^」』）)])/g, '。\n').split('\n').map(function (x) { return el('span', { class: 'ef-jishu-line', text: x }); });
    }
    function stepEl(x, n) {
      var s = x.s;
      var cb = el('input', { type: 'checkbox', id: 'ef-js-s' + x.i });
      cb.checked = !!st.s[x.i];
      cb.addEventListener('change', function () { if (cb.checked) st.s[x.i] = 1; else delete st.s[x.i]; li.classList.toggle('is-done', cb.checked); save(); renderEnd(); });
      var tools = el('div', { class: 'ef-jishu-tools' });
      if (s.hint) {
        var hint = el('p', { class: 'ef-jishu-hint', hidden: '', text: s.hint });
        var hb = el('button', { type: 'button', class: 'ef-btn ef-jishu-small', 'aria-expanded': 'false', text: 'ヒント' });
        hb.addEventListener('click', function () { hint.hidden = !hint.hidden; hb.setAttribute('aria-expanded', String(!hint.hidden)); });
        tools.appendChild(hb);
      }

  /* ================= M・F・Z 教科書順コースの教材(T-textbook/) =================

  var T_LV = { '3': 'できた', '2': 'だいたいできた', '1': 'もう少し' };

  };
  var T_REFL = { M: ['技術を見る目が変わったところ', 'もっと調べてみたい製品やしくみ'], F: ['これからの技術とのかかわり方', 'いちばん気になった技術'],
    Z: ['後輩へのひとこと', 'いちばん心に残っていること'] };
  var T_NAMES = {
    clt: 'CLT(直交集成板)', bio: 'バイオマスプラスチック', print3d: '3Dプリンタ', cfrp: '炭素繊維強化プラスチック', recycle: '金属・プラスチックのリサイクル',
    smart: 'スマート農業', factory: '植物工場', land: '陸上養殖', breed: '新しい品種づくり', enemy: '天敵を利用した害虫対策',
    renew: '再生可能エネルギーの発電', battery: '蓄電池', fuelcell: '燃料電池(水素)', ev: '電気自動車', grid: 'スマートグリッド',
    ai: '人工知能(AI)', iot: 'センサとネットワーク(IoT)', robot: 'ロボット', drone: 'ドローン', app: 'スマートフォンのアプリ',
    aging: '高齢化と人手不足', food: '食料を安定してつくる', energy: '地球温暖化とエネルギー', disaster: '自然災害にそなえる', waste: 'ごみと資源',
    user: '使う人', maker: '作る・運営する人', near: '近くに住む人', future: '未来の人'
  };
  var Z_CHECK = ['身の回りの製品やしくみを見て、どんな技術の工夫があるかに気づける', '材料の性質を生かして、じょうぶな製品を設計し、安全に製作できる',
    '作物や生き物の育ち方に合わせて、育てる環境を整え、管理できる', 'エネルギーを変換するしくみと、電気機器を安全に使う方法が分かる',
    'コンピュータやネットワークのしくみと、情報を安全に使う方法が分かる', 'プログラムで、計測・制御や、やりとりのできるコンテンツをつくれる',
    '問題を見つけて課題を決め、計画・製作(育成・制作)・評価・改善を進められる', '社会からの要求・安全性・環境への負荷・経済性の折り合いを考えられる',
    '新しい技術のよいところと心配なところの両方を考えて、使い方を判断できる', '技術を使って、よりよい生活や持続可能な社会をつくろうと考えられる'];
  var T_TITLE = { M: 'M 身の回りの技術さがし', F: 'F これからの技術ラボ', Z: 'Z 学習を終えて' };
  function parseT(obj) {

      R.add('ふりかえり', '③ 技術とわたしたち', '技術とのかかわり方' + (str(t3.role) ? '(' + str(t3.role) + ')' : ''), t3.how);

    ['双方向コンテンツ制作スタジオ(作品ファイル)', function (o) { return o.format === 'interactive-studio-work' && isObj(o.work); }, parseStudioWork],

    ['D10 ハッシュ化体験ラボ', function (o) { return o.app === 'ハッシュ化体験ラボ'; }, parseHash],
    ['D8 火星探査ロボット・シミュレータ', function (o) { return o.app === '火星探査ロボット・シミュレータ'; }, parseRover],
    ['D11 問題解決ノート', function (o) { return o.app === '問題解決ノート' && isObj(o.note); }, parseMondaiD]
  ];

  /* ファイル名から組・番号・名前を拾う(JSON の中に名前がないとき用) */
  function studentFromFile(fileName) {
    var stem = nfkc(fileName).replace(/\.json$/i, '');
    var m = stem.match(/(\d+)組[-_]?(\d+)番[-_]?([^_\-\d][^_]*)?/);

  function parse(obj, fileName) {

        var s = e.student;
        if (!s.cls && !s.num && !s.name && fromFile) {
          e.student = fromFile;

    return { ok: false, error: 'どの教材の記録か分かりませんでした' };

  /* 並べかえ用: 組 → 番号 → 名前(数字は数として比べる) */

  thead th { position: sticky; top: 0; background: var(--ef-surface-2); z-index: 1; white-space: nowrap; }
  td.v { white-space: pre-wrap; min-width: 18em; }
  td.nw, th.nw { white-space: nowrap; }
  tr.first td { border-top: 2px solid var(--ef-line); }
  .tag { display: inline-block; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .tag-ふりかえり { background: var(--ef-accent-soft); color: var(--ef-accent); }
  .tag-自己評価 { background: #e4f2e5; color: #1b5e20; }
  .tag-成績 { background: #fbeedd; color: #8a4a00; }
  .dom { font-weight: 700; }
  .matrix td { text-align: center; }
  .matrix td:first-child, .matrix th:first-child { text-align: left; white-space: nowrap; }
  .matrix .none { color: #b42318; }
  .empty { padding: 24px; text-align: center; color: var(--ef-muted); }
  mark { background: #fff3a3; }
  @media print { .ef-header .ef-tools, .no-print { display: none !important; } .table-wrap { max-height: none; overflow: visible; } }
</style>
</head>
<body class="ef-page">
<header class="ef-header">
  <h1 class="ef-title"><span class="ef-icon">📋</span>振り返り一覧 <span class="ef-sub">先生用・4分野の教材の提出ファイルをまとめて見る</span></h1>
  <div class="ef-tools"><span data-ef-about></span></div>
</header>
<main>
  <section class="ef-card no-print">
    <h2>1. 生徒が書き出した JSON ファイルを読み込む</h2>
    <div class="row">
      <label class="ef-btn-primary" for="pick-files">📄 ファイルを選ぶ(いくつでも)</label>
      <input id="pick-files" type="file" accept=".json,application/json" multiple>
      <label class="ef-btn" for="pick-folder">📁 フォルダごと読み込む</label>
      <input id="pick-folder" type="file" webkitdirectory multiple>
      <button type="button" class="ef-btn" id="clear">すべて消す</button>
    </div>
    <div class="drop" id="drop">ここにファイルやフォルダをドラッグしても読み込めます</div>
    <p class="muted">読み込んだ内容はこの画面の中だけで使います。どこにも送らず、保存もしません(画面を閉じると消えます)。
      同じファイル名をもう一度読み込むと、新しいほうに入れかわります。</p>
    <details id="file-box" hidden>
      <summary id="file-sum"></summary>
      <ul class="files" id="files"></ul>
    </details>
  </section>

  <div class="tabs no-print" role="tablist">
    <button type="button" class="ef-btn" role="tab" aria-pressed="true" data-tab="list">振り返り一覧</button>
    <button type="button" class="ef-btn" role="tab" aria-pressed="false" data-tab="matrix">提出状況(生徒 × 教材)</button>
  </div>

  <div class="filters no-print">
    <label>分野 <select id="f-domain"></select></label>
    <label>教材 <select id="f-app"></select></label>
    <label>組 <select id="f-cls"></select></label>
    <span id="f-types">
      <label><input type="checkbox" value="ふりかえり" checked> ふりかえり</label>
      <label><input type="checkbox" value="自己評価" checked> 自己評価</label>
      <label><input type="checkbox" value="成績" checked> 成績</label>
    </span>
    <label>さがす <input type="search" id="f-q" placeholder="名前・ことば"></label>
    <button type="button" class="ef-btn" id="csv">⬇ 表を CSV で保存</button>
    <button type="button" class="ef-btn" id="print">🖨 印刷</button>
  </div>
  <p class="muted" id="count" aria-live="polite"></p>
  <div class="table-wrap" id="view"></div>
  <div data-ef-footer></div>
</main>
<script>
(function () {
  'use strict';
  var DOMAINS = { G: 'G ガイダンス', M: 'M 身の回りの技術さがし', A: 'A 材料と加工', B: 'B 生物育成', C: 'C エネルギー変換', D: 'D 情報', F: 'F これからの技術ラボ', Z: 'Z 学習を終えて' };
  var files = [];   // { name, ok, format, error, entries }
  var tab = 'list';
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in attrs || {}) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function fmtAt(s) {
    if (!/^\d{4}-\d\d-\d\dT/.test(s)) return s;
    var d = new Date(s); if (isNaN(d)) return s;
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function who(s) { return [s.cls ? s.cls + '組' : '', s.num ? s.num + '番' : '', s.name ? ' ' + s.name : ''].join('').trim(); }

  /* ---------- 読み込み ---------- */
  function readFiles(list) {
    list = Array.prototype.filter.call(list, function (f) { return /\.json$/i.test(f.name); });
    if (!list.length) return;
    Promise.all(list.map(function (f) {
      var name = f.webkitRelativePath || f.name;
      function put(r) {
        r.name = name;
        files = files.filter(function (x) { return x.name !== name; });
        files.push(r);
      }
      // 1つのファイルが読めなくても(消された・権限がないなど)、ほかのファイルは表に出す
      return f.text().then(function (t) {
        var obj;
        try { obj = JSON.parse(t.replace(/^﻿/, '')); }
        catch (e) { put({ ok: false, error: 'JSON として読めませんでした' }); return; }
        put(FKR.parse(obj, f.name));
      }, function () { put({ ok: false, error: 'ファイルを開けませんでした' }); });
    })).then(refresh);
  }
  $('pick-files').addEventListener('change', function (e) { readFiles(e.target.files); e.target.value = ''; });
  $('pick-folder').addEventListener('change', function (e) { readFiles(e.target.files); e.target.value = ''; });
  $('clear').addEventListener('click', function () { if (!files.length || confirm('読み込んだファイルを画面から消します。')) { files = []; refresh(); } });
  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('is-over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); if (ev === 'drop' || !e.relatedTarget) drop.classList.remove('is-over'); }); });
  document.addEventListener('drop', function (e) {
    var items = e.dataTransfer.items, out = [], wait = [];
    function walk(entry) {
      if (!entry) return;
      if (entry.isFile) wait.push(new Promise(function (ok) { entry.file(function (f) { out.push(f); ok(); }, ok); }));
      else if (entry.isDirectory) {
        var rd = entry.createReader();
        wait.push(new Promise(function (ok) {
          (function more() { rd.readEntries(function (es) { if (!es.length) return ok(); es.forEach(walk); more(); }, ok); })();
        }));
      }
    }
    if (items && items.length && items[0].webkitGetAsEntry) {
      Array.prototype.forEach.call(items, function (it) { walk(it.webkitGetAsEntry()); });
      (function settle(n) { Promise.all(wait).then(function () { if (wait.length > n) settle(wait.length); else readFiles(out); }); })(0);
    } else readFiles(e.dataTransfer.files);
  });

  /* ---------- データをそろえる ---------- */
  /* 組と番号が同じなら同じ生徒とみなす(名前を書かなかったファイルも、名前のあるファイルとまとめる) */
  var canon = function (s) { return s; };
  function makeCanon() {
    var named = {};
    files.forEach(function (f) {
      (f.entries || []).forEach(function (e) {
        var s = e.student, k = s.cls + '\u0001' + s.num;
        if (s.cls && s.num && s.name && !named[k]) named[k] = s;
      });
    });
    canon = function (s) { return s.cls && s.num && !s.name && named[s.cls + '\u0001' + s.num] || s; };
  }
  function allRows() {
    var rows = [], seen = {};
    files.forEach(function (f) {
      (f.entries || []).forEach(function (e) {
        e = { student: canon(e.student), domain: e.domain, app: e.app, rows: e.rows };
        e.rows.forEach(function (r) {
          // 教材集の「記録まとめ」と1つずつの書き出しを両方出したとき、同じ行は1つにする
          var key = [FKR.studentKey(e.student), e.domain, e.app, r.part, r.type, r.value].join('\u0002');
          if (seen[key]) return; seen[key] = 1;
          rows.push({ s: e.student, domain: e.domain, app: e.app, part: r.part, type: r.type, label: r.label, value: r.value, at: r.at, file: f.name });
        });
      });
    });
    return rows;
  }
  function allEntries() {
    var out = [];
    files.forEach(function (f) { (f.entries || []).forEach(function (e) { out.push({ s: canon(e.student), domain: e.domain, app: e.app, n: e.rows.filter(function (r) { return r.type === 'ふりかえり'; }).length }); }); });
    return out;
  }
  // 分野の順: G(ガイダンス)→ A → B → C → D
  function domIdx(d) { var i = 'GMABCDFZ'.indexOf(d); return i < 0 ? 9 : i; }
  function appOrder(a, b) { return domIdx(a.domain) - domIdx(b.domain) || FKR.natural(a.app, b.app); }

  /* ---------- 絞りこみ ---------- */
  function fillSelect(sel, values, all) {
    var cur = sel.value;
    sel.textContent = '';
    sel.appendChild(el('option', { value: '', text: all }));
    values.forEach(function (v) { sel.appendChild(el('option', { value: v[0], text: v[1] })); });
    sel.value = values.some(function (v) { return v[0] === cur; }) ? cur : '';
  }
  function updateFilters() {
    var ents = allEntries(), doms = {}, apps = {}, clss = {};
    ents.forEach(function (e) { doms[e.domain] = 1; clss[e.s.cls] = 1; });
    fillSelect($('f-domain'), Object.keys(doms).sort(function (x, y) { return domIdx(x) - domIdx(y); }).map(function (d) { return [d, DOMAINS[d]]; }), 'すべて');
    var dom = $('f-domain').value;
    ents.forEach(function (e) { if (!dom || e.domain === dom) apps[e.domain + '\u0001' + e.app] = e; });
    fillSelect($('f-app'), Object.keys(apps).map(function (k) { return apps[k]; }).sort(appOrder).map(function (e) { return [e.app, e.app]; }), 'すべて');
    fillSelect($('f-cls'), Object.keys(clss).sort(FKR.natural).map(function (c) { return [c, c ? c + '組' : '(組なし)']; }), 'すべて');
  }
  function filters() {
    var types = {};
    Array.prototype.forEach.call(document.querySelectorAll('#f-types input'), function (c) { if (c.checked) types[c.value] = 1; });
    return { domain: $('f-domain').value, app: $('f-app').value, cls: $('f-cls').value, hasCls: $('f-cls').selectedIndex > 0, types: types, q: $('f-q').value.trim().normalize('NFKC').toLowerCase() };
  }
  function passStudent(s, f) { return !f.hasCls || s.cls === f.cls; }
  function filteredRows() {
    var f = filters();
    return allRows().filter(function (r) {
      if (f.domain && r.domain !== f.domain) return false;
      if (f.app && r.app !== f.app) return false;
      if (!passStudent(r.s, f) || !f.types[r.type]) return false;
      if (f.q) {
        var hay = [who(r.s), r.app, r.part, r.label, r.value].join(' ').normalize('NFKC').toLowerCase();
        if (hay.indexOf(f.q) < 0) return false;
      }
      return true;
    }).sort(function (a, b) {
      return FKR.compareStudent(a.s, b.s) || appOrder(a, b);
    });
  }

  /* ---------- 表 ---------- */
  var LIST_HEAD = ['組', '番号', '名前', '分野', '教材', '場面', '種類', '問い・項目', '内容', '日時', 'ファイル'];
  function listTable() {
    var rows = filteredRows(), f = filters();
    var tb = el('tbody'), prev = '';
    rows.forEach(function (r) {
      var k = FKR.studentKey(r.s), first = k !== prev; prev = k;
      var v = el('td', { class: 'v' });
      if (f.q) {
        var low = r.value.normalize('NFKC').toLowerCase(), i = low.indexOf(f.q);
        if (i >= 0 && r.value.length === low.length) v.append(r.value.slice(0, i), el('mark', { text: r.value.slice(i, i + f.q.length) }), r.value.slice(i + f.q.length));
        else v.textContent = r.value;
      } else v.textContent = r.value;
      tb.appendChild(el('tr', first ? { class: 'first' } : null, [
        el('td', { class: 'nw', text: r.s.cls }), el('td', { class: 'nw', text: r.s.num }), el('td', { class: 'nw', text: r.s.name }),
        el('td', { class: 'nw dom', text: r.domain }), el('td', { text: r.app }), el('td', { text: r.part }),
        el('td', null, [el('span', { class: 'tag tag-' + r.type, text: r.type })]), el('td', { text: r.label }), v,
        el('td', { class: 'nw', text: fmtAt(r.at) }), el('td', { class: 'muted', text: r.file })
      ]));
    });
    $('count').textContent = rows.length + ' 行(' + new Set(rows.map(function (r) { return FKR.studentKey(r.s); })).size + ' 人)';
    if (!rows.length) return el('div', { class: 'empty', text: files.length ? '条件に合う行がありません。' : 'まだファイルを読み込んでいません。' });
    return el('table', null, [el('thead', null, [el('tr', null, LIST_HEAD.map(function (h) { return el('th', { class: 'nw', text: h }); }))]), tb]);
  }
  function listCsv() {
    return [LIST_HEAD].concat(filteredRows().map(function (r) {
      return [r.s.cls, r.s.num, r.s.name, DOMAINS[r.domain], r.app, r.part, r.type, r.label, r.value, fmtAt(r.at), r.file];
    }));
  }

  /* 提出状況: 生徒 × 教材(数字はふりかえりの件数、○ は提出はあるがふりかえりの文がない、空らんは未提出) */
  function matrixData() {
    var f = filters(), students = {}, apps = {}, cell = {};
    allEntries().forEach(function (e) {
      if (f.domain && e.domain !== f.domain) return;
      if (f.app && e.app !== f.app) return;
      if (!passStudent(e.s, f)) return;
      if (f.q && who(e.s).normalize('NFKC').toLowerCase().indexOf(f.q) < 0) return;
      var sk = FKR.studentKey(e.s), ak = e.domain + '\u0001' + e.app;
      students[sk] = e.s; apps[ak] = e;
      var c = cell[sk + '\u0003' + ak] || (cell[sk + '\u0003' + ak] = { files: 0, n: 0 });
      c.files++; c.n = Math.max(c.n, e.n);
    });
    var sl = Object.keys(students).map(function (k) { return students[k]; }).sort(FKR.compareStudent);
    var al = Object.keys(apps).map(function (k) { return apps[k]; }).sort(appOrder);
    return { sl: sl, al: al, get: function (s, a) { return cell[FKR.studentKey(s) + '\u0003' + a.domain + '\u0001' + a.app]; } };
  }
  function matrixTable() {
    var m = matrixData();
    $('count').textContent = m.sl.length + ' 人 × ' + m.al.length + ' 教材 ・ 数字はふりかえりの文の数、○ は提出あり(ふりかえりの文なし)、－ は未提出';
    if (!m.sl.length) return el('div', { class: 'empty', text: files.length ? '条件に合う生徒がいません。' : 'まだファイルを読み込んでいません。' });
    var head = el('tr', null, [el('th', { text: '組・番号・名前' })].concat(m.al.map(function (a) { return el('th', { title: DOMAINS[a.domain], text: a.domain + ' ' + a.app }); })));
    var tb = el('tbody');
    m.sl.forEach(function (s) {
      tb.appendChild(el('tr', null, [el('td', { text: who(s) || '(名前なし)' })].concat(m.al.map(function (a) {
        var c = m.get(s, a);
        return el('td', c ? { text: c.n ? String(c.n) : '○' } : { class: 'none', text: '－' });
      }))));
    });
    return el('table', { class: 'matrix' }, [el('thead', null, [head]), tb]);
  }
  function matrixCsv() {
    var m = matrixData();
    return [['組', '番号', '名前'].concat(m.al.map(function (a) { return a.domain + ' ' + a.app; }))].concat(m.sl.map(function (s) {
      return [s.cls, s.num, s.name].concat(m.al.map(function (a) { var c = m.get(s, a); return c ? (c.n ? c.n : '○') : ''; }));
    }));
  }

  /* ---------- 画面 ---------- */
  function renderFiles() {
    var ok = files.filter(function (f) { return f.ok; }).length, ng = files.length - ok;
    $('file-box').hidden = !files.length;
    $('file-sum').textContent = '読み込んだファイル ' + files.length + ' 個(読めた ' + ok + ' 個' + (ng ? '・読めなかった ' + ng + ' 個' : '') + ')';
    if (ng) $('file-box').open = true;
    var ul = $('files'); ul.textContent = '';
    files.slice().sort(function (a, b) { return (a.ok === b.ok ? 0 : a.ok ? 1 : -1) || FKR.natural(a.name, b.name); }).forEach(function (f) {
      if (!f.ok) { ul.appendChild(el('li', { class: 'ng', text: '✕ ' + f.name + ' … ' + f.error + (f.format ? '(' + f.format + ')' : '') })); return; }
      var names = f.entries.map(function (e) { return who(e.student) || '名前なし'; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
      var nrow = f.entries.reduce(function (n, e) { return n + e.rows.length; }, 0);
      ul.appendChild(el('li', null, ['✓ ' + f.name + ' … ', el('span', { class: 'who', text: names.join('、') }),
        '・' + f.entries.map(function (e) { return e.app; }).join('、') + '(' + nrow + ' 行)' +
        (f.entries.some(function (e) { return e.fromFile; }) ? '・組・番号はファイル名から読み取り' : '') +
        (f.entries.some(function (e) { return !who(e.student); }) ? '・ファイルの中に名前がありません' : '')]));
    });
  }
  function render() {
    var v = $('view'); v.textContent = '';
    v.appendChild(tab === 'list' ? listTable() : matrixTable());
    document.querySelector('#f-types').style.display = tab === 'list' ? '' : 'none';
  }
  function refresh() { makeCanon(); renderFiles(); updateFilters(); render(); }

  Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (b) {
    b.addEventListener('click', function () {
      tab = b.getAttribute('data-tab');
      Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      render();
    });
  });
  $('f-domain').addEventListener('change', function () { updateFilters(); render(); });
  ['f-app', 'f-cls'].forEach(function (id) { $(id).addEventListener('change', render); });
  $('f-types').addEventListener('change', render);
  $('f-q').addEventListener('input', render);
  $('print').addEventListener('click', function () { window.print(); });
  $('csv').addEventListener('click', function () {
    var d = new Date(), stamp = d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
    var blob = new Blob([FKR.csv(tab === 'list' ? listCsv() : matrixCsv())], { type: 'text/csv' });
    var a = el('a', { href: URL.createObjectURL(blob), download: (tab === 'list' ? '振り返り一覧_' : '提出状況_') + stamp + '.csv' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  refresh();
})();
</script>
</body>
</html>
