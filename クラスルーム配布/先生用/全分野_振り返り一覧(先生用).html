<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>振り返り一覧(先生用)</title>
<style>
/* Edu-IT 共通の枠(4分野・全アプリ共通)
 * 色・文字・ボタン・カード・ヘッダー・フッターの見た目をそろえるための部品。
 * 分野の色は <html data-ef-domain="A|B|C|D"> で切りかわる。
 * アプリ固有の見た目は各アプリの CSS に残し、ここでは「枠」だけを決める。
 */
:root {
  --ef-font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --ef-bg: #f5f4f0;          /* 画面の地 */
  --ef-surface: #ffffff;     /* カード・ヘッダー */
  --ef-surface-2: #f8f7f4;   /* 一段下げた面 */
  --ef-line: #d6d3cb;        /* 枠線 */
  --ef-text: #1f2328;
  --ef-muted: #565d68;
  --ef-focus: #f08c00;       /* キーボード操作の枠 */
  --ef-radius: 12px;
  --ef-radius-s: 8px;
  --ef-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .04);
  --ef-header-h: 52px;
  --ef-tap: 40px;            /* ボタンの最小の高さ */
  /* 分野の色(既定は D) */
  --ef-accent: #1a5fc8;
  --ef-accent-ink: #ffffff;
  --ef-accent-soft: #e6eefb;
}
:root[data-ef-domain="A"] { --ef-accent: #985a26; --ef-accent-soft: #f5e9dc; }  /* 材料と加工: 木の茶 */
:root[data-ef-domain="B"] { --ef-accent: #2e7d32; --ef-accent-soft: #e4f2e5; }  /* 生物育成: 緑 */
:root[data-ef-domain="C"] { --ef-accent: #b45309; --ef-accent-soft: #fbeedd; }  /* エネルギー変換: だいだい */
:root[data-ef-domain="D"] { --ef-accent: #1a5fc8; --ef-accent-soft: #e6eefb; }  /* 情報: 青 */

/* ---- ヘッダー ----
 * <header class="ef-header">
 *   <a class="ef-btn ef-back" href="…">◀ メニュー</a>
 *   <h1 class="ef-title"><span class="ef-icon">…</span>アプリ名</h1>
 *   <div class="ef-tools"> ふりがな / 文字の大きさ / くっきり / 使い方 などの .ef-btn </div>
 * </header>
 */
.ef-header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  min-height: var(--ef-header-h); padding: 6px 14px;
  background: var(--ef-surface); color: var(--ef-text);
  border-bottom: 3px solid var(--ef-accent);
  font-family: var(--ef-font);
  box-sizing: border-box;
}
.ef-title {
  display: flex; align-items: center; gap: 8px;
  margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--ef-text);
}
.ef-title .ef-icon { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; font-size: 22px; }
.ef-title .ef-sub { font-size: 13px; font-weight: 400; color: var(--ef-muted); }
.ef-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }

/* ---- ボタン ----
 * .ef-btn          ふつうのボタン(白地・枠線・丸角)
 * .ef-btn.is-on    ON の状態(分野の色で塗る)。aria-pressed="true" でも同じ
 * .ef-btn-primary  いちばん大事な操作(はじめる・ひらく など)
 */
.ef-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--ef-tap); padding: 0 14px;
  border: 1px solid var(--ef-line); border-radius: 999px;
  background: var(--ef-surface); color: var(--ef-text);
  font: 600 15px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
  box-sizing: border-box; white-space: nowrap;
}
.ef-btn:hover { border-color: var(--ef-accent); }
.ef-btn.is-on, .ef-btn[aria-pressed="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-back { color: var(--ef-accent); border-color: transparent; background: var(--ef-accent-soft); }
.ef-btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 20px;
  border: 0; border-radius: var(--ef-radius-s);
  background: var(--ef-accent); color: var(--ef-accent-ink);
  font: 700 16px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
}
.ef-btn-primary:hover { filter: brightness(1.08); }
.ef-btn:focus-visible, .ef-btn-primary:focus-visible, .ef-about-link:focus-visible, .ef-dialog :focus-visible {
  outline: 3px solid var(--ef-focus); outline-offset: 2px;
}

/* ---- メニューのカード ----
 * <article class="ef-card"> <p class="ef-card-tag">M1</p> <h3 class="ef-card-title">…</h3> <p>…</p> <a class="ef-btn-primary">ひらく ▶</a> </article>
 */
.ef-page { background: var(--ef-bg); color: var(--ef-text); font-family: var(--ef-font); }
.ef-card {
  background: var(--ef-surface); border: 1px solid var(--ef-line); border-top: 4px solid var(--ef-accent);
  border-radius: var(--ef-radius); box-shadow: var(--ef-shadow); padding: 16px 18px;
}
.ef-card-tag { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ef-accent); }
.ef-card-title { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: var(--ef-text); }

/* ---- フッター(作成者・このアプリについて) ---- */
.ef-footer {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 14px;
  margin: 24px 0 0; padding: 12px 16px;
  border-top: 1px solid var(--ef-line); background: var(--ef-surface-2);
  font: 13px/1.6 var(--ef-font); color: var(--ef-muted);
}
.ef-footer .ef-author { font-weight: 700; color: var(--ef-text); }
.ef-about-link {
  border: 0; background: none; padding: 2px 4px; cursor: pointer;
  font: inherit; color: var(--ef-accent); text-decoration: underline;
}
/* ヘッダーなどに置く小さい「このアプリについて」ボタン */
.ef-about-btn { font-size: 14px; }

/* ---- このアプリについて(ダイアログ) ---- */
.ef-dialog {
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  padding: 0; border: 1px solid var(--ef-line); border-radius: var(--ef-radius);
  background: var(--ef-surface); color: var(--ef-text); font: 15px/1.7 var(--ef-font);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
}
.ef-dialog::backdrop { background: rgba(0, 0, 0, .4); }
.ef-dialog-in { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.ef-dialog-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 3px solid var(--ef-accent); }
.ef-dialog-head h2 { margin: 0; font-size: 18px; flex: 1; }
.ef-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px 0; }
.ef-tab { border: 1px solid var(--ef-line); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--ef-surface-2);
  padding: 6px 12px; font: 600 14px/1.3 var(--ef-font); color: var(--ef-text); cursor: pointer; min-height: 36px; }
.ef-tab[aria-selected="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-panel { padding: 14px 18px 18px; overflow: auto; border-top: 1px solid var(--ef-line); }
.ef-panel h3 { margin: 12px 0 4px; font-size: 16px; }
.ef-panel ul { margin: 4px 0 8px; padding-left: 1.3em; }
.ef-panel p { margin: 4px 0 8px; }
.ef-hist-ver { font-weight: 700; color: var(--ef-accent); }
.ef-hist-date { color: var(--ef-muted); font-size: 13px; margin-left: 6px; }

/* 文字を大きくした・くっきりのときも読めるように */
@media print { .ef-footer, .ef-dialog { display: none !important; } }

</style>
<script>
/* 先生用の道具(4分野共通) の版・更新履歴
 * 共通の枠 shared/eduit-frame.js が読む(classic script)。分野の色はつけない(既定の青)。
 */
window.EDUIT_INFO = {
  domainName: '',
  suite: '先生用の道具',
  version: '1.1',
  updated: '2026-10-15',
  safety: [
    '振り返り一覧は、先生が選んだファイルをこの画面の中だけで読みます。ファイルの内容はどこにも送らず、ブラウザにも保存しません。',
    '生徒の名前や振り返りが入ったファイルや、保存した CSV は、学校の決まりに従って扱ってください。'
  ],
  history: [
    {
      version: '1.1', date: '2026-10-15',
      items: ['振り返り一覧: ネット詐欺 追体験ラボの書き出し(場面ごとのクリア・だまされた回数・ふりかえり)も読めるようにした']
    },
    {
      version: '1.0', date: '2026-10-15',
      items: [
        '振り返り一覧: 4分野の教材が書き出した JSON をまとめて読み込み、振り返り・自己評価・成績を1つの表にした',
        '提出状況(生徒 × 教材)の表と、CSV 保存・印刷を付けた'
      ]
    }
  ]
};

</script>
<script>
/* Edu-IT 共通の枠: 作成者・安全と個人情報・ライセンス・更新履歴
 * 使い方(classic script。file:// でも動く):
 *   <link rel="stylesheet" href="…/shared/eduit-frame.css">
 *   <script src="…/<分野>/eduit-info.js"><\/script>   … window.EDUIT_INFO を決める
 *   <script src="…/shared/eduit-frame.js"><\/script>
 * 置き場所(どれか):
 *   - <div data-ef-footer></div> があればそこにフッターを出す
 *   - <span data-ef-about></span> があればそこに「ⓘ このアプリについて」ボタンを出す(フッターは出さない)
 *   - どちらもなければ <body> の最後にフッターを足す
 *   - EDUIT_INFO.app.footer === false なら自動では何も出さない(EduitFrame.open() だけ使う)
 * EDUIT_INFO = {
 *   domain: 'A',                     分野(A/B/C/D)。色が切りかわる
 *   domainName: '材料と加工の技術',
 *   suite: '材料と加工 教材アプリ',     教材集の名前
 *   version: '2.1', updated: '2026-10-15',
 *   safety: ['この分野だけの安全の説明', …],   共通の説明のあとに足す
 *   history: [{ version: '2.1', date: '2026-10-15', items: ['…', …] }, …]   新しい順
 *   app: { name: 'M3 構造強化ラボ' }   アプリごとに上書き(EDUIT_INFO.app を各ページで決めてもよい)
 * }
 */
(function () {
  'use strict';
  var AUTHOR = '技術　岡田';
  var info = window.EDUIT_INFO || {};
  var app = info.app || {};
  if (info.domain) document.documentElement.setAttribute('data-ef-domain', info.domain);

  var SAFETY = [
    'この教材はインターネットに接続しません。外部のサイトやサーバーへ、入力した内容や学習の記録を送ることはありません。',
    '学習の記録は、開いた端末のブラウザの中だけに保存されます。ほかの端末や先生のパソコンへ自動で送られることはありません。',
    '提出するときは、自分で「書き出す」などのボタンでファイルにして、先生の指示どおりに出します。',
    '名前などの個人情報は、先生の指示がないときは入力しないでください。',
    '端末をほかの人と共有するときは、提出したあとに記録を消してください。',
    '教材に出てくる会社名・人名・アドレス・数値は、学習のために作ったものです(実在のものではありません。数値は目安です)。',
    '広告・アクセス解析・Cookie による追跡はありません。外部のプログラム(CDN など)も読み込みません。'
  ];
  var LICENSE = [
    '著作権: © 2026 ' + AUTHOR,
    '学校の授業・家庭学習など、学習のためであれば、だれでも無料で使用・コピー・配布できます(ほかの学校の先生も使えます)。',
    '授業に合わせて直して使うこともできます。直したものを配るときは、直したことと、もとの作者(' + AUTHOR + ')を書いてください。',
    '販売すること、有料の教材や商品に入れて配ることはできません。',
    'この教材は今のまま提供します。使ったことで起きた不具合や損害について、作者は責任を負いません。',
    '教科書の図や文章は使っていません。図や文章はこの教材のために作ったものです。'
  ];

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'class') e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function list(items) { return el('ul', null, items.map(function (t) { return el('li', { text: t }); })); }
  function appName() { return app.name || info.suite || document.title; }

  var dlg = null;
  function build() {
    var safety = SAFETY.concat(info.safety || []).concat(app.safety || []);
    var hist = info.history || [];
    var panels = [
      ['安全と個人情報', [el('h3', { text: 'この教材の安全について' }), list(safety)]],
      ['ライセンス', [el('h3', { text: '使ってよい条件' }), list(LICENSE)]],
      ['更新履歴', hist.length ? hist.map(function (h) {
        return el('section', null, [
          el('h3', null, [el('span', { class: 'ef-hist-ver', text: h.version ? '第' + h.version + '版' : '' }),
            el('span', { class: 'ef-hist-date', text: h.date || '' })]),
          list(h.items || [])
        ]);
      }) : [el('p', { text: 'まだありません。' })]],
      ['作った人', [
        el('h3', { text: appName() }),
        el('p', { text: (info.domainName ? '中学校 技術・家庭科(技術分野)「' + info.domainName + '」の教材です。' : '中学校 技術・家庭科(技術分野)の教材です。') }),
        el('p', { text: '作成: ' + AUTHOR }),
        el('p', { text: (info.version ? '第' + info.version + '版' : '') + (info.updated ? '(' + info.updated + ' 更新)' : '') })
      ]]
    ];
    var tabs = el('div', { class: 'ef-tabs', role: 'tablist' });
    var body = el('div');
    var tabEls = [], panelEls = [];
    panels.forEach(function (p, i) {
      var t = el('button', { type: 'button', class: 'ef-tab', role: 'tab', id: 'ef-tab-' + i, 'aria-controls': 'ef-panel-' + i, 'aria-selected': i ? 'false' : 'true', tabindex: i ? '-1' : '0', text: p[0] });
      var pn = el('div', { class: 'ef-panel', role: 'tabpanel', id: 'ef-panel-' + i, 'aria-labelledby': 'ef-tab-' + i }, p[1]);
      if (i) pn.hidden = true;
      t.addEventListener('click', function () { select(i); });
      t.addEventListener('keydown', function (e) {
        var n = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (n) { e.preventDefault(); select((i + n + panels.length) % panels.length); tabEls[(i + n + panels.length) % panels.length].focus(); }
      });
      tabEls.push(t); panelEls.push(pn); tabs.appendChild(t); body.appendChild(pn);
    });
    function select(i) {
      tabEls.forEach(function (t, j) { t.setAttribute('aria-selected', i === j ? 'true' : 'false'); t.tabIndex = i === j ? 0 : -1; });
      panelEls.forEach(function (p, j) { p.hidden = i !== j; });
    }
    var close = el('button', { type: 'button', class: 'ef-btn', text: '閉じる' });
    close.addEventListener('click', function () { dlg.close(); });
    dlg = el('dialog', { class: 'ef-dialog', 'aria-labelledby': 'ef-dialog-title' }, [
      el('div', { class: 'ef-dialog-in' }, [
        el('div', { class: 'ef-dialog-head' }, [el('h2', { id: 'ef-dialog-title', text: 'このアプリについて' }), close]),
        tabs, body
      ])
    ]);
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
    dlg._select = select;
    document.body.appendChild(dlg);
  }
  function open(tab) {
    if (!dlg) build();
    dlg._select(typeof tab === 'number' ? tab : 0);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  }

  function aboutButton(cls) {
    var b = el('button', { type: 'button', class: cls || 'ef-btn ef-about-btn', title: '作った人・安全と個人情報・ライセンス・更新履歴', text: 'ⓘ このアプリについて' });
    b.addEventListener('click', function () { open(0); });
    return b;
  }
  function footer() {
    var link = aboutButton('ef-about-link');
    link.textContent = '安全と個人情報・ライセンス・更新履歴';
    return el('footer', { class: 'ef-footer', role: 'contentinfo' }, [
      el('span', null, ['作成: ', el('span', { class: 'ef-author', text: AUTHOR })]),
      info.version ? el('span', { text: '第' + info.version + '版' + (info.updated ? '(' + info.updated + ')' : '') }) : null,
      link
    ]);
  }
  function mount() {
    if (app.footer === false) return;
    var slot = document.querySelector('[data-ef-footer]');
    var about = document.querySelector('[data-ef-about]');
    if (slot) { if (!slot.querySelector('.ef-footer')) slot.appendChild(footer()); }
    else if (about) { if (!about.querySelector('button')) about.appendChild(aboutButton()); }
    else if (!document.querySelector('body > .ef-footer')) document.body.appendChild(footer());
  }

  window.EduitFrame = { AUTHOR: AUTHOR, open: open, footer: footer, aboutButton: aboutButton, mount: mount };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();

</script>
<script>
/* 振り返り一覧(先生用): 各教材が書き出した JSON を、同じ形の「行」にそろえる。
 * ブラウザでは window.FKR、node では require('./parse.js') で使う(classic script)。
 *
 *   FKR.parse(obj, fileName) → { ok, format, entries: [{ domain, app, student, rows }], error }
 *     student: { cls, num, name }   組・番号・名前(全角→半角、末尾の「組」「番」は取る)
 *     rows:    [{ part, type, label, value, at }]
 *       part  … 教材の中の場面(モジュール・課題・作品名など。なければ '')
 *       type  … 'ふりかえり' | '自己評価' | '成績'
 *       label … 問い・項目
 *       value … 書いた文・評価・点数(空のものは入れない)
 *       at    … 日時(ISO か、教材が書いたままの文字)
 *
 * 新しい教材を足すときは ADAPTERS に1つ足す(test で読めるか確かめる)。
 */
(function (root) {
  'use strict';

  function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
  function str(v) { return v == null ? '' : String(v).trim(); }
  function nfkc(v) { var s = str(v); return s.normalize ? s.normalize('NFKC') : s; }

  /* 組・番号・名前をそろえる。「2組15番」のように1つの欄に書いたものも分ける */
  function student(cls, num, name) {
    var c = nfkc(cls).replace(/\s+/g, ''), n = nfkc(num).replace(/\s+/g, '');
    if (c && !n) {
      var m = c.match(/^(.*?)組[-・,、]?(\d+)番?$/);
      if (m) { c = m[1]; n = m[2]; }
    }
    return { cls: c.replace(/組$/, ''), num: n.replace(/番$/, ''), name: nfkc(name) };
  }
  var NOBODY = { cls: '', num: '', name: '' };

  /* 行を集める道具 */
  function Rows(defaultAt) {
    var rows = [];
    return {
      rows: rows,
      add: function (type, part, label, value, at) {
        var v = typeof value === 'number' ? String(value) : str(value);
        if (!v) return;
        rows.push({ part: str(part), type: type, label: str(label), value: v, at: str(at) || str(defaultAt) });
      }
    };
  }
  function pick(list, key) {
    for (var i = 0; i < list.length; i++) if (list[i][0] === key) return list[i][1];
    return key;
  }

  /* ================= A 材料と加工(gijutsu-artifact/1) ================= */
  var A_APPS = {
    'material-navi': 'M1 材料選択ナビ', 'wood-lab': 'M2 木材の繊維・収縮ラボ', 'structure-lab': 'M3 構造強化ラボ',
    'drawing-trainer': 'M4 製図トレーナー', 'kidori': 'M5 木取り・構想シミュレータ', 'tool-safety': 'M6 工具の使い方・安全トレーナー',
    'solid-maker': 'M7 第三角法 立体メーカー'
  };
  var M4_SELF = [['read', '三面図を見て、立体の形を思いうかべることができた'], ['draw', '第三角法で、正面図・平面図・右側面図を正しい位置にかけた'],
    ['iso', '等角図を、たて・横・おくの3つの向きの線でかけた'], ['line', '線の種類(外形線・かくれ線・中心線など)を使い分けられた']];

    ['デジタル化ラボ', function (o) { return o.app === 'デジタル化ラボ'; }, parseDigi],
    ['ネットワーク通信シミュレータ', function (o) { return o.app === 'network-sim'; }, parseNet],
    ['情報セキュリティ体験ラボ', function (o) { return o.app === 'seclab' && o.student !== undefined; }, parseSec],
    ['計測・制御シミュレータ', function (o) { return o.app === '計測・制御シミュレータ'; }, parseMc],
    ['双方向コンテンツ制作スタジオ', function (o) { return o.app === 'interactive-studio' && Array.isArray(o.works); }, parseStudio],
    ['双方向コンテンツ制作スタジオ(作品ファイル)', function (o) { return o.format === 'interactive-studio-work' && isObj(o.work); }, parseStudioWork],
    ['生成AIのしくみラボ', function (o) { return o.app === '生成AIのしくみラボ'; }, parseGenai],
    ['ネット詐欺 追体験ラボ', function (o) { return o.app === 'ネット詐欺 追体験ラボ'; }, parseScam]
  ];

  /* ファイル名から組・番号・名前を拾う(JSON の中に名前がないとき用) */
  function studentFromFile(fileName) {
    var stem = nfkc(fileName).replace(/\.json$/i, '');
    var m = stem.match(/(\d+)組[-_]?(\d+)番[-_]?([^_\-\d][^_]*)?/);
    if (m) return student(m[1], m[2], m[3] && !/^\d/.test(m[3]) ? m[3] : '');
    return null;
  }

  function parse(obj, fileName) {
    if (!isObj(obj) && !Array.isArray(obj)) return { ok: false, error: 'JSON の形が教材の記録ではありません' };
    for (var i = 0; i < ADAPTERS.length; i++) {
      var a = ADAPTERS[i];
      if (!Array.isArray(obj) && !a[1](obj)) continue;
      if (Array.isArray(obj) && a[2] !== parseA) continue;
      var entries = a[2](obj);
      if (!entries.length) return { ok: false, format: a[0], error: '記録が入っていませんでした' };
      var fromFile = studentFromFile(fileName || '');
      entries.forEach(function (e) {
        var s = e.student;
        if (!s.cls && !s.num && !s.name && fromFile) {
          e.student = fromFile;
          e.fromFile = true;
        }
      });
      return { ok: true, format: a[0], entries: entries };
    }
    return { ok: false, error: 'どの教材の記録か分かりませんでした' };
  }

  /* 並べかえ用: 組 → 番号 → 名前(数字は数として比べる) */
  function natural(a, b) {
    var x = String(a), y = String(b);
    var nx = parseFloat(x.replace(/[^\d.]/g, '')), ny = parseFloat(y.replace(/[^\d.]/g, ''));
    if (x !== y && !isNaN(nx) && !isNaN(ny) && nx !== ny) return nx - ny;
    return x < y ? -1 : x > y ? 1 : 0;
  }
  function studentKey(s) { return [s.cls, s.num, s.name].join('\u0001'); }
  function compareStudent(a, b) {
    var pa = !a.cls && !a.num, pb = !b.cls && !b.num;
    if (pa !== pb) return pa ? 1 : -1;
    return natural(a.cls, b.cls) || natural(a.num, b.num) || natural(a.name, b.name);
  }

  /* CSV(Excel・スプレッドシートで文字化けしないように BOM と CRLF) */
  function csv(rows) {
    return '﻿' + rows.map(function (r) {
      return r.map(function (c) {
        var s = c == null ? '' : String(c);
        if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;  // 数式として動かないように
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n') + '\r\n';
  }

  var api = { parse: parse, student: student, studentKey: studentKey, compareStudent: compareStudent, natural: natural, csv: csv, formats: ADAPTERS.map(function (a) { return a[0]; }) };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.FKR = api;
})(this);

</script>

<script>
(function () {
  'use strict';
  var DOMAINS = { A: 'A 材料と加工', B: 'B 生物育成', C: 'C エネルギー変換', D: 'D 情報' };
  var files = [];   // { name, ok, format, error, entries }
  var tab = 'list';
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in attrs || {}) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function fmtAt(s) {
    if (!/^\d{4}-\d\d-\d\dT/.test(s)) return s;
    var d = new Date(s); if (isNaN(d)) return s;
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function who(s) { return [s.cls ? s.cls + '組' : '', s.num ? s.num + '番' : '', s.name ? ' ' + s.name : ''].join('').trim(); }

  /* ---------- 読み込み ---------- */
  function readFiles(list) {
    list = Array.prototype.filter.call(list, function (f) { return /\.json$/i.test(f.name); });
    if (!list.length) return;
    Promise.all(list.map(function (f) {
      return f.text().then(function (t) {
        var name = f.webkitRelativePath || f.name;
        var r;
        try { r = FKR.parse(JSON.parse(t.replace(/^﻿/, '')), f.name); }
        catch (e) { r = { ok: false, error: 'JSON として読めませんでした' }; }
        r.name = name;
        files = files.filter(function (x) { return x.name !== name; });
        files.push(r);
      });
    })).then(refresh);
  }
  $('pick-files').addEventListener('change', function (e) { readFiles(e.target.files); e.target.value = ''; });
  $('pick-folder').addEventListener('change', function (e) { readFiles(e.target.files); e.target.value = ''; });
  $('clear').addEventListener('click', function () { if (!files.length || confirm('読み込んだファイルを画面から消します。')) { files = []; refresh(); } });
  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('is-over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); if (ev === 'drop' || !e.relatedTarget) drop.classList.remove('is-over'); }); });
  document.addEventListener('drop', function (e) {
    var items = e.dataTransfer.items, out = [], wait = [];
    function walk(entry) {
      if (!entry) return;
      if (entry.isFile) wait.push(new Promise(function (ok) { entry.file(function (f) { out.push(f); ok(); }, ok); }));
      else if (entry.isDirectory) {
        var rd = entry.createReader();
        wait.push(new Promise(function (ok) {
          (function more() { rd.readEntries(function (es) { if (!es.length) return ok(); es.forEach(walk); more(); }, ok); })();
        }));
      }
    }
    if (items && items.length && items[0].webkitGetAsEntry) {
      Array.prototype.forEach.call(items, function (it) { walk(it.webkitGetAsEntry()); });
      (function settle(n) { Promise.all(wait).then(function () { if (wait.length > n) settle(wait.length); else readFiles(out); }); })(0);
    } else readFiles(e.dataTransfer.files);
  });

  /* ---------- データをそろえる ---------- */
  /* 組と番号が同じなら同じ生徒とみなす(名前を書かなかったファイルも、名前のあるファイルとまとめる) */
  var canon = function (s) { return s; };
  function makeCanon() {
    var named = {};
    files.forEach(function (f) {
      (f.entries || []).forEach(function (e) {
        var s = e.student, k = s.cls + '\u0001' + s.num;
        if (s.cls && s.num && s.name && !named[k]) named[k] = s;
      });
    });
    canon = function (s) { return s.cls && s.num && !s.name && named[s.cls + '\u0001' + s.num] || s; };
  }
  function allRows() {
    var rows = [], seen = {};
    files.forEach(function (f) {
      (f.entries || []).forEach(function (e) {
        e = { student: canon(e.student), domain: e.domain, app: e.app, rows: e.rows };
        e.rows.forEach(function (r) {
          // 教材集の「記録まとめ」と1つずつの書き出しを両方出したとき、同じ行は1つにする
          var key = [FKR.studentKey(e.student), e.domain, e.app, r.part, r.type, r.value].join('\u0002');
          if (seen[key]) return; seen[key] = 1;
          rows.push({ s: e.student, domain: e.domain, app: e.app, part: r.part, type: r.type, label: r.label, value: r.value, at: r.at, file: f.name });
        });
      });
    });
    return rows;
  }
  function allEntries() {
    var out = [];
    files.forEach(function (f) { (f.entries || []).forEach(function (e) { out.push({ s: canon(e.student), domain: e.domain, app: e.app, n: e.rows.filter(function (r) { return r.type === 'ふりかえり'; }).length }); }); });
    return out;
  }
  function appOrder(a, b) { return a.domain < b.domain ? -1 : a.domain > b.domain ? 1 : FKR.natural(a.app, b.app); }

  /* ---------- 絞りこみ ---------- */
  function fillSelect(sel, values, all) {
    var cur = sel.value;
    sel.textContent = '';
    sel.appendChild(el('option', { value: '', text: all }));
    values.forEach(function (v) { sel.appendChild(el('option', { value: v[0], text: v[1] })); });
    sel.value = values.some(function (v) { return v[0] === cur; }) ? cur : '';
  }
  function updateFilters() {
    var ents = allEntries(), doms = {}, apps = {}, clss = {};
    ents.forEach(function (e) { doms[e.domain] = 1; clss[e.s.cls] = 1; });
    fillSelect($('f-domain'), Object.keys(doms).sort().map(function (d) { return [d, DOMAINS[d]]; }), 'すべて');
    var dom = $('f-domain').value;
    ents.forEach(function (e) { if (!dom || e.domain === dom) apps[e.domain + '\u0001' + e.app] = e; });
    fillSelect($('f-app'), Object.keys(apps).map(function (k) { return apps[k]; }).sort(appOrder).map(function (e) { return [e.app, e.app]; }), 'すべて');
    fillSelect($('f-cls'), Object.keys(clss).sort(FKR.natural).map(function (c) { return [c, c ? c + '組' : '(組なし)']; }), 'すべて');
  }
  function filters() {
    var types = {};
    Array.prototype.forEach.call(document.querySelectorAll('#f-types input'), function (c) { if (c.checked) types[c.value] = 1; });
    return { domain: $('f-domain').value, app: $('f-app').value, cls: $('f-cls').value, hasCls: $('f-cls').selectedIndex > 0, types: types, q: $('f-q').value.trim().normalize('NFKC').toLowerCase() };
  }
  function passStudent(s, f) { return !f.hasCls || s.cls === f.cls; }
  function filteredRows() {
    var f = filters();
    return allRows().filter(function (r) {
      if (f.domain && r.domain !== f.domain) return false;
      if (f.app && r.app !== f.app) return false;
      if (!passStudent(r.s, f) || !f.types[r.type]) return false;
      if (f.q) {
        var hay = [who(r.s), r.app, r.part, r.label, r.value].join(' ').normalize('NFKC').toLowerCase();
        if (hay.indexOf(f.q) < 0) return false;
      }
      return true;
    }).sort(function (a, b) {
      return FKR.compareStudent(a.s, b.s) || appOrder(a, b);
    });
  }

  /* ---------- 表 ---------- */
  var LIST_HEAD = ['組', '番号', '名前', '分野', '教材', '場面', '種類', '問い・項目', '内容', '日時', 'ファイル'];
  function listTable() {
    var rows = filteredRows(), f = filters();
    var tb = el('tbody'), prev = '';
    rows.forEach(function (r) {
      var k = FKR.studentKey(r.s), first = k !== prev; prev = k;
      var v = el('td', { class: 'v' });
      if (f.q) {
        var low = r.value.normalize('NFKC').toLowerCase(), i = low.indexOf(f.q);
        if (i >= 0 && r.value.length === low.length) v.append(r.value.slice(0, i), el('mark', { text: r.value.slice(i, i + f.q.length) }), r.value.slice(i + f.q.length));
        else v.textContent = r.value;
      } else v.textContent = r.value;
      tb.appendChild(el('tr', first ? { class: 'first' } : null, [
        el('td', { class: 'nw', text: r.s.cls }), el('td', { class: 'nw', text: r.s.num }), el('td', { class: 'nw', text: r.s.name }),
        el('td', { class: 'nw dom', text: r.domain }), el('td', { text: r.app }), el('td', { text: r.part }),
        el('td', null, [el('span', { class: 'tag tag-' + r.type, text: r.type })]), el('td', { text: r.label }), v,
        el('td', { class: 'nw', text: fmtAt(r.at) }), el('td', { class: 'muted', text: r.file })
      ]));
    });
    $('count').textContent = rows.length + ' 行(' + new Set(rows.map(function (r) { return FKR.studentKey(r.s); })).size + ' 人)';
    if (!rows.length) return el('div', { class: 'empty', text: files.length ? '条件に合う行がありません。' : 'まだファイルを読み込んでいません。' });
    return el('table', null, [el('thead', null, [el('tr', null, LIST_HEAD.map(function (h) { return el('th', { class: 'nw', text: h }); }))]), tb]);
  }
  function listCsv() {
    return [LIST_HEAD].concat(filteredRows().map(function (r) {
      return [r.s.cls, r.s.num, r.s.name, DOMAINS[r.domain], r.app, r.part, r.type, r.label, r.value, fmtAt(r.at), r.file];
    }));
  }

  /* 提出状況: 生徒 × 教材(数字はふりかえりの件数、○ は提出はあるがふりかえりの文がない、空らんは未提出) */
  function matrixData() {
    var f = filters(), students = {}, apps = {}, cell = {};
    allEntries().forEach(function (e) {
      if (f.domain && e.domain !== f.domain) return;
      if (f.app && e.app !== f.app) return;
      if (!passStudent(e.s, f)) return;
      if (f.q && who(e.s).normalize('NFKC').toLowerCase().indexOf(f.q) < 0) return;
      var sk = FKR.studentKey(e.s), ak = e.domain + '\u0001' + e.app;
      students[sk] = e.s; apps[ak] = e;
      var c = cell[sk + '\u0003' + ak] || (cell[sk + '\u0003' + ak] = { files: 0, n: 0 });
      c.files++; c.n = Math.max(c.n, e.n);
    });
    var sl = Object.keys(students).map(function (k) { return students[k]; }).sort(FKR.compareStudent);
    var al = Object.keys(apps).map(function (k) { return apps[k]; }).sort(appOrder);
    return { sl: sl, al: al, get: function (s, a) { return cell[FKR.studentKey(s) + '\u0003' + a.domain + '\u0001' + a.app]; } };
  }
  function matrixTable() {
    var m = matrixData();
    $('count').textContent = m.sl.length + ' 人 × ' + m.al.length + ' 教材 ・ 数字はふりかえりの文の数、○ は提出あり(ふりかえりの文なし)、－ は未提出';
    if (!m.sl.length) return el('div', { class: 'empty', text: files.length ? '条件に合う生徒がいません。' : 'まだファイルを読み込んでいません。' });
    var head = el('tr', null, [el('th', { text: '組・番号・名前' })].concat(m.al.map(function (a) { return el('th', { title: DOMAINS[a.domain], text: a.domain + ' ' + a.app }); })));
    var tb = el('tbody');
    m.sl.forEach(function (s) {
      tb.appendChild(el('tr', null, [el('td', { text: who(s) || '(名前なし)' })].concat(m.al.map(function (a) {
        var c = m.get(s, a);
        return el('td', c ? { text: c.n ? String(c.n) : '○' } : { class: 'none', text: '－' });
      }))));
    });
    return el('table', { class: 'matrix' }, [el('thead', null, [head]), tb]);
  }
  function matrixCsv() {
    var m = matrixData();
    return [['組', '番号', '名前'].concat(m.al.map(function (a) { return a.domain + ' ' + a.app; }))].concat(m.sl.map(function (s) {
      return [s.cls, s.num, s.name].concat(m.al.map(function (a) { var c = m.get(s, a); return c ? (c.n ? c.n : '○') : ''; }));
    }));
  }

  /* ---------- 画面 ---------- */
  function renderFiles() {
    var ok = files.filter(function (f) { return f.ok; }).length, ng = files.length - ok;
    $('file-box').hidden = !files.length;
    $('file-sum').textContent = '読み込んだファイル ' + files.length + ' 個(読めた ' + ok + ' 個' + (ng ? '・読めなかった ' + ng + ' 個' : '') + ')';
    if (ng) $('file-box').open = true;
    var ul = $('files'); ul.textContent = '';
    files.slice().sort(function (a, b) { return (a.ok === b.ok ? 0 : a.ok ? 1 : -1) || FKR.natural(a.name, b.name); }).forEach(function (f) {
      if (!f.ok) { ul.appendChild(el('li', { class: 'ng', text: '✕ ' + f.name + ' … ' + f.error + (f.format ? '(' + f.format + ')' : '') })); return; }
      var names = f.entries.map(function (e) { return who(e.student) || '名前なし'; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
      var nrow = f.entries.reduce(function (n, e) { return n + e.rows.length; }, 0);
      ul.appendChild(el('li', null, ['✓ ' + f.name + ' … ', el('span', { class: 'who', text: names.join('、') }),
        '・' + f.entries.map(function (e) { return e.app; }).join('、') + '(' + nrow + ' 行)' +
        (f.entries.some(function (e) { return e.fromFile; }) ? '・組・番号はファイル名から読み取り' : '') +
        (f.entries.some(function (e) { return !who(e.student); }) ? '・ファイルの中に名前がありません' : '')]));
    });
  }
  function render() {
    var v = $('view'); v.textContent = '';
    v.appendChild(tab === 'list' ? listTable() : matrixTable());
    document.querySelector('#f-types').style.display = tab === 'list' ? '' : 'none';
  }
  function refresh() { makeCanon(); renderFiles(); updateFilters(); render(); }

  Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (b) {
    b.addEventListener('click', function () {
      tab = b.getAttribute('data-tab');
      Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      render();
    });
  });
  $('f-domain').addEventListener('change', function () { updateFilters(); render(); });
  ['f-app', 'f-cls'].forEach(function (id) { $(id).addEventListener('change', render); });
  $('f-types').addEventListener('change', render);
  $('f-q').addEventListener('input', render);
  $('print').addEventListener('click', function () { window.print(); });
  $('csv').addEventListener('click', function () {
    var d = new Date(), stamp = d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
    var blob = new Blob([FKR.csv(tab === 'list' ? listCsv() : matrixCsv())], { type: 'text/csv' });
    var a = el('a', { href: URL.createObjectURL(blob), download: (tab === 'list' ? '振り返り一覧_' : '提出状況_') + stamp + '.csv' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  refresh();
})();
</script>
</body>
</html>
