<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>製図トレーナー</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/eduit-frame.css">
<link rel="stylesheet" href="../common/base.css">
<link rel="stylesheet" href="style.css">
<script src="../eduit-info.js"></script>
<script>window.EDUIT_INFO = window.EDUIT_INFO || {}; EDUIT_INFO.app = { name: 'M4 製図トレーナー' };</script>
<script src="../../shared/eduit-frame.js"></script>
</head>
<body>
<header id="g-header"></header>
<main class="m4-main">
  <div data-g-tabs>
    <div class="g-tablist" role="tablist" aria-label="練習をえらぶ">
      <button role="tab" data-tab="quiz"><span class="num">1</span>三面図クイズ</button>
      <button role="tab" data-tab="build"><span class="num">2</span>立体づくり</button>
      <button role="tab" data-tab="draw"><span class="num">3</span>三面図をかく</button>
      <button role="tab" data-tab="iso"><span class="num">4</span>等角図をかく</button>
      <button role="tab" data-tab="terms"><span class="num">5</span>線と記号</button>
      <button role="tab" data-tab="record"><span class="num">6</span>記録・ふりかえり</button>
    </div>
    <section data-panel="quiz"></section>
    <section data-panel="build" hidden></section>
    <section data-panel="draw" hidden></section>
    <section data-panel="iso" hidden></section>
    <section data-panel="terms" hidden></section>
    <section data-panel="record" hidden></section>
  </div>
  <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
</main>
<script src="../common/ruby-dict.js"></script>
<script src="../common/core.js"></script>
<script src="js/drawing-core.js"></script>
<script src="js/view3d.js"></script>
<script src="js/svgviews.js"></script>
<script src="js/sketch.js"></script>
<script src="js/terms-data.js"></script>
<script src="js/ruby-words.js"></script>
<script src="js/app.js"></script>
</body>
</html>
