<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提出ファイル一覧ビューア(先生用)</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/eduit-frame.css">
<link rel="stylesheet" href="../common/base.css">
<link rel="stylesheet" href="style.css">
<script src="../eduit-info.js"></script>
<script>window.EDUIT_INFO = window.EDUIT_INFO || {}; EDUIT_INFO.app = { name: '提出ファイル一覧ビューア(先生用)' };</script>
<script src="../../shared/eduit-frame.js"></script>
</head>
<body class="tv">
<header id="g-header"></header>
<main>
  <section class="card">
    <h2>生徒のファイルを読み込む</h2>
    <p>生徒が書き出した JSON ファイル(メニューの「すべて書き出す」や、各アプリの「書き出し」)を、まとめて選んでください。フォルダごと選ぶこともできます。
      読み込んだ内容はこの画面の中だけで使い、端末には保存しません。</p>
    <div class="g-row">
      <label class="btn primary tv-pick">ファイルを選ぶ(いくつでも)<input type="file" id="files" accept=".json,application/json" multiple hidden></label>
      <label class="btn tv-pick">フォルダを選ぶ<input type="file" id="folder" webkitdirectory multiple hidden></label>
      <button class="btn" type="button" id="csv" disabled>表を CSV で保存</button>
      <button class="btn" type="button" id="print" disabled>印刷</button>
      <button class="btn danger" type="button" id="clear" disabled>読み込みをやめる(一覧を空にする)</button>
    </div>
    <div class="tv-drop" id="drop">ここにファイルをドラッグして置いても読み込めます</div>
    <p class="g-muted" id="summary" aria-live="polite"></p>
    <ul class="tv-errors" id="errors"></ul>
  </section>

  <div data-g-tabs id="views" hidden>
    <div class="ef-apptabs" role="tablist" aria-label="一覧の種類">
      <button class="ef-apptab" role="tab" data-tab="students">生徒ごと</button>
      <button class="ef-apptab" role="tab" data-tab="apps">アプリごと</button>
      <button class="ef-apptab" role="tab" data-tab="detail">くわしく見る</button>
    </div>
    <section data-panel="students" id="p-students"></section>
    <section data-panel="apps" id="p-apps"></section>
    <section data-panel="detail" id="p-detail"></section>
  </div>
</main>
<script src="../common/ruby-dict.js"></script>
<script src="../common/core.js"></script>
<script src="../common/apps.js"></script>
<script src="summary.js"></script>
<script src="app.js"></script>
</body>
</html>
