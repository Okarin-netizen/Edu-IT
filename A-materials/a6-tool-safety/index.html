<!doctype html>
<html lang="ja">
<head>

<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/eduit-frame.css">
<link rel="stylesheet" href="../common/base.css">

<body>
<header id="g-header"></header>
<main class="ef-main is-wide">
  <p class="ef-note is-warn a6-notice" id="notice"></p>
  <div data-g-tabs>
    <div class="ef-apptabs" role="tablist" aria-label="学習のメニュー">
      <button class="ef-apptab" role="tab" data-tab="tools"><span class="num">①</span>工具の手順</button>
      <button class="ef-apptab" role="tab" data-tab="check"><span class="num">②</span>作業前チェック</button>

      <button class="ef-apptab" role="tab" data-tab="rubric"><span class="num">⑤</span>実技の評価</button>
      <button class="ef-apptab" role="tab" data-tab="records">記録</button>
    </div>
    <section data-panel="tools" id="p-tools"></section>
    <section data-panel="check" id="p-check"></section>
    <section data-panel="kyt" id="p-kyt"></section>
    <section data-panel="quiz" id="p-quiz"></section>
    <section data-panel="rubric" id="p-rubric"></section>
    <section data-panel="records" id="p-records"></section>
  </div>
