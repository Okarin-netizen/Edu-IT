<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問題解決ノート</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/eduit-frame.css">
<link rel="stylesheet" href="../common/base.css">
<link rel="stylesheet" href="../../shared/mondai-note/mondai-note.css">
<script src="../eduit-info.js"></script>
<script>window.EDUIT_INFO = window.EDUIT_INFO || {}; EDUIT_INFO.app = { name: 'A8 問題解決ノート' };</script>
<script src="../../shared/eduit-frame.js"></script>
</head>
<body>
<header id="g-header"></header>
<main>
  <div data-g-tabs>
    <div class="g-tablist" role="tablist" aria-label="問題解決ノートのページ">
      <button role="tab" data-tab="intro" type="button">はじめに</button>
      <button role="tab" data-tab="find" type="button"><span class="num">①</span>問題の発見</button>
      <button role="tab" data-tab="eval" type="button"><span class="num">②</span>評価、改善・修正</button>
      <button role="tab" data-tab="opt" type="button"><span class="num">③</span>技術の最適化</button>
      <button role="tab" data-tab="refl" type="button" data-ef-reflect>振り返り</button>
      <button role="tab" data-tab="rec" type="button">記録</button>
    </div>
    <section data-panel="intro" id="p-intro"></section>
    <section data-panel="find" id="p-find" hidden></section>
    <section data-panel="eval" id="p-eval" hidden></section>
    <section data-panel="opt" id="p-opt" hidden></section>
    <section data-panel="refl" id="p-refl" hidden></section>
    <section data-panel="rec" id="p-rec" hidden></section>
  </div>
  <p class="g-muted no-print" id="save-state" aria-live="polite"></p>
</main>
<script src="../common/ruby-dict.js"></script>
<script src="../common/core.js"></script>
<script src="../common/apps.js"></script>
<script src="../../shared/mondai-note/mondai-note-data.js"></script>
<script src="../../shared/mondai-note/mondai-note.js"></script>
<script src="app.js"></script>
</body>
</html>
