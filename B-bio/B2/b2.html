<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2 動物飼育・水産ミニシミュレータ</title>
<link rel="stylesheet" href="../../shared/eduit-frame.css">
<script src="../eduit-info.js"></script>
<script>EDUIT_INFO.app = { name: 'B2 動物飼育・水産ミニシミュレータ' };</script>
<script src="../../shared/eduit-frame.js"></script>
<style>
body{margin:0;background:var(--ef-bg)}
#b2app{
  /* 共通の枠(shared/eduit-frame.css)の色にそろえる */
  --b2-bg:var(--ef-bg);--b2-card:var(--ef-surface);--b2-ink:var(--ef-text);--b2-sub:var(--ef-muted);--b2-line:#cfdccc;
  --b2-main:var(--ef-accent);--b2-main-d:#1b5e20;--b2-soft:#e8f5e9;--b2-ok:#2e7d32;--b2-warn:#a86400;--b2-bad:#b23b3b;
  --b2-fs:18px;--b2-headh:120px;--b2-barh:0px;
  font-family:var(--ef-font);
  font-size:var(--b2-fs);line-height:1.65;color:var(--b2-ink);background:var(--b2-bg);
  min-height:100vh;-webkit-text-size-adjust:100%;
}
#b2app *{box-sizing:border-box}
#b2app.b2-noruby rt{display:none}
#b2app rt{font-size:.55em;color:var(--b2-sub)}
#b2app h1,#b2app h2,#b2app h3{line-height:1.4;margin:.3em 0 .5em}
#b2app h1{font-size:1.3em}
#b2app h2{font-size:1.2em;color:var(--b2-main-d)}
#b2app h3{font-size:1.05em}
#b2app p{margin:.4em 0}
#b2app button,#b2app select,#b2app input,#b2app textarea{font:inherit;color:inherit}
#b2app button{cursor:pointer;touch-action:manipulation}
/* 見出しは共通の枠(.ef-header)。タブの帯は分野の色 */
#b2app .b2-head{position:sticky;top:0;z-index:20;background:var(--ef-accent);color:#fff;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#b2app .b2-head-row{flex-wrap:wrap}
#b2app .b2-title{flex:1 1 auto;min-width:200px;margin:0;font-size:18px;line-height:1.3}
#b2app .b2-title small{margin-left:.4em}
@media (max-height:800px){#b2app .b2-title small{display:none}}
#b2app .ef-btn{font:600 15px/1.2 var(--ef-font);color:var(--ef-text)}
#b2app .ef-btn[aria-pressed="true"]{color:var(--ef-accent-ink)}
#b2app .b2-tools button{min-height:44px;min-width:48px}
#b2app .b2-tools button:disabled{opacity:.4;cursor:not-allowed}
/* メニュー(教材集)の中では見出し行を隠し、タブの帯をいちばん上にする(K3) */
html.kz-embed #b2app .b2-head-row{display:none}
html.kz-embed #b2app .b2-head{padding-top:6px}
html.kz-embed #b2app .b2-nav{margin-top:0}
#b2app .b2-nav{display:flex;gap:4px;margin-top:8px;padding:0 14px}
#b2app .b2-nav button{flex:1 1 0;min-width:0;background:transparent;border:0;color:#fff;padding:8px 8px;min-height:52px;border-radius:12px 12px 0 0;font-weight:700;font-size:min(.92em,20px);line-height:1.3;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
#b2app .b2-nav button[data-tab="sim"]{flex-grow:1.7}
#b2app .b2-nav button[aria-selected="true"]{background:var(--b2-bg);color:var(--b2-main-d)}
#b2app .b2-nav rt{color:inherit;opacity:.85}
/* スマホ: タブの名前を折り返さず、帯を1行にして横にスクロール */
@media (max-width:640px){#b2app .b2-nav{overflow-x:auto;scrollbar-width:none;padding:0 8px}#b2app .b2-nav::-webkit-scrollbar{display:none}#b2app .b2-nav button{flex:0 0 auto;white-space:nowrap;min-height:48px;padding:6px 10px}#b2app .b2-nav wbr{display:none}}
#b2app main{max-width:1240px;margin:0 auto;padding:14px 14px 80px}
#b2app section[hidden]{display:none!important}
#b2app section,#b2app .b2-card,#b2app #b2-qexp{scroll-margin-top:calc(var(--b2-headh) + var(--b2-barh) + 8px)}
#b2app .b2-card{background:var(--b2-card);border:1px solid var(--b2-line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
#b2app .b2-note{background:#fff8e6;border:1px solid #ecd59c;border-radius:12px;padding:10px 14px;margin:10px 0}
#b2app .b2-btn{display:inline-block;text-align:center;vertical-align:middle;min-height:48px;line-height:1.5;padding:8px 18px;border-radius:12px;border:2px solid var(--b2-main);background:#fff;color:var(--b2-main-d);font-weight:700}
#b2app .b2-btn.b2-pri{background:var(--b2-main);color:#fff}
#b2app .b2-btn.b2-pri rt{color:#e8f5e9}
#b2app .b2-btn:disabled{opacity:.45;cursor:not-allowed}
#b2app .b2-btn:active:not(:disabled){transform:translateY(1px)}
#b2app .b2-btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
#b2app :focus-visible{outline:3px solid #f0a020;outline-offset:2px}
/* 対象選択 */
#b2app .b2-species{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
#b2app .b2-sp{background:#fff;border:2px solid var(--b2-line);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:200px}
#b2app .b2-sp:hover{border-color:var(--b2-main)}
#b2app .b2-sp.b2-cur{border-color:var(--b2-main);box-shadow:0 0 0 3px var(--b2-soft)}
#b2app .b2-sp svg{width:100%;height:96px}
#b2app .b2-sp b{font-size:1.1em}
#b2app .b2-sp span{font-size:.85em;color:var(--b2-sub)}
#b2app .b2-tag{display:inline-block;font-size:.75em;padding:1px 8px;border-radius:99px;background:var(--b2-soft);color:var(--b2-main-d);font-weight:700}
#b2app .b2-sp .b2-tag{align-self:flex-start;color:var(--b2-main-d);font-size:.75em}
#b2app .b2-sp .b2-done{align-self:flex-start;font-size:.8em;color:#7a5a00;font-weight:700}
/* シミュレーション */
#b2app .b2-simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
#b2app #b2-simbar{position:sticky;top:var(--b2-headh);z-index:15;background:var(--b2-bg);margin:-14px -14px 10px;padding:10px 14px;border-bottom:1px solid var(--b2-line)}
#b2app .b2-day{font-size:1.15em;font-weight:700}
#b2app .b2-daybar{flex:1 1 160px;height:12px;background:#dfe8dc;border-radius:6px;overflow:hidden;min-width:120px}
#b2app .b2-daybar i{display:block;height:100%;background:var(--b2-main)}
#b2app .b2-simgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"vis set" "met set";gap:0 14px;align-items:start}
#b2app .b2-g-vis{grid-area:vis}#b2app .b2-g-met{grid-area:met}#b2app .b2-g-set{grid-area:set}
@media (max-width:900px){#b2app .b2-simgrid{grid-template-columns:1fr;grid-template-rows:none;grid-template-areas:"vis" "set" "met"}}
#b2app .b2-vis{width:100%;height:auto;display:block;border-radius:10px}
#b2app .b2-meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:520px){#b2app .b2-meters{grid-template-columns:1fr}}
#b2app.b2-big .b2-meters{grid-template-columns:1fr}
#b2app .b2-meter{border:1px solid var(--b2-line);border-radius:10px;padding:6px 10px;background:#fbfdfa}
#b2app .b2-meter.b2-chg{animation:b2chg 1.2s ease-out}
@keyframes b2chg{0%{background:#fff3c4;box-shadow:0 0 0 3px #f0c040}100%{background:#fbfdfa;box-shadow:none}}
#b2app .b2-meter-top{display:flex;flex-direction:column;gap:0;font-size:.88em}
#b2app .b2-meter-top b{font-size:1.05em}
#b2app .b2-bar{height:10px;border-radius:5px;background:#e3ebe1;overflow:hidden;margin-top:3px}
#b2app .b2-bar i{display:block;height:100%}
#b2app .b2-lv{font-size:.78em;font-weight:700;padding:0 6px;border-radius:6px;white-space:nowrap}
#b2app .b2-lv.ok{color:var(--b2-ok);background:#e3f4e5}
#b2app .b2-lv.warn{color:var(--b2-warn);background:#fdf0dc}
#b2app .b2-lv.bad{color:var(--b2-bad);background:#fbe5e5}
#b2app .b2-look{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
#b2app .b2-look div{background:var(--b2-soft);border-radius:10px;padding:6px 8px;text-align:center;font-size:.9em}
#b2app .b2-look div b{display:block;font-size:1.05em}
#b2app .b2-signs{margin:8px 0 0;padding-left:1.2em}
#b2app .b2-signs li{margin:2px 0}
#b2app .b2-ctl{margin-bottom:12px}
#b2app .b2-ctl-label{display:block;font-weight:700;margin-bottom:4px;overflow:hidden}
#b2app .b2-ctl-label small{float:right;font-weight:400;color:var(--b2-sub);font-size:.8em;margin-left:8px}
#b2app .b2-seg{display:flex;flex-wrap:wrap;gap:4px}
#b2app .b2-seg button{flex:1 1 0;min-width:64px;min-height:48px;border:2px solid var(--b2-line);background:#fff;border-radius:10px;padding:4px 6px;font-size:.88em;line-height:1.25}
#b2app .b2-seg button[aria-pressed="true"]{border-color:var(--b2-main);background:var(--b2-main);color:#fff;font-weight:700}
#b2app .b2-seg button[aria-pressed="true"] rt{color:#e8f5e9}
#b2app .b2-range{display:flex;align-items:center;gap:6px}
#b2app .b2-range input[type=range]{flex:1;min-width:0;height:44px;accent-color:var(--b2-main)}
#b2app .b2-range button{width:48px;height:48px;border-radius:10px;border:2px solid var(--b2-line);background:#fff;font-size:1.3em;font-weight:700;flex:none}
#b2app .b2-range output{min-width:4.2em;text-align:right;font-weight:700;font-size:1.05em}
#b2app .b2-act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#b2app .b2-msg{padding:10px 14px;border-radius:12px;margin:8px 0;border:1px solid}
#b2app .b2-msg.info{background:#eef7ee;border-color:#b9d8bb}
#b2app .b2-msg.warn{background:#fff6e5;border-color:#efcf8b}
#b2app .b2-log{max-height:300px;overflow:auto;margin:0;padding:0;list-style:none;font-size:.9em}
#b2app .b2-log li{padding:4px 2px;border-bottom:1px dashed var(--b2-line)}
#b2app .b2-log li b{color:var(--b2-main-d);margin-right:6px}
#b2app .b2-log li.b2-sum{color:var(--b2-sub)}
#b2app canvas{width:100%;height:220px;display:block}
#b2app .b2-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.85em;color:var(--b2-sub)}
#b2app .b2-legend span::before{content:"";display:inline-block;width:26px;height:0;border-top:3px solid currentColor;vertical-align:middle;margin-right:4px}
#b2app .b2-legend .l1{color:#2e7d32}#b2app .b2-legend .l2{color:#9a6a1a}#b2app .b2-legend .l2::before{border-top-style:dashed}
#b2app .b2-legend .l3{color:#6a4fa3}#b2app .b2-legend .l3::before{border-top-style:dotted;border-top-width:4px}
#b2app .b2-result{border:3px solid var(--b2-main);background:#f3faf3}
#b2app .b2-stars{font-size:1.6em;letter-spacing:4px;color:#d39b00}
#b2app .b2-cause{background:#fff6e5;border:1px solid #efcf8b;border-radius:12px;padding:8px 14px;margin:8px 0}
#b2app .b2-small{font-size:.85em;color:var(--b2-sub)}
#b2app .b2-cause ol{margin:4px 0;padding-left:1.4em}
#b2app .b2-costchip{display:inline-flex;flex-wrap:wrap;gap:2px 8px;align-items:center;background:#fff8e6;border:1px solid #ecd59c;border-radius:99px;padding:4px 12px;font-size:.9em;font-weight:700}
#b2app .b2-costtop{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
#b2app .b2-costtop div{flex:1 1 200px;background:#fff8e6;border:1px solid #ecd59c;border-radius:12px;padding:8px 12px}
#b2app .b2-costtop b{font-size:1.25em}
#b2app .b2-tablewrap{overflow-x:auto}
#b2app table.b2-costtbl{border-collapse:collapse;width:100%;font-size:.92em;margin:6px 0}
#b2app table.b2-costtbl th,#b2app table.b2-costtbl td{border:1px solid var(--b2-line);padding:4px 8px;text-align:right}
#b2app table.b2-costtbl th:first-child,#b2app table.b2-costtbl td:first-child{text-align:left}
#b2app table.b2-costtbl thead th{background:var(--b2-soft)}
#b2app table.b2-costtbl tr.b2-tot td{font-weight:700;background:#fbfdfa}
#b2app .b2-story{background:#fff;border:2px solid var(--b2-main);border-radius:12px;padding:10px 16px;margin:10px 0}
#b2app .b2-story p{margin:.4em 0;line-height:1.8}
#b2app .b2-costmsg{background:#fff8e6;border:1px solid #ecd59c;border-radius:12px;padding:8px 14px;margin:8px 0}
/* クイズ */
#b2app .b2-qcat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
#b2app .b2-qcat>div{display:flex;flex-direction:column;gap:6px}
#b2app .b2-qcat button.b2-qbtn{min-height:90px;border-radius:14px;border:2px solid var(--b2-line);background:#fff;text-align:left;padding:10px 14px;flex:1}
#b2app .b2-qcat button b{display:block;font-size:1.05em}
#b2app .b2-qcat button span{font-size:.85em;color:var(--b2-sub)}
#b2app .b2-qscene{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:760px){#b2app .b2-qscene{grid-template-columns:1fr}}
#b2app .b2-choices{display:grid;gap:8px;margin-top:10px}
#b2app .b2-choices button{min-height:56px;text-align:left;padding:8px 14px;border-radius:12px;border:2px solid var(--b2-line);background:#fff}
#b2app .b2-choices button.b2-right{border-color:var(--b2-ok);background:#e9f6ea}
#b2app .b2-choices button.b2-wrong{border-color:var(--b2-bad);background:#fbeaea}
#b2app .b2-choices button:disabled{cursor:default;opacity:1}
#b2app .b2-explain{margin-top:10px;padding:10px 14px;border-radius:12px;background:#eef7ee;border:1px solid #b9d8bb}
#b2app .b2-miss li{margin-bottom:8px}
#b2app .b2-miss details{margin:4px 0}
/* 計画書・振り返り */
#b2app label.b2-f{display:block;font-weight:700;margin:10px 0 4px}
#b2app label.b2-f small{font-weight:400;color:var(--b2-sub)}
#b2app input[type=text],#b2app select,#b2app textarea{width:100%;min-height:48px;border:2px solid var(--b2-line);border-radius:10px;padding:8px 10px;background:#fff}
#b2app textarea{min-height:110px;resize:vertical;line-height:1.6}
#b2app .b2-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
#b2app .b2-who{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2fr);gap:10px}
@media (max-width:520px){#b2app .b2-who{grid-template-columns:1fr 1fr}#b2app .b2-who>div:last-child{grid-column:1/-1}}
#b2app table.b2-week{border-collapse:collapse;width:100%;text-align:center;font-size:.92em}
#b2app table.b2-week th,#b2app table.b2-week td{border:1px solid var(--b2-line);padding:2px}
#b2app table.b2-week th{background:var(--b2-soft)}
#b2app .b2-chk{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;cursor:pointer}
#b2app .b2-chk input{width:26px;height:26px;accent-color:var(--b2-main)}
#b2app .b2-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 12px}
#b2app .b2-checks label{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
#b2app .b2-checks input{width:26px;height:26px;flex:none;accent-color:var(--b2-main)}
#b2app .b2-eval{display:grid;gap:8px}
#b2app .b2-eval-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr);gap:8px;align-items:center;border-bottom:1px dashed var(--b2-line);padding-bottom:8px}
@media (max-width:700px){#b2app .b2-eval-row{grid-template-columns:1fr}}
#b2app .b2-saved{font-size:.85em;color:var(--b2-ok);min-height:1.4em}
#b2app .b2-pval{display:none}
#b2app .b2-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f3320;color:#fff;padding:10px 18px;border-radius:12px;z-index:50;font-size:.95em;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .25s}
#b2app .b2-toast.show{opacity:1}
#b2app details{border:1px solid var(--b2-line);border-radius:12px;padding:8px 12px;background:#fff;margin:8px 0}
#b2app summary{font-weight:700;cursor:pointer;min-height:48px;display:list-item;padding:10px 0;box-sizing:border-box}
#b2app .b2-summary-box{background:#f5f9f4;border-radius:10px;padding:8px 12px;font-size:.92em}
/* アニメーション(やさしく) */
#b2app .b2-swim{animation:b2swim 3s ease-in-out infinite}
#b2app .b2-bob{animation:b2bob 2.4s ease-in-out infinite}
#b2app .b2-bub{animation:b2bub 2.6s linear infinite}
@keyframes b2swim{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
@keyframes b2bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes b2bub{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-170px);opacity:0}}
@media (prefers-reduced-motion:reduce){#b2app .b2-swim,#b2app .b2-bob,#b2app .b2-bub,#b2app .b2-meter.b2-chg{animation:none}}
@media print{
  #b2app{min-height:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #b2app .b2-head,#b2app .b2-btns,#b2app .b2-noprint,#b2app .b2-toast{display:none!important}
  #b2app #b2-simbar{position:static}
  #b2app main{padding:0}
  #b2app .b2-card{break-inside:auto;border-color:#999}
  #b2app h2,#b2app label.b2-f{break-after:avoid}
  #b2app input[type=text],#b2app select{display:none!important}
  #b2app .b2-pval{display:block;border:1px solid #999;border-radius:6px;padding:4px 8px;min-height:2em;white-space:pre-wrap;word-break:break-word}
  #b2app .b2-pval.b2-empty{color:#666}
  #b2app .b2-seg button[aria-pressed="true"]{outline:3px solid #000;outline-offset:-3px}
  #b2app .b2-meter.b2-chg{animation:none}
}
</style>
</head>
<body>
<div id="b2app">
  <header class="b2-head" id="b2-head" data-ef-autohide>
    <div class="b2-head-row ef-header">
      <a class="ef-btn ef-back" href="../dist/生物育成教材集.html" title="教材集のメニューを開く">◀ メニュー</a>
      <h1 class="b2-title ef-title"><span class="ef-code">B2</span> <span class="ef-title-name">動物飼育・水産ミニシミュレータ</span></h1>
      <div class="b2-tools ef-tools">
        <button type="button" class="ef-btn ef-toggle" id="b2-ruby" aria-pressed="true" title="ふりがなの表示・非表示">ふりがな</button>
        <button type="button" class="ef-btn ef-size" id="b2-size">文字</button>
      </div>
    </div>
    <nav class="b2-nav" role="tablist" aria-label="画面の切りかえ">
      <button type="button" role="tab" data-tab="home">はじめに</button>
      <button type="button" role="tab" data-tab="sim">① 飼育<wbr>シミュレーション</button>
      <button type="button" role="tab" data-tab="quiz">② 診断<wbr>クイズ</button>
      <button type="button" role="tab" data-tab="plan">③ 飼育<wbr>計画書</button>
      <button type="button" role="tab" data-tab="refl" data-ef-reflect>振り返り</button>
    </nav>
  </header>
  <main>
    <section id="b2-sec-home" data-sec="home"></section>
    <section id="b2-sec-sim" data-sec="sim" hidden></section>
    <section id="b2-sec-quiz" data-sec="quiz" hidden></section>
    <section id="b2-sec-plan" data-sec="plan" hidden></section>

      }
      var ok = document.createElement('button'); ok.type = 'button'; ok.className = 'kzd-ok' + (opt.danger ? ' kzd-danger' : '');
      ok.textContent = opt.ok || 'OK'; btns.appendChild(ok);
      box.appendChild(p); box.appendChild(btns); back.appendChild(box);
      var prev = document.activeElement;

        back.remove();
        try { if (prev && prev.focus) prev.focus({preventScroll:true}); } catch(e) {}

      ((opt.danger && cancel) ? cancel : ok).focus({preventScroll:true});
    });

<!--
  kz-prefs : 教材集ぜんぶで共通の「ふりがな」「文字の大きさ」設定 (K1)
  ------------------------------------------------------------------
  入れ方: kzConfirm の <script> のすぐ後ろに、このファイルの <script> をそのまま貼る。
          2回入れても害はない(window.kzPrefs があれば何もしない)。ES5。外部通信なし。

  保存キー(localStorage):
    hub_ruby  '1' = ふりがなあり / '0' = なし
    hub_fs    文字の大きさ(px の整数。14〜26、2きざみ、初期 18)

  API (グローバルは window.kzPrefs だけ):
    kzPrefs.get()            → {ruby: true|false|null, fs: 14..26|null}
                               キーが無い(まだ一度も設定していない)ときは null。
                               localStorage が使えないときは、このページ内のメモリ上の値を返す。
    kzPrefs.set({ruby?, fs?}) → 指定した項目だけ書きこみ、変わっていればリスナーに知らせる。
                               fs は clampFs で丸める。ほかの画面(親・ほかの iframe)には
                               storage イベント＋postMessage(予備)で伝わる。戻り値は get()。
    kzPrefs.on(fn)           → fn(prefs) を登録。自分の set()、ほかの画面での変更
                               (storage イベント / postMessage)のときに呼ばれる。
                               同じ値が続けて来たときは呼ばない。戻り値は登録解除の関数。
    kzPrefs.clampFs(n)       → 14〜26 の偶数に丸めた数(数でなければ 18)。
    kzPrefs.bump(d)          → 文字サイズを d 段(+1 / -1)変える。新しい fs を返す。
    kzPrefs.bind(rubyBtn, decBtn, incBtn)
                             → K2 の3つのボタンをつなぐ(どれか null 可)。
                               クリックで set()、aria-pressed と disabled(上限・下限)を自動更新。
    kzPrefs.embed            → 教材集(メニュー)の iframe の中なら true。
                               true のとき <html> に class "kz-embed" をすぐ付ける(K3 の CSS 用)。
    kzPrefs.FS_MIN=14, FS_MAX=26, FS_STEP=2, FS_DEFAULT=18

  教材側の使い方の例:
    var p = kzPrefs.get();
    var ruby = (p.ruby !== null) ? p.ruby : 自分の古い設定;   // 古い設定は null のときだけ使う
    var fs   = (p.fs   !== null) ? p.fs   : 自分の古い設定を clampFs したもの;
    apply(ruby, fs);
    kzPrefs.on(function(p){ apply(p.ruby !== false, p.fs || 18); });

<script data-kz-prefs>
(function(){
  if (window.kzPrefs) return;
  var KR = 'hub_ruby', KF = 'hub_fs', MIN = 14, MAX = 26, STEP = 2, DEF = 18;
  var mem = {ruby: null, fs: null};          /* localStorage が使えないときの予備 */
  var fns = [], last = '';
  var embed = false;
  try { embed = window.self !== window.top; } catch (e) { embed = true; }
  if (embed) { try { document.documentElement.className += (document.documentElement.className ? ' ' : '') + 'kz-embed'; } catch (e) {} }

  function clampFs(n){
    n = Number(n);
    if (!isFinite(n)) return DEF;
    n = Math.round(n / STEP) * STEP;
    return n < MIN ? MIN : (n > MAX ? MAX : n);
  }
  function lsGet(k){ try { return window.localStorage.getItem(k); } catch (e) { return undefined; } }
  function lsSet(k, v){ try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function get(){
    var r = lsGet(KR), f = lsGet(KF), o = {ruby: mem.ruby, fs: mem.fs};
    if (r !== undefined) o.ruby = (r === '1') ? true : (r === '0' ? false : null);
    if (f !== undefined) o.fs = (f === null || f === '' || isNaN(parseInt(f, 10))) ? null : clampFs(parseInt(f, 10));
    return o;
  }
  function notify(p){
    var key = String(p.ruby) + '|' + String(p.fs);
    if (key === last) return;
    last = key;
    for (var i = 0; i < fns.length; i++) { try { fns[i](p); } catch (e) { if (window.console) console.error(e); } }
  }
  function post(win, p){ try { win.postMessage({kzPrefs: {ruby: p.ruby, fs: p.fs}}, '*'); } catch (e) {} }
  function broadcast(p, except){
    /* 予備の伝え方: 親と子の iframe に postMessage(storage イベントが届かない環境のため) */
    try { if (embed && window.parent && window.parent !== except) post(window.parent, p); } catch (e) {}
    try { for (var i = 0; i < window.frames.length; i++) { if (window.frames[i] !== except) post(window.frames[i], p); } } catch (e) {}
  }
  function set(o){
    o = o || {};
    if (o.ruby !== undefined && o.ruby !== null) { mem.ruby = !!o.ruby; lsSet(KR, o.ruby ? '1' : '0'); }
    if (o.fs !== undefined && o.fs !== null) { mem.fs = clampFs(o.fs); lsSet(KF, String(mem.fs)); }
    var p = get();
    if (p.ruby === null) p.ruby = mem.ruby;
    if (p.fs === null) p.fs = mem.fs;
    notify(p);
    broadcast(p, null);
    return p;
  }
  function on(fn){
    if (typeof fn === 'function') fns.push(fn);
    return function(){ for (var i = fns.length - 1; i >= 0; i--) if (fns[i] === fn) fns.splice(i, 1); };
  }
  function cur(){ var p = get(); return {ruby: p.ruby !== false, fs: p.fs || DEF}; }
  function bump(d){ return set({fs: cur().fs + (d > 0 ? STEP : -STEP)}).fs || DEF; }
  function bind(rb, dec, inc){
    function upd(){
      var c = cur();
      if (rb) rb.setAttribute('aria-pressed', c.ruby ? 'true' : 'false');
      if (dec) dec.disabled = c.fs <= MIN;
      if (inc) inc.disabled = c.fs >= MAX;
    }
    if (rb) rb.addEventListener('click', function(){ set({ruby: !cur().ruby}); });
    if (dec) dec.addEventListener('click', function(){ bump(-1); });
    if (inc) inc.addEventListener('click', function(){ bump(1); });
    on(upd); upd();
    return upd;
  }

  window.addEventListener('storage', function(e){
    if (e.key !== KR && e.key !== KF && e.key !== null) return;
    notify(get());
  });
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || typeof d !== 'object' || !d.kzPrefs || typeof d.kzPrefs !== 'object') return;
    var q = d.kzPrefs;
    if (typeof q.ruby === 'boolean') mem.ruby = q.ruby;
    if (typeof q.fs === 'number') mem.fs = clampFs(q.fs);
    var p = get();
    if (p.ruby === null) p.ruby = mem.ruby;
    if (p.fs === null) p.fs = mem.fs;
    notify(p);
    /* メニュー(いちばん上)は、ほかの iframe にも伝える */
    if (!embed) { try { for (var i = 0; i < window.frames.length; i++) if (window.frames[i] !== e.source) post(window.frames[i], p); } catch (err) {} }
  });

  var p0 = get(); last = String(p0.ruby) + '|' + String(p0.fs);
  window.kzPrefs = {get: get, set: set, on: on, clampFs: clampFs, bump: bump, bind: bind, embed: embed,
    FS_MIN: MIN, FS_MAX: MAX, FS_STEP: STEP, FS_DEFAULT: DEF};
})();
</script>

    var ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?'コピーしました':'コピーできませんでした')}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(function(){toast('コピーしました')},fallback)}else fallback();
}
function p2(n){return ('0'+n).slice(-2)}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function nowStamp(){var d=new Date();return today()+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function savedLabel(stamp){if(!stamp)return '';var m=/^(\d{4}-\d\d-\d\d) (\d\d:\d\d)$/.exec(stamp);if(!m)return '';
  return '✓ 最後に保存 '+(m[1]===today()?m[2]:(+m[1].slice(5,7))+'/'+(+m[1].slice(8))+' '+m[2])}
/* 印刷用:input・select の値を文字で出す(K5。textarea は kzPrintText) */
function printVals(el){
  $$('input[type=text],select',el||root).forEach(function(i){
    var d=i.nextElementSibling;
    if(!d||!d.classList||!d.classList.contains('b2-pval')){d=document.createElement('div');d.className='b2-pval';d.setAttribute('aria-hidden','true');i.parentNode.insertBefore(d,i.nextSibling)}
    var v=i.tagName==='SELECT'?(i.value?i.options[i.selectedIndex].text:''):i.value;
    d.textContent=v.replace(/\s+/g,'')?v:'(未記入)';d.classList.toggle('b2-empty',!v.replace(/\s+/g,''));
  });
}
function printSync(el){printVals(el);if(window.kzPrintText)kzPrintText(el||root)}
root.addEventListener('input',function(e){if(e.target.matches&&e.target.matches('input[type=text]'))printVals(e.target.parentNode)});
root.addEventListener('change',function(e){if(e.target.matches&&e.target.matches('select'))printVals(e.target.parentNode)});
window.addEventListener('beforeprint',function(){printSync(root)});

var FEED_AMT=[0,0.5,1,1.3,2.2];
var FEED_LABEL=['なし','少なめ','適量','多め','とても多い'];

/* ================= コスト(お金と手間) =================
   金額は学習用のおおよその目安(円)。手間は世話にかかる時間(分)。
   まわりの温度を AMB℃ として、それより温めたり冷やしたりするのに電気代がかかる。水そう・小屋などの道具代は入れない */
var AMB=20;
var COST={
  medaka:{feed:0.3,water:10,wall:25,med:30,heat:1,cool:1.5},
  kingyo:{feed:2,water:20,wall:50,med:50,heat:2,cool:3},
  chicken:{feed:12,dietMul:[1,0.7],drink:1,bed:40,med:150,heat:4,cool:4,eggVal:25},
  quail:{feed:2,dietMul:[1,0.7],drink:1,bed:20,med:60,heat:2,cool:2,eggVal:8},
  rabbit:{feed:45,dietMul:[1,1.3],drink:1,bed:30,med:500,heat:3,cool:3}
};
var CK=['feed','water','clean','elec','ex','med'];
var CK_LABEL={feed:'えさ代',water:'水の手入れ',clean:'床のそうじ(床材)',elec:'電気代(温度・空気)',ex:'運動',med:'治療・薬'};
var CK_WATER={water:'水替え(水道・カルキ抜き)',land:'飲み水の交換'};
function ckLabel(sp,k){return k==='water'?CK_WATER[sp.kind]:CK_LABEL[k]}
function freshCost(){var c={yen:0,min:0,waste:0,eggVal:0,medDays:0,y:{},m:{}};CK.forEach(function(k){c.y[k]=0;c.m[k]=0});return c}
function normCost(o){var c=freshCost();if(!isObj(o))return c;
  ['yen','min','waste','eggVal','medDays'].forEach(function(k){if(typeof o[k]==='number'&&isFinite(o[k]))c[k]=o[k]});
  ['y','m'].forEach(function(g){if(isObj(o[g]))CK.forEach(function(k){var v=o[g][k];if(typeof v==='number'&&isFinite(v))c[g][k]=v})});
  return c}
function addCost(st,k,yen,min){if(!isObj(st.cost))st.cost=freshCost();var c=st.cost;c.y[k]=(c.y[k]||0)+yen;c.m[k]=(c.m[k]||0)+min;c.yen+=yen;c.min+=min}
function feedYen(key,s){var c=COST[key];return c.feed*s.n*FEED_AMT[s.feed]*(c.dietMul?c.dietMul[s.diet]||1:1)}
function tempYen(key,T){var c=COST[key];return T>AMB?(T-AMB)*c.heat:(AMB-T)*c.cool}
function airYen(s){return [0,1,2][s.air]||0}
/* 今の設定を続けたときの、1日あたりの見込み(水替え・そうじは回数をならす)。sick:弱っているときの治療費も入れる */
function costPlan(key,s,sick){
  var sp=SP[key],c=COST[key],y={},m={};CK.forEach(function(k){y[k]=0;m[k]=0});
  y.feed=feedYen(key,s);m.feed=s.feed>0?5:0;
  y.elec=tempYen(key,s.temp);
  if(sp.kind==='water'){
    y.elec+=airYen(s);
    var per={none:0,w2:14,w1:7,d3:3}[s.routine]||0;
    if(per){y.water=c.water/per;m.water=(key==='kingyo'?30:20)/per}
  }else{
    var wp={daily:1,'2d':2}[s.waterR]||0;if(wp){y.water=c.drink/wp;m.water=3/wp}
    var cp={daily:1,'3d':3,weekly:7}[s.clean]||0;if(cp){y.clean=c.bed/cp;m.clean=15/cp}
    m.ex=[0,10,30][s.ex]||0;
  }
  if(sick){y.med=c.med;m.med=15}
  var t={y:y,m:m,yen:0,min:0};CK.forEach(function(k){t.yen+=y[k];t.min+=m[k]});
  return t;
}
function yenStr(v){v=Math.round(v);return v.toLocaleString?v.toLocaleString('ja-JP')+'円':v+'円'}
function minStr(v){v=Math.round(v);if(v<60)return v+'分';var h=Math.floor(v/60),mm=v%60;return h+'時間'+(mm?mm+'分':'')}

/* ================= シミュレーションの計算 ================= */
function defaultSet(key){
  var sp=SP[key];
  return sp.kind==='water'?{temp:sp.temp.ideal-2,feed:2,air:1,plants:0,n:sp.defN,routine:'w1',move:0}
                          :{temp:sp.temp.ideal,feed:2,diet:0,waterR:'daily',clean:'3d',ex:1,n:sp.defN};
}
function pickIssue(sp,avoid){ // 課題を1つ選ぶ(できれば前回と同じものはさける)
  var n=sp.issues?sp.issues.length:0;if(!n)return -1;
  var i=Math.floor(Math.random()*(n>1&&avoid>=0&&avoid<n?n-1:n));
  if(n>1&&avoid>=0&&avoid<n&&i>=avoid)i++;
  return i;
}
function newRun(key,plainStart,avoid){
  var sp=SP[key];
  var st={sp:key,day:0,health:80,size:sp.size.start,dirt:6,no3:8,ph:7.2,bio:1,water:100,eggAcc:0,eggs:0,eggsToday:0,fry:0,pending:[],
    hist:[],log:[],done:false,acted:{},pen:{},look:null,doNow:0,app:1,left:0,streak:{},penSum:{},penDays:{},lastT:null,archive:{},cost:freshCost(),dead:false,deadDay:0,lost:0,low:0,
    set:defaultSet(key)};
  st.issue=plainStart?-1:pickIssue(sp,avoid);
  var iss=st.issue>=0?sp.issues[st.issue]:null;
  if(iss)Object.keys(iss).forEach(function(k){st.set[k]=iss[k]});
  st.lastT=st.set.temp;
  st.doNow=calcDO(st);
  st.look=look(st);
  st.hist.push(snap(st));
  addLog(st,'飼育を始めました。まずは今の環境のまま1日すすめて、生き物の様子を見てみよう。');
  if(iss)addLog(st,'最初の環境には、見直したほうがよいところがあります。様子・メーター・💡ヒントを手がかりに、さがしてみよう。');
  return st;
}
function unitOf(key){return SP[key].kind==='water'||key==='rabbit'?'匹':'羽'}
function addLog(st,t,cls){st.log.unshift(cls?{d:st.day,t:t,c:cls}:{d:st.day,t:t});if(st.log.length>120)st.log.length=120}
function loadOf(st){var sp=SP[st.sp];return sp.kind==='water'?st.set.n*sp.capPer/sp.tankL:st.set.n/sp.cap}
function tempFactor(sp,T){ // 活動・食欲(0〜1)
  var t=sp.temp,span=t.max-t.min;
  if(T<t.stop)return 0.08;
  if(T<t.min){var fMin=1-Math.abs(t.min-t.ideal)/span*0.5;return 0.15+(fMin-0.15)*(T-t.stop)/(t.min-t.stop)}
  if(T<=t.max)return 1-Math.abs(T-t.ideal)/span*0.5;
  return Math.max(0.15,0.75-(T-t.max)*0.12);
}
function satDO(T){return 14.652-0.41022*T+0.007991*T*T-0.000077774*T*T*T} // 水にとける酸素の量(飽和、mg/L)
function calcDO(st){
  var s=st.set,T=s.temp,sat=satDO(T);
  var hot=T>30?1+(T-30)*0.12:1;
  var v=sat*[0.72,0.9,1.0][s.air]+(s.plants?0.4:0)-loadOf(st)*1.1*(0.5+T/30)*hot-st.dirt*0.03;
  return clamp(v,0.5,sat);
}
function changeWater(st,frac,full){
  st.dirt*=(1-frac);
  st.no3=(st.no3||0)*(1-frac);
  st.ph+=(7.2-st.ph)*frac;
  if(full){st.bio*=0.35;st.shock=(st.shock||0)+9;}
}
function stepDay(st){
  var sp=SP[st.sp],s=st.set,pen={},T=s.temp,ld=loadOf(st);
  st.day++;
  var msgs=[],prevH=st.health,prevD=st.dirt;
  if(st.lastT==null)st.lastT=T;
  if(sp.kind==='water'){
    var r=s.routine,due=(r==='w2'&&st.day%14===0)||(r==='w1'&&st.day%7===0)||(r==='d3'&&st.day%3===0);
    if(due){changeWater(st,1/3,false);addCost(st,'water',COST[st.sp].water,st.sp==='kingyo'?30:20);msgs.push('習慣にしている水替え(くみ置きの水で3分の1)をしました。');}
    var app=tempFactor(sp,T)*(st.doNow<3?0.5:st.doNow<5?0.8:1)*(st.dirt>60?0.7:1)*(0.55+st.health/220)*(st.ph<6.2?0.8:1);
    var fa=FEED_AMT[s.feed],eaten=Math.min(fa,1.05*app),left=Math.max(0,fa-eaten);
    st.app=app;st.left=left;st.eaten=eaten;
    if(fa>0)st.cost.waste+=feedYen(st.sp,s)*left/fa;
    var add=ld*(1.6+2.8*eaten)+left*ld*12;
    var decay=0.045*st.bio+(s.plants?0.03:0)+(s.air>0?0.01:0);
    var broken=st.dirt*decay;
    st.dirt=clamp(st.dirt+add-broken,0,100);
    // 目に見えない汚れ(フンなどが分解されてできたもの)。水替えでしか減らない
    st.no3=clamp((st.no3||0)+1.6+ld*0.5*eaten+left*ld*6+broken*0.05-(s.plants?0.15:0),0,150);
    st.bio=Math.min(1,st.bio+0.08);
    var phT=7.3-Math.max(0,st.no3-20)*0.035;
    st.ph=clamp(st.ph+(phT-st.ph)*0.15-st.dirt*0.001+(s.plants?0.005:0),5.0,9.0);
    st.doNow=calcDO(st);
    var t=sp.temp;
    if(T<t.min)pen.temp_low=(T<t.stop?(t.stop-T)*1.5+1:0.2);
    if(T>t.max)pen.temp_high=(T-t.max)*1.3;
    if(st.ph<sp.ph.min)pen.ph_low=(sp.ph.min-st.ph)*6;
    if(st.ph>sp.ph.max)pen.ph_high=(st.ph-sp.ph.max)*6;
    if(st.doNow<5)pen['do']=(5-st.doNow)*2.2;
    if(st.dirt>30)pen.dirt=(st.dirt-30)*0.12;
    if(st.no3>36)pen.no3=(st.no3-36)*0.2;
    if(s.feed===0)pen.hunger=3;else if(s.feed===1&&app>0.6)pen.hunger=0.6;
    if(left>0.4)pen.over=0.3+left*0.3;
    if(ld>1.05)pen.crowd=(ld-1)*3;
    var dT=Math.abs(T-st.lastT);
    if(dT>3){pen.shock=(dT-3)*1.5;msgs.push('水温を急に変えすぎました('+st.lastT+'℃→'+T+'℃)。1日2〜3℃ずつ変えよう。');}
    if(st.shock){pen.shock=(pen.shock||0)+st.shock;st.shock=0;}
    if(st.phShock){pen.shock=(pen.shock||0)+st.phShock;st.phShock=0;}
    var g=sp.growth*Math.min(eaten,1.05)*Math.min(1,tempFactor(sp,T)*1.1)*(st.health/100)*(T<t.min?0:1);
    st.size+=(sp.size.max-st.size)*g;
    // 卵(メダカ)
    st.eggsToday=0;
    if(sp.eggs&&T>=20&&T<=30&&st.health>=65&&eaten>=0.8&&s.n>=2){
      var eg=Math.floor(Math.floor(s.n/2)*(T>=24?10:5)*st.health/100);
      st.eggsToday=eg;st.eggs+=eg;
      if(s.move){var hd=Math.max(7,Math.round(250/T));st.pending.push({d:st.day+hd,c:Math.round(eg*0.3)});}
      else{var sv=Math.round(eg*0.03);if(sv>0)st.pending.push({d:st.day+Math.round(250/T),c:sv});}
    }
    var keep=[],hatched=0;st.pending.forEach(function(p){if(p.d<=st.day){hatched+=p.c}else keep.push(p)});st.pending=keep;
    if(hatched>0&&st.fry===0)msgs.push('はじめて卵から稚魚がかえりました!(かえるまでの日数の目安:水温×日数がおよそ250℃・日)');
    st.fry+=hatched;
  }else{
    if(s.waterR==='daily'||(s.waterR==='2d'&&st.day%2===0)){st.water=100;addCost(st,'water',COST[st.sp].drink,3);}
    var appL=tempFactor(sp,T)*(st.water<30?0.6:1)*(0.55+st.health/220);
    var faL=FEED_AMT[s.feed],eatenL=Math.min(faL,1.05*appL),leftL=Math.max(0,faL-eatenL);
    st.app=appL;st.left=leftL;st.eaten=eatenL;
    if(faL>0)st.cost.waste+=feedYen(st.sp,s)*leftL/faL;
    st.dirt=clamp(st.dirt+ld*(3+3*eatenL)+leftL*3*ld,0,100);
    var cl=s.clean,cdue=cl==='daily'||(cl==='3d'&&st.day%3===0)||(cl==='weekly'&&st.day%7===0);
    if(cdue){st.dirt*=0.12;addCost(st,'clean',COST[st.sp].bed,15);}
    if(s.ex)addCost(st,'ex',0,[0,10,30][s.ex]);
    st.water=Math.max(0,st.water-(T>sp.temp.max?55:T>22?42:32));
    var tl=sp.temp;
    if(T<tl.min)pen.temp_low=(T<tl.stop?(tl.stop-T)*1.2+1.5:(tl.min-T)*0.3);
    if(T>tl.max)pen.temp_high=(T-tl.max)*(st.sp==='rabbit'?1.8:1.3);
    if(st.water<30)pen.thirst=(30-st.water)*0.12;
    if(st.dirt>40)pen.floor=(st.dirt-40)*0.1;
    if(s.diet===1)pen.diet=0.8;
    if(s.feed===0)pen.hunger=4;else if(s.feed===1)pen.hunger=1;
    if(leftL>0.4)pen.over=0.3+leftL*0.3;
    if(s.ex===0)pen.exercise=0.8;
    if(s.ex===2&&T>tl.max)pen.exercise=1;
    if(ld>1.05)pen.crowd=(ld-1)*3;
    var ff=[0.82,0.93,1.0,1.08,1.16][s.feed],ideal=sp.size.ideal;
    if(sp.adult){
      var target=ideal*ff*(s.ex===0?1.03:1);
      st.size+=(target-st.size)*0.07;
    }else{
      var gL=sp.growth*Math.min(eatenL,1.1)*(s.diet===1?0.7:1)*(st.health/100)*Math.min(1,tempFactor(sp,T)*1.1);
      var cap=sp.size.max*(s.feed>=3?1.08:1)*(s.ex===0&&s.feed>=3?1.05:1);
      st.size+=(cap-st.size)*gL;
    }
    if(st.size>ideal*1.1)pen.obese=Math.min(3,(st.size/ideal-1.1)*20);
    st.eggsToday=0;
    if(sp.eggRate){
      var rate=sp.eggRate*Math.pow(st.health/100,1.5)*(s.diet===1?0.6:1)*(s.feed<2?0.6:1)*(T>tl.max||T<tl.min?0.6:1);
      st.eggAcc+=s.n*rate;var e=Math.floor(st.eggAcc);st.eggAcc-=e;st.eggsToday=e;st.eggs+=e;
    }
  }
  st.lastT=T;
  // その日のコスト(えさ代・電気代・治療費)と、とれた卵の価値
  var yen0=st.cost.yen;
  addCost(st,'feed',feedYen(st.sp,s),s.feed>0?5:0);
  addCost(st,'elec',tempYen(st.sp,T)+(sp.kind==='water'?airYen(s):0),0);
  if(prevH<50){if(!st.cost.medDays)msgs.push('弱っているので、薬や手当て(治療)にお金と時間がかかり始めました(1日 約'+yenStr(COST[st.sp].med)+')。');
    addCost(st,'med',COST[st.sp].med,15);st.cost.medDays++;}
  if(st.eggsToday>0&&COST[st.sp].eggVal)st.cost.eggVal+=st.eggsToday*COST[st.sp].eggVal;
  st.costToday=st.cost.yen-yen0;
  // 同じ問題が続くほど、体への負担が大きくなる(連続日数)
  if(!isObj(st.streak))st.streak={};
  if(!isObj(st.penSum))st.penSum={};
  if(!isObj(st.penDays))st.penDays={};
  Object.keys(st.streak).forEach(function(k){if(!(k in pen))st.streak[k]=0});
  var total=0;
  Object.keys(pen).forEach(function(k){
    if(k!=='shock'){st.streak[k]=(st.streak[k]||0)+1;pen[k]*=Math.min(2,1+(st.streak[k]-1)/10);}
    total+=pen[k];st.penSum[k]=(st.penSum[k]||0)+pen[k];if(pen[k]>0.25)st.penDays[k]=(st.penDays[k]||0)+1;
  });
  st.health=clamp(st.health+(total<0.5?2.5:0.5)-total,0,100);
  // とても弱った状態(健康度20未満)が続くと、命を落としてしまう。一度死んだ命はもどらない
  var un=unitOf(st.sp);
  st.low=st.health<20?(st.low||0)+1:0;
  if(st.health>0&&st.low>=2&&s.n>1&&st.low%2===0){
    var k=Math.max(1,Math.round(s.n*0.25));k=Math.min(k,s.n-1);s.n-=k;st.lost=(st.lost||0)+k;
    msgs.push('とても弱った状態が続き、'+sp.name+'が'+k+un+'死んでしまいました。残りは'+s.n+un+'です。死んでしまった命はもどりません。原因を見直そう。');
  }
  if(st.health<=0||(st.low>=3&&s.n<=1)){
    st.dead=true;st.deadDay=st.day;st.lost=(st.lost||0)+s.n;st.health=0;
    msgs.push(sp.name+'が死んでしまいました('+st.day+'日目)。結果で、どんな条件が続いたのかを確かめよう。');
  }
  st.pen=pen;
  st.look=look(st);
  st.hist.push(snap(st));
  if(st.eggsToday>0&&sp.kind==='water'&&st.eggs===st.eggsToday)msgs.push('メダカがはじめて卵を産みました'+(s.move?'(別の容器へ移しました)。':'(親といっしょなので、多くは食べられてしまうかも)。'));
  if(st.day%7===0&&(sp.eggs||sp.eggRate))msgs.push('この日までの記録:卵 '+st.eggs+'個'+(sp.eggs?'・稚魚 '+st.fry+'匹':'')+'。');
  if(st.dead){}
  else if(st.health<30&&prevH>=30)msgs.push('とても弱っています。実際の飼育なら命にかかわる状態です。すぐに環境を見直そう。');
  else if(st.health<50&&prevH>=50)msgs.push('元気がなくなってきています。様子をよく観察しよう。');
  else if(st.health>=70&&prevH<70&&st.day>1)msgs.push('健康度が回復してきました。');
  msgs.forEach(function(m){addLog(st,m)});
  // その日のまとめ(毎日1行)
  var hN=Math.round(st.health),hP=Math.round(prevH),dh=hN-hP;
  var line='健康度 '+hP+'→'+hN+(dh>0?'(▲'+dh+')':dh<0?'(▼'+(-dh)+')':'(±0)')+'・'+(sp.kind==='water'?'水':'床')+'の汚れ '+Math.round(st.dirt);
  if(st.left>0.3)line+='・食べ残しあり';
  if(sp.kind!=='water'&&st.water<30)line+='・水入れが空';
  line+='・費用 '+yenStr(st.costToday||0);
  var top=Object.keys(pen).filter(function(k){return pen[k]>0.25}).sort(function(a,b){return pen[b]-pen[a]})[0];
  if(top)line+='。気になること:'+HINT_S[top];
  addLog(st,line,'sum');
  if(st.dead){st.done=true;}
  else if(st.day>=30){st.done=true;addLog(st,'30日間の飼育が終わりました。結果を確かめよう。');}
}
function snap(st){var sp=SP[st.sp];var g=sp.adult?clamp(100-Math.abs(st.size-sp.size.ideal)/sp.size.ideal*400,0,100):(st.size-sp.size.start)/(sp.size.max-sp.size.start)*100;
  return {d:st.day,h:round(st.health,1),dirt:round(st.dirt,1),g:round(clamp(g,0,100),1),size:round(st.size,2)}}
/* 保存データの形を確かめ、足りない項目をおぎなう(古いデータ・こわれたデータ対策) */
function normRun(o){
  if(!isObj(o)||!SP[o.sp])return null;
  var base=newRun(o.sp,true),st=base;
  Object.keys(o).forEach(function(k){
    var v=o[k];
    if(k==='set'||k==='sp')return;
    if(k in base){
      if(Array.isArray(base[k])){if(Array.isArray(v))st[k]=v;}
      else if(base[k]===null||typeof base[k]==='number'){if(typeof v==='number'&&isFinite(v))st[k]=v;}
      else if(typeof base[k]==='boolean'){if(typeof v==='boolean')st[k]=v;}
      else if(isObj(base[k])){if(isObj(v))st[k]=v;}
    }else if(typeof v==='number'&&isFinite(v))st[k]=v;
  });
  var ds=defaultSet(o.sp);st.set=ds;
  if(isObj(o.set))Object.keys(ds).forEach(function(k){var v=o.set[k];if(typeof v===typeof ds[k]&&(typeof v!=='number'||isFinite(v)))ds[k]=v});
  st.set.n=clamp(Math.round(st.set.n),1,SP[o.sp].maxN);
  st.day=clamp(Math.floor(st.day),0,30);st.done=st.day>=30||st.dead===true;
  st.hist=st.hist.filter(function(x){return isObj(x)&&typeof x.d==='number'&&typeof x.h==='number'});
  st.log=st.log.filter(function(x){return isObj(x)&&typeof x.t==='string'});
  st.pending=st.pending.filter(function(x){return isObj(x)&&typeof x.d==='number'&&typeof x.c==='number'});
  if(!st.hist.length)st.hist.push(snap(st));
  if(st.lastT==null)st.lastT=st.set.temp;
  if(SP[o.sp].kind==='water')st.doNow=calcDO(st);
  st.look=look(st);
  st.cost=normCost(o.cost);
  if(!isObj(st.archive))st.archive={};
  Object.keys(st.archive).forEach(function(k){if(!SP[k]||!isObj(st.archive[k]))delete st.archive[k]});
  return st;
}

/* 生き物の様子(観察できること) */
function look(st){
  var sp=SP[st.sp],s=st.set,T=s.temp,signs=[],h=st.health,app=st.app==null?1:st.app;
  var L={};
  if(st.dead)return {appetite:'−',move:'動かない',color:'−',signs:['動かなくなってしまった。もう世話をすることはできません']};
  L.appetite=app>0.8&&h>60?'よい':app>0.45?'ふつう':'少ない';
  var act=tempFactor(sp,T)*(0.4+h/160);
  L.move=act>0.8?'活発':act>0.45?'ふつう':'にぶい';
  L.color=h>75?(sp.kind==='water'?'あざやか':'つやがある'):h>45?'ふつう':(sp.kind==='water'?'うすい':'くすんでいる');
  if(sp.kind==='water'){
    if(st.doNow<4)signs.push('水面近くで口をパクパクしている(「鼻上げ」)');
    if(T<sp.temp.min)signs.push('底のほうでじっとしていることが多い');
    if(T>sp.temp.max)signs.push('落ち着きなく泳ぎ回る');
    if(st.left>0.3)signs.push('底に食べ残しのえさが残っている');
    if(st.dirt>50)signs.push('水が白っぽくにごり、においがする');
    else if(st.dirt>30)signs.push('水が少しにごってきた');
    if((st.no3||0)>45)signs.push('水が少し黄色っぽい。長いあいだ水をかえていない');
    if(st.ph<6.3)signs.push('ヒレをたたんで泳いでいる');
    if(loadOf(st)>1.25)signs.push('せまい中でぶつかり合うように泳いでいる');
  }else{
    var bird=st.sp!=='rabbit';
    if(T>sp.temp.max)signs.push(bird?'口を開けて呼吸し、羽を体から少し離している':'体を長くのばしてぐったりし、耳が熱い');
    if(T<sp.temp.min)signs.push(bird?'羽をふくらませて、じっとしている':'体を丸めて、じっとしている');
    if(st.water<30)signs.push('水入れが空っぽになっている');
    if(st.dirt>50)signs.push('床がしめって、ツンとするにおい(アンモニア)がする');
    else if(st.dirt>30)signs.push('床にフンが目立ってきた');
    if(s.diet===1)signs.push(bird?'卵のからがうすく、われやすい':'フンが小さく、数が少ない');
    if(loadOf(st)>1.25)signs.push(bird?'羽をつつき合っている':'けんかをすることがある');
    if(st.left>0.3)signs.push('えさが食べ残されている');
    if(st.size>sp.size.ideal*1.1)signs.push('体が重そうで、あまり動かない');
    if(s.ex===0)signs.push('せまい中で同じ動きをくり返している');
  }
  if(!signs.length&&h>=70)signs.push(sp.kind==='water'?'元気に泳ぎ、えさにすぐ集まってくる':'元気に動き回り、よく食べている');
  L.signs=signs;return L;
}

  });
  $$('[data-range]',el).forEach(function(g){
    var k=g.dataset.range,inp=$('input',g),out=$('output',g),unit=out.textContent.replace(/[-\d.]/g,'');

/* ★の基準:平均・最後の日・いちばん低かった日の3つで決める */

function summary(st){

  return {avg:avg,avgD:avgD,final:st.health,min:min,size:st.size,eggs:st.eggs,fry:st.fry,sp:sp,star:st.dead?0:starOf(avg,st.health,min),dead:!!st.dead,deadDay:st.deadDay||0,lost:st.lost||0,n:st.set.n,causes:causes,penSum:ps,penDays:isObj(st.penDays)?st.penDays:{},cost:normCost(st.cost),ref:costPlan(st.sp,Object.assign(defaultSet(st.sp),GOOD[st.sp]),false)};

function startQuiz(cat){

function renderQuestion(){

  h+='<h2 style="margin-top:10px">'+q.q+'</h2><div class="b2-choices">'+quiz.opt.map(function(i,k){return '<button type="button" data-i="'+i+'">'+'ABCD'[k]+'. '+q.c[i]+'</button>'}).join('')+'</div><div id="b2-qexp"></div></div>';
  el.innerHTML=h;

  function showAnswer(chosen,scroll){
    var ok=chosen===q.a;
    $$('.b2-choices button',el).forEach(function(x){x.disabled=true;if(+x.dataset.i===q.a){x.classList.add('b2-right');x.insertAdjacentHTML('beforeend',' ○ 正解')}else if(+x.dataset.i===chosen){x.classList.add('b2-wrong');x.insertAdjacentHTML('beforeend',' ×')}});
    var ex=$('#b2-qexp',el);

    rb(el);
    $('#b2-qnext',el).addEventListener('click',function(){quiz.i++;quiz.opt=null;quiz.ans=null;if(quiz.i<Q.qs.length){saveQuizNow();renderQuestion();window.scrollTo(0,0)}else quizEnd()});
    try{$('#b2-qnext',el).focus({preventScroll:true})}catch(e){}
    if(scroll)ex.scrollIntoView({block:'nearest'});
  }
  $$('.b2-choices button',el).forEach(function(b){b.addEventListener('click',function(){
    if(quiz.ans!=null)return;

}
function quizEnd(){

  h+='<div class="b2-card"><h2>ふり返りを書こう</h2>';
  RQ.forEach(function(q,i){h+='<label class="b2-f" for="b2-r-'+q.k+'">'+(i+1)+'. '+q.t+'</label><textarea id="b2-r-'+q.k+'" data-r="'+q.k+'" placeholder="'+esc(q.ph)+'">'+esc(d[q.k]||'')+'</textarea>'});
  h+='</div><div class="b2-card"><h2>自己評価</h2><div class="b2-eval">';
  EV.forEach(function(e){h+='<div class="b2-eval-row"><div>'+e.t+'</div><div class="b2-seg" data-ev="'+e.k+'" role="group" aria-label="'+esc(e.t)+'">'+EVL.map(function(l,i){return '<button type="button" data-v="'+i+'" aria-pressed="'+(d.ev[e.k]===i?'true':'false')+'">'+l+'</button>'}).join('')+'</div></div>'});
  h+='</div></div>';
  h+='<div class="b2-card b2-noprint"><div class="b2-btns"><button type="button" class="b2-btn b2-pri" id="b2-r-txt">テキストで書き出す(.txt)</button><button type="button" class="b2-btn" id="b2-r-copy">コピーする</button><button type="button" class="b2-btn" id="b2-r-print">印刷する</button><button type="button" class="b2-btn" id="b2-r-json">データで書き出す(.json)</button></div><div class="b2-saved" id="b2-r-saved">'+savedLabel(d.saved)+'</div></div>';
  el.innerHTML=h;rb(el);printSync(el);
  function save(){var ok=saveRefl();$('#b2-r-saved',el).textContent=ok?savedLabel(d.saved):'保存できませんでした'}
  bindWho(el,function(){$('#b2-r-saved',el).textContent=savedLabel(d.saved)});
  $$('[data-r]',el).forEach(function(i){i.addEventListener('input',function(){d[i.dataset.r]=i.value;save()})});
  $$('[data-ev]',el).forEach(function(g){g.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;d.ev[g.dataset.ev]=+b.dataset.v;$$('button',g).forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});save()})});
  $('#b2-r-txt',el).addEventListener('click',function(){download('B2_振り返り_'+whoFile()+'.txt','﻿'+reflText(),'text/plain;charset=utf-8')});
  $('#b2-r-copy',el).addEventListener('click',function(){copyText(reflText())});
  $('#b2-r-print',el).addEventListener('click',function(){printSync(el);window.print()});
  $('#b2-r-json',el).addEventListener('click',exportAll);
}
function archLine(k,a){
  var sp=SP[k],t='・'+sp.name+':'+(a.dead?(a.deadDay||'')+'日目に死んでしまった':'30日やり終えた '+starStr(a.star))+'/健康度の平均 '+a.avg+'(最後の日 '+a.final+')'+(!a.dead&&a.lost?'/'+a.lost+unitOf(k)+'が死んでしまった':'');
  if(typeof a.yen==='number')t+='/費用 '+yenStr(a.yen)+'・世話 '+minStr(a.min||0);
  if(a.causes&&a.causes.length)t+='/おもな原因:'+a.causes.map(function(c){return HINT_S[c]||c}).join('、');
  return t;
}
function autoSummary(){
  var t='';
  if(run){var r=summary(run);t+='飼育シミュレーション(いま):'+r.sp.name+' '+run.day+'日目まで'+(run.dead?'('+run.deadDay+'日目に死んでしまった)':run.done?'(30日やり終えた '+starStr(r.star)+')':'')+(!run.dead&&run.lost?'/'+run.lost+unitOf(run.sp)+'が死んでしまった':'')+'/健康度の平均 '+Math.round(r.avg)+'/'+r.sp.size.label+' '+(r.sp.size.dec?r.size.toFixed(r.sp.size.dec):Math.round(r.size))+r.sp.size.unit;
    if(r.sp.eggs)t+='/稚魚 '+r.fry+'匹';if(r.sp.eggRate)t+='/卵 '+r.eggs+'個';t+='/費用 '+yenStr(r.cost.yen)+'・世話 '+minStr(r.cost.min)+'\n';
    var ks=Object.keys(run.archive||{}).filter(function(k){return !(run.done&&k===run.sp)});
    if(ks.length)t+='これまでに30日やり終えた記録:\n'+ks.map(function(k){return archLine(k,run.archive[k])}).join('\n')+'\n';}
  else t+='飼育シミュレーション:まだ行っていません\n';
  var qd=quizStore();
  Object.keys(QUIZ).forEach(function(k){t+=QUIZ[k].title+':'+(isObj(qd[k])?'最高 '+qd[k].best+' / '+QUIZ[k].qs.length+' 問':'未挑戦')+'\n'});
  var p=store.get('plan',null);t+='飼育計画書:'+(isObj(p)&&(p.place||p.food||p.waterHow)?'作成あり':'未作成');
  return plain(t);
}
function reflText(){
  var d=getRefl(),t='【B2 動物飼育・水産ミニシミュレータ 振り返り】\n';
  t+='日付:'+today()+'\n'+whoLine()+'\n\n';
  t+='■学習の記録\n'+autoSummary()+'\n\n';
  if(run&&run.done)t+='■飼育の結果のまとめ\n'+storyOf(run).join('\n')+'\n\n';
  RQ.forEach(function(q,i){t+='■'+(i+1)+'. '+q.t+'\n'+(d[q.k]||'')+'\n\n'});
  t+='■自己評価\n';EV.forEach(function(e){t+='・'+e.t+':'+(d.ev[e.k]!=null&&EVL[d.ev[e.k]]?EVL[d.ev[e.k]]:'未記入')+'\n'});
  return plain(t);
}

/* ================= データの書き出し・読み込み ================= */
function exportAll(){
  var data={app:'B2',version:2,exported:new Date().toISOString(),data:{}};
  ['sim','quiz','plan','refl','settings'].forEach(function(k){var v=store.get(k,null);if(v!=null)data.data[k]=v});
  download('B2_データ_'+today()+'.json',JSON.stringify(data,null,1),'application/json');
}
function importAll(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){
    var o;try{o=JSON.parse(rd.result)}catch(err){o=null}
    if(!isObj(o)||o.app!=='B2'||!isObj(o.data)){toast('このファイルは読み込めません(B2のデータではありません)');return}
    var ok={},bad=[];
    if('sim' in o.data){var s=normRun(o.data.sim);if(s)ok.sim=s;else bad.push('飼育')}
    ['quiz','plan','refl','settings'].forEach(function(k){if(k in o.data){if(isObj(o.data[k]))ok[k]=o.data[k];else bad.push({quiz:'クイズ',plan:'計画書',refl:'振り返り',settings:'設定'}[k])}});
    if(!Object.keys(ok).length){toast('このファイルには読み込める内容がありません');return}
    kzConfirm('いまのデータを、読み込んだデータで置きかえます。いまのデータは消えます。よろしいですか?',{ok:'置きかえる',cancel:'やめる',danger:true}).then(function(yes){if(!yes)return;
      Object.keys(ok).forEach(function(k){store.set(k,ok[k])});
      run=normRun(store.get('sim',null));planData=null;reflData=null;
      if(ok.settings){var st=ok.settings;settings.tab=typeof st.tab==='string'?st.tab:settings.tab;store.set('settings',settings)}
      writeReflStat(getRefl());simBuiltFor=null;
      toast(bad.length?'読み込みました(読み込めなかったもの:'+bad.join('・')+')':'読み込みました');renderHome();
    });
  };
  rd.readAsText(f);e.target.value='';
}

if(store.get('refl',null)!==null){try{if(localStorage.getItem('b2_reflstat')===null)writeReflStat(getRefl())}catch(e){}}
applySettings();
showTab(settings.tab&&$('[data-sec="'+settings.tab+'"]')?settings.tab:'home');
rb($('.b2-nav'));measure();
// テスト用に計算部分を公開(画面には影響しません)
window.B2SIM={COST:COST,costPlan:costPlan,SP:SP,GOOD:GOOD,newRun:newRun,stepDay:stepDay,summary:summary,starOf:starOf,calcDO:calcDO,satDO:satDO,normRun:normRun};
})();
</script>
