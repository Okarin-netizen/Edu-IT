<script>
(function(){
  if (window.kzConfirm) return;
  var queue = Promise.resolve();
  function open(msg, opt){
    opt = opt || {};
    return new Promise(function(resolve){
      var back = document.createElement('div');
      back.className = 'kzd-back';
      back.setAttribute('role', 'alertdialog'); back.setAttribute('aria-modal', 'true');
      var box = document.createElement('div'); box.className = 'kzd-box';
      var p = document.createElement('p'); p.className = 'kzd-msg'; p.id = 'kzd-msg-' + Date.now(); p.textContent = String(msg);
      back.setAttribute('aria-describedby', p.id);
      var btns = document.createElement('div'); btns.className = 'kzd-btns';
      var cancel = null;
      if (!opt.alert) {
        cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'kzd-cancel';
        cancel.textContent = opt.cancel || 'キャンセル'; btns.appendChild(cancel);
      }
      var ok = document.createElement('button'); ok.type = 'button'; ok.className = 'kzd-ok' + (opt.danger ? ' kzd-danger' : '');
      ok.textContent = opt.ok || 'OK'; btns.appendChild(ok);
      box.appendChild(p); box.appendChild(btns); back.appendChild(box);
      var prev = document.activeElement;
      function done(v){
        document.removeEventListener('keydown', onKey, true);
        back.remove();
        try { if (prev && prev.focus) prev.focus({preventScroll:true}); } catch(e) {}
        resolve(v);
      }
      function onKey(e){
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); }
        else if (e.key === 'Tab') { var f = cancel ? [cancel, ok] : [ok]; var i = f.indexOf(document.activeElement); e.preventDefault(); f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus(); }
      }
      ok.addEventListener('click', function(){ done(true); });
      if (cancel) cancel.addEventListener('click', function(){ done(false); });
      document.addEventListener('keydown', onKey, true);
      (document.body || document.documentElement).appendChild(back);
      ((opt.danger && cancel) ? cancel : ok).focus({preventScroll:true});
    });
  }
  /* 1つずつ順番に出す */
  window.kzConfirm = function(msg, opt){ var r = queue.then(function(){ return open(msg, opt); }); queue = r.catch(function(){}); return r; };
  window.kzAlert = function(msg, opt){ opt = opt || {}; opt.alert = true; return window.kzConfirm(msg, opt); };
})();
</script>
<!--
  kz-prefs : 教材集ぜんぶで共通の「ふりがな」「文字の大きさ」設定 (K1)
  ------------------------------------------------------------------
  入れ方: kzConfirm の <script> のすぐ後ろに、このファイルの <script> をそのまま貼る。
          2回入れても害はない(window.kzPrefs があれば何もしない)。ES5。外部通信なし。

  保存キー(localStorage):
    hub_ruby  '1' = ふりがなあり / '0' = なし
    hub_fs    文字の大きさ(px の整数。14〜26、2きざみ、初期 18)

  API (グローバルは window.kzPrefs だけ):
    kzPrefs.get()            → {ruby: true|false|null, fs: 14..26|null}
                               キーが無い(まだ一度も設定していない)ときは null。
                               localStorage が使えないときは、このページ内のメモリ上の値を返す。
    kzPrefs.set({ruby?, fs?}) → 指定した項目だけ書きこみ、変わっていればリスナーに知らせる。
                               fs は clampFs で丸める。ほかの画面(親・ほかの iframe)には
                               storage イベント＋postMessage(予備)で伝わる。戻り値は get()。
    kzPrefs.on(fn)           → fn(prefs) を登録。自分の set()、ほかの画面での変更
                               (storage イベント / postMessage)のときに呼ばれる。
                               同じ値が続けて来たときは呼ばない。戻り値は登録解除の関数。
    kzPrefs.clampFs(n)       → 14〜26 の偶数に丸めた数(数でなければ 18)。
    kzPrefs.bump(d)          → 文字サイズを d 段(+1 / -1)変える。新しい fs を返す。
    kzPrefs.bind(rubyBtn, decBtn, incBtn)
                             → K2 の3つのボタンをつなぐ(どれか null 可)。
                               クリックで set()、aria-pressed と disabled(上限・下限)を自動更新。
    kzPrefs.embed            → 教材集(メニュー)の iframe の中なら true。
                               true のとき <html> に class "kz-embed" をすぐ付ける(K3 の CSS 用)。
    kzPrefs.FS_MIN=14, FS_MAX=26, FS_STEP=2, FS_DEFAULT=18

  教材側の使い方の例:
    var p = kzPrefs.get();
    var ruby = (p.ruby !== null) ? p.ruby : 自分の古い設定;   // 古い設定は null のときだけ使う
    var fs   = (p.fs   !== null) ? p.fs   : 自分の古い設定を clampFs したもの;
    apply(ruby, fs);
    kzPrefs.on(function(p){ apply(p.ruby !== false, p.fs || 18); });
    kzPrefs.bind(document.getElementById('x-ruby'), document.getElementById('x-dec'), document.getElementById('x-inc'));
-->
<script data-kz-prefs>
(function(){
  if (window.kzPrefs) return;
  var KR = 'hub_ruby', KF = 'hub_fs', MIN = 14, MAX = 26, STEP = 2, DEF = 18;
  var mem = {ruby: null, fs: null};          /* localStorage が使えないときの予備 */
  var fns = [], last = '';
  var embed = false;
  try { embed = window.self !== window.top; } catch (e) { embed = true; }
  if (embed) { try { document.documentElement.className += (document.documentElement.className ? ' ' : '') + 'kz-embed'; } catch (e) {} }

  function clampFs(n){
    n = Number(n);
    if (!isFinite(n)) return DEF;
    n = Math.round(n / STEP) * STEP;
    return n < MIN ? MIN : (n > MAX ? MAX : n);
  }
  function lsGet(k){ try { return window.localStorage.getItem(k); } catch (e) { return undefined; } }
  function lsSet(k, v){ try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function get(){
    var r = lsGet(KR), f = lsGet(KF), o = {ruby: mem.ruby, fs: mem.fs};
    if (r !== undefined) o.ruby = (r === '1') ? true : (r === '0' ? false : null);
    if (o.ruby === null) o.ruby = false;  /* ふりがなは、はじめはなし(4分野で同じ) */
    if (f !== undefined) o.fs = (f === null || f === '' || isNaN(parseInt(f, 10))) ? null : clampFs(parseInt(f, 10));
    return o;
  }
  function notify(p){
    var key = String(p.ruby) + '|' + String(p.fs);
    if (key === last) return;
    last = key;
    for (var i = 0; i < fns.length; i++) { try { fns[i](p); } catch (e) { if (window.console) console.error(e); } }
  }
  function post(win, p){ try { win.postMessage({kzPrefs: {ruby: p.ruby, fs: p.fs}}, '*'); } catch (e) {} }
  function broadcast(p, except){
    /* 予備の伝え方: 親と子の iframe に postMessage(storage イベントが届かない環境のため) */
    try { if (embed && window.parent && window.parent !== except) post(window.parent, p); } catch (e) {}
    try { for (var i = 0; i < window.frames.length; i++) { if (window.frames[i] !== except) post(window.frames[i], p); } } catch (e) {}
  }
  function set(o){
    o = o || {};
    if (o.ruby !== undefined && o.ruby !== null) { mem.ruby = !!o.ruby; lsSet(KR, o.ruby ? '1' : '0'); }
    if (o.fs !== undefined && o.fs !== null) { mem.fs = clampFs(o.fs); lsSet(KF, String(mem.fs)); }
    var p = get();
    if (p.ruby === null) p.ruby = mem.ruby;
    if (p.fs === null) p.fs = mem.fs;
    notify(p);
    broadcast(p, null);
    return p;
  }
  function on(fn){
    if (typeof fn === 'function') fns.push(fn);
    return function(){ for (var i = fns.length - 1; i >= 0; i--) if (fns[i] === fn) fns.splice(i, 1); };
  }
  function cur(){ var p = get(); return {ruby: p.ruby !== false, fs: p.fs || DEF}; }
  function bump(d){ return set({fs: cur().fs + (d > 0 ? STEP : -STEP)}).fs || DEF; }
  function bind(rb, dec, inc){
    function upd(){
      var c = cur();
      if (rb) rb.setAttribute('aria-pressed', c.ruby ? 'true' : 'false');
      if (dec) dec.disabled = c.fs <= MIN;
      if (inc) inc.disabled = c.fs >= MAX;
    }
    if (rb) rb.addEventListener('click', function(){ set({ruby: !cur().ruby}); });
    if (dec) dec.addEventListener('click', function(){ bump(-1); });
    if (inc) inc.addEventListener('click', function(){ bump(1); });
    on(upd); upd();
    return upd;
  }

  window.addEventListener('storage', function(e){
    if (e.key !== KR && e.key !== KF && e.key !== null) return;
    notify(get());
  });
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || typeof d !== 'object' || !d.kzPrefs || typeof d.kzPrefs !== 'object') return;
    var q = d.kzPrefs;
    if (typeof q.ruby === 'boolean') mem.ruby = q.ruby;
    if (typeof q.fs === 'number') mem.fs = clampFs(q.fs);
    var p = get();
    if (p.ruby === null) p.ruby = mem.ruby;
    if (p.fs === null) p.fs = mem.fs;
    notify(p);
    /* メニュー(いちばん上)は、ほかの iframe にも伝える */
    if (!embed) { try { for (var i = 0; i < window.frames.length; i++) if (window.frames[i] !== e.source) post(window.frames[i], p); } catch (err) {} }
  });

  var p0 = get(); last = String(p0.ruby) + '|' + String(p0.fs);
  window.kzPrefs = {get: get, set: set, on: on, clampFs: clampFs, bump: bump, bind: bind, embed: embed,
    FS_MIN: MIN, FS_MAX: MAX, FS_STEP: STEP, FS_DEFAULT: DEF};
})();
</script>
<!--
  kz-ruby : 共通の用語辞書で、画面の文字に自動でふりがな(ruby)を付ける (K8)
  ------------------------------------------------------------------
  入れ方: kzConfirm の <script> のすぐ後ろ(kz-prefs の後)に、このファイルの <style> と <script> を貼る。
          2回入れても害はない(window.kzRuby があれば何もしない)。ES5。外部通信なし。

  API (グローバルは window.kzRuby だけ):
    kzRuby(root, opts)   root(要素。省略時 document.body)の下の文字に <ruby>語<rt>よみ</rt></ruby> を付ける。
                         ・長い語から先に当てる(「積算温度」は「積算」より先)
                         ・ruby, rt, rp, textarea, input, select, option, script, style, svg, canvas, code,
                           noscript, [contenteditable], class="kz-norb" の要素の中はとばす
                         ・何度よんでも二重にならない(ruby の中はとばすため)。描画のたびによんでよい
                         opts.skip : とばす要素を CSS セレクタで追加(例 '.b3-cal')
                         戻り値: 付けた ruby の数
    kzRuby.str(html)     HTML 文字列のタグの外の文字にだけ ruby を付けた文字列を返す
                         (innerHTML に入れる前に使う場合。ruby/textarea/script/style/code の中はとばす)
    kzRuby.plain(html)   ruby の読み(rt・rp)とタグを取りのぞいた文字だけを返す(テキスト書き出し・コピー用)。
                         <br> は改行、&amp; などは元の文字にもどす
    kzRuby.dict          辞書の配列 [語, よみ]。よみは文字列、または区切り配列
                         例 ['分げつ', [['分','ぶん'],'げつ']](かなの部分にはよみを付けない)
                         文字列のよみで語にかなが入る場合(「間引き」まびき)は、漢字の部分にだけ自動で付ける
    kzRuby.add(list)     [語, よみ] を追加・上書きして作り直す(教材だけの語に使う)

  ふりがなの表示・非表示は、各教材の CSS で rt を隠す(例 .noruby rt{display:none})。kzRuby は付けるだけ。
  辞書は kz-ruby-dict.json と同じ内容(build-dict.js で dict-src.txt から作る)。
-->
<style data-kz-ruby>
ruby.kzr{ruby-position:over;}
</style>
<script data-kz-ruby>

<!--
  kz-print : 印刷のとき、textarea の文章を切らずに全部出す (K5)
  ------------------------------------------------------------------
  入れ方: kzConfirm の <script> のすぐ後ろに、このファイルの <style> と <script> を貼る。
          2回入れても害はない(window.kzPrintText があれば何もしない)。ES5。外部通信なし。

  API (グローバルは window.kzPrintText だけ):
    kzPrintText(root)     root(省略時 document)の下のすべての textarea の直後に
                          <div class="kz-ptext" aria-hidden="true"> を1つだけ用意し、textarea の値を写す。
                          空のときは「(未記入)」。placeholder(例文)は印刷しない。
                          画面を描きなおしたあと(innerHTML を入れたあと)に毎回よぶ。何度よんでもよい。
    kzPrintText.sync(root) すでにある .kz-ptext の中身を今の値に合わせる(root 省略時 document)。
                          JS で textarea.value を書きかえたあとによぶ。
  自動で同期するとき: textarea の input / change、window の beforeprint、
                    matchMedia('print') の変化(beforeprint がない古い Safari 用)。
  CSS: 画面では .kz-ptext は表示しない。印刷では textarea を隠し、.kz-ptext を全文表示する。
       見た目を変えたいときは、教材側で .kz-ptext を上書きしてよい(印刷用のみ)。
-->
<style data-kz-print>
.kz-ptext{display:none}
@media print{
  textarea{display:none !important}
  .kz-ptext{display:block !important;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;border:1px solid #999;border-radius:6px;padding:6px 8px;min-height:2.5em;break-inside:auto;color:#000;background:#fff}
  .kz-ptext.kz-empty{color:#666}
}
</style>

    var d = ta.nextElementSibling;

  }
  function kzPrintText(root){
    root = root || document;

  ['当事者','とうじしゃ'],['経済','けいざい'],['環境','かんきょう'],['社会','しゃかい'],['過程','かてい'],['立場','たちば'],['重み','おもみ'],['候補','こうほ'],['具体的','ぐたいてき'],['達成','たっせい'],['不便','ふべん']]);
function rb(el){if(window.kzRuby&&el){try{kzRuby(el)}catch(e){}}}

/* ---- ふりがな・文字の大きさ(教材集ぜんぶで共通: hub_ruby / hub_fs) ---- */
function applySettings(){var p=kzPrefs.get();root.classList.toggle('b6-noruby',p.ruby===false);root.style.setProperty('--b6-fs',(p.fs||kzPrefs.FS_DEFAULT)+'px')}
kzPrefs.bind($('#b6-ruby'));
kzPrefs.on(EduitFrame.sizeButton($('#b6-size'),{steps:[[16,'小'],[18,'中'],[22,'大'],[26,'特大']],get:function(){return kzPrefs.get().fs||kzPrefs.FS_DEFAULT},set:function(v){kzPrefs.set({fs:v})}}));
kzPrefs.on(applySettings);
applySettings();

/* ---- 保存 ---- */
var FK_OFF=!!(window.EduitFrame&&EduitFrame.furikaeri===false);
function writeReflStat(d){var r=d.refl||{},f=0;['learned','next'].forEach(function(k){if(typeof r[k]==='string'&&r[k].replace(/\s+/g,''))f++});try{localStorage.setItem('b6_reflstat',JSON.stringify({filled:f,total:2}))}catch(e){}}
var timer=null;
function save(){
  clearTimeout(timer);
  timer=setTimeout(function(){
    var ok=store.set('note',note.data);writeReflStat(note.data);
    var d=new Date();$('#b6-saved').textContent=ok?'✓ 自動保存しました '+p2(d.getHours())+':'+p2(d.getMinutes()):'保存できませんでした(このひらき方では記録が残りません)';
  },600);
}
function whoFile(){var s=note.data.student||{};return (s.cls||'')+(s.no?'-'+s.no:'')+(s.name?'_'+s.name:'')}
function exportAll(){
  store.set('note',note.data);
  download('B6_データ_'+(whoFile()?whoFile()+'_':'')+today()+'.json',JSON.stringify({app:'B6',version:1,exported:new Date().toISOString(),data:{note:note.data}},null,1));
}
function btn(label,fn,pri){var b=document.createElement('button');b.type='button';b.className='mn-btn'+(pri?' mn-btn-primary':'');b.textContent=label;b.addEventListener('click',fn);return b}
function recordTools(){
  var w=document.createElement('span');w.className='mn-row';
  w.appendChild(btn('データで書き出す(.json)',exportAll));
  w.appendChild(btn('書き出したファイルを読みこむ',function(){$('#b6-file').click()}));
  w.appendChild(btn('この教材の記録をすべて消す',function(){
    kzConfirm('B6 の問題解決ノートをすべて消します。もとにもどせません。よろしいですか?',{ok:'すべて消す',danger:true}).then(function(ok){if(!ok)return;
      ['note','reflstat','tab'].forEach(store.del);note.setData(MondaiNote.defaults('B'));toast('消しました');showTab('intro')})}));
  return w;
}
$('#b6-file').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){
    var o;try{o=JSON.parse(rd.result)}catch(err){o=null}
    if(!isObj(o)||o.app!=='B6'||!isObj(o.data)||!isObj(o.data.note)){toast('このファイルは読み込めません(B6のデータではありません)');return}
    kzConfirm('いまの B6 のノートを、読み込んだデータで置きかえます。いまのノートは消えます。よろしいですか?',{ok:'置きかえる',danger:true}).then(function(yes){if(!yes)return;
      note.setData(o.data.note);store.set('note',note.data);writeReflStat(note.data);toast('読み込みました');showTab('rec')});
  };
  rd.readAsText(f);e.target.value='';
});

/* ---- タブ ---- */
var cur='intro';
function showTab(tab){
  if(!$('[data-sec="'+tab+'"]')||(FK_OFF&&tab==='refl'))tab=FK_OFF&&tab==='refl'?'rec':'intro';
  cur=tab;store.set('tab',tab);
  $$('.b6-nav button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false')});
  $$('main > section').forEach(function(s){s.hidden=s.dataset.sec!==tab});
  if(tab==='rec'&&note)note.render('rec');
  window.scrollTo(0,0);
}
$$('.b6-nav button').forEach(function(b){b.addEventListener('click',function(){showTab(b.dataset.tab)})});

var note=MondaiNote.mount({
  domain:'B',data:store.get('note',null),
  panels:{intro:$('[data-sec="intro"]'),find:$('[data-sec="find"]'),eval:$('[data-sec="eval"]'),opt:$('[data-sec="opt"]'),refl:$('[data-sec="refl"]'),rec:$('[data-sec="rec"]')},
  onChange:save,go:showTab,recordTools:recordTools,
  furikaeri:function(){return !FK_OFF},
  confirm:function(msg){return kzConfirm(msg,{ok:'はい'})},
  afterRender:rb
});
rb($('.b6-nav'));
var t0=store.get('tab','intro');
showTab(typeof t0==='string'?t0:'intro');
})();
</script>
</body>
</html>
