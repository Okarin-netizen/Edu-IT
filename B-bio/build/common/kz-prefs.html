<!--
  kz-prefs : 教材集ぜんぶで共通の「ふりがな」「文字の大きさ」設定 (K1)
  ------------------------------------------------------------------
  入れ方: kzConfirm の <script> のすぐ後ろに、このファイルの <script> をそのまま貼る。
          2回入れても害はない(window.kzPrefs があれば何もしない)。ES5。外部通信なし。

  保存キー(localStorage):
    hub_ruby  '1' = ふりがなあり / '0' = なし
    hub_fs    文字の大きさ(px の整数。14〜26、2きざみ、初期 18)

  API (グローバルは window.kzPrefs だけ):
    kzPrefs.get()            → {ruby: true|false|null, fs: 14..26|null}
                               キーが無い(まだ一度も設定していない)ときは null。
                               localStorage が使えないときは、このページ内のメモリ上の値を返す。
    kzPrefs.set({ruby?, fs?}) → 指定した項目だけ書きこみ、変わっていればリスナーに知らせる。
                               fs は clampFs で丸める。ほかの画面(親・ほかの iframe)には
                               storage イベント＋postMessage(予備)で伝わる。戻り値は get()。
    kzPrefs.on(fn)           → fn(prefs) を登録。自分の set()、ほかの画面での変更
                               (storage イベント / postMessage)のときに呼ばれる。
                               同じ値が続けて来たときは呼ばない。戻り値は登録解除の関数。
    kzPrefs.clampFs(n)       → 14〜26 の偶数に丸めた数(数でなければ 18)。
    kzPrefs.bump(d)          → 文字サイズを d 段(+1 / -1)変える。新しい fs を返す。
    kzPrefs.bind(rubyBtn, decBtn, incBtn)
                             → K2 の3つのボタンをつなぐ(どれか null 可)。
                               クリックで set()、aria-pressed と disabled(上限・下限)を自動更新。
    kzPrefs.embed            → 教材集(メニュー)の iframe の中なら true。
                               true のとき <html> に class "kz-embed" をすぐ付ける(K3 の CSS 用)。
    kzPrefs.FS_MIN=14, FS_MAX=26, FS_STEP=2, FS_DEFAULT=18

  教材側の使い方の例:
    var p = kzPrefs.get();
    var ruby = (p.ruby !== null) ? p.ruby : 自分の古い設定;   // 古い設定は null のときだけ使う
    var fs   = (p.fs   !== null) ? p.fs   : 自分の古い設定を clampFs したもの;
    apply(ruby, fs);
    kzPrefs.on(function(p){ apply(p.ruby !== false, p.fs || 18); });
    kzPrefs.bind(document.getElementById('x-ruby'), document.getElementById('x-dec'), document.getElementById('x-inc'));
-->
<script data-kz-prefs>
(function(){
  if (window.kzPrefs) return;
  var KR = 'hub_ruby', KF = 'hub_fs', MIN = 14, MAX = 26, STEP = 2, DEF = 18;
  var mem = {ruby: null, fs: null};          /* localStorage が使えないときの予備 */
  var fns = [], last = '';
  var embed = false;
  try { embed = window.self !== window.top; } catch (e) { embed = true; }
  if (embed) { try { document.documentElement.className += (document.documentElement.className ? ' ' : '') + 'kz-embed'; } catch (e) {} }

  function clampFs(n){
    n = Number(n);
    if (!isFinite(n)) return DEF;
    n = Math.round(n / STEP) * STEP;
    return n < MIN ? MIN : (n > MAX ? MAX : n);
  }
  function lsGet(k){ try { return window.localStorage.getItem(k); } catch (e) { return undefined; } }
  function lsSet(k, v){ try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function get(){
    var r = lsGet(KR), f = lsGet(KF), o = {ruby: mem.ruby, fs: mem.fs};
    if (r !== undefined) o.ruby = (r === '1') ? true : (r === '0' ? false : null);
    if (o.ruby === null) o.ruby = false;  /* ふりがなは、はじめはなし(4分野で同じ) */
    if (f !== undefined) o.fs = (f === null || f === '' || isNaN(parseInt(f, 10))) ? null : clampFs(parseInt(f, 10));
    return o;
  }
  function notify(p){
    var key = String(p.ruby) + '|' + String(p.fs);
    if (key === last) return;
    last = key;
    for (var i = 0; i < fns.length; i++) { try { fns[i](p); } catch (e) { if (window.console) console.error(e); } }
  }
  function post(win, p){ try { win.postMessage({kzPrefs: {ruby: p.ruby, fs: p.fs}}, '*'); } catch (e) {} }
  function broadcast(p, except){
    /* 予備の伝え方: 親と子の iframe に postMessage(storage イベントが届かない環境のため) */
    try { if (embed && window.parent && window.parent !== except) post(window.parent, p); } catch (e) {}
    try { for (var i = 0; i < window.frames.length; i++) { if (window.frames[i] !== except) post(window.frames[i], p); } } catch (e) {}
  }
  function set(o){
    o = o || {};
    if (o.ruby !== undefined && o.ruby !== null) { mem.ruby = !!o.ruby; lsSet(KR, o.ruby ? '1' : '0'); }
    if (o.fs !== undefined && o.fs !== null) { mem.fs = clampFs(o.fs); lsSet(KF, String(mem.fs)); }
    var p = get();
    if (p.ruby === null) p.ruby = mem.ruby;
    if (p.fs === null) p.fs = mem.fs;
    notify(p);
    broadcast(p, null);
    return p;
  }
  function on(fn){
    if (typeof fn === 'function') fns.push(fn);
    return function(){ for (var i = fns.length - 1; i >= 0; i--) if (fns[i] === fn) fns.splice(i, 1); };
  }
  function cur(){ var p = get(); return {ruby: p.ruby !== false, fs: p.fs || DEF}; }
  function bump(d){ return set({fs: cur().fs + (d > 0 ? STEP : -STEP)}).fs || DEF; }
  function bind(rb, dec, inc){
    function upd(){
      var c = cur();
      if (rb) rb.setAttribute('aria-pressed', c.ruby ? 'true' : 'false');
      if (dec) dec.disabled = c.fs <= MIN;
      if (inc) inc.disabled = c.fs >= MAX;
    }
    if (rb) rb.addEventListener('click', function(){ set({ruby: !cur().ruby}); });
    if (dec) dec.addEventListener('click', function(){ bump(-1); });
    if (inc) inc.addEventListener('click', function(){ bump(1); });
    on(upd); upd();
    return upd;
  }

  window.addEventListener('storage', function(e){
    if (e.key !== KR && e.key !== KF && e.key !== null) return;
    notify(get());
  });
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || typeof d !== 'object' || !d.kzPrefs || typeof d.kzPrefs !== 'object') return;
    var q = d.kzPrefs;
    if (typeof q.ruby === 'boolean') mem.ruby = q.ruby;
    if (typeof q.fs === 'number') mem.fs = clampFs(q.fs);
    var p = get();
    if (p.ruby === null) p.ruby = mem.ruby;
    if (p.fs === null) p.fs = mem.fs;
    notify(p);
    /* メニュー(いちばん上)は、ほかの iframe にも伝える */
    if (!embed) { try { for (var i = 0; i < window.frames.length; i++) if (window.frames[i] !== e.source) post(window.frames[i], p); } catch (err) {} }
  });

  var p0 = get(); last = String(p0.ruby) + '|' + String(p0.fs);
  window.kzPrefs = {get: get, set: set, on: on, clampFs: clampFs, bump: bump, bind: bind, embed: embed,
    FS_MIN: MIN, FS_MAX: MAX, FS_STEP: STEP, FS_DEFAULT: DEF};
})();
</script>
