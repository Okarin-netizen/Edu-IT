<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B5 植物工場の自動化</title>
<link rel="stylesheet" href="../../shared/eduit-frame.css">
<script src="../eduit-info.js"></script>
<script>EDUIT_INFO.app = { name: 'B5 植物工場の自動化' };</script>
<script src="../../shared/eduit-frame.js"></script>
<style>
body{margin:0;background:var(--ef-bg)}
#b5app{
  /* 共通の枠(shared/eduit-frame.css)の色にそろえる */
  --b5-bg:var(--ef-bg);--b5-card:var(--ef-surface);--b5-ink:var(--ef-text);--b5-sub:var(--ef-muted);--b5-line:#cfdccc;
  --b5-main:var(--ef-accent);--b5-main-d:#1b5e20;--b5-soft:#e8f5e9;--b5-ok:#2e7d32;--b5-warn:#a86400;--b5-bad:#b23b3b;
  --b5-fs:18px;
  font-family:var(--ef-font);
  font-size:var(--b5-fs);line-height:1.65;color:var(--b5-ink);background:var(--b5-bg);
  min-height:100vh;-webkit-text-size-adjust:100%;
}
#b5app *{box-sizing:border-box}
#b5app.b5-noruby rt{display:none}
#b5app rt{font-size:.55em;color:var(--b5-sub)}
#b5app h1,#b5app h2,#b5app h3{line-height:1.4;margin:.3em 0 .5em}
#b5app h1{font-size:1.3em}
#b5app h2{font-size:1.2em;color:var(--b5-main-d)}
#b5app h3{font-size:1.05em}
#b5app p{margin:.4em 0}
#b5app button,#b5app select,#b5app input,#b5app textarea{font:inherit;color:inherit}
#b5app button{cursor:pointer;touch-action:manipulation}
/* 見出しは共通の枠(.ef-header)。タブの帯は分野の色 */
#b5app .b5-head{position:sticky;top:0;z-index:20;background:var(--ef-accent);color:#fff;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#b5app .b5-head-row{flex-wrap:wrap}
#b5app .b5-title{flex:1 1 auto;min-width:200px;margin:0;font-size:18px;line-height:1.3}
#b5app .ef-btn{font:600 15px/1.2 var(--ef-font);color:var(--ef-text)}
#b5app .ef-btn[aria-pressed="true"]{color:var(--ef-accent-ink)}
#b5app .b5-tools button{min-height:44px;min-width:48px}
/* メニュー(教材集)の中では見出し行を隠し、タブの帯をいちばん上にする */
html.kz-embed #b5app .b5-head-row{display:none}
html.kz-embed #b5app .b5-head{padding-top:6px}
html.kz-embed #b5app .b5-nav{margin-top:0}
#b5app .b5-nav{display:flex;gap:4px;margin-top:8px;padding:0 14px}
#b5app .b5-nav button{flex:1 1 0;min-width:0;background:transparent;border:0;color:#fff;padding:8px 6px;min-height:52px;border-radius:12px 12px 0 0;font-weight:700;font-size:min(.88em,19px);line-height:1.3;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
#b5app .b5-nav button[aria-selected="true"]{background:var(--b5-bg);color:var(--b5-main-d)}
#b5app .b5-nav rt{color:inherit;opacity:.85}
/* スマホ: タブの名前を折り返さず、帯を1行にして横にスクロール */
@media (max-width:900px){#b5app .b5-nav{overflow-x:auto;scrollbar-width:none;padding:0 8px}#b5app .b5-nav::-webkit-scrollbar{display:none}#b5app .b5-nav button{flex:0 0 auto;white-space:nowrap;min-height:48px;padding:6px 10px}}
#b5app main{max-width:1240px;margin:0 auto;padding:14px 14px 80px}
#b5app section[hidden]{display:none!important}
#b5app .b5-card{background:var(--b5-card);border:1px solid var(--b5-line);border-radius:14px;padding:14px 16px;margin-bottom:14px;min-width:0}
#b5app .b5-note{background:#fff8e6;border:1px solid #ecd59c;border-radius:12px;padding:10px 14px;margin:10px 0}
#b5app .b5-tip{background:#eef7ee;border:1px solid #b9d8bb;border-radius:12px;padding:10px 14px;margin:10px 0}
#b5app .b5-bad{background:#fbeaea;border:1px solid #e5b3b3;border-radius:12px;padding:10px 14px;margin:10px 0}
#b5app .b5-btn{display:inline-block;text-align:center;vertical-align:middle;min-height:48px;line-height:1.5;padding:8px 18px;border-radius:12px;border:2px solid var(--b5-main);background:#fff;color:var(--b5-main-d);font-weight:700}
#b5app .b5-btn.b5-pri{background:var(--b5-main);color:#fff}
#b5app .b5-btn.b5-pri rt{color:#e8f5e9}
#b5app .b5-btn:disabled{opacity:.45;cursor:not-allowed}
#b5app .b5-btn:active:not(:disabled){transform:translateY(1px)}
#b5app .b5-btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
#b5app :focus-visible{outline:3px solid #f0a020;outline-offset:2px}
#b5app .b5-small{font-size:.85em;color:var(--b5-sub)}
#b5app .b5-seg{display:flex;flex-wrap:wrap;gap:4px}
#b5app .b5-seg button{flex:1 1 0;min-width:64px;min-height:48px;border:2px solid var(--b5-line);background:#fff;border-radius:10px;padding:4px 6px;font-size:.9em;line-height:1.25}
#b5app .b5-seg button[aria-pressed="true"]{border-color:var(--b5-main);background:var(--b5-main);color:#fff;font-weight:700}
#b5app .b5-seg button[aria-pressed="true"] rt{color:#e8f5e9}
#b5app .b5-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
#b5app .b5-num{display:inline-flex;align-items:center;gap:4px}
#b5app .b5-num button{width:44px;height:44px;border-radius:10px;border:2px solid var(--b5-line);background:#fff;font-size:1.2em;font-weight:700;flex:none;padding:0}
#b5app .b5-num input{width:3.6em;min-height:44px;text-align:center;border:2px solid var(--b5-line);border-radius:10px;font-weight:700;padding:0 4px;background:#fff}
#b5app .b5-grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){#b5app .b5-grid2{grid-template-columns:1fr}}
/* はじめに */
#b5app .b5-comic{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
@media (max-width:760px){#b5app .b5-comic{grid-template-columns:repeat(2,minmax(0,1fr))}}
#b5app .b5-koma{border:2px solid #3a4a3a;border-radius:10px;background:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:150px;text-align:center}
#b5app .b5-koma .b5-face{font-size:2.2em;line-height:1.1}
#b5app .b5-koma .b5-say{background:#fff8e6;border:1px solid #ecd59c;border-radius:12px;padding:4px 8px;font-size:.85em}
#b5app .b5-flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:8px 0;padding:0;list-style:none}
@media (max-width:760px){#b5app .b5-flow{grid-template-columns:1fr}}
#b5app .b5-flow li{background:var(--b5-soft);border-radius:10px;padding:8px 10px;font-size:.88em;position:relative}
#b5app .b5-flow li b{display:block;color:var(--b5-main-d)}
#b5app .b5-sys{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:8px 0}
#b5app .b5-sys>div{flex:1 1 150px;border-radius:12px;padding:8px 12px;border:2px solid}
#b5app .b5-sys .b5-in{border-color:#2a78d6;background:#e6f0fc}
#b5app .b5-sys .b5-pg{border-color:#e07b00;background:#ffeedd}
#b5app .b5-sys .b5-ot{border-color:#1baf7a;background:#e2f6ee}
#b5app .b5-sys .b5-arrow{flex:0 0 auto;border:0;align-self:center;font-size:1.5em;padding:0}
#b5app .b5-mis{display:grid;gap:6px;margin:6px 0;padding:0;list-style:none}
#b5app .b5-mis li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px solid var(--b5-line);border-radius:12px;padding:8px 12px;background:#fff}
#b5app .b5-mis li .b5-go{margin-left:auto;min-height:44px;padding:4px 14px}
#b5app .b5-stars{color:#d39b00;letter-spacing:2px;font-size:1.1em;white-space:nowrap}
#b5app .b5-lv{display:inline-block;font-size:.75em;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--b5-soft);color:var(--b5-main-d)}
#b5app .b5-lv.adv{background:#efe6f8;color:#5b2d8a}
/* ブロックのプログラム(D7 計測・制御シミュレータに似せる) */
#b5app .b5-prog{font-size:.95em}
#b5app .b5-blk{border-radius:10px;border:2px solid;border-left-width:8px;margin:4px 0;padding:4px 8px}
#b5app .b5-bh{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:44px;font-weight:700}
#b5app .b5-inner{margin-left:16px;padding:2px 0}
#b5app .b5-forever{border-color:#e07b00;background:#ffeedd}
#b5app .b5-if{border-color:#e2a400;background:#fff6dc}
#b5app .b5-out{border-color:#2a78d6;background:#e6f0fc;font-weight:700}
#b5app .b5-out .b5-bh{font-weight:700}
#b5app .b5-blk select{min-height:44px;border:2px solid #b9b2a0;border-radius:8px;background:#fff;padding:2px 6px;font-weight:700;max-width:100%}
#b5app .b5-blk select:disabled{opacity:1;color:var(--b5-ink);background:#f6f3ea;-webkit-appearance:none;appearance:none;border-style:dashed}
#b5app .b5-tm{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;background:#e2f6ee;border:2px solid #1baf7a;border-radius:8px;padding:2px 6px}
#b5app .b5-mini{min-height:44px;min-width:44px;border-radius:8px;border:1px solid var(--b5-line);background:#fff;font-size:.85em;padding:0 8px}
#b5app .b5-tools2{margin-left:auto;display:inline-flex;gap:4px}
#b5app .b5-eval{font-size:.8em;font-weight:700;padding:2px 8px;border-radius:99px;background:#fff;border:1px solid var(--b5-line);min-width:6.5em;text-align:center}
#b5app .b5-eval.t{background:#2e7d32;color:#fff;border-color:#2e7d32}
#b5app .b5-eval.f{background:#eee;color:#555}
#b5app .b5-add{border:2px dashed #e2a400;background:#fffbea;border-radius:10px;min-height:48px;width:100%;font-weight:700;color:#7a5a00;margin-top:4px}
/* 棚のようす */
#b5app .b5-view{position:relative}
#b5app svg.b5-shelf{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--b5-line);background:#f3efe6}
#b5app .b5-io{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center;margin-top:8px}
#b5app .b5-io h4{margin:0 0 4px;font-size:.85em}
#b5app .b5-io-col{background:#fff;border:1px solid var(--b5-line);border-radius:10px;padding:6px 8px;font-size:.85em;min-width:0}
#b5app .b5-io-mid{font-size:.8em;text-align:center;color:var(--b5-sub);line-height:1.3}
#b5app .b5-io-mid b{display:block;font-size:1.6em;color:#e07b00}
#b5app .b5-sv{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed #e2e8df;padding:1px 0}
#b5app .b5-sv:last-child{border-bottom:0}
#b5app .b5-sv b{font-variant-numeric:tabular-nums;white-space:nowrap}
#b5app .b5-lamp{display:inline-block;min-width:3em;text-align:center;border-radius:99px;padding:0 6px;font-weight:700;font-size:.9em;background:#e5e5e5;color:#666}
#b5app .b5-lamp.on{background:#f0b400;color:#3a2a00}
#b5app .b5-lamp.dim{opacity:.4}
@media (max-width:520px){#b5app .b5-io{grid-template-columns:1fr}#b5app .b5-io-mid b{transform:rotate(90deg)}}
#b5app .b5-play{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
#b5app .b5-play .b5-seg{flex:1 1 220px}
#b5app [data-speed],#b5app [data-s4],#b5app [data-cs]{white-space:nowrap;flex:1 0 auto!important;min-width:0!important;padding:4px 10px!important}
#b5app .b5-prog-bar{height:10px;background:#dfe8dc;border-radius:6px;overflow:hidden;flex:1 1 140px;min-width:100px}
#b5app .b5-prog-bar i{display:block;height:100%;width:0;background:var(--b5-main)}
/* グラフ */
#b5app .b5-chart{width:100%;overflow:hidden;margin:4px 0 10px}
#b5app .b5-chart svg{display:block;width:100%;height:auto}
#b5app .b5-chart h4{margin:4px 0;font-size:.92em}
#b5app .b5-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8em;color:var(--b5-sub)}
#b5app .b5-legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px}
#b5app .b5-legend i.band{height:10px;border:0;border-radius:2px}
/* 結果 */
#b5app .b5-res{border:3px solid var(--b5-main);background:#f3faf3}
#b5app .b5-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
#b5app .b5-kpi div{background:#fff;border:1px solid var(--b5-line);border-radius:10px;padding:6px 10px}
#b5app .b5-kpi b{display:block;font-size:1.25em;font-variant-numeric:tabular-nums}
#b5app .b5-kpi span{font-size:.8em;color:var(--b5-sub)}
#b5app .b5-kpi .bad b{color:var(--b5-bad)}
#b5app .b5-tbl-wrap{overflow-x:auto;max-width:100%}
#b5app table.b5-tbl{border-collapse:collapse;width:100%;font-size:.9em;margin:6px 0}
#b5app table.b5-tbl th,#b5app table.b5-tbl td{border:1px solid var(--b5-line);padding:4px 8px;text-align:right;white-space:nowrap}
#b5app table.b5-tbl th:first-child,#b5app table.b5-tbl td:first-child{text-align:left;white-space:normal}
#b5app table.b5-tbl thead th{background:var(--b5-soft)}
#b5app table.b5-tbl tr.b5-me td{background:#fff6dc;font-weight:700}
@media (max-width:640px){#b5app table.b5-tbl th,#b5app table.b5-tbl td{white-space:normal;padding:4px 6px}}
/* ① くらべる */
#b5app .b5-vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:640px){#b5app .b5-vs{grid-template-columns:1fr}}
#b5app .b5-vs h3{margin:0 0 4px}
#b5app .b5-vs svg{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--b5-line)}
#b5app .b5-wbar{height:12px;border-radius:6px;background:#e3ebe1;overflow:hidden;margin:4px 0}
#b5app .b5-wbar i{display:block;height:100%;background:var(--b5-main)}
#b5app .b5-sort{display:grid;gap:8px;margin:8px 0}
#b5app .b5-sort-item{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr);gap:8px;align-items:center;border:1px solid var(--b5-line);border-radius:12px;padding:6px 10px;background:#fff}
@media (max-width:700px){#b5app .b5-sort-item{grid-template-columns:1fr}}
#b5app .b5-sort-item.ok{border-color:var(--b5-ok);background:#e9f6ea}
#b5app .b5-sort-item.ng{border-color:var(--b5-bad);background:#fbeaea}
#b5app .b5-sort-item .b5-exp{grid-column:1/-1;font-size:.88em}
/* ⑤ スマート農業 */
#b5app .b5-shelves{display:flex;flex-wrap:wrap;gap:8px}
#b5app .b5-shelves button{flex:1 1 100px;min-height:56px;border-radius:12px;border:3px solid var(--b5-line);background:#fff;font-weight:700}
#b5app .b5-shelves button[aria-pressed="true"]{border-color:var(--b5-main);background:var(--b5-soft)}
#b5app .b5-choices{display:grid;gap:8px;margin-top:8px}
#b5app .b5-choices button{min-height:52px;text-align:left;padding:8px 14px;border-radius:12px;border:2px solid var(--b5-line);background:#fff}
#b5app .b5-choices button.right,#b5app .b5-shelves button.right{border-color:var(--b5-ok);background:#e9f6ea}
#b5app .b5-choices button.wrong,#b5app .b5-shelves button.wrong{border-color:var(--b5-bad);background:#fbeaea}
#b5app .b5-ai{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
#b5app .b5-ai div{border:1px solid var(--b5-line);border-radius:12px;padding:8px 12px;background:#fff}
#b5app .b5-ai b{display:block}
/* 振り返り */
#b5app label.b5-f{display:block;font-weight:700;margin:10px 0 4px}
#b5app input[type=text],#b5app textarea{width:100%;min-height:48px;border:2px solid var(--b5-line);border-radius:10px;padding:8px 10px;background:#fff}
#b5app textarea{min-height:110px;resize:vertical;line-height:1.6}
#b5app .b5-who{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2fr);gap:10px}
@media (max-width:520px){#b5app .b5-who{grid-template-columns:1fr 1fr}#b5app .b5-who>div:last-child{grid-column:1/-1}}
#b5app .b5-evr{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr);gap:8px;align-items:center;border-bottom:1px dashed var(--b5-line);padding:6px 0}
@media (max-width:700px){#b5app .b5-evr{grid-template-columns:1fr}}
#b5app .b5-radar-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}
@media (max-width:700px){#b5app .b5-radar-wrap{grid-template-columns:1fr}}
#b5app svg.b5-radar{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
#b5app .b5-rs{display:grid;gap:4px}
#b5app .b5-rs>div{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--b5-line);padding:2px 0}
#b5app .b5-saved{font-size:.85em;color:var(--b5-ok);min-height:1.4em}
#b5app .b5-pval{display:none}
#b5app .b5-summary{background:#f5f9f4;border-radius:10px;padding:8px 12px;font-size:.92em}
#b5app .b5-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f3320;color:#fff;padding:10px 18px;border-radius:12px;z-index:50;font-size:.95em;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .25s}
#b5app .b5-toast.show{opacity:1}
#b5app details{border:1px solid var(--b5-line);border-radius:12px;padding:8px 12px;background:#fff;margin:8px 0}
#b5app summary{font-weight:700;cursor:pointer;min-height:44px;display:list-item;padding:8px 0}
/* アニメーション */
#b5app .b5-spin{animation:b5spin 1s linear infinite;transform-box:fill-box;transform-origin:center}
#b5app .b5-drop{animation:b5drop .8s linear infinite}
@keyframes b5spin{to{transform:rotate(360deg)}}
@keyframes b5drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion:reduce){#b5app .b5-spin,#b5app .b5-drop{animation:none}}
@media print{
  #b5app{min-height:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #b5app .b5-head,#b5app .b5-btns,#b5app .b5-noprint,#b5app .b5-toast{display:none!important}
  #b5app main{padding:0}
  #b5app .b5-card{break-inside:auto;border-color:#999}
  #b5app input[type=text]{display:none!important}
  #b5app .b5-pval{display:block;border:1px solid #999;border-radius:6px;padding:4px 8px;min-height:2em;white-space:pre-wrap}
}

/* タブの帯は4分野共通の形(C エネルギー変換と同じ: 白い帯・下に分野の色の線・丸いボタン。shared/eduit-frame.css の .ef-apptabs と同じ見た目) */
#b5app .b5-nav{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px 10px;margin-top:0;background:var(--ef-surface);border-bottom:3px solid var(--ef-accent);overflow:visible}
#b5app .b5-nav button{flex:none;min-width:0;min-height:44px;padding:0 12px;border:1px solid var(--ef-line);border-radius:999px;background:var(--ef-surface);color:var(--ef-text);font-weight:700;font-size:.84em;line-height:1.3;white-space:nowrap;word-break:normal;overflow-wrap:normal;cursor:pointer}
#b5app .b5-nav button:hover{border-color:var(--ef-accent);background:var(--ef-surface)}
#b5app .b5-nav button rt{color:inherit;opacity:.85}
#b5app .b5-nav button[aria-selected="true"],#b5app .b5-nav button[aria-selected="true"]:hover{background:var(--ef-accent);border-color:var(--ef-accent);color:var(--ef-accent-ink)}
#b5app .b5-nav button[aria-selected="true"] rt{color:inherit}

(function(){
  if (window.kzConfirm) return;
  var queue = Promise.resolve();
  function open(msg, opt){
    opt = opt || {};
    return new Promise(function(resolve){
      var back = document.createElement('div');
      back.className = 'kzd-back';
      back.setAttribute('role', 'alertdialog'); back.setAttribute('aria-modal', 'true');
      var box = document.createElement('div'); box.className = 'kzd-box';
      var p = document.createElement('p'); p.className = 'kzd-msg'; p.id = 'kzd-msg-' + Date.now(); p.textContent = String(msg);
      back.setAttribute('aria-describedby', p.id);
      var btns = document.createElement('div'); btns.className = 'kzd-btns';
      var cancel = null;
      if (!opt.alert) {
        cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'kzd-cancel';
        cancel.textContent = opt.cancel || 'キャンセル'; btns.appendChild(cancel);
      }
      var ok = document.createElement('button'); ok.type = 'button'; ok.className = 'kzd-ok' + (opt.danger ? ' kzd-danger' : '');
      ok.textContent = opt.ok || 'OK'; btns.appendChild(ok);
      box.appendChild(p); box.appendChild(btns); back.appendChild(box);
      var prev = document.activeElement;
      function done(v){
        document.removeEventListener('keydown', onKey, true);
        back.remove();
        try { if (prev && prev.focus) prev.focus({preventScroll:true}); } catch(e) {}
        resolve(v);
      }
      function onKey(e){
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); }
        else if (e.key === 'Tab') { var f = cancel ? [cancel, ok] : [ok]; var i = f.indexOf(document.activeElement); e.preventDefault(); f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus(); }
      }
      ok.addEventListener('click', function(){ done(true); });
      if (cancel) cancel.addEventListener('click', function(){ done(false); });
      document.addEventListener('keydown', onKey, true);
      (document.body || document.documentElement).appendChild(back);
      ((opt.danger && cancel) ? cancel : ok).focus({preventScroll:true});
    });
  }
  /* 1つずつ順番に出す */
  window.kzConfirm = function(msg, opt){ var r = queue.then(function(){ return open(msg, opt); }); queue = r.catch(function(){}); return r; };
  window.kzAlert = function(msg, opt){ opt = opt || {}; opt.alert = true; return window.kzConfirm(msg, opt); };
})();
</script>
<!--
  kz-prefs : 教材集ぜんぶで共通の「ふりがな」「文字の大きさ」設定 (K1)
  ------------------------------------------------------------------
  入れ方: kzConfirm の <script> のすぐ後ろに、このファイルの <script> をそのまま貼る。
          2回入れても害はない(window.kzPrefs があれば何もしない)。ES5。外部通信なし。

  保存キー(localStorage):
    hub_ruby  '1' = ふりがなあり / '0' = なし
    hub_fs    文字の大きさ(px の整数。14〜26、2きざみ、初期 18)

  API (グローバルは window.kzPrefs だけ):
    kzPrefs.get()            → {ruby: true|false|null, fs: 14..26|null}
                               キーが無い(まだ一度も設定していない)ときは null。
                               localStorage が使えないときは、このページ内のメモリ上の値を返す。
    kzPrefs.set({ruby?, fs?}) → 指定した項目だけ書きこみ、変わっていればリスナーに知らせる。
                               fs は clampFs で丸める。ほかの画面(親・ほかの iframe)には
                               storage イベント＋postMessage(予備)で伝わる。戻り値は get()。
    kzPrefs.on(fn)           → fn(prefs) を登録。自分の set()、ほかの画面での変更
                               (storage イベント / postMessage)のときに呼ばれる。
                               同じ値が続けて来たときは呼ばない。戻り値は登録解除の関数。
    kzPrefs.clampFs(n)       → 14〜26 の偶数に丸めた数(数でなければ 18)。
    kzPrefs.bump(d)          → 文字サイズを d 段(+1 / -1)変える。新しい fs を返す。
    kzPrefs.bind(rubyBtn, decBtn, incBtn)
                             → K2 の3つのボタンをつなぐ(どれか null 可)。
                               クリックで set()、aria-pressed と disabled(上限・下限)を自動更新。
    kzPrefs.embed            → 教材集(メニュー)の iframe の中なら true。
                               true のとき <html> に class "kz-embed" をすぐ付ける(K3 の CSS 用)。
    kzPrefs.FS_MIN=14, FS_MAX=26, FS_STEP=2, FS_DEFAULT=18

  教材側の使い方の例:
    var p = kzPrefs.get();
    var ruby = (p.ruby !== null) ? p.ruby : 自分の古い設定;   // 古い設定は null のときだけ使う
    var fs   = (p.fs   !== null) ? p.fs   : 自分の古い設定を clampFs したもの;
    apply(ruby, fs);
    kzPrefs.on(function(p){ apply(p.ruby !== false, p.fs || 18); });
    kzPrefs.bind(document.getElementById('x-ruby'), document.getElementById('x-dec'), document.getElementById('x-inc'));
-->
<script data-kz-prefs>
(function(){
  if (window.kzPrefs) return;
  var KR = 'hub_ruby', KF = 'hub_fs', MIN = 14, MAX = 26, STEP = 2, DEF = 18;
  var mem = {ruby: null, fs: null};          /* localStorage が使えないときの予備 */
  var fns = [], last = '';
  var embed = false;
  try { embed = window.self !== window.top; } catch (e) { embed = true; }
  if (embed) { try { document.documentElement.className += (document.documentElement.className ? ' ' : '') + 'kz-embed'; } catch (e) {} }

  function clampFs(n){
    n = Number(n);
    if (!isFinite(n)) return DEF;
    n = Math.round(n / STEP) * STEP;
    return n < MIN ? MIN : (n > MAX ? MAX : n);
  }
  function lsGet(k){ try { return window.localStorage.getItem(k); } catch (e) { return undefined; } }
  function lsSet(k, v){ try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function get(){
    var r = lsGet(KR), f = lsGet(KF), o = {ruby: mem.ruby, fs: mem.fs};
    if (r !== undefined) o.ruby = (r === '1') ? true : (r === '0' ? false : null);
    if (o.ruby === null) o.ruby = false;  /* ふりがなは、はじめはなし(4分野で同じ) */
    if (f !== undefined) o.fs = (f === null || f === '' || isNaN(parseInt(f, 10))) ? null : clampFs(parseInt(f, 10));
    return o;
  }
  function notify(p){
    var key = String(p.ruby) + '|' + String(p.fs);
    if (key === last) return;
    last = key;
    for (var i = 0; i < fns.length; i++) { try { fns[i](p); } catch (e) { if (window.console) console.error(e); } }
  }
  function post(win, p){ try { win.postMessage({kzPrefs: {ruby: p.ruby, fs: p.fs}}, '*'); } catch (e) {} }
  function broadcast(p, except){
    /* 予備の伝え方: 親と子の iframe に postMessage(storage イベントが届かない環境のため) */
    try { if (embed && window.parent && window.parent !== except) post(window.parent, p); } catch (e) {}
    try { for (var i = 0; i < window.frames.length; i++) { if (window.frames[i] !== except) post(window.frames[i], p); } } catch (e) {}
  }
  function set(o){
    o = o || {};
    if (o.ruby !== undefined && o.ruby !== null) { mem.ruby = !!o.ruby; lsSet(KR, o.ruby ? '1' : '0'); }
    if (o.fs !== undefined && o.fs !== null) { mem.fs = clampFs(o.fs); lsSet(KF, String(mem.fs)); }
    var p = get();
    if (p.ruby === null) p.ruby = mem.ruby;
    if (p.fs === null) p.fs = mem.fs;
    notify(p);
    broadcast(p, null);
    return p;
  }
  function on(fn){
    if (typeof fn === 'function') fns.push(fn);
    return function(){ for (var i = fns.length - 1; i >= 0; i--) if (fns[i] === fn) fns.splice(i, 1); };
  }
  function cur(){ var p = get(); return {ruby: p.ruby !== false, fs: p.fs || DEF}; }
  function bump(d){ return set({fs: cur().fs + (d > 0 ? STEP : -STEP)}).fs || DEF; }
  function bind(rb, dec, inc){
    function upd(){
      var c = cur();
      if (rb) rb.setAttribute('aria-pressed', c.ruby ? 'true' : 'false');
      if (dec) dec.disabled = c.fs <= MIN;
      if (inc) inc.disabled = c.fs >= MAX;
    }
    if (rb) rb.addEventListener('click', function(){ set({ruby: !cur().ruby}); });
    if (dec) dec.addEventListener('click', function(){ bump(-1); });
    if (inc) inc.addEventListener('click', function(){ bump(1); });
    on(upd); upd();
    return upd;
  }

  window.addEventListener('storage', function(e){
    if (e.key !== KR && e.key !== KF && e.key !== null) return;
    notify(get());
  });
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || typeof d !== 'object' || !d.kzPrefs || typeof d.kzPrefs !== 'object') return;
    var q = d.kzPrefs;
    if (typeof q.ruby === 'boolean') mem.ruby = q.ruby;
    if (typeof q.fs === 'number') mem.fs = clampFs(q.fs);
    var p = get();
    if (p.ruby === null) p.ruby = mem.ruby;
    if (p.fs === null) p.fs = mem.fs;
    notify(p);
    /* メニュー(いちばん上)は、ほかの iframe にも伝える */
    if (!embed) { try { for (var i = 0; i < window.frames.length; i++) if (window.frames[i] !== e.source) post(window.frames[i], p); } catch (err) {} }
  });

  var p0 = get(); last = String(p0.ruby) + '|' + String(p0.fs);
  window.kzPrefs = {get: get, set: set, on: on, clampFs: clampFs, bump: bump, bind: bind, embed: embed,
    FS_MIN: MIN, FS_MAX: MAX, FS_STEP: STEP, FS_DEFAULT: DEF};
})();
</script>
<!--
  kz-ruby : 共通の用語辞書で、画面の文字に自動でふりがな(ruby)を付ける (K8)
  ------------------------------------------------------------------
  入れ方: kzConfirm の <script> のすぐ後ろ(kz-prefs の後)に、このファイルの <style> と <script> を貼る。
          2回入れても害はない(window.kzRuby があれば何もしない)。ES5。外部通信なし。

  API (グローバルは window.kzRuby だけ):
    kzRuby(root, opts)   root(要素。省略時 document.body)の下の文字に <ruby>語<rt>よみ</rt></ruby> を付ける。
                         ・長い語から先に当てる(「積算温度」は「積算」より先)
                         ・ruby, rt, rp, textarea, input, select, option, script, style, svg, canvas, code,
                           noscript, [contenteditable], class="kz-norb" の要素の中はとばす
                         ・何度よんでも二重にならない(ruby の中はとばすため)。描画のたびによんでよい
                         opts.skip : とばす要素を CSS セレクタで追加(例 '.b3-cal')
                         戻り値: 付けた ruby の数
    kzRuby.str(html)     HTML 文字列のタグの外の文字にだけ ruby を付けた文字列を返す
                         (innerHTML に入れる前に使う場合。ruby/textarea/script/style/code の中はとばす)
    kzRuby.plain(html)   ruby の読み(rt・rp)とタグを取りのぞいた文字だけを返す(テキスト書き出し・コピー用)。
                         <br> は改行、&amp; などは元の文字にもどす
    kzRuby.dict          辞書の配列 [語, よみ]。よみは文字列、または区切り配列
                         例 ['分げつ', [['分','ぶん'],'げつ']](かなの部分にはよみを付けない)
                         文字列のよみで語にかなが入る場合(「間引き」まびき)は、漢字の部分にだけ自動で付ける
    kzRuby.add(list)     [語, よみ] を追加・上書きして作り直す(教材だけの語に使う)

  ふりがなの表示・非表示は、各教材の CSS で rt を隠す(例 .noruby rt{display:none})。kzRuby は付けるだけ。
  辞書は kz-ruby-dict.json と同じ内容(build-dict.js で dict-src.txt から作る)。

/* ================= シミュレーションのモデル(授業用の簡単なモデル。数値は目安) ================= */
function rng(seed){var a=(seed>>>0)||1;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}}
var SEASON={
  spring:{name:'春(4月)',t:15,amp:5,rise:6,set:18,pest:0.07,storm:0},
  summer:{name:'夏(8月)',t:27,amp:5,rise:5,set:19,pest:0.1,storm:0.05},
  winter:{name:'冬(1月)',t:4,amp:4,rise:7,set:17,pest:0.01,storm:0}
};
var WX={sun:{name:'晴れ',ic:'☀️',peak:85,dt:2,field:14},cloud:{name:'くもり',ic:'☁️',peak:40,dt:0,field:8},rain:{name:'雨',ic:'☔',peak:20,dt:-2,field:4}};
var LED_LIGHT=65;            /* LED が当てる光の強さ(0〜100) */
var NEED=10;                 /* 1日に必要な光の量(明るさ100が1時間で1) */
var PLANTS=12;               /* 棚で育てる株の数 */
var SHIP=80;                 /* 出荷できる重さ(g) */
var PRICE={led:1.5,pump:0.3,heat:6,cool:4};   /* 1時間の電気代(円)の目安 */
var PUMP_L=2;                /* ポンプが1時間で出す水(L) */
var DOW=['日','月','火','水','木','金','土'];
var SENSORS={light:{name:'明るさ',unit:'',min:0,max:100,step:5},temp:{name:'温度',unit:'℃',min:0,max:40,step:1},moist:{name:'土の水分',unit:'%',min:0,max:100,step:5},time:{name:'時刻',unit:'時',min:0,max:23,step:1}};
var DEVICES={led:{name:'LED(照明)',short:'LED',ic:'💡'},pump:{name:'ポンプ(水やり)',short:'ポンプ',ic:'🚿'},heat:{name:'ヒーター',short:'ヒーター',ic:'🔥'},cool:{name:'冷房(ファン)',short:'冷房',ic:'🌀'}};
function weathers(seed,days,season){
  var r=rng(seed*7919+(season==='summer'?101:season==='winter'?202:0)),a=[];
  for(var i=0;i<days;i++){var x=r();a.push(x<0.5?'sun':x<0.78?'cloud':'rain')}
  return a;
}
function sunAt(season,wx,h){var s=SEASON[season];if(h<s.rise||h>=s.set)return 0;var p=(h+0.5-s.rise)/(s.set-s.rise);return Math.round(WX[wx].peak*Math.sin(Math.PI*p))}
function outTemp(season,wx,h,off){var s=SEASON[season];return s.t+WX[wx].dt+off+s.amp*Math.cos((h-14)/24*2*Math.PI)}
function lin(x,x0,y0,x1,y1){if(x<=x0)return y0;if(x>=x1)return y1;return y0+(y1-y0)*(x-x0)/(x1-x0)}
function fTemp(T){if(T<5)return 0.1;if(T<10)return lin(T,5,0.1,10,0.5);if(T<15)return lin(T,10,0.5,15,1);if(T<=22)return 1;if(T<=28)return lin(T,22,1,28,0.5);if(T<=32)return lin(T,28,0.5,32,0.2);return 0.1}
function fMoist(m){if(m<20)return 0.2;if(m<40)return lin(m,20,0.2,40,1);if(m<=80)return 1;if(m<=90)return lin(m,80,1,90,0.8);return 0.6}
function grow(w,f){return w+0.16*w*(1-w/160)*f}
function cmp(a,op,b){return op==='<'?a<b:op==='>'?a>b:op==='<='?a<=b:a>=b}
function inTime(h,a,b){a=+a;b=+b;if(a===b)return true;return a<b?(h>=a&&h<b):(h>=a||h<b)}
/* プログラム(ルールの配列)を1回実行して、機器の ON/OFF を決める。同じ機器を動かすルールが2つあると、下のルールが勝つ */
function runProg(prog,sens,dev){
  for(var i=0;i<prog.length;i++){var r=prog[i];if(!r||!DEVICES[r.dev]||!SENSORS[r.s])continue;
    var c=cmp(sens[r.s],r.op,+r.v);if(r.tm)c=c&&inTime(sens.time,r.ta,r.tb);
    dev[r.dev]=c?(r.a?1:0):(r.b?1:0);}
  return dev;
}
/* o: {season, seed, days, prog, manual(人が平日の朝に水やり), startDow, fault, w0, m0} */
function simulate(o){
  var days=o.days||7,season=o.season||'spring',seed=o.seed||1,prog=o.prog||[],fault=o.fault||'';
  var wx=weathers(seed,days,season),r=rng(seed*31+7),off=[];
  for(var i=0;i<days;i++)off.push(Math.round((r()*4-2)*10)/10);
  var T=o.T0!=null?o.T0:outTemp(season,wx[0],0,off[0])+4,m=o.m0==null?60:o.m0,w=o.w0||3,q=100;
  var log=[],dlog=[],tot={led:0,pump:0,heat:0,cool:0,cost:0,water:0,wilt:0,wet:0,hot:0,cold:0,nodark:0,overflow:0,both:0,lackDays:0};
  var dow0=o.startDow==null?1:o.startDow;
  for(var d=0;d<days;d++){
    var L=0,dark=0,sT=0,sW=0,cost=0,water=0,dow=(dow0+d)%7,weekday=dow>=1&&dow<=5&&!(o.holidays&&o.holidays.indexOf(d)>=0),ledH=0;
    for(var h=0;h<24;h++){
      var sun=sunAt(season,wx[d],h);
      var sens={light:sun,temp:Math.round(T*10)/10,moist:Math.round(m),time:h};
      if(fault==='msensor')sens.moist=100;
      var dev=runProg(prog,sens,{led:0,pump:0,heat:0,cool:0});
      if(o.manual&&weekday&&h===8){var add=Math.min(45,100-m);m+=add;water+=6}
      var eff={led:dev.led&&fault!=='led',pump:dev.pump&&fault!=='pump',heat:dev.heat&&fault!=='heat',cool:dev.cool&&fault!=='cool'};
      var light=Math.min(100,sun+(eff.led?LED_LIGHT:0));L+=light/100;if(light<5)dark++;
      var target=outTemp(season,wx[d],h,off[d])+4+(weekday&&h>=8&&h<17?2:0);
      T+=(target-T)*0.3+(eff.heat?2.5:0)-(eff.cool?3:0)+(eff.led?0.3:0);
      m-=0.35+0.05*Math.max(0,T-15)+0.004*light;
      if(eff.pump){m+=15;water+=PUMP_L}
      if(m>100){tot.overflow++;m=100}
      if(m<0)m=0;
      ['led','pump','heat','cool'].forEach(function(k){if(dev[k]){tot[k]++;cost+=PRICE[k]}});
      if(dev.led)ledH++;
      if(dev.heat&&dev.cool)tot.both++;
      var ft=fTemp(T),fw=fMoist(m);sT+=ft;sW+=fw;
      if(m<20){q-=0.4;tot.wilt++}
      if(m>90){q-=0.15;tot.wet++}
      if(T>32){q-=0.3;tot.hot++}
      if(T<4){q-=0.2;tot.cold++}
      log.push({d:d,dow:dow,h:h,sun:sun,light:light,T:Math.round(T*10)/10,m:Math.round(m*10)/10,sm:sens.moist,dev:dev,eff:eff,wx:wx[d]});
    }
    if(dark<6){q-=2;tot.nodark++}
    var fL=Math.min(1,L/NEED);if(L<NEED*0.9)tot.lackDays++;
    var f=fL*(sT/24)*(sW/24);w=grow(w,f);if(q<0)q=0;
    tot.cost+=cost;tot.water+=water;
    dlog.push({d:d,wx:wx[d],dow:dow,L:Math.round(L*10)/10,dark:dark,f:Math.round(f*100)/100,fL:fL,fT:sT/24,fW:sW/24,w:Math.round(w*10)/10,q:Math.round(q),cost:Math.round(cost*10)/10,water:water,ledH:ledH});
  }
  tot.cost=Math.round(tot.cost);
  var ship=(w>=SHIP&&q>=60)?PLANTS:0;
  return {log:log,days:dlog,tot:tot,w:Math.round(w*10)/10,q:Math.max(0,Math.round(q)),ship:ship,yieldG:Math.round(w*PLANTS),wx:wx};
}
/* ① 露地栽培と植物工場(1m² あたり)。1日ずつの簡単なモデル */
function compareSim(season,seed){
  var S=SEASON[season],wx=weathers(seed,60,season),r=rng(seed*53+season.length);
  var F={w:3,q:100,m:70,day:0,water:0,labor:0,cost:0,events:[],done:false,hist:[]};
  var P={w:3,q:100,day:0,water:0,labor:0,cost:0,done:false,hist:[]};
  for(var d=0;d<60;d++){
    var x=wx[d],dow=(1+d)%7,weekday=dow>=1&&dow<=5;
    if(!F.done){
      var T=S.t+WX[x].dt+(r()*4-2),fL=Math.min(1,WX[x].field/NEED),ev='';
      if(x==='rain')F.m=Math.min(95,F.m+35);else F.m-=(x==='sun'?18+Math.max(0,T-20):9);
      F.labor+=0.15;
      if(F.m<40&&weekday){F.m+=45;F.water+=20;F.labor+=0.3}
      if(F.m<0)F.m=0;
      var pr=r();
      if(pr<S.pest){F.q-=8;ev='虫'}
      else if(pr<S.pest+S.storm){F.q-=15;ev='大雨・台風'}
      if(T>30){F.q-=2;ev=ev||'暑さ'}
      if(T<3){F.q-=1;ev=ev||'霜'}
      F.w=grow(F.w,fL*fTemp(T)*fMoist(F.m));if(F.q<0)F.q=0;
      F.hist.push({w:F.w,wx:x,ev:ev,T:Math.round(T)});
      if(ev)F.events.push((d+1)+'日目 '+ev);
      if(F.w>=100){F.done=true;F.day=d+1}
    }
    if(!P.done){
      P.cost+=60;P.water+=1;P.labor+=0.05;
      P.w=grow(P.w,1);P.hist.push({w:P.w,wx:x});
      if(P.w>=100){P.done=true;P.day=d+1}
    }
  }
  if(!F.done)F.day=0;
  return {season:season,seed:seed,wx:wx,field:F,factory:P,fieldPer:16,factoryPer:64};
}

function defLight(){return {s:'light',op:'<',v:50,dev:'led',a:1,b:0,tm:0,ta:6,tb:20}}
function defWater(){return {s:'moist',op:'<',v:30,dev:'pump',a:1,b:0,tm:0,ta:6,tb:20}}
function normRule(r){
  if(!isObj(r)||!SENSORS[r.s]||!DEVICES[r.dev])return null;
  var S=SENSORS[r.s];
  return {s:r.s,op:['<','>'].indexOf(r.op)>=0?r.op:'<',v:clamp(Math.round(num(r.v,S.min)),S.min,S.max),dev:r.dev,a:r.a?1:0,b:r.b?1:0,tm:r.tm?1:0,ta:clamp(Math.round(num(r.ta,6)),0,23),tb:clamp(Math.round(num(r.tb,20)),0,24)};
}
function normProg(p,def){if(!Array.isArray(p))return def;var o=p.map(normRule).filter(Boolean).slice(0,6);return o.length?o:def}
function defState(){return {prog2:[defLight()],prog3:[defWater()],prog4:null,seed2:1,seed3:1,seed4:1,season4:'spring',cmpSeason:'spring',cmpSeed:1,
  cmpRuns:[],sort:null,best2:0,best3:0,last2:null,last3:null,trials:[],smartBest:null,smartW:{y:3,q:3,c:3,e:3},pick:null,pickReason:'',tab:'home'}}
function normState(o){
  var d=defState();if(!isObj(o))return d;
  d.prog2=normProg(o.prog2,d.prog2);d.prog3=normProg(o.prog3,d.prog3);d.prog4=o.prog4?normProg(o.prog4,null):null;
  ['seed2','seed3','seed4','cmpSeed'].forEach(function(k){d[k]=clamp(Math.round(num(o[k],1)),1,99)});
  if(SEASON[o.season4])d.season4=o.season4;if(SEASON[o.cmpSeason])d.cmpSeason=o.cmpSeason;
  if(Array.isArray(o.cmpRuns))d.cmpRuns=o.cmpRuns.filter(isObj).slice(-12);
  if(isObj(o.sort))d.sort=o.sort;
  d.best2=clamp(Math.round(num(o.best2,0)),0,3);d.best3=clamp(Math.round(num(o.best3,0)),0,3);
  if(isObj(o.last2))d.last2=o.last2;if(isObj(o.last3))d.last3=o.last3;
  if(Array.isArray(o.trials))d.trials=o.trials.filter(function(t){return isObj(t)&&SEASON[t.season]&&isFinite(t.score)}).slice(-30);
  if(isObj(o.smartBest))d.smartBest=o.smartBest;

/* opt: {lockS:true(センサを変えられない), lockDev:true, canAdd:true(ルールを足せる), canTime:true(時刻の条件)} */
function progHTML(prog,opt){
  var h='<div class="b5-prog"><div class="b5-blk b5-forever"><div class="b5-bh">🔁 ずっと(くり返す)</div><div class="b5-inner">';
  prog.forEach(function(r,i){
    var S=SENSORS[r.s];
    h+='<div class="b5-blk b5-if" data-ri="'+i+'"><div class="b5-bh">もし '+
      '<select data-f="s" aria-label="センサ"'+(opt.lockS?' disabled':'')+'>'+Object.keys(SENSORS).map(function(k){return '<option value="'+k+'"'+(r.s===k?' selected':'')+'>'+SENSORS[k].name+'</option>'}).join('')+'</select>'+
      '<select data-f="op" aria-label="くらべ方"><option value="<"'+(r.op==='<'?' selected':'')+'>&lt;(より小さい)</option><option value=">"'+(r.op==='>'?' selected':'')+'>&gt;(より大きい)</option></select>'+
      '<span class="b5-num"><button type="button" data-step="-1" aria-label="へらす">−</button><input type="number" data-f="v" inputmode="numeric" min="'+S.min+'" max="'+S.max+'" step="'+S.step+'" value="'+r.v+'" aria-label="くらべる数"><button type="button" data-step="1" aria-label="ふやす">＋</button></span>'+(S.unit?'<span>'+S.unit+'</span>':'');
    if(r.tm)h+='<span class="b5-tm">かつ 時刻が <select data-f="ta" aria-label="はじめの時刻">'+hours(r.ta,0,23)+'</select>時から <select data-f="tb" aria-label="おわりの時刻">'+hours(r.tb,1,24)+'</select>時まで <button type="button" class="b5-mini" data-act="tmoff" aria-label="時刻の条件をはずす">✕</button></span>';
    h+=' なら <span class="b5-eval" data-eval="'+i+'">-</span>';
    if(opt.canAdd)h+='<span class="b5-tools2"><button type="button" class="b5-mini" data-act="up" aria-label="上へ"'+(i===0?' disabled':'')+'>↑</button><button type="button" class="b5-mini" data-act="down" aria-label="下へ"'+(i===prog.length-1?' disabled':'')+'>↓</button><button type="button" class="b5-mini" data-act="del" aria-label="このルールを消す">🗑</button></span>';
    h+='</div><div class="b5-inner"><div class="b5-blk b5-out"><div class="b5-bh">'+devSel(r,opt)+' を <select data-f="a" aria-label="成り立つとき">'+onoff(r.a)+'</select> にする</div></div></div>';
    h+='<div class="b5-bh">でなければ</div><div class="b5-inner"><div class="b5-blk b5-out"><div class="b5-bh"><span>'+DEVICES[r.dev].ic+' '+DEVICES[r.dev].short+'</span> を <select data-f="b" aria-label="成り立たないとき">'+onoff(r.b)+'</select> にする</div></div></div>';
    if(opt.canTime&&!r.tm)h+='<button type="button" class="b5-add" data-act="tmon">＋「かつ 時刻が ○時から○時まで」の条件を足す</button>';
    h+='</div>';
  });
  h+='</div></div>';
  if(opt.canAdd&&prog.length<6)h+='<button type="button" class="b5-add" data-act="add">＋「もし〜なら〜でなければ」のブロックを足す</button>';
  return h+'</div>';
  function hours(v,a,b){var s='';for(var x=a;x<=b;x++)s+='<option value="'+x+'"'+(+v===x?' selected':'')+'>'+x+'</option>';return s}
  function onoff(v){return '<option value="1"'+(v?' selected':'')+'>ON</option><option value="0"'+(!v?' selected':'')+'>OFF</option>'}
  function devSel(r,opt){return '<select data-f="dev" aria-label="動かす機器"'+(opt.lockDev?' disabled':'')+'>'+Object.keys(DEVICES).map(function(k){return '<option value="'+k+'"'+(r.dev===k?' selected':'')+'>'+DEVICES[k].ic+' '+DEVICES[k].short+'</option>'}).join('')+'</select>'}
}
function bindProg(el,prog,opt,changed){
  function rerender(){el.innerHTML=progHTML(prog,opt);rb(el);changed()}
  el.innerHTML=progHTML(prog,opt);rb(el);
  el.addEventListener('change',function(e){
    var t=e.target,b=t.closest('[data-ri]');if(!b||!t.dataset.f)return;var r=prog[+b.dataset.ri],f=t.dataset.f;
    if(f==='v'){var S=SENSORS[r.s];r.v=clamp(Math.round(num(t.value,r.v)),S.min,S.max);t.value=r.v}
    else if(f==='s'){r.s=t.value;var S2=SENSORS[r.s];r.v=clamp(r.v,S2.min,S2.max);if(r.s==='time'&&r.v>23)r.v=12;rerender();return}
    else if(f==='dev'){r.dev=t.value;rerender();return}
    else if(f==='a'||f==='b'||f==='ta'||f==='tb')r[f]=+t.value;
    else r[f]=t.value;
    changed();
  });
  el.addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t)return;var b=t.closest('[data-ri]'),i=b?+b.dataset.ri:-1;
    if(t.dataset.step){var r=prog[i],S=SENSORS[r.s];r.v=clamp(r.v+S.step*(+t.dataset.step),S.min,S.max);var inp=b.querySelector('[data-f="v"]');if(inp)inp.value=r.v;changed();return}
    var a=t.dataset.act;if(!a)return;
    if(a==='tmon'){prog[i].tm=1;rerender()}
    else if(a==='tmoff'){prog[i].tm=0;rerender()}
    else if(a==='up'&&i>0){var x=prog.splice(i,1)[0];prog.splice(i-1,0,x);rerender()}
    else if(a==='down'&&i<prog.length-1){var y=prog.splice(i,1)[0];prog.splice(i+1,0,y);rerender()}
    else if(a==='del'){if(prog.length<=1){toast('ブロックは1つは必要です');return}prog.splice(i,1);rerender()}
    else if(a==='add'){prog.push({s:'temp',op:'>',v:25,dev:'cool',a:1,b:0,tm:0,ta:6,tb:20});rerender()}
  });
}

var player=null;
function stopPlayer(){if(player){player.stop=true;player=null}}
/* res(simulate の結果)を時間の順に見せる。speed: 1日あたりの秒 */
function play(res,o){
  stopPlayer();
  var p={stop:false},n=res.log.length,i=0,last=0,acc=0;player=p;
  var spd=o.speed;
  if(spd===0){o.frame(n-1);o.end();player=null;return}
  function step(t){
    if(p.stop)return;
    if(!last)last=t;var dt=Math.min(100,t-last);last=t;acc+=dt/1000*24/spd;
    var k=Math.floor(acc);if(k>0){acc-=k;i=Math.min(n-1,i+k);o.frame(i)}
    if(i>=n-1){player=null;o.end();return}
    requestAnimationFrame(step);
  }
  o.frame(0);requestAnimationFrame(step);
}

function lightRef(seed){

    if(r.tot.lackDays===0&&r.tot.nodark===0&&r.tot.cost<best)best=r.tot.cost}
  return (refCache[seed]=best);
}

var COST_BASE={spring:500,summer:3000,winter:2400};
function scoreOf(res,season){
  var t=res.tot,yP=Math.min(1,res.w/100)*35,qP=res.q/100*25,base=COST_BASE[season];
  var g=clamp(res.w/SHIP,0,1)*clamp(res.q/60,0,1);/* 育たなかったときは、費用・環境の点も低くする(何もしないのがいちばん安いので) */
  var cP=20*g*clamp((base*2-t.cost)/(base*1.5),0,1),wP=5*g*clamp((200-t.water)/150,0,1),eP=5*g*clamp((base*2-t.cost)/(base*1.5),0,1);
  var sIss=(t.overflow>0?4:0)+(t.both>0?3:0)+(t.hot>5?3:0)+(t.cold>5?2:0),sP=Math.max(0,10-sIss);
  qP*=clamp(res.w/SHIP,0,1);
  var score=Math.round(yP+qP+cP+wP+eP+sP);
  var radar={quality:clamp(Math.round(res.q/20),1,5),yield:clamp(Math.round(Math.min(1.2,res.w/100)/1.2*5),1,5),cost:clamp(Math.round(cP/4),1,5),safety:clamp(Math.round(sP/2),1,5),env:clamp(Math.round((wP+eP)/2),1,5)};
  return {score:score,radar:radar,parts:{y:Math.round(yP),q:Math.round(qP),c:Math.round(cP),e:Math.round(wP+eP),s:sP}};
}
var RADAR_AX=[['quality','品質'],['yield','収量'],['cost','費用'],['safety','安全性'],['env','環境への配慮']];
function radarSVG(sets){
  var W=320,cx=160,cy=150,R=100,s='<svg class="b5-radar" viewBox="0 0 '+W+' 290" role="img" aria-label="評価のレーダーチャート" font-size="14">';
  function pt(i,v){var a=-Math.PI/2+i*2*Math.PI/5;return [cx+Math.cos(a)*R*v/5,cy+Math.sin(a)*R*v/5]}
  for(var lv=1;lv<=5;lv++){s+='<polygon points="'+RADAR_AX.map(function(_,i){return pt(i,lv).join(',')}).join(' ')+'" fill="none" stroke="#c9c1d9"/>'}
  RADAR_AX.forEach(function(a,i){var p=pt(i,5),q=pt(i,6.1);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#c9c1d9"/><text x="'+q[0]+'" y="'+(q[1]+5)+'" text-anchor="middle" fill="#3a2a5a" font-weight="700">'+a[1]+'</text>'});
  sets.forEach(function(st){if(!st||!st.v)return;s+='<polygon points="'+RADAR_AX.map(function(a,i){return pt(i,clamp(st.v[a[0]]||0,0,5)).join(',')}).join(' ')+'" fill="'+st.fill+'" stroke="'+st.color+'" stroke-width="2.5"'+(st.dash?' stroke-dasharray="6 4"':'')+'/>'});
  return s+'</svg>';
}

function bestTrial(){return ST.trials.slice().sort(function(a,b){return b.score-a.score})[0]||null}
RENDER.refl=function(el){
  var d=getRefl(),bt=bestTrial(),auto=bt?bt.radar:null;
  if(!d.radar)d.radar=auto?JSON.parse(JSON.stringify(auto)):{quality:3,yield:3,cost:3,safety:3,env:3};
  var h='<div class="b5-card"><h1>振り返り</h1><p>学習したことをふり返って書きましょう。入力すると自動で保存されます。書き終わったら「書き出す」で提出用のファイルをつくれます。</p>';
  h+='<div class="b5-who"><div><label class="b5-f" for="b5-r-cls">組</label><input type="text" id="b5-r-cls" data-who="cls" value="'+esc(d.cls)+'"></div><div><label class="b5-f" for="b5-r-no">番号</label><input type="text" id="b5-r-no" data-who="no" value="'+esc(d.no)+'" inputmode="numeric"></div><div><label class="b5-f" for="b5-r-name">名前</label><input type="text" id="b5-r-name" data-who="name" value="'+esc(d.name)+'"></div></div></div>';
  h+='<div class="b5-card"><h2>学習の記録(自動)</h2><div class="b5-summary">'+esc(autoSummary()).replace(/\n/g,'<br>')+'</div></div>';
  h+='<div class="b5-card"><h2>評価のレーダーチャート</h2><p>自分がつくった植物工場を、5つの観点で評価しよう(1〜5)。④でいちばん点数の高い設定を使います。点線はシミュレーションの点数から出した目安です。</p><div class="b5-radar-wrap"><div id="b5-rd">'+radarSVG([auto?{v:auto,color:'#888',fill:'none',dash:1}:null,{v:d.radar,color:'#7b3fa0',fill:'rgba(123,63,160,.2)'}])+'</div><div class="b5-rs">'+
    RADAR_AX.map(function(a){return '<div><span>'+a[1]+'</span><span class="b5-num"><button type="button" data-rd="'+a[0]+'" data-d="-1" aria-label="'+a[1]+'を下げる">−</button><input type="number" readonly value="'+d.radar[a[0]]+'" data-rv="'+a[0]+'" aria-label="'+a[1]+'"><button type="button" data-rd="'+a[0]+'" data-d="1" aria-label="'+a[1]+'を上げる">＋</button></span></div>'}).join('')+'</div></div></div>';
  h+='<div class="b5-card"><h2>ふり返りを書こう</h2>';
  RQ.forEach(function(q,i){h+='<label class="b5-f" for="b5-r-'+q.k+'">'+(i+1)+'. '+q.t+'</label><textarea id="b5-r-'+q.k+'" data-r="'+q.k+'" placeholder="'+esc(q.ph)+'">'+esc(d[q.k]||'')+'</textarea>'});
  h+='</div><div class="b5-card"><h2>自己評価</h2>';
  EV.forEach(function(e){h+='<div class="b5-evr"><div>'+e.t+'</div><div class="b5-seg" data-ev="'+e.k+'" role="group" aria-label="'+esc(e.t)+'">'+EVL.map(function(l,i){return '<button type="button" data-v="'+i+'" aria-pressed="'+(d.ev[e.k]===i?'true':'false')+'">'+l+'</button>'}).join('')+'</div></div>'});
  h+='</div><div class="b5-card b5-noprint"><div class="b5-btns"><button type="button" class="b5-btn b5-pri" id="b5-r-txt">テキストで書き出す(.txt)</button><button type="button" class="b5-btn" id="b5-r-copy">コピーする</button><button type="button" class="b5-btn" id="b5-r-print">印刷する</button><button type="button" class="b5-btn" id="b5-r-json">データで書き出す(.json)</button></div><div class="b5-saved" id="b5-r-saved">'+savedLabel(d.saved)+'</div></div>';
  el.innerHTML=h;rb(el);printSync(el);
  function sv(){var ok=saveRefl();$('#b5-r-saved',el).textContent=ok?savedLabel(d.saved):'保存できませんでした'}
  $$('[data-who]',el).forEach(function(i){i.addEventListener('input',function(){d[i.dataset.who]=i.value;sv()})});
  $$('[data-r]',el).forEach(function(i){i.addEventListener('input',function(){d[i.dataset.r]=i.value;sv()})});
  $$('[data-ev]',el).forEach(function(g){g.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;d.ev[g.dataset.ev]=+b.dataset.v;$$('button',g).forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});sv()})});
  $$('[data-rd]',el).forEach(function(b){b.addEventListener('click',function(){var k=b.dataset.rd;d.radar[k]=clamp((d.radar[k]||3)+(+b.dataset.d),1,5);$('[data-rv="'+k+'"]',el).value=d.radar[k];
    $('#b5-rd',el).innerHTML=radarSVG([auto?{v:auto,color:'#888',fill:'none',dash:1}:null,{v:d.radar,color:'#7b3fa0',fill:'rgba(123,63,160,.2)'}]);sv()})});
  $('#b5-r-txt',el).addEventListener('click',function(){download('B5_振り返り_'+whoFile()+'.txt','\ufeff'+reflText(),'text/plain;charset=utf-8')});
  $('#b5-r-copy',el).addEventListener('click',function(){copyText(reflText())});
  $('#b5-r-print',el).addEventListener('click',function(){printSync(el);window.print()});
  $('#b5-r-json',el).addEventListener('click',exportAll);
};
function autoSummary(){
  var t='';
  t+='① くらべる:'+(ST.cmpRuns.length?ST.cmpRuns.length+'回('+ST.cmpRuns.slice(-3).map(function(r){return SEASON[r.season].name+' 露地 '+(r.fDay?r.fDay+'日':'育ちきらない')+'・工場 '+r.pDay+'日'}).join('/')+')':'まだ')+'\n';
  t+='   仕分けクイズ:'+(ST.sort&&ST.sort.checked?ST.sort.score+' / '+SORT.length+' 問':'まだ')+'\n';
  t+='② 照明の自動化:'+(ST.last2?stars(ST.best2)+'(最後:LED '+ST.last2.led+'時間・電気代 '+yen(ST.last2.cost)+'・プログラム「'+ST.last2.prog+'」)':'まだ')+'\n';
  t+='③ 水やりの自動化:'+(ST.last3?stars(ST.best3)+'(最後:水 '+ST.last3.water+'L・しおれ '+ST.last3.wilt+'時間・プログラム「'+ST.last3.prog+'」)':'まだ')+'\n';
  var bt=bestTrial();
  t+='④ 全部を自動に:'+(bt?ST.trials.length+'回 ためした。いちばんよい点 '+bt.score+'点(第'+bt.no+'回 '+SEASON[bt.season].name+'・1株 '+Math.round(bt.w)+'g・品質 '+bt.q+'・電気代 '+yen(bt.cost)+'・水 '+bt.water+'L)\n   プログラム「'+bt.prog+'」':'まだ')+'\n';
  t+='⑤ スマート農業:'+(ST.smartBest?'遠隔監視のチャレンジ '+ST.smartBest.score+' / 6 点':'まだ')+(ST.pick?'。自分がえらんだ設定:第'+ST.pick+'回':'');
  return t;
}
function reflText(){
  var d=getRefl(),t='【B5 植物工場の自動化 振り返り】\n日付:'+today()+'\n'+whoLine()+'\n\n■学習の記録\n'+autoSummary()+'\n\n';
  t+='■評価(1〜5)\n'+RADAR_AX.map(function(a){return a[1]+':'+(d.radar?d.radar[a[0]]:'')}).join(' / ')+'\n\n';
  RQ.forEach(function(q,i){t+='■'+(i+1)+'. '+q.t+'\n'+(d[q.k]||'')+'\n\n'});
  if(ST.pickReason)t+='■⑤ えらんだ設定の理由\n'+ST.pickReason+'\n\n';
  t+='■自己評価\n';EV.forEach(function(e){t+='・'+e.t+':'+(d.ev[e.k]!=null&&EVL[d.ev[e.k]]?EVL[d.ev[e.k]]:'未記入')+'\n'});
  return plain(t);
}

/* ================= 記録(書き出し・読み込み) ================= */
RENDER.rec=function(el){
  var h='<div class="b5-card"><h1>記録</h1><p>この教材の記録は、この端末のブラウザの中に保存されています。先生の指示があったら、データで書き出して提出しましょう。</p>';
  h+='<div class="b5-summary">'+esc(autoSummary()).replace(/\n/g,'<br>')+'</div>';
  h+='<div class="b5-btns"><button type="button" class="b5-btn b5-pri" id="b5-x-json">データで書き出す(.json)</button><button type="button" class="b5-btn" id="b5-x-imp">書き出したファイルを読みこむ</button><button type="button" class="b5-btn" id="b5-x-del">この教材の記録をすべて消す</button></div>';
  h+='<p class="b5-small">書き出したファイル(B5_データ_…json)は、先生用の「振り返り一覧」で読みこめます。</p></div>';
  el.innerHTML=h;rb(el);
  $('#b5-x-json').addEventListener('click',exportAll);
  $('#b5-x-imp').addEventListener('click',function(){$('#b5-file').click()});
  $('#b5-x-del').addEventListener('click',function(){kzConfirm('B5 の記録(①〜⑤の結果・ランキング・プログラム・振り返り)をすべて消します。もとにもどせません。よろしいですか?',{ok:'すべて消す',danger:true}).then(function(ok){if(!ok)return;
    ['state','refl','reflstat','speed'].forEach(store.del);ST=defState();reflData=null;quiz5=null;last4=null;man3=null;toast('消しました');showTab('rec')})});
};
function exportAll(){
  var data={app:'B5',version:1,exported:new Date().toISOString(),data:{state:ST,refl:getRefl()}};
  download('B5_データ_'+(whoFile()?whoFile()+'_':'')+today()+'.json',JSON.stringify(data,null,1),'application/json');
}
$('#b5-file').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){
    var o;try{o=JSON.parse(rd.result)}catch(err){o=null}
    if(!isObj(o)||o.app!=='B5'||!isObj(o.data)){toast('このファイルは読み込めません(B5のデータではありません)');return}
    kzConfirm('いまの B5 の記録を、読み込んだデータで置きかえます。いまの記録は消えます。よろしいですか?',{ok:'置きかえる',danger:true}).then(function(yes){if(!yes)return;
      ST=normState(o.data.state);save();if(isObj(o.data.refl)){store.set('refl',o.data.refl);reflData=null;writeReflStat(getRefl())}
      quiz5=null;last4=null;man3=null;toast('読み込みました');showTab('rec');
    });
  };
  rd.readAsText(f);e.target.value='';
});

if(store.get('refl',null)!==null){try{if(localStorage.getItem('b5_reflstat')===null)writeReflStat(getRefl())}catch(e){}}
applySettings();
rb($('.b5-nav'));
showTab(ST.tab&&RENDER[ST.tab]?ST.tab:'home');
// テスト用に計算部分を公開(画面には影響しません)
window.B5SIM={simulate:simulate,compareSim:compareSim,scoreOf:scoreOf,starsLight:starsLight,starsWater:starsWater,lightRef:lightRef,CASES:CASES,GOODP:GOODP};
})();
</script>
