<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B3 栽培暦ビルダー</title>
<link rel="stylesheet" href="../../shared/eduit-frame.css">
<script src="../eduit-info.js"></script>
<script>EDUIT_INFO.app = { name: 'B3 栽培暦ビルダー' };</script>
<script src="../../shared/eduit-frame.js"></script>
<style>body{background:var(--ef-bg)}</style>
<style>
#b3-app{
  /* 共通の枠(shared/eduit-frame.css)の色にそろえる */
  --b3-bg:var(--ef-bg); --b3-card:var(--ef-surface); --b3-ink:var(--ef-text); --b3-sub:var(--ef-muted); --b3-line:#cdd6c6;
  --b3-main:var(--ef-accent); --b3-main-d:#1b5e20; --b3-soft:var(--ef-accent-soft); --b3-warn:#a85b00; --b3-warn-bg:#fff4e0;
  --b3-bad:#b3261e; --b3-bad-bg:#fdeceb; --b3-hol:#eef0f6;
  font-family:var(--ef-font);
  font-size:1rem; line-height:1.6; color:var(--b3-ink); background:var(--b3-bg);
  min-height:100vh; box-sizing:border-box; -webkit-text-size-adjust:100%; overflow-wrap:anywhere;
}
#b3-app *,#b3-app *::before,#b3-app *::after{box-sizing:inherit}
#b3-app rt{font-size:.55em}
:where(#b3-app button,#b3-app input,#b3-app select,#b3-app textarea){font:inherit;color:inherit}
/* タブの帯は共通の .ef-apptabs・.ef-apptab(字＋下線)。.b3-tabs は JS がタブを探すための名前。ここには置き場所だけを書く */
#b3-app .b3-tabs{position:sticky;top:0;z-index:5}
#b3-app button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#b3-app :focus-visible{outline:3px solid #1565c0;outline-offset:2px}
/* 見出しは共通の枠(.ef-header)。タブの帯は分野の色 */
#b3-app .b3-head h1{flex:1 1 auto}
#b3-app .ef-btn{font:600 15px/1.2 var(--ef-font);color:var(--ef-text)}
#b3-app .ef-btn[aria-pressed="true"]{color:var(--ef-accent-ink)}
#b3-app .b3-tools button{min-height:44px;min-width:48px}
#b3-app .b3-tools button:disabled{opacity:.4;cursor:not-allowed}
html.kz-embed #b3-app .b3-head{display:none}
/* タブ(K4) */
#b3-app.b3-big .b3-tabs .b3-tl{display:none}
/* スマホ: タブの名前を折り返さず、帯を1行にして横にスクロール */
#b3-app .b3-tbl td:nth-child(3),#b3-app .b3-tbl td:nth-child(4){white-space:nowrap}
#b3-app main{padding:1em;max-width:1200px;margin:0 auto}
#b3-app h2{font-size:1.2em;margin:.2em 0 .5em;color:var(--b3-main-d)}
#b3-app h3{font-size:1.05em;margin:.8em 0 .4em}
#b3-app .b3-lead{background:var(--b3-soft);border-left:6px solid var(--b3-main);padding:.6em .9em;border-radius:0;margin:0 0 1em}
#b3-app .b3-card{background:var(--b3-card);border:1px solid var(--b3-line);border-radius:0;padding:1em;margin-bottom:1em;min-width:0}
#b3-app .b3-grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1em;align-items:start}
#b3-app .b3-grid2>*{min-width:0}
@media (max-width:860px){#b3-app .b3-grid2{grid-template-columns:minmax(0,1fr)}}
#b3-app .b3-btn{min-height:48px;padding:.3em 1em;border-radius:0;border:2px solid var(--b3-main);background:#fff;color:var(--b3-main-d);font-weight:bold;max-width:100%}
#b3-app .b3-btn.b3-primary{background:var(--b3-main);color:#fff}
#b3-app .b3-btn.b3-danger{border-color:var(--b3-bad);color:var(--b3-bad)}
#b3-app .b3-btn.b3-small{min-height:44px;min-width:48px;padding:.1em .7em;font-size:.9em}
#b3-app .b3-btn:disabled{opacity:.45;cursor:not-allowed}
#b3-app .b3-row{display:flex;gap:.6em;flex-wrap:wrap;align-items:center}
#b3-app .b3-seg{display:flex;flex-wrap:wrap;gap:.5em}
#b3-app .b3-seg button{min-height:52px;min-width:0;flex:1 1 8em;border:2px solid var(--b3-line);background:#fff;border-radius:0;padding:.3em .6em;text-align:left;line-height:1.35}
#b3-app .b3-seg button small{display:block;color:var(--b3-sub);font-size:.75em}
#b3-app .b3-seg button[aria-pressed="true"]{border-color:var(--b3-main);background:var(--b3-soft);box-shadow:0 0 0 2px var(--b3-main) inset}
#b3-app .b3-seg button[aria-pressed="true"]::before{content:"✔ ";color:var(--b3-main);font-weight:bold}
#b3-app label.b3-field{display:block;margin:.5em 0}
#b3-app label.b3-field>span{display:block;font-weight:bold;margin-bottom:.2em}
#b3-app input[type=date],#b3-app input[type=text],#b3-app input[type=number],#b3-app select{min-height:48px;border:2px solid var(--b3-line);border-radius:0;padding:.2em .5em;background:#fff;max-width:100%;min-width:0}
#b3-app textarea{width:100%;min-height:6em;border:2px solid var(--b3-line);border-radius:0;padding:.5em;background:#fff;resize:vertical}
#b3-app input[type=checkbox]{width:30px;height:30px;vertical-align:middle;accent-color:var(--b3-main);margin:0}
#b3-app .b3-check{display:inline-flex;align-items:center;gap:.4em;min-height:48px;white-space:nowrap;cursor:pointer}
#b3-app .b3-cbx{display:flex;justify-content:center;align-items:center;min-width:56px;min-height:56px;margin:-.35em -.45em;cursor:pointer}
#b3-app .b3-crops{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(14em,100%),1fr));gap:.8em;margin-bottom:1em}
#b3-app .b3-crop{display:flex;gap:.7em;align-items:center;text-align:left;border:2px solid var(--b3-line);background:#fff;border-radius:0;padding:.7em;min-height:84px;min-width:0}
#b3-app .b3-crop[aria-pressed="true"]{border-color:var(--b3-main);background:var(--b3-soft);box-shadow:0 0 0 3px var(--b3-main) inset}
#b3-app .b3-badge{flex:0 0 auto;width:2.4em;height:2.4em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:1.05em}
#b3-app .b3-crop b{display:block;font-size:1.05em}
#b3-app .b3-crop small{color:var(--b3-sub);font-size:.8em;display:block;line-height:1.4}
/* 作業の流れ */
#b3-app .b3-flow{list-style:none;margin:0;padding:0;position:relative}
#b3-app .b3-flow li{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:.6em;padding:.45em 0;border-bottom:1px dashed var(--b3-line);align-items:start}
@supports (grid-template-columns:subgrid){
  #b3-app .b3-flow{display:grid;grid-template-columns:minmax(6em,max-content) minmax(0,1fr);column-gap:.8em}
  #b3-app .b3-flow li{grid-column:1/-1;grid-template-columns:subgrid}
}
#b3-app .b3-flow li:last-child{border-bottom:0}
#b3-app .b3-flow .b3-when{font-weight:bold;color:var(--b3-main-d)}
#b3-app .b3-flow .b3-note{display:block;font-size:.82em;color:var(--b3-warn)}
#b3-app .b3-flow li.b3-done .b3-what{text-decoration:line-through;color:var(--b3-sub)}
#b3-app .b3-flow li.b3-prep .b3-when{color:#6d4c41}
#b3-app .b3-obs{display:inline-block;font-size:.78em;border:1.5px dashed #5c6bc0;color:#283593;border-radius:0;padding:0 .4em;margin-left:.3em;font-weight:bold;white-space:nowrap}
#b3-app .b3-gq{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:0;background:transparent;padding:0;vertical-align:middle;margin:-8px 0}
#b3-app .b3-gq>span{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;border:2px solid var(--b3-main);background:#eef6ec;color:var(--b3-main-d);font-weight:bold;font-size:.85em;line-height:1}
#b3-app .b3-msg{padding:.6em .8em;border-radius:0;margin:.5em 0;border:2px solid}
#b3-app .b3-msg.b3-warn{background:var(--b3-warn-bg);border-color:#f0b765;color:#5a3300}
#b3-app .b3-msg.b3-bad{background:var(--b3-bad-bg);border-color:#e7a29d;color:#6b120d}
#b3-app .b3-msg.b3-ok{background:var(--b3-soft);border-color:#9cc995;color:#173d19}
#b3-app .b3-msg.b3-info{background:#eaf2fb;border-color:#a7c4e6;color:#123a63}
#b3-app .b3-msg .b3-btn{margin-top:.3em}
/* 休業日(2段組み) */
#b3-app .b3-hol-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"name rep del" "dates dates dates";gap:.3em .5em;align-items:center;margin:.4em 0;padding:.4em 0;border-bottom:1px dashed var(--b3-line)}
#b3-app .b3-hol-item .b3-hn{grid-area:name;width:100%}
#b3-app .b3-hol-item .b3-check{grid-area:rep}
#b3-app .b3-hol-item .b3-hdel{grid-area:del;white-space:nowrap}
#b3-app .b3-hol-item .b3-dates{grid-area:dates;display:flex;gap:.3em;align-items:center;flex-wrap:wrap}
#b3-app .b3-hol-item .b3-dates input{flex:1 1 9em}
#b3-app .b3-hol-item .b3-hmsg{grid-column:1/-1;margin:0}
#b3-app .b3-chipbtn{min-height:44px;border:2px dashed var(--b3-main);background:#fff;color:var(--b3-main-d);border-radius:0;padding:0 .9em;font-weight:bold}
#b3-app .b3-plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(16em,100%),1fr));gap:.7em}
#b3-app .b3-plan{border:2px solid var(--b3-line);border-left-width:10px;border-radius:0;padding:.6em .8em;background:#fff;min-width:0}
#b3-app .b3-plan.b3-cur{box-shadow:0 0 0 3px #f9a825}
#b3-app .b3-plan .b3-row{margin-top:.4em}
/* 縦向きの要約バー */
#b3-app .b3-sumbar{display:none}
@media (max-width:860px){
  #b3-app .b3-sumbar{display:flex;position:sticky;bottom:0;z-index:4;gap:.5em;align-items:center;flex-wrap:wrap;background:#fff;border:2px solid var(--b3-main);border-radius:0;padding:.5em .7em;margin:0 0 1em;box-shadow:none}
  #b3-app .b3-sumbar .b3-sumtxt{flex:1 1 12em;line-height:1.4;min-width:0}
}
/* calendar */
#b3-app .b3-calbar{display:flex;flex-wrap:wrap;gap:.5em;align-items:center;margin-bottom:.6em}
#b3-app .b3-calbar .b3-title{font-size:1.2em;font-weight:bold;min-width:6em;text-align:center}
#b3-app .b3-calbar select{flex:1 1 10em}
#b3-app .b3-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--b3-line);border-radius:0;overflow:hidden;background:#fff}
#b3-app .b3-month .b3-dow{text-align:center;font-weight:bold;padding:.2em;background:#e9eee5;font-size:.9em}
#b3-app .b3-dow.b3-sun,#b3-app .b3-day.b3-sun .b3-dnum{color:#c62828}
#b3-app .b3-dow.b3-sat,#b3-app .b3-day.b3-sat .b3-dnum{color:#1565c0}
#b3-app .b3-day{min-height:6.2em;min-width:0;border-top:1px solid var(--b3-line);border-left:1px solid var(--b3-line);padding:.2em;text-align:left;background:#fff;display:flex;flex-direction:column;gap:2px;overflow:hidden;border-radius:0;border-right:0;border-bottom:0}
#b3-app .b3-day:nth-child(7n+1){border-left:0}
#b3-app .b3-day.b3-out{background:#f3f3f3;color:#999}
#b3-app .b3-day.b3-holday{background:repeating-linear-gradient(135deg,var(--b3-hol) 0 8px,#fff 8px 16px)}
#b3-app .b3-day.b3-today{box-shadow:inset 0 0 0 3px #f9a825}
#b3-app .b3-day.b3-sel{box-shadow:inset 0 0 0 4px #1565c0}
#b3-app .b3-dnum{font-weight:bold;font-size:.9em;line-height:1.2}
#b3-app .b3-hl{font-size:.78em;color:#3d4a7a;line-height:1.2;font-weight:bold;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#b3-app .b3-ev{font-size:.8em;line-height:1.35;border-radius:0;padding:1px 4px;border-left:5px solid;background:#f5f7f2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;word-break:break-all}
#b3-app .b3-ev.b3-evobs{background:#fff;border-top:1.5px dashed #7986cb;border-right:1.5px dashed #7986cb;border-bottom:1.5px dashed #7986cb}
#b3-app .b3-ev.b3-evdone{text-decoration:line-through;opacity:.65}
#b3-app .b3-evk{display:inline-block;color:#fff;border-radius:0;padding:0 3px;margin-right:2px;font-size:.9em;line-height:1.3}
#b3-app .b3-more{font-size:.75em;color:var(--b3-sub)}
#b3-app .b3-week{display:flex;flex-direction:column;gap:.4em}
#b3-app .b3-wday{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:.6em;background:#fff;border:1px solid var(--b3-line);border-radius:0;padding:.5em;text-align:left;min-height:64px}
#b3-app .b3-wday.b3-holday{background:repeating-linear-gradient(135deg,var(--b3-hol) 0 8px,#fff 8px 16px)}
#b3-app .b3-wday.b3-today{box-shadow:inset 0 0 0 3px #f9a825}
#b3-app .b3-wday.b3-sel{box-shadow:inset 0 0 0 4px #1565c0}
#b3-app .b3-wday .b3-ev{font-size:.9em;margin-bottom:3px;-webkit-line-clamp:3}
#b3-app .b3-legend{display:flex;flex-wrap:wrap;gap:.8em;font-size:.85em;margin:.6em 0;color:var(--b3-sub)}
#b3-app .b3-legend span{display:inline-flex;align-items:center;gap:.3em}
#b3-app .b3-sw{display:inline-block;width:1.2em;height:1.2em;border-radius:4px;border:1px solid var(--b3-line)}
#b3-app .b3-daypanel .b3-task{display:flex;gap:.6em;align-items:center;justify-content:space-between;border-left:8px solid;padding:.4em .6em;margin:.4em 0;background:#fafbf8;border-radius:0;flex-wrap:wrap}
#b3-app .b3-daypanel .b3-task>span{min-width:0;flex:1 1 14em}
/* eval table */
#b3-app .b3-tablewrap{overflow-x:auto}
#b3-app table.b3-tbl{border-collapse:collapse;width:100%;min-width:640px;background:#fff}
#b3-app .b3-tbl th,#b3-app .b3-tbl td{border:1px solid var(--b3-line);padding:.35em .45em;text-align:left;vertical-align:middle}
#b3-app .b3-tbl th{background:#e9eee5;font-size:.9em}
#b3-app .b3-tbl tr.b3-done td{background:#f2f8f0}
#b3-app .b3-tbl tr.b3-trobs td{background:#f7f8fd}
#b3-app .b3-late{color:var(--b3-bad);font-weight:bold}
#b3-app .b3-early{color:#1565c0;font-weight:bold}
#b3-app .b3-ontime{color:var(--b3-main-d);font-weight:bold}
#b3-app .b3-stepper{display:inline-flex;align-items:center;gap:.3em}
#b3-app .b3-stepper .b3-btn{min-width:48px}
#b3-app .b3-stepper input{width:4.5em;text-align:center}
#b3-app .b3-self{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.4em .8em;align-items:center}
@media (max-width:700px){#b3-app .b3-self{grid-template-columns:minmax(0,1fr)}}
#b3-app .b3-self .b3-seg button{flex:0 0 auto;min-width:4.2em;text-align:center}
#b3-app .b3-who{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.7fr) minmax(0,2fr);gap:.6em}
#b3-app .b3-who label.b3-field{margin:0}
#b3-app .b3-who input{width:100%}
@media (max-width:520px){#b3-app .b3-who{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}#b3-app .b3-who .b3-wname{grid-column:1/-1}}
#b3-app .b3-saved{color:var(--b3-sub);font-size:.85em}
#b3-app .b3-toast{position:fixed;left:50%;bottom:1.5em;transform:translateX(-50%) translateY(200%);opacity:0;visibility:hidden;background:#263238;color:#fff;padding:.7em 1.2em;border-radius:0;max-width:90vw;transition:transform .25s,opacity .25s,visibility .25s;z-index:20;pointer-events:none}
#b3-app .b3-toast.b3-show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
#b3-app .b3-hidden{display:none!important}
#b3-app .b3-muted{color:var(--b3-sub);font-size:.88em}
#b3-app .b3-cost{background:#fff8e1;border:2px solid #ecd59c;border-radius:0;padding:.6em .8em;margin:.5em 0}
#b3-app .b3-cost table{border-collapse:collapse;width:100%;font-size:.92em;margin:.3em 0}
#b3-app .b3-cost td{border-bottom:1px dashed #e3cf95;padding:.2em .3em}
#b3-app .b3-cost td:last-child{text-align:right;white-space:nowrap}
#b3-app .b3-cost tr.b3-tot td{font-weight:bold;border-bottom:0}
#b3-app .b3-bottomnav{display:flex;justify-content:space-between;gap:.6em;margin-top:1em;flex-wrap:wrap}
/* 栽培計画書(PDF・Googleドキュメント用に書き出す画面) */
#b3-app .b3-docov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;background:rgba(0,0,0,.5);display:flex;justify-content:center;padding:10px;box-sizing:border-box}
#b3-app .b3-docbox{background:var(--b3-bg);border-radius:0;width:100%;max-width:980px;display:flex;flex-direction:column;overflow:hidden;box-shadow:none}
#b3-app .b3-docbar{flex:0 0 auto;padding:.5em .8em;border-bottom:1px solid var(--b3-line);background:var(--b3-card)}
#b3-app .b3-docbar h2{margin:0 0 .3em;font-size:1.1em}
#b3-app .b3-docbar .b3-row{gap:.4em}
#b3-app .b3-docbar .b3-btn{min-height:44px;padding:.2em .8em}
#b3-app .b3-dochint{margin:.3em 0 0}
#b3-app .b3-docscroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px;background:#d9ded5}
#b3-app .b3-doc{background:#fff;color:#000;max-width:800px;margin:0 auto;padding:28px 32px;font-size:15px;line-height:1.6;box-shadow:none}
@media print{
  html.b3-printdoc body>:not(#b3-app),#b3-app.b3-printdoc>:not(.b3-docov){display:none!important}
  #b3-app.b3-printdoc .b3-docov{position:static;display:block;background:none;padding:0}
  #b3-app.b3-printdoc .b3-docbox{display:block;border-radius:0;max-width:none;box-shadow:none;background:#fff}
  #b3-app.b3-printdoc .b3-docbar{display:none!important}
  #b3-app.b3-printdoc .b3-docscroll{overflow:visible;padding:0;background:#fff}
  #b3-app.b3-printdoc .b3-doc{max-width:none;padding:0;box-shadow:none;font-size:11pt}
  #b3-app .b3-doc tr{break-inside:avoid}
  #b3-app .b3-head,#b3-app .b3-tabs,#b3-app .b3-noprint,#b3-app .b3-toast,#b3-app .b3-sumbar,#b3-app .b3-gq{display:none!important}
  #b3-app{background:#fff;min-height:0}
  #b3-app .b3-card{break-inside:auto;border-color:#999}
  #b3-app .b3-tablewrap{overflow:visible}
  #b3-app table.b3-tbl{min-width:0}
}

/* タブの帯は4分野共通の形(C エネルギー変換と同じ: 白い帯・下に分野の色の線・丸いボタン。shared/eduit-frame.css の .ef-apptabs と同じ見た目) */
</style>
</head>
<body style="margin:0">
<div id="b3-app">
  <header class="b3-head ef-header">
    <a class="ef-btn ef-back" href="../dist/生物育成教材集.html" title="教材集のメニューを開く">◀ メニュー</a>
    <h1 class="ef-title"><span class="ef-code">B3</span> <span class="ef-title-name">栽培暦ビルダー</span></h1>
    <div class="b3-tools ef-tools">
      <button type="button" data-ef-pref="ruby" title="ふりがなの表示を切りかえ">ふりがな</button>
      <button type="button" data-ef-pref="fs"></button>
      <button type="button" data-ef-pref="kukkiri"></button>
    </div>
  </header>

<!--
  kz-print : 印刷のとき、textarea の文章を切らずに全部出す (K5)
  ------------------------------------------------------------------
  入れ方: kzConfirm の <script> のすぐ後ろに、このファイルの <style> と <script> を貼る。
          2回入れても害はない(window.kzPrintText があれば何もしない)。ES5。外部通信なし。

  API (グローバルは window.kzPrintText だけ):
    kzPrintText(root)     root(省略時 document)の下のすべての textarea の直後に
                          <div class="kz-ptext" aria-hidden="true"> を1つだけ用意し、textarea の値を写す。
                          空のときは「(未記入)」。placeholder(例文)は印刷しない。
                          画面を描きなおしたあと(innerHTML を入れたあと)に毎回よぶ。何度よんでもよい。
    kzPrintText.sync(root) すでにある .kz-ptext の中身を今の値に合わせる(root 省略時 document)。
                          JS で textarea.value を書きかえたあとによぶ。
  自動で同期するとき: textarea の input / change、window の beforeprint、
                    matchMedia('print') の変化(beforeprint がない古い Safari 用)。
  CSS: 画面では .kz-ptext は表示しない。印刷では textarea を隠し、.kz-ptext を全文表示する。
       見た目を変えたいときは、教材側で .kz-ptext を上書きしてよい(印刷用のみ)。

<style data-kz-print>
.kz-ptext{display:none}
@media print{

}
</style>
<script data-kz-print>
(function(){
  if (window.kzPrintText) return;
  var EMPTY = '(未記入)';
  function fill(ta, d){
    var v = ta.value || '';
    var empty = !v.replace(/\s+/g, '');
    var txt = empty ? EMPTY : v;
    if (d.textContent !== txt) d.textContent = txt;
    if (empty) { if (!/\bkz-empty\b/.test(d.className)) d.className += ' kz-empty'; }
    else d.className = d.className.replace(/\s*\bkz-empty\b/g, '');
  }
  function mirrorOf(ta){
    var d = ta.nextElementSibling;
    return (d && d.className && /\bkz-ptext\b/.test(d.className)) ? d : null;
  }
  function kzPrintText(root){
    root = root || document;
    var tas = root.getElementsByTagName ? root.getElementsByTagName('textarea') : [];
    for (var i = 0; i < tas.length; i++) {
      var ta = tas[i], d = mirrorOf(ta);
      if (!d) {
        d = document.createElement('div');
        d.className = 'kz-ptext';
        d.setAttribute('aria-hidden', 'true');
        if (ta.parentNode) ta.parentNode.insertBefore(d, ta.nextSibling);
      }

    }
    if (root.nodeType === 1 && root.tagName === 'TEXTAREA') { var d2 = mirrorOf(root); if (d2) fill(root, d2); }
  }
  kzPrintText.sync = function(root){
    root = root || document;
    var tas = root.getElementsByTagName ? root.getElementsByTagName('textarea') : [];
    for (var i = 0; i < tas.length; i++) { var d = mirrorOf(tas[i]); if (d) fill(tas[i], d); }
  };
  function onInput(e){
    var t = e.target;
    if (t && t.tagName === 'TEXTAREA') { var d = mirrorOf(t); if (d) fill(t, d); }
  }

  document.addEventListener('change', onInput, true);
  window.addEventListener('beforeprint', function(){ kzPrintText.sync(); });

    var mq = window.matchMedia && window.matchMedia('print');
    if (mq) { var cb = function(m){ if (m.matches) kzPrintText.sync(); }; if (mq.addEventListener) mq.addEventListener('change', cb); else if (mq.addListener) mq.addListener(cb); }
  } catch (e) {}
  window.kzPrintText = kzPrintText;
})();
</script>

function fresh(){return {v:1,set:{wk:true,tab:'crop'},cropId:'radish',
  draft:{region:'mid',mode:'harvest',harvest:'',start:'',plot:'',prev:'none',early:0,qty:1},

var storageOK=true;

function writeLS(k,v){try{localStorage.setItem(k,v);return true}catch(e){storageOK=false;return false}}

function shortOf(cid,t){if(t.short)return t.short;var ts=CROP[cid]?CROP[cid].tasks:[];
  for(var i=0;i<ts.length;i++)if(ts[i][2]===t.label&&ts[i][3])return ts[i][3];
  return String(t.label||'').replace(/[((].*$/,'')||String(t.label||'')}
/* id と色は HTML の属性にそのまま入るので、読みこんだバックアップの値はこの形のものだけを使う */
var SAFE_ID=/^[\w-]{1,40}$/,SAFE_COLOR=/^#[0-9a-fA-F]{3,8}$/;
function isObjT(t){return !!t&&typeof t==='object'}
/* 古い保存データ(作業の種類・色がない計画)をいまの形に直す */
function migrate(j){
  var f=fresh();for(var k in f){if(j[k]===undefined||(j[k]===null&&k!=='cur'))j[k]=f[k]}
  if(typeof j.set!=='object')j.set=f.set;for(var s in f.set){if(j.set[s]===undefined)j.set[s]=f.set[s]}
  if(typeof j.draft!=='object')j.draft=f.draft;for(var d in f.draft){if(j.draft[d]===undefined)j.draft[d]=f.draft[d]}
  if(!REG[j.draft.region])j.draft.region='mid';
  if(typeof j.cal!=='object')j.cal=f.cal;
  if(!CROP[j.cropId])j.cropId='radish';
  if(!Array.isArray(j.hol))j.hol=[];
  j.hol=j.hol.filter(function(h){return h&&typeof h==='object'});
  j.plans=(Array.isArray(j.plans)?j.plans:[]).filter(function(p){return isObjT(p)&&CROP[p.cropId]&&Array.isArray(p.tasks)&&p.tasks.length&&p.tasks.every(isObjT)&&REG[p.region]});
  var used=[];
  j.plans.forEach(function(p){
    if(typeof p.id!=='string'||!SAFE_ID.test(p.id)){var nid=uid();if(j.cur===p.id)j.cur=nid;p.id=nid}
    p.tasks.forEach(function(t,i){if(typeof t.id!=='string'||!SAFE_ID.test(t.id))t.id='x'+i});
    if(!p.ev||typeof p.ev!=='object')p.ev={cause:'',improve:'',result:''};
    p.tasks.forEach(function(t){if(!t.kind)t.kind=kindOf(t.k);if(!t.short)t.short=shortOf(p.cropId,t)});
    if(!p.v2){ /* 前の版は、最初の作業が完了するとずらしを0として計算していた。日付が変わらないように合わせる */
      if(p.tasks[anchorIdx(p)].done)p.startShift=0;p.v2=true}
    if(!SAFE_COLOR.test(p.color||'')){p.color=pickColorFrom(p.cropId,used)}used.push(p.color)});
  return j}
function load(){var j=null;try{j=JSON.parse(readLS(KEY))}catch(e){}

/* ---------- 適期の判定 ---------- */
function windows(c,region,y){var sh=REG[region].shift;return c.win.filter(function(w){return !(w[2]&&w[2].no&&w[2].no.indexOf(region)>=0)}).map(function(w){
  var spring=+w[0].slice(0,2)<7, s=y+'-'+w[0], ey=(w[1]<w[0])?y+1:y, e=ey+'-'+w[1];
  var k=spring?sh:-sh;return [add(s,k),add(e,k)]})}
function inWin(c,region,d){var y=+d.slice(0,4);for(var yy=y-1;yy<=y+1;yy++){var ws=windows(c,region,yy);
  for(var i=0;i<ws.length;i++){if(d>=ws[i][0]&&d<=ws[i][1])return true}}return false}
function nearestWin(c,region,d){var best=null,bd=1e9,y=+d.slice(0,4);
  for(var yy=y-1;yy<=y+1;yy++){windows(c,region,yy).forEach(function(w){w.forEach(function(e){var k=Math.abs(diff(e,d));if(k<bd){bd=k;best=e}})})}return best}
function nextWinStart(c,region,from){var y=+from.slice(0,4),c2=[];
  for(var yy=y;yy<=y+1;yy++){windows(c,region,yy).forEach(function(w){if(w[1]>=from)c2.push(w[0]>from?w[0]:from)})}
  c2.sort();return c2[0]}
function winText(c,region){var ws=windows(c,region,2027);if(!ws.length)return 'なし';return ws.map(function(w){var a=w[0].split('-'),b=w[1].split('-');
  return (+a[1])+'月'+(+a[2])+'日〜'+(+b[1])+'月'+(+b[2])+'日'}).join('、')}

/* ---------- 休業日と作業日の調整 ---------- */
function holOf(d){var m=d.slice(5);for(var i=0;i<S.hol.length;i++){var h=S.hol[i];if(h.draft||!isDate(h.s)||!isDate(h.e)||h.e<h.s)continue;
  if(h.rep){var hs=h.s.slice(5),he=h.e.slice(5);if(diff(h.e,h.s)>=365||(hs<=he?(m>=hs&&m<=he):(m>=hs||m<=he)))return h}
  else if(d>=h.s&&d<=h.e)return h}return null}
function blocked(d){if(S.set.wk){var w=dow(d);if(w===0||w===6)return true}return !!holOf(d)}
/* いちばん近い登校日(backFirst=true なら、同じ近さのとき前の日を先に) */
function adjust(d,backFirst){if(!blocked(d))return d;for(var k=1;k<=200;k++){var a=add(d,backFirst?-k:k),b=add(d,backFirst?k:-k);if(!blocked(a))return a;if(!blocked(b))return b}return d}
/* 後ろ(あと)の方向だけさがす:収穫は前倒ししない */
function adjustFwd(d){for(var k=0;k<=200;k++){if(!blocked(add(d,k)))return add(d,k)}return d}
function facOf(cid,region){return CROP[cid].fixFac?1:REG[region].fac}
/* 秋おそく〜冬に始めると、気温が低く育つのに時間がかかる(B3-17) */
var SLOW=1.3;
function slowFac(cid,region,start){if(!isDate(start))return 1;var y=+start.slice(0,4),th=add(y+'-10-01',-REG[region].shift),m=start.slice(5);
  return (start>=th||m<'02-01')?SLOW:1}
function cropTasks(cid,region,slow){var f=facOf(cid,region)*(slow||1);return CROP[cid].tasks.map(function(t){
  return {k:t[0],off:t[1]>0?Math.round(t[1]*f):t[1],label:t[2],short:t[3]||t[2],kind:kindOf(t[0])}})}
function hOff(cid,region,slow){var ts=cropTasks(cid,region,slow);for(var i=0;i<ts.length;i++)if(ts[i].k==='harvest')return ts[i].off;return ts[ts.length-1].off}
function anchorIdx(p){for(var i=0;i<p.tasks.length;i++)if(p.tasks[i].k==='sow'||p.tasks[i].k==='plant')return i;return 0}
function aTask(p){return p.tasks[anchorIdx(p)]}
function buildPlan(d,cid){
  var reg=d.region,slow=1,start,early=0;
  if(d.mode==='harvest'){start=add(d.harvest,-hOff(cid,reg,1));slow=slowFac(cid,reg,start);
    if(slow!==1)start=add(d.harvest,-hOff(cid,reg,slow));
    early=Math.max(0,+d.early||0);start=add(start,-early)}
  else{start=d.start;slow=slowFac(cid,reg,start)}
  var T=cropTasks(cid,reg,slow);
  var p={id:uid(),v2:true,cropId:cid,region:reg,mode:d.mode,input:d.mode==='harvest'?d.harvest:d.start,startCalc:start,early:early,slow:slow,
    plot:d.plot||'',prev:d.prev||'none',qty:Math.max(1,Math.min(20,+d.qty||1)),created:today(),color:'',lastRef:'',undo:null,
    ev:{cause:'',improve:'',result:''},
    tasks:T.map(function(t,i){return {id:'t'+i,k:t.k,kind:t.kind,label:t.label,short:t.short,off:t.off,ideal:add(start,t.off),base:'',date:'',orig:'',moved:0,done:false,actual:'',note:''}})};
  layout(p);p.tasks.forEach(function(t){t.orig=t.date});return p}
function effDate(t){return t.done&&isDate(t.actual)?t.actual:t.date}
/* 作業日の割りつけ(B3-01・02・03)
   ・人の作業(work)は休みをさけていちばん近い登校日へ。収穫(はじめ・おわり)は前倒ししない(あとへだけ動かす)
   ・観察(obs:発芽・開花・出穂)は自然に進むので動かさない
   ・「収穫したい日から逆算」では、目標をこえないように種まきを前にずらす
   ・作業の順番は前後しないようにする */
function layout(p){var ai=anchorIdx(p),a=p.tasks[ai],d=0,h=hTask(p),tgt=(p.mode==='harvest'&&isDate(p.input))?p.input:'';
  if(a.done){d=p.startShift||0}
  else if(tgt){d=diff(adjust(a.ideal,true),a.ideal);
    if(!h.done&&(h.k==='harvest'||h.k==='end')&&adjustFwd(add(h.ideal,d))>tgt){
      for(var e=0;e<=7;e++){var s=add(a.ideal,-e);if(blocked(s))continue;if(adjustFwd(add(h.ideal,-e))<=tgt){d=-e;break}}}}
  else d=diff(adjust(a.ideal),a.ideal);
  p.startShift=d;var prev='',hd='';
  p.tasks.forEach(function(t,i){if(!t.kind)t.kind=kindOf(t.k);
    if(t.done){var ed=effDate(t);if(ed>prev)prev=ed;if(t.k==='harvest')hd=ed;return}
    t.base=add(t.ideal,d);
    if(t.kind==='obs')t.date=t.base;
    else{
      if(i===ai)t.date=blocked(t.base)?adjust(t.base,!!tgt):t.base;
      else if(t.k==='harvest'){t.date=adjustFwd(t.base);hd=t.date}
      else if(t.k==='end'){var cand=t.base;if(hd&&h.k==='harvest'){var c2=add(hd,diff(t.ideal,h.ideal));if(c2>cand)cand=c2}t.date=adjustFwd(cand)}
      else t.date=adjust(t.base);
      if(prev&&t.date<prev)t.date=adjustFwd(prev);
    }
    t.moved=diff(t.date,t.base);if(t.date>prev)prev=t.date})}
function relayoutAll(){S.plans.forEach(layout)}
function planEnd(p){var m='';p.tasks.forEach(function(t){var e=effDate(t);if(e>m)m=e});return m}
function planStart(p){var m='';p.tasks.forEach(function(t){var e=effDate(t);if(!m||e<m)m=e});return m}
function sowDate(p){return effDate(aTask(p))}
function hTask(p){for(var i=0;i<p.tasks.length;i++)if(p.tasks[i].k==='harvest')return p.tasks[i];return p.tasks[p.tasks.length-1]}
function curPlan(){for(var i=0;i<S.plans.length;i++)if(S.plans[i].id===S.cur)return S.plans[i];return null}
function planById(id){for(var i=0;i<S.plans.length;i++)if(S.plans[i].id===id)return S.plans[i];return null}
function pickColorFrom(cid,used){var cc=CROP[cid].color;if(used.indexOf(cc)<0)return cc;
  for(var i=0;i<PCOL.length;i++)if(used.indexOf(PCOL[i])<0)return PCOL[i];return PCOL[used.length%PCOL.length]}
function planColor(p){return p.color||CROP[p.cropId].color}
/* 目標の収穫日に間に合わせるには、何日早めればよいか */
function needEarly(p){var a=aTask(p),h=hTask(p),tgt=p.input;if(a.done||h.done||!isDate(tgt))return 0;
  for(var e=1;e<=150;e++){var s=add(a.ideal,-e);if(blocked(s))continue;if(adjustFwd(add(h.ideal,-e))<=tgt)return e}return 0}

/* ---------- 注意(警告)の生成 ---------- */
function warnings(p,isDraft){var c=CROP[p.cropId],out=[],a=aTask(p),h=hTask(p);
  if(!a.done&&!inWin(c,p.region,a.date)){var wt=winText(c,p.region);out.push({lv:'bad',fix:wt!=='なし',html:'⚠ '+c.start+'日 <b>'+jd(a.date)+'</b> は、'+REG[p.region].name+'の適期(目安:'+wt+')からはずれています。うまく育たない・収穫できない心配があります。'})}
  if(p.mode==='harvest'&&isDate(p.input)&&!h.done&&h.date>p.input){var e=needEarly(p);
    out.push({lv:'bad',early:e,html:'⚠ 目標の'+jd(p.input)+'に収穫が間に合いません(この計画では収穫は '+jd(h.date)+')。'+(e?c.start+'を<b>'+e+'日</b>早めよう。':'時期を見直そう。')})}
  if(!h.done&&h.moved>=7){var hh=holOf(h.base);out.push({lv:'bad',html:'⚠ 休み中'+(hh&&hh.l?'(<b>'+esc(hh.l)+'</b>)':'')+'に収穫の時期('+jd(h.base)+'ごろ)になります。収穫は前倒しできません(実が育っていない)。だから、休み明けの <b>'+jd(h.date)+'</b> にしました('+h.moved+'日あと)。実がとりおくれます。休み中の当番を決めるか、時期を見直そう。'})}
  if(p.startShift){out.push({lv:'info',html:'ℹ 計算した'+c.start+'の日('+jd(p.startCalc)+')'+(p.mode==='harvest'&&p.startShift<0?'では、休みと重なるか、収穫が目標の日に間に合わないため':'が休みの日だったので')+'、'+c.start+'を<b>'+Math.abs(p.startShift)+'日'+(p.startShift>0?'あと':'まえ')+'</b>にずらし、ほかの作業もいっしょにずらしました。'})}
  if(p.early){out.push({lv:'info',html:'ℹ 目標の収穫日に間に合わせます。逆算した日より <b>'+p.early+'日</b> 早く始める計画にしています。'})}
  if(p.slow>1){out.push({lv:'info',html:'ℹ 秋おそく(または冬)に始める計画です。気温が低いので育つのに時間がかかるため、日数を約'+p.slow+'倍にしています。'})}
  p.tasks.forEach(function(t){if(t.done||t===h)return;
    if(t.kind==='obs'){var ho=holOf(t.date);if(ho)out.push({lv:'info',html:'ℹ 「'+esc(t.label)+'」('+jd(t.date)+'ごろ)は休み中ですが、作物は休まず育ちます。観察できる人を決めておこう。'});return}
    if(Math.abs(t.moved)>=7)out.push({lv:'warn',html:'⚠ 「'+esc(t.label)+'」は休みと重なるため <b>'+Math.abs(t.moved)+'日'+(t.moved>0?'あと':'まえ')+'</b>('+jd(t.date)+')に動かしました。ずれが大きいので、休み中の当番を決める・作物や時期を見直すなどを考えよう。'})});
  var f=FAM[p.prev];
  if(p.prev&&p.prev===c.fam&&f){
    if(c.fam==='ine')out.push({lv:'info',html:'ℹ 水田のイネは、続けて同じ場所で育てやすい(連作しやすい)作物です。バケツなら、毎年土を入れかえるとよい。'});
    else out.push({lv:'warn',html:'⚠ 前に同じ<b>'+f.name.split('(')[0]+'</b>を育てた場所です。連作障害(病気や生育不良)が起きやすくなります。'+(f.years?'目安として'+f.years+'はあけるか、土を入れかえよう。':'')})}
  if(p.plot){S.plans.forEach(function(q){if(q===p||q.id===p.id||!q.plot||q.plot!==p.plot||(isDraft&&q.cropId===p.cropId&&q.startCalc===p.startCalc&&q.region===p.region))return;
    var ov=!(planEnd(q)<planStart(p)||planEnd(p)<planStart(q));
    if(ov)out.push({lv:'warn',html:'⚠ 同じ区画「'+esc(p.plot)+'」に'+cropPlain(q.cropId)+'の計画があり、期間が重なっています('+md(planStart(q))+'〜'+md(planEnd(q))+')。'});
    else if(CROP[q.cropId].fam===c.fam&&c.fam!=='ine')out.push({lv:'warn',html:'⚠ 同じ区画「'+esc(p.plot)+'」で同じ科('+FAM[c.fam].name.split('(')[0]+')の'+cropPlain(q.cropId)+'も育てる計画です。連作にならないか確認しよう。'})})}
  return out}

  (w.early&&withFix?' <button type="button" class="b3-btn b3-small" data-act="early" data-v="'+w.early+'">間に合うように早める</button>':'')+'</div>'}).join('')}

function snap(p){return JSON.stringify({ideal:p.tasks.map(function(t){return t.ideal}),lastRef:p.lastRef||'',startShift:p.startShift||0})}
function pushUndo(p,label){p.undo={s:snap(p),label:label}}
function undo(p){if(!p.undo)return;var o;try{o=JSON.parse(p.undo.s)}catch(e){p.undo=null;return}
  o.ideal.forEach(function(v,i){if(p.tasks[i]&&isDate(v))p.tasks[i].ideal=v});p.lastRef=o.lastRef;p.startShift=o.startShift;p.undo=null;layout(p);save();rEval();toast('元に戻しました')}
function recalc(p){var ref=null,ri=-1;p.tasks.forEach(function(t,i){if(t.done&&isDate(t.actual)&&i>ri){ref=t;ri=i}});
  if(!ref){toast('まず、完了した作業と「実際にした日」を記録してください');return}
  var key=ref.id+'@'+ref.actual+'@'+ref.date;if(p.lastRef===key){toast('この記録はもう反映ずみです');return}
  var dl=diff(ref.actual,ref.date),n=0;
  if(dl===0){p.lastRef=key;toast('「'+ref.label+'」は今の予定どおりなので、変更はありません');save();return}
  pushUndo(p,'再計算');
  p.tasks.forEach(function(t,i){if(!t.done&&i>ri){t.ideal=add(t.ideal,dl);n++}});
  p.lastRef=key;layout(p);save();rEval();
  toast(n?'「'+ref.label+'」が今の予定('+md(ref.date)+')より'+Math.abs(dl)+'日'+(dl>0?'おそかった':'早かった')+'ので、残り'+n+'件の作業をずらしました':'ずらす作業は残っていません',4000)}
function shiftRest(p,n){var c=p.tasks.filter(function(t){return !t.done}).length;
  if(!c){toast('まだの作業がありません');return}pushUndo(p,'ずらす');p.tasks.forEach(function(t){if(!t.done)t.ideal=add(t.ideal,n)});
  layout(p);save();rEval();toast('まだの作業'+c+'件を'+Math.abs(n)+'日'+(n>0?'おくらせ':'早め')+'ました')}

function fold(line){var enc=window.TextEncoder?new TextEncoder():null;if(!enc)return line;var out=[],cur='',n=0;
  for(var ch of line){var b=enc.encode(ch).length;if(n+b>(out.length?74:75)){out.push(cur);cur='';n=0}cur+=ch;n+=b}out.push(cur);return out.join('\r\n ')}

    var ins=main.querySelectorAll('[data-hol=s]');if(ins.length){ins[ins.length-1].focus();if(ins[ins.length-1].scrollIntoView)ins[ins.length-1].scrollIntoView({block:'center'})}toast('休みの名前と日付を入れてください',3000)})();break;
  case 'holdel':(function(){var i=+b.getAttribute('data-i'),h=S.hol[i];if(!h)return;
    kzConfirm('休業日「'+(h.l||'休み')+'」('+(isDate(h.s)?md(h.s):'?')+'〜'+(isDate(h.e)?md(h.e):'?')+')を消します。計画の作業日も計算しなおします。よろしいですか?',{ok:'消す',danger:true}).then(function(ok){if(!ok)return;
      var j=S.hol.indexOf(h);if(j>=0)S.hol.splice(j,1);relayoutAll();save();rPlan()})})();break;
  case 'saveplan':(function(){var d=S.draft,v=d.mode==='harvest'?d.harvest:d.start;if(!isDate(v)){toast('日にちを入れてください');return}
    var np=buildPlan(d,S.cropId);
    function doSave(){np.color=pickColorFrom(np.cropId,S.plans.map(planColor));S.plans.push(np);S.cur=np.id;S.cal.filter='all';S.cal.anchor=sowDate(np);S.cal.sel='';lastSavedSig=draftSig();save();rPlan();
      toast('保存しました!③カレンダーで確認しよう',3000)}
    var dup=S.plans.some(function(q){return q.cropId===np.cropId&&q.startCalc===np.startCalc&&q.region===np.region&&(q.plot||'')===(np.plot||'')});
    if(dup)kzConfirm('同じ作物・同じ日にち・同じ場所の計画が、もう保存されています。もう1つ保存しますか?(カレンダーに同じ作業が2つずつ出ます)',{ok:'もう1つ保存する'}).then(function(ok){if(ok)doSave()});
    else doSave()})();break;
  case 'delplan':p=planById(b.getAttribute('data-id'));if(p){(function(p){kzConfirm(cropPlain(p.cropId)+'の計画を削除します。記録や評価も消えます。よろしいですか?',{ok:'削除する',danger:true}).then(function(ok){if(!ok)return;
    var i=S.plans.indexOf(p);if(i>=0)S.plans.splice(i,1);if(S.cur===p.id)S.cur=S.plans.length?S.plans[0].id:null;lastSavedSig='';save();render()})})(p)}break;
  case 'opencal':p=planById(b.getAttribute('data-id'));if(!p)break;S.cur=p.id;S.cal.filter=p.id;S.cal.anchor=(p.tasks.filter(function(t){return !t.done})[0]||p.tasks[0]).date;S.cal.sel=S.cal.anchor;S.set.tab='cal';save();render();window.scrollTo(0,0);break;
  case 'openeval':S.cur=b.getAttribute('data-id');S.set.tab='eval';save();render();window.scrollTo(0,0);break;
  case 'cview':(function(){var v=b.getAttribute('data-v');if(v==='week'&&S.cal.view!=='week'){var a2=S.cal.anchor,ym=a2.slice(0,7),tdy=today();
      S.cal.anchor=isDate(S.cal.sel)?S.cal.sel:(tdy.slice(0,7)===ym?tdy:(firstTaskIn(+ym.slice(0,4),+ym.slice(5,7))||a2))}
    S.cal.view=v;save();rCal()})();break;
  case 'cmove':(function(){var n=+b.getAttribute('data-v'),a2=S.cal.anchor;
    if(S.cal.view==='week')S.cal.anchor=add(a2,7*n);else{var y=+a2.slice(0,4),m=+a2.slice(5,7)+n;if(m<1){m=12;y--}if(m>12){m=1;y++}S.cal.anchor=y+'-'+pad(m)+'-01'}
    save();rCal()})();break;
  case 'ctoday':S.cal.anchor=today();S.cal.sel=today();save();rCal();break;
  case 'day':(function(){var d=b.getAttribute('data-d');S.cal.sel=d;if(S.cal.view==='week'||d.slice(0,7)===S.cal.anchor.slice(0,7))S.cal.anchor=d;save();rCal();
    var dp=$('#b3-daypanel');if(dp&&dp.scrollIntoView)dp.scrollIntoView({behavior:'smooth',block:'nearest'})})();break;
  case 'toggle':(function(){var pp=planById(b.getAttribute('data-id'));if(!pp)return;var t=pp.tasks.filter(function(x){return x.id===b.getAttribute('data-t')})[0];if(!t)return;
    S.cur=pp.id;
    if(t.done){unmark(pp,t);save();rCal()}
    else tryDone(pp,t,function(ok){if(ok){layout(pp);save();toast('記録しました!実際の日にちがちがうときは④で直そう',3000)}rCal()})})();break;
  case 'recalc':p=curPlan();if(p)recalc(p);break;
  case 'undo':p=curPlan();if(p)undo(p);break;
  case 'shn':(function(){var i=$('#b3-shift');var v=(parseInt(i.value,10)||0)+(+b.getAttribute('data-v'));i.value=Math.max(-60,Math.min(60,v))})();break;
  case 'shift':(function(){var n=parseInt($('#b3-shift').value,10);if(!n||Math.abs(n)>60){toast('−60〜60の日数(0以外)を入れてください');return}p=curPlan();if(p)shiftRest(p,n)})();break;
  case 'csv':download(fname('栽培暦','csv'),csv(visiblePlans()),'text/csv');break;
  case 'ics':download(fname('栽培暦','ics'),ics(visiblePlans()),'text/calendar');break;
  case 'csv1':p=curPlan();if(p)download(fname('栽培暦_'+cropPlain(p.cropId),'csv'),csv([p]),'text/csv');break;
  case 'ics1':p=curPlan();if(p)download(fname('栽培暦_'+cropPlain(p.cropId),'ics'),ics([p]),'text/calendar');break;
  case 'backup':download(fname('B3_バックアップ','json'),JSON.stringify({app:'B3',v:1,state:S,reflection:R},null,1),'application/json');break;
  case 'restore':root.querySelector('#b3-file').click();break;
  case 'resetall':kzConfirm('この端末のデータ(計画・記録・振り返り・名前)を、すべて消します。元に戻せません。\n必要なら先に「バックアップを書き出す」をしよう。\n本当に消しますか?',{ok:'すべて消す',danger:true}).then(function(ok){if(!ok)return;
    removeLS(KEY);removeLS(RKEY);S=fresh();R=freshR();writeStat();lastSavedSig='';regionNote='';save();render();window.scrollTo(0,0);toast('すべてのデータを消しました',3000)});break;
  case 'self':R.self[b.getAttribute('data-k')]=+b.getAttribute('data-v');saveR();
    b.parentNode.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});setSaved();break;
  case 'rsave':saveR();setSaved();toast('保存しました');break;
  case 'rtxt':saveR();setSaved();download(fname('B3振り返り'+(who()?'_'+who().replace(/[\\\/:*?"<>|\s]+/g,''):''),'txt'),'\ufeff'+reflText().replace(/\n/g,'\r\n'),'text/plain');break;
  case 'rcopy':copyText(reflText());break;
  case 'doc':(function(){var sc=b.getAttribute('data-s'),c1=curPlan();openDoc(sc==='cur'?(c1?[c1]:[]):sc==='vis'?visiblePlans():S.plans)})();break;
  case 'docpdf':window.print();break;
  case 'docx':if(docPlans)download(docName('docx'),docxBytes(docModel(docPlans)),'application/vnd.openxmlformats-officedocument.wordprocessingml.document');break;
  case 'doccopy':copyDoc();break;
  case 'docclose':closeDoc();break;
  case 'rprint':saveR();setSaved();if(window.kzPrintText)kzPrintText.sync();window.print();break;
  }
});
function setSaved(){var s=$('#b3-saved');if(s)s.textContent=savedText()}
var rt=null;
root.addEventListener('input',function(e){var el=e.target;
  if(el.hasAttribute('data-r')){R[el.getAttribute('data-r')]=el.value;clearTimeout(rt);rt=setTimeout(function(){saveR();setSaved()},500)}
  else if(el.hasAttribute('data-ev')){var p=curPlan();if(p){p.ev[el.getAttribute('data-ev')]=el.value;save()}}
  else if(el.getAttribute('data-draft')==='plot'){S.draft.plot=el.value;save();rPreview()}
  else if(el.getAttribute('data-hol')==='l'){var hh=S.hol[+el.getAttribute('data-i')];if(hh){hh.l=el.value;save()}}
});
root.addEventListener('change',function(e){var el=e.target,a=el.getAttribute('data-act'),p;
  if(el.type==='text')return; /* 文字入力は input で反映ずみ。blur時に再描画するとボタンのタップが消えるため */
  if(el.hasAttribute('data-draft')){var k=el.getAttribute('data-draft');
    if(k==='harvest'||k==='start'){setDraftDate(k,isDate(el.value)?el.value:'');save();rPreview();return}
    S.draft[k]=el.value;save();rPreview();return}
  if(el.hasAttribute('data-hol')){var i=+el.getAttribute('data-i'),f=el.getAttribute('data-hol');if(!S.hol[i])return;
    S.hol[i][f]=el.value;if(f==='s'&&isDate(el.value)&&(!isDate(S.hol[i].e)||S.hol[i].e<el.value))S.hol[i].e=el.value;
    if(isDate(S.hol[i].s)&&isDate(S.hol[i].e))delete S.hol[i].draft;
    relayoutAll();save();fill($('#b3-hol'),holHtml());rPreview();return}
  if(a==='holrep'){var hi=S.hol[+el.getAttribute('data-i')];if(hi){hi.rep=el.checked;relayoutAll();save();rPreview()}return}
  if(a==='wk'){S.set.wk=el.checked;relayoutAll();save();rPreview();return}
  if(a==='cfilter'){S.cal.filter=el.value;if(el.value!=='all'){S.cur=el.value}save();rCal();return}
  if(a==='evsel'){S.cur=el.value;save();rEval();return}
  if(a==='evdone'){p=curPlan();if(!p)return;var t=p.tasks.filter(function(x){return x.id===el.getAttribute('data-t')})[0];if(!t)return;
    if(el.checked)tryDone(p,t,function(ok){if(ok){layout(p);save()}rEval()});else{unmark(p,t);save();rEval()}return}
  if(a==='evact'){p=curPlan();if(!p)return;var t2=p.tasks.filter(function(x){return x.id===el.getAttribute('data-t')})[0];if(t2&&isDate(el.value)){t2.actual=el.value;layout(p);save()}rEval();return}
});
root.querySelector('#b3-file').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var j=JSON.parse(r.result);if(!j||j.app!=='B3'||!j.state||j.state.v!==1)throw 0;
    kzConfirm('バックアップを読みこむと、今のデータ(計画・休業日・記録と評価・振り返り)は消えます。バックアップの内容に置きかわります。よろしいですか?',{ok:'読みこむ',danger:true}).then(function(ok){if(!ok)return;
    writeLS(KEY,JSON.stringify(j.state));if(j.reflection)writeLS(RKEY,JSON.stringify(j.reflection));
    S=load();R=loadR();
    if(!storageOK){try{S=migrate(j.state)}catch(er){S=fresh()}R=j.reflection||freshR();var f2=freshR();for(var k in f2)if(R[k]===undefined)R[k]=f2[k]}
    relayoutAll();save();writeStat();lastSavedSig='';render();toast('読みこみました')})}catch(err){toast('このファイルは読みこめません(B3のバックアップではありません)',3500)}};
  r.readAsText(f);e.target.value=''});

S=load();
relayoutAll();
if(window.kzRuby){kzRuby(root.querySelector('.b3-head'));kzRuby(root.querySelector('.b3-tabs'));fitRuby(root)}
render();
})();
</script>
