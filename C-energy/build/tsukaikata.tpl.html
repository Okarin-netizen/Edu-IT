<style>
:root{--ink:var(--ef-text);--sub:var(--ef-muted);--line:var(--ef-line);--accent:var(--ef-accent)}
body{margin:0;background:var(--ef-bg);color:var(--ink);font-family:var(--ef-font);line-height:1.75;font-size:16.5px}
main{max-width:960px;margin:0 auto;padding:16px 20px 60px}
.lead{color:var(--sub);margin:0 0 10px}
.start{background:var(--ef-surface);border:2px solid var(--accent);border-radius:14px;padding:12px 18px;margin:14px 0}
.start b{font-size:18px}
h2{font-size:23px;margin:34px 0 4px;padding:6px 12px;background:var(--accent);color:#fff;border-radius:10px}
h3{font-size:19px;margin:22px 0 6px;padding-left:10px;border-left:5px solid var(--accent)}
li{margin:3px 0}
rt{font-size:12px}
code{background:var(--ef-surface-2);padding:1px 6px;border-radius:5px;font-size:.92em}
.ea-hgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ea-hcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;break-inside:avoid}
.ea-hcard h4{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.ea-hcard p{margin:4px 0;font-size:15px;line-height:1.6}
.ea-hic{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.ea-tip{color:#5b4a00;background:#fff6d6;border-radius:8px;padding:4px 8px}
.ea-tbl{border-collapse:collapse;background:#fff}
.ea-tbl th,.ea-tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;font-size:15px}
.ea-tbl th{background:var(--ef-surface-2)}
nav a{margin-right:14px}
@media (max-width:760px){.ea-hgrid{grid-template-columns:1fr}}
@media print{.ef-header{border-bottom-color:#000}body{background:#fff;font-size:13px}h2{break-before:page;background:none;color:#000;border-bottom:2px solid #000;border-radius:0}h2.first{break-before:auto}.start{border-color:#000}}
</style>
</head>
<body>
<header class="ef-header"><h1 class="ef-title"><span class="ef-icon" aria-hidden="true">⚡</span>エネルギー変換の技術 教材集 使い方</h1></header>
<main>
<p class="lead">中学校 技術分野「エネルギー変換の技術」の学習用アプリ(C1〜C5)を1つにまとめたものです。インターネットなしで動きます。</p>
<div class="start"><b>▶ はじめるには:</b> このフォルダの <code>energy-apps.html</code> をブラウザ(Chrome・Edge など)で開きます。</div>
<nav><a href="#student">生徒向け</a><a href="#teacher">先生用</a></nav>
<h2 id="student" class="first">🧑‍🎓 生徒向け</h2>
{{HELP_STUDENT}}
<h2 id="teacher">🧑‍🏫 先生用</h2>
{{HELP_TEACHER}}
</main>
</body>
</html>
