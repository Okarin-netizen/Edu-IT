<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エネルギー変換の技術 教材集</title>
<!-- C1〜C8 を1つにまとめたファイル。外部通信なし。各アプリは EnergyApps.C{n}.mount() で起動する。 -->
<!-- ===== 4分野共通の枠(shared/eduit-frame.css・C-energy/eduit-info.js・shared/eduit-frame.js を build.py が入れる) ===== -->
<style>
{{EF_CSS}}
</style>
<script>
{{EF_INFO}}
EDUIT_INFO.app = { name: 'エネルギー変換の技術 教材集' };
</script>
<script>
{{EF_JS}}
</script>
<style>
/* ===== 各アプリのCSS(.e1〜.e5 接頭辞) ===== */
{{APP_CSS}}
/* ===== 統合シェル(.ea- 接頭辞)。色・文字・線は共通の設定(--ef-…)と部品(.ef-btn など)だけを使う ===== */
html,body{margin:0;height:100%;background:var(--ef-bg);}
body{overflow:hidden}
.ea{font-family:var(--ef-font);color:var(--ef-text);height:100%;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;font-size:.94rem}
.ea *{box-sizing:border-box}
.ea-view{flex:1;min-height:0;display:none;flex-direction:column}
.ea-view.on{display:flex}
/* ふりがな・文字の大きさ・くっきりは共通の EduitFrame.prefs(上のバーのボタンは data-ef-pref)。
 * 文字の大きさは <html> の字(--ef-fs)が変わり、各アプリの rem の字がいっしょに大きくなる */
.ea [hidden]{display:none}

/* --- トップ画面 --- */
.ea-home{overflow:auto;background:var(--ef-bg)}
.ea-hd{flex:none}
.ea-hbody rt{font-size:.71rem}
/* カードは共通の EduitFrame.card(.ef-mcard)。教科書の目次のように1行ずつ上から順にならべる */
.ea-cards{display:flex;flex-direction:column;padding:0 0 24px;border-top:1px solid var(--ef-line)}
.ea-cards>.ef-mcard{touch-action:manipulation}
.ea-cards .ef-level-parts{display:block;font-size:.82rem}
/* メニューはほかの分野と同じく、はばいっぱいに使う(左右の余白 32px) */
.ef-levels[data-ref="cards"]{box-sizing:border-box;width:100%;margin:0;padding:6px 32px 0}
.ef-level-group+.ea-cards{border-top:0}
.ef-levels .ea-cards{padding:0 0 24px}
.ea-cards .ef-mcard-desc{font-size:.88rem;color:var(--ef-muted);line-height:1.5}
.ea-cards .ef-mcard-extra{flex-direction:column;align-items:stretch}
.ea-pg{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--ef-muted)}
.ea-pg b{font-size:.88rem;color:var(--ef-text)}
.ea-pg .ef-progress-bar{flex:none;width:16em;max-width:100%}
.ea-pg .s2{font-size:.76rem;color:var(--ef-muted)}
.ea-foot{box-sizing:border-box;width:100%;margin:0;padding:0 32px 4px;color:var(--ef-muted);font-size:.76rem}
.ea-home .ef-footer{margin-top:10px}

/* --- アプリ画面 --- */
/* アプリの上のバーは共通の .ef-appbar(◀ メニュー・C1〜C8 の切りかえ .ef-switch・道具)。ここには置き方だけを書く */
.ea-bar{flex:none}
.ea-panes{flex:1;min-height:0;position:relative}
.ea-pane{position:absolute;inset:0;display:none}
.ea-pane.on{display:block}
.ea-pane>div{height:100%}
.ea-err{padding:30px;font-size:1.06rem}

/* --- 使い方(読む画面: 中身のはばは --ef-read-w) --- */
.ea-help{background:var(--ef-bg)}
.ea-help .ef-header{flex:none}
.ea-help .ef-subtabs{margin:0;border-bottom:0}
.ea-hbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.ea-hbody>.ef-main{padding-bottom:40px}
.ea-hgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ea-hcard{border-top:1px solid var(--ef-ink);padding:10px 2px}
.ea-hcard h4{margin:0 0 4px;font-size:1rem}
.ea-hcard p{margin:4px 0;font-size:.88rem;line-height:1.6}
.ea-tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ea-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ef-ink);color:var(--ef-on-ink);padding:10px 18px;font-size:.88rem;z-index:99;display:none}

@media (max-width:900px){
  .ef-levels[data-ref="cards"]{padding:6px 16px 0}
  .ef-levels .ea-cards{padding:0 0 20px}
  .ea-foot{padding:0 16px 20px}
}
/* 1100px 以下では C1〜C8 が1行に入りきらないので、アプリ名(下の道具の帯にも出る)を消す */
@media (max-width:1100px){
  .ea-apptitle{display:none}
  .ea-hgrid{grid-template-columns:1fr}
}
/* スマホ: 全画面のボタンは出さない */
@media (max-width:640px){
  .ea [data-ea="fs"]{display:none!important}
}
@media print{
  html,body{height:auto;overflow:visible}
  .ea{height:auto;display:block}
  .ea-bar,.ea-home,.ea-help{display:none!important}
  .ea-app,.ea-panes,.ea-pane.on{display:block;position:static;height:auto}
  .ea-pane:not(.on){display:none!important}
}
</style>
</head>
<body>
<div class="ea" id="ea">
  <!-- トップ画面 -->
  <section class="ea-view ea-home" data-view="home" aria-label="メニュー">
    <!-- 上のバー(4分野共通): 左に「C エネルギー変換の技術 教材集」、右に ふりがな・文字・使い方・先生用(全画面はアプリの中のバーだけ) -->
    <header class="ef-header ea-hd">
      <h1 class="ef-title" data-ref="menu-title">エネルギー変換の技術 教材集</h1>
      <div class="ef-tools">
        <button class="ef-btn" data-ef-pref="ruby" title="ふりがなを出す・消す">ふりがな</button>
        <button class="ef-btn" data-ef-pref="fs"></button>
        <button class="ef-btn" data-ea="help">使い方</button>
        <button class="ef-btn" data-ea="help-t">先生用</button>
      </div>
    </header>
    <div data-ref="cards"></div>
    <div class="ea-foot">学習の記録はこの端末のブラウザに自動で保存されます。カードには進み具合が出ます。アプリの中では、上の「◀ メニュー」でここにもどれます。</div>
    <div data-ef-footer></div>
  </section>

  <!-- アプリ画面 -->
  <section class="ea-view ea-app" data-view="app">
    <div class="ea-bar ef-header ef-appbar">
      <button class="ef-btn ef-back" data-ea="home" aria-label="メニューにもどる">◀ メニュー</button>
      <h1 class="ef-title ef-apptitle" data-ref="app-title"></h1>
      <nav class="ef-switch" data-ref="chips" aria-label="アプリを切りかえる"></nav>
      <div class="ef-tools">
        <button class="ef-btn" data-ef-pref="ruby" title="ふりがなを出す・消す">ふりがな</button>
        <button class="ef-btn" data-ef-pref="fs"></button>
        <button class="ef-btn" data-ef-pref="kukkiri"></button>
        <button class="ef-btn" data-ea="fs" hidden>全画面</button>
        <span data-ref="about"></span>
      </div>
    </div>
    <div class="ea-panes" data-ref="panes"></div>
  </section>

  <!-- 使い方 -->
  <section class="ea-view ea-help" data-view="help" aria-label="使い方">
    <header class="ef-header">
      <button class="ef-btn ef-back" data-ea="back">◀ もどる</button>
      <h1 class="ef-title">使い方</h1>
      <div class="ef-subtabs" role="tablist">
        <button role="tab" data-ea="tab-s">生徒向け</button>
        <button role="tab" data-ea="tab-t">先生用</button>
      </div>
    </header>
    <div class="ea-hbody" data-tab="s"><div class="ef-main">{{HELP_STUDENT}}</div></div>
    <div class="ea-hbody" data-tab="t" hidden><div class="ef-main">{{HELP_TEACHER}}</div></div>
  </section>
  <div class="ea-toast" data-ref="toast" role="status"></div>
</div>

<!-- ===== 各アプリのスクリプト ===== -->
{{APP_JS}}

<!-- ===== 統合シェル ===== -->
<script>
(function () {
'use strict';
var APPS = {{APPS_JSON}};
var EA = window.EnergyApps || {};
EA.embedded = true; // 各アプリは自分の上のバーに「このアプリについて」を出さない(このシェルのバーに出す)
var root = document.getElementById('ea');
var $ = function (s) { return root.querySelector(s); };
var refs = { cards: $('[data-ref="cards"]'), chips: $('[data-ref="chips"]'), panes: $('[data-ref="panes"]'), toast: $('[data-ref="toast"]') };
// 共通の枠: アプリ画面の上のバーに「ⓘ このアプリについて」(作った人・安全と個人情報・ライセンス・更新履歴)
if (window.EduitFrame) {
  var ab = window.EduitFrame.aboutButton('ef-btn ef-about-btn');
  ab.innerHTML = 'ⓘ<span class="t"> このアプリについて</span>';
  ab.setAttribute('aria-label', 'このアプリについて(作った人・安全と個人情報・ライセンス・更新履歴)');
  $('[data-ref="about"]').appendChild(ab);
}
var KEY = function (id) { return 'energyApps.' + id + '.v1'; };
/* ---- ふりがな・文字の大きさ・くっきり(全教材で共通の EduitFrame.prefs。上のバーのボタンは data-ef-pref) ---- */
if (window.EduitFrame) {
  EduitFrame.prefs.mount();
  EduitFrame.prefs.on(function (key) { if (key === 'fs') window.dispatchEvent(new Event('resize')); });  // 図をかき直すアプリのため
}
var mounted = {}, cur = null, fromHome = false, helpPushed = false, lastView = 'home';

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function byId(id) { for (var i = 0; i < APPS.length; i++) if (APPS[i].id === id) return APPS[i]; return null; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ---- 進み具合(各アプリの保存データ energyApps.C{n}.v1 を読むだけ。書きこまない) ---- */
function readSave(id) {
  var s = lsGet(KEY(id)); if (!s) return null;
  try { var d = JSON.parse(s); return d && typeof d === 'object' && !Array.isArray(d) ? d : null; } catch (e) { return null; }
}
function appTest(id) { try { return EA[id] && EA[id]._test || null; } catch (e) { return null; } }
function isObj(o) { return o && typeof o === 'object' && !Array.isArray(o); }
function countIds(ids, obj, ok) { var n = 0; ids.forEach(function (k) { if (ok(obj[k])) n++; }); return n; }
function truthy(v) { return !!v; }
var PROG = {
  C1: function (d) {
    var stars = isObj(d.stars) ? d.stars : {}, t = appTest('C1'), st = t && t.STAGES ? t.STAGES.filter(function (x) { return !x.free; }) : null;
    var ids = st ? st.map(function (x) { return x.id; }) : ['s1', 's2', 's3', 's4', 's5', 's6', 's7', 's8'];
    var max = st ? st.reduce(function (m, x) { return m + (x.stars ? x.stars.length : 3); }, 0) : ids.length * 3;
    var got = ids.reduce(function (m, k) { return m + Math.max(0, Math.min(3, +stars[k] || 0)); }, 0);
    return { n: countIds(ids, stars, function (v) { return +v > 0; }), t: ids.length, main: 'ステージ', end: 'クリア', sub: '★ ' + got + ' / ' + max };
  },
  C4: function (d) {
    var cl = isObj(d.cleared) ? d.cleared : {}, t = appTest('C4');
    var ids = t && t.CHALS ? t.CHALS.map(function (x) { return x.id; }) : ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8', 'c9', 'c10', 'c11'];
    var safe = Object.keys(cl).filter(function (k) { return /^s\d+$/.test(k) && cl[k]; }).length;
    return { n: countIds(ids, cl, truthy), t: ids.length, main: '課題', end: 'クリア', sub: safe ? '安全体験 ' + safe + ' つ' : '' };
  },
  C5: function (d) {
    var tk = isObj(d.tasks) ? d.tasks : {}, t = appTest('C5');
    var ids = t && t.TASKS ? t.TASKS.map(function (x) { return x.id; }) : null;
    var n = ids ? countIds(ids, tk, function (v) { return +v > 0; }) : Object.keys(tk).filter(function (k) { return +tk[k] > 0; }).length;
    var tot = ids ? ids.length : 12;
    return { n: Math.min(n, tot), t: tot, main: '設計課題', end: 'クリア', sub: typeof d.quizBest === 'number' && d.quizBest >= 0 ? 'ブラックボックス 最高 ' + d.quizBest + '問正解' : '' };
  },
  C6: function (d) {
    var D = window.EnergyApps && window.EnergyApps.C6data, seen = isObj(d.seenP) ? d.seenP : {};
    var ids = D && D.ORDER ? D.ORDER : null, n = ids ? countIds(ids, seen, truthy) : Object.keys(seen).filter(function (k) { return seen[k]; }).length;
    var tot = ids ? ids.length : 17, sub = [];
    if (D && D.MACHINES && isObj(d.found)) {
      var f = 0, ft = 0;
      D.MACHINES.forEach(function (m) { var fm = isObj(d.found[m.id]) ? d.found[m.id] : {}; (m.hot || []).forEach(function (h) { ft++; if (fm[h.id]) f++; }); });
      if (f) sub.push('部品さがし ' + f + ' / ' + ft);
    }
    if (Array.isArray(d.lists) && d.lists.length) sub.push('点検表 ' + d.lists.length + ' まい');
    return { n: Math.min(n, tot), t: tot, main: '部品図鑑', end: '見た', sub: sub.join(' ・ ') };
  },
  C7: function (d) {
    var ds = isObj(d.designs) ? d.designs : {}, t = appTest('C7');
    var tasks = t && t.TASKS ? t.TASKS : null, ids = tasks ? tasks.map(function (x) { return x.id; }) : Object.keys(ds);
    var n = countIds(ids, ds, function (v) { return v && Array.isArray(v.parts) && v.parts.length > 0; }), cur = '';
    if (tasks && d.task) tasks.forEach(function (x) { if (x.id === d.task) cur = 'いまの課題: ' + (x.icon ? x.icon + ' ' : '') + x.title; });
    return tasks ? { n: n, t: ids.length, main: '回路図をかいた課題', end: '', sub: cur } : null;
  },
  /* C2・C3 は「やったこと」(STEPS)の数。保存の done・mis を読む */
  C2: function (d) {
    var t = appTest('C2'), ids = t && t.STEPS ? t.STEPS.map(function (x) { return x.id; }) : ['gen', 'quiz', 'cmp', 'm1', 'm2', 'm3', 'meth', 'day'];
    var dn = isObj(d.done) ? d.done : {}, ms = isObj(d.mis) ? d.mis : {};
    var n = ids.filter(function (k) { return /^m\d$/.test(k) ? !!ms[k] : !!dn[k]; }).length;
    var r = Array.isArray(d.rank) && d.rank[0] && isFinite(d.rank[0].p) ? d.rank[0].p : 0;
    return { n: n, t: ids.length, main: 'やったこと', end: '', sub: r > 0 ? 'ランキング1位 ' + (r < 1 ? Math.round(r * 1000) + ' mW' : r.toFixed(2) + ' W') : '' };
  },
  C3: function (d) {
    var t = appTest('C3'), ids = t && t.STEPS ? t.STEPS.map(function (x) { return x.id; }) : ['dcac', 'sort', 'route', 'mesh', 'trans', 'line', 'calcq', 'freq'];
    var dn = isObj(d.done) ? d.done : {};
    return { n: countIds(ids, dn, truthy), t: ids.length, main: 'やったこと', end: '', sub: +d.calcBest > 0 ? '計算ドリル 最高 ' + (+d.calcBest) + ' / 5' : '' };
  },
  /* C8 問題解決ノートは「やったこと」(課題・評価・最適化・振り返り)の数。保存の note(ノートの中身)を C8 の stepsOf で見る */
  C8: function (d) {
    var t = appTest('C8'); if (!t || !t.stepsOf || !isObj(d.note)) return { n: 0, t: 0 };
    var st = t.stepsOf(d.note), k = String(d.note.task && d.note.task.kadai || '').trim();
    return { n: st.filter(function (x) { return x.done; }).length, t: st.length, main: 'やったこと', end: '', sub: k ? '課題: ' + (k.length > 24 ? k.slice(0, 24) + '…' : k) : '' };
  }
};
function progressOf(id) {
  var d = readSave(id); if (!d) return null;
  try { var p = PROG[id] && PROG[id](d); return p && isFinite(p.n) && p.t > 0 ? p : { n: 0, t: 0 }; } catch (e) { return { n: 0, t: 0 }; }
}
function progressHtml(a, p) {
  if (!p || !p.t) return '';
  var pct = Math.round(100 * Math.min(1, p.n / p.t));
  return '<div class="ea-pg"><span>' + esc(p.main) + ' <b>' + p.n + ' / ' + p.t + '</b>' + (p.end ? ' ' + esc(p.end) : '') + '</span>' +
    '<span class="ef-progress-bar" role="img" aria-label="' + esc(p.main + ' ' + p.n + '/' + p.t) + '"><span style="width:' + pct + '%"></span></span>' +
    (p.sub ? '<span class="s2">' + esc(p.sub) + '</span>' : '') + '</div>';
}

/* ---- 画面を組み立てる ---- */
function frag(html) { var b = document.createElement('div'); b.innerHTML = html; return b.firstChild; }
// メニューのカード(4分野共通の EduitFrame.card)。タグと進み具合は「追加の欄」(extra)に入れる
function makeCard(a, parts) {
  var p = progressOf(a.id), pg = progressHtml(a, p);
  return EduitFrame.card({
    code: a.id, icon: a.icon, title: a.name, desc: a.sub, parts: parts || null,
    extra: [pg ? frag(pg) : null],
    openAttrs: { 'data-open': a.id }
  });
}
/* 基本編・発展編のタブ(分け方は C-energy/eduit-info.js の levels。タブの切りかえは共通の枠 shared/eduit-frame.js) */
var levelTabs = null;
function renderCards() {
  if (levelTabs) { levelTabs.render(); return; }
  if (window.EduitFrame && EduitFrame.levels && window.EDUIT_INFO && EDUIT_INFO.levels) {
    levelTabs = EduitFrame.levels(refs.cards, {
      gridClass: 'ea-cards',
      code: function (item) { return item.id; },
      card: function (item, parts) { var a = byId(item.id); return a ? makeCard(a, parts) : null; }
    });
    return;
  }
  refs.cards.className = 'ea-cards';
  refs.cards.innerHTML = '';
  APPS.forEach(function (a) { refs.cards.appendChild(makeCard(a)); });
}
if (window.EduitFrame && EduitFrame.menuTitle) EduitFrame.menuTitle($('[data-ref="menu-title"]'));
// アプリを切りかえるボタン: 記号の印 + 短い名前(「C4 電気回路」)
refs.chips.innerHTML = APPS.map(function (a) {
  return '<button class="ef-swchip" data-chip="' + a.id + '" aria-label="' + a.id + ' ' + esc(a.name) + '" title="' + a.id + ' ' + esc(a.name) + '">' +
    '<span class="ef-code">' + a.id + '</span><span class="ef-sw-n">' + esc(a.short) + '</span></button>';
}).join('');
refs.panes.innerHTML = APPS.map(function (a) { return '<div class="ea-pane" data-pane="' + a.id + '"><div></div></div>'; }).join('');

/* ---- 表示切りかえ(URLの #C1〜#C8 / #help で決まる) ---- */
function setView(v) {
  [].forEach.call(root.querySelectorAll('.ea-view'), function (el) { el.classList.toggle('on', el.getAttribute('data-view') === v); });
}
function openApp(id) {
  setView('app');
  [].forEach.call(refs.panes.children, function (p) { p.classList.toggle('on', p.getAttribute('data-pane') === id); });
  [].forEach.call(refs.chips.children, function (c) { var on = c.getAttribute('data-chip') === id; if (on) c.setAttribute('aria-current', 'page'); else c.removeAttribute('aria-current'); });
  APPS.forEach(function (a) { document.body.classList.toggle('ea-on-' + a.id, a.id === id); });
  cur = id; lastView = id;
  document.title = id + ' ' + byId(id).name + ' - エネルギー変換の技術 教材集';
  $('[data-ref="app-title"]').innerHTML = '<span class="ef-code">' + id + '</span>' + esc(byId(id).name);
  if (!mounted[id]) {
    var host = refs.panes.querySelector('[data-pane="' + id + '"]>div');
    try {
      if (!EA[id] || !EA[id].mount) throw new Error('アプリが読みこめませんでした');
      EA[id].mount(host); mounted[id] = true;
    } catch (e) {
      host.innerHTML = '<div class="ea-err">⚠️ ' + id + ' を開けませんでした。ページを読み込み直してください。<br><small>' + esc(e && e.message || e) + '</small></div>';
      if (window.console) console.error(e);
    }
  }
  if (window.EduitFrame && EduitFrame.jishuApp) EduitFrame.jishuApp(id, id + ' ' + byId(id).name);  // 自習モードのとき、そのアプリの自習ガイドを出す(アプリを作ったあと)
  // 各アプリの外わくの CSS クラスは記号ではない中の名前(.e1〜.e8)。記号を教科書の順に付け直したので番号はちがう(build.py の INNER と同じ)
  var INNER = { C1: 1, C2: 6, C3: 7, C4: 2, C5: 3, C6: 4, C7: 5, C8: 8 };
  var r = refs.panes.querySelector('[data-pane="' + id + '"] .e' + INNER[id]);
  if (r && r.focus && !r.contains(document.activeElement)) { try { r.focus({ preventScroll: true }); } catch (e) {} }
}
function openHelp(tab) {
  setView('help');
  if (window.EduitFrame && EduitFrame.jishuApp) EduitFrame.jishuApp(null);
  showTab(tab || 's');
  APPS.forEach(function (a) { document.body.classList.remove('ea-on-' + a.id); });
  document.title = '使い方 - エネルギー変換の技術 教材集';
  if (tab === 't') renderResets();
}
function showTab(t) {
  [].forEach.call(root.querySelectorAll('.ea-hbody'), function (b) { b.hidden = b.getAttribute('data-tab') !== t; });
  $('[data-ea="tab-s"]').setAttribute('aria-selected', t === 's' ? 'true' : 'false');
  $('[data-ea="tab-t"]').setAttribute('aria-selected', t === 't' ? 'true' : 'false');
}
function openHome() {
  setView('home'); renderCards(); cur = null; lastView = 'home'; fromHome = false;
  if (window.EduitFrame && EduitFrame.jishuApp) EduitFrame.jishuApp(null);
  APPS.forEach(function (a) { document.body.classList.remove('ea-on-' + a.id); });
  document.title = 'エネルギー変換の技術 教材集';
}
function route() {
  var h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (byId(h)) openApp(h);
  else if (h === 'help' || h === 'help-t') openHelp(h === 'help-t' ? 't' : 's');
  else openHome();
}
function setHash(h, push) {
  if (push) location.hash = h;
  else location.replace('#' + h);
}

/* ---- 操作 ---- */
root.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-open],[data-chip],[data-ea],[data-reset]');
  if (!t || !root.contains(t) || refs.panes.contains(t)) return;
  var open = t.getAttribute('data-open'), chip = t.getAttribute('data-chip'), act = t.getAttribute('data-ea'), rs = t.getAttribute('data-reset');
  if (open) { fromHome = true; setHash(open, true); }
  else if (chip) { if (chip !== cur) setHash(chip, false); }
  else if (rs) resetApp(rs);
  else if (act === 'home') { if (fromHome) { fromHome = false; history.back(); } else setHash('', false); }
  else if (act === 'help' || act === 'help-t') { helpPushed = true; setHash(act, true); }
  else if (act === 'back') { if (helpPushed) { helpPushed = false; history.back(); } else setHash(lastView === 'home' ? '' : lastView, false); }
  else if (act === 'tab-s' || act === 'tab-t') { setHash(act === 'tab-t' ? 'help-t' : 'help', false); }
  else if (act === 'fs') toggleFull();
  else if (act === 'export') exportAll();
  else if (act === 'import') $('[data-ea-file]').click();
});
window.addEventListener('hashchange', route);

// 全画面(Chromebook やパソコンでは、ブラウザのタブやアドレスバーの分だけ作業する場所が広くなる)
// 生徒用サイトの枠(上に「◀ 入り口」と「全画面」のバー)の中で開いたときは、枠のページごと全画面にする(枠の「全画面」ボタンと同じ動き)
var D = document;
try { if (window.top !== window && window.top.document.getElementById('site-fs')) D = window.top.document; } catch (e) {}
var fsOK = !!(D.fullscreenEnabled || D.webkitFullscreenEnabled);
// キー(F11・Chromebook の全画面キー)で全画面にしたときも「全画面をやめる」にする。ページからはやめられないので、押したら同じキーでもどせると伝える
var W = D.defaultView || window, keyMq = W.matchMedia ? W.matchMedia('(display-mode: fullscreen)') : null;
function isFull() { return !!(D.fullscreenElement || D.webkitFullscreenElement); }
function isKeyFull() { return !isFull() && !!(keyMq && keyMq.matches); }
function toggleFull() {
  var el = D.documentElement;
  try {
    if (isFull()) (D.exitFullscreen || D.webkitExitFullscreen).call(D);
    else if (isKeyFull()) toast('キーで全画面にしたときは、同じキー(F11 など)でもどせます');
    else { var r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (r && r.catch) r.catch(function () {}); }
  } catch (e) {}
}
function updFull() {
  var on = isFull() || isKeyFull();
  root.querySelectorAll('[data-ea="fs"]').forEach(function (b) {
    b.hidden = !fsOK;
    b.innerHTML = '🖥️<span class="t"> ' + (on ? '全画面をやめる' : '全画面') + '</span>';
    b.setAttribute('aria-label', on ? '全画面をやめる' : '全画面にする');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}
D.addEventListener('fullscreenchange', updFull);
D.addEventListener('webkitfullscreenchange', updFull);
if (keyMq) { if (keyMq.addEventListener) keyMq.addEventListener('change', updFull); else if (keyMq.addListener) keyMq.addListener(updFull); }
W.addEventListener('resize', updFull);
updFull();

/* ---- 学習記録の書き出し・読み込み・消去(先生向け) ---- */
function toast(msg) {
  refs.toast.textContent = msg; refs.toast.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(function () { refs.toast.style.display = 'none'; }, 2600);
}
function exportAll() {
  var data = {};
  APPS.forEach(function (a) { var v = lsGet(KEY(a.id)); if (v != null) data[KEY(a.id)] = v; });
  if (!Object.keys(data).length) { toast('まだ記録がありません。'); return; }
  var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
  var name = 'energy-apps-kiroku-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '.json';
  var blob = new Blob([JSON.stringify({ schema: 'energyApps.backup', version: 1, saved: d.toISOString(), data: data }, null, 1)], { type: 'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('「' + name + '」を書き出しました。');
}
$('[data-ea-file]').addEventListener('change', function (ev) {
  var f = ev.target.files && ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    var j = null; try { j = JSON.parse(rd.result); } catch (e) {}
    if (!j || j.schema !== 'energyApps.backup' || !j.data || typeof j.data !== 'object') { alert('このファイルは学習記録のファイルではありません。\n(「全アプリの記録をファイルに書き出す」で作ったファイルをえらんでください)'); return; }
    var keys = Object.keys(j.data).filter(function (k) { return /^energyApps\.C[1-8]\.v1$/.test(k) && typeof j.data[k] === 'string'; });
    if (!keys.length) { alert('読み込める記録がありませんでした。'); return; }
    if (!confirm(keys.map(function (k) { return k.split('.')[1]; }).join('・') + ' の記録を読み込みます。\nこの端末の今の記録は上書きされます。よろしいですか?')) return;
    try { keys.forEach(function (k) { localStorage.setItem(k, j.data[k]); }); } catch (e) { alert('保存できませんでした: ' + e.message); return; }
    location.reload();
  };
  rd.readAsText(f);
});
function renderResets() {
  var box = $('[data-ea-resets]'); if (!box) return;
  box.innerHTML = APPS.map(function (a) {
    var has = !!lsGet(KEY(a.id));
    return '<button class="ef-btn is-danger" data-reset="' + a.id + '"' + (has ? '' : ' disabled') + '>🗑️ ' + a.id + ' の記録を消す' + (has ? '' : '(記録なし)') + '</button>';
  }).join('');
}
function resetApp(id) {
  var a = byId(id); if (!a) return;
  if (!confirm(a.id + '「' + a.name + '」の記録(★・回路・回答など)をすべて消します。\n元にはもどせません。よろしいですか?')) return;
  try { localStorage.removeItem(KEY(id)); } catch (e) {}
  location.reload();
}

route();
})();
</script>
</body>
</html>
