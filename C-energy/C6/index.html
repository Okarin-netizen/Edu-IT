<body>
<div id="e6-app" class="e6"></div>
<script>
/* ===================================================================
   C6 風力発電の羽根ラボ — window.EnergyApps.C6
   教科書 3編1章2「発電の仕組みと特徴」(レッツスタート: 風力発電のモデル)
   羽根の枚数・かたむき(ピッチ角)・長さ・形と風の強さを変えて、回転数・電圧・電流・電力・回り始めの風をくらべる。
   数値は、扇風機と小さな発電機で作る「風力発電のモデル」を理想化した計算による目安。
   =================================================================== */
(function () {
'use strict';
var NS = window.EnergyApps = window.EnergyApps || {};
var STORE_KEY = 'energyApps.C6.v1';

/* ---------- 小道具 ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function rb(w, r) { return '<ruby>' + w + '<rt>' + r + '</rt></ruby>'; }
function fkOn() { return !(window.EduitFrame && window.EduitFrame.furikaeri === false); }
function fW(p) { if (p < 0.0005) return ['0', 'W']; if (p < 1) return [String(Math.round(p * 1000)), 'mW']; return [p.toFixed(2), 'W']; }
function fWs(p) { var a = fW(p); return a[0] + ' ' + a[1]; }

/* ---------- 風力発電のモデルの計算 ----------
 * 風のエネルギー(1秒あたり) Pw = 1/2 × 空気の密度 × 風が当たる面積 × 風速³
 * 電力 = Pw × 羽根の効率(形・枚数・かたむきで変わる)× 発電機の効率
 * 回り始める風: 羽根を回そうとする力(枚数・かたむき・形)が、発電機と軸の引っかかり(摩擦)に勝つ風速
 * 扇風機の風が当たるのは中心から 22 cm まで(それより長い羽根は、外の部分に風が当たらず重くなるだけ)
 */
var SHAPES = {
  flat: { name: '平らな板', cp: 0.20, opt: 22, st: 1.0, note: '作りやすい。効率はひかえめ' },
  curve: { name: '曲げた板', cp: 0.28, opt: 18, st: 1.2, note: '風を受け止めやすく、回り始めやすい' },
  wing: { name: 'つばさの形', cp: 0.36, opt: 12, st: 0.6, note: '飛行機のつばさと同じ形。速く回るが、回り始めにくい' }
};
var NBL = [2, 3, 4, 5, 6, 8];
var NF = { 2: 0.92, 3: 1, 4: 0.97, 5: 0.93, 6: 0.88, 8: 0.78 };
var FAN_R = 0.22, RHO = 1.2, ETA = 0.55, RL = 10, HUB = 2, CUT = 10;
function calc(b, v) {
  var sh = SHAPES[b.shape] || SHAPES.flat, r = (b.len + HUB) / 100, re = Math.min(r, FAN_R), A = Math.PI * re * re;
  var Pw = 0.5 * RHO * A * v * v * v, th = b.pitch * Math.PI / 180;
  var cp = sh.cp * (NF[b.n] || 0.8) * Math.exp(-Math.pow((b.pitch - sh.opt) / 15, 2)) * Math.min(1, b.pitch / 5);
  if (r > FAN_R) cp *= Math.pow(FAN_R / r, 0.6);
  var cs = 0.05 * Math.pow(b.n, 0.7) * Math.sin(2 * th) * sh.st;
  var Tf = 0.0006 + 0.000012 * b.n * b.len * (b.shape === 'wing' ? 1.2 : 1);
  var vs = cs > 1e-4 ? Math.sqrt(Tf / (0.5 * RHO * A * re * cs)) : Infinity;
  var k = v > vs ? clamp((v - vs) / 0.8, 0, 1) : 0;
  var P = cp * Pw * ETA * k;
  var lam = 6.5 / Math.pow(b.n, 0.55) * Math.pow(Math.cos(th), 1.5);
  var rpm = k > 0 ? lam * v / r * 60 / (2 * Math.PI) * Math.sqrt(k) : 0;
  var V = Math.sqrt(P * RL);
  return { P: P, Pw: Pw, vs: vs, rpm: rpm, V: V, I: V / RL, eff: Pw > 0 ? P / Pw : 0 };
}
function bladeName(b) { return b.n + '枚・' + b.pitch + '°・' + b.len + 'cm・' + (SHAPES[b.shape] || SHAPES.flat).name; }
function sameB(a, b) { return a && b && a.n === b.n && a.pitch === b.pitch && a.len === b.len && a.shape === b.shape; }
function r1(x) { return Math.round(x * 10) / 10; }  /* 画面に出す数字(小数1けた)で判定する */
function vsTxt(vs) { return isFinite(vs) && vs < 30 ? vs.toFixed(1) : '回らない'; }

/* ---------- 保存 ---------- */
var S = { root: null, tab: 'intro', save: null, el: {}, tick: null, raf: 0, last: 0 };
function blank() {
  return { v: 1, tab: 'intro', blade: { n: 3, pitch: 20, len: 15, shape: 'flat' }, wind: 4, recs: [], rank: [], mis: {}, done: {}, quiz: {}, flow: {}, featBest: 0, days: {}, refl: { q1: '', q2: '', q3: '' }, who: { cls: '', name: '' } };
}
function loadSave() {
  var s = null, b = blank();
  try { s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { s = null; }
  if (!s || typeof s !== 'object' || Array.isArray(s)) return b;
  Object.keys(b).forEach(function (k) { if (s[k] == null || typeof s[k] !== typeof b[k] || Array.isArray(s[k]) !== Array.isArray(b[k])) s[k] = b[k]; });
  var bl = s.blade;
  if (NBL.indexOf(bl.n) < 0) bl.n = 3;
  bl.pitch = clamp(Math.round(+bl.pitch || 20), 0, 90); bl.len = clamp(Math.round(+bl.len || 15), 5, 30);
  if (!SHAPES[bl.shape]) bl.shape = 'flat';
  s.wind = clamp(+s.wind || 4, 0, 10);
  s.recs = s.recs.filter(function (r) { return r && r.b && SHAPES[r.b.shape]; }).slice(-10);
  s.rank = s.rank.filter(function (r) { return r && r.b && SHAPES[r.b.shape] && isFinite(r.p); }).slice(0, 5);
  return s;
}
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S.save)); } catch (e) {} }
function mark(k) { if (!S.save.done[k]) { S.save.done[k] = 1; persist(); renderTabs(); } }

/* ---------- タブ ---------- */
var TABS = [
  { id: 'intro', lg: '🏁 はじめに' },
  { id: 'gen', lg: '① 発電機のしくみ', step: 'gen' },
  { id: 'cmp', lg: '② 羽根をくらべる', step: 'cmp' },
  { id: 'best', lg: '③ 効率チャレンジ', step: 'best' },
  { id: 'meth', lg: '④ 発電方法くらべ', adv: 1, step: 'meth' },
  { id: 'day', lg: '⑤ 風が変わる日', adv: 1, step: 'day' },
  { id: 'refl', lg: '✏️ 振り返り', reflect: 1 },
  { id: 'rec', lg: '💾 記録' }
];
/* メニューのカードの進み具合に使う(やったこと) */
var STEPS = [
  { id: 'gen', name: '① 発電機で LED を光らせた' }, { id: 'quiz', name: '① たしかめ問題に全部正解' },
  { id: 'cmp', name: '② 羽根を3つ以上くらべた' }, { id: 'm1', name: '③ チャレンジ1' }, { id: 'm2', name: '③ チャレンジ2' }, { id: 'm3', name: '③ チャレンジ3' },
  { id: 'meth', name: '④ 変換の流れを5つ完成' }, { id: 'day', name: '⑤ 2つ以上の日で発電した' }
];
function stepDone(id) {
  var s = S.save;
  if (id === 'm1' || id === 'm2' || id === 'm3') return !!s.mis[id];
  return !!s.done[id];

  };
}

/* ================= 振り返り ================= */
var REFL = [
  { id: 'q1', q: '風が吹くと、どのようにして電気ができますか。「コイル」「磁石」という言葉を使って説明しよう。' },
  { id: 'q2', q: 'いちばん効率がよかった羽根は、どんな羽根でしたか。なぜよかったと思いますか。' },
  { id: 'q3', q: '風力発電のよいところと課題は何ですか。ほかの発電方法と組み合わせるとよいのはなぜですか。' }
];
function renderRefl(box) {
  box.innerHTML = '<div class="e6-card" data-ef-reflect><h2>✏️ 振り返り</h2><p>学んだことを、自分の言葉で書きましょう。書いた内容は自動で保存され、「💾 記録」でファイルにできます。</p>' +
    REFL.map(function (r, i) { return '<div class="e6-field"><label for="e6-' + r.id + '">' + (i + 1) + '. ' + r.q + '</label><textarea id="e6-' + r.id + '" data-refl="' + r.id + '" maxlength="800">' + esc(S.save.refl[r.id]) + '</textarea></div>'; }).join('') + '</div>';
  box.addEventListener('input', function (ev) { var k = ev.target.getAttribute('data-refl'); if (!k) return; S.save.refl[k] = ev.target.value; persist(); });
}

/* ================= 記録 ================= */
function whoInit() {
  var w = S.save.who;
  if (!w.cls && !w.name) { try { var e5 = JSON.parse(localStorage.getItem('energyApps.C5.v1') || 'null'); if (e5 && e5.who && (e5.who.cls || e5.who.name)) { w.cls = String(e5.who.cls || ''); w.name = String(e5.who.name || ''); } } catch (e) {} }
  return w;
}
function renderRec(box) {
  var w = whoInit(), s = S.save;
  var rows = STEPS.map(function (st) { var ok = stepDone(st.id); return '<li><span class="m">' + (ok ? '✅' : '⬜') + '</span>' + st.name + (st.id.charAt(0) === 'm' && s.mis[st.id] ? '<small style="color:#5b6b7c"> ・' + esc(s.mis[st.id]) + '</small>' : '') + '</li>'; }).join('');
  box.innerHTML = '<div class="e6-grid"><div class="e6-card"><h2>📊 やったこと</h2><ul class="e6-sum">' + rows + '</ul>' +
    '<p>ランキング1位: <b>' + (s.rank[0] ? esc(bladeName(s.rank[0].b)) + '(' + fWs(s.rank[0].p) + ')' : 'まだありません') + '</b><br>④ 特徴クイズのいちばん: <b>' + s.featBest + ' / 10</b></p></div>' +
    '<div class="e6-card"><h2>💾 ファイルに保存して提出</h2><div class="e6-two"><div class="e6-field"><label for="e6-cls">組・番号</label><input type="text" id="e6-cls" data-who="cls" maxlength="20" value="' + esc(w.cls) + '" placeholder="例: 2組15番"></div><div class="e6-field"><label for="e6-name">名前</label><input type="text" id="e6-name" data-who="name" maxlength="30" value="' + esc(w.name) + '"></div></div>' +
    '<p>やったこと・ランキング・振り返りを、1つのファイル(<code>C6-fuuryoku-….json</code>)にしてダウンロードします。Classroom などで先生に提出しましょう。</p>' +
    '<button class="e6-btn primary" data-act="save" style="width:100%">💾 ファイルに保存</button>' +
    '<div data-ef-reflect style="margin-top:10px"><h3>振り返り(ファイルに入ります)</h3>' + REFL.map(function (r, i) { return '<p><b>' + (i + 1) + '.</b> ' + (s.refl[r.id] ? esc(s.refl[r.id]) : '<span style="color:#868e96">(まだ書いていません)</span>') + '</p>'; }).join('') + '</div></div></div>';
  box.addEventListener('input', function (ev) { var k = ev.target.getAttribute('data-who'); if (!k) return; S.save.who[k] = ev.target.value.slice(0, k === 'cls' ? 20 : 30); persist(); });
  box.addEventListener('click', function (ev) { if (ev.target.closest('[data-act="save"]')) saveFile(); });
}
function exportObj() {
  var s = S.save;
  return { schema: 'energyApps.artifact', app: 'C6', type: 'wind-lab', version: 1, savedAt: new Date().toISOString(), who: { cls: s.who.cls, name: s.who.name },
    data: { steps: STEPS.map(function (st) { return { id: st.id, name: st.name, done: stepDone(st.id) }; }), missions: s.mis, rank: s.rank.map(function (r) { return { blade: bladeName(r.b), b: r.b, watt: +r.p.toFixed(4), startWind: +(+r.vs).toFixed(2) }; }),
      records: s.recs, featBest: s.featBest, reflection: s.refl } };
}
function saveFile() {
  var p2 = function (n) { return (n < 10 ? '0' : '') + n; }, t = new Date();
  var blob = new Blob([JSON.stringify(exportObj(), null, 1)], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'C6-fuuryoku-' + t.getFullYear() + p2(t.getMonth() + 1) + p2(t.getDate()) + '-' + p2(t.getHours()) + p2(t.getMinutes()) + '.json';
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('保存しました。ダウンロードのフォルダを見てね。');
}

/* ---------- 画面 ---------- */
var RENDER = { intro: renderIntro, gen: renderGen, cmp: renderCmp, best: renderBest, meth: renderMeth, day: renderDay, refl: renderRefl, rec: renderRec };
function renderBody() {
  var old = S.el.body, nb = old.cloneNode(false);   /* 前のタブのイベントを残さないように、入れ物ごと作り直す */
  old.parentNode.replaceChild(nb, old); S.el.body = nb;
  var w = document.createElement('div'); w.className = 'e6-wrap'; nb.appendChild(w);
  (RENDER[S.tab] || renderIntro)(w);
}
function mount(root) {
  S.root = root; root.classList.add('e6');
  S.save = loadSave();
  root.innerHTML = '<div class="e6-top" data-ef-autohide>' + (NS.embedded ? '' : '<h1>🌬️ <span class="lg">風力発電の羽根ラボ</span></h1>') + '<nav class="e6-tabs" data-ref="tabs" aria-label="C6 のページ"></nav>' + efSlot() + '</div>' +
    '<div class="e6-body" data-ref="body"></div><div class="e6-toast" data-ref="toast" role="status"></div>';
  S.el = {}; root.querySelectorAll('[data-ref]').forEach(function (x) { S.el[x.getAttribute('data-ref')] = x; });
  if (!NS.embedded && window.EduitFrame) window.EduitFrame.mount();
  S.el.tabs.addEventListener('click', function (ev) { var t = ev.target.closest('[data-tab]'); if (t) go(t.getAttribute('data-tab')); });
  var t0 = TABS.some(function (t) { return t.id === S.save.tab; }) ? S.save.tab : 'intro';
  go(t0);
  if (!S.raf) S.raf = requestAnimationFrame(frame);
}

NS.C6 = {
  mount: mount,
  _test: { S: S, calc: calc, MIS: MIS, STEPS: STEPS, TABS: TABS, METH: METH, FEATS: FEATS, DAYS: DAYS, stepDone: stepDone, exportObj: exportObj, go: go, bladeName: bladeName }
};
var auto = document.getElementById('e6-app');
if (auto && !auto.getAttribute('data-manual')) mount(auto);
})();
</script>
</body>
</html>
