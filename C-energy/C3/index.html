<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C3 機構ラボ</title>
<!-- 共通の枠(4分野共通の色・ヘッダー・作成者・安全と個人情報・ライセンス・更新履歴)。統合版では build.py が中に入れる -->
<link rel="stylesheet" href="../../shared/eduit-frame.css">
<script src="../eduit-info.js"></script>
<script data-ef-app>EDUIT_INFO.app = { name: 'C3 機構ラボ' };</script>
<script src="../../shared/eduit-frame.js"></script>
<style>
html,body{margin:0;height:100%;background:#f1f3ee;}
.e3{--ink:#22302a;--sub:#5e6b64;--line:#d8ded6;--accent:#2b7a4b;--accent2:#1e6fd9;--ok:#1a9b5b;--ng:#d93a3a;--warn:#e67700;--top:#1d3557;
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;
  color:var(--ink);height:100%;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;
  font-size:calc(16px * var(--ea-fs, 1));overflow:hidden;position:relative;background:#f1f3ee;-webkit-tap-highlight-color:transparent;}
.e3 *{box-sizing:border-box}
.e3 button{font:inherit;touch-action:manipulation}
.e3-top{height:58px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--ef-surface,#fff);color:var(--ef-text,#1f2328);flex:none;border-bottom:3px solid var(--ef-accent,#b45309)}
.e3-top .e3-btn{white-space:nowrap}
.e3-top .sh{display:none}
.e3-top h1{font-size:calc(17px * var(--ea-fs, 1));margin:0 6px 0 0;white-space:nowrap;font-weight:bold}
.e3-stitle{flex:1;font-size:calc(15px * var(--ea-fs, 1));font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:6px;min-width:0}
.e3-btn{min-height:46px;min-width:46px;padding:0 14px;border-radius:12px;border:2px solid transparent;background:#e4ebe3;color:var(--ink);font-weight:bold;cursor:pointer;font-size:calc(16px * var(--ea-fs, 1))}
.e3-btn:active{transform:translateY(1px)}
.e3-btn:disabled{opacity:.4;cursor:default}
.e3-btn:focus-visible,.e3-cv:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.e3-top .e3-btn{background:var(--ef-surface,#fff);color:var(--ef-text,#1f2328);border:1px solid var(--ef-line,#d6d3cb);border-radius:999px;padding:0 12px}
.e3-top .e3-btn:hover{border-color:var(--ef-accent,#b45309)}
.e3-top .e3-btn.on{background:var(--ef-accent,#b45309);border-color:var(--ef-accent,#b45309);color:var(--ef-accent-ink,#fff)}
.e3-top h1{color:var(--ef-text,#1f2328)}
.e3-top .ef-about-btn{font-size:0;min-width:44px;min-height:44px;padding:0;flex:none}
.e3-top .ef-about-btn::before{content:"ⓘ";font-size:calc(20px * var(--ea-fs, 1))}
.e3-btn.primary{background:var(--accent2);color:#fff}
.e3-btn.blue{background:var(--accent2);color:#fff}
.e3-btn.danger{background:#fde2e2;color:#a61e1e}
.e3-btn.good{background:#d3f5e1;color:#0d6b3a}
.e3-btn.big{min-height:56px;font-size:calc(18px * var(--ea-fs, 1));width:100%}
.e3-btn.sm{min-height:44px;padding:0 10px;font-size:calc(15px * var(--ea-fs, 1))}
.e3-btn.on{background:var(--accent);color:#fff}
.e3-btn.off,.e3-add.off{opacity:.4}
.e3-main{flex:1;display:flex;min-height:0}
.e3-pal{width:212px;flex:none;overflow-y:auto;overflow-x:hidden;padding:8px;background:#fff;border-right:1px solid var(--line)}
.e3-pal h2,.e3-side h2{font-size:calc(14px * var(--ea-fs, 1));margin:8px 2px 6px;color:var(--sub)}
.e3-pal h2:first-child,.e3-side h2:first-child{margin-top:2px}
.e3-addg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.e3-add{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;border:2px solid var(--line);background:#f7faf6;cursor:pointer;min-height:76px;font-size:calc(13px * var(--ea-fs, 1));font-weight:bold;padding:4px 2px;text-align:center;line-height:1.25;color:var(--ink)}
.e3-add .ic{font-size:calc(24px * var(--ea-fs, 1));line-height:28px}
.e3-add small{font-weight:normal;color:var(--sub);font-size:calc(13px * var(--ea-fs, 1))}
.e3-add:disabled{opacity:.35}
.e3-add.wide{grid-column:span 2;min-height:56px;flex-direction:row;gap:8px}
.e3-list{display:flex;flex-direction:column;gap:6px}
.e3-list .e3-btn{text-align:left;justify-content:flex-start;display:flex;align-items:center;gap:8px;min-height:52px;font-size:calc(15px * var(--ea-fs, 1))}
.e3-list .e3-btn .ic{font-size:calc(22px * var(--ea-fs, 1))}
.e3-list .e3-btn small{display:block;font-weight:normal;font-size:calc(13px * var(--ea-fs, 1));color:inherit;opacity:.85}
.e3-list .gap{height:14px}
.e3-center{flex:1;display:flex;flex-direction:column;min-width:0}
.e3-msg{min-height:46px;padding:10px 14px;font-size:calc(16px * var(--ea-fs, 1));background:#fffbe6;border-bottom:1px solid #f1e3a6;line-height:1.4}
.e3-msg.err{background:#ffe8e8;border-color:#f5b5b5;color:#8a1414}
.e3-msg.ok{background:#e6f8ee;border-color:#a8e0c0}
.e3-msg.task{background:#eaf2ff;border-color:#b9d1f5}
.e3-bar{display:flex;gap:6px;padding:6px 8px;background:#f7f9f5;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.e3-bar .sp{flex:1}
.e3-bar .lbl{font-size:calc(13px * var(--ea-fs, 1));color:var(--sub);font-weight:bold;margin-left:4px}
.e3-cvbox{flex:1;min-height:0;position:relative;background:#fbfcfa}
.e3-cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.e3-hint{position:absolute;left:10px;bottom:8px;font-size:calc(14px * var(--ea-fs, 1));color:var(--sub);background:rgba(255,255,255,.85);padding:3px 8px;border-radius:8px;pointer-events:none}
.e3-side{width:300px;flex:none;overflow-y:auto;padding:10px;background:#fff;border-left:1px solid var(--line)}
.e3-card{background:#f5f8f4;border-radius:12px;padding:10px 12px;margin-bottom:10px;line-height:1.5}
.e3-card.out{background:#eef6ff}
.e3-card.part{background:#fff8ec}
.e3-kv{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:2px 0;font-size:calc(15px * var(--ea-fs, 1))}
.e3-kv b{font-size:calc(19px * var(--ea-fs, 1))}
.e3-kv .u{font-size:calc(13px * var(--ea-fs, 1));color:var(--sub)}
.e3-formula{font-size:calc(14px * var(--ea-fs, 1));background:#fff;border:1px dashed #b8c4b9;border-radius:8px;padding:6px 8px;margin-top:6px;line-height:1.55}
.e3-dir{font-size:calc(20px * var(--ea-fs, 1));font-weight:bold}
.e3-tbar{height:14px;background:#e3e8e2;border-radius:7px;overflow:hidden;margin:2px 0 6px}
.e3-tbar i{display:block;height:100%;background:#e67700;border-radius:7px}
.e3-tbar.sp i{background:#1e6fd9}
.e3-step{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.e3-step{gap:3px!important}
.e3-step .e3-btn{min-width:44px;min-height:46px;padding:0;font-size:calc(17px * var(--ea-fs, 1))}
.e3-step .val{min-width:52px;text-align:center;font-size:calc(22px * var(--ea-fs, 1));font-weight:bold}
.e3-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.e3-chips .e3-btn{min-width:48px;min-height:44px;padding:0 8px;font-size:calc(15px * var(--ea-fs, 1))}
.e3-prm{margin-bottom:10px}
.e3-prm .nm{font-size:calc(14px * var(--ea-fs, 1));font-weight:bold;color:var(--sub);margin-bottom:2px}
.e3-chk{list-style:none;margin:4px 0;padding:0}
.e3-chk li{padding:4px 0 4px 30px;position:relative;font-size:calc(15px * var(--ea-fs, 1));line-height:1.4}
.e3-chk li:before{content:"○";position:absolute;left:4px;top:3px;font-weight:bold;color:#9aa69e;font-size:calc(17px * var(--ea-fs, 1))}
.e3-chk li.ok:before{content:"✔";color:var(--ok)}
.e3-chk li.ok{color:#0d6b3a;font-weight:bold}
.e3-ov{position:absolute;inset:0;background:rgba(20,35,28,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.e3-modal{background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:100%;overflow-y:auto;padding:20px 24px;box-shadow:0 10px 40px rgba(0,0,0,.3);font-size:calc(17px * var(--ea-fs, 1));line-height:1.6}
.e3-modal h2{margin:0 0 10px;font-size:calc(23px * var(--ea-fs, 1))}
.e3-modal h3{margin:14px 0 6px;font-size:calc(18px * var(--ea-fs, 1))}
.e3-modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.e3-modal .acts .e3-btn{min-width:150px;min-height:54px;font-size:calc(18px * var(--ea-fs, 1))}
.e3-modal .acts.stk{position:sticky;bottom:-20px;background:#fff;margin:16px -24px -20px;padding:10px 24px 16px;border-top:1px solid var(--line)}
.e3-modal .acts.stk .e3-btn{min-width:0;flex:1 1 auto;white-space:nowrap;padding:0 12px}
.e3-refl label{display:block;font-weight:bold;margin:8px 0 4px;font-size:calc(16px * var(--ea-fs, 1))}
.e3-refl textarea.e3-in{resize:vertical;min-height:4.5em;display:block}
.e3-saved{color:#0d6b3a;font-weight:bold;min-height:1.6em;text-align:right}
.e3 ruby{ruby-align:center}
.e3 ruby rt{font-size:.55em;font-weight:normal;letter-spacing:0}
.e3-story{font-size:calc(15px * var(--ea-fs, 1));line-height:1.55;margin:4px 0 2px}
.e3-warn{color:#b42318;font-weight:bold}
.e3-steps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.e3-steps div{background:#f3f7f2;border-radius:12px;padding:12px;font-size:calc(16px * var(--ea-fs, 1))}
.e3-steps b{font-size:calc(18px * var(--ea-fs, 1))}
.e3-reason{background:#fff4f4;border-left:5px solid var(--ng);padding:8px 12px;margin:8px 0;border-radius:6px}
.e3-reason.tip{background:#fff9e6;border-color:var(--warn)}
.e3-reason.good{background:#ecfaf1;border-color:var(--ok)}
.e3-page{flex:1;overflow-y:auto;padding:14px 16px}
.e3-tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.e3-tcard{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;min-height:124px;display:flex;flex-direction:column;gap:2px}
.e3-tcard.done{background:#effaf3;border-color:#a8e0c0}
.e3-tcard .no{font-size:calc(13px * var(--ea-fs, 1));color:var(--sub);display:flex;justify-content:space-between}
.e3-tcard .t{font-size:calc(18px * var(--ea-fs, 1));font-weight:bold}
.e3-tcard .l{font-size:calc(14px * var(--ea-fs, 1));color:var(--sub);line-height:1.4}
.e3-tcard .star{color:#e8a200;font-size:calc(16px * var(--ea-fs, 1));letter-spacing:1px}
.e3-quiz .e3-btn.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:8px 14px;font-weight:bold;font-size:calc(18px * var(--ea-fs, 1));min-height:56px}
.e3-quiz .e3-btn.ch:disabled{opacity:.75}
.e3-quiz .e3-btn.right:disabled,.e3-quiz .e3-btn.wrong:disabled{opacity:1}
.e3-quiz .e3-btn.right{background:#d3f5e1;border-color:var(--ok)}
.e3-quiz .e3-btn.wrong{background:#ffe0e0;border-color:var(--ng)}
.e3-qno{display:flex;gap:4px;margin-bottom:8px}
.e3-qno i{flex:1;height:8px;border-radius:4px;background:#dfe5de}
.e3-qno i.cur{background:#9cc3ff}.e3-qno i.ok{background:var(--ok)}.e3-qno i.ng{background:var(--ng)}
.e3-qtext{font-size:calc(18px * var(--ea-fs, 1));font-weight:bold;line-height:1.5;margin:4px 0 8px}
.e3-big{font-size:calc(46px * var(--ea-fs, 1));text-align:center;margin:4px 0}
.e3-tbl{border-collapse:collapse;width:100%;font-size:calc(15px * var(--ea-fs, 1))}
.e3-tbl th{background:#e8efe6;padding:5px;font-size:calc(14px * var(--ea-fs, 1))}
.e3-tbl td{border-bottom:1px solid #e1e6df;padding:4px 6px;text-align:center}
.e3-tbl td.l{text-align:left}
.e3-in{font:inherit;font-size:calc(17px * var(--ea-fs, 1));padding:8px 10px;border:2px solid var(--line);border-radius:10px;width:100%;user-select:text;-webkit-user-select:text}
.e3-printarea img{display:block;margin:6px auto;max-height:300px;object-fit:contain;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
@media (max-width:1100px){.e3-list .e3-btn{padding:0 8px;font-size:calc(14px * var(--ea-fs, 1));gap:6px}.e3-pal{width:184px}.e3-side{width:280px}.e3-top h1{display:none}.e3-tgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  .e3-top{gap:4px;padding:0 6px}
  .e3-top .e3-btn{padding:0 9px}
  .e3-top .lg{display:none}.e3-top .sh{display:inline}
  .e3-stitle{font-size:calc(14px * var(--ea-fs, 1));padding-left:2px}
  .e3-main{flex-direction:column}
  .e3-pal{width:auto;flex:none;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line)}
  .e3-pal h2{display:none}
  .e3-pal .e3-btn.off[data-act="mech"]{display:none}
  .e3-addg{display:flex;gap:6px;flex:none}
  .e3-add,.e3-add.wide{min-width:86px;min-height:66px;flex-direction:column;gap:0}
  .e3-list{flex-direction:row;flex:none}
  .e3-list .gap{width:14px;height:auto}
  .e3-list .e3-btn,.e3-list .e3-btn.sm{min-height:66px;white-space:nowrap;font-size:calc(15px * var(--ea-fs, 1))}
  .e3-pal .e3-card{flex:none;margin:0;max-width:260px;font-size:calc(14px * var(--ea-fs, 1))!important;padding:6px 10px}
  .e3-center{flex:1;min-height:0}
  .e3-side{width:auto;flex:none;max-height:40%;border-left:0;border-top:2px solid var(--line)}
  .e3-modal{padding:16px 16px}
  .e3-modal .acts.stk{margin:12px -16px -16px;padding:10px 16px 14px;bottom:-16px}
  .e3-steps{grid-template-columns:1fr}
}
/* スマホ: 盤面の高さを先に取り、下の説明は画面ごとスクロールして読む(盤面がつぶれないように) */
@media (max-width:640px){
  .e3-main{overflow-y:auto}
  .e3-center{flex:none}
  .e3-cvbox{flex:none;height:min(62vh,420px);min-height:260px}
  .e3-side{max-height:none;overflow:visible}
}
@media print{
  html,body{height:auto;background:#fff}
  body *{visibility:hidden}
  .e3-printarea,.e3-printarea *{visibility:visible}
  .e3-printarea{position:static;width:100%}
  .e3{height:auto!important;overflow:visible!important;display:block!important;background:#fff!important}
  .e3-top,.e3-main,.e3-page{display:none!important}
  .e3-ov{position:static;background:none;padding:0;display:block}
  .e3-modal{max-height:none!important;overflow:visible!important;box-shadow:none;max-width:none;padding:0;border-radius:0}
  .e3-printarea .e3-in{border:0;border-bottom:1.5px solid #333;border-radius:0;padding:4px 2px}
  .e3-printarea .e3-in::placeholder{color:transparent}
  .e3-printarea textarea.e3-in{resize:none;field-sizing:content;min-height:3em;overflow:visible}
  .e3-printarea table,.e3-printarea tr,.e3-printarea img{break-inside:avoid}
  .e3-noprint{display:none!important}
}
</style>
</head>
<body>
<div id="e3-app" class="e3"></div>
<script>
/* ===================================================================
   機構コア(部品データ+運動学) — C3 機構ラボ / C4 保守点検クイズ 共用
   window.EnergyApps.Mech
   ・力学(物理エンジン)は使わず、運動学(動きの幾何と比)だけで計算する
   ・回転を伝える列 train = { wheels:[{kind,size}], links:[type] }
       kind: 'gear'(歯車:size=歯数) 'pulley'(プーリー:size=直径mm) 'sprocket'(スプロケット:size=歯数)
       links[i] は wheels[i] と wheels[i+1] のつなぎ方:
       'mesh'(かみ合い) 'belt'(平ベルト) 'cross'(十字掛けベルト) 'chain'(チェーン) 'shaft'(同じ軸に固定)
   ・回転の向き: +1 = 入力(モーター)と同じ向き(時計回り)、-1 = 逆向き
   =================================================================== */
(function () {
'use strict';
var NS = window.EnergyApps = window.EnergyApps || {};
if (NS.Mech) return;

/* ---------- 部品データ(C4 の部品図鑑と共用) ---------- */
var PARTS = {
  gear: { name: '歯車', yomi: 'はぐるま', cat: '回転を伝える', unit: '枚', sizeName: '歯数', sizeUnit: '', min: 8, max: 80,
    role: '歯と歯がかみ合って、すべらずに回転を伝える。かみ合った2枚は逆向きに回る。',
    where: ['時計', 'ミシン', '自動車の変速機', '電動ドリル'],
    care: ['歯が欠けていないか', '油(グリース)が切れていないか', '異音がしないか'] },
  pulley: { name: 'プーリー(ベルト車)', yomi: 'ぷーりー(べるとぐるま)', cat: '回転を伝える', sizeName: '直径', sizeUnit: 'mm', min: 20, max: 200,
    role: 'ベルトをかけて、離れた軸に回転を伝える。ベルトがすべると伝わる回転が減る。',
    where: ['洗濯機', '自動車のエンジン', 'ボール盤'],
    care: ['ベルトがゆるんで、すべっていないか', 'ベルトにひびやすりへり(摩耗)がないか'] },
  sprocket: { name: 'スプロケット', yomi: 'すぷろけっと', cat: '回転を伝える', sizeName: '歯数', sizeUnit: '', min: 10, max: 60,
    role: 'チェーンとかみ合う歯をもつ車。すべらずに、離れた軸へ回転を伝える。',
    where: ['自転車', 'オートバイ'],
    care: ['歯がすりへって、先がとがっていないか', 'さびや油切れがないか', 'かけたチェーンがたるんでいないか'] },
  belt: { name: '平ベルト', yomi: 'ひらべると', cat: '回転を伝える',
    role: '2つのプーリーにかけて回転を伝える。ふつうにかけると同じ向き、十字にかけると逆向きに回る。断面がV字のVベルトは、みぞにはまってすべりにくい。',
    where: ['洗濯機', 'ボール盤', '農業機械'], care: ['張りがゆるすぎたり強すぎたりしないか', 'ひび割れがないか'] },
  chain: { name: 'チェーン(ローラチェーン)', yomi: 'ちぇーん(ろーらちぇーん)', cat: '回転を伝える',
    role: '2つのスプロケットにかけて、すべらずに回転を伝える。両方とも同じ向きに回る。',
    where: ['自転車', 'オートバイ'], care: ['たるみが10〜20mmか', '油が切れていないか', 'さびていないか'] },
  shaft: { name: '軸', yomi: 'じく', cat: '支える・つなぐ',
    role: '歯車やプーリーを固定して回転を伝える棒。同じ軸に付いた部品は同じ速さ・同じ向きに回る。',
    where: ['すべての回転する機械'], care: ['曲がっていないか', 'ガタつきがないか'] },
  bearing: { name: '軸受(ベアリング)', yomi: 'じくうけ(べありんぐ)', cat: '支える・つなぐ',
    role: '回転する軸を支え、摩擦(まさつ)を小さくする。玉などが転がる「転がり軸受」(玉軸受=ボールベアリングなど)と、軸が面の上をすべる「滑り(すべり)軸受」がある。',

/* ---------- 保存 ---------- */
function loadSave() {
  var d = null;
  try { d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { d = null; }
  d = d && typeof d === 'object' ? d : {};
  if (d.sound == null) d.sound = false;   // 授業で一斉に鳴らないよう、最初は音なし
  if (!d.train || M.checkTrain(d.train).length) d.train = clone(DEF_TRAIN);
  if (!d.conv || typeof d.conv !== 'object') d.conv = {};
  // こわれた値(文字・範囲の外)は初期値にもどす(ファイルを読みこむときと同じ確かめ方)
  Object.keys(CONV_DEF).forEach(function (k) { d.conv[k] = (d.conv[k] && convParamsOk(k, d.conv[k])) || clone(CONV_DEF[k]); });
  if (d.mech != null && !CONV_DEF[d.mech]) delete d.mech;
  d.tasks = d.tasks || {};
  d.tt = d.tt || {};
  d.tc = d.tc || {};
  if (!SPEEDS.some(function (x) { return x[0] === d.speed; })) d.speed = 1;
  d.loss = !!d.loss;
  d.refl = Object.assign({ q1: '', q2: '', q3: '' }, d.refl && typeof d.refl === 'object' ? d.refl : {});
  return d;
}

/* ---------- 回転を伝える: 操作 ---------- */
function allowedLink(type) {
  var tk = curTask();
  if (!tk || tk.kind !== 'train') return true;
  return tk.links.indexOf(type) >= 0;
}
function stockOf(kind) {
  var tk = curTask();
  if (!tk || tk.kind !== 'train') return null;
  return tk.stock[kind] || [];
}
function hasKind(kind) { var st = stockOf(kind); return !st || st.length > 0; }
function defSize(kind, prev, coax) {
  var st = stockOf(kind);
  if (st) {
    if (coax) return st[0];
    var cand = st.filter(function (x) { return !prev || x !== prev.size; });
    return cand[Math.floor(cand.length / 2)] || st[0];
  }
  if (coax) return { gear: 12, pulley: 40, sprocket: 14 }[kind];
  if (!prev || prev.kind !== kind) return { gear: 20, pulley: 80, sprocket: 20 }[kind];
  var r = KIND_RANGE[kind], s = prev.size * 2 <= r[1] ? prev.size * 2 : Math.round(prev.size / 2);
  if (kind === 'pulley') s = Math.round(s / 5) * 5;
  return clamp(s, r[0], r[1]);
}
/* つなぎ方を足せるか: {ok, plan:'direct'|'convert'|'auto', why} */
function addPlan(type) {
  var T = S.train, n = T.wheels.length, last = T.wheels[n - 1], lastLink = T.links[n - 2];
  if (!allowedLink(type)) return { ok: false, why: 'この課題では使えない' };
  if (type === 'shaft') {
    if (lastLink === 'shaft') return { ok: false, why: 'もう2枚重ねてある' };
    if (n + 1 > MAXW) return { ok: false, why: '部品は' + MAXW + 'こまで' };
    return { ok: true, plan: 'direct' };
  }
  var need = LINKS[type].kind;
  if (!hasKind(need)) return { ok: false, why: 'この課題では使えない' };
  if (n + 1 > MAXW) return { ok: false, why: '部品は' + MAXW + 'こまで' };
  if (last.kind === need) return { ok: true, plan: 'direct' };
  if (lastLink === 'shaft') return { ok: true, plan: 'convert' };
  if (!allowedLink('shaft')) return { ok: false, why: kindName(need) + 'が必要' };
  if (n + 2 > MAXW) return { ok: false, why: '部品は' + MAXW + 'こまで' };
  return { ok: true, plan: 'auto' };
}
function addLink(type) {
  var p = addPlan(type), T = S.train;
  if (!p.ok) { beep('err'); say('⚠ ' + p.why + '。', 'err'); return; }
  pushUndo();
  var last = T.wheels[T.wheels.length - 1], note = '';
  if (type === 'shaft') {
    T.wheels.push(W(last.kind, defSize(last.kind, last, true))); T.links.push('shaft');
    note = '同じ軸に' + kindName(last.kind) + 'を重ねた(2段)。重ねた部品は同じ速さ・同じ向きで回る。次に、これに別の部品をつなごう。';
  } else {
    var need = LINKS[type].kind;
    if (p.plan === 'convert') { last.kind = need; last.size = defSize(need, null, true); note = '重ねた部品を' + kindName(need) + 'に変えて、'; }
    if (p.plan === 'auto') { T.wheels.push(W(need, defSize(need, null, true))); T.links.push('shaft'); last = T.wheels[T.wheels.length - 1]; note = '同じ軸に' + kindName(need) + 'を付けてから、'; }
    else last = T.wheels[T.wheels.length - 1];
    T.wheels.push(W(need, defSize(need, last, false))); T.links.push(type);
    note += LINKS[type].name + 'でつないだ。' + ({ mesh: 'かみ合った歯車は逆向きに回る。', belt: 'ふつうに掛けたベルトは同じ向きに回る。', cross: '十字に掛けたベルトは逆向きに回る。', chain: 'チェーンは同じ向きに、すべらずに回る。' })[type];
  }
  S.sel = T.wheels.length - 1;
  beep('add'); changed(); say('✔ ' + note);
}
function removeLast() {
  var T = S.train;
  if (T.wheels.length <= 1) { beep('err'); say('⚠ 入力(モーター)の部品は取れない。大きさは変えられるよ。', 'err'); return; }
  pushUndo();
  T.wheels.pop(); T.links.pop();   // 2段の途中(同じ軸に重ねたところ)で終わってもよい
  S.sel = Math.min(S.sel, T.wheels.length - 1);
  beep('del'); changed(); say('最後の部品を取った。「↩ もどす」で元にもどせる。');
}
function resetTrain() {
  var tk = curTask();
  var t = tk ? clone(tk.start) : { wheels: [W('gear', 20)], links: [] };
  pushUndo();
  S.train.wheels = t.wheels; S.train.links = t.links; S.sel = 0; S.A = 0;
  beep('del'); changed(); say((tk ? '最初からにした。' : 'ぜんぶ消した。') + '「↩ もどす」で元にもどせる。左から部品を足そう。');
}
function loadSample(i) {
  var t = clone(SAMPLES[i].t);
  pushUndo();
  S.train.wheels = t.wheels; S.train.links = t.links; S.sel = -1; S.A = 0;
  beep('add'); changed(); say('見本「' + SAMPLES[i].name + '」を出した。部品をタップして大きさを変えてみよう。(前の形には「↩ もどす」でもどせる)');
}
function setSize(i, v) {
  var w = S.train.wheels[i]; if (!w) return;
  var r = KIND_RANGE[w.kind], nv = clamp(Math.round(v), r[0], r[1]);

}
/* ---------- ↩ もどす(1手ずつ) ---------- */
function pushUndo() {
  var isT = S.view === 'build';
  S.undo.push({ view: S.view, task: S.task, mech: S.mech, data: clone(isT ? S.train : S.cp) });
  if (S.undo.length > 40) S.undo.shift();
}
function canUndo() {
  var u = S.undo[S.undo.length - 1];
  return !!u && u.view === S.view && u.task === S.task && (S.view === 'build' || u.mech === S.mech);
}
function undo() {
  if (!canUndo()) { S.undo = []; beep('err'); say('⚠ もどせる操作がない。', 'err'); return; }
  var u = S.undo.pop();
  if (S.view === 'build') { S.train.wheels = u.data.wheels; S.train.links = u.data.links; S.sel = Math.min(S.sel, S.train.wheels.length - 1); }
  else { Object.keys(S.cp).forEach(function (k) { delete S.cp[k]; }); Object.assign(S.cp, u.data); convReset(); }

}
/* 消す前の確認 */
function confirmErase(act) {

function changed() {

function trainSol() { var tk = curTask(); return M.solveTrain(S.train, { loss: tk ? !!tk.loss : S.save.loss }); }

/* 課題の判定 */
function taskState() {
  var tk = curTask(); if (!tk) return null;
  var arg = tk.kind === 'train' ? trainSol() : S.cp;
  var res = tk.checks.map(function (c) { return { t: c.t, ok: !!c.f(arg) }; });
  return { tk: tk, res: res, all: res.every(function (r) { return r.ok; }), sol: tk.kind === 'train' ? arg : null };
}
function checkTask() {
  var st = taskState(); if (!st) return;
  if (!st.all) { S.cleared = false; return; }
  if (S.cleared) return;
  S.cleared = true;
  var tk = st.tk, stars = 3;
  if (tk.kind === 'train' && st.sol.wheels.length > tk.best) stars = 2;
  var prev = S.save.tasks[tk.id] || 0;
  S.save.tasks[tk.id] = Math.max(prev, stars); persist();
  beep('ok'); say('🎉 クリア! ' + tk.title, 'ok');
  setTimeout(function () {
    if (S.task !== tk.id) return;
    modal('<div class="e3-big">🎉</div><h2 style="text-align:center">クリア!「' + esc(tk.title) + '」</h2>' +
      '<p style="text-align:center;font-size:calc(24px * var(--ea-fs, 1));color:#e8a200;margin:0">' + '★★★'.slice(0, stars) + '<span style="color:#ccc">' + '★★★'.slice(stars) + '</span></p>' +
      (stars < 3 ? '<div class="e3-reason tip">もっと少ない部品(' + tk.best + 'こ)でもできるよ。' + (tk.more || '') + 'チャレンジしてみよう。</div>' : '') +
      '<div class="e3-reason good"><b>わかったこと</b><br>' + tk.learn + '</div>' +
      '<div class="acts"><button class="e3-btn" data-act="close">とじる</button><button class="e3-btn primary" data-act="nexttask">次の課題へ ▶</button></div>');
  }, 450);
}

/* ---------- 右パネル ---------- */
function stepper(act, val, unit, steps) {

  h += '<span class="val">' + val + '<small style="font-size:calc(13px * var(--ea-fs, 1))">' + unit + '</small></span>';
  steps.forEach(function (s) { if (s > 0) h += '<button class="e3-btn" data-act="' + act + '" data-d="' + s + '" aria-label="+' + s + '">+' + s + '</button>'; });
  return h + '</div>';
}

    case 'selprev': S.sel = (S.sel - 1 + S.train.wheels.length) % S.train.wheels.length; beep('tap'); renderSide(); return;
    case 'selnext': S.sel = (S.sel + 1) % S.train.wheels.length; beep('tap'); renderSide(); return;
    case 'play': S.playing = !S.playing; stopSpin();
    if (S.view === 'conv' && S.mech === 'screw' && S.conv.s >= 50 && S.playing) { S.conv.s = 0; } renderBar(); return;
    case 'speed': S.save.speed = +t.getAttribute('data-v'); persist(); renderBar(); return;
    case 'turn1': S.playing = false; S.spinTo = { left: TAU }; renderBar(); return;
    case 'zero': S.A = 0; stopSpin(); if (S.view === 'conv') { convReset(); } beep('tap'); return;
    case 'loss': S.save.loss = !S.save.loss; persist(); renderBar(); renderSide(); return;
    case 'wiper': S.cp.wiper = !S.cp.wiper; persist(); renderBar(); return;
    case 'mech':
      var tkm = curTask(), mid = t.getAttribute('data-id');
      if (tkm && tkm.mech !== mid) { beep('err'); say('⚠ この課題では「' + mechById(tkm.mech).name + '」を使う。ほかのしくみは「🔄 運動を変える」で試せるよ。', 'err'); return; }
      setMech(mid); return;
    case 'cp': convParam(t.getAttribute('data-k'), +t.getAttribute('data-d'), +t.getAttribute('data-lo'), +t.getAttribute('data-hi')); return;
    case 'camtype': if (S.cp.type !== t.getAttribute('data-v')) pushUndo(); S.cp.type = t.getAttribute('data-v'); beep('tap'); changed(); return;
    case 'lpre': pushUndo(); Object.assign(S.cp, LINK_PRESETS[+t.getAttribute('data-i')].v); S.conv.prevB = null; S.conv.mode = 0; S.conv.trail = null; S.conv.th = 0; S.conv.dir = 1; S.conv.dPhi = 0; beep('tap'); changed(); return;
    case 'sp': if (S.cp.p !== +t.getAttribute('data-v')) pushUndo(); S.cp.p = +t.getAttribute('data-v'); S.conv.s = 0; S.conv.th = 0; S.conv.turns = 0; beep('tap'); changed(); return;
    case 'sn': if (S.cp.n !== +t.getAttribute('data-v')) pushUndo(); S.cp.n = +t.getAttribute('data-v'); S.conv.s = 0; S.conv.th = 0; S.conv.turns = 0; beep('tap'); changed(); return;
    case 'task': beep('tap'); openTask(t.getAttribute('data-id')); return;
    case 'taskreset':
      closeModal();
      var tk = curTask(); if (!tk) return;
      if (tk.kind === 'train') resetTrain();
      else { pushUndo(); Object.keys(S.cp).forEach(function (k) { delete S.cp[k]; }); Object.assign(S.cp, clone(CONV_DEF[tk.mech])); if (tk.id === 'wiper') S.cp.wiper = true; convReset(); beep('del'); changed(); say('最初からにした。「↩ もどす」で元にもどせる。'); }
      return;
    case 'hint':
      var tk2 = curTask(); if (!tk2) return;
      var hs = tk2.hints, hn = Math.min(S.hintN, hs.length - 1);
      beep('tap'); say('💡 ヒント ' + (hn + 1) + '/' + hs.length + ': ' + hs[hn] + (hn < hs.length - 1 ? '<br><small>(もう一度押すと、もっとくわしいヒント)</small>' : ''), 'task');
      S.hintN = hn + 1; return;
    case 'nexttask':
      closeModal();
      var idx = TASKS.indexOf(curTask()), nx = null;
      for (var i = 1; i <= TASKS.length; i++) { var cand = TASKS[(idx + i) % TASKS.length]; if (!S.save.tasks[cand.id]) { nx = cand; break; } }
      if (nx) openTask(nx.id); else openView('tasks');
      return;
    case 'qans': quizAnswer(+t.getAttribute('data-i')); return;
    case 'qnext': quizNext(); return;
    case 'qagain': closeModal(); newQuiz(); buildShell(); render(); return;
    case 'peek': S.quiz.qs[S.quiz.i].peek = true; beep('tap'); renderSide(); return;
    case 'tobuild': closeModal(); openView('build'); return;
  }
}
function stopSpin() { S.spinTo = null; }

/* ---------- 入力(キャンバス: タップで選ぶ・なぞって回す) ---------- */
function cvPoint(ev) { var r = S.el.cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
function hitWheel(p) {
  var P = S.trainP || [], best = -1, br = Infinity;
  P.forEach(function (q) { var d = Math.hypot(p.x - q.x, p.y - q.y); if (d <= q.r + 8 && q.r < br) { best = q.i; br = q.r; } });
  return best;
}
function bindCanvas() {
  var cv = S.el.cv;
  cv.addEventListener('pointerdown', function (ev) {
    var p = cvPoint(ev), D = { id: ev.pointerId, x0: p.x, y0: p.y, moved: false, wheel: -1, last: null, wasPlaying: S.playing };
    if (S.view === 'build') {
      D.wheel = hitWheel(p);
      if (D.wheel >= 0) { var q = S.trainP[D.wheel]; D.cx = q.x; D.cy = q.y; D.g = M.solveTrain(S.train).wheels[D.wheel].g; }
    } else if (S.view === 'quiz') {
      var Q = S.quiz.qs[S.quiz.i];
      if (Q.still && !Q.answered) { say('🤔 先に答えを選ぼう。答えたら動かして確かめられる。'); return; }
      if (Q.hidden && S.quizIn) { D.wheel = 0; D.cx = S.quizIn.x; D.cy = S.quizIn.y; D.g = 1; }
      else { D.wheel = hitWheel(p); if (D.wheel >= 0) { var q2 = S.trainP[D.wheel]; D.cx = q2.x; D.cy = q2.y; D.g = M.solveTrain(S.train).wheels[D.wheel].g; } }
    } else if (S.view === 'conv') {
      var o = convCenter(); D.wheel = 0; D.cx = o.x; D.cy = o.y; D.g = o.g;
    }
    D.last = Math.atan2(p.y - D.cy, p.x - D.cx);
    S.drag = D;
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
    ev.preventDefault();
  });
  cv.addEventListener('pointermove', function (ev) {
    var D = S.drag; if (!D || D.id !== ev.pointerId) return;
    var p = cvPoint(ev);
    if (!D.moved && Math.hypot(p.x - D.x0, p.y - D.y0) > 8) { D.moved = true; if (D.wheel >= 0) { S.playing = false; stopSpin(); renderBar(); } }
    if (!D.moved || D.wheel < 0) return;
    var a = Math.atan2(p.y - D.cy, p.x - D.cx), da = a - D.last;
    if (da > Math.PI) da -= TAU; if (da < -Math.PI) da += TAU;
    D.last = a;
    if (Math.hypot(p.x - D.cx, p.y - D.cy) < 6) return;
    var dA = da / (D.g || 1);
    if (S.view === 'conv') convAdvance(dA, true); else { S.A += dA; if (dA) S.spinSign = dA > 0 ? 1 : -1; }
  });
  var end = function (ev) {
    var D = S.drag; if (!D || D.id !== ev.pointerId) return;
    S.drag = null;
    if (!D.moved && S.view === 'build') {
      var w = hitWheel({ x: D.x0, y: D.y0 });
      S.sel = w; beep('tap'); renderSide();
      if (w >= 0) say(kindName(S.train.wheels[w].kind) + '(' + (w + 1) + '番)を選んだ。右で' + PARTS[S.train.wheels[w].kind].sizeName + 'を変えられる。指でなぞると手で回せる。');
    }
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('keydown', function (ev) {
    if (ev.key === ' ' || ev.key === 'Enter') { S.playing = !S.playing; renderBar(); ev.preventDefault(); }
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') { var d = ev.key === 'ArrowRight' ? 0.2 : -0.2; if (S.view === 'conv') convAdvance(d, true); else { S.A += d; S.spinSign = d > 0 ? 1 : -1; } ev.preventDefault(); }
  });
}
/* 運動を変える: 手で回す中心(入力の軸)の画面座標 */
function convCenter() {
  if (!S.fit) return { x: S.cw / 2, y: S.ch / 2, g: 1 };
  if (S.mech === 'link') return { x: tx(0), y: ty(0), g: -1 };   // 数学の向きで角度が増える(画面では反時計回り)
  if (S.mech === 'screw') return { x: tx(-12), y: ty(0), g: 1 };
  if (S.mech === 'cam') return { x: tx(0), y: ty(0), g: 1 };
  return { x: tx(0), y: ty(0), g: 1 };
}

/* ---------- アニメーション ---------- */
function frame(ts) {
  if (!S.root || !S.root.isConnected) { S.raf = 0; return; }
  S.raf = requestAnimationFrame(frame);
  var dt = S.last ? Math.min(0.05, (ts - S.last) / 1000) : 0; S.last = ts;
  if (S.view === 'tasks' || !S.el.cv) return;
  var w = TAU * S.save.speed * dt;      // モーター 1回転/秒 × 速さ
  if (S.spinTo) { var st = Math.min(S.spinTo.left, w || 0); S.spinTo.left -= st; adv(st); if (S.spinTo.left <= 1e-9) { S.spinTo = null; beep('tick'); } }
  else if (S.playing && !S.drag) adv(w);
  var c = ctx2d(); if (!c) return;
  if (S.view === 'build') drawTrain(c, S.train, S.A, { sel: S.sel });
  else if (S.view === 'quiz') drawQuiz(c);
  else drawConv(c);
  updateCounters();
}
function adv(d) { if (S.view === 'conv') convAdvance(d); else { S.A += d; if (d) S.spinSign = 1; } }
function updateCounters() {
  if (S.el.cin && S.el.cin.isConnected) {
    var turns = S.view === 'conv' ? S.conv.turns : S.A / TAU;
    S.el.cin.textContent = fmt(Math.abs(turns) < 0.05 ? 0 : Math.abs(turns), 1);   // 逆に回しても回数は正の数で
  }
  if (S.el.cout && S.el.cout.isConnected && S.view !== 'conv') {
    var showOut = S.view !== 'quiz' || S.quiz.qs[S.quiz.i].peek || S.quiz.qs[S.quiz.i].answered || !S.quiz.qs[S.quiz.i].hidden;
    if (showOut) { var g = M.solveTrain(S.train).outG, v = Math.abs(S.A / TAU * g); S.el.cout.textContent = fmt(v < 0.05 ? 0 : v, 1); }
  }
}

/* ---------- 起動 ---------- */
function mount(root) {
  S.root = root; root.classList.add('e3');
  S.save = loadSave();
  S.train = S.save.train; S.mech = S.save.mech || 'rack'; S.cp = S.save.conv[S.mech]; convReset();
  root.addEventListener('click', onClick);
  root.addEventListener('keydown', function (ev) { S.kbd = true; if (ev.key === 'Escape' && S.ov) { closeModal(); ev.preventDefault(); } });
  root.addEventListener('pointerdown', function () { S.kbd = false; }, true);
  var v = S.save.view === 'conv' || S.save.view === 'quiz' || S.save.view === 'tasks' ? S.save.view : 'build';
  openView(v);
  if (!S.save.seen) { S.save.seen = true; persist(); showHowto(true); }
  if (!S.raf) S.raf = requestAnimationFrame(frame);
}

NS.C3 = {
  mount: mount,
  _test: { S: S, TASKS: TASKS, QGEN: QGEN, openView: openView, openTask: openTask, addLink: addLink, setSize: setSize, trainSol: trainSol, taskState: taskState, applyImport: applyImport, designData: designData, setMech: setMech, convParam: convParam, undo: undo, convAdvance: convAdvance, convParamsOk: convParamsOk, changed: changed }
};
var auto = document.getElementById('e3-app');
if (auto && !auto.getAttribute('data-manual')) mount(auto);
})();
</script>
</body>
