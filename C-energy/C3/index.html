<script src="../../shared/eduit-frame.js"></script>
<style>
html,body{margin:0;height:100%;background:#eef3f8;}
.e7{--ink:#1d2b3a;--sub:#5b6b7c;--line:#d5dee8;--accent:#1e6fd9;--ok:#1a9b5b;--ng:#d93a3a;--warn:#f08c00;
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;
  color:var(--ink);height:100%;display:flex;flex-direction:column;font-size:calc(16px * var(--ea-fs, 1));overflow:hidden;position:relative;background:#eef3f8;-webkit-tap-highlight-color:transparent;}
.e7 *{box-sizing:border-box}
.e7 button{font:inherit;touch-action:manipulation;color:inherit}
.e7 input,.e7 textarea{font:inherit}
.e7 ruby rt{font-size:.55em;font-weight:normal}
.e7-top{position:sticky;top:0;z-index:5;min-height:58px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--ef-surface,#fff);color:var(--ef-text,#1f2328);flex:none;border-bottom:3px solid var(--ef-accent,#b45309)}
.e7-top h1{font-size:calc(17px * var(--ea-fs, 1));margin:0 4px 0 0;white-space:nowrap;font-weight:bold;flex:none}
.e7-tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:4px 0}
.e7-tabs::-webkit-scrollbar{display:none}
.e7-tab{flex:none;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--ef-line,#d6d3cb);background:var(--ef-surface,#fff);font-weight:bold;cursor:pointer;white-space:nowrap;font-size:calc(15px * var(--ea-fs, 1))}
.e7-tab:hover{border-color:var(--ef-accent,#b45309)}
.e7-tab.on{background:var(--ef-accent,#b45309);border-color:var(--ef-accent,#b45309);color:var(--ef-accent-ink,#fff)}
.e7-tab.adv{border-style:dashed}
.e7-tab.adv.on{border-style:solid}
.e7-tab .ck{color:#1a9b5b;margin-left:3px}
.e7-tab.on .ck{color:#fff}
.e7-top .ef-about-btn{font-size:0;min-width:44px;min-height:44px;padding:0;flex:none}
.e7-top .ef-about-btn::before{content:"ⓘ";font-size:calc(20px * var(--ea-fs, 1))}
.e7-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 14px 40px;-webkit-overflow-scrolling:touch}
.e7-wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.e7-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start}
.e7-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.e7-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.6;min-width:0}
.e7-card h2{font-size:calc(19px * var(--ea-fs, 1));margin:0 0 6px}

.e7-card.lead{background:#fffaf0;border-color:#f1d9a6}
.e7-card.tip{background:#fff9e6;border-color:#f1e3a6}

.e7-card.adv{border-left:6px solid #5b3fa8}
.e7-kicker{display:inline-block;font-size:calc(13px * var(--ea-fs, 1));font-weight:bold;border-radius:999px;padding:1px 10px;margin-bottom:4px;background:#e4f2e5;color:#2f6f3e}

.e7-btn{min-height:46px;min-width:46px;padding:0 14px;border-radius:12px;border:2px solid transparent;background:#e3ebf5;font-weight:bold;cursor:pointer;font-size:calc(16px * var(--ea-fs, 1))}
.e7-btn:active{transform:translateY(1px)}

.e7-btn.primary{background:var(--accent);color:#fff}

.e7-btn.sm{min-height:44px;padding:0 10px;font-size:calc(15px * var(--ea-fs, 1))}
.e7-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.e7-seg{display:flex;flex-wrap:wrap;gap:6px}
.e7-seg .e7-btn{flex:1 0 auto}
.e7-ctl{margin:8px 0 10px}
.e7-ctl label{display:flex;justify-content:space-between;gap:8px;font-weight:bold;font-size:calc(15.5px * var(--ea-fs, 1))}
.e7-ctl label b{color:#b35c00;white-space:nowrap}
.e7-ctl small{display:block;color:var(--sub);font-size:calc(13px * var(--ea-fs, 1));line-height:1.45}
.e7 input[type=range]{width:100%;height:44px;accent-color:#b45309;touch-action:pan-y;margin:0}
.e7-meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.e7-m{background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:6px 8px;text-align:center;min-width:0}
.e7-m .k{font-size:calc(13px * var(--ea-fs, 1));color:var(--sub);white-space:nowrap}
.e7-m .v{font-size:calc(22px * var(--ea-fs, 1));font-weight:bold;white-space:nowrap}
.e7-m .u{font-size:calc(13px * var(--ea-fs, 1));color:var(--sub);margin-left:2px}
.e7-m.hi{background:#fff4e0;border-color:#f6c37a}
.e7-svg{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none}

.e7-msg{min-height:44px;padding:8px 12px;border-radius:10px;background:#fffbe6;border:1px solid #f1e3a6;line-height:1.5}
.e7-msg.ok{background:#e6f8ee;border-color:#a8e0c0}
.e7-msg.ng{background:#ffe8e8;border-color:#f5b5b5}
.e7-tbl{width:100%;border-collapse:collapse;font-size:calc(14.5px * var(--ea-fs, 1));background:#fff}
.e7-tbl th,.e7-tbl td{border:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}
.e7-tbl th{background:#f3f6fa;font-size:calc(13.5px * var(--ea-fs, 1))}
.e7-tbl td.diff{background:#fff1c9;font-weight:bold}
.e7-tbl tr.best td{background:#e6f8ee}
.e7-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.e7-mis{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;background:#f8fbff}

.e7-rank{list-style:none;margin:0;padding:0;counter-reset:r}
.e7-rank li{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid #edf1f5;counter-increment:r;font-size:calc(15px * var(--ea-fs, 1))}
.e7-rank li::before{content:counter(r);width:28px;height:28px;border-radius:50%;background:#e3ebf5;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;flex:none}
.e7-rank li:nth-child(1)::before{background:#ffd43b}
.e7-rank li:nth-child(2)::before{background:#dee2e6}
.e7-rank li:nth-child(3)::before{background:#f4c095}
.e7-rank li .p{margin-left:auto;font-weight:bold;white-space:nowrap}
.e7-rank li.me{background:#fff4e0}
.e7-q{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0;background:#fbfdff}
.e7-q .opts{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}
.e7-q .opts .e7-btn{text-align:left;font-weight:normal;background:#fff;border-color:var(--line);line-height:1.4;padding:6px 12px}
.e7-q .opts .e7-btn.right{background:#d3f5e1;border-color:#40c057;font-weight:bold}
.e7-q .opts .e7-btn.wrong{background:#ffe3e3;border-color:#f08080}
.e7-q .why{margin-top:6px;font-size:calc(14.5px * var(--ea-fs, 1));color:#33475b}
.e7-chips{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.e7-chip{min-height:46px;padding:4px 12px;border-radius:12px;border:2px solid #c9d6e4;background:#fff;cursor:pointer;font-weight:bold;line-height:1.3;text-align:left}
.e7-chip.used{opacity:.3;cursor:default}
.e7-chip.bad{animation:e7shake .35s;border-color:#f08080;background:#ffe3e3}
@keyframes e7shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.e7-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:58px;padding:6px;border:2px dashed #c9d6e4;border-radius:12px;background:#fbfdff}
.e7-flow .st{border-radius:12px;padding:6px 10px;background:#fff4e0;border:2px solid #f6c37a;font-weight:bold;line-height:1.3}
.e7-flow .st.el{background:#fff9c4;border-color:#f0c419}
.e7-flow .ar{color:#b35c00;font-weight:bold}
.e7-flow .ph{color:var(--sub)}
.e7-meth{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.e7-meth .e7-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;line-height:1.2;padding:4px}
.e7-meth .e7-btn .i{font-size:calc(24px * var(--ea-fs, 1))}
.e7-feat{font-size:calc(19px * var(--ea-fs, 1));font-weight:bold;min-height:64px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;border-radius:12px;background:#f3f7fc;border:2px solid var(--line)}
.e7-days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.e7-days .e7-btn{min-height:58px;line-height:1.25}
.e7-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:calc(14px * var(--ea-fs, 1))}
.e7-leg i{display:inline-block;width:18px;height:6px;border-radius:3px;vertical-align:middle;margin-right:4px}
.e7-field{display:flex;flex-direction:column;gap:3px;margin:10px 0}
.e7-field label{font-weight:bold}
.e7-field small{color:var(--sub);font-size:calc(13.5px * var(--ea-fs, 1))}
.e7 textarea,.e7 input[type=text]{min-height:44px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:calc(16px * var(--ea-fs, 1));background:#fbfdff;color:var(--ink);width:100%}
.e7 textarea{min-height:84px;resize:vertical;line-height:1.5}
.e7-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.e7-sum{list-style:none;padding:0;margin:0}
.e7-sum li{padding:5px 0;border-bottom:1px solid #edf1f5;display:flex;gap:8px}
.e7-sum li .m{flex:none;width:26px;text-align:center}
.e7-toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:#1d2b3a;color:#fff;padding:10px 18px;border-radius:10px;z-index:30;display:none;max-width:90%;text-align:center}
.e7-start{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.e7-go{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#f8fbff;cursor:pointer;min-height:70px;line-height:1.4}
.e7-go:hover{border-color:#b45309}
.e7-go .i{font-size:calc(28px * var(--ea-fs, 1));flex:none}
.e7-go b{display:block;font-size:calc(17px * var(--ea-fs, 1))}
.e7-go small{color:var(--sub);font-size:calc(13.5px * var(--ea-fs, 1))}
.e7-go.adv{border-style:dashed}
@media (prefers-reduced-motion: reduce){.e7-chip.bad{animation:none}}
@media (max-width:1000px){
  .e7-grid{grid-template-columns:minmax(0,1fr)}
  .e7-meth{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px){
  .e7-top h1 .lg{display:none}
  .e7-grid3,.e7-start,.e7-two{grid-template-columns:minmax(0,1fr)}
  .e7-days{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .e7-top{padding:0 6px}
  .e7-body{padding:10px 10px 40px}
  .e7-card{padding:10px}
  .e7-meters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .e7-m .v{font-size:calc(19px * var(--ea-fs, 1))}
  .e7-meth{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* C3 だけの部品 */
.e7-led{transition:none}
.e7-node{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;min-width:104px;min-height:88px;border:2px dashed #c9d6e4;border-radius:12px;background:#fbfdff;padding:4px;line-height:1.25;font-weight:bold;font-size:calc(14px * var(--ea-fs, 1))}
.e7-node .i{font-size:calc(26px * var(--ea-fs, 1))}
.e7-node.set{border-style:solid;border-color:#f6c37a;background:#fff4e0}
.e7-node.next{border-color:#b45309;box-shadow:0 0 0 3px #fbeedd}
.e7-node small{font-weight:normal;color:#5b6b7c;font-size:calc(12.5px * var(--ea-fs, 1))}
.e7-chain{display:flex;align-items:center;gap:4px;min-width:max-content;padding:4px 2px}
.e7-chain .ar{color:#b35c00;font-weight:bold;font-size:calc(20px * var(--ea-fs, 1))}
.e7-houses{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;max-width:420px}
.e7-houses i{display:block;aspect-ratio:1;border-radius:2px;background:#dee2e6}
.e7-houses i.on{background:#ffd43b;box-shadow:0 0 4px #ffd43b}
.e7-bar{height:26px;border-radius:8px;overflow:hidden;display:flex;background:#f1f3f5;border:1px solid var(--line)}
.e7-bar span{display:flex;align-items:center;justify-content:center;font-size:calc(13px * var(--ea-fs, 1));font-weight:bold;white-space:nowrap;overflow:hidden}
.e7-big{font-size:calc(24px * var(--ea-fs, 1));font-weight:bold}
.e7-dq input{width:9em!important;display:inline-block;margin:0 6px}
.e7-form{background:#f3f7fc;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:calc(17px * var(--ea-fs, 1));font-weight:bold;text-align:center}
</style>

<body>
<div id="e7-app" class="e7"></div>
<script>
/* ===================================================================
   C3 直流・交流と送電ラボ — window.EnergyApps.C3
   教科書 3編1章3「電気を供給する仕組み」(直流と交流・変圧器・送電と配電・50Hz/60Hz)
   数値は、しくみが分かるように理想化・単純化した目安(送電線の抵抗・送る電力など)。
   =================================================================== */
(function () {
'use strict';
var NS = window.EnergyApps = window.EnergyApps || {};
var STORE_KEY = 'energyApps.C3.v1';

/* ---------- 小道具 ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function rb(w, r) { return '<ruby>' + w + '<rt>' + r + '</rt></ruby>'; }
function fkOn() { return !(window.EduitFrame && window.EduitFrame.furikaeri === false); }
function num(n) { return n.toLocaleString('ja-JP'); }
function fV(v) { return v >= 10000 ? (v % 10000 === 0 ? num(v / 10000) + '万' : num(Math.floor(v / 10000)) + '万' + num(v % 10000)) + ' V' : num(v) + ' V'; }
function fPow(w) { if (w >= 1000) return (w / 1000 >= 100 ? Math.round(w / 1000) : +(w / 1000).toFixed(w / 1000 >= 10 ? 1 : 2)) + ' kW'; return (w >= 10 ? Math.round(w) : +w.toFixed(2)) + ' W'; }
function fA(a) { return (a >= 10 ? +a.toFixed(1) : +a.toFixed(3)) + ' A'; }

/* ---------- 保存 ---------- */
var S = { root: null, tab: 'intro', save: null, el: {}, tick: null, raf: 0, last: 0 };
function blank() { return { v: 1, tab: 'intro', done: {}, seen: {}, tr: {}, calcBest: 0, refl: { q1: '', q2: '', q3: '' }, who: { cls: '', name: '' } }; }
function loadSave() {
  var s = null, b = blank();
  try { s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { s = null; }
  if (!s || typeof s !== 'object' || Array.isArray(s)) return b;
  Object.keys(b).forEach(function (k) { if (s[k] == null || typeof s[k] !== typeof b[k] || Array.isArray(s[k]) !== Array.isArray(b[k])) s[k] = b[k]; });
  return s;
}
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S.save)); } catch (e) {} }
function mark(k) { if (!S.save.done[k]) { S.save.done[k] = 1; persist(); renderTabs(); } }

/* ---------- タブ ---------- */
var TABS = [
  { id: 'intro', lg: '🏁 はじめに' },
  { id: 'dcac', lg: '① 直流と交流', steps: ['dcac', 'sort'] },
  { id: 'route', lg: '② 送電・配電の道すじ', steps: ['route', 'mesh'] },
  { id: 'why', lg: '③ 高い電圧で送るわけ', steps: ['trans', 'line'] },
  { id: 'freq', lg: '④ 周波数 50Hz・60Hz', steps: ['freq'] },
  { id: 'calc', lg: '⑤ 損失の計算', adv: 1, steps: ['calcq'] },
  { id: 'refl', lg: '✏️ 振り返り', reflect: 1 },
  { id: 'rec', lg: '💾 記録' }
];
var STEPS = [
  { id: 'dcac', name: '① 直流と交流のグラフを両方見た' }, { id: 'sort', name: '① 電池・コンセント分けを全部正解' },
  { id: 'route', name: '② 発電所から家庭までの道すじを完成' }, { id: 'mesh', name: '② 送電線が1本切れても届くことを確かめた' },
  { id: 'trans', name: '③ 変圧器で電圧を上げた・下げた' }, { id: 'line', name: '③ 送電の損失を 1% 以下にした' },
  { id: 'freq', name: '④ 50Hz・60Hz の地図を完成' }, { id: 'calcq', name: '⑤ 損失の計算 5問中4問以上正解' }
];
function stepDone(id) { return !!S.save.done[id]; }
function tabDone(t) { return t.steps ? t.steps.every(stepDone) : false; }
function efSlot() { return NS.embedded || !window.EduitFrame ? '' : '<span data-ef-about></span>'; }
function renderTabs() {
  var nav = S.el.tabs; if (!nav) return;
  nav.innerHTML = TABS.map(function (t) {
    var on = S.tab === t.id;
    return '<button class="e7-tab' + (t.adv ? ' adv' : '') + (on ? ' on' : '') + '" data-tab="' + t.id + '"' + (on ? ' aria-current="page"' : '') + (t.reflect ? ' data-ef-reflect' : '') + (t.adv ? ' title="発展編"' : '') + '>' + t.lg + (tabDone(t) ? '<span class="ck">✓</span>' : '') + '</button>';
  }).join('');
}
function go(tab) {
  if (tab === 'refl' && !fkOn()) tab = 'intro';
  S.tab = tab; S.save.tab = tab; persist();
  S.tick = null;
  renderTabs(); renderBody();
  S.el.body.scrollTop = 0;
}
function toast(m) {
  var t = S.el.toast; t.textContent = m; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 2800);
}
function frame(ts) {
  S.raf = requestAnimationFrame(frame);
  if (!S.root || S.root.offsetParent === null) { S.last = 0; return; }
  var dt = S.last ? Math.min(0.05, (ts - S.last) / 1000) : 0; S.last = ts;
  if (S.tick) { try { S.tick(dt); } catch (e) { S.tick = null; if (window.console) console.error(e); } }
}
function refs(box) { var el = {}; box.querySelectorAll('[data-ref]').forEach(function (x) { el[x.getAttribute('data-ref')] = x; }); return el; }

/* ================= はじめに ================= */
