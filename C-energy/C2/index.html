<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C2 電気回路ラボ</title>
<!-- 共通の枠(4分野共通の色・ヘッダー・作成者・安全と個人情報・ライセンス・更新履歴)。統合版では build.py が中に入れる -->
<link rel="stylesheet" href="../../shared/eduit-frame.css">
<script src="../eduit-info.js"></script>
<script data-ef-app>EDUIT_INFO.app = { name: 'C2 電気回路ラボ' };</script>
<script src="../../shared/eduit-frame.js"></script>
<style>
html,body{margin:0;height:100%;background:#eef3f8;}
.e2{--ink:#1d2b3a;--sub:#5b6b7c;--line:#d5dee8;--accent:#1e6fd9;--ok:#1a9b5b;--ng:#d93a3a;--warn:#f08c00;
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;
  color:var(--ink);height:100%;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;
  font-size:16px;overflow:hidden;position:relative;background:#eef3f8;-webkit-tap-highlight-color:transparent;}
.e2 *{box-sizing:border-box}
.e2 button{font:inherit;touch-action:manipulation}
.e2-top{height:62px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--ef-surface,#fff);color:var(--ef-text,#1f2328);flex:none;border-bottom:3px solid var(--ef-accent,#b45309)}
.e2-top .e2-btn{white-space:nowrap}
.e2-top .sh{display:none}
.e2-top h1{font-size:17px;margin:0 6px 0 0;white-space:nowrap;font-weight:bold}
.e2-stitle{flex:1;font-size:16px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:6px}
.e2-btn{min-height:46px;min-width:46px;padding:0 14px;border-radius:12px;border:2px solid transparent;background:#e3ebf5;color:var(--ink);font-weight:bold;cursor:pointer;font-size:16px}
.e2-btn:active{transform:translateY(1px)}
.e2-btn:disabled{opacity:.4;cursor:default}
.e2-top .e2-btn{background:var(--ef-surface,#fff);color:var(--ef-text,#1f2328);border:1px solid var(--ef-line,#d6d3cb);border-radius:999px;padding:0 12px}
.e2-top .e2-btn:hover{border-color:var(--ef-accent,#b45309)}
.e2-top .e2-btn.on{background:var(--ef-accent,#b45309);border-color:var(--ef-accent,#b45309);color:var(--ef-accent-ink,#fff)}
.e2-top h1{color:var(--ef-text,#1f2328)}
.e2-top .ef-about-btn{font-size:0;min-width:44px;min-height:44px;padding:0;flex:none}
.e2-top .ef-about-btn::before{content:"ⓘ";font-size:20px}
.e2-btn.primary{background:var(--accent);color:#fff}
.e2-btn.danger{background:#fde2e2;color:#a61e1e}
.e2-btn.good{background:#d3f5e1;color:#0d6b3a}
.e2-btn.big{min-height:56px;font-size:18px;width:100%}
.e2-btn.sm{min-height:44px;padding:0 12px;font-size:15px}
.e2-btn.on{background:#1d3557;color:#fff}
.e2-main{flex:1;display:flex;min-height:0}
.e2-pal{width:206px;flex:none;overflow-y:auto;overflow-x:hidden;padding:8px;background:#fff;border-right:1px solid var(--line)}
.e2-pal h2,.e2-side h2{font-size:15px;margin:6px 2px 6px;color:var(--sub)}
.e2-tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.e2-tool{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;border:2px solid var(--line);background:#f8fbff;cursor:pointer;min-height:60px;font-size:14px;font-weight:bold;padding:2px;touch-action:pan-y;word-break:keep-all;text-align:center;line-height:1.2}
.e2-tool .ic{font-size:22px;line-height:26px}
.e2-palgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.e2-pi{position:relative;display:flex;flex-direction:column;align-items:center;padding:3px 2px 4px;border-radius:12px;border:2px solid var(--line);background:#f8fbff;touch-action:pan-y;cursor:pointer;min-height:84px;text-align:center}
.e2-pi svg{width:100%;max-width:84px;height:38px;pointer-events:none}
.e2-pi .nm{font-weight:bold;font-size:14px;line-height:1.2}
.e2-pi .sb{font-size:13px;color:var(--sub);line-height:1.3}
.e2-pi .left{font-size:13px;color:#1d3557;font-weight:bold}
.e2-pi.sel,.e2-tool.sel{border-color:var(--accent);background:#dcebff;box-shadow:0 0 0 3px #9cc3ff}
.e2-pi.empty{opacity:.38}
.e2-pi .e2-ltr{font-size:26px}
.e2-pi .e2-plus{font-size:24px}
.e2-center{flex:1;display:flex;flex-direction:column;min-width:0}
.e2-msg{min-height:46px;padding:10px 14px;font-size:16px;background:#fffbe6;border-bottom:1px solid #f1e3a6;line-height:1.4}
.e2-msg.err{background:#ffe8e8;border-color:#f5b5b5;color:#8a1414}
.e2-msg.ok{background:#e6f8ee;border-color:#a8e0c0}
.e2-bar{display:flex;gap:6px;padding:6px 8px;background:#f6f9fc;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.e2-bar .sp{flex:1}
.e2-chk{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border-radius:10px;background:#e3ebf5;font-weight:bold;font-size:15px;cursor:pointer;white-space:nowrap}
.e2-bar .e2-btn{white-space:nowrap}
.e2-bar .e2-clr{margin-left:14px}
.e2-chk.on{background:#1d3557;color:#fff}
.e2-boardbox{flex:1;min-height:0;position:relative}
.e2-board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
.e2-dot{fill:#c3cfdb}
.e2-dot.used{fill:#556677}
.e2-jn{fill:#1d2b3a}
.e2-slot{stroke:#e1e8ef;stroke-width:3;stroke-dasharray:4 7;stroke-linecap:round}
.e2-placing .e2-slot{stroke:#9cc3ff;stroke-width:4}
.e2-slot.drop{stroke:var(--accent)!important;stroke-width:10!important;stroke-dasharray:none;opacity:.6}
.e2-cur{stroke:#f08c00;stroke-width:14;stroke-linecap:round;opacity:.45;fill:none}
.e2-selhl{stroke:#1e6fd9;stroke-width:26;stroke-linecap:round;opacity:.22}
.e2-w{stroke:#34495e;stroke-width:5;stroke-linecap:round;fill:none}
.e2-s{stroke:#1d2b3a;stroke-width:3;fill:#fff}
.e2-flow{fill:none;stroke:#ffd43b;stroke-width:6;stroke-linecap:round;stroke-dasharray:0.1 15.9;animation:e2dash linear infinite;pointer-events:none}
@keyframes e2dash{to{stroke-dashoffset:-16}}
.e2-fixed .e2-s{fill:#f4f6f8}
.e2-lbl{font-size:17px;font-weight:bold;fill:#1d3557;paint-order:stroke;stroke:#fff;stroke-width:4px;pointer-events:none}
.e2-num{font-size:16px;font-weight:bold;fill:#b35c00;paint-order:stroke;stroke:#fff;stroke-width:4px;pointer-events:none}
.e2-ltr{font-size:18px;font-weight:bold;fill:#1d2b3a;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.e2-plus{font-size:18px;font-weight:bold;fill:#c92a2a;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.e2-read{font-size:18px;font-weight:bold;pointer-events:none}
.e2-readbox{fill:#10202f;rx:6}
.e2-emo{font-size:22px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.e2-boom{animation:e2boom 1.4s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes e2boom{0%{transform:scale(.2);opacity:1}30%{transform:scale(1.6);opacity:1}100%{transform:scale(1.2);opacity:0}}
.e2-hot{animation:e2hot .6s ease-in-out infinite alternate}
@keyframes e2hot{from{opacity:.25}to{opacity:.85}}
.e2-spin{animation:e2spin linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes e2spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.e2-flow,.e2-spin,.e2-hot,.e2-heat{animation:none!important}}
.e2-side{width:282px;flex:none;overflow-y:auto;padding:10px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.e2-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbfdff;font-size:15px;line-height:1.55}
.e2-card.okc{background:#ecfaf1;border-color:#a8dcbc}
.e2-note{font-size:13.5px;color:#4a5a6a}
.e2 ruby{ruby-align:center}
.e2 rt{font-size:.6em;font-weight:normal;letter-spacing:-.02em}
.e2-card .ttl{font-size:17px;font-weight:bold;margin-bottom:4px}
.e2-card.warn{background:#fff1f1;border-color:#f3b4b4}
.e2-card.goal{background:#f2fbf5;border-color:#a8dcbc}
.e2-card.tip{background:#fff9e6;border-color:#f1e3a6}
.e2-goal{display:flex;gap:6px;align-items:flex-start;margin:5px 0;font-size:15px}
.e2-goal .m{flex:none;width:24px;text-align:center;font-size:17px}
.e2-goal.ok{color:#0d6b3a;font-weight:bold}
.e2-kv{width:100%;border-collapse:collapse;font-size:15px}
.e2-kv td{padding:3px 2px;border-bottom:1px solid #edf1f5}
.e2-kv td:last-child{text-align:right;font-weight:bold;font-size:16px;white-space:nowrap;padding-left:6px}
.e2-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.e2-row .e2-btn{flex:1}
.e2-vals{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.e2-vals .e2-btn{flex:1 0 28%;min-height:46px;padding:0 4px;font-size:15px}
.e2-warnli{margin:5px 0;padding-left:4px;border-left:4px solid var(--ng);padding:3px 0 3px 8px}
.e2-warnli.y{border-color:var(--warn)}
.e2-gauge{height:12px;background:#e6ecf2;border-radius:6px;overflow:hidden;margin-top:3px}
.e2-gauge>i{display:block;height:100%;background:#f0b400;border-radius:6px}
.e2-ghost{position:absolute;pointer-events:none;transform:translate(-50%,-50%);z-index:50;background:#fff;border:2px solid var(--accent);border-radius:12px;padding:2px 8px;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.e2-ov{position:absolute;inset:0;background:rgba(20,30,45,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.e2-modal{background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:100%;overflow-y:auto;padding:20px 24px;box-shadow:0 10px 40px rgba(0,0,0,.3);font-size:17px;line-height:1.6}
.e2-modal h2{margin:0 0 10px;font-size:23px}
.e2-modal h3{margin:14px 0 6px;font-size:18px}
.e2-modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.e2-modal .acts .e2-btn{min-width:150px;min-height:54px;font-size:18px}
.e2-stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.e2-stcard{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#f8fbff;cursor:pointer;text-align:left;font:inherit;color:inherit;min-height:108px}
.e2-stcard.cur{border-color:var(--accent);background:#e6f0ff}
.e2-stcard.done{background:#effaf3}
.e2-stcard .no{font-size:14px;color:var(--sub)}
.e2-stcard .t{font-size:18px;font-weight:bold;margin:2px 0}
.e2-stcard .l{font-size:14px;color:var(--sub);line-height:1.4}
.e2-quiz .e2-btn{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 14px;font-weight:normal;font-size:17px;min-height:54px}
.e2-quiz .e2-btn.right{background:#d3f5e1;border-color:var(--ok)}
.e2-quiz .e2-btn.wrong{background:#ffe0e0;border-color:var(--ng)}
.e2-reason{background:#fff4f4;border-left:5px solid var(--ng);padding:8px 12px;margin:8px 0;border-radius:6px}
.e2-reason.tip{background:#fff9e6;border-color:var(--warn)}
.e2-reason.good{background:#ecfaf1;border-color:var(--ok)}
.e2-steps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.e2-steps div{background:#f3f7fc;border-radius:12px;padding:12px;font-size:16px}
.e2-steps b{font-size:18px}
.e2-big{font-size:46px;text-align:center;margin:4px 0}
/* 安全体験・電気料金 */
.e2-page{flex:1;display:flex;flex-direction:column;min-height:0}
.e2-subtabs{display:flex;gap:6px;padding:8px 10px;background:#f6f9fc;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.e2-caution{background:#fff1f1;color:#8a1414;font-weight:bold;font-size:14px;padding:6px 12px;border-bottom:1px solid #f3c4c4}
.e2-pbody{flex:1;display:flex;min-height:0}
.e2-scene{flex:1;min-width:0;position:relative;padding:8px}
.e2-scene svg{width:100%;height:100%;display:block}
.e2-pside{width:360px;flex:none;overflow-y:auto;padding:10px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.e2-appl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.e2-appl .e2-btn{min-height:58px;font-size:14.5px;padding:2px 6px;text-align:left;display:flex;align-items:center;gap:6px;font-weight:bold}
.e2-appl .e2-btn .ic{font-size:24px}
.e2-appl .e2-btn small{display:block;font-weight:normal;font-size:13px}
.e2-appl .e2-btn.on{background:#1d3557;color:#fff}
.e2-heat{animation:e2hot .5s ease-in-out infinite alternate}
.e2-pathr{fill:none;stroke:#e03131;stroke-width:6;stroke-linecap:round;stroke-dasharray:0.1 14;animation:e2dash .5s linear infinite}
.e2-pathg{fill:none;stroke:#2f9e44;stroke-width:6;stroke-linecap:round;stroke-dasharray:0.1 14;animation:e2dash .5s linear infinite}
.e2-cost{flex:1;overflow:auto;padding:10px 14px;display:flex;gap:14px;align-items:flex-start}
.e2-ctable{border-collapse:collapse;width:100%;font-size:15px;background:#fff;border-radius:12px;overflow:hidden}
.e2-ctable th{background:#e9f0f7;padding:6px;font-size:14px;text-align:center}
.e2-ctable td{border-bottom:1px solid #e3e9ef;padding:4px 6px;text-align:center}
.e2-ctable td.l{text-align:left;font-weight:bold;white-space:nowrap}
.e2-cside{width:340px;flex:none;display:flex;flex-direction:column;gap:10px}
.e2-gscale{position:relative;height:20px;font-size:13px;color:#5b6b7c}
.e2-gscale span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.e2-gwrap{position:relative}
.e2-gwrap .mk{position:absolute;top:-3px;bottom:-3px;width:3px;background:#1d2b3a}
.e2-mini{display:block;width:100%;max-width:360px;margin:6px auto 0;background:#fff;border-radius:8px}
.e2-step{display:inline-flex;align-items:center;gap:4px}
.e2-step .e2-btn{min-width:46px;min-height:46px;padding:0;font-size:20px}
.e2-step b{min-width:52px;display:inline-block;text-align:center;font-size:16px;white-space:nowrap}
.e2-step small{font-size:13px;font-weight:normal;color:#5b6b7c}
.e2-cbar{height:14px;background:#4c9be8;border-radius:4px;min-width:1px}
@media (max-width:1100px){.e2-pal{width:178px}.e2-side{width:250px}.e2-top h1{display:none}.e2-pi{min-height:80px}.e2-pside{width:300px}}
@media (max-width:1000px){.e2-cost{flex-direction:column;align-items:stretch}.e2-cost>div:first-child{flex:none!important}.e2-cside{width:100%;display:grid;grid-template-columns:1fr 1fr}.e2-cside .e2-card:first-child{grid-column:1/3}}
/* 縦向き: パレットは盤面の上の横帯、盤面は全幅、右パネルは盤面の下 */
@media (max-width:900px){
  .e2-top .lg{display:none}.e2-top .sh{display:inline}.e2-top{gap:4px;padding:0 6px}.e2-top .e2-btn{padding:0 10px}
  .e2-main{flex-direction:column}
  .e2-pal{width:100%;flex:none;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line)}
  .e2-pal h2{display:none}
  .e2-tools,.e2-palgrid{display:flex;gap:6px;flex:none}
  .e2-tool{width:76px;flex:none;min-height:88px;touch-action:pan-x}
  .e2-pi{width:100px;flex:none;min-height:88px;touch-action:pan-x}
  .e2-pi .sb{white-space:nowrap}
  .e2-palgrid .e2-card{width:260px}
  .e2-center{flex:none}
  .e2-msg{min-height:46px;padding:8px 12px}
  .e2-boardbox{flex:none;width:100%;aspect-ratio:808/568}
  .e2-side{width:100%;flex:1;min-height:0;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:8px}
  .e2-side>.wide{grid-column:1/3}
  .e2-pbody{flex-direction:column;overflow-y:auto}
  .e2-scene{flex:none;width:100%;aspect-ratio:760/520}
  .e2-pside{width:100%;flex:none;overflow:visible;border-left:0;display:grid;grid-template-columns:1fr 1fr;align-content:start}
  .e2-pside>.e2-card:first-child{grid-column:1/3}
  .e2-stgrid{grid-template-columns:repeat(2,1fr)}
  .e2-steps{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="e2-app" class="e2"></div>
<script>
/* ===================================================================
   回路コア(部品定義+ソルバ) — C2 電気回路ラボ / C5 回路設計シート 共用
   window.EnergyApps.Circuit
   ・回路は「素子」の配列: { id, type, a: 端子aの節点名, b: 端子bの節点名,
       val(値), on(スイッチ), broken(切れた・こわれた・落ちた) }
   ・電池・電源・LED・メーター・モーターは 端子a が「+」側
   ・I は素子の中を a→b に流れる電流(電池では内部を流れる向き)
   =================================================================== */
(function () {
'use strict';
var NS = window.EnergyApps = window.EnergyApps || {};
if (NS.Circuit) return;

var GMIN = 1e-9, R_WIRE = 0.001;

/* 部品定義 ---------------------------------------------------------- */
var PARTS = {
  wire:      { name: '導線', kind: 'wire', R: R_WIRE },
  battery:   { name: '乾電池', kind: 'source', V: 1.5, r: 0.4, cap: 2.0, polar: true, desc: '単3形乾電池 1.5V。長い線が+極、短く太い線が−極。' },
  supply:    { name: '電源装置', kind: 'source', vals: [1.5, 3, 4.5, 6, 9, 12], def: 3, unit: 'V', r: 0.2, polar: true, desc: '電圧を切りかえられる直流電源。' },
  sw:        { name: 'スイッチ', kind: 'switch', R: R_WIRE, desc: 'タップで入(ON)・切(OFF)。切ると回路が切れて電流が流れない。' },
  lamp:      { name: '豆電球', kind: 'load', Vr: 2.5, Ir: 0.3, burn: 2.2, desc: '2.5V 0.3A 用。電流が流れるとフィラメントが熱くなって光る(電気→光・熱)。' },
  led:       { name: 'LED', kind: 'led', Vf: 1.8, Rs: 15, Imax: 0.02, Iburn: 0.04, polar: true, desc: '発光ダイオード。向きがある(+:アノード)。約1.8V以上で光り、20mAまで。抵抗といっしょに使う。' },
  resistor:  { name: '抵抗', kind: 'load', vals: [10, 47, 100, 220, 470, 1000], def: 100, unit: 'Ω', desc: '電流を流れにくくする部品。値(Ω:オーム)が大きいほど電流は小さくなる。' },
  motor:     { name: 'モーター', kind: 'load', R: 5, Vr: 3, polar: true, desc: '電気→運動。電流の向きを逆にすると回る向きも逆になる。' },
  fuse:      { name: 'ヒューズ', kind: 'protect', vals: [0.5, 1, 2], def: 1, unit: 'A', R: 0.05, desc: '決められた電流をこえると中の金属がとけて切れ、回路を守る。切れたら交換する。' },
  breaker:   { name: 'ブレーカー', kind: 'protect', vals: [0.5, 0.8, 1, 2], def: 1, unit: 'A', R: 0.01, desc: '決められた電流をこえると自動で切れる。原因を取り除いてから入れなおせば、くり返し使える。' },
  ammeter:   { name: '電流計', kind: 'meter', R: 0.01, polar: true, desc: '電流をはかる。はかりたい部分に「直列」につなぐ。+端子を電源の+側に。' },
  voltmeter: { name: '電圧計', kind: 'meter', R: 1e7, polar: true, desc: '電圧をはかる。はかりたい部分に「並列」につなぐ。+端子を電源の+側に。' }

/* ---------- 盤面 ---------- */

  }

    }

  });
  if (srcs.length) {

    if (srcs.length > 1 && (par || sol.shorts.length)) {

      rows.push([(srcs.every(function (x) { return x.p.type === 'battery'; }) ? '電池' : '電源') + '1個あたりの電流', same ? fA(srcs[0].I) + ' ずつ' : srcs.map(function (x) { return fA(x.I); }).join('/')]);
    }

    if (S.parts.some(function (q) { return q.type === 'battery'; })) rows.push(['🔋 電池の持ち(目安)', fH(C.batteryHours(S.R.els, sol))]);
    h += '<div class="e2-card"><div class="ttl">📊 回路全体</div>' + kv(rows) + (par ? '<div class="e2-note" style="margin-top:4px">並列の電池は、全体の電流を分けあって流している。</div>' : '') + '<div class="e2-note" style="margin-top:4px">電力[W] = 電圧[V] × 電流[A]</div></div>';

    '<text x="380" y="290" text-anchor="middle" font-size="15" fill="#c92a2a" font-weight="bold">ショート:被覆がやぶれて2本の銅線がふれる → 大きな電流 → 発熱・火花</text>' +
    '<text x="380" y="460" text-anchor="middle" font-size="15">コードを曲げすぎたり、家具の下じきにしたり、束(たば)ねたまま使ったりすると、こうなりやすい</text></svg>';
  S.el.scene.innerHTML = s;
  S.el.pside.innerHTML = '<div class="e2-card"><div class="ttl">🔥 ショート(<ruby>短絡<rt>たんらく</rt></ruby>)とは</div>電流が電気器具を通らずに、ほとんど抵抗のない近道を流れること。とても大きな電流が流れ、電線が熱くなって<b>火災</b>の原因になります。</div>' +
    '<div class="e2-card tip"><div class="ttl">🛡 守るしくみ</div><b>ヒューズ</b>:大きな電流でとけて切れる(1回きり)。<br><b>ブレーカー</b>:自動で切れる。原因を取り除けば入れなおせる。<br>家の<ruby>分電盤<rt>ぶんでんばん</rt></ruby>(電気を部屋ごとに分ける箱)には、ブレーカーと<ruby>漏電遮断器<rt>ろうでんしゃだんき</rt></ruby>が入っています。</div>' +
    '<div class="e2-card"><div class="ttl">🧪 回路ラボでためす</div>ショートさせたとき、ヒューズがどう働くかを安全に体験しよう。<div class="e2-row"><button class="e2-btn big primary" data-act="go" data-id="c10">課題「ヒューズで回路を守る」へ</button></div><div class="e2-row"><button class="e2-btn big" data-act="go" data-id="c11">課題「ブレーカーと使いすぎ」へ</button></div></div>' +
    '<div class="e2-card tip"><div class="ttl">✅ コードの安全チェック</div>・コードを<ruby>束<rt>たば</rt></ruby>ねたまま使わない<br>・家具の下じきにしない、強く曲げない<br>・プラグを抜くときはコードを引っぱらずプラグを持つ<br>・こげたにおい、熱い、被覆のやぶれ → 使わず大人に知らせる</div>';
}

/* ===================================================================
   電気料金(電力量 kWh)
   =================================================================== */
var COSTAPPL = [
  { id: 'ac', name: 'エアコン(冷房)', icon: '❄️', W: 600, h: 6 }, { id: 'fridge', name: '冷蔵庫(平均)', icon: '🧊', W: 40, h: 24 },
  { id: 'tv', name: 'テレビ', icon: '📺', W: 150, h: 3 }, { id: 'light', name: 'LED照明', icon: '💡', W: 40, h: 6 },
  { id: 'pc', name: 'パソコン', icon: '💻', W: 60, h: 2 }, { id: 'game', name: 'ゲーム機', icon: '🎮', W: 100, h: 1 },
  { id: 'dryer', name: 'ヘアドライヤー', icon: '💨', W: 1200, h: 0.2 }, { id: 'micro', name: '電子レンジ', icon: '🍱', W: 1400, h: 0.2 },
  { id: 'kettle', name: '電気ケトル', icon: '🫖', W: 1250, h: 0.1 }, { id: 'wash', name: '洗濯機', icon: '🧺', W: 400, h: 1 }
];
function costState() {
  if (!S.cost) {
    var sv = S.save.cost || {};
    S.cost = { price: sv.price || 31, h: {} };
    COSTAPPL.forEach(function (a) { S.cost.h[a.id] = sv.h && sv.h[a.id] != null ? sv.h[a.id] : a.h; });
  }
  return S.cost;
}
function hTxt(v) { /* 1時間未満は分でも書く */
  if (v > 0 && v < 1) return Math.round(v * 60) + '分<br><small>(' + v + '時間)</small>';
  return v + '時間';
}
function renderCost() {
  var K = costState(), rows = '', totKWh = 0, maxY = 1, data = [];
  COSTAPPL.forEach(function (a) { var kwh = a.W * K.h[a.id] * 30 / 1000; data.push({ a: a, kwh: kwh, yen: kwh * K.price }); totKWh += kwh; maxY = Math.max(maxY, kwh * K.price); });
  data.forEach(function (d) {
    var a = d.a;
    rows += '<tr><td class="l">' + a.icon + ' ' + a.name + '</td><td>' + a.W + ' W</td><td><span class="e2-step"><button class="e2-btn" data-act="hdn" data-id="' + a.id + '" aria-label="減らす">−</button><b>' + hTxt(K.h[a.id]) + '</b><button class="e2-btn" data-act="hup" data-id="' + a.id + '" aria-label="増やす">+</button></span></td>' +
      '<td>' + d.kwh.toFixed(1) + '</td><td><b>' + Math.round(d.yen).toLocaleString() + '円</b></td><td style="width:120px;text-align:left"><div class="e2-cbar" style="width:' + (d.yen / maxY * 110) + 'px"></div></td></tr>';
  });
  var h = '<div class="e2-cost"><div style="flex:1;min-width:0"><table class="e2-ctable"><tr><th>電気器具</th><th><ruby>消費<rt>しょうひ</rt></ruby>電力</th><th>1日に使う時間</th><th>1か月(30日)の<ruby>電力量<rt>でんりょくりょう</rt></ruby><br>kWh</th><th>1か月の料金</th><th></th></tr>' + rows +
    '<tr><td class="l" colspan="3" style="text-align:right">合計</td><td><b>' + totKWh.toFixed(1) + '</b></td><td><b style="font-size:19px;color:#1e6fd9">' + Math.round(totKWh * K.price).toLocaleString() + '円</b></td><td></td></tr></table></div>' +
    '<div class="e2-cside">' +
    '<div class="e2-card"><div class="ttl">🧮 計算のしかた</div><b>電力量[Wh]</b> = 電力[W] × 時間[h]<br>1000Wh = <b>1kWh</b>(キロワット時)<br><b>電気料金</b> = 電力量[kWh] × 1kWhあたりの料金<br><div style="margin-top:6px">1kWhあたり <span class="e2-step"><button class="e2-btn" data-act="pdn">−</button><b>' + K.price + '円</b><button class="e2-btn" data-act="pup">+</button></span></div><div class="e2-note">(料金は電力会社や<ruby>契約<rt>けいやく</rt></ruby>(約束した料金のプラン)で変わります。ここでは目安)</div></div>' +
    '<div class="e2-card tip"><div class="ttl">💡 くらべてみよう</div>電球を1日5時間、30日つけると…<br>白熱電球 60W:60×5×30 = 9kWh → <b>' + Math.round(9 * K.price) + '円</b><br>LED電球 8W:8×5×30 = 1.2kWh → <b>' + Math.round(1.2 * K.price) + '円</b><br>同じ明るさでも、LEDは電気を光に変える<b><ruby>効率<rt>こうりつ</rt></ruby></b>(むだなく変えられる割合)がよいので、電気代が少なくてすむ。</div>' +
    '<div class="e2-card"><div class="ttl">🤔 考えよう</div>ドライヤー(1200W)は消費電力が大きいけれど、使う時間が短い。冷蔵庫は40Wでも24時間。1か月の料金はどちらが大きい?表の時間を変えてためそう。</div></div></div>';
  S.el.page.innerHTML = h;
}
function pageAct(a, t) {
  if (a === 'stab') { S.stab = t.getAttribute('data-tab'); renderSafety(); return; }
  if (a === 'appl') {
    var H = houseState(), id = t.getAttribute('data-id'), i = H.on.indexOf(id);
    S.tapMsg = '';
    if (i >= 0) H.on.splice(i, 1);
    else { if (H.on.length >= 7) { beep('err'); S.tapMsg = 'これ以上はつなげない(タップの差しこみ口がいっぱい)。どれかを外してからにしよう。'; renderSafety(); return; } H.on.push(id); }
    if (!H.trip && tapTotal() > 2000) { H.trip = true; beep('pop'); } else beep('sw');
    renderSafety(); return;
  }
  if (a === 'breset') { var H2 = houseState(); if (tapTotal() > 2000) { beep('pop'); H2.trip = true; } else { H2.trip = false; beep('sw'); } renderSafety(); return; }
  if (a === 'ltog') { var L = leakState(), k = t.getAttribute('data-k'); L[k] = !L[k]; if (k === 'elcb' && !L.elcb) L.trip = false; leakUpdate(); renderSafety(); return; }
  if (a === 'ltouch') { var L2 = leakState(); L2.touch = !L2.touch; leakUpdate(); renderSafety(); return; }
  if (a === 'lreset') { var L3 = leakState(); L3.trip = false; leakUpdate(); if (L3.trip) beep('pop'); renderSafety(); return; }
  var K = S.cost;
  if (a === 'hup' || a === 'hdn') {
    var id2 = t.getAttribute('data-id'), v = K.h[id2], st = v < 1 || (a === 'hdn' && v <= 1) ? 0.1 : (v < 4 || (a === 'hdn' && v <= 4) ? 0.5 : 1);
    v = a === 'hup' ? v + st : v - st; v = Math.max(0, Math.min(24, Math.round(v * 10) / 10)); K.h[id2] = v;
  }
  if (a === 'pup') K.price = Math.min(60, K.price + 1);
  if (a === 'pdn') K.price = Math.max(10, K.price - 1);
  if (K && (a === 'hup' || a === 'hdn' || a === 'pup' || a === 'pdn')) { S.save.cost = { price: K.price, h: K.h }; persist(); renderCost(); }
}

/* ---------- 起動 ---------- */
function mount(root) {
  S.root = root; root.classList.add('e2');
  S.save = loadSave();
  bindInput();
  S.mode = S.save.mode && (S.save.mode === 'free' || chalById(S.save.mode)) ? S.save.mode : 'free';
  var v = S.save.view;
  openMode(S.mode); closeModal();
  if (v === 'safety' || v === 'cost') openView(v);
  if (!S.save.seen) { S.save.seen = true; persist(); showHowto(true); }
}

NS.C2 = {
  mount: mount,
  _test: { S: S, CHALS: CHALS, place: place, toEls: toEls, analyze: analyze, openMode: function (m) { openMode(m); }, openView: openView, partAt: partAt, changed: changed, toggleSw: toggleSw, flipPart: flipPart, repair: repair, setVal: setVal, snapshot: snapshot }
};
var auto = document.getElementById('e2-app');
if (auto && !auto.getAttribute('data-manual')) mount(auto);
})();
</script>
