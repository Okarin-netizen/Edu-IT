<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C5 回路設計シート</title>
<!-- 共通の枠(4分野共通の色・ヘッダー・作成者・安全と個人情報・ライセンス・更新履歴)。統合版では build.py が中に入れる -->
<link rel="stylesheet" href="../../shared/eduit-frame.css">
<script src="../eduit-info.js"></script>
<script data-ef-app>EDUIT_INFO.app = { name: 'C5 回路設計シート' };</script>
<script src="../../shared/eduit-frame.js"></script>
<style>
html,body{margin:0;height:100%;background:#eef3f8;}
.e5{--ink:#1d2b3a;--sub:#5b6b7c;--line:#d5dee8;--accent:#1e6fd9;--ok:#1a9b5b;--ng:#d93a3a;--warn:#f08c00;
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;
  color:var(--ink);height:100%;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;
  font-size:16px;overflow:hidden;position:relative;background:#eef3f8;-webkit-tap-highlight-color:transparent;}
.e5 *{box-sizing:border-box}
.e5 button{font:inherit;touch-action:manipulation}
.e5 input,.e5 textarea,.e5 select{font:inherit;user-select:text;-webkit-user-select:text}
.e5-top{height:62px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--ef-surface,#fff);color:var(--ef-text,#1f2328);flex:none;border-bottom:3px solid var(--ef-accent,#b45309)}
.e5-top .sh{display:none}
.e5-top h1{font-size:17px;margin:0 6px 0 0;white-space:nowrap;font-weight:bold}
.e5-stitle{flex:1;font-size:15px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:6px;min-width:0}
.e5-btn{min-height:46px;min-width:46px;padding:0 14px;border-radius:12px;border:2px solid transparent;background:#e3ebf5;color:var(--ink);font-weight:bold;cursor:pointer;font-size:16px}
.e5-btn:active{transform:translateY(1px)}
.e5-btn:disabled{opacity:.4;cursor:default}
.e5-top .e5-btn{background:var(--ef-surface,#fff);color:var(--ef-text,#1f2328);border:1px solid var(--ef-line,#d6d3cb);border-radius:999px;padding:0 11px;white-space:nowrap}
.e5-top .e5-btn:hover{border-color:var(--ef-accent,#b45309)}
.e5-top .e5-btn.on{background:var(--ef-accent,#b45309);border-color:var(--ef-accent,#b45309);color:var(--ef-accent-ink,#fff)}
.e5-top h1{color:var(--ef-text,#1f2328)}
.e5-top .ef-about-btn{font-size:0;min-width:44px;min-height:44px;padding:0;flex:none}
.e5-top .ef-about-btn::before{content:"ⓘ";font-size:20px}
.e5-btn.primary{background:var(--accent);color:#fff}
.e5-btn.danger{background:#fde2e2;color:#a61e1e}
.e5-btn.good{background:#d3f5e1;color:#0d6b3a}
.e5-btn.big{min-height:56px;font-size:18px;width:100%}
.e5-btn.sm{min-height:44px;padding:0 12px;font-size:15px}
.e5-btn.on{background:#1d3557;color:#fff}
.e5-badge{display:inline-block;min-width:22px;padding:0 6px;border-radius:11px;font-size:13px;line-height:22px;text-align:center;margin-left:4px;background:#d93a3a;color:#fff}
.e5-badge.y{background:#f08c00}
.e5-badge.g{background:#1a9b5b}
/* 回路図エディタ */
.e5-main{flex:1;display:flex;min-height:0}
.e5-pal{width:196px;flex:none;overflow-y:auto;overflow-x:hidden;padding:8px;background:#fff;border-right:1px solid var(--line)}
.e5-pal h2,.e5-side h2{font-size:14px;margin:6px 2px 6px;color:var(--sub)}
.e5-tools{display:grid;grid-template-columns:1fr;gap:5px}
.e5-tool{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:6px;border-radius:12px;border:2px solid var(--line);background:#f8fbff;cursor:pointer;min-height:48px;font-size:15px;font-weight:bold;padding:2px 8px;touch-action:pan-y;text-align:left;line-height:1.2;white-space:nowrap}
.e5-tool .ic{font-size:22px;line-height:26px}
.e5-palgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.e5-pi{position:relative;display:flex;flex-direction:column;align-items:center;padding:3px 2px 4px;border-radius:12px;border:2px solid var(--line);background:#f8fbff;touch-action:pan-y;cursor:pointer;min-height:80px;text-align:center}
.e5-pi svg{width:100%;max-width:84px;height:38px;pointer-events:none}
.e5-pi .nm{font-weight:bold;font-size:14px;line-height:1.2}
.e5-pi .sb{font-size:13px;color:var(--sub);line-height:1.3}
.e5-pi.sel,.e5-tool.sel{border-color:var(--accent);background:#dcebff;box-shadow:0 0 0 3px #9cc3ff}
.e5-center{flex:1;display:flex;flex-direction:column;min-width:0}
.e5-msg{min-height:46px;padding:10px 14px;font-size:16px;background:#fffbe6;border-bottom:1px solid #f1e3a6;line-height:1.4}
.e5-msg.err{background:#ffe8e8;border-color:#f5b5b5;color:#8a1414}
.e5-msg.ok{background:#e6f8ee;border-color:#a8e0c0}
.e5-bar{display:flex;gap:6px;padding:6px 8px;background:#f6f9fc;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.e5-bar .sp{flex:1}
.e5-boardbox{flex:1;min-height:0;position:relative;background:#fff}
.e5-board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
.e5-dot{fill:#c9d4df}
.e5-slot{stroke:#edf1f5;stroke-width:3;stroke-dasharray:4 7;stroke-linecap:round}
.e5-placing .e5-slot{stroke:#9cc3ff;stroke-width:4}
.e5-slot.drop{stroke:var(--accent)!important;stroke-width:10!important;stroke-dasharray:none;opacity:.6}
.e5-cur{stroke:#f08c00;stroke-width:14;stroke-linecap:round;opacity:.45;fill:none}
.e5-selhl{stroke:#1e6fd9;stroke-width:26;stroke-linecap:round;opacity:.22}
.e5-hl{stroke:#ff8a00;stroke-width:24;stroke-linecap:round;opacity:.45;fill:none}
.e5-hlnet{stroke:#ff8a00;stroke-width:14;stroke-linecap:round;opacity:.55;fill:none}
.e5-done{stroke:#40c057;stroke-width:12;stroke-linecap:round;opacity:.35;fill:none}
.e5-term{fill:#ff8a00;stroke:#fff;stroke-width:3}
.e5-open{fill:#fff;stroke:#d93a3a;stroke-width:3}
.e5-w{stroke:#1d2b3a;stroke-width:3.5;stroke-linecap:round;fill:none}
.e5-s{stroke:#1d2b3a;stroke-width:3;fill:#fff}
.e5-jn{fill:#1d2b3a}
.e5-lbl{font-size:17px;font-weight:bold;fill:#1d3557;paint-order:stroke;stroke:#fff;stroke-width:5px;pointer-events:none}
.e5-val{font-size:15px;fill:#5b6b7c;font-weight:bold;paint-order:stroke;stroke:#fff;stroke-width:5px;pointer-events:none}
.e5-num{font-size:15px;font-weight:bold;fill:#b35c00;paint-order:stroke;stroke:#fff;stroke-width:5px;pointer-events:none}
.e5-ltr{font-size:18px;font-weight:bold;fill:#1d2b3a;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.e5-plus{font-size:16px;font-weight:bold;fill:#c92a2a;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.e5-emo{font-size:22px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.e5-flow{fill:none;stroke:#ffd43b;stroke-width:6;stroke-linecap:round;stroke-dasharray:0.1 15.9;animation:e5dash linear infinite;pointer-events:none}
@keyframes e5dash{to{stroke-dashoffset:-16}}
.e5-spin{animation:e5spin linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes e5spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.e5-flow,.e5-spin{animation:none!important}}
.e5-side{width:300px;flex:none;overflow-y:auto;padding:10px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.e5-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbfdff;font-size:14.5px;line-height:1.55}
.e5-card .ttl{font-size:17px;font-weight:bold;margin-bottom:4px}
.e5-card.goal{background:#f2fbf5;border-color:#a8dcbc}
.e5-card.tip{background:#fff9e6;border-color:#f1e3a6}
.e5-goal{display:flex;gap:6px;align-items:flex-start;margin:5px 0;font-size:15px}
.e5-goal .m{flex:none;width:24px;text-align:center;font-size:17px}
.e5-goal.ok{color:#0d6b3a;font-weight:bold}
.e5-ck{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;margin:5px 0;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14.5px;line-height:1.45;cursor:pointer;color:inherit}
.e5-ck .m{flex:none;font-size:17px;line-height:1.3}
.e5-ck.ng{background:#fff1f1;border-color:#f3b4b4}
.e5-ck.warn{background:#fff7e6;border-color:#f6d199}
.e5-ck.ok{background:#ecfaf1;border-color:#a8dcbc}
.e5-ck.info{background:#f3f7fc}
.e5-ck.cur{box-shadow:0 0 0 3px #ffb35c}
.e5-ck small{display:block;color:#5b4a2a;font-size:13px;margin-top:2px}
.e5-kv{width:100%;border-collapse:collapse;font-size:15px}
.e5-kv td{padding:3px 2px;border-bottom:1px solid #edf1f5}
.e5-kv td:last-child{text-align:right;font-weight:bold;font-size:15px}
.e5-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.e5-row .e5-btn{flex:1}
.e5-vals{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.e5-vals .e5-btn{flex:1 0 28%;min-height:44px;padding:0 4px;font-size:15px}
.e5-clear{border:2px solid #40c057;background:#e6f8ee;border-radius:12px;padding:8px 10px;margin-top:6px;font-weight:bold;color:#0d6b3a}
.e5-clear .e5-btn{width:100%;margin-top:6px}
.e5-chip{min-height:44px;display:inline-flex;align-items:center;padding:0 12px;border-radius:22px;border:2px solid #a8dcbc;background:#f2fbf5;color:#0d6b3a;font-weight:bold;font-size:15px;cursor:pointer;white-space:nowrap}
.e5-chip.all{background:#d3f5e1;border-color:#40c057}
.e5-batt{font-size:15px}
.e5 ruby{ruby-align:center}
.e5 ruby rt{font-size:.55em;font-weight:normal}
.e5 details.e5-set{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:#f8fbff}
.e5 details.e5-set summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:16px;color:var(--sub);font-weight:bold}
.e5-gl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:16px}
.e5-gl dt{font-weight:bold}.e5-gl dd{margin:0}
.e5-ghost{position:absolute;pointer-events:none;transform:translate(-50%,-50%);z-index:50;background:#fff;border:2px solid var(--accent);border-radius:12px;padding:2px 8px;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,.25)}
/* ページ共通 */
.e5-page{flex:1;display:flex;min-height:0;gap:12px;padding:12px;overflow:hidden}
.e5-col{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.e5-col h2{font-size:19px;margin:2px 0 4px}
.e5-col h3{font-size:16px;margin:8px 0 2px;color:#1d3557}
.e5-tasks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.e5-task{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#f8fbff;cursor:pointer;text-align:left;font:inherit;color:inherit;min-height:96px;display:flex;flex-direction:column;gap:2px}
.e5-task.cur{border-color:var(--accent);background:#e6f0ff;box-shadow:0 0 0 3px #9cc3ff}
.e5-task .t{font-size:18px;font-weight:bold}
.e5-sticky{position:sticky;bottom:-12px;background:#fff;padding:8px 0 12px;margin-top:auto}
.e5-task .l{font-size:13px;color:var(--sub);line-height:1.4}
.e5-task .p{font-size:13px;font-weight:bold;color:#0d6b3a}
.e5-field{display:flex;flex-direction:column;gap:3px}
.e5-field label{font-weight:bold;font-size:15px}
.e5-field small{color:var(--sub);font-size:13px}
.e5 textarea,.e5 input[type=text],.e5 input[type=number]{min-height:44px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px;background:#fbfdff;color:var(--ink);width:100%}
.e5 textarea{min-height:76px;resize:vertical;line-height:1.5}
.e5 textarea:focus,.e5 input:focus{outline:none;border-color:var(--accent);background:#fff}
.e5-names{display:flex;gap:8px}
.e5-names .e5-field{flex:1}
.e5-condli{margin:4px 0;padding-left:4px;font-size:15.5px;line-height:1.5}
.e5-tbl{width:100%;border-collapse:collapse;font-size:15px}
.e5-tbl th,.e5-tbl td{border:1px solid #d5dee8;padding:6px 7px;text-align:left;vertical-align:middle}
.e5-tbl th{background:#eef3f8;font-size:14px}
.e5-tbl td.n{text-align:right;white-space:nowrap}
.e5-tbl input[type=number]{width:96px;padding:6px 8px;text-align:right;min-height:44px}
.e5-band{display:inline-block;width:12px;height:20px;border:1px solid #555;margin-right:2px;vertical-align:middle;border-radius:2px}
.e5-diff{font-weight:bold;white-space:nowrap}
.e5-diff.g{color:#0d6b3a}.e5-diff.y{color:#b35c00}.e5-diff.r{color:#c92a2a}
.e5-stepcard{flex:1 0 auto;border:2px solid #a8c8f0;border-radius:14px;background:#f5f9ff;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.e5-stephead{display:flex;align-items:center;gap:10px}
.e5-stepno{flex:none;width:52px;height:52px;border-radius:50%;background:#1d3557;color:#fff;font-size:22px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.e5-steptxt{font-size:18px;font-weight:bold;line-height:1.45}
.e5-stepnote{font-size:14.5px;color:#5b4a2a;background:#fff9e6;border-radius:8px;padding:6px 10px;line-height:1.5}
.e5-mini{width:100%;flex:1 1 auto;min-height:260px;height:300px;background:#fff;border:1px solid var(--line);border-radius:10px;display:block}
.e5-steplist{margin:0;padding:0;list-style:none}
.e5-steplist li{display:flex;gap:8px;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:15px;line-height:1.45;border:1px solid transparent}
.e5-steplist li .k{flex:none;width:28px;height:28px;border-radius:50%;background:#e3ebf5;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:14px}
.e5-steplist li.cur{background:#e6f0ff;border-color:#9cc3ff}
.e5-steplist li.cur .k{background:#1d3557;color:#fff}
.e5-steplist li.dn .k{background:#d3f5e1;color:#0d6b3a}
.e5-empty{color:var(--sub);font-size:16px;padding:20px;text-align:center;line-height:1.7}
/* モーダル */
.e5-ov{position:absolute;inset:0;background:rgba(20,30,45,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.e5-modal{background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:100%;overflow-y:auto;padding:20px 24px;box-shadow:0 10px 40px rgba(0,0,0,.3);font-size:17px;line-height:1.6}
.e5-modal h2{margin:0 0 10px;font-size:23px}
.e5-modal h3{margin:14px 0 6px;font-size:18px}
.e5-modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.e5-modal .acts .e5-btn{min-width:150px;min-height:54px;font-size:18px}
.e5-steps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.e5-steps div{background:#f3f7fc;border-radius:12px;padding:12px;font-size:16px}
.e5-steps b{font-size:18px}
.e5-opt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.e5-opt .e5-btn{min-width:140px}
.e5-opt svg{width:90px;height:34px;vertical-align:middle;background:#fff;border-radius:6px}
/* 印刷 */
.e5-printarea{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm}
  html,body{height:auto;background:#fff}
  .e5{height:auto;overflow:visible;display:block;background:#fff}
  .e5>*:not(.e5-printarea){display:none!important}
  .e5-printarea{display:block;font-size:12.5px;color:#000;line-height:1.5}
  .e5-printarea h1{font-size:19px;margin:0 0 4px}
  .e5-printarea h2{font-size:14.5px;margin:10px 0 3px;border-bottom:1.5px solid #000;padding-bottom:1px}
  .e5-printarea .who{display:flex;gap:30px;font-size:13px;margin-bottom:4px}
  .e5-printarea .who span{border-bottom:1px solid #000;min-width:150px;display:inline-block}
  .e5-printarea svg{width:100%;height:auto;max-height:100mm;border:1px solid #999}
  .e5-printarea .e5-tbl{font-size:11.5px}
  .e5-printarea .e5-tbl th,.e5-printarea .e5-tbl td{border:1px solid #777;padding:2px 5px}
  .e5-printarea .e5-tbl th{background:#eee}
  .e5-printarea ol,.e5-printarea ul{margin:2px 0;padding-left:22px}
  .e5-printarea .box{border:1px solid #777;min-height:16mm;padding:3px 6px;white-space:pre-wrap}
  .e5-printarea .two{display:flex;gap:10px}
  .e5-printarea .two>div{flex:1}
  .e5-printarea .avoid{break-inside:avoid}
}
@media (max-width:1100px){
  .e5-pal{width:172px}.e5-side{width:262px}
  .e5-top .e5-btn{padding:0 8px;font-size:15px}
  .e5-top h1{font-size:15px}
}
@media (max-width:900px){
  .e5-stitle{display:none}
  .e5-top{gap:4px;padding:0 6px}
  .e5-top .lg{display:none}
  .e5-top .sh{display:inline}
  .e5-top .e5-btn{padding:0 8px;font-size:15px}
  .e5-page{flex-direction:column;overflow-y:auto}
  .e5-col{overflow:visible;flex:none!important;width:auto!important}
  .e5-sticky{position:static}
  /* 回路図:パレットは上の横帯、盤面は全幅、チェックと条件は下 */
  .e5-main{flex-direction:column}
  .e5-pal{width:100%;flex:none;overflow:visible;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
  .e5-pal h2{display:none}
  .e5-tools,.e5-palgrid{display:contents}
  .e5-tool{flex-direction:column;justify-content:center;gap:0;min-height:62px;font-size:14px;padding:2px;text-align:center;touch-action:none}
  .e5-pi{min-height:62px;padding:2px;touch-action:none}
  .e5-pi svg{height:28px}
  .e5-pi .sb{display:none}
  .e5-center{flex:none}
  .e5-boardbox{flex:none;width:100%;aspect-ratio:808/568}
  .e5-side{width:100%;flex:1 1 0;min-height:120px;border-left:0;border-top:2px solid var(--line)}
  .e5-msg{min-height:44px;padding:8px 12px;font-size:15px}
  .e5-bar{padding:4px 8px}
}
</style>
</head>
<body>
<div id="e5-app" class="e5"></div>
<script>
/* ===================================================================
   回路コア(部品定義+ソルバ) — C2 電気回路ラボ / C5 回路設計シート 共用
   window.EnergyApps.Circuit
   ・回路は「素子」の配列: { id, type, a: 端子aの節点名, b: 端子bの節点名,
       val(値), on(スイッチ), broken(切れた・こわれた・落ちた) }
   ・電池・電源・LED・メーター・モーターは 端子a が「+」側
   ・I は素子の中を a→b に流れる電流(電池では内部を流れる向き)
   =================================================================== */
(function () {
'use strict';
var NS = window.EnergyApps = window.EnergyApps || {};
if (NS.Circuit) return;

var GMIN = 1e-9, R_WIRE = 0.001;

/* 部品定義 ---------------------------------------------------------- */
var PARTS = {
  wire:      { name: '導線', kind: 'wire', R: R_WIRE },
  battery:   { name: '乾電池', kind: 'source', V: 1.5, r: 0.4, cap: 2.0, polar: true, desc: '単3形乾電池 1.5V。長い線が+極、短く太い線が−極。' },
  supply:    { name: '電源装置', kind: 'source', vals: [1.5, 3, 4.5, 6, 9, 12], def: 3, unit: 'V', r: 0.2, polar: true, desc: '電圧を切りかえられる直流電源。' },
  sw:        { name: 'スイッチ', kind: 'switch', R: R_WIRE, desc: 'タップで入(ON)・切(OFF)。切ると回路が切れて電流が流れない。' },
  lamp:      { name: '豆電球', kind: 'load', Vr: 2.5, Ir: 0.3, burn: 2.2, desc: '2.5V 0.3A 用。電流が流れるとフィラメントが熱くなって光る(電気→光・熱)。' },

  fuse:      { name: 'ヒューズ', kind: 'protect', vals: [0.5, 1, 2], def: 1, unit: 'A', R: 0.05, desc: '決められた電流をこえると中の金属がとけて切れ、回路を守る。切れたら交換する。' },
  breaker:   { name: 'ブレーカー', kind: 'protect', vals: [0.5, 0.8, 1, 2], def: 1, unit: 'A', R: 0.01, desc: '決められた電流をこえると自動で切れる。原因を取り除いてから入れなおせば、くり返し使える。' },
  ammeter:   { name: '電流計', kind: 'meter', R: 0.01, polar: true, desc: '電流をはかる。はかりたい部分に「直列」につなぐ。+端子を電源の+側に。' },
  voltmeter: { name: '電圧計', kind: 'meter', R: 1e7, polar: true, desc: '電圧をはかる。はかりたい部分に「並列」につなぐ。+端子を電源の+側に。' }

function valOf(e) { var d = PARTS[e.type]; return e.val != null ? e.val : (d.def != null ? d.def : d.V); }

/* 連立一次方程式(ガウスの消去法・部分ピボット) ------------------- */
function gauss(A, z) {

/* 素子のモデル: 端子間コンダクタンス g と、a→b 向きの電流オフセット j

function model(e, ledOn) {

    case 'lamp': return { g: e.broken ? GMIN : 1 / lampR(), j: 0 };
    case 'led': return e.broken || !ledOn ? { g: GMIN, j: 0 } : { g: 1 / d.Rs, j: d.Vf / d.Rs };
    case 'resistor': return { g: 1 / v, j: 0 };
    case 'motor': return { g: 1 / d.R, j: 0 };
    case 'fuse': case 'breaker': return { g: e.broken ? GMIN : 1 / d.R, j: 0 };
    case 'ammeter': case 'voltmeter': return { g: 1 / d.R, j: 0 };

/* 1回の解析(LEDの状態はくり返しで決める) */
function solve(els) {

  els.forEach(function (e) { [e.a, e.b].forEach(function (k) { if (!(k in idx)) { idx[k] = names.length; names.push(k); } }); });

    for (i = 0; i < n; i++) { A.push(new Array(n).fill(0)); A[i][i] = GMIN; z.push(0); }
    els.forEach(function (e) {
      var m = model(e, ledOn[e.id]), a = idx[e.a], b = idx[e.b];
      if (a === b) return;
      A[a][a] += m.g; A[b][b] += m.g; A[a][b] -= m.g; A[b][a] -= m.g;
      z[a] += m.j; z[b] -= m.j;

    x = n ? gauss(A, z) : [];
    var flip = false;
    els.forEach(function (e) {
      if (e.type !== 'led' || e.broken) return;
      var vd = x[idx[e.a]] - x[idx[e.b]], d = PARTS.led;
      if (!ledOn[e.id] && vd > d.Vf + 1e-9) { ledOn[e.id] = true; flip = true; }
      else if (ledOn[e.id] && vd < d.Vf - 1e-9) { ledOn[e.id] = false; flip = true; }

  els.forEach(function (e) {
    var m = model(e, ledOn[e.id]), vd = V[e.a] - V[e.b], I = e.a === e.b ? 0 : m.g * vd - m.j, d = PARTS[e.type], r = { V: vd, I: I };

    if (e.type === 'led') r.bright = e.broken ? 0 : Math.max(0, I) / d.Imax;

/* ショート検出 -------------------------------------------------------
   電源(乾電池・電源装置)ごとに、部品(負荷)を1つも通らずに+と−がつながる「輪」を探す。
   通ってよいのは、ほぼ0Ωの素子(lowR)と、ほかの電源だけ。
   ・kind 'wire'  : 導線など(0Ω)だけで+と−がつながっている(ふつうのショート)
   ・kind 'source': ほかの電源を通って輪になり、輪の中の電圧が打ち消し合わない
                    (電池どうしを逆向きに輪にした・直列の電池全体を導線でつないだ など)。
                    with に、輪の中にあるほかの電源の id が入る。
     正しい並列(+と+、−と−)は電圧が打ち消し合うのでショートにしない。
   shortLoops(els) → [{ id, kind, with: [id...], emf: 輪の中の電圧[V] }]

  var adj = {};

  });
  els.forEach(function (s) {
    if (PARTS[s.type].kind !== 'source' || s.a === s.b) return;
    if (par[s.a] !== undefined && par[s.b] !== undefined && f(s.a) === f(s.b)) { out.push({ id: s.id, kind: 'wire', with: [], emf: valOf(s) }); return; }
    /* s を除いて、−極(b)から+極(a)へ行けるか。行けたら、その道の電位差を調べる */
    var pot = {}, from = {}, q = [s.b], n;
    pot[s.b] = 0;
    while (q.length && pot[s.a] === undefined) {

/* 保護装置・こわれる部品まで含めて落ち着くまで解析する。

    sol = solve(els);

    els.forEach(function (e) {

        e.broken = true; ch = true; events.push({ id: e.id, type: e.type, I: Math.abs(sol.el[e.id].I) });
      }

    if (ch) continue;
    els.forEach(function (e) {

/* 電池の持ち(時間): 電池ごとの電流から、いちばん早くなくなる電池 */

})();

  /* 入力欄:画面のキーボードに隠れないように */
  root.addEventListener('focusin', function (ev) {
    var t = ev.target; if (!t.matches || !t.matches('input,textarea')) return;
    setTimeout(function () { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {} }, 300);
  });

    if ((k = t.getAttribute('data-note'))) { D().notes[k] = t.value.slice(0, 2000); dirty(); persist(); return; }

    if ((k = t.getAttribute('data-meas'))) {
      var key = t.getAttribute('data-k'), d = D(), m = d.meas[k] = d.meas[k] || {}, v = t.value.trim();

      var a = A(), row = measRows(d.parts, a).filter(function (r) { return r.p.id === k; })[0];
      if (row) { var di = key === 'I' ? diffInfo(row.I, m.I, 1000) : diffInfo(row.V, m.V, 1), cell = root.querySelector('[data-dif="' + k + key + '"]'); if (cell) { cell.textContent = di.t; cell.className = 'e5-diff ' + di.cls; } }

    var t = ev.target.closest('[data-pal],[data-tool]'); if (!t || S.pdragUsed) return;
    if (S.sim) { say('今は「動かす」中。回路図を変えるときは「⏹ 動かすのをやめる」を押してね。', 'err'); return; }
    var k = t.getAttribute('data-pal') || t.getAttribute('data-tool');
    S.tool = k;
    if (S.tool === 'wire') say('導線モード:点から点へ指でなぞると線が引ける。点と点の間をタップしても1本引ける。');
    else if (S.tool === 'erase') say('けすモード:消したい部品や導線をタップ。');
    else if (S.tool === 'select') say('えらぶモード:部品をタップして調べる・なぞって動かす。スイッチはタップで入/切。点からなぞると導線も引ける。');
    else say(PARTS[S.tool].name + 'を置くよ。点と点の間をタップしよう。(' + (S.tool === 'sw' ? '置いたあと、タップで入/切できる。' : PARTS[S.tool].desc) + ')');

  /* 記号を盤面へ引っぱって置く。
     指でパレットをスワイプしてスクロールになると pointercancel が来る。そのときは引っぱりを取り消す

  function pdragCancel() {

  root.addEventListener('pointerdown', function (ev) {

function segMid(seg) { var e = segEnds(seg); return { x: (e[0].x + e[1].x) / 2 * SP, y: (e[0].y + e[1].y) / 2 * SP }; }

/* ---------- 起動 ---------- */
function mount(root) {

  /* これまでに条件をすべて満たしている課題は「クリア済み」にしておく(🎉 を何度も出さない) */

  }

  if (S.view === 'edit') say(D().parts.length ? '前の回路図のつづきだよ。' + (isPortrait() ? '下' : '右') + 'の自動チェックと条件を見ながら直そう。' : (isPortrait() ? '上' : '左') + 'の記号をえらんで、点と点の間をタップしよう。');
  if (!S.save.seen) { S.save.seen = true; persist(); showHowto(true); }
}
