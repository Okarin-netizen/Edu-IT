<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>授業で使う 技術分野 教材集</title>
<!-- 生徒用サイトの「授業で使う」入り口。教材は ?jishu=off で開く(前に自習で開いた端末でも、自習ガイドを出さない) -->
<link rel="stylesheet" href="../shared/eduit-frame.css">
<link rel="stylesheet" href="site.css">
</head>
<body class="ef-page">
<header class="ef-header">
  <a class="ef-btn ef-back" href="./">◀ 入り口</a>
  <h1 class="ef-title"><span class="ef-title-name">授業で使う</span></h1>
</header>
<main class="site-main">
  <p class="site-lead">先生が言った教材の「ひらく」を押してください。</p>
  <h2 class="site-h2">教科書の順に進む</h2>
  <div class="site-first" id="site-course"></div>
  <h2 class="site-h2">はじめに(1年の最初)</h2>
  <div class="site-first" id="site-guidance"></div>
  <h2 class="site-h2">4つの分野</h2>
  <div class="site-grid" id="site-cards"></div>
  <h2 class="site-h2">3年生の最後</h2>
  <div class="site-first" id="site-last"></div>
  <h2 class="site-h2">どの分野でも使う</h2>
  <div class="site-grid" id="site-extra"></div>
  <p class="site-lead">ひとりで進めるときは、入り口で「自習で使う」をえらびます。</p>
</main>
<div data-ef-footer></div>
<script>
  window.EDUIT_INFO = {
    suite: '技術分野 教材集',
    app: { name: '技術分野 教材集(授業で使う)' },
    safety: ['このページは、授業で使う教材をひらくための入り口です。教材はインターネットから読みこみますが、ひらいたあとは端末の中だけで動き、入力した内容や学習の記録をどこにも送りません。']
  };
</script>
<script src="../shared/eduit-frame.js"></script>
<script src="site.js"></script>
<script>
  EduitSite.cards('site-course', ['T'], '?jishu=off');
  EduitSite.cards('site-guidance', ['G'], '?jishu=off');
  EduitSite.cards('site-cards', ['A', 'B', 'C', 'D'], '?jishu=off');
  EduitSite.cards('site-last', ['Z'], '?jishu=off');
  EduitSite.cards('site-extra', ['M', 'F'], '?jishu=off');
</script>
</body>
</html>
