<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自習で使う 技術分野 教材集</title>
<!-- 生徒用サイトの「自習で使う」入り口。教材は ?jishu=on で開く(右はしに「自習ガイド」が出る) -->
<link rel="stylesheet" href="../shared/eduit-frame.css">
<link rel="stylesheet" href="site.css">
</head>
<body class="ef-page">
<header class="ef-header">
  <a class="ef-btn ef-back" href="./">◀ 入り口</a>
  <h1 class="ef-title"><span class="ef-title-name">自習で使う</span></h1>
</header>
<main class="site-main">
  <p class="site-lead">ここから開くと、教材の右はしに「自習ガイド」が出ます。<br>ガイドを見ながら、ひとりで進めます。</p>
  <h2 class="site-h2"><span class="site-step">1</span>教科書の順に進む(おすすめ)</h2>
  <p class="site-lead">何をすればよいか迷ったら、ここから始めます。</p>
  <div class="site-first" id="site-course"></div>
  <h2 class="site-h2"><span class="site-step">2</span>自習ワークシート</h2>
  <p class="site-lead">教材といっしょに使います。<br>タブレットで書きこむか、印刷して使います。</p>
  <p class="site-ws" id="site-ws"></p>
  <h2 class="site-h2"><span class="site-step">3</span>教材をえらんで進む</h2>
  <p class="site-lead">先生が言った教材を、自習モードで開きます。</p>
  <div class="site-first" id="site-guidance"></div>
  <div class="site-grid" id="site-cards"></div>
  <div class="site-grid" id="site-extra" style="margin-top:14px"></div>
  <section class="site-note site-jishu" aria-labelledby="site-how-h">
    <h2 id="site-how-h">自習ガイドの使い方</h2>
    <ul>
      <li>右はしの「自習ガイド」を押すと、ねらいと進め方が出ます。</li>
      <li>こまったら「ヒント」を押します。</li>
      <li>終わったら「たしかめ問題」に答えます。</li>
    </ul>
  </section>
</main>
<div data-ef-footer></div>
<script>
  window.EDUIT_INFO = {
    suite: '技術分野 教材集',
    app: { name: '技術分野 教材集(自習で使う)' },
    safety: ['このページは、自習で使う教材をひらくための入り口です。教材はインターネットから読みこみますが、ひらいたあとは端末の中だけで動き、入力した内容や学習の記録をどこにも送りません。']
  };
</script>
<script src="../shared/eduit-frame.js"></script>
<script src="site.js"></script>
<script>
  EduitSite.cards('site-course', ['T'], '?jishu=on');
  EduitSite.wsLinks('site-ws');
  EduitSite.cards('site-guidance', ['G'], '?jishu=on');
  EduitSite.cards('site-cards', ['A', 'B', 'C', 'D'], '?jishu=on');
  EduitSite.cards('site-extra', ['M', 'F', 'Z'], '?jishu=on');
</script>
</body>
</html>
