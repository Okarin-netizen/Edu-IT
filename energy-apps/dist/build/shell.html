<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エネルギー変換 学習アプリ(E1〜E5)</title>
<!-- E1〜E5 を1つにまとめたファイル。外部通信なし。各アプリは EnergyApps.E{n}.mount() で起動する。 -->
<style>
/* ===== 各アプリのCSS(.e1〜.e5 接頭辞) ===== */
{{APP_CSS}}
/* ===== 統合シェル(.ea- 接頭辞) ===== */
html,body{margin:0;height:100%;background:#eef3f8;}
body{overflow:hidden}
.ea{--ink:#1d2b3a;--sub:#5b6b7c;--line:#d5dee8;--accent:#1e6fd9;
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;
  color:var(--ink);height:100%;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;font-size:16px}
.ea *{box-sizing:border-box}
.ea-view{flex:1;min-height:0;display:none;flex-direction:column}
.ea-view.on{display:flex}
.ea-btn{font:inherit;font-size:15px;color:var(--ink);background:#e3ebf4;border:none;border-radius:10px;padding:0 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;touch-action:manipulation;white-space:nowrap;flex:none}
.ea-btn[disabled]{opacity:.55;cursor:default}
.ea-btn:active{transform:translateY(1px)}
.ea-btn:focus-visible,.ea-card:focus-visible,.ea-chip:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.ea-btn.danger{background:#fde2e2;color:#a61e1e}
.ea-btn.primary{background:var(--accent);color:#fff;font-weight:bold}

/* --- トップ画面 --- */
.ea-home{overflow:auto;background:linear-gradient(160deg,#eef3f8 0%,#e6eef7 100%)}
.ea-hd{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;padding:22px 32px 6px}
.ea-hd .tt{min-width:0;flex:1 1 420px}
.ea-hd .bt{display:flex;gap:10px;flex-wrap:wrap}
.ea-hd h1{margin:0;font-size:30px;letter-spacing:.02em}
.ea-hd .s{color:var(--sub);font-size:15px;margin-top:4px}
.ea-flow{padding:4px 32px 10px;color:var(--sub);font-size:15px}
.ea-flow b{color:var(--ink)}
.ea-flow rt,.ea-hbody rt{font-size:12px}
.ea-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;padding:6px 32px 24px}
.ea-card{grid-column:span 2;font:inherit;color:inherit;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 18px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:236px;box-shadow:0 2px 6px rgba(29,43,58,.06);touch-action:manipulation;position:relative}
.ea-card:nth-child(4){grid-column:2 / span 2}
.ea-card:active{transform:translateY(2px)}
.ea-card .ic{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff}
.ea-card .no{font-size:14px;font-weight:bold;color:var(--sub)}
.ea-card .nm{font-size:23px;font-weight:bold}
.ea-card .ds{font-size:15px;color:var(--sub);line-height:1.5}
.ea-card .tg{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin-top:2px}
.ea-card .tg span{font-size:13px;background:#eef3f8;border-radius:999px;padding:3px 10px;color:#33475b}
.ea-card .go{align-self:flex-end;font-weight:bold;font-size:16px;padding:8px 16px;border-radius:10px;color:#fff}
.ea-card .top{display:flex;gap:14px;align-items:center}
.ea-card .pg{display:flex;flex-direction:column;gap:3px;font-size:14px;color:#33475b}
.ea-card .pg b{font-size:15px;color:var(--ink)}
.ea-card .pg .bar{height:8px;border-radius:999px;background:#e3ebf4;overflow:hidden}
.ea-card .pg .bar i{display:block;height:100%;border-radius:999px}
.ea-card .pg .s2{font-size:13px;color:var(--sub)}
.ea-foot{padding:0 32px 22px;color:var(--sub);font-size:13px}

/* --- アプリ画面 --- */
.ea-bar{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;background:#0f1d2c;color:#fff}
.ea-bar .ea-btn{min-height:44px;background:#24384d;color:#fff;font-size:15px;padding:0 12px}
.ea-bar .home{background:#ffb703;color:#1d2b3a;font-weight:bold}
.ea-chips{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.ea-chips::-webkit-scrollbar{display:none}
.ea-chip{font:inherit;font-size:15px;color:#dbe5ef;background:transparent;border:none;border-radius:10px;min-height:44px;padding:0 10px;cursor:pointer;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:5px;touch-action:manipulation;border-bottom:4px solid transparent}
.ea-chip.cur{background:#fff;color:#0f1d2c;font-weight:bold}
.ea-chip .no{opacity:.8;font-size:14px}
.ea-panes{flex:1;min-height:0;position:relative}
.ea-pane{position:absolute;inset:0;display:none}
.ea-pane.on{display:block}
.ea-pane>div{height:100%}
.ea-err{padding:30px;font-size:18px}

/* --- 使い方 --- */
.ea-help{background:#f6f8fb}
.ea-help .bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:10px 20px;border-bottom:1px solid var(--line);background:#fff}
.ea-help .bar h2{margin:0;font-size:22px;flex:1;white-space:nowrap}
.ea-tabs{display:flex;gap:6px;flex-wrap:wrap}
.ea-tabs .ea-btn.on{background:var(--accent);color:#fff;font-weight:bold}
.ea-hbody{flex:1;overflow:auto;padding:6px 32px 40px;line-height:1.7;font-size:16.5px;-webkit-overflow-scrolling:touch}
.ea-hbody h3{font-size:19px;margin:22px 0 6px;padding-left:10px;border-left:5px solid var(--accent)}
.ea-hbody li{margin:3px 0}
.ea-hbody code{background:#e8eef5;padding:1px 6px;border-radius:5px;font-size:.92em}
.ea-hgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ea-hcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.ea-hcard h4{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.ea-hcard p{margin:4px 0;font-size:15px;line-height:1.6}
.ea-hic{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.ea-tip{color:#5b4a00;background:#fff6d6;border-radius:8px;padding:4px 8px}
.ea-tbl{border-collapse:collapse;background:#fff}
.ea-tbl th,.ea-tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;font-size:15px;vertical-align:top}
.ea-tbl th{background:#e8eef5}
.ea-tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ea-note{color:var(--sub);font-size:14px}
.ea-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2b3a;color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;z-index:99;display:none}

@media (max-width:900px){
  .ea-hd{padding:16px 16px 6px}
  .ea-hd h1{font-size:26px}
  .ea-flow{padding:4px 16px 10px}
  .ea-cards{gap:12px;padding:6px 16px 20px}
  .ea-foot{padding:0 16px 20px}
  .ea-chip{padding:0 8px}
  .ea-hbody{padding:6px 16px 40px}
  .ea-help .bar{padding:8px 12px}
}
@media (max-width:760px){ .ea-chip .sn{display:none} .ea-chip{padding:0 12px} }
@media (max-width:1100px){
  .ea-cards{grid-template-columns:repeat(2,1fr)}
  .ea-card,.ea-card:nth-child(4){grid-column:auto}
  .ea-hgrid{grid-template-columns:1fr}
}
@media (max-height:720px){ .ea-card{min-height:200px} .ea-hd{padding-top:14px} }
@media print{
  html,body{height:auto;overflow:visible}
  .ea{height:auto;display:block}
  .ea-bar,.ea-home,.ea-help{display:none!important}
  .ea-app,.ea-panes,.ea-pane.on{display:block;position:static;height:auto}
  .ea-pane:not(.on){display:none!important}
}
</style>
</head>
<body>
<div class="ea" id="ea">
  <!-- トップ画面 -->
  <section class="ea-view ea-home" data-view="home" aria-label="トップ画面">
    <div class="ea-hd">
      <div class="tt">
        <h1>⚡ エネルギー変換 学習アプリ</h1>
        <div class="s">中学校 技術分野「エネルギー変換の技術」 ・ インターネットなしで動きます</div>
      </div>
      <div class="bt">
        <button class="ea-btn" data-ea="help">❓ 使い方</button>
        <button class="ea-btn" data-ea="help-t">🧑‍🏫 先生向け</button>
      </div>
    </div>
    <div class="ea-flow">おすすめの順番:<b>E1</b> エネルギー変換 → <b>E2</b> 電気回路 → <b>E3</b> <ruby>機構<rt>きこう</rt></ruby> → <b>E4</b> 保守点検 → <b>E5</b> 回路の設計</div>
    <div class="ea-cards" data-ref="cards"></div>
    <div class="ea-foot">学習の記録はこの端末のブラウザに自動で保存されます。カードには進み具合が出ます。アプリの中では、上の「🏠 トップ」でここにもどれます。</div>
  </section>

  <!-- アプリ画面 -->
  <section class="ea-view ea-app" data-view="app">
    <div class="ea-bar">
      <button class="ea-btn home" data-ea="home" aria-label="トップ画面にもどる">🏠 トップ</button>
      <nav class="ea-chips" data-ref="chips" aria-label="アプリを切りかえる"></nav>
    </div>
    <div class="ea-panes" data-ref="panes"></div>
  </section>

  <!-- 使い方 -->
  <section class="ea-view ea-help" data-view="help" aria-label="使い方">
    <div class="bar">
      <button class="ea-btn" data-ea="back">◀ もどる</button>
      <h2>使い方</h2>
      <div class="ea-tabs">
        <button class="ea-btn" data-ea="tab-s">🧑‍🎓 生徒向け</button>
        <button class="ea-btn" data-ea="tab-t">🧑‍🏫 先生向け</button>
      </div>
    </div>
    <div class="ea-hbody" data-tab="s">{{HELP_STUDENT}}</div>
    <div class="ea-hbody" data-tab="t" hidden>{{HELP_TEACHER}}</div>
  </section>
  <div class="ea-toast" data-ref="toast" role="status"></div>
</div>

<!-- ===== 各アプリのスクリプト ===== -->
{{APP_JS}}

<!-- ===== 統合シェル ===== -->
<script>
(function () {
'use strict';
var APPS = {{APPS_JSON}};
var EA = window.EnergyApps || {};
var root = document.getElementById('ea');
var $ = function (s) { return root.querySelector(s); };
var refs = { cards: $('[data-ref="cards"]'), chips: $('[data-ref="chips"]'), panes: $('[data-ref="panes"]'), toast: $('[data-ref="toast"]') };
var KEY = function (id) { return 'energyApps.' + id + '.v1'; };
var mounted = {}, cur = null, fromHome = false, helpPushed = false, lastView = 'home';

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function byId(id) { for (var i = 0; i < APPS.length; i++) if (APPS[i].id === id) return APPS[i]; return null; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ---- 進み具合(各アプリの保存データ energyApps.E{n}.v1 を読むだけ。書きこまない) ---- */
function readSave(id) {
  var s = lsGet(KEY(id)); if (!s) return null;
  try { var d = JSON.parse(s); return d && typeof d === 'object' && !Array.isArray(d) ? d : null; } catch (e) { return null; }
}
function appTest(id) { try { return EA[id] && EA[id]._test || null; } catch (e) { return null; } }
function isObj(o) { return o && typeof o === 'object' && !Array.isArray(o); }
function countIds(ids, obj, ok) { var n = 0; ids.forEach(function (k) { if (ok(obj[k])) n++; }); return n; }
function truthy(v) { return !!v; }
var PROG = {
  E1: function (d) {
    var stars = isObj(d.stars) ? d.stars : {}, t = appTest('E1'), st = t && t.STAGES ? t.STAGES.filter(function (x) { return !x.free; }) : null;
    var ids = st ? st.map(function (x) { return x.id; }) : ['s1', 's2', 's3', 's4', 's5', 's6', 's7', 's8'];
    var max = st ? st.reduce(function (m, x) { return m + (x.stars ? x.stars.length : 3); }, 0) : ids.length * 3;
    var got = ids.reduce(function (m, k) { return m + Math.max(0, Math.min(3, +stars[k] || 0)); }, 0);
    return { n: countIds(ids, stars, function (v) { return +v > 0; }), t: ids.length, main: 'ステージ', end: 'クリア', sub: '★ ' + got + ' / ' + max };
  },
  E2: function (d) {
    var cl = isObj(d.cleared) ? d.cleared : {}, t = appTest('E2');
    var ids = t && t.CHALS ? t.CHALS.map(function (x) { return x.id; }) : ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8', 'c9', 'c10', 'c11'];
    var safe = Object.keys(cl).filter(function (k) { return /^s\d+$/.test(k) && cl[k]; }).length;
    return { n: countIds(ids, cl, truthy), t: ids.length, main: '課題', end: 'クリア', sub: safe ? '安全体験 ' + safe + ' つ' : '' };
  },
  E3: function (d) {
    var tk = isObj(d.tasks) ? d.tasks : {}, t = appTest('E3');
    var ids = t && t.TASKS ? t.TASKS.map(function (x) { return x.id; }) : null;
    var n = ids ? countIds(ids, tk, function (v) { return +v > 0; }) : Object.keys(tk).filter(function (k) { return +tk[k] > 0; }).length;
    var tot = ids ? ids.length : 12;
    return { n: Math.min(n, tot), t: tot, main: '設計課題', end: 'クリア', sub: typeof d.quizBest === 'number' && d.quizBest >= 0 ? 'ブラックボックス 最高 ' + d.quizBest + '問正解' : '' };
  },
  E4: function (d) {
    var D = window.EnergyApps && window.EnergyApps.E4data, seen = isObj(d.seenP) ? d.seenP : {};
    var ids = D && D.ORDER ? D.ORDER : null, n = ids ? countIds(ids, seen, truthy) : Object.keys(seen).filter(function (k) { return seen[k]; }).length;
    var tot = ids ? ids.length : 17, sub = [];
    if (D && D.MACHINES && isObj(d.found)) {
      var f = 0, ft = 0;
      D.MACHINES.forEach(function (m) { var fm = isObj(d.found[m.id]) ? d.found[m.id] : {}; (m.hot || []).forEach(function (h) { ft++; if (fm[h.id]) f++; }); });
      if (f) sub.push('部品さがし ' + f + ' / ' + ft);
    }
    if (Array.isArray(d.lists) && d.lists.length) sub.push('点検表 ' + d.lists.length + ' まい');
    return { n: Math.min(n, tot), t: tot, main: '部品図鑑', end: '見た', sub: sub.join(' ・ ') };
  },
  E5: function (d) {
    var ds = isObj(d.designs) ? d.designs : {}, t = appTest('E5');
    var tasks = t && t.TASKS ? t.TASKS : null, ids = tasks ? tasks.map(function (x) { return x.id; }) : Object.keys(ds);
    var n = countIds(ids, ds, function (v) { return v && Array.isArray(v.parts) && v.parts.length > 0; }), cur = '';
    if (tasks && d.task) tasks.forEach(function (x) { if (x.id === d.task) cur = 'いまの課題: ' + (x.icon ? x.icon + ' ' : '') + x.title; });
    return tasks ? { n: n, t: ids.length, main: '回路図をかいた課題', end: '', sub: cur } : null;
  }
};
function progressOf(id) {
  var d = readSave(id); if (!d) return null;
  try { var p = PROG[id] && PROG[id](d); return p && isFinite(p.n) && p.t > 0 ? p : { n: 0, t: 0 }; } catch (e) { return { n: 0, t: 0 }; }
}
function progressHtml(a, p) {
  if (!p || !p.t) return '';
  var pct = Math.round(100 * Math.min(1, p.n / p.t));
  return '<div class="pg"><span>' + esc(p.main) + ' <b>' + p.n + ' / ' + p.t + '</b>' + (p.end ? ' ' + esc(p.end) : '') + '</span>' +
    '<span class="bar" role="img" aria-label="' + esc(p.main + ' ' + p.n + '/' + p.t) + '"><i style="width:' + pct + '%;background:' + a.color + '"></i></span>' +
    (p.sub ? '<span class="s2">' + esc(p.sub) + '</span>' : '') + '</div>';
}

/* ---- 画面を組み立てる ---- */
function renderCards() {
  refs.cards.innerHTML = APPS.map(function (a) {
    var p = progressOf(a.id);
    return '<button class="ea-card" data-open="' + a.id + '" style="border-top:6px solid ' + a.color + '">' +
      '<div class="top"><span class="ic" style="background:' + a.color + '">' + a.icon + '</span>' +
      '<div><div class="no">' + a.id + '</div><div class="nm">' + esc(a.name) + '</div></div></div>' +
      '<div class="ds">' + esc(a.sub) + '</div>' +
      '<div class="tg">' + a.tags.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>' +
      progressHtml(a, p) +
      '<span class="go" style="background:' + a.color + '">' + (p && p.n > 0 ? '▶ つづきから' : '▶ はじめる') + '</span></button>';
  }).join('');
}
refs.chips.innerHTML = APPS.map(function (a) {
  return '<button class="ea-chip" data-chip="' + a.id + '" aria-label="' + a.id + ' ' + esc(a.name) + '" title="' + a.id + ' ' + esc(a.name) + '" style="border-bottom-color:' + a.color + '">' +
    '<span aria-hidden="true">' + a.icon + '</span><span class="no">' + a.id + '</span><span class="sn">' + esc(a.short) + '</span></button>';
}).join('');
refs.panes.innerHTML = APPS.map(function (a) { return '<div class="ea-pane" data-pane="' + a.id + '"><div></div></div>'; }).join('');

/* ---- 表示切りかえ(URLの #E1〜#E5 / #help で決まる) ---- */
function setView(v) {
  [].forEach.call(root.querySelectorAll('.ea-view'), function (el) { el.classList.toggle('on', el.getAttribute('data-view') === v); });
}
function openApp(id) {
  setView('app');
  [].forEach.call(refs.panes.children, function (p) { p.classList.toggle('on', p.getAttribute('data-pane') === id); });
  [].forEach.call(refs.chips.children, function (c) { var on = c.getAttribute('data-chip') === id; c.classList.toggle('cur', on); c.setAttribute('aria-current', on ? 'page' : 'false'); });
  APPS.forEach(function (a) { document.body.classList.toggle('ea-on-' + a.id, a.id === id); });
  cur = id; lastView = id;
  document.title = byId(id).icon + ' ' + id + ' ' + byId(id).name + ' - エネルギー変換 学習アプリ';
  if (!mounted[id]) {
    var host = refs.panes.querySelector('[data-pane="' + id + '"]>div');
    try {
      if (!EA[id] || !EA[id].mount) throw new Error('アプリが読みこめませんでした');
      EA[id].mount(host); mounted[id] = true;
    } catch (e) {
      host.innerHTML = '<div class="ea-err">⚠️ ' + id + ' を開けませんでした。ページを読み込み直してください。<br><small>' + esc(e && e.message || e) + '</small></div>';
      if (window.console) console.error(e);
    }
  }
  var r = refs.panes.querySelector('[data-pane="' + id + '"] .' + id.toLowerCase());
  if (r && r.focus && !r.contains(document.activeElement)) { try { r.focus({ preventScroll: true }); } catch (e) {} }
}
function openHelp(tab) {
  setView('help');
  showTab(tab || 's');
  APPS.forEach(function (a) { document.body.classList.remove('ea-on-' + a.id); });
  document.title = '使い方 - エネルギー変換 学習アプリ';
  if (tab === 't') renderResets();
}
function showTab(t) {
  [].forEach.call(root.querySelectorAll('.ea-hbody'), function (b) { b.hidden = b.getAttribute('data-tab') !== t; });
  $('[data-ea="tab-s"]').classList.toggle('on', t === 's');
  $('[data-ea="tab-t"]').classList.toggle('on', t === 't');
}
function openHome() {
  setView('home'); renderCards(); cur = null; lastView = 'home'; fromHome = false;
  APPS.forEach(function (a) { document.body.classList.remove('ea-on-' + a.id); });
  document.title = 'エネルギー変換 学習アプリ(E1〜E5)';
}
function route() {
  var h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (byId(h)) openApp(h);
  else if (h === 'help' || h === 'help-t') openHelp(h === 'help-t' ? 't' : 's');
  else openHome();
}
function setHash(h, push) {
  if (push) location.hash = h;
  else location.replace('#' + h);
}

/* ---- 操作 ---- */
root.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-open],[data-chip],[data-ea],[data-reset]');
  if (!t || !root.contains(t) || refs.panes.contains(t)) return;
  var open = t.getAttribute('data-open'), chip = t.getAttribute('data-chip'), act = t.getAttribute('data-ea'), rs = t.getAttribute('data-reset');
  if (open) { fromHome = true; setHash(open, true); }
  else if (chip) { if (chip !== cur) setHash(chip, false); }
  else if (rs) resetApp(rs);
  else if (act === 'home') { if (fromHome) { fromHome = false; history.back(); } else setHash('', false); }
  else if (act === 'help' || act === 'help-t') { helpPushed = true; setHash(act, true); }
  else if (act === 'back') { if (helpPushed) { helpPushed = false; history.back(); } else setHash(lastView === 'home' ? '' : lastView, false); }
  else if (act === 'tab-s' || act === 'tab-t') { setHash(act === 'tab-t' ? 'help-t' : 'help', false); }
  else if (act === 'export') exportAll();
  else if (act === 'import') $('[data-ea-file]').click();
});
window.addEventListener('hashchange', route);

/* ---- 学習記録の書き出し・読み込み・消去(先生向け) ---- */
function toast(msg) {
  refs.toast.textContent = msg; refs.toast.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(function () { refs.toast.style.display = 'none'; }, 2600);
}
function exportAll() {
  var data = {};
  APPS.forEach(function (a) { var v = lsGet(KEY(a.id)); if (v != null) data[KEY(a.id)] = v; });
  if (!Object.keys(data).length) { toast('まだ記録がありません。'); return; }
  var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
  var name = 'energy-apps-kiroku-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '.json';
  var blob = new Blob([JSON.stringify({ schema: 'energyApps.backup', version: 1, saved: d.toISOString(), data: data }, null, 1)], { type: 'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('「' + name + '」を書き出しました。');
}
$('[data-ea-file]').addEventListener('change', function (ev) {
  var f = ev.target.files && ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    var j = null; try { j = JSON.parse(rd.result); } catch (e) {}
    if (!j || j.schema !== 'energyApps.backup' || !j.data || typeof j.data !== 'object') { alert('このファイルは学習記録のファイルではありません。\n(「全アプリの記録をファイルに書き出す」で作ったファイルをえらんでください)'); return; }
    var keys = Object.keys(j.data).filter(function (k) { return /^energyApps\.E[1-5]\.v1$/.test(k) && typeof j.data[k] === 'string'; });
    if (!keys.length) { alert('読み込める記録がありませんでした。'); return; }
    if (!confirm(keys.map(function (k) { return k.split('.')[1]; }).join('・') + ' の記録を読み込みます。\nこの端末の今の記録は上書きされます。よろしいですか?')) return;
    try { keys.forEach(function (k) { localStorage.setItem(k, j.data[k]); }); } catch (e) { alert('保存できませんでした: ' + e.message); return; }
    location.reload();
  };
  rd.readAsText(f);
});
function renderResets() {
  var box = $('[data-ea-resets]'); if (!box) return;
  box.innerHTML = APPS.map(function (a) {
    var has = !!lsGet(KEY(a.id));
    return '<button class="ea-btn danger" data-reset="' + a.id + '"' + (has ? '' : ' disabled') + '>🗑️ ' + a.id + ' の記録を消す' + (has ? '' : '(記録なし)') + '</button>';
  }).join('');
}
function resetApp(id) {
  var a = byId(id); if (!a) return;
  if (!confirm(a.id + '「' + a.name + '」の記録(★・回路・回答など)をすべて消します。\n元にはもどせません。よろしいですか?')) return;
  try { localStorage.removeItem(KEY(id)); } catch (e) {}
  location.reload();
}

route();
})();
</script>
</body>
