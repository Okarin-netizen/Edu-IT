<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E1 エネルギー変換ゲーム</title>
<style>
html,body{margin:0;height:100%;background:#eef3f8;}
.e1{--ink:#1d2b3a;--sub:#5b6b7c;--line:#d5dee8;--accent:#1e6fd9;--ok:#1a9b5b;--ng:#d93a3a;--warn:#f08c00;
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;
  color:var(--ink);height:100%;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;
  font-size:16px;overflow:hidden;position:relative;background:#eef3f8;-webkit-tap-highlight-color:transparent;}
.e1 *{box-sizing:border-box}
.e1 button{font:inherit;touch-action:manipulation}
.e1 rt{font-size:.55em;font-weight:normal}
.e1-top{height:58px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#1d3557;color:#fff;flex:none;border-bottom:4px solid #1e6fd9}
.e1-top h1{font-size:17px;margin:0 6px 0 0;white-space:nowrap;font-weight:bold}
.e1-stitle{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.e1-stitle .t{font-size:17px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e1-stitle .l{font-size:13px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e1-btn{min-height:46px;min-width:46px;padding:0 14px;border-radius:12px;border:2px solid transparent;background:#e3ebf5;color:var(--ink);font-weight:bold;cursor:pointer;font-size:16px}
.e1-btn:active{transform:translateY(1px)}
.e1-btn:disabled{opacity:.45;cursor:default;transform:none}
.e1-top .e1-btn{background:#2f4f7a;color:#fff;white-space:nowrap;padding:0 12px;flex:none}
.e1-btn.primary{background:var(--accent);color:#fff}
.e1-btn.danger{background:#fde2e2;color:#a61e1e}
.e1-btn.go{background:var(--accent);color:#fff;font-size:21px;min-height:64px;width:100%;box-shadow:0 3px 0 #134a94}
.e1-main{flex:1;display:flex;min-height:0}
.e1-palwrap{position:relative;width:220px;flex:none;background:#fff;border-right:1px solid var(--line);min-height:0}
.e1-pal{position:absolute;inset:0;overflow-y:auto;padding:8px}
.e1-palmore{position:absolute;left:0;right:0;bottom:0;padding:18px 0 8px;text-align:center;font-size:15px;font-weight:bold;color:#1d3557;background:linear-gradient(rgba(255,255,255,0),#fff 55%);pointer-events:none;display:none}
.e1-palmore.on{display:block}
.e1-pal h2,.e1-side h2{font-size:15px;margin:4px 2px 6px;color:var(--sub)}
.e1-palgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.e1-pi{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 2px;border-radius:12px;border:2px solid var(--line);background:#f8fbff;touch-action:pan-y;cursor:pointer;min-height:76px;text-align:center}
.e1-pi.sel{border-color:var(--accent);background:#dcebff;box-shadow:0 0 0 3px #9cc3ff}
.e1-pi.empty{opacity:.38}
.e1-pi .hd{display:flex;align-items:center;justify-content:center;gap:2px;font-weight:bold;font-size:14px;line-height:1.2}
.e1-pi .ic{font-size:21px;line-height:28px}
.e1-pi .nm{white-space:nowrap;letter-spacing:-.04em}
.e1-pi .sb{font-size:13px;color:var(--sub);line-height:1.35;margin-top:2px;white-space:nowrap}
.e1-pi .left{font-size:13px;color:#1d3557;font-weight:bold;line-height:1.35}
.e1-pill{display:inline-block;padding:0 4px;border-radius:7px;color:#fff;font-size:13px;font-weight:bold;line-height:18px}
.e1-center{flex:1;display:flex;flex-direction:column;min-width:0}
.e1-msg{height:62px;flex:none;overflow-y:auto;padding:6px 14px;font-size:16px;background:#fffbe6;border-bottom:1px solid #f1e3a6;line-height:1.4;display:flex}
.e1-msg>span{margin:auto 0}
.e1-msg.err{background:#ffe8e8;border-color:#f5b5b5;color:#8a1414}
.e1-msg.ok{background:#e6f8ee;border-color:#a8e0c0}
.e1-boardbox{flex:1;min-height:0;position:relative}
.e1-board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.e1-cell{fill:#f7fafd;stroke:#d5dee8;stroke-width:1.5;stroke-dasharray:5 5}
.e1-cell.pickable{fill:#eaf3ff;stroke:#8fb8f0}
.e1-cell.hover{fill:#cfe3ff;stroke:var(--accent);stroke-dasharray:none}
.e1-nbox{fill:#fff;stroke:#9aaabb;stroke-width:2.5}
.e1-node.src .e1-nbox{fill:#fff4e0;stroke:#e8a33d}
.e1-node.conv .e1-nbox{fill:#eef6ff;stroke:#5c8fd6}
.e1-node.goal .e1-nbox{fill:#eafaf0;stroke:#2f9e5a;stroke-width:3}
.e1-node.goal.short .e1-nbox{fill:#fff0f0;stroke:#d94848}
.e1-node.sel .e1-nbox{stroke:#1e6fd9;stroke-width:6}
.e1-node.over .e1-nbox{stroke:#e8590c;stroke-width:6;fill:#ffe3d3}
.e1-node.idle .e1-nbox{stroke-dasharray:7 5}
.e1-nic{font-size:30px;text-anchor:middle;dominant-baseline:central}
.e1-nname{font-size:16px;font-weight:bold;text-anchor:middle;fill:#1d2b3a}
.e1-nsub{font-size:14px;text-anchor:middle;fill:#3d4d5c}
.e1-badge{font-size:14px;font-weight:bold;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.e1-loss{font-size:16px;font-weight:bold;fill:#d9480f;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;animation:e1float 1.8s ease-in-out infinite}
.e1-elabel{font-size:16px;font-weight:bold;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:5px}
.e1-flow{fill:none;stroke:#fff;stroke-opacity:.9;stroke-dasharray:4 12;animation:e1dash .9s linear infinite;pointer-events:none}
.e1-running .e1-flow{animation-duration:.35s}
.e1-ehit{stroke:transparent;stroke-width:36;fill:none;cursor:pointer}
.e1-ex{cursor:pointer}
.e1-ex .hit{fill:transparent}
.e1-ex .vis{fill:#fff;stroke:#8193a6;stroke-width:2}
.e1-ex text{font-size:19px;font-weight:bold;fill:#4a5a6a;text-anchor:middle;dominant-baseline:central;pointer-events:none}
@keyframes e1dash{to{stroke-dashoffset:-16}}
@keyframes e1float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes e1pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.e1-flow,.e1-loss,.e1-star{animation:none!important}}
.e1-side{width:286px;flex:none;overflow-y:auto;padding:10px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.e1-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbfdff}
.e1-goalrow{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:15px}
.e1-goalrow .ic{font-size:22px}
.e1-bar{height:12px;background:#e6ecf2;border-radius:6px;overflow:hidden;margin-top:3px}
.e1-bar>i{display:block;height:100%;background:var(--ok);border-radius:6px}
.e1-bar.ng>i{background:var(--ng)}
.e1-bar.mid>i{background:var(--warn)}
.e1-bar.neu>i{background:#5b8fd0}
.e1-meter{margin:6px 0;font-size:15px}
.e1-meter b{font-size:17px}
.e1-meter small{font-size:13px;color:var(--sub)}
.e1-note{font-size:13px;color:var(--sub);line-height:1.5}
.e1-slots{display:flex;gap:6px;flex-wrap:wrap}
.e1-slots .e1-btn{flex:1 1 40%;padding:0 6px;font-size:15px;min-height:44px;white-space:nowrap}
.e1-slots .e1-btn.on{background:#1d3557;color:#fff}
.e1-acts{display:flex;flex-direction:column;gap:8px}
.e1-info{font-size:15px;line-height:1.6}
.e1-info .ttl{font-size:17px;font-weight:bold;margin-bottom:4px}
.e1-elist{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.e1-elist .e1-btn{font-size:15px;min-height:44px;text-align:left;padding:4px 10px}
.e1-row{display:flex;gap:8px;margin-top:8px}
.e1-row .e1-btn{flex:1}
.e1-clearrow{display:flex;justify-content:flex-end;margin-top:14px}
.e1-ghost{position:absolute;pointer-events:none;font-size:40px;transform:translate(-50%,-50%);z-index:50;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.e1-ov{position:absolute;inset:0;background:rgba(20,30,45,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.e1-modal{background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:100%;overflow-y:auto;padding:20px 24px 0;box-shadow:0 10px 40px rgba(0,0,0,.3);font-size:17px;line-height:1.7}
.e1-modal h2{margin:0 0 10px;font-size:23px}
.e1-modal h3{margin:14px 0 6px;font-size:18px}
.e1-modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:#fff;margin-top:14px;padding:12px 0 16px;border-top:1px solid #e3e9ef;z-index:2}
.e1-modal .acts .e1-btn{min-width:150px;min-height:54px;font-size:18px}
.e1-modal details{margin:12px 0 4px;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.e1-modal summary{min-height:50px;display:flex;align-items:center;font-weight:bold;cursor:pointer;color:#1d3557}
.e1-stars{font-size:52px;text-align:center;letter-spacing:8px;margin:4px 0}
.e1-star{display:inline-block;animation:e1pop .5s both}
.e1-star.off{filter:grayscale(1);opacity:.25}
.e1-checks{list-style:none;padding:0;margin:6px 0}
.e1-checks li{padding:3px 0}
.e1-stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.e1-stcard{border:2px solid var(--line);border-radius:14px;padding:12px;background:#f8fbff;cursor:pointer;text-align:left;font:inherit;color:inherit;min-height:120px}
.e1-stcard.cur{border-color:var(--accent);background:#e6f0ff}
.e1-stcard .no{font-size:14px;color:var(--sub)}
.e1-stcard .t{font-size:18px;font-weight:bold;margin:2px 0;line-height:1.35}
.e1-stcard .l{font-size:14px;color:var(--sub);line-height:1.4}
.e1-stcard .s{font-size:20px;margin-top:4px}
.e1-stcard .q{font-size:14px;color:#1a7a48;font-weight:bold}
.e1-quiz .e1-btn{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 14px;font-weight:normal;font-size:17px;min-height:54px}
.e1-quiz .e1-btn.right{background:#d3f5e1;border-color:var(--ok)}
.e1-quiz .e1-btn.wrong{background:#ffe0e0;border-color:var(--ng)}
.e1-reason{background:#fff4f4;border-left:5px solid var(--ng);padding:8px 12px;margin:8px 0;border-radius:6px}
.e1-reason.tip{background:#fff9e6;border-color:var(--warn)}
.e1-table{border-collapse:collapse;width:100%;font-size:16px}
.e1-table td{border-bottom:1px solid #e3e9ef;padding:5px 8px}
.e1-table td:last-child{text-align:right;font-weight:bold}
.e1-sankey{width:100%;height:auto;background:#fafcff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.e1-sankey text{font-size:15px}
.e1-axis{display:grid;grid-template-columns:minmax(0,290px) 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:16px;line-height:1.35}
.e1-axis small{display:block;font-size:13px;color:var(--sub)}
.e1-steps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.e1-steps div{background:#f3f7fc;border-radius:12px;padding:12px;font-size:16px}
.e1-steps b{font-size:18px}
@media (max-width:1100px){.e1-top h1{display:none}.e1-btn.go{font-size:19px}}
@media (max-width:900px){
  .e1-stitle .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:15px;line-height:1.2}
  .e1-stitle .l{display:none}
  .e1-main{flex-direction:column}
  .e1-palwrap{width:auto;height:96px;flex:none;border-right:none;border-bottom:1px solid var(--line)}
  .e1-pal{overflow-x:auto;overflow-y:hidden;padding:8px}
  .e1-pal h2{display:none}
  .e1-palgrid{display:flex;gap:6px;width:max-content}
  .e1-pi{width:108px;min-height:78px;touch-action:pan-x}
  .e1-palmore{left:auto;top:0;right:0;bottom:0;width:44px;padding:0;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 55%);font-size:22px}
  .e1-palmore.on{display:flex}
  .e1-center{flex:none}
  .e1-boardbox{flex:none;width:100%;aspect-ratio:778/572}
  .e1-side{width:auto;flex:1;min-height:0;border-left:none;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:8px}
  .e1-side>*{min-width:0}
  .e1-side>.wide{grid-column:1/-1}
  .e1-acts{order:-2;flex-direction:row}
  .e1-acts .go{flex:2;min-height:56px}
  .e1-acts .e1-btn:not(.go){flex:1}
  .e1-side>.e1-info{order:-1}
  .e1-slots .e1-btn{flex:1}
  .e1-clearrow{margin-top:6px}
  .e1-stgrid{grid-template-columns:repeat(2,1fr)}
  .e1-modal{padding:16px 18px 0}
  .e1-axis{grid-template-columns:minmax(0,230px) 1fr 40px}
}
</style>
</head>
<body>
<div id="e1-app" class="e1"></div>
<script>
(function () {
'use strict';
var NS = window.EnergyApps = window.EnergyApps || {};
var STORE_KEY = 'energyApps.E1.v1';
var CELL = 110, COLS = 7, ROWS = 5, EPS = 1e-6;

/* ---------- エネルギーの形 ---------- */
var FORMS = {
  chem:   { name: '化学', ch: '化', color: '#9c36b5' },
  heat:   { name: '熱',   ch: '熱', color: '#e8590c' },
  motion: { name: '運動', ch: '運', color: '#2f9e44' },
  elec:   { name: '電気', ch: '電', color: '#1c7ed6' },
  light:  { name: '光',   ch: '光', color: '#e0a400' },
  pos:    { name: '位置', ch: '位', color: '#8d6e63' },
  nuc:    { name: '核',   ch: '核', color: '#495057' }
};

/* ---------- 部品カタログ ----------
 kind: src(エネルギー源) / conv(変換・伝達) / goal(使う所)
 cap: 源の最大出力(1マス分) eff: 変換効率 cost: 費用 co2: 使った量1あたりのCO2
 数値は授業用に丸めた目安。 */
var CAT = {
  kandenchi:{kind:'src',name:'乾電池',icon:'🔋',out:'elec',cap:10,cost:1,co2:0,
    desc:'中の薬品の化学変化で電気をつくる(化学エネルギー → 電気エネルギー)。このゲームでは、何本かを同じ部品につなぐと「直列」につないだことにして、電気が足されます(本当は、並列につないでも電圧は上がりません)。',tip:'使い終わったら、決められた回収に出そう。'},
  pedal:{kind:'src',name:'こぐ人',icon:'🚴',out:'motion',cap:20,cost:0,co2:0,
    desc:'食べ物の化学エネルギーを、筋肉でペダルを回す運動エネルギーに変える。'},
  coal:{kind:'src',name:'石炭',icon:'🪨',out:'chem',cap:100,cost:3,co2:1.0,
    desc:'大昔の植物からできた化石燃料(大昔の生物からできた燃料)。燃やすと熱が出るが、CO₂(二酸化炭素)を多く出す。',tip:'値段は安め。燃料はいつかなくなる。'},
  gas:{kind:'src',name:'天然ガス',icon:'🔥',out:'chem',cap:100,cost:4,co2:0.55,
    desc:'化石燃料。同じ量の熱を出すとき、CO₂は石炭の約半分。',tip:'燃料はいつかなくなる。'},
  uran:{kind:'src',name:'ウラン',icon:'☢️',out:'nuc',cap:200,cost:10,co2:0,
    desc:'原子力発電の燃料。核分裂(ウランの原子核が分かれること)で大量の熱を出す。運転中にCO₂をほとんど出さない。',tip:'放射性廃棄物(放射線を出すごみ)の処分や、事故を防ぐ安全対策が大きな課題。'},
  dam:{kind:'src',name:'ダムの水',icon:'🏞️',out:'pos',cap:40,cost:6,co2:0,
    desc:'高い所にためた水がもつ位置エネルギー。その日の天気には左右されにくい再生可能エネルギー(使ってもなくならないエネルギー)。',tip:'ダムをつくれる場所は限られる。雨の少ない年は水が減る。'},
  wind:{kind:'src',name:'風',icon:'🍃',out:'motion',cap:60,cost:2,co2:0,renew:'wind',only:'windmill',onlyMsg:'風は、そのままでは機械を回せません。まず「風車」で受け止めよう。',
    desc:'空気の流れがもつ運動エネルギー。日や時間によって強さが変わる。'},
  sun:{kind:'src',name:'太陽の光',icon:'☀️',out:'light',cap:100,cost:2,co2:0,renew:'sun',
    desc:'光エネルギー。くもりの日は少なく、夜は0になる。'},
  bio:{kind:'src',name:'バイオマス',icon:'🪵',out:'chem',cap:60,cost:4,co2:0.1,
    desc:'木くずなど生物からできた燃料。燃やすとCO₂が出るが、植物が育つときに吸ったCO₂なので、全体では増えにくいと考えられている。'},
  outlet:{kind:'src',name:'コンセント',icon:'🔌',out:'elec',cap:15,cost:0,co2:0,hard:true,maxOut:2,
    desc:'かべのコンセント。差し込み口は2つ。1か所で合計1500Wまで(定格:安全に使える上限)。'},

  boiler:{kind:'conv',name:'ボイラー',icon:'♨️',in:'chem',out:'heat',eff:0.9,cost:2,
    desc:'燃料を燃やして水をわかし、高温・高圧の蒸気をつくる(化学 → 熱)。',tip:'点検: 配管のさび・水もれ。'},
  reactor:{kind:'conv',name:'原子炉',icon:'⚛️',in:'nuc',out:'heat',eff:0.95,cost:8,
    desc:'ウランの核分裂の熱で蒸気をつくる(核 → 熱)。',tip:'放射線をもらさない厳重な管理と定期点検が必要。'},
  turbine:{kind:'conv',name:'タービン',icon:'💨',in:'heat',out:'motion',eff:0.45,cost:3,
    desc:'蒸気の力で羽根車を回す(熱 → 運動)。熱を運動に変えるとき、半分以上が熱のまま海や空気に捨てられる。',tip:'点検: 羽根の傷・軸受け(回る軸を支える部品)の摩耗(すり減ること)。'},
  gen:{kind:'conv',name:'発電機',icon:'🧲',in:'motion',out:'elec',eff:0.9,cost:2,
    desc:'磁石とコイルで回転を電気に変える(運動 → 電気、電磁誘導:磁石を動かすとコイルに電気が生まれるしくみ)。自転車ライトの発電機も同じしくみ。',tip:'点検: 軸受けの注油・コイルの絶縁(電気がもれないようにすること)。'},
  mill:{kind:'conv',name:'水車',icon:'🎡',in:'pos',out:'motion',eff:0.9,cost:3,
    desc:'高い所から落ちる水の力で羽根車を回す(位置 → 運動)。'},
  windmill:{kind:'conv',name:'風車',icon:'🌀',in:'motion',out:'motion',eff:0.4,cost:3,
    desc:'風の運動エネルギーの一部だけを羽根の回転に変える(理論上の上限は約59%)。'},
  panel:{kind:'conv',name:'太陽電池',icon:'🔲',in:'light',out:'elec',eff:0.2,cost:2,
    desc:'光が当たると電気が生まれる(光 → 電気)。ふつうのパネルの変換効率は約20%。',tip:'点検: パネル表面のよごれ。'},
  motor:{kind:'conv',name:'モーター',icon:'🔄',in:'elec',out:'motion',eff:0.85,cost:1,
    desc:'電気で回転する(電気 → 運動)。発電機と同じく磁石とコイルを使う。'},

/* ---------- 計算エンジン ---------- */
function demandOf(n, si) { var d = n.demand || [0]; return d[Math.min(si, d.length - 1)] || 0; }

function simulate(stage, board) {
  var nodes = board.nodes, byId = {}, ch = {}, pa = {};
  nodes.forEach(function (n) { byId[n.id] = n; ch[n.id] = []; pa[n.id] = []; });
  var edges = board.edges.filter(function (e) { return byId[e.from] && byId[e.to]; });
  edges.forEach(function (e) { ch[e.from].push(e); pa[e.to].push(e); });
  var indeg = {}, order = [], q = [];
  nodes.forEach(function (n) { indeg[n.id] = pa[n.id].length; if (!indeg[n.id]) q.push(n.id); });
  while (q.length) { var id = q.shift(); order.push(id); ch[id].forEach(function (e) { if (--indeg[e.to] === 0) q.push(e.to); }); }
  var R = { slots: [], loop: order.length < nodes.length, byId: byId, ch: ch, pa: pa, edges: edges, order: order };
  if (R.loop) return R;
  var absorb = {};
  for (var i = order.length - 1; i >= 0; i--) {
    var n0 = byId[order[i]], d0 = CAT[n0.type];
    absorb[n0.id] = d0.store ? true : (d0.kind === 'goal' ? false : ch[n0.id].some(function (e) { return absorb[e.to]; }));
  }
  var stored = {};
  nodes.forEach(function (n) { if (CAT[n.type].store) stored[n.id] = 0; });
  var dirty = {};
  order.forEach(function (id) { var d = CAT[byId[id].type]; dirty[id] = d.kind === 'src' ? d.co2 > 0 : pa[id].some(function (e) { return dirty[e.from]; }); });

  stage.slots.forEach(function (slot, si) {
    var pot = {}, outNeed = {}, eNeed = {}, flow = {}, inF = {}, out = {}, loss = {}, waste = {}, prod = {}, del = {}, over = {}, need = {}, caps = {};
    function capOf(n) { var d = CAT[n.type]; var f = d.renew ? (slot[d.renew] == null ? 1 : slot[d.renew]) : 1; return d.cap * f; }
    order.forEach(function (id) {
      var n = byId[id], d = CAT[n.type];
      if (d.kind === 'src') pot[id] = caps[id] = capOf(n);
      else if (d.kind === 'conv') { var s = 0; pa[id].forEach(function (e) { s += pot[e.from]; }); pot[id] = s * d.eff + (d.store ? stored[id] : 0); }
    });
    for (var j = order.length - 1; j >= 0; j--) {
      var id = order[j], n = byId[id], d = CAT[n.type], on = 0;
      ch[id].forEach(function (e) { on += eNeed[e.id] || 0; });
      outNeed[id] = on;
      var inNeed = 0;
      if (d.kind === 'goal') inNeed = demandOf(n, si);
      else if (d.kind === 'conv') inNeed = d.store ? Math.max(0, on - stored[id]) / d.eff : on / d.eff;
      need[id] = inNeed;
      if (d.kind !== 'src' && pa[id].length) splitNeed(pa[id], inNeed);
    }
    // CO2を出さない道を先に使い、足りない分だけ燃料の道に割り当てる
    function splitNeed(ps, inNeed) {
      var clean = ps.filter(function (e) { return !dirty[e.from]; }), dir = ps.filter(function (e) { return dirty[e.from]; });
      var Wc = 0; clean.forEach(function (e) { Wc += pot[e.from]; });
      var toC = dir.length ? Math.min(inNeed, Wc) : inNeed, rest = inNeed - toC;
      share(clean, toC, Wc); var Wd = 0; dir.forEach(function (e) { Wd += pot[e.from]; }); share(dir, rest, Wd);
    }
    function share(es, amt, W) { es.forEach(function (e) { eNeed[e.id] = W > EPS ? amt * pot[e.from] / W : amt / es.length; }); }
    order.forEach(function (id) {
      var n = byId[id], d = CAT[n.type], o = 0;
      if (d.kind === 'src') {
        var c = caps[id];
        if (d.hard && outNeed[id] > c + EPS) over[id] = outNeed[id];
        o = ch[id].length ? (absorb[id] ? c : Math.min(c, outNeed[id])) : 0;
        prod[id] = o;
      } else {
        var inp = 0; pa[id].forEach(function (e) { inp += flow[e.id] || 0; });
        inF[id] = inp;
        if (d.cap && inp > d.cap + EPS) over[id] = inp;
        if (d.kind === 'goal') { del[id] = inp; return; }

/* 電源の評価(授業用の目安)。どの組み合わせにも長所と短所があり、すべてが100になる組み合わせはない。

  bio: { stab: 0.9, safe: 0.8, fuel: 0.4 }, dam: { stab: 0.8, safe: 0.7, fuel: 0 }, wind: { stab: 0.3, safe: 0.9, fuel: 0 },
  sun: { stab: 0.2, safe: 0.9, fuel: 0 }, kandenchi: { stab: 0.3, safe: 0.7, fuel: 1 }, pedal: { stab: 0.2, safe: 1, fuel: 0 },

}

    }
  });
  function end(ev, cancel) {
    var d = S.drag; S.drag = null; if (!d) return;
    var dl = svg.querySelector('[data-ref=dragline]'); if (dl) dl.setAttribute('visibility', 'hidden');
    hoverCell(null);
    if (cancel) return;
    var cell = cellOf(svgPoint(ev));
    // 少し指がずれても、同じマスで離したらタップとして扱う
    if (!d.moved || (cell && d.cell && cell.c === d.cell.c && cell.r === d.cell.r)) { if (d.cell) tapCell(d.cell); return; }
    if (!d.node || !cell) return;
    var t = nodeAt(cell.c, cell.r);
    if (t && t !== d.node) { S.sel = null; if (!link(d.node, t)) render(); }
    else if (!t) { S.sel = null; moveNode(d.node, cell.c, cell.r); if (!d.node.fixed) say('「' + CAT[d.node.type].name + '」を動かしました。まちがえたときは「↩ もどす」。'); }
  }
  svg.addEventListener('pointerup', function (ev) { end(ev, false); });
  svg.addEventListener('pointercancel', function (ev) { end(ev, true); });

  S.el.pal.addEventListener('pointerdown', function (ev) {
    var it = ev.target.closest('[data-pal]'); if (!it || S.ov) return;
    S.pdrag = { type: it.getAttribute('data-pal'), x: ev.clientX, y: ev.clientY, moved: false, ghost: null };
  });
  S.el.pal.addEventListener('scroll', updPalMore);
  window.addEventListener('resize', function () { updPalMore(); });
  S.root.addEventListener('pointermove', function (ev) {
    var d = S.pdrag; if (!d) return;
    var dx = ev.clientX - d.x, dy = ev.clientY - d.y;
    // 横向き:パレットは左にあるので横に引っぱる。縦向き:パレットは上にあるので下へ引っぱる
    var start = isPortrait() ? (dy > 18 && Math.abs(dy) > Math.abs(dx)) : (Math.abs(dx) > 18 && Math.abs(dx) > Math.abs(dy));
    if (!d.moved && start) {
      if (remaining(d.type) <= 0) { S.pdrag = null; return; }
      d.moved = true; d.ghost = document.createElement('div'); d.ghost.className = 'e1-ghost'; d.ghost.textContent = CAT[d.type].icon; S.root.appendChild(d.ghost);
      try { ev.target.releasePointerCapture && ev.target.releasePointerCapture(ev.pointerId); } catch (e) {}
    }
    if (d.moved) {
      var rb = S.root.getBoundingClientRect();
      d.ghost.style.left = (ev.clientX - rb.left) + 'px'; d.ghost.style.top = (ev.clientY - rb.top) + 'px';
      hoverCell(overBoard(ev) ? cellOf(svgPoint(ev)) : null);
    }
  });
  S.root.addEventListener('pointerup', function (ev) {
    var d = S.pdrag; if (!d) return; S.pdrag = null;
    hoverCell(null);
    if (d.ghost) d.ghost.remove();
    if (!d.moved) {
      if (!ev.target.closest('[data-pal]')) return;
      if (remaining(d.type) <= 0) { say('「' + CAT[d.type].name + '」はもう置けません。', 'err'); beep('err'); return; }
      S.pick = S.pick === d.type ? null : d.type; S.sel = null; render();
      if (S.pick) say('「' + CAT[d.type].name + '」:' + CAT[d.type].desc + ' → 置きたいマスをタップ。');
      return;
    }
    if (overBoard(ev)) { var c = cellOf(svgPoint(ev)); if (c && !nodeAt(c.c, c.r)) place(d.type, c.c, c.r); }
  });
  S.root.addEventListener('pointercancel', function () { var d = S.pdrag; if (d && d.ghost) d.ghost.remove(); S.pdrag = null; hoverCell(null); });

  S.root.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
    var act = b.getAttribute('data-act'), i = +b.getAttribute('data-i');
    if (act === 'stages') showStages();
    else if (act === 'go') { closeModal(); openStage(i, true); }
    else if (act === 'close') { closeModal(); }
    else if (act === 'howtostart') { closeModal(); showIntroModal(); }
    else if (act === 'hint') showHint();
    else if (act === 'howto') showHowto(false);
    else if (act === 'intro') showIntroModal();
    else if (act === 'sound') { S.save.sound = !S.save.sound; persist(); renderTop(); }
    else if (act === 'slot') { S.view = i; render(); }
    else if (act === 'run') run();
    else if (act === 'undo') undo();
    else if (act === 'del') { if (S.sel) removeNode(S.sel); }
    else if (act === 'edgeask') askEdge(b.getAttribute('data-id'));
    else if (act === 'clear') {
      if (stage().free) modal('<h2>🗑 ぜんぶ消しますか?</h2><p>置いた部品と線をすべて消します。「↩ もどす」で元にもどせます。</p><div class="acts"><button class="e1-btn" data-act="close">やめる</button><button class="e1-btn danger" data-act="clearyes">消す</button></div>');
      else modal('<h2>↺ 最初からやり直しますか?</h2><p>置いた部品と線を消して、このステージの最初の状態にもどします。「↩ もどす」で元にもどせます。</p><div class="acts"><button class="e1-btn" data-act="close">やめる</button><button class="e1-btn danger" data-act="clearyes">消す</button></div>');
    }
    else if (act === 'clearyes') { closeModal(); resetBoard(); }
    else if (act === 'next') { closeModal(); openStage(Math.min(STAGES.length - 1, S.si + 1), true); }
    else if (act === 'quiz') answerQuiz(i, b);
    else if (act === 'edgeyes') { closeModal(); removeEdge(b.getAttribute('data-id')); }
  });
  S.root.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { if (S.ov) closeModal(); else { S.sel = null; S.pick = null; render(); } return; }
    if (S.ov) return;
    if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'z' || ev.key === 'Z')) { ev.preventDefault(); undo(); return; }
    var t = ev.target.closest && ev.target.closest('[data-pal]');
    if (t && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); var ty = t.getAttribute('data-pal'); if (remaining(ty) > 0) { S.pick = ty; S.sel = null; render(); say('「' + CAT[ty].name + '」を選びました。盤面で矢印キーとEnterで置けます。'); S.el.svg.focus(); } return; }
    if (ev.target !== S.el.svg) return;
    S.kc = S.kc || { c: 0, r: 0 };
    var mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
    if (mv) {
      ev.preventDefault();
      var nc = Math.max(0, Math.min(COLS - 1, S.kc.c + mv[0])), nr = Math.max(0, Math.min(ROWS - 1, S.kc.r + mv[1]));
      if (ev.shiftKey && S.sel) { var sn = nodeById(S.sel); if (sn && !sn.fixed && !nodeAt(nc, nr)) { moveNode(sn, nc, nr); } }
      S.kc = { c: nc, r: nr }; hoverCell(S.kc);
      var hn = nodeAt(nc, nr); say('マス(' + (nc + 1) + ',' + (nr + 1) + ')' + (hn ? ':' + CAT[hn.type].name : ':空き') + '。Enterで選ぶ・置く・つなぐ、Shift+矢印で選んだ部品を移動、Deleteで消す。');
    } else if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); tapCell(S.kc); hoverCell(S.kc); }
    else if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); if (S.sel) removeNode(S.sel); }
  });
}
function resetBoard() {
  snap(); S.board = startBoard(stage()); S.sel = null; S.pick = null; changed();
  say((stage().free ? 'ぜんぶ消しました。' : '最初の状態にもどしました。') + '「↩ もどす」で元にもどせます。');
}
function overBoard(ev) { var r = S.el.svg.getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom; }
function hoverCell(c) {
  S.el.svg.querySelectorAll('.e1-cell.hover').forEach(function (x) { x.classList.remove('hover'); });
  S.el.svg.querySelectorAll('.e1-node .e1-nbox[stroke]').forEach(function (x) { x.removeAttribute('stroke'); });
  if (!c) return;
  var el = S.el.svg.querySelector('[data-cell="' + c.c + ',' + c.r + '"]');
  if (el) el.classList.add('hover');
  else { var n = nodeAt(c.c, c.r), g = n && S.el.svg.querySelector('[data-node="' + n.id + '"] .e1-nbox'); if (g) g.setAttribute('stroke', '#1e6fd9'); }
}
function askEdge(id) {
  var e = null; S.board.edges.forEach(function (x) { if (x.id === id) e = x; }); if (!e) return;
  var a = nodeById(e.from), b = nodeById(e.to);
  modal('<h2>この線を消しますか?</h2><p>' + CAT[a.type].icon + ' ' + CAT[a.type].name + ' → ' + CAT[b.type].icon + ' ' + CAT[b.type].name + '</p><p style="font-size:15px;color:#5b6b7c">「↩ もどす」で元にもどせます。</p><div class="acts"><button class="e1-btn" data-act="close">やめる</button><button class="e1-btn danger" data-act="edgeyes" data-id="' + esc(id) + '">消す</button></div>');
}

/* ---------- 起動 ---------- */
function mount(root) {
  S.root = root; root.classList.add('e1');
  S.save = loadSave();
  buildShell(); bindInput();
  var first = S.save.last == null;
  openStage(Math.max(0, Math.min(STAGES.length - 1, S.save.last || 0)), false);
  if (first) showHowto(true); // 初回だけ「使い方」→「はじめる」で目標の画面へ
}

NS.E1 = {
  mount: mount,
  _test: { simulate: simulate, evaluate: evaluate, STAGES: STAGES, CAT: CAT, S: S, openStage: openStage, place: place, link: link, nodeAt: nodeAt, newBoard: newBoard, changed: changed,
    startBoard: startBoard, undo: undo, removeEdge: removeEdge, removeNode: removeNode, resetBoard: resetBoard, axesScores: axesScores, edgeGeom: edgeGeom, sankey: sankey }
};
var auto = document.getElementById('e1-app');
if (auto && !auto.getAttribute('data-manual')) mount(auto);
})();
</script>
