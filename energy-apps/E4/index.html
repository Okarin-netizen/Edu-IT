<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E4 保守点検・共通部品クイズ</title>
<style>
html,body{margin:0;height:100%;background:#f2f1ec;}
.e4{--ink:#262a30;--sub:#5f6670;--line:#dcdad2;--accent:#c8620e;--accent2:#1e6fd9;--ok:#1a9b5b;--ng:#d93a3a;--warn:#e67700;--top:#1d3557;--app:#c8620e;
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;
  color:var(--ink);height:100%;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;
  font-size:16px;overflow:hidden;position:relative;background:#f2f1ec;-webkit-tap-highlight-color:transparent;}
.e4 *{box-sizing:border-box}
.e4 button{font:inherit;touch-action:manipulation}
.e4-top{height:58px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--top);color:#fff;flex:none;border-bottom:4px solid var(--app);white-space:nowrap}
.e4-top h1{font-size:17px;margin:0 6px 0 0;white-space:nowrap;font-weight:bold}
.e4-top .sp{flex:1}
.e4-btn{min-height:46px;min-width:46px;padding:0 14px;border-radius:12px;border:2px solid transparent;background:#e7e9e4;color:var(--ink);font-weight:bold;cursor:pointer;font-size:16px}
.e4-btn:active{transform:translateY(1px)}
.e4-btn:disabled{opacity:.4;cursor:default}
.e4-btn:focus-visible,.e4-cv:focus-visible,.e4-hot:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.e4-top .e4-btn{background:#2f4b70;color:#fff;padding:0 12px;min-height:44px;white-space:nowrap}
.e4-top .e4-sh{display:none}
.e4-top .e4-btn.on{background:#fff;color:var(--top)}
.e4-btn.primary{background:var(--accent2);color:#fff}
.e4-btn.blue{background:#e3eefc;color:#1450a8;border-color:#9cc3ff}
.e4-btn.danger{background:#fde2e2;color:#a61e1e}
.e4-btn.good{background:#d3f5e1;color:#0d6b3a}
.e4-btn.big{min-height:56px;font-size:18px;width:100%}
.e4-btn.sm{min-height:44px;padding:0 12px;font-size:15px}
.e4-btn.on{background:var(--top);color:#fff}
.e4-page{flex:1;overflow-y:auto;padding:14px 16px;min-height:0}
.e4-main{flex:1;display:flex;min-height:0}
.e4-center{flex:1;display:flex;flex-direction:column;min-width:0}
.e4-side{width:330px;flex:none;overflow-y:auto;padding:10px 12px;background:#fff;border-left:1px solid var(--line)}
.e4-side h2{font-size:15px;margin:6px 2px 6px;color:var(--sub)}
.e4-msg{min-height:46px;padding:10px 14px;font-size:16px;background:#fffbe6;border-bottom:1px solid #f1e3a6;line-height:1.4}
.e4-msg.err{background:#ffe8e8;border-color:#f5b5b5;color:#8a1414}
.e4-msg.ok{background:#e6f8ee;border-color:#a8e0c0}
.e4-bar{display:flex;gap:6px;padding:6px 8px;background:#f8f8f5;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.e4-bar .sp{flex:1}
.e4-bar .lbl{font-size:15px;color:var(--sub);font-weight:bold;margin-left:4px}
.e4-chips{display:flex;flex-wrap:wrap;gap:6px}
.e4-chips .e4-btn{min-height:44px;padding:0 12px;font-size:15px}
.e4-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.e4-h h2{margin:0;font-size:21px}
.e4-h .sp{flex:1}
.e4-prog{font-size:15px;color:var(--sub);font-weight:bold}
.e4-card{background:#f6f6f2;border-radius:12px;padding:10px 12px;margin-bottom:10px;line-height:1.5}
.e4-card.warn{background:#fff3e0}
.e4-card.blue{background:#eef5ff}
.e4-card.good{background:#ecfaf1}
/* 図鑑 */
.e4-pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.e4-pcard{position:relative;border:2px solid var(--line);border-radius:14px;padding:8px 10px 10px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:stretch;gap:2px;min-height:196px}
.e4-pcard svg{width:100%;height:92px;display:block}
.e4-pcard .nm{font-size:17px;font-weight:bold;line-height:1.25}
.e4-pcard .yo{font-size:13px;color:var(--sub)}
.e4-pcard .ct{font-size:13px;color:#fff;background:#7a8691;border-radius:8px;padding:1px 7px;align-self:flex-start;margin-top:2px}
.e4-pcard .rl{font-size:15px;color:var(--sub);line-height:1.4;margin-top:3px}
.e4-pcard.seen{border-color:#a8d7bd}
.e4-pcard .chk{position:absolute;right:8px;top:6px;color:var(--ok);font-weight:bold;font-size:15px}
.e4-cat-fasten{background:#8a5a2b!important}.e4-cat-support{background:#3f6e8c!important}.e4-cat-turn{background:#2b7a4b!important}.e4-cat-conv{background:#7b4fa0!important}.e4-cat-other{background:#5d6d2b!important}
.e4-pbig{display:flex;gap:16px;align-items:flex-start}
.e4-pbig svg{width:200px;height:170px;flex:none;background:#f7f7f3;border-radius:14px}
.e4-pbig .tx{flex:1;min-width:0}
.e4-tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.e4-tags span{background:#eef1f4;border-radius:14px;padding:3px 10px;font-size:15px}
.e4-ul{margin:4px 0 8px;padding-left:22px}
.e4-ul li{margin:2px 0}
/* 機械を見る */
.e4-mbox{flex:1;min-height:0;position:relative;background:#fbfbf8;display:flex;align-items:center;justify-content:center;padding:6px}
.e4-mbox svg{width:100%;height:100%;max-height:100%}
.e4-hot{cursor:pointer}
.e4-hot circle.ring{fill:rgba(200,98,14,.18);stroke:#c8620e;stroke-width:3;stroke-dasharray:6 4}
.e4-hot.found circle.ring{fill:rgba(26,155,91,.18);stroke:#1a9b5b;stroke-dasharray:none}
.e4-hot.sel circle.ring{fill:rgba(30,111,217,.25);stroke:#1e6fd9;stroke-width:4;stroke-dasharray:none}
.e4-hot text{font-size:30px;font-weight:bold;fill:#c8620e;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.e4-hot.found text{fill:#1a9b5b}
.e4-hot.sel text{fill:#1e6fd9}
.e4-hidelbl .e4-hot text{display:none}
/* クイズ */
.e4-tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.e4-tcard{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;min-height:84px;display:flex;flex-direction:column;gap:2px}
.e4-tcard.done{background:#effaf3;border-color:#a8e0c0}
.e4-tcard .no{font-size:14px;color:var(--sub);display:flex;justify-content:space-between}
.e4-tcard .t{font-size:17px;font-weight:bold;line-height:1.35}
.e4-tcard .l{font-size:15px;color:var(--sub);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.e4-tcard .star{color:#e8a200;font-size:16px;letter-spacing:1px}
.e4-modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.e4-mode{border:2px solid var(--line);border-radius:16px;background:#fff;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.e4-mode .t{font-size:20px;font-weight:bold}
.e4-mode .l{font-size:15px;color:var(--sub);line-height:1.45}
.e4-quiz{flex:1;display:flex;min-height:0}
.e4-qcase{width:44%;flex:none;overflow-y:auto;padding:14px 16px;background:#fff;border-right:1px solid var(--line)}
.e4-qans{flex:1;overflow-y:auto;padding:14px 16px;min-width:0}
.e4-qno{display:flex;gap:4px;margin-bottom:10px}
.e4-qno i{flex:1;height:8px;border-radius:4px;background:#e2e2dc}
.e4-qno i.cur{background:#9cc3ff}.e4-qno i.ok{background:var(--ok)}.e4-qno i.half{background:#f0b429}.e4-qno i.ng{background:var(--ng)}
.e4-qmach{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--sub);font-weight:bold}
.e4-qmach .ic{font-size:40px}
.e4-symp{font-size:19px;font-weight:bold;line-height:1.6;margin:8px 0 10px;background:#fff8e8;border-left:6px solid var(--warn);padding:10px 12px;border-radius:8px}
.e4-clue{font-size:17px;line-height:1.6;background:#eef5ff;border-left:6px solid var(--accent2);padding:10px 12px;border-radius:8px;margin:8px 0}
.e4-stepttl{font-size:18px;font-weight:bold;margin:2px 0 6px;display:flex;align-items:center;gap:8px}
.e4-stepttl .n{display:inline-flex;width:30px;height:30px;border-radius:15px;background:var(--top);color:#fff;align-items:center;justify-content:center;font-size:16px}
.e4-ch{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 14px;font-weight:bold;font-size:18px;min-height:56px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);line-height:1.4}
.e4-ch:disabled{cursor:default}
.e4-ch.right{background:#d3f5e1;border-color:var(--ok)}
.e4-ch.wrong{background:#ffe0e0;border-color:var(--ng)}
.e4-ch.dim{opacity:.85}
.e4-ch.lock{opacity:.55}
.e4-ch .why{display:block;font-weight:normal;font-size:15px;margin-top:4px;color:#3b4148;line-height:1.5}
.e4-ch .mk{float:right;font-size:20px;margin-left:8px}
.e4-reason{background:#fff4f4;border-left:5px solid var(--ng);padding:8px 12px;margin:8px 0;border-radius:6px;line-height:1.55}
.e4-reason.tip{background:#fff9e6;border-color:var(--warn)}
.e4-reason.good{background:#ecfaf1;border-color:var(--ok)}
.e4-reason.safe{background:#fff0f0;border-color:#c62828}
.e4-big{font-size:46px;text-align:center;margin:4px 0}
/* アニメ */
.e4-cvbox{flex:1;min-height:0;position:relative;background:#fbfbf8}
.e4-cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.e4-kv{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:2px 0;font-size:15px}
.e4-kv b{font-size:19px}
.e4-meter{height:16px;background:#e5e5df;border-radius:8px;overflow:hidden;margin:2px 0 8px;position:relative}
.e4-meter i{display:block;height:100%;border-radius:8px;background:var(--ok)}
.e4-meter.mid i{background:var(--warn)}.e4-meter.bad i{background:var(--ng)}
.e4-res{font-size:16px;line-height:1.6}
/* 点検表 */
.e4-cl{display:flex;flex:1;min-height:0}
.e4-cand{width:330px;flex:none;overflow-y:auto;padding:10px 12px;background:#fff;border-right:1px solid var(--line)}
.e4-cand h2{font-size:15px;margin:6px 2px;color:var(--sub)}
.e4-citem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;min-height:52px;margin:5px 0;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:#fafaf7;font-weight:bold;font-size:15px;cursor:pointer;color:var(--ink);line-height:1.35}
.e4-citem.in{background:#e8f1fb;border-color:#9cc3ff;color:#1b4f8f}
.e4-citem .pl{font-size:20px;flex:none;width:24px;text-align:center}
.e4-clmain{flex:1;overflow-y:auto;padding:12px 16px;min-width:0}
.e4-row{border:2px solid var(--line);border-radius:14px;background:#fff;padding:8px 12px;margin-bottom:10px}
.e4-row .hd{display:flex;align-items:center;gap:8px}
.e4-row .hd .t{flex:1;font-size:17px;font-weight:bold;line-height:1.35}
.e4-row .hd .key{color:#e8a200;font-size:15px;flex:none}
.e4-row .lab{font-size:14px;color:var(--sub);font-weight:bold;margin:6px 0 3px}
.e4-row .e4-chips .e4-btn{min-height:44px;font-size:15px;padding:0 10px}
.e4-row .hd .e4-btn.danger{margin-left:18px}
.e4-row.warn{border-color:#f0b429}
.e4-row .adv{font-size:15px;color:#8a4b00;background:#fff4dc;border-radius:8px;padding:4px 8px;margin-top:6px}
.e4-in{font:inherit;font-size:17px;min-height:46px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;width:100%;user-select:text;-webkit-user-select:text;background:#fff;color:var(--ink)}
.e4-tbl{border-collapse:collapse;width:100%;font-size:15px}
.e4-tbl th{background:#eceee8;padding:5px;font-size:15px;border:1px solid #d5d7d0}
.e4-tbl td{border:1px solid #dfe1da;padding:5px 6px;text-align:center}
.e4-tbl td.l{text-align:left}
.e4-recrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee}
.e4-recrow .t{flex:1;font-size:16px;line-height:1.35}
.e4-recrow .e4-btn{min-width:64px;min-height:50px;font-size:18px;padding:2px 6px;line-height:1.1}
.e4-recrow .e4-btn.on.r0{background:var(--ok);color:#fff}
.e4-recrow .e4-btn.on.r1{background:var(--warn);color:#fff}
.e4-recrow .e4-btn.on.r2{background:var(--ng);color:#fff}
/* モーダル */
.e4-ov{position:absolute;inset:0;background:rgba(25,32,40,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.e4-modal{background:#fff;border-radius:18px;max-width:920px;width:100%;max-height:100%;overflow-y:auto;padding:20px 24px;box-shadow:0 10px 40px rgba(0,0,0,.3);font-size:17px;line-height:1.6}
.e4-modal h2{margin:0 0 10px;font-size:23px}
.e4-modal h3{margin:14px 0 6px;font-size:18px}
.e4-modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.e4-modal .acts .e4-btn{min-width:150px;min-height:54px;font-size:18px}
.e4-steps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.e4-steps div{background:#f3f4f0;border-radius:12px;padding:12px;font-size:16px}
.e4-steps b{font-size:18px}
.e4-printarea{display:none}
.e4 ruby{ruby-align:center}
.e4 ruby rt{font-size:max(12px,.5em);font-weight:normal;color:#4b5560;ruby-align:center;letter-spacing:0}
.e4-hint{font-size:15px;color:#8a4b00;background:#fff4dc;border-radius:10px;padding:8px 12px;margin:6px 0}
.e4-toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#1d3557;color:#fff;padding:12px 20px;border-radius:12px;font-size:17px;font-weight:bold;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90%;text-align:center}
.e4-cgrid{display:block}
.e4-pcard .nt{font-size:15px;line-height:1.5}
.e4-ic svg{width:100%;height:100%;display:block}
@media (max-width:1100px){.e4-long{display:none}.e4-top h1{font-size:16px}.e4-pgrid{grid-template-columns:repeat(3,1fr)}.e4-tgrid{grid-template-columns:repeat(2,1fr)}.e4-side{width:290px}.e4-cand{width:290px}.e4-top .e4-btn{padding:0 9px;font-size:15px}}
@media (max-width:900px){
  .e4-top{gap:4px;padding:0 6px}.e4-top h1{font-size:15px;margin-right:2px}.e4-top .e4-lg{display:none}.e4-top .e4-sh{display:inline}.e4-top .e4-btn{padding:0 8px}
  .e4-main{flex-direction:column}
  .e4-side{width:auto;flex:none;max-height:44%;border-left:0;border-top:2px solid var(--line)}
  .e4-mcenter{flex:none}.e4-mcenter .e4-mbox{flex:none;aspect-ratio:1000/640}
  .e4-side.e4-mside{flex:1;max-height:none}
  .e4-quiz{flex-direction:column;overflow-y:auto}
  .e4-qcase{width:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--line)}
  .e4-qans{overflow:visible;flex:none}
  .e4-cl{flex-direction:column;overflow-y:auto}
  .e4-cand{width:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--line)}
  .e4-cgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:8px}
  .e4-clmain{overflow:visible;flex:none}
}
@media (max-width:820px){.e4-pgrid{grid-template-columns:repeat(2,1fr)}.e4-modes{grid-template-columns:1fr}}
@media print{
  html,body{height:auto;background:#fff}
  body *{visibility:hidden}
  .e4-printarea,.e4-printarea *{visibility:visible}
  .e4-printarea{display:block;position:absolute;left:0;top:0;width:100%;font-size:14px;color:#000}
  .e4-printarea h1{font-size:20px;margin:0 0 6px}
  .e4-printarea h2{font-size:16px;margin:12px 0 4px}
  .e4-printarea .e4-tbl{font-size:12.5px}
  .e4-printarea .e4-tbl td,.e4-printarea .e4-tbl th{border:1px solid #888}
  .e4{height:auto;overflow:visible}
  .e4>*:not(.e4-printarea){display:none!important}
  .e4-printarea{position:static}
}
</style>
</head>
<body>
<div id="e4-app" class="e4"></div>
<script>
/* ===================================================================
   機構コア(部品データ+運動学) — E3 機構ラボ / E4 保守点検クイズ 共用
   window.EnergyApps.Mech
   ・力学(物理エンジン)は使わず、運動学(動きの幾何と比)だけで計算する
   ・回転を伝える列 train = { wheels:[{kind,size}], links:[type] }
       kind: 'gear'(歯車:size=歯数) 'pulley'(プーリー:size=直径mm) 'sprocket'(スプロケット:size=歯数)
       links[i] は wheels[i] と wheels[i+1] のつなぎ方:
       'mesh'(かみ合い) 'belt'(平ベルト) 'cross'(十字掛けベルト) 'chain'(チェーン) 'shaft'(同じ軸に固定)
   ・回転の向き: +1 = 入力(モーター)と同じ向き(時計回り)、-1 = 逆向き
   =================================================================== */
(function () {
'use strict';
var NS = window.EnergyApps = window.EnergyApps || {};
if (NS.Mech) return;

/* ---------- 部品データ(E4 の部品図鑑と共用) ---------- */
var PARTS = {
  gear: { name: '歯車', yomi: 'はぐるま', cat: '回転を伝える', unit: '枚', sizeName: '歯数', sizeUnit: '', min: 8, max: 80,
    role: '歯と歯がかみ合って、すべらずに回転を伝える。かみ合った2枚は逆向きに回る。',
    where: ['時計', 'ミシン', '自動車の変速機', '電動ドリル'],
    care: ['歯が欠けていないか', '油(グリース)が切れていないか', '異音がしないか'] },
  pulley: { name: 'プーリー(ベルト車)', yomi: 'ぷーりー(べるとぐるま)', cat: '回転を伝える', sizeName: '直径', sizeUnit: 'mm', min: 20, max: 200,
    role: 'ベルトをかけて、離れた軸に回転を伝える。ベルトがすべると伝わる回転が減る。',
    where: ['洗濯機', '自動車のエンジン', 'ボール盤'],
    care: ['ベルトがゆるんで、すべっていないか', 'ベルトにひびやすりへり(摩耗)がないか'] },
  sprocket: { name: 'スプロケット', yomi: 'すぷろけっと', cat: '回転を伝える', sizeName: '歯数', sizeUnit: '', min: 10, max: 60,
    role: 'チェーンとかみ合う歯をもつ車。すべらずに、離れた軸へ回転を伝える。',
    where: ['自転車', 'オートバイ'],
    care: ['歯がすりへって、先がとがっていないか', 'さびや油切れがないか', 'かけたチェーンがたるんでいないか'] },
  belt: { name: '平ベルト', yomi: 'ひらべると', cat: '回転を伝える',
    role: '2つのプーリーにかけて回転を伝える。ふつうにかけると同じ向き、十字にかけると逆向きに回る。断面がV字のVベルトは、みぞにはまってすべりにくい。',
    where: ['洗濯機', 'ボール盤', '農業機械'], care: ['張りがゆるすぎたり強すぎたりしないか', 'ひび割れがないか'] },
  chain: { name: 'チェーン(ローラチェーン)', yomi: 'ちぇーん(ろーらちぇーん)', cat: '回転を伝える',
    role: '2つのスプロケットにかけて、すべらずに回転を伝える。両方とも同じ向きに回る。',
    where: ['自転車', 'オートバイ'], care: ['たるみが10〜20mmか', '油が切れていないか', 'さびていないか'] },
  shaft: { name: '軸', yomi: 'じく', cat: '支える・つなぐ',

/* ---------- 四節リンク ----------
   固定節 d: 原点O2=(0,0) 〜 O4=(d,0)。クランク(入力) a、連結棒 b、てこ(出力) c。

  if (sh === 'd') return { id: 'crank2', name: '両クランク機構', full: true, outFull: true, shortest: sh, note: 'いちばん短いのが固定リンクなので、クランクもてこも1回転できる' };

<script>

/* ---------- 読みがな(難しい用語の初出に <ruby>) ----------

   note があれば、読みのあとに短い言いかえを足す。 */
var GLOSS = [
  ['含油軸受', 'がんゆじくうけ'], ['転がり軸受', 'ころがりじくうけ'], ['滑り軸受', 'すべりじくうけ'], ['軸継手', 'じくつぎて'], ['軸受', 'じくうけ'],

  ['逆ねじ', 'ぎゃくねじ'], ['半断線', 'はんだんせん'], ['断線', 'だんせん'], ['現象', 'げんしょう'],
  ['従動節', 'じゅうどうせつ', 'カムに押されて動く棒'], ['揺動', 'ようどう'], ['条数', 'じょうすう', 'ねじ山の筋の数'],
  ['ばね座金', 'ばねざがね'], ['平座金', 'ひらざがね'], ['座金', 'ざがね'], ['割りピン', 'わりピン'], ['小ねじ', 'こねじ'], ['木ねじ', 'もくねじ'],
  ['送りねじ', 'おくりねじ'], ['万力', 'まんりき'], ['異音', 'いおん'], ['保守', 'ほしゅ'], ['点検', 'てんけん'], ['補給', 'ほきゅう'],
  ['注油', 'ちゅうゆ'], ['湿気', 'しっけ'], ['往復', 'おうふく'], ['変速機', 'へんそくき'], ['発火', 'はっか'], ['感電', 'かんでん'],
  ['鋼', 'はがね'], ['結合', 'けつごう'], ['偏心', 'へんしん']
];
function addRuby(el) {
  if (!el || !el.ownerDocument) return;
  var used = {}, nodes = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
    acceptNode: function (n) {
      var p = n.parentNode;
      while (p && p !== el) { var tg = p.nodeName.toLowerCase(); if (tg === 'ruby' || tg === 'svg' || tg === 'script' || tg === 'style' || tg === 'textarea' || tg === 'option' || (p.classList && p.classList.contains('e4-noruby'))) return NodeFilter.FILTER_REJECT; p = p.parentNode; }

  while (w.nextNode()) nodes.push(w.currentNode);
  el.querySelectorAll('ruby').forEach(function (r) { var b = r.firstChild && r.firstChild.nodeValue; if (b) used[b] = 1; });
  nodes.forEach(function (n) {
    var txt = n.nodeValue, frag = null, pos = 0;

      var best = -1, g = null;
      for (var i = 0; i < GLOSS.length; i++) {
        if (used[GLOSS[i][0]]) continue;
        var at = txt.indexOf(GLOSS[i][0], pos);
        if (at >= 0 && (best < 0 || at < best || (at === best && GLOSS[i][0].length > g[0].length))) { best = at; g = GLOSS[i]; }

      }

      var rt = document.createElement('rt'); rt.textContent = g[1]; rb.appendChild(rt); frag.appendChild(rb);

}

  if (!S.root || !S.root.isConnected) { S.raf = 0; return; }
  S.raf = requestAnimationFrame(frame);
  var dt = S.last ? Math.min(0.05, (ts - S.last) / 1000) : 0; S.last = ts;
  if (S.view !== 'sim' || !S.sim || !S.el.cv || !S.el.cv.isConnected) return;
  S.t += dt;
  var st = S.sim;
  if (S.playing && !st.broken) {
    S.simRot = (S.simRot || 0) + dt * 2.2;
    st.f += dt * 4 * (S.save.simSpeed || 1);     // 1倍 = 4日/秒
    while (st.f >= 1 && !st.broken && st.day < 365) {
      st.f -= 1; simDay(st, false);
      if (st.broken) { S.playing = false; beep('boom'); say('💥 ' + simDef().failText + ' ' + st.day + '日目。「🔧 修理する」で直そう。<b>こわれる前に点検していれば…?</b>', 'err'); renderSimBar(); renderSimSide(); }
    }
    if (st.day >= 365 && S.playing) {
      S.playing = false; st.f = 0; renderSimBar(); renderSimSide();
      say('📅 1年たった。故障 <b>' + st.fails + '回</b>、点検 <b>' + st.insp + '回</b>。「📊 計算してくらべる」で、点検の間隔によるちがいを見よう。', st.fails ? 'err' : 'ok'); beep('ok');
    }
    S.mtick = (S.mtick || 0) + dt;
    if (S.mtick > 0.2) { S.mtick = 0; updateMeters(); var ib = S.root.querySelector('[data-act="siminsp"]'); if (ib) ib.textContent = '🔧 点検する(' + st.insp + '回)'; }
  }
  var c = ctx2d(); if (c) drawSim(c);
}

/* ---------- 起動 ---------- */
function mount(root) {
  S.root = root; root.classList.add('e4');
  S.save = loadSave();
  S.simId = byId(SIMS, S.save.simId) ? S.save.simId : 'bolt';
  root.addEventListener('click', onClick);
  root.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && S.ov) { closeModal(); ev.preventDefault(); return; }
    var g = ev.target.closest && ev.target.closest('.e4-hot');
    if (g && (ev.key === 'Enter' || ev.key === ' ')) { tapHot(g.getAttribute('data-h')); ev.preventDefault(); }
  });
  openView(S.save.view || 'book');
  if (!S.save.seen) { S.save.seen = true; persist(); showHowto(true); }
  if (!S.raf) S.raf = requestAnimationFrame(frame);
}

NS.E4 = {
  mount: mount,
  _test: { S: S, SIMS: SIMS, openView: openView, advise: advise, simCompare: simCompare, applyImport: applyImport, listData: listData, startCases: startCases, caseAnswer: caseAnswer, makePartQs: makePartQs, simDay: simDay, simReset: simReset, simInspect: simInspect, curList: curList }
};
var auto = document.getElementById('e4-app');
if (auto && !auto.getAttribute('data-manual')) mount(auto);
})();
</script>
