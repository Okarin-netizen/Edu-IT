<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>情報の技術 体験教材集</title>
  <meta name="description" content="中学校技術科「D 情報の技術」の体験教材6つを1つにまとめた教材集。インターネットにつながずに使えます。">
  <!-- 外部への通信を一切しないための制限（中の教材にも同じ制限がかかります） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="author" content="羽生市立南中学校 技術 岡田">
  <link rel="icon" href="{{ICON}}" type="image/svg+xml">
  <style>
{{CSS}}
  </style>
</head>
<body>
  <a class="skip-link" href="#menu">本文へ移動</a>
  <header class="shell-header">
    <a class="brand" href="#/" id="home-link"><img src="{{ICON}}" alt="" width="28" height="28"><span>情報の技術 体験教材集</span></a>
    <span class="now" id="now-title" aria-live="polite"></span>
    <span class="spacer"></span>
    <div class="shell-toggles" role="group" aria-label="6つの教材の表示の切りかえ">
      <button type="button" class="shell-toggle" id="tg-ruby" aria-pressed="false">ふりがな</button>
      <button type="button" class="shell-toggle" id="tg-large" aria-pressed="false">大きな文字</button>
    </div>
    <div class="switch-wrap" id="switch-wrap">
      <button type="button" class="switch-btn" id="switch-btn" aria-expanded="false" aria-controls="switcher"><span class="switch-btn-label">教材をかえる</span> <span aria-hidden="true">▾</span></button>
      <nav class="switcher" id="switcher" aria-label="教材の切りかえ"></nav>
    </div>
  </header>
  <main id="menu" tabindex="-1">
    <noscript><p>この教材集を使うには JavaScript を有効にしてください。</p></noscript>
  </main>
  <div id="stage" class="stage" hidden></div>
  <footer class="shell-footer" id="footer">
    <p class="author">{{AUTHOR}}（教材集 第1.3版 2026年10月）</p>
    <p>この教材集はブラウザの中だけで動き、外部のサイトには接続しません。登場する会社名・アドレスはすべて架空です。</p>
  </footer>
  <script type="application/json" id="kyozai-data">{{DATA}}</script>
{{PAYLOADS}}
  <script>
{{JS}}
  </script>
</body>
</html>
