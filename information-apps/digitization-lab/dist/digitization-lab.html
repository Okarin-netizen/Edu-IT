    --series-3: #199e70;
    --series-4: #c98500;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211;
  --surface-1: #1a1a19;
  --surface-2: #242422;
  --border: #3a3936;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #a3a29a;
  --accent: #5598e7;
  --accent-ink: #0b0b0b;
  --accent-soft: #1c2b40;
  --good: #5fc27a;
  --good-soft: #17301f;
  --warn: #e7b450;
  --warn-soft: #362a12;
  --bad: #f08a83;
  --bad-soft: #3a1b19;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --shadow: none;
}

* { box-sizing: border-box; }
html { font-size: 17px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font);
  line-height: 1.75;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, h4 { line-height: 1.4; margin: 0 0 0.5em; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.1rem; }
p { margin: 0 0 0.8em; }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
.skip-link { position: absolute; left: -999px; top: 0; background: var(--surface-1); padding: 8px 12px; z-index: 10; }
.skip-link:focus { left: 8px; }

/* レイアウト */
.app-header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 20px; background: var(--surface-1); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 5;
}
.app-header .brand { font-weight: 700; font-size: 1.05rem; text-decoration: none; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
.app-header .brand img { width: 28px; height: 28px; }
.app-header .spacer { flex: 1; }
.overall-progress { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-secondary); }
.overall-progress .bar { width: 120px; }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; gap: 24px; padding: 20px; }
.chapter-nav { position: sticky; top: 72px; align-self: start; min-width: 0; }
.chapter-nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; position: relative; }
.chapter-nav a, .chapter-nav span.disabled {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
  text-decoration: none; color: var(--text-primary); font-size: 0.92rem;
}
.chapter-nav a:hover { background: var(--surface-2); }
.chapter-nav a[aria-current="page"] { background: var(--accent-soft); font-weight: 700; }
.chapter-nav span.disabled { color: var(--text-muted); }
.chapter-nav .num {
  flex: none; width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center;
  font-size: 0.78rem; border: 1.5px solid var(--border); background: var(--surface-1);
}
.chapter-nav .done .num { background: var(--good); border-color: var(--good); color: var(--surface-1); }
.chapter-nav .nav-group { font-size: 0.75rem; color: var(--text-muted); margin: 14px 10px 4px; letter-spacing: 0.05em; }
main { min-width: 0; }
.app-footer { text-align: center; font-size: 0.8rem; color: var(--text-muted); padding: 24px 16px 40px; }

@media (max-width: 860px) {
  html { font-size: 16px; }
  .layout { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
  .chapter-nav { position: static; }
  .chapter-nav ol { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; padding-bottom: 6px; }
  .chapter-nav .nav-group { display: none; }
  .overall-progress .bar { width: 70px; }
}

/* 部品 */
.card {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 22px; margin-bottom: 18px; box-shadow: var(--shadow);
}
.card > :last-child { margin-bottom: 0; }
.module-head { margin-bottom: 18px; }
.module-head .meta { color: var(--text-secondary); font-size: 0.9rem; }
.step-title { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
.step-title .badge {
  flex: none; font-size: 0.75rem; font-weight: 700; padding: 2px 10px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent);
}
.step-title .check { margin-left: auto; font-size: 0.8rem; color: var(--good); font-weight: 700; }

.explain {
  border-left: 5px solid var(--accent); background: var(--accent-soft);
  border-radius: 8px; padding: 12px 16px; margin: 14px 0;
}
.explain .explain-label { font-weight: 700; font-size: 0.85rem; color: var(--accent); display: block; margin-bottom: 2px; }
.explain.warn { border-color: var(--warn); background: var(--warn-soft); }
.explain.warn .explain-label { color: var(--warn); }
.explain.good { border-color: var(--good); background: var(--good-soft); }
.explain.good .explain-label { color: var(--good); }
.explain.bad { border-color: var(--bad); background: var(--bad-soft); }
.explain.bad .explain-label { color: var(--bad); }
.explain > :last-child { margin-bottom: 0; }

.three-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; padding: 0; list-style: none; counter-reset: s; }
.three-steps li {
  background: var(--surface-2); border-radius: 10px; padding: 10px 12px; text-align: center; font-size: 0.9rem;
  counter-increment: s;
}
.three-steps li strong { display: block; font-size: 1.05rem; }
.three-steps li strong::before { content: counter(s) ". "; }
@media (max-width: 560px) { .three-steps { grid-template-columns: 1fr; } }

.btn {
  font: inherit; font-size: 0.95rem; cursor: pointer; border-radius: 10px; padding: 8px 16px;
  border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700;
  min-height: 44px;
}
.btn:hover { filter: brightness(1.08); }
.btn.secondary { background: transparent; color: var(--accent); }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 0.88rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; align-items: center; }

label { font-weight: 700; font-size: 0.92rem; }
input[type="text"], input[type="number"], textarea, select {
  max-width: 100%;
  font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%; min-height: 44px;
}
textarea { min-height: 90px; resize: vertical; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.field { margin: 10px 0; display: grid; gap: 4px; }
.field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.hint { font-size: 0.85rem; color: var(--text-secondary); font-weight: 400; }

.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
.bar > span { display: block; height: 100%; background: var(--good); border-radius: 99px; }

.result-box {
  border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px; margin: 12px 0; background: var(--surface-2);
}
.big-number { font-size: 1.8rem; font-weight: 700; line-height: 1.3; }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; padding: 2px 10px; border-radius: 99px; font-size: 0.9rem; }
.status.good { background: var(--good-soft); color: var(--good); }
.status.warn { background: var(--warn-soft); color: var(--warn); }
.status.bad { background: var(--bad-soft); color: var(--bad); }

.choice-list { display: grid; gap: 8px; margin: 10px 0; padding: 0; list-style: none; }
.choice-list button {
  width: 100%; text-align: left; font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; cursor: pointer; min-height: 44px;
}
.choice-list button:hover { border-color: var(--accent); }
.choice-list button.correct { border-color: var(--good); background: var(--good-soft); }
.choice-list button.wrong { border-color: var(--bad); background: var(--bad-soft); }

table.data { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
table.data th, table.data td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
table.data th { color: var(--text-secondary); font-weight: 700; }
.table-wrap { overflow-x: auto; }

.module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.module-card {
  display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--text-primary);
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
}
a.module-card:hover { border-color: var(--accent); }
.module-card .mc-num { font-size: 0.8rem; color: var(--text-muted); }
.module-card .mc-title { font-weight: 700; font-size: 1.05rem; }
.module-card .mc-desc { font-size: 0.88rem; color: var(--text-secondary); flex: 1; }
.module-card.soon { opacity: 0.6; }

.reflection textarea { margin-top: 6px; }
.saved-note { font-size: 0.85rem; color: var(--good); min-height: 1.4em; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text-primary); color: var(--surface-1);
  padding: 10px 18px; border-radius: 99px; font-size: 0.9rem; z-index: 20; max-width: calc(100vw - 32px); width: max-content; opacity: 0; transition: opacity 0.2s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* グラフ */
.chart { width: 100%; position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid line { stroke: var(--border); stroke-width: 1; }
.chart .axis text, .chart text.axis { fill: var(--text-muted); font-size: 11px; font-family: var(--font); }
.chart text.label { fill: var(--text-primary); font-size: 12px; font-family: var(--font); }
.chart text.label-strong { fill: var(--text-primary); font-size: 12px; font-weight: 700; font-family: var(--font); }
.chart .tooltip {
  position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 0.8rem; box-shadow: var(--shadow); white-space: nowrap; display: none; z-index: 3;
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--text-secondary); margin: 6px 0; padding: 0; list-style: none; }
.legend .sw { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

/* 暗号 */
.cipher-wheel { font-family: var(--mono); overflow-x: auto; padding-bottom: 4px; }
.cipher-wheel .row { display: flex; gap: 2px; }
.cipher-wheel .row span {
  flex: none; width: 26px; text-align: center; padding: 2px 0; border-radius: 4px; background: var(--surface-2); font-size: 0.9rem;
}
.cipher-wheel .row.out span { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.cipher-wheel .arrow { font-size: 0.75rem; color: var(--text-muted); padding-left: 2px; }
.cipher-text {
  font-family: var(--mono); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; word-break: break-all;
  letter-spacing: 0.06em; min-height: 2.6em;
}
.shift-table td.mono { letter-spacing: 0.05em; }
.shift-table tr.hit td { background: var(--good-soft); font-weight: 700; }
.math-line { font-family: var(--mono); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; margin: 4px 0; overflow-x: auto; white-space: nowrap; }
.kx-diagram { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; text-align: center; margin: 12px 0; }
.kx-person { background: var(--surface-2); border-radius: 10px; padding: 10px; }
.kx-person .emoji { font-size: 1.8rem; display: block; }
.kx-mid { font-size: 0.85rem; color: var(--text-secondary); }

/* フィッシング */
.scenario-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.scenario-tabs button {
  font: inherit; font-size: 0.85rem; padding: 6px 12px; border-radius: 99px; border: 1.5px solid var(--border);
  background: var(--surface-1); color: var(--text-primary); cursor: pointer; min-height: 36px; position: relative;
}
.scenario-tabs button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.scenario-tabs button.done::after { content: " ✓"; color: var(--good); }
.mock {
  border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; background: #ffffff; color: #1b1b1a;
  max-width: 560px; margin: 0 auto;
}
.mock-bar { background: #eceae4; padding: 8px 12px; font-size: 0.8rem; color: #52514e; display: flex; gap: 8px; align-items: center; }
.mock-bar .dots::before { content: "● ● ●"; letter-spacing: 2px; color: #b9b6ad; }
.mock-body { padding: 16px; }
.mock .hs {
  display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: transparent;
  border: 2px dashed transparent; border-radius: 6px; padding: 2px 6px; margin: 2px -6px; cursor: pointer;
}
.mock .hs:hover { border-color: #b9b6ad; }
.mock .hs.inline { display: inline; width: auto; margin: 0; }
.mock .hs.picked { border-color: #eda100; background: #fdf3d6; }
.mock .hs.found { border: 2px solid #1f7a3a; background: #e3f3e7; }
.mock .hs.missed { border: 2px solid #b3261e; background: #fbe5e3; }
.mock .hs.false-pick { border: 2px solid #8a8880; background: #efeee9; }
.mock .hs .mark { font-size: 0.75rem; font-weight: 700; margin-left: 6px; }
.mock .mail-head { border-bottom: 1px solid #e3e1da; padding-bottom: 8px; margin-bottom: 10px; font-size: 0.9rem; }
.mock .mail-subject { font-weight: 700; font-size: 1.05rem; }
.mock .fake-btn { display: inline-block; background: #256abf; color: #fff; padding: 6px 14px; border-radius: 6px; font-weight: 700; }
.mock .url { font-family: var(--mono); font-size: 0.85rem; background: #fff; border: 1px solid #d9d7cf; border-radius: 99px; padding: 2px 10px; flex: 1; }
.mock .sms { background: #e9e8e3; border-radius: 14px; padding: 10px 12px; max-width: 90%; }
.mock .login-box { border: 1px solid #e3e1da; border-radius: 10px; padding: 14px; display: grid; gap: 8px; }
.mock .login-box .fake-input { border: 1px solid #c9c6bd; border-radius: 6px; padding: 6px 8px; color: #8a8880; font-size: 0.85rem; }
.mock .logo { font-weight: 800; font-size: 1.1rem; }
.feedback-list { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 8px; }
.feedback-list li { border-radius: 8px; padding: 8px 12px; background: var(--surface-2); font-size: 0.92rem; }
.feedback-list li .tag { font-weight: 700; margin-right: 6px; }
.feedback-list li.found .tag { color: var(--good); }
.feedback-list li.missed .tag { color: var(--bad); }
.feedback-list li.false-pick .tag { color: var(--text-secondary); }

@media (forced-colors: active) {
  .mock .hs.found, .mock .hs.missed, .mock .hs.picked { border-style: solid; }
  .bar > span { background: Highlight; }
}
@media print {
  .app-header, .chapter-nav, .btn-row, .app-footer { display: none; }
  .layout { display: block; }
}

/* ハッシュ */
.hash-view { font-size: 0.85rem; }
.hash-view mark { background: var(--warn-soft); color: var(--warn); font-weight: 700; border-radius: 2px; }

/* 通信の模擬 */
.net-route { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0 8px; padding-top: 34px; }
.net-node { background: var(--surface-2); border-radius: 10px; padding: 8px 4px; text-align: center; font-size: 0.82rem; position: relative; }
.net-node .emoji { display: block; font-size: 1.6rem; }
.net-node .spy { display: block; margin-top: 4px; font-size: 0.75rem; font-weight: 700; color: var(--bad); }
.packet { position: absolute; top: 0; left: 4%; font-size: 1.4rem; line-height: 1; }
.packet.locked { filter: none; }
.spy-panel { border: 2px dashed var(--bad); border-radius: 10px; padding: 12px; margin-top: 8px; }
.spy-panel pre { white-space: pre-wrap; margin: 6px 0; font-size: 0.85rem; }
@media (prefers-reduced-motion: reduce) { .packet { transition: none !important; } }

/* SNS */
.sns-photo { position: relative; line-height: 0; }
.sns-photo svg { width: 100%; height: auto; display: block; }
.photo-hs { position: absolute; border: 2px dashed transparent; background: transparent; border-radius: 6px; cursor: pointer; padding: 0; }
.photo-hs:hover { border-color: rgba(255,255,255,0.9); }
.photo-hs.picked { border: 3px solid #eda100; background: rgba(237,161,0,0.18); }
.photo-hs.found { border: 3px solid #1f7a3a; background: rgba(31,122,58,0.18); }
.photo-hs.missed { border: 3px solid #b3261e; background: rgba(179,38,30,0.18); }
.photo-hs.false-pick { border: 3px solid #8a8880; }
.check-list { display: grid; gap: 6px; align-content: start; }
.check-item { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.check-item input { width: 20px; height: 20px; flex: none; margin-top: 3px; accent-color: var(--accent); }

/* 拡散シミュレーション */
.spread-svg { width: 100%; max-width: 560px; display: block; margin: 8px auto; }
.spread-svg .edge { stroke: var(--border); stroke-width: 1.2; }
.spread-svg .node { fill: var(--surface-2); stroke: var(--text-muted); stroke-width: 1.5; transition: fill 0.3s; }
.spread-svg .node.seen { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
.spread-svg .node.copy { fill: var(--series-2); stroke: var(--text-primary); stroke-width: 2.5; }
.spread-svg .node.me { fill: var(--accent); stroke: var(--text-primary); stroke-width: 2.5; }
.spread-svg .node.deleted { fill: var(--surface-1); stroke: var(--text-muted); stroke-dasharray: 3 3; }
.spread-svg .node-label { font-size: 8px; fill: var(--surface-1); font-weight: 700; font-family: var(--font); pointer-events: none; }
.spread-stats { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; font-size: 0.92rem; }
.legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background: var(--surface-2); border: 1.5px solid var(--text-muted); }
.legend .dot.me { background: var(--accent); border-color: var(--text-primary); }
.legend .dot.seen { background: var(--series-1); border-color: var(--series-1); }
.legend .dot.copy { background: var(--series-2); border-color: var(--text-primary); }
@media (prefers-reduced-motion: reduce) { .spread-svg .node { transition: none; } }

/* 分岐型 */
.branch-log { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 10px; }
.branch-log > li { border-left: 3px solid var(--border); padding-left: 12px; }
.branch-q { margin: 0 0 4px; }
.branch-a { margin: 0; font-weight: 700; color: var(--accent); }
.case-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }

/* 行動宣言 */
.action-group { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px 12px; margin: 0 0 10px; }
.action-group legend { font-weight: 700; padding: 0 6px; }
.check-item:has(input:disabled) { opacity: 0.55; cursor: not-allowed; }
.declare-card { border: 3px double var(--accent); border-radius: 14px; padding: 20px 24px; background: var(--surface-1); }
.declare-title { font-size: 1.3rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
.declare-card ol { font-size: 1.1rem; font-weight: 700; line-height: 2; }
@media print {
  body.print-card main > *:not(:has(#declare-card)) { display: none; }
  body.print-card .card:not(:has(#declare-card)) { display: none; }
  body.print-card .module-head, body.print-card .btn-row, body.print-card .step-title { display: none; }
  body.print-card .card { border: none; box-shadow: none; }
}

/* 理解度チェック */
.check-q { border: 1px solid var(--border); }
.check-q legend { font-weight: 700; padding: 0; float: left; width: 100%; margin-bottom: 6px; }
.check-q .badge { font-size: 0.75rem; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.check-q .check-list { margin-top: 10px; clear: both; }
.check-q.is-correct { border-color: var(--good); }
.check-q.is-wrong { border-color: var(--bad); }

/* 表示の切りかえ */
.display-toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.display-toggles .toggle {
  font: inherit; font-size: 0.8rem; padding: 4px 10px; border-radius: 99px; border: 1.5px solid var(--border);
  background: var(--surface-1); color: var(--text-secondary); cursor: pointer; min-height: 32px;
}
.display-toggles .toggle[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.display-toggles .toggle[aria-pressed="true"]::before { content: "✓ "; }
html.large-text { font-size: 20px; }
.easy-summary { display: none; }
html.easy-mode .easy-summary { display: block; }
ruby rt { font-size: 0.55em; color: var(--text-secondary); font-weight: 400; }
ruby { ruby-align: center; }
@media (max-width: 860px) { html.large-text { font-size: 18px; } .display-toggles { order: 3; width: 100%; } }

/* デジタル化 */
.pixel-canvas { width: 100%; max-width: 320px; height: auto; image-rendering: pixelated; border-radius: 8px; border: 1px solid var(--border); display: block; }
.digital-row { align-items: start; }
.rle-grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 1px; width: 100%; max-width: 288px; background: var(--border); border: 1px solid var(--border); }
.rle-grid span { aspect-ratio: 1; background: #ffffff; }
.rle-grid span.on { background: #1b1b1a; }
.rle-codes { font-size: 0.8rem; margin: 6px 0 0; padding-left: 2.2em; line-height: 1.6; }
.app-footer p { margin: 0 0 4px; }
.app-footer .author { font-weight: 700; color: var(--text-secondary); }
.module-head .author { margin-top: -4px; }
main#view:focus { outline: none; }

/* ===== デジタル化ラボ用 ===== */
.pipeline { list-style: none; padding: 0; margin: 12px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; counter-reset: p; }
.pipeline li { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; position: relative; }
.pipeline li strong { font-size: 1.1rem; color: var(--accent); }
.pipeline li strong::before { counter-increment: p; content: counter(p) ". "; }
/* 矢印は箱と箱のすき間（24px）のまん中に出す（次の箱の下にかくれないように） */
.pipeline li:not(:last-child)::after { content: "→"; position: absolute; right: -12px; top: 50%; transform: translate(50%, -50%); color: var(--text-muted); font-weight: 700; line-height: 1; z-index: 1; }
@media (max-width: 560px) { .pipeline { grid-template-columns: 1fr; } .pipeline li:not(:last-child)::after { content: "↓"; right: 50%; top: auto; bottom: -12px; transform: translate(50%, 50%); } }

.paint-grid { display: grid; gap: 2px; width: 100%; max-width: 288px; background: var(--border); border: 2px solid var(--border); border-radius: 6px; }
.paint-grid .px-row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
.paint-grid.p16 { gap: 1px; max-width: 320px; }
.paint-grid.p16 .px-row { grid-template-columns: repeat(16, 1fr); gap: 1px; }
/* 指で塗るとき（タブレット）は、1マスを30px以上にする */
@media (pointer: coarse) {
  .digital-row.painting { grid-template-columns: minmax(0, 1fr); }
  .digital-row.painting .paint-grid.p16 { max-width: 512px; }
}
.paint-grid .px { aspect-ratio: 1; border: 0; padding: 0; margin: 0; background: #ffffff; cursor: pointer; min-width: 0; }
.paint-grid .px:hover { background: #d8e6f8; }
.paint-grid .px.on { background: #1b1b1a; }
.paint-grid .px:focus-visible { outline-offset: -3px; }
.row-compare { border-collapse: collapse; margin: 4px 0 8px; font-size: 0.95rem; }
.row-compare th, .row-compare td { padding: 1px 8px; text-align: center; letter-spacing: 0.12em; border-bottom: 1px solid var(--border); }
.row-compare thead th { font-family: var(--font); letter-spacing: 0; font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; }
.row-compare tbody th { color: var(--text-secondary); font-weight: 500; letter-spacing: 0; }
.row-compare tbody td:nth-child(2) { background: var(--surface-2); }
.row-compare tr.ng td:nth-child(3) { color: var(--bad); font-weight: 700; }
.row-compare td.ok { color: var(--good); font-weight: 700; }
.row-compare td.ng { color: var(--bad); font-weight: 700; }
.bit-rows { margin: 4px 0 8px; padding-left: 2.2em; font-size: 0.95rem; line-height: 1.55; letter-spacing: 0.12em; }
.bit-rows.target { background: var(--surface-2); border-radius: 8px; padding: 8px 8px 8px 2.6em; display: inline-block; }

.thumb { width: 48px; height: 48px; image-rendering: pixelated; border-radius: 4px; border: 1px solid var(--border); display: block; }
table.data td.num { text-align: right; white-space: nowrap; }

.swatch { width: 100%; max-width: 260px; aspect-ratio: 16 / 9; border-radius: 10px; border: 1px solid var(--border); }
.rgb-codes { margin-top: 8px; font-size: 0.95rem; line-height: 1.6; white-space: pre; }
.rgb-codes .wrap-note { white-space: normal; }
input.rgb-r { accent-color: #d33a2c; }
input.rgb-g { accent-color: #1f9a46; }
input.rgb-b { accent-color: #2a5fd6; }
.goal-list { list-style: none; padding: 0; margin: 4px 0; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.goal-list li.done { color: var(--good); font-weight: 700; }

.bit-cards { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 10px 0; }
.bit-card {
  display: grid; grid-template-rows: auto 1fr auto; place-items: center; gap: 2px; min-height: 108px; padding: 8px 2px;
  border: 2px solid var(--border); border-radius: 10px; background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 6px, var(--surface-1) 6px, var(--surface-1) 12px);
  color: var(--text-primary); font: inherit; cursor: pointer;
}
.bit-card[aria-pressed="true"] { background: var(--surface-1); border-color: var(--accent); }
.bit-card .bc-value { font-weight: 700; font-size: 1.15rem; min-height: 1.4em; }
.bit-card .bc-dots { font-size: 0.6rem; color: var(--accent); word-break: break-all; line-height: 1.1; text-align: center; }
.bit-card .bc-bit { font-family: var(--mono); font-weight: 700; font-size: 1.3rem; color: var(--text-secondary); }
.bit-card[aria-pressed="true"] .bc-bit { color: var(--accent); }
.bit-card[aria-pressed="false"] .bc-value { color: var(--text-muted); font-weight: 500; }
@media (max-width: 560px) { .bit-card { min-height: 84px; } .bit-card .bc-value { font-size: 0.9rem; } }
.goal { margin: 8px 0; }
.btn-row[hidden] { display: none; }

.big-char { font-size: 1.4rem; font-weight: 700; }
.ascii-table { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.4em, 1fr)); gap: 4px; margin: 10px 0; font-size: 0.85rem; }
.ascii-table span { background: var(--surface-2); border-radius: 6px; padding: 2px 6px; text-align: center; }

.hand-item { border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 10px; }
.hand-item .rle-grid { max-width: 420px; }
.inline-field { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inline-field input { max-width: 14em; }
.listen-log { margin: 4px 0 10px; padding-left: 1.4em; font-size: 0.9rem; }
details.advanced { margin-top: 14px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
details.advanced summary { cursor: pointer; font-weight: 700; }
.drill-head { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
.drill-head .badge { background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 0 10px; font-size: 0.85rem; font-weight: 700; }
.result-box .math-line { white-space: normal; overflow-wrap: anywhere; }

/* 第2段（2026-10-13 レビュー）: DL-03/04/05/15/16 */
details.drill-tips { margin: 0 0 10px; }
details.advanced summary { padding: 8px 0; min-height: 40px; }
.drill-kind-note { margin: -4px 0 8px; }
.drill-kind-note:empty { display: none; }
.calc-ok { margin-left: 0.4em; }
.lesson-plan { margin-top: 12px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
.lesson-plan h3 { font-size: 1rem; margin-bottom: 6px; }
.lesson-plan ul { margin: 0; padding-left: 1.2em; }
.lesson-plan li strong { margin-right: 0.5em; }
.lesson-plan .hint { margin: 6px 0 0; }
.listen-say.silent { border-color: var(--warn); background: var(--warn-soft); }
.listen-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px 16px; margin: 10px 0; }
.listen-charts figure { margin: 0; min-width: 0; }
.listen-charts figcaption { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 4px; }
.listen-quiz { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 10px; }
.listen-quiz .choice-list button:disabled { opacity: 0.55; cursor: not-allowed; }
.export-note { margin: 6px 0 0; font-weight: 700; }
.export-note.warn { color: var(--warn); }
.export-note.good { color: var(--good); }

/* ===== 11インチChromebook（1366×768・タッチ）向けの調整（2026-10-15） ===== */
/* CB-01: スライダーを指でつかみやすくする（つまみ28px・さわれる高さ40px） */
input[type="range"] { -webkit-appearance: none; appearance: none; height: 40px; margin: 0; padding: 0; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1.5px solid #8c8a82; }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 28px; height: 28px; margin-top: -11.5px; border-radius: 50%;
  background: var(--accent); border: 3px solid var(--surface-1); box-shadow: 0 0 0 1.5px var(--accent), 0 1px 3px rgba(0, 0, 0, 0.3);
}
input[type="range"]::-moz-range-track { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1.5px solid #8c8a82; }
input[type="range"]::-moz-range-progress { height: 8px; border-radius: 99px; background: var(--accent); }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface-1); box-shadow: 0 0 0 1.5px var(--accent); }
input[type="range"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
input[type="range"]:disabled { opacity: 0.45; cursor: not-allowed; }
/* CB-06: 補助のラベル（左メニューの見出し・ステップの札）を 13.6px 以上に */
.chapter-nav .nav-group { font-size: 0.8rem; }
.step-title .badge { font-size: 0.8rem; }

</style>

  <script>
"use strict";
// ---- js/store.js ----
const __m_js_store_js = (() => {

// 進捗・ふりかえりの保存（この端末のブラウザ内 localStorage のみ。外部には送らない）
// 注意: 写真や録音した音はここに絶対に渡さない（画面の中だけで使う）。

const STORE_KEY = "digilab.v1";

function emptyState() {
  return {
    version: 1,
    student: { cls: "", num: "", name: "" },
    modules: {}, // { [moduleId]: { steps: { [stepId]: isoDate }, score: {...} } }
    reflections: {}, // { [moduleId]: { text, at } }
    updatedAt: null,
  };
}

let state = load();
const listeners = new Set();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return emptyState();
    const parsed = JSON.parse(raw);
    return { ...emptyState(), ...parsed };
  } catch {
    return emptyState();
  }
}

function save() {
  state.updatedAt = new Date().toISOString();
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch {
    // プライベートモード等で保存できない場合も、画面上の体験は続けられる
  }
  listeners.forEach((fn) => fn(state));
}

const store = {
  get state() {
    return state;
  },
  subscribe(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  },
  completeStep(moduleId, stepId) {
    const m = (state.modules[moduleId] ||= { steps: {}, score: {} });
    if (m.steps[stepId]) return false;
    m.steps[stepId] = new Date().toISOString();
    save();
    return true;
  },
  isStepDone(moduleId, stepId) {
    return Boolean(state.modules[moduleId]?.steps?.[stepId]);
  },
  setScore(moduleId, key, value) {
    const m = (state.modules[moduleId] ||= { steps: {}, score: {} });
    m.score[key] = value;
    save();
  },
  getScore(moduleId, key) {
    return state.modules[moduleId]?.score?.[key];
  },
  setReflection(moduleId, text) {
    if (text) state.reflections[moduleId] = { text, at: new Date().toISOString() };
    else delete state.reflections[moduleId]; // 全部消したときは「まだ書いていません」にもどす
    save();
  },
  getReflection(moduleId) {
    return state.reflections[moduleId]?.text || "";
  },
  setStudent(info) {
    state.student = { ...state.student, ...info };
    save();
  },
  replaceAll(next) {
    state = { ...emptyState(), ...next };
    save();
  },
  reset() {
    state = emptyState();
    save();
  },
};

return { store };
})();

// ---- js/ui.js ----
const __m_js_ui_js = (() => {
const { store } = __m_js_store_js;
// 共通UI部品（解説カード、ステップ枠、ふりかえり、クイズ、トースト）

// 小さな要素ビルダー: h("div", { class: "card" }, "text", child)
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

// 解説カード。kind: "info" | "warn" | "good" | "bad"
function explainCard(label, body, kind = "info") {
  const card = h("div", { class: `explain ${kind === "info" ? "" : kind}`, role: kind === "warn" ? "note" : null });
  card.append(h("span", { class: "explain-label" }, label));
  if (typeof body === "string") card.append(h("p", { html: body }));
  else card.append(body);
  return card;
}

// ステップ枠。done() を呼ぶとチェックが付き、進捗に記録される
function stepCard(moduleId, step, index) {
  const check = h("span", { class: "check", "aria-live": "polite" });
  const head = h(
    "h2",
    { class: "step-title", id: `step-${moduleId}-${step.id}` },
    h("span", { class: "badge" }, `ステップ${index + 1}`),
    h("span", {}, step.title),
    check,
  );
  const body = h("div");
  const card = h("section", { class: "card", "aria-labelledby": `step-${moduleId}-${step.id}` }, head, body);
  const refresh = () => {
    check.textContent = store.isStepDone(moduleId, step.id) ? "✓ できた" : "";
  };
  refresh();
  return {
    el: card,
    body,
    done() {
      if (store.completeStep(moduleId, step.id)) toast(`「${step.title}」をクリアしました`);
      refresh();
    },
  };
}

// ---------- ふりかえりの自動保存 ----------
// 書いた文は「保存」を押さなくても、この端末に自動で保存する（「保存」ボタンを押したときと同じ保存先）。
// 入力が止まって約0.4秒後・ほかのページへ移るとき・ページを閉じるときに保存する。
const AUTOSAVE_MS = 400;
const REFLECTION_MIN = 5; // 5文字以上で「できた」になる
const pendingReflections = new Set();

// ふりかえりの文を保存する。ボタンでも自動でも同じ決まり（5文字以上なら onSaved で「できた」の印を付ける）
function saveReflectionText(moduleId, raw, onSaved) {
  const text = String(raw ?? "").trim();
  store.setReflection(moduleId, text);
  const done = text.length >= REFLECTION_MIN;
  if (done && onSaved) onSaved(text);
  return { text, done };

          answered = true;
          const ok = i === p.answer;
          if (ok) round.correct++;
          b.classList.add(ok ? "correct" : "wrong");
          b.prepend(ok ? "○ " : "× ");
          if (!ok) {
            correctBtn.classList.add("correct");
            correctBtn.prepend("○ ");
          }
          const nextBtn = h("button", { class: "btn", type: "button", onclick: next }, round.n >= ROUND ? "結果を見る" : "次の問題 →");
          fb.replaceChildren(explainCard(ok ? "正解！" : "解き方", p.explain, ok ? "good" : "warn"), h("div", { class: "btn-row" }, nextBtn));
          nextBtn.focus();
        });
        list.append(h("li", {}, b));
      }
      area.replaceChildren(
        h("div", { class: "drill-head" }, h("span", { class: "badge" }, `${round.n} / ${ROUND}問`), h("span", { class: "hint" }, `正解 ${round.correct}`)),
        h("p", {}, h("strong", {}, p.question)),
        list,
        fb,
      );
    }
    function finish() {
      const { correct } = round;
      const at = new Date().toISOString();
      const prev = store.getScore(ID, "best");
      if (!prev || correct > prev.correct) store.setScore(ID, "best", { correct, total: ROUND, at, kind });
      store.setScore(ID, "bests", updateDrillBests(store.getScore(ID, "bests"), kind, correct, ROUND, at));
      c1.done();
      // ステップ2は「いろいろ」（画像・音・単位がまざる）で8問以上
      if (correct >= 8 && kind === "mix") c2.done();
      showBest();
      area.replaceChildren(
        h("p", {}, "結果: ", h("strong", { class: "big-number" }, `${correct} / ${ROUND}問`)),
        correct >= 8
          ? kind === "mix"
            ? explainCard("すばらしい！", "データ量の計算がしっかりできています。ほかの種類の問題にも挑戦してみよう。", "good")
            : explainCard("よくできました", "ステップ2のクリアには、「いろいろ」で8問以上の正解が必要です。「いろいろ」にも挑戦しよう。", "good")
          : explainCard("もう一度やってみよう", "上の「計算のコツ」を見直してから、もう一度挑戦しよう。", "warn"),
        h("div", { class: "btn-row" }, h("button", { class: "btn", type: "button", onclick: start }, "もう一度（新しい問題）")),
      );
      if (correct === ROUND) toast("全問正解！");
    }

    // 計算のコツは、問題の上でいつでも開ける（下までスクロールしなくてよいように）
    const tips = h(
      "details",
      { class: "advanced drill-tips" },
      h("summary", {}, "計算のコツ・単位の決まりを見る"),
      explainCard(
        "計算のコツ",
        "<strong>画像</strong>: 横の画素数 × 縦の画素数 × 1画素のビット数<br><strong>音</strong>: 標本化周波数 × 量子化ビット数 × 秒数 × チャンネル数<br><strong>動画</strong>: 1枚の画像のデータ量 × 1秒あたりの枚数 × 秒数<br><strong>単位</strong>: 8ビット ＝ 1バイト、1024バイト ＝ 1KB、1024KB ＝ 1MB、1024MB ＝ 1GB<br><strong>ビット数</strong>: nビットで 2<sup>n</sup>通り（1ビット増えると2倍）",
      ),
      h("p", { class: "hint" }, "このラボでは 1KB ＝ 1024バイトで計算します。1KB ＝ 1000バイトとして計算する教科書もあり、どちらでもおよその大きさは同じです。"),
    );
    c1.body.append(
      h("p", {}, "問題の種類を選んで、10問に挑戦しよう。", h("strong", { class: "calc-ok" }, "電卓を使ってもよい。")),
      tabs,
      kindNote,
      tips,
      area,
      best,
    );
    c2.body.append(
      h("p", {}, "「いろいろ」で、10問のうち8問以上できたらクリアです。まちがえた問題は、「解き方」の式をノートに書いてたしかめよう。"),
      explainCard("よくあるまちがい", "ビットのまま答えてしまう（8でわるのを忘れる）／ステレオの「× 2」を忘れる／カラーの「× 3色」を二重にかける。答えを出したら、単位を見直そう。", "warn"),
    );
    root.append(c1.el, c2.el);
    showBest();
    setKind("mix");
  },
};

return { drillModule };
})();

// ---- js/catalog.js ----
const __m_js_catalog_js = (() => {
const { store } = __m_js_store_js;
const { imageModule } = __m_modules_image_js;
const { soundModule } = __m_modules_sound_js;
const { binaryModule } = __m_modules_binary_js;
const { compressModule } = __m_modules_compress_js;
const { drillModule } = __m_modules_drill_js;
// モジュールの一覧と進み具合の計算






const CATALOG = [
  { num: 1, id: "image", title: "画像のデジタル化", desc: "画素の数（解像度）と色の段階（階調）を変えて、見た目とデータ量をくらべる。白黒→グレー→カラー", module: imageModule },
  { num: 2, id: "sound", title: "音のデジタル化", desc: "音の波を標本化・量子化して、聞きくらべる。はかる回数が少ないと音はどうなる？", module: soundModule },
  { num: 3, id: "binary", title: "2進数と文字コード", desc: "0と1だけで数や文字を表すしくみ。ビットカードで10進数⇔2進数のパズル", module: binaryModule },
  { num: 4, id: "compress", title: "圧縮のしくみ", desc: "ランレングス圧縮を手作業→自動でやってみて、圧縮率をくらべる", module: compressModule },
  { num: 5, id: "drill", title: "データ量の計算ドリル", desc: "画像・音のデータ量を計算する練習（動画は発展）。何度でも新しい問題が出る。電卓を使ってもよい", module: drillModule },
];

function moduleProgress(entry) {
  const steps = entry.module.steps;
  const done = steps.filter((s) => store.isStepDone(entry.id, s.id)).length;
  return { done, total: steps.length, complete: done === steps.length };
}

// ---- js/records.js ----
const __m_js_records_js = (() => {
const { store } = __m_js_store_js;
const { h, explainCard, downloadFile, toast } = __m_js_ui_js;
const { moduleProgress } = __m_js_catalog_js;
const { drillBestText } = __m_js_digilib_js;
// ふりかえり・記録: 名前の入力、進み具合とふりかえりの一覧、JSON/CSV の書き出し（端末内でファイルを作るだけ。送信はしない）




function renderRecords(view, catalog) {
  const s = store.state;
  const field = (id, label, key, width) => {
    const input = h("input", { type: "text", id, value: s.student[key] || "", maxlength: "40", style: width ? `max-width:${width}` : null });
    input.addEventListener("change", () => store.setStudent({ [key]: input.value.trim() }));
    return h("div", { class: "field" }, h("label", { for: id }, label), input);
  };
  const rows = catalog.map((c) => {
    const p = moduleProgress(c);
    const best = c.id === "drill" ? drillBestText(s.modules.drill?.score) : "";
    return h(
      "tr",
      {},
      h("td", {}, `${c.num}. ${c.title}`),
      h("td", {}, p.complete ? "✓ 完了" : `${p.done} / ${p.total}`),
      h("td", {}, best ? `ドリル最高 ${best}` : ""),
      h("td", {}, store.getReflection(c.id) || h("span", { class: "hint" }, "（まだ書いていません）")),
    );
  });

  // 書き出す前に、組と番号が入っているかを確かめる（だれの記録か分からないファイルにしないため）
  const note = h("p", { class: "export-note", role: "status", "aria-live": "polite" });
  const setNote = (msg, kind) => {
    note.className = `export-note ${kind}`;
    note.textContent = msg;
  };
  const readFields = () => {
    // 入力したばかりの文字も使う（change が起きる前に押されたとき）
    const info = {};
    for (const [id, key] of [["rec-cls", "cls"], ["rec-num", "num"], ["rec-name", "name"]]) {
      const el = document.getElementById(id);
      if (el) info[key] = el.value.trim();
    }
    store.setStudent(info);
  };
  const doExport = (ext) => {
    readFields();
    const missing = missingFields(store.state.student);
    if (missing.length) {
      setNote(EXPORT_MESSAGES.missing, "warn");
      document.getElementById(missing[0] === "cls" ? "rec-cls" : "rec-num")?.focus();
      return;
    }
    const name = fileName(ext);
    if (ext === "json") downloadFile(name, JSON.stringify(buildExport(catalog), null, 2));
    else downloadFile(name, "\ufeff" + toCsv(buildExport(catalog)), "text/csv");
    setNote(EXPORT_MESSAGES.saved(name), "good");
  };
  const reset = () => {
    if (!confirm("この端末に保存した進み具合とふりかえりを、すべて消します。よろしいですか？")) return;
    store.reset();
    renderRecords(view, catalog);
    toast("記録を消しました");
  };

  view.replaceChildren(
    h("div", { class: "module-head" }, h("h1", {}, "ふりかえり・記録"), h("p", { class: "meta" }, "進み具合とふりかえりは、この端末のブラウザの中にだけ保存されています。提出するときは、ファイルに書き出してください。")),
    h("section", { class: "card" }, h("h2", {}, "名前"), h("div", { class: "field-row" }, field("rec-cls", "組", "cls", "8em"), field("rec-num", "番号", "num", "6em"), field("rec-name", "名前", "name"))),
    h("section", { class: "card" }, h("h2", {}, "進み具合とふりかえり"), h("div", { class: "table-wrap" }, h("table", { class: "data" }, h("thead", {}, h("tr", {}, h("th", {}, "モジュール"), h("th", {}, "ステップ"), h("th", {}, "記録"), h("th", {}, "ふりかえり"))), h("tbody", {}, rows)))),
    h(
      "section",
      { class: "card" },
      h("h2", {}, "書き出す"),
      h("p", {}, h("strong", {}, "先生に出すのは JSON のファイルです。"), "CSV は、表計算ソフトで見るときに使います。"),
      h("div", { class: "btn-row" }, h("button", { class: "btn", type: "button", onclick: () => doExport("json") }, "JSONで書き出す（提出用）"), h("button", { class: "btn secondary", type: "button", onclick: () => doExport("csv") }, "CSVで書き出す（表計算ソフト用）")),
      note,
      explainCard("書き出す中身", "名前、各モジュールの進み具合、ドリルの最高点（種類ごと）、ふりかえりの文章だけです。読み込んだ写真や録音した声は含まれません。"),
    ),
    h("section", { class: "card" }, h("h2", {}, "記録を消す"), h("p", { class: "hint" }, "次の人に端末をわたすときに使います。"), h("div", { class: "btn-row" }, h("button", { class: "btn secondary", type: "button", onclick: reset }, "この端末の記録をすべて消す"))),
  );
}

// 書き出しのときの文（どの教材でも同じ言い方）
const EXPORT_MESSAGES = {
  missing: "組と番号を入れてから書き出そう",
  saved: (name) => `ファイルを保存しました（ファイル名: ${name}）。先生に言われた場所に出そう。`,
};
// 書き出しに足りない欄（組・番号）。空なら ["cls", "num"] のように返す
function missingFields(student = {}) {
  return ["cls", "num"].filter((k) => !String(student[k] ?? "").trim());
}

function fileName(ext) {
  const st = store.state.student;
  const who = [st.cls, st.num, st.name].filter(Boolean).join("_") || "記録";
  return `デジタル化ラボ_${who}.${ext}`.replace(/[\\/:*?"<>|]/g, "_");
}

function buildExport(catalog) {
  const s = store.state;
  return {
    app: "デジタル化ラボ",
    exportedAt: new Date().toISOString(),
    student: s.student,
    modules: catalog.map((c) => {
      const p = moduleProgress(c);
      return { id: c.id, title: c.title, stepsDone: p.done, stepsTotal: p.total, complete: p.complete, score: s.modules[c.id]?.score || {}, reflection: store.getReflection(c.id) };
    }),
  };
}

const csvCell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
function toCsv(data) {
  const head = ["組", "番号", "名前", "モジュール", "できたステップ", "全ステップ", "完了", "ドリル最高点", "ふりかえり"];
  const lines = data.modules.map((m) => {
    const best = drillBestText(m.score, true);
    return [data.student.cls, data.student.num, data.student.name, m.title, m.stepsDone, m.stepsTotal, m.complete ? "○" : "", best, m.reflection].map(csvCell).join(",");
  });
  return [head.map(csvCell).join(","), ...lines].join("\r\n");
}

return { renderRecords, EXPORT_MESSAGES, missingFields, fileName, buildExport };
})();

// ---- js/app.js ----
const __m_js_app_js = (() => {
const { store } = __m_js_store_js;
const { h, explainCard, flushReflections } = __m_js_ui_js;
const { CATALOG, moduleProgress } = __m_js_catalog_js;
const { renderRecords } = __m_js_records_js;
// アプリ本体: 章ナビ、ルーティング、進捗表示、文字の大きさの切りかえ




const view = document.getElementById("view");
const nav = document.getElementById("chapter-nav");
const overall = document.getElementById("overall-progress");
const toggles = document.getElementById("display-toggles");
const PREF_KEY = "digilab.largeText";

function parseHash() {
  const [id = "home", step = null] = location.hash.replace(/^#\/?/, "").split("/");
  return { id: id || "home", step };
}

function renderNav(currentId) {
  const ol = h("ol");
  const link = (href, num, title, id, done) =>
    h(
      "li",
      { class: done ? "done" : "" },
      h("a", { href, "aria-current": currentId === id ? "page" : null }, h("span", { class: "num", "aria-hidden": "true" }, done ? "✓" : num), h("span", {}, title, done ? h("span", { class: "visually-hidden" }, "（完了）") : null)),
    );
  ol.append(link("#/", "⌂", "はじめに", "home", false));
  ol.append(h("li", { class: "nav-group", "aria-hidden": "true" }, "体験する"));
  for (const c of CATALOG) ol.append(link(`#/${c.id}`, c.num, c.title, c.id, moduleProgress(c).complete));
  ol.append(h("li", { class: "nav-group", "aria-hidden": "true" }, "記録する"));
  ol.append(link("#/records", "✎", "ふりかえり・記録", "records", false));
  nav.replaceChildren(h("nav", { "aria-label": "章ナビゲーション" }, ol));
}

function renderOverall() {
  const all = CATALOG.map(moduleProgress);
  const done = all.reduce((a, p) => a + p.done, 0);
  const total = all.reduce((a, p) => a + p.total, 0);
  const pct = total ? Math.round((done / total) * 100) : 0;
  overall.replaceChildren(
    h("span", {}, "進み具合"),
    h("div", { class: "bar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": pct, "aria-label": "全体の進み具合" }, h("span", { style: `width:${pct}%` })),
    h("span", {}, `${pct}%`),
  );
}

function largeText() {
  try {
    return localStorage.getItem(PREF_KEY) === "1";
  } catch {
    return false;
  }
}
function renderToggles() {
  const on = largeText();
  document.documentElement.classList.toggle("large-text", on);
  const b = h("button", { type: "button", class: "toggle", "aria-pressed": on ? "true" : "false" }, "大きな文字");
  b.addEventListener("click", () => {
    try {
      localStorage.setItem(PREF_KEY, on ? "0" : "1");
    } catch {}
    renderToggles();
  });
  toggles.replaceChildren(b);
}

// アナログ→デジタルの3つの手順（標本化・量子化・符号化）の図
function pipeline() {
  return h(
    "ol",
    { class: "pipeline", "aria-label": "デジタル化の3つの手順" },
    h("li", {}, h("strong", {}, "標本化"), h("span", {}, "一定の間かくで区切って、値を取り出す"), h("span", { class: "hint" }, "画像なら画素に分ける・音なら時間で区切る")),
    h("li", {}, h("strong", {}, "量子化"), h("span", {}, "取り出した値を、決まった段階の数にあてはめる"), h("span", { class: "hint" }, "画像なら色の段階・音なら波の高さの段階")),
    h("li", {}, h("strong", {}, "符号化"), h("span", {}, "段階の番号を、0と1の並び（2進数）にする"), h("span", { class: "hint" }, "例: 番号5 → 101")),
  );
}

function renderHome() {
  const cards = CATALOG.map((c) => {
    const p = moduleProgress(c);
    return h(
      "a",
      { class: "module-card", href: `#/${c.id}` },
      h("span", { class: "mc-num" }, `${c.num}・目安 ${c.module.minutes}`),
      h("span", { class: "mc-title" }, c.title),
      h("span", { class: "mc-desc" }, c.desc),
      h("div", { class: "bar", "aria-hidden": "true" }, h("span", { style: `width:${(p.done / p.total) * 100}%` })),
      h("span", { class: "hint" }, p.complete ? "✓ 完了" : `${p.done} / ${p.total} ステップ`),
    );
  });
  view.replaceChildren(
    h("div", { class: "module-head" }, h("h1", {}, "デジタル化ラボ"), h("p", { class: "meta" }, "コンピュータは、画像も音も文字も「0と1」にして扱います。どうやって0と1にするのか、そのときデータの量（情報量）がどう変わるのかを、手を動かして確かめよう。"), h("p", { class: "hint author" }, "作成：羽生市立南中学校 技術 岡田")),
    h(
      "section",
      { class: "card" },
      h("h2", {}, "デジタル化の3つの手順"),
      h("p", {}, "連続して変わる量（アナログ）を、とびとびの数（デジタル）にするには、次の3つの手順をふみます。どのモジュールでも、この手順が出てきます。"),
      pipeline(),
      explainCard("安心して体験できます", "このラボはすべてこのブラウザの中だけで動き、インターネットには一切つながりません。自分の写真を読み込んだり、マイクで声を録音したりしても、保存も送信もしません。"),
    ),
    h(
      "section",
      { class: "card" },
      h("h2", {}, "すすめ方"),
      h("ol", {}, h("li", {}, "1〜4のモジュールを順に体験し、最後にふりかえりを書く"), h("li", {}, "5の計算ドリルで、データ量の計算を練習する"), h("li", {}, h("a", { href: "#/records" }, "ふりかえり・記録"), "からファイルを書き出して提出する")),
      h(
        "div",
        { class: "lesson-plan" },
        h("h3", {}, "2時間で行うときの例"),
        h(
          "ul",
          {},
          h("li", {}, h("strong", {}, "1時間目"), "「はじめに・1 画像・2 音」"),
          h("li", {}, h("strong", {}, "2時間目"), "「3 2進数・4 圧縮・ふりかえり・記録」"),
          h("li", {}, h("strong", {}, "5 ドリル"), "は、次の時間のはじめや復習に使う"),
        ),
        h("p", { class: "hint" }, "時間の終わりには、ふりかえりを書いてから次へ進もう。"),
      ),
    ),
    h("section", { class: "module-group" }, h("h2", {}, "モジュール"), h("div", { class: "module-grid" }, cards)),
    h("div", { class: "btn-row start-row" }, h("a", { class: "btn", href: `#/${CATALOG[0].id}` }, `${CATALOG[0].num} ${CATALOG[0].title}からはじめよう →`)),
  );
}

async function renderModule(entry, stepId) {
  const m = entry.module;
  const root = h("div");
  view.replaceChildren(h("div", { class: "module-head" }, h("p", { class: "meta" }, `モジュール${entry.num}・目安 ${m.minutes}`), h("h1", {}, entry.title), h("p", {}, m.lead)), root);
  const idx = CATALOG.indexOf(entry);
  const prev = CATALOG[idx - 1];
  const next = CATALOG[idx + 1];
  const navRow = h(
    "div",
    { class: "btn-row" },
    prev ? h("a", { class: "btn secondary", href: `#/${prev.id}` }, "← 前のモジュール") : null,
    next ? h("a", { class: "btn", href: `#/${next.id}` }, `次へ：${next.title} →`) : h("a", { class: "btn", href: "#/records" }, "ふりかえり・記録へ →"),
  );
  await m.render(root);
  view.append(navRow);
  if (stepId) document.getElementById(`step-${entry.id}-${stepId}`)?.scrollIntoView({ block: "start" });
}

let current = null;
async function route() {
  const { id, step } = parseHash();
  const entry = CATALOG.find((c) => c.id === id);
  flushReflections(); // 書きかけのふりかえりを、ページを移る前に保存する
  current?.module?.leave?.(); // 前のモジュールの後片付け（マイクを止めるなど）
  current = entry || null;
  renderNav(id);
  renderOverall();
  window.scrollTo(0, 0);
  if (entry) await renderModule(entry, step);
  else if (id === "records") renderRecords(view, CATALOG);
  else renderHome();
  document.title = `${entry ? entry.title : id === "records" ? "ふりかえり・記録" : "はじめに"} | デジタル化ラボ`;
  if (!step) view.focus({ preventScroll: true });
}

store.subscribe(() => {
  renderNav(parseHash().id);
  renderOverall();
});
window.addEventListener("hashchange", route);
renderToggles();
route();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

return {  };
})();
</script>
