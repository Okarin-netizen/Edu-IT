  <style id="eduit-frame-css">
/* Edu-IT 共通の枠(4分野・全アプリ共通)
 * 色・文字・ボタン・カード・ヘッダー・フッターの見た目をそろえるための部品。
 * 分野の色は <html data-ef-domain="A|B|C|D"> で切りかわる。
 * アプリ固有の見た目は各アプリの CSS に残し、ここでは「枠」だけを決める。
 */
:root {
  --ef-font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --ef-bg: #f5f4f0;          /* 画面の地 */
  --ef-surface: #ffffff;     /* カード・ヘッダー */
  --ef-surface-2: #f8f7f4;   /* 一段下げた面 */
  --ef-line: #d6d3cb;        /* 枠線 */
  --ef-text: #1f2328;
  --ef-muted: #565d68;
  --ef-focus: #f08c00;       /* キーボード操作の枠 */
  --ef-radius: 12px;
  --ef-radius-s: 8px;
  --ef-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .04);
  --ef-header-h: 52px;
  --ef-tap: 40px;            /* ボタンの最小の高さ */
  /* 分野の色(既定は D) */
  --ef-accent: #1a5fc8;
  --ef-accent-ink: #ffffff;
  --ef-accent-soft: #e6eefb;
}
:root[data-ef-domain="A"] { --ef-accent: #985a26; --ef-accent-soft: #f5e9dc; }  /* 材料と加工: 木の茶 */
:root[data-ef-domain="B"] { --ef-accent: #2e7d32; --ef-accent-soft: #e4f2e5; }  /* 生物育成: 緑 */
:root[data-ef-domain="C"] { --ef-accent: #b45309; --ef-accent-soft: #fbeedd; }  /* エネルギー変換: だいだい */
:root[data-ef-domain="D"] { --ef-accent: #1a5fc8; --ef-accent-soft: #e6eefb; }  /* 情報: 青 */

/* ---- ヘッダー ----
 * <header class="ef-header">
 *   <a class="ef-btn ef-back" href="…">◀ メニュー</a>
 *   <h1 class="ef-title"><span class="ef-icon">…</span>アプリ名</h1>
 *   <div class="ef-tools"> ふりがな / 文字の大きさ / くっきり / 使い方 などの .ef-btn </div>
 * </header>
 */
.ef-header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  min-height: var(--ef-header-h); padding: 6px 14px;
  background: var(--ef-surface); color: var(--ef-text);
  border-bottom: 3px solid var(--ef-accent);
  font-family: var(--ef-font);
  box-sizing: border-box;
}
.ef-title {
  display: flex; align-items: center; gap: 8px;
  margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--ef-text);
}
.ef-title .ef-icon { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; font-size: 22px; }
.ef-title .ef-sub { font-size: 13px; font-weight: 400; color: var(--ef-muted); }
.ef-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }

/* ---- ボタン ----
 * .ef-btn          ふつうのボタン(白地・枠線・丸角)
 * .ef-btn.is-on    ON の状態(分野の色で塗る)。aria-pressed="true" でも同じ
 * .ef-btn-primary  いちばん大事な操作(はじめる・ひらく など)
 */
.ef-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--ef-tap); padding: 0 14px;
  border: 1px solid var(--ef-line); border-radius: 999px;
  background: var(--ef-surface); color: var(--ef-text);
  font: 600 15px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
  box-sizing: border-box; white-space: nowrap;
}
.ef-btn:hover { border-color: var(--ef-accent); }
.ef-btn.is-on, .ef-btn[aria-pressed="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-back { color: var(--ef-accent); border-color: transparent; background: var(--ef-accent-soft); }
.ef-btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 20px;
  border: 0; border-radius: var(--ef-radius-s);
  background: var(--ef-accent); color: var(--ef-accent-ink);
  font: 700 16px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
}
.ef-btn-primary:hover { filter: brightness(1.08); }
.ef-btn:focus-visible, .ef-btn-primary:focus-visible, .ef-about-link:focus-visible, .ef-dialog :focus-visible {
  outline: 3px solid var(--ef-focus); outline-offset: 2px;
}

/* ---- メニューのカード ----
 * <article class="ef-card"> <p class="ef-card-tag">M1</p> <h3 class="ef-card-title">…</h3> <p>…</p> <a class="ef-btn-primary">ひらく ▶</a> </article>
 */
.ef-page { background: var(--ef-bg); color: var(--ef-text); font-family: var(--ef-font); }
.ef-card {
  background: var(--ef-surface); border: 1px solid var(--ef-line); border-top: 4px solid var(--ef-accent);
  border-radius: var(--ef-radius); box-shadow: var(--ef-shadow); padding: 16px 18px;
}
.ef-card-tag { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ef-accent); }
.ef-card-title { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: var(--ef-text); }

/* ---- フッター(作成者・このアプリについて) ---- */
.ef-footer {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 14px;
  margin: 24px 0 0; padding: 12px 16px;
  border-top: 1px solid var(--ef-line); background: var(--ef-surface-2);
  font: 13px/1.6 var(--ef-font); color: var(--ef-muted);
}
.ef-footer .ef-author { font-weight: 700; color: var(--ef-text); }
.ef-about-link {
  border: 0; background: none; padding: 2px 4px; cursor: pointer;
  font: inherit; color: var(--ef-accent); text-decoration: underline;
}
/* ヘッダーなどに置く小さい「このアプリについて」ボタン */
.ef-about-btn { font-size: 14px; }

/* ---- このアプリについて(ダイアログ) ---- */
.ef-dialog {
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  padding: 0; border: 1px solid var(--ef-line); border-radius: var(--ef-radius);
  background: var(--ef-surface); color: var(--ef-text); font: 15px/1.7 var(--ef-font);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
}
.ef-dialog::backdrop { background: rgba(0, 0, 0, .4); }
.ef-dialog-in { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.ef-dialog-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 3px solid var(--ef-accent); }
.ef-dialog-head h2 { margin: 0; font-size: 18px; flex: 1; }
.ef-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px 0; }
.ef-tab { border: 1px solid var(--ef-line); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--ef-surface-2);
  padding: 6px 12px; font: 600 14px/1.3 var(--ef-font); color: var(--ef-text); cursor: pointer; min-height: 36px; }
.ef-tab[aria-selected="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-panel { padding: 14px 18px 18px; overflow: auto; border-top: 1px solid var(--ef-line); }
.ef-panel h3 { margin: 12px 0 4px; font-size: 16px; }
.ef-panel ul { margin: 4px 0 8px; padding-left: 1.3em; }
.ef-panel p { margin: 4px 0 8px; }
.ef-hist-ver { font-weight: 700; color: var(--ef-accent); }
.ef-hist-date { color: var(--ef-muted); font-size: 13px; margin-left: 6px; }

/* 文字を大きくした・くっきりのときも読めるように */
@media print { .ef-footer, .ef-dialog { display: none !important; } }

</style>
  <style>
/* 生成AIのしくみラボ。色・文字・ボタンは共通の枠(shared/eduit-frame.css)の --ef-* を使う */
:root {
  --gl-ok: #1a7f4b;
  --gl-ok-soft: #e3f4ea;
  --gl-ng: #c0362c;
  --gl-ng-soft: #fde7e4;
  --gl-warn: #b45309;
  --gl-warn-soft: #fdf0dc;
  --gl-info-soft: #eef3fb;
  --gl-chip-0: #dce8fb;
  --gl-chip-1: #fbe3c8;
  --gl-chip-2: #dff1d8;
  --gl-chip-3: #f1dcf3;
  --gl-nav-w: 262px;
}
html { font-size: 16px; }
html.big-text { font-size: 19px; }
body { margin: 0; background: var(--ef-bg); color: var(--ef-text); font-family: var(--ef-font); line-height: 1.7; }
* { box-sizing: border-box; }
rt { display: none; font-size: .55em; }
.show-ruby rt { display: ruby-text; }
button, input, select, textarea { font: inherit; }
.skip-link { position: absolute; left: -999px; top: 0; }
.skip-link:focus { left: 8px; z-index: 10; background: var(--ef-surface); padding: 6px 10px; }
.ef-title { text-decoration: none; }
.ef-btn, .ef-btn-primary { font-size: 1rem; }

.layout { display: grid; grid-template-columns: var(--gl-nav-w) minmax(0, 1fr); min-height: calc(100vh - var(--ef-header-h)); }
.side { background: var(--ef-surface); border-right: 1px solid var(--ef-line); padding: 12px 10px 24px; position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; }
.nav-group { margin: 14px 8px 4px; font-size: .8rem; font-weight: 700; letter-spacing: .06em; color: var(--ef-muted); }
.nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav-link { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--ef-radius-s); color: var(--ef-text); text-decoration: none; font-weight: 600; font-size: .95rem; line-height: 1.35; }
.nav-link:hover { background: var(--ef-surface-2); }
.nav-link[aria-current="page"] { background: var(--ef-accent-soft); color: var(--ef-accent); }
.nav-no { flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ef-surface-2); border: 1px solid var(--ef-line); font-size: .8rem; color: var(--ef-muted); }
.nav-link[aria-current="page"] .nav-no { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }

main { min-width: 0; padding-block: 18px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); outline: none; }
#view { max-width: 980px; margin: 0 auto; }
.sec-head { margin-bottom: 10px; }
.sec-group { margin: 0; font-size: .85rem; font-weight: 700; color: var(--ef-accent); letter-spacing: .04em; }
.sec-title { margin: 0; font-size: 1.6rem; line-height: 1.3; text-wrap: balance; }
.sec-body { display: grid; gap: 16px; }
.lead { margin: 0; font-size: 1.05rem; max-width: 46em; }
.muted { color: var(--ef-muted); font-size: .9rem; margin: 0; }
.small-title { margin: 8px 0 4px; font-weight: 700; font-size: .95rem; }

.panel { background: var(--ef-surface); border: 1px solid var(--ef-line); border-radius: var(--ef-radius); padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.panel-title { margin: 0; font-size: 1.15rem; }
.panel p { margin: 0; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.two .panel { border-top: 4px solid var(--ef-accent); align-content: start; }
.two .ef-btn-primary { justify-self: start; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; background: var(--ef-surface); border: 1px solid var(--ef-line); border-radius: var(--ef-radius); padding: 12px 16px; }
.ctl { display: grid; gap: 4px; min-width: 0; max-width: 100%; }
select.input { width: 100%; text-overflow: ellipsis; }
.ctl-label { font-size: .85rem; font-weight: 700; color: var(--ef-muted); }
.input { border: 1px solid var(--ef-line); border-radius: var(--ef-radius-s); padding: 8px 10px; background: var(--ef-surface); color: var(--ef-text); min-height: 42px; max-width: 100%; }
textarea.input { width: 100%; resize: vertical; }
input[type="text"].input { flex: 1 1 260px; }
.range { display: flex; align-items: center; gap: 10px; }
.range input { width: 180px; accent-color: var(--ef-accent); }
.range output { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 6.5em; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }

/* はじめに */
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.flow-box { flex: 1 1 180px; background: var(--ef-surface); border: 1px solid var(--ef-line); border-radius: var(--ef-radius); padding: 12px 14px; display: grid; gap: 2px; }
.flow-box b { color: var(--ef-accent); font-size: 1.05rem; }
.flow-box span { font-size: .92rem; }
.flow-box.accent { background: var(--ef-accent-soft); border-color: var(--ef-accent); }
.flow-arrow { align-self: center; font-size: 1.4rem; color: var(--ef-muted); }
.teacher { background: var(--ef-surface-2); border: 1px dashed var(--ef-line); border-radius: var(--ef-radius); padding: 10px 16px; }
.teacher summary { font-weight: 700; cursor: pointer; }
.teacher ul { margin: 8px 0 0; padding-left: 1.2em; font-size: .92rem; }

/* ポイント・結果 */
.point { border-left: 0; background: var(--gl-info-soft); border-radius: var(--ef-radius); padding: 12px 16px; }
.point-title { margin: 0 0 4px; font-weight: 700; color: var(--ef-accent); }
.point p, .point ul { margin: 4px 0 0; }
.point ul { padding-left: 1.2em; }
.result { border-radius: var(--ef-radius-s); padding: 10px 14px; font-weight: 600; }
.result.ok { background: var(--gl-ok-soft); color: #11552f; }
.result.ng { background: var(--gl-ng-soft); color: #8a1f17; }
.result.warn { background: var(--gl-warn-soft); color: #7a3a06; }
.result.info { background: var(--gl-info-soft); color: #173f7a; }
.badge { display: inline-block; flex: none; padding: 1px 8px; margin-right: 6px; border-radius: 999px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
.badge.gray { background: var(--ef-surface-2); border: 1px solid var(--ef-line); color: var(--ef-muted); }
.badge.orange { background: var(--gl-warn-soft); color: #7a3a06; border: 1px solid #f0c48a; }

/* つぎの言葉あて */
.big-sentence { font-size: 1.5rem; font-weight: 700; line-height: 1.6; }
.blank { display: inline-block; min-width: 3em; margin-left: 6px; padding: 0 10px; border-bottom: 3px solid var(--ef-accent); color: var(--ef-accent); text-align: center; }
.choices, .quiz-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.quiz-opts { grid-template-columns: 1fr; }
.choice { min-height: 48px; padding: 8px 14px; border: 2px solid var(--ef-line); border-radius: var(--ef-radius-s); background: var(--ef-surface); color: var(--ef-text); font-weight: 600; text-align: left; cursor: pointer; }
.choice:hover:not(:disabled) { border-color: var(--ef-accent); }
.choice:disabled { cursor: default; }
.choice.is-picked { border-color: var(--ef-accent); background: var(--ef-accent-soft); }
.choice.right { border-color: var(--gl-ok); background: var(--gl-ok-soft); }
.choice.wrong { border-color: var(--gl-ng); background: var(--gl-ng-soft); }
.prob { border-collapse: collapse; width: 100%; max-width: 640px; }
.prob th, .prob td { padding: 4px 8px; text-align: left; border-bottom: 1px solid var(--ef-line); font-weight: 600; }
.prob thead th { font-size: .8rem; color: var(--ef-muted); }
.prob td:nth-child(2) { width: 50%; }
.prob tr.is-you th { color: var(--ef-accent); }
.num { text-align: right !important; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { display: block; height: 14px; background: var(--ef-surface-2); border: 1px solid var(--ef-line); border-radius: 999px; overflow: hidden; min-width: 60px; }
.bar-fill { display: block; height: 100%; background: var(--ef-accent); border-radius: 999px; transition: width .2s; }
@media (prefers-reduced-motion: reduce) { .bar-fill { transition: none; } }
.word-btn { border: 1px solid var(--ef-accent); background: var(--ef-surface); color: var(--ef-accent); border-radius: 8px; padding: 2px 10px; min-height: 34px; font-weight: 700; cursor: pointer; }
.word-btn:hover { background: var(--ef-accent-soft); }

/* トークン */
.stats { font-variant-numeric: tabular-nums; margin: 0; }
.stats b { font-size: 1.3rem; color: var(--ef-accent); }
.tok-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.tok { display: inline-grid; justify-items: center; padding: 4px 8px; border-radius: 8px; border: 1px solid transparent; }
.tok-t { font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
.tok-id { font-size: .75rem; color: var(--ef-muted); font-variant-numeric: tabular-nums; }
.tok.unknown { border: 1px dashed var(--ef-muted); }
.c0 { background: var(--gl-chip-0); } .c1 { background: var(--gl-chip-1); } .c2 { background: var(--gl-chip-2); } .c3 { background: var(--gl-chip-3); }
.ids { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9rem; overflow-wrap: anywhere; margin: 0; background: var(--ef-surface-2); border-radius: 8px; padding: 8px 10px; }

/* ミニ文章AI */
.sentence { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 56px; padding: 10px 12px; background: var(--ef-surface-2); border-radius: var(--ef-radius-s); font-size: 1.25rem; font-weight: 700; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.chip { padding: 2px 8px; border-radius: 6px; }
.cursor { display: inline-block; padding: 0 10px; border: 2px dashed var(--ef-accent); border-radius: 6px; color: var(--ef-accent); }
.made, .gen-list, .send-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.made li { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px; }
.more summary { font-weight: 700; cursor: pointer; }
.data-list { margin: 0; padding-left: 1.8em; font-size: .92rem; columns: 2 20em; column-gap: 24px; }

// 文章をつくるAIの小さな模型(n-gram)と、トークンに分けるしくみ。
// 画面を使わない計算だけを書く(tests/unit.test.mjs から Node でも読める)。
var GenaiLM = (function () {
  'use strict';
  var START = '^';
  var ENDS = ['。', '！', '？'];

  // ---- トークンに分ける ----
  // 知っている言葉(vocab)のうち、いちばん長く合うものから切る。知らない文字は1文字ずつ。
  // 英字・数字のならびは5文字ずつのかけらにする。
  function makeVocab(words) {
    var list = [];
    var seen = {};
    words.forEach(function (w) {
      if (w && !seen[w]) { seen[w] = true; list.push(w); }
    });
    var index = {};
    list.forEach(function (w, i) { index[w] = i + 1; });
    var maxLen = list.reduce(function (m, w) { return Math.max(m, Array.from(w).length); }, 1);
    return { list: list, index: index, maxLen: maxLen };
  }

  function charKind(c) {
    if (/[A-Za-z0-9Ａ-Ｚａ-ｚ０-９]/.test(c)) return 'ascii';
    if (/\s/.test(c)) return 'space';
    return 'other';
  }

  // ================= 2 トークン =================

  // ================= 3 ミニ文章AI =================

  // ================= 4 もっともらしいまちがい =================
  var hs = { order: 2, results: [], judged: {}, marks: {}, revealed: {} };

    var resList = h('ul', { class: 'gen-list' }, hs.results.map(function (r, i) {

    el.appendChild(card('A ミニ文章AIに「日本のいちばん」を学習させる',

    el.appendChild(B);

    el.appendChild(point('ここがポイント',
      h('ul', null,

        h('li', { text: 'とくに、数字・年・人名・本や記事の名前・URL はまちがいやすい所です。' }),

  // ================= 5 ノイズをまぜる =================
  var ns = { pic: 0, level: 40, seed: 7, game: null };
  function renderNoise(el) {

      h('p', { class: 'small-title', text: 'ノイズの段階' }),
      h('div', { class: 'strip' }, levels.map(function (lv) {

    // AIになってみよう

        }))));

        if (g.round < 4) gameCard.appendChild(btn('つぎの問題(ノイズが多くなる) ▶', function () { ns.game = newRound(g.round + 1, g.score); go('noise'); }, 'ef-btn-primary'));

  function sigmaOf(level) { return 1.6 * level / 100; }

  }

  // ================= 6 ノイズから絵をつくる =================
  var STEPS = 20;
  var gs = { word: 'ねこ', word2: '', mix: 0.5, k: 0, x: null, x0: null, weights: null, sched: IM.schedule(STEPS, 1.6, 0.04), rnd: null, running: false };

    gs.rnd = LM.seeded(Math.floor(Math.random() * 1e9) + 1);

    gs.x = IM.addNoise(new Float32Array(IM.DIM), IM.noise(gs.rnd), gs.sched[0]);
    gs.x0 = null; gs.weights = null; gs.running = false;
  }
  function mixOf() {
    var m = {};
    if (!gs.word) { m['*'] = 1; return m; }
    if (gs.word2 && gs.word2 !== gs.word) { m[gs.word] = 1 - gs.mix; m[gs.word2] = gs.mix; } else m[gs.word] = 1;
    return m;
  }
  function genStep() {
    if (gs.k >= STEPS) return false;
    var s = gs.sched[gs.k], sn = gs.sched[gs.k + 1];
    var d = IM.denoise(gs.x, s, pictures, mixOf());
    gs.x0 = d.x0; gs.weights = d.weights;
    gs.x = IM.step(gs.x, s, sn, d.x0, IM.noise(gs.rnd), 0.6);
    gs.k++;
    return true;
  }
  function renderImggen(el) {
    if (!gs.x) resetGen();
    append(el, h('p', { class: 'lead', text: 'ノイズだけの画面から、AIが「こうなるはず」と予想しながら、少しずつノイズを取りのぞいて絵にします。どんな絵にするかは「ことば(プロンプト)」で決めます。' }));

    var promptWords = gs.word ? (gs.word2 && gs.word2 !== gs.word ? [gs.word, gs.word2] : [gs.word]) : [];
    var wordsRow = h('div', { class: 'ctl' }, h('span', { class: 'ctl-label', text: 'ことば(プロンプト)' }),
      segmented(D.pictureWords.map(function (w) { return [w, w]; }).concat([['', 'ことばなし']]), gs.word, function (v) { gs.word = v; if (!v) gs.word2 = ''; resetGen(); go('imggen'); }, 'ことば'));
    var mixRow = h('div', { class: 'ctl' }, h('span', { class: 'ctl-label', text: 'もう1つまぜる' }),
      segmented([['', 'まぜない']].concat(D.pictureWords.filter(function (w) { return w !== gs.word; }).map(function (w) { return [w, w]; })), gs.word2, function (v) { gs.word2 = v; resetGen(); go('imggen'); }, 'もう1つのことば'));
    var mixIn = h('input', { id: 'mix', type: 'range', min: '0.1', max: '0.9', step: '0.1', value: String(gs.mix), 'aria-label': 'まぜる割合' });
    mixIn.addEventListener('change', function () { gs.mix = Number(mixIn.value); resetGen(); go('imggen'); });

    var canvasNow = pixCanvas(256, gs.x, 'いまの絵');
    var canvasPred = pixCanvas(128, gs.x0 || new Float32Array(IM.DIM), 'AIの予想');
    var stepOut = h('p', { class: 'stats' });
    var weightsBox = h('div', { class: 'weights' });
    var msg = h('div', { 'aria-live': 'polite' });

    function refresh() {
      paint(canvasNow, gs.x);
      if (gs.x0) paint(canvasPred, gs.x0);
      stepOut.textContent = 'ステップ ' + gs.k + ' / ' + STEPS + '　のこりのノイズ ' + Math.round(gs.sched[gs.k] / gs.sched[0] * 100) + '%';
      weightsBox.textContent = '';
      pictures.forEach(function (p, i) {
        var w = gs.weights ? gs.weights[i] : 0;
        weightsBox.appendChild(h('div', { class: 'wrow' }, pixCanvas(40, p.x, p.label), h('span', { class: 'wlabel', text: p.label }), bar(w), h('span', { class: 'num', text: pct(w) })));
      });
      msg.textContent = '';
      if (gs.k >= STEPS) {
        var best = 0;
        gs.weights.forEach(function (w, i) { if (w > gs.weights[best]) best = i; });
        var d = Math.sqrt(IM.dist2(gs.x, pictures[best].x) / IM.DIM);
        if (d < 0.08) msg.appendChild(h('div', { class: 'result warn', text: '学習した「' + pictures[best].label + '」とほとんど同じ絵ができました。学習した絵が少ないと、学習データをそのまま出してしまうことがあります。だれかの作品にそっくりな絵は、勝手に使えません(著作権)。' }));
        else msg.appendChild(h('div', { class: 'result info', text: '学習データにない、新しい絵ができました。いちばん近いのは「' + pictures[best].label + '」です。いくつかの絵がまざると、ふしぎな絵になることもあります(画像のハルシネーション)。' }));
      }
    }
    function run() {
      if (gs.running) return;
      if (gs.k >= STEPS) { resetGen(); }
      gs.running = true;
      var t = setInterval(function () {
        if (!genStep()) { clearInterval(t); gs.running = false; }
        refresh();
      }, reduceMotion ? 30 : 140);
      timers.push(t);
    }

    el.appendChild(h('div', { class: 'controls' }, wordsRow, gs.word ? mixRow : null,
      gs.word2 && gs.word ? h('label', { class: 'ctl' }, h('span', { class: 'ctl-label', text: gs.word + ' ↔ ' + gs.word2 }), mixIn) : null));
    el.appendChild(h('p', { class: 'muted' }, 'プロンプトもトークンにして番号でわたします: ',
      promptWords.length ? promptWords.map(function (w) { return w + ' → ' + LM.tokenize(w, vocab)[0].id; }).join('、') : '(ことばなし)'));

    el.appendChild(card(null,
      h('div', { class: 'gen-grid' },
        h('figure', { class: 'gen-now' }, canvasNow, h('figcaption', { text: 'いまの絵' })),
        h('div', { class: 'gen-side' },
          h('figure', null, canvasPred, h('figcaption', { text: 'AIの予想(ノイズを全部取ったら、こうなるはず)' })),
          stepOut,
          h('div', { class: 'row' },
            btn('1ステップ進める', function () { if (gs.k >= STEPS) resetGen(); genStep(); refresh(); }),
            btn('最後まで自動 ▶', run, 'ef-btn-primary'),
            btn('新しいノイズから', function () { clearTimers(); resetGen(); refresh(); })))),
      msg,
      h('p', { class: 'small-title', text: 'AIがお手本にしている学習した絵(いまの絵に近いほど重く見る)' }),
      weightsBox));
    refresh();

    el.appendChild(point('ためしてみよう',
      h('ul', null,
        h('li', { text: '同じ「ねこ」でも、「新しいノイズから」をおすたびに、茶とら・グレーのどちらになるかが変わります。はじめのノイズで決まります。' }),
        h('li', { text: '「ねこ」と「家」をまぜると、どんな絵になる？ 本物の画像AIも、学習していない組み合わせをたのむと、ふしぎな絵(指が6本の手など)を作ることがあります。' }),
        h('li', { text: 'この模型が学習した絵は6枚だけです。本物の画像AIは何億枚もの絵から学ぶので、いろいろな絵を作れますが、学習した作品に似た絵が出ることもあります。' }))));
  }

  // ================= 7 個人情報 =================
  var ps = { pick: { name: 0, school: -1, phone: 0, address: -1 }, sent: false, out: null, sendJudge: {} };
  function privacySentences() {
    return D.privacyChoices.filter(function (c) { return ps.pick[c.key] >= 0; }).map(function (c) {
      return c.template.replace('{v}', c.values[ps.pick[c.key]]);
    });
  }
  function renderPrivacy(el) {
    append(el, h('p', { class: 'lead', text: '生成AIのサービスによっては、入力した内容が記録として残ったり、AIの学習に使われたりします。そのとき何が起きるかを、ミニ文章AIでたしかめます。' }));

    var step1 = card('① Aさんになって、AIに話しかける',
      h('p', { class: 'muted', text: '入れる情報をえらびます(どれも架空のものです)。' }),
      h('div', { class: 'pi-grid' }, D.privacyChoices.map(function (c) {
        var sel = h('select', { id: 'pi-' + c.key, class: 'input', disabled: ps.sent, on: { change: function () { ps.pick[c.key] = Number(sel.value); go('privacy'); } } },
          [h('option', { value: '-1', text: '入れない', selected: ps.pick[c.key] === -1 })].concat(c.values.map(function (v, i) {
            return h('option', { value: String(i), text: v, selected: ps.pick[c.key] === i });
          })));
        return h('label', { class: 'ctl' }, h('span', { class: 'ctl-label', text: c.label }), sel);
      })),
      h('div', { class: 'chat' }, privacySentences().map(function (s) {
        return h('p', { class: 'bubble me' }, h('span', { class: 'who', text: 'Aさん' }), s.replace(/ /g, ''));
      })),
      ps.sent ? h('div', { class: 'result info', text: '送りました。この会話は、AIの学習データに入りました(という設定です)。' })
        : btn('AIに送る', function () { ps.sent = true; ps.out = null; go('privacy'); }, 'ef-btn-primary'));
    el.appendChild(step1);

    if (ps.sent) {
      var model = LM.buildModel(D.chatBase.concat(privacySentences()));
      var prompts = [['name', ['わたし', 'の', '名前', 'は']], ['phone', ['わたし', 'の', '電話番号', 'は']], ['address', ['わたし', 'の', '住所', 'は']],
        ['school', ['わたし', 'の', '学校', 'は']], ['', ['わたし', 'の', '好きな']]];
      var step2 = card('② 後日、Bさんが同じAIを使うと…',
        h('p', { class: 'muted', text: 'Bさんが書きはじめた文の続きを、AIが作ります。' }),
        h('div', { class: 'row' }, prompts.map(function (pp) {
          var p = pp[1];
          return btn(p.join('') + '…', function () {
            var toks = LM.generate(model, { start: p, order: 2, temperature: 1 });
            var cand = LM.candidates(model, p, 2);
            ps.out = { key: pp[0], prompt: p, toks: toks, cand: cand.list, used: cand.used };
            go('privacy');
          });
        })));
      if (ps.out) {
        var text = ps.out.toks.join('');
        var text = ps.out.toks.join('');
        var leaked = privacySentences().some(function (s) { return s.replace(/ /g, '') === text; }) && !/好きな/.test(text);
        step2.appendChild(h('div', { class: 'chat' },
          h('p', { class: 'bubble me' }, h('span', { class: 'who', text: 'Bさん' }), ps.out.prompt.join('') + '…'),
          h('p', { class: 'bubble ai' }, h('span', { class: 'who', text: 'AI' }), text)));
        step2.appendChild(h('p', { class: 'small-title', text: '「' + ps.out.prompt.slice(ps.out.used === 1 ? -1 : -2).join(' ') + '」のあとに来た言葉' }));
        step2.appendChild(h('table', { class: 'prob' }, h('tbody', null, ps.out.cand.map(function (c) {
          return h('tr', null, h('th', { scope: 'row', text: c.word }), h('td', null, bar(c.p)), h('td', { class: 'num', text: pct(c.p) }));
        }))));
        var entered = ps.out.key && ps.pick[ps.out.key] >= 0;
        var leaked = entered && privacySentences().some(function (x) { return x.replace(/ /g, '') === text; });
        if (leaked) step2.appendChild(h('div', { class: 'result ng', text: 'Aさんの情報が、Bさんへの答えにそのまま出てきました！ 学習データに1回しか出てこない文は、AIがそのまま覚えてしまいやすいのです。' }));
        else if (ps.out.key && !entered) step2.appendChild(h('div', { class: 'result ok', text: 'Aさんはこの情報を入れなかったので、Aさんの情報は出てきません。そのかわりAIは、よく出てくる言葉でそれらしくうめました(これもハルシネーションです)。' }));
        else step2.appendChild(h('div', { class: 'result info', text: 'みんながよく入れる言葉から、続きが作られました。' }));
      }
      step2.appendChild(h('div', { class: 'row' }, btn('はじめからやり直す', function () { ps.sent = false; ps.out = null; go('privacy'); })));
      el.appendChild(step2);
    }

    var step3 = card('③ 送る前チェック',
      h('p', { text: 'つぎの文をAIに送ってもよいか、えらんでください。' }),
      h('ul', { class: 'send-list' }, D.sendCheck.map(function (s, i) {
        var j = ps.sendJudge[i];
        return h('li', { class: 'send-row' },
          h('span', { class: 'send-text', text: s.t }),
          j == null ? h('span', { class: 'judge' }, btn('送ってOK', function () { ps.sendJudge[i] = true; go('privacy'); }), btn('直す', function () { ps.sendJudge[i] = false; go('privacy'); }))
            : h('span', { class: 'judge-res ' + (j === s.ok ? 'ok' : 'ng') },
              (j === s.ok ? '○ ' : '× ') + s.why + (s.fix ? '　直した例: 「' + s.fix + '」' : '')));
      })));
    el.appendChild(step3);

    el.appendChild(point('生成AIに入れないもの',
      h('ul', null,
        h('li', { text: '自分や友だち・家族の名前、住所、電話番号、メールアドレス、学校名やクラス' }),
        h('li', { text: '顔写真(とくに友だちの写真)、パスワード、ほかの人のひみつ' })),
      h('p', { text: '入れた内容は、会社のサーバーに記録として残ることがあります。まちがいや不正アクセスで、会話の記録がほかの人に見えてしまう事故も起きています。入れる前に「だれに見られても大丈夫？」と考えます。' })));
  }

  // ================= 8 クイズとふりかえり =================
  var qs = { ans: {} };
  function renderQuiz(el) {
    var score = D.quiz.filter(function (q, i) { return qs.ans[i] === q.c; }).length;
    var answered = Object.keys(qs.ans).length;
    el.appendChild(h('p', { class: 'lead', text: 'ここまでの体験をふりかえるクイズです。' }));
    D.quiz.forEach(function (q, i) {
      var a = qs.ans[i];
      el.appendChild(card('Q' + (i + 1) + '　' + q.q,
        h('div', { class: 'quiz-opts' }, q.a.map(function (t, k) {
          var cls = 'choice' + (a != null ? (k === q.c ? ' right' : k === a ? ' wrong' : '') : '');
          return h('button', { type: 'button', class: cls, disabled: a != null, on: { click: function () { qs.ans[i] = k; go('quiz'); } } }, t);
        })),
        a != null ? h('div', { class: 'result ' + (a === q.c ? 'ok' : 'info'), text: (a === q.c ? '○ 正解。' : '× 正解は「' + q.a[q.c] + '」。') + q.why }) : null));
    });
    if (answered === D.quiz.length) {
      el.appendChild(h('div', { class: 'result ok' }, h('b', { text: D.quiz.length + '問中 ' + score + '問 正解' })));
      el.appendChild(btn('クイズをやり直す', function () { qs.ans = {}; go('quiz'); }));
    }

    var refl = saved.refl || {};
    var qsR = [
      ['r1', '文章をつくるAIと、画像をつくるAIは、それぞれどうやって作っていましたか。'],
      ['r2', 'ハルシネーションや個人情報について、生成AIを使うときに気をつけたいことは何ですか。'],
      ['r3', '生成AIを、どんな場面で、どのように使ってみたいですか。']
    ];
    var status = h('p', { class: 'muted', 'aria-live': 'polite', text: '書いた内容は、この端末のブラウザの中だけに保存されます。' });
    el.appendChild(card('ふりかえり', qsR.map(function (r) {
      var ta = h('textarea', { id: 'refl-' + r[0], class: 'input', rows: 3 });
      ta.value = refl[r[0]] || '';
      ta.addEventListener('input', function () { refl[r[0]] = ta.value; save('refl', refl); status.textContent = '保存しました(この端末の中だけ)。'; });
      return h('label', { class: 'refl' }, h('span', { class: 'ctl-label', text: r[1] }), ta);
    }), status, h('p', { class: 'muted', text: '提出のしかたは、先生の指示にしたがってください。' })));
  }

  // ---- 表示の切りかえ(ふりがな・大きな文字) ----
  function setupToggles() {
    var tools = document.getElementById('display-toggles');
    [['furigana', 'ふりがな', 'show-ruby'], ['big', '大きな文字', 'big-text']].forEach(function (t) {
      var on = !!saved[t[0]];
      document.documentElement.classList.toggle(t[2], on);
      var b = h('button', { type: 'button', class: 'ef-btn', 'aria-pressed': String(on) }, t[1]);
      b.addEventListener('click', function () {
        on = !on;
        save(t[0], on);
        b.setAttribute('aria-pressed', String(on));
        document.documentElement.classList.toggle(t[2], on);
      });
      tools.appendChild(b);
    });
  }

  buildNav();
  setupToggles();
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
