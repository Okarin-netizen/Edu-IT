# 生徒用の教材を GitHub Pages で公開する(入口ページ + A〜D の統一版だけ。先生用は入れない)
# 2026-10-19 公開を停止。main に push しても自動では公開しない。
# 再開するとき: Settings → Pages → Source を「GitHub Actions」にし、Actions タブからこのワークフローを手動で実行する
#   (自動公開に戻すなら on: に push: branches: [main] を足す)
name: 生徒用サイトを公開

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: 公開するファイルを _site/ にまとめる
        run: python3 site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
