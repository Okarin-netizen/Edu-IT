<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>問題解決ノート</title>
  <meta name="description" content="中学校技術科「情報の技術」向け。付箋で問題を見つけて課題を決め、作ったコンテンツや計測・制御システムを観点ごとに評価し、社会の情報の技術の最適化をためす問題解決ノート(4分野で同じ形)。">
  <!-- 外部への通信を一切しないための制限（同じ場所のファイルだけを使う） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="author" content="羽生市立南中学校　技術　岡田">
  <meta name="eduit-app" content="D11 問題解決ノート">
  <meta name="theme-color" content="#1a5fc8">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <!-- 4分野共通の枠（色・ヘッダー・ボタン・フッター・このアプリについて）。1ファイル版では中に入れる -->
  <link rel="stylesheet" href="../../shared/eduit-frame.css">
  <!-- 問題解決ノートの本体（4分野共通。D の観点と例は mondai-note-data.js の D）。1ファイル版では中に入れる -->
  <link rel="stylesheet" href="../../shared/mondai-note/mondai-note.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="../eduit-info.js"></script>
  <script src="../../shared/eduit-frame.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">本文へ移動</a>
  <header class="app-header ef-header">
    <a class="brand ef-title" href="#/"><img class="ef-icon" src="icons/icon.svg" alt="" width="28" height="28"><span class="ef-code">D11</span>問題解決ノート</a>
    <div class="ef-tools">
      <div class="display-toggles" id="display-toggles" role="group" aria-label="表示の切りかえ"></div>
    </div>
  </header>
  <nav class="mnd-tabs" id="tabs" aria-label="問題解決ノートのページ" data-ef-autohide>
    <a href="#/" data-tab="intro">はじめに</a>
    <a href="#/find" data-tab="find">① 問題の発見</a>
    <a href="#/eval" data-tab="eval">② 評価、改善・修正</a>
    <a href="#/opt" data-tab="opt" class="adv" title="発展編">③ 技術の最適化</a>
    <a href="#/refl" data-tab="refl" data-ef-reflect>振り返り</a>
    <a href="#/rec" data-tab="rec">記録</a>
  </nav>
  <main id="view" class="mnd-main" tabindex="-1">
    <section data-sec="intro"></section>
    <section data-sec="find" hidden></section>
    <section data-sec="eval" hidden></section>
    <section data-sec="opt" hidden></section>
    <section data-sec="refl" hidden data-ef-reflect></section>
    <section data-sec="rec" hidden></section>
    <p class="mnd-saved" id="saved" aria-live="polite"></p>
    <noscript><p>この教材を使うには JavaScript を有効にしてください。</p></noscript>
  </main>
  <div class="app-footer" data-ef-footer>
    <p class="app-note">この教材はブラウザの中だけで動き、外部のサイトには接続しません。書いたノートは、この端末のブラウザの中にだけ保存されます。</p>
  </div>
  <div class="mnd-toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <script src="../../shared/mondai-note/mondai-note-data.js"></script>
  <script src="../../shared/mondai-note/mondai-note.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
