<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>情報の技術 教材集</title>
  <meta name="description" content="中学校技術科「D 情報の技術」の体験教材11を基本編・発展編に分けて1つにまとめた教材集。インターネットにつながずに使えます。">
  <!-- 外部への通信を一切しないための制限（中の教材にも同じ制限がかかります） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="author" content="技術　岡田">
  <meta name="theme-color" content="#1a5fc8">
  <link rel="icon" href="{{ICON}}" type="image/svg+xml">
  <!-- 4分野共通の枠（shared/eduit-frame.css）のあとに、教材集の外わく -->
  <style id="eduit-frame-css">
{{EDUIT_CSS}}
  </style>
  <style>
{{CSS}}
  </style>
  <!-- 情報の技術の版・更新履歴（eduit-info.js）と、共通のフッター・「このアプリについて」（shared/eduit-frame.js） -->
  <script id="eduit-info">
{{EDUIT_INFO}}
  </script>
  <script id="eduit-frame">
{{EDUIT_JS}}
  </script>
</head>
<body>
  <a class="skip-link" href="#menu">本文へ移動</a>
  <!-- メニューのとき: 「D 情報の技術 教材集」と ふりがな・文字・使い方・先生用(4分野共通)。
       教材を開いているとき: 4分野共通のアプリの上のバー(.ef-appbar。C エネルギー変換と同じ形)。◀ メニュー・D1〜D11 の切りかえ・ふりがな・文字・全画面・ⓘ -->
  <header class="shell-header ef-header" id="shell-header">
    <a class="ef-btn ef-back" href="#/" id="back-link">◀ メニュー</a>
    <!-- メニューのとき「D 情報の技術 教材集」、教材を開いているとき「D1 仮想CPUラボ」（shell.js が書く） -->
    <h1 class="ef-title bar-title" id="bar-title" aria-live="polite">情報の技術 教材集</h1>
    <nav class="switcher ef-switch" id="switcher" aria-label="教材の切りかえ"></nav>
    <div class="ef-tools">
      <div class="shell-toggles" role="group" aria-label="すべての教材の表示の切りかえ">
        <button type="button" class="shell-toggle ef-btn ef-toggle" id="tg-ruby" aria-pressed="false">ふりがな</button>
        <button type="button" class="shell-toggle ef-btn ef-size" id="tg-large" aria-pressed="false" aria-label="文字の大きさ(大きな文字)" title="文字の大きさ(押すと「中」と「大」が切りかわる)">文字 <span class="ef-size-v"></span></button>
      </div>
      <button type="button" class="ef-btn teacher-btn" id="go-howto" title="この教材集の使い方">使い方</button>
      <button type="button" class="ef-btn teacher-btn" id="go-teacher" title="メニューの下の先生用のところへ">先生用</button>
      <span class="in-app" data-ef-fs></span>
      <span class="in-app" data-ef-about></span>
    </div>
  </header>
  <main id="menu" tabindex="-1">
    <noscript><p>この教材集を使うには JavaScript を有効にしてください。</p></noscript>
  </main>
  <div id="stage" class="stage" hidden></div>
  <!-- 作成者・版・安全と個人情報・ライセンス・更新履歴は、共通のフッター（eduit-frame.js）が出す -->
  <div class="shell-footer" id="footer" data-ef-footer>
    <p class="app-note">この教材集はブラウザの中だけで動き、外部のサイトには接続しません。登場する会社名・アドレスはすべて架空です。</p>
  </div>
  <script type="application/json" id="kyozai-data">{{DATA}}</script>
{{PAYLOADS}}
  <script>
{{JS}}
  </script>
</body>
</html>
