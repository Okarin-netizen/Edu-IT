  <!-- 4分野共通の枠（色・ヘッダー・ボタン・フッター・このアプリについて）。1ファイル版では中に入れる -->
  <style id="eduit-frame-css">
/* Edu-IT 共通の枠(4分野・全アプリ共通)
 * 色・文字・ボタン・カード・ヘッダー・フッターの見た目をそろえるための部品。
 * 分野の色は <html data-ef-domain="A|B|C|D"> で切りかわる。
 * アプリ固有の見た目は各アプリの CSS に残し、ここでは「枠」だけを決める。
 */
:root {
  color-scheme: light;      /* 端末がダークモードでも、4分野とも明るい画面で出す */
  --ef-font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --ef-bg: #f5f4f0;          /* 画面の地 */
  --ef-surface: #ffffff;     /* カード・ヘッダー */
  --ef-surface-2: #f8f7f4;   /* 一段下げた面 */
  --ef-line: #d6d3cb;        /* 枠線 */
  --ef-text: #1f2328;
  --ef-muted: #565d68;
  --ef-focus: #f08c00;       /* キーボード操作の枠 */
  --ef-radius: 12px;
  --ef-radius-s: 8px;
  --ef-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .04);
  --ef-header-h: 52px;
  --ef-tap: 40px;            /* ボタンの最小の高さ */
  /* 分野の色(既定は D) */
  --ef-accent: #1a5fc8;
  --ef-accent-ink: #ffffff;
  --ef-accent-soft: #e6eefb;
}
:root[data-ef-domain="A"] { --ef-accent: #985a26; --ef-accent-soft: #f5e9dc; }  /* 材料と加工: 木の茶 */
:root[data-ef-domain="B"] { --ef-accent: #2e7d32; --ef-accent-soft: #e4f2e5; }  /* 生物育成: 緑 */
:root[data-ef-domain="C"] { --ef-accent: #b45309; --ef-accent-soft: #fbeedd; }  /* エネルギー変換: だいだい */
:root[data-ef-domain="D"] { --ef-accent: #1a5fc8; --ef-accent-soft: #e6eefb; }  /* 情報: 青 */

/* ---- ヘッダー ----
 * メニュー:   <header class="ef-header"> <h1 class="ef-title"><span class="ef-code">A</span> 材料と加工の技術 教材集</h1>
 *               <div class="ef-tools"> ふりがな / 文字の大きさ / (くっきり) / 使い方 / 先生用 </div> </header>
 * アプリ:     <header class="ef-header"> <a class="ef-btn ef-back" href="…">◀ メニュー</a>
 *               <h1 class="ef-title"><span class="ef-code">A2</span> アプリ名</h1>
 *               <div class="ef-tools"> ふりがな / 文字の大きさ / くっきり / 使い方 / そのアプリだけのボタン </div> </header>
 *   同じ分野の教材を切りかえるボタンにも記号を出す(<button class="ef-btn"><span class="ef-code">D2</span> CPU</button>)。
 */
.ef-header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  min-height: var(--ef-header-h); padding: 6px 14px;
  background: var(--ef-surface); color: var(--ef-text);
  border-bottom: 3px solid var(--ef-accent);
  font-family: var(--ef-font);
  box-sizing: border-box;
}
.ef-title {
  display: flex; align-items: center; gap: 8px;
  margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--ef-text);
}
.ef-title .ef-icon { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; font-size: 22px; }
.ef-title .ef-sub { font-size: 13px; font-weight: 400; color: var(--ef-muted); }
.ef-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }

/* ---- ボタン ----
 * .ef-btn          ふつうのボタン(白地・枠線・丸角)
 * .ef-btn.is-on    ON の状態(分野の色で塗る)。aria-pressed="true" でも同じ
 * .ef-btn-primary  いちばん大事な操作(はじめる・ひらく など)
 */
.ef-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--ef-tap); padding: 0 14px;
  border: 1px solid var(--ef-line); border-radius: 999px;
  background: var(--ef-surface); color: var(--ef-text);
  font: 600 15px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
  box-sizing: border-box; white-space: nowrap;
}
.ef-btn:hover { border-color: var(--ef-accent); }
.ef-btn.is-on, .ef-btn[aria-pressed="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-back { color: var(--ef-accent); border-color: transparent; background: var(--ef-accent-soft); }
/* 上のバーの表示の道具(4分野で同じ形)。ふりがな・くっきりは .ef-toggle(ON で ✓)、文字の大きさは .ef-size(EduitFrame.sizeButton) */
.ef-toggle[aria-pressed="true"]::before { content: "✓"; }
.ef-size .ef-size-v {
  display: inline-block; min-width: 2em; padding: 0 .3em; border-radius: 6px;
  background: var(--ef-accent-soft); color: var(--ef-accent); font-weight: 700; text-align: center;
}
/* 「ふつう・大きい」の2段だけのとき: <button class="ef-btn ef-size" aria-pressed="false|true">文字 <span class="ef-size-v"></span></button>
 * (中身が空の .ef-size-v に「中」「大」を出す。ON でもボタンは塗らない) */
.ef-size[aria-pressed="true"] { background: var(--ef-surface); border-color: var(--ef-line); color: var(--ef-text); }
.ef-size[aria-pressed]::before { content: none; }
.ef-size[aria-pressed] .ef-size-v:empty::after { content: "中"; }
.ef-size[aria-pressed="true"] .ef-size-v:empty::after { content: "大"; }
/* タブの帯をスクロールで隠す(data-ef-autohide。隠すのは eduit-frame.js) */
[data-ef-autohide] { transition: transform .2s ease; }
[data-ef-autohide].ef-ah-hide { transform: translateY(var(--ef-ah-y, -110%)); }
@media (prefers-reduced-motion: reduce) { [data-ef-autohide] { transition: none; } }
.ef-btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 20px;
  border: 0; border-radius: var(--ef-radius-s);
  background: var(--ef-accent); color: var(--ef-accent-ink);
  font: 700 16px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
}
.ef-btn-primary:hover { filter: brightness(1.08); }
.ef-btn:focus-visible, .ef-btn-primary:focus-visible, .ef-about-link:focus-visible, .ef-dialog :focus-visible {
  outline: 3px solid var(--ef-focus); outline-offset: 2px;
}

/* ---- メニューのカード ----
 * <article class="ef-card"> <p class="ef-card-tag">A1</p> <h3 class="ef-card-title">…</h3> <p>…</p> <a class="ef-btn-primary">ひらく ▶</a> </article>
 * メニューのカードは EduitFrame.card() で作る(下の .ef-mcard)。
 */
.ef-page { background: var(--ef-bg); color: var(--ef-text); font-family: var(--ef-font); }
.ef-card {
  background: var(--ef-surface); border: 1px solid var(--ef-line); border-top: 4px solid var(--ef-accent);
  border-radius: var(--ef-radius); box-shadow: var(--ef-shadow); padding: 16px 18px;
}
.ef-card-tag { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ef-accent); }
.ef-card-title { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: var(--ef-text); }

/* ---- 記号の印(A1・B2・C3・D4 など。メニューの上のバー・アプリの上のバー・切りかえボタン・カード) ---- */
.ef-code {
  display: inline-flex; align-items: center; justify-content: center; min-width: 1.9em; padding: 0 .35em;
  border-radius: 6px; background: var(--ef-accent); color: var(--ef-accent-ink);
  font: 700 .9em/1.5 var(--ef-font); letter-spacing: .02em; white-space: nowrap; vertical-align: .05em;
}
.ef-title .ef-code { font-size: 15px; }
.ef-btn .ef-code { font-size: 13px; min-width: 0; margin-right: 2px; }
.ef-btn.is-on .ef-code, .ef-btn[aria-pressed="true"] .ef-code, .ef-btn[aria-current] .ef-code { background: var(--ef-accent-ink); color: var(--ef-accent); }

/* ---- メニューのカード(EduitFrame.card が作る。4分野同じ形) ---- */
.ef-mcard { display: flex; flex-direction: column; gap: 6px; min-height: 9rem; padding: 12px 16px 14px; cursor: pointer; font-family: var(--ef-font); color: var(--ef-text); transition: box-shadow .1s; }
.ef-mcard:hover { box-shadow: 0 2px 12px rgba(0, 0, 0, .14); }
.ef-mcard-hd { display: flex; align-items: center; gap: 10px; }
.ef-mcard-ic { flex: 0 0 auto; width: 1.4em; font-size: 2em; line-height: 1; text-align: center; }
.ef-mcard-ht { min-width: 0; }
.ef-mcard .ef-card-tag { margin: 0 0 2px; font-size: 14px; }
.ef-mcard .ef-card-title { margin: 0; font-size: 1.12em; line-height: 1.4; }
.ef-mcard-desc { margin: 0; font-size: .95em; line-height: 1.6; }
.ef-mcard-extra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: .88em; color: var(--ef-muted); }
.ef-mcard-go { margin-top: auto; align-self: flex-end; }
.ef-level-order { margin: -4px 0 12px; font-size: .95em; line-height: 1.6; }

/* ---- フッター(作成者・このアプリについて) ---- */
.ef-footer {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 14px;
  margin: 24px 0 0; padding: 12px 16px;
  border-top: 1px solid var(--ef-line); background: var(--ef-surface-2);
  font: 13px/1.6 var(--ef-font); color: var(--ef-muted);
}
.ef-footer .ef-author { font-weight: 700; color: var(--ef-text); }
.ef-about-link {
  border: 0; background: none; padding: 2px 4px; cursor: pointer;
  font: inherit; color: var(--ef-accent); text-decoration: underline;
}
/* ヘッダーなどに置く小さい「このアプリについて」ボタン */
.ef-about-btn { font-size: 14px; }

/* ---- このアプリについて(ダイアログ) ---- */
.ef-dialog {
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  padding: 0; border: 1px solid var(--ef-line); border-radius: var(--ef-radius);
  background: var(--ef-surface); color: var(--ef-text); font: 15px/1.7 var(--ef-font);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
}
.ef-dialog::backdrop { background: rgba(0, 0, 0, .4); }
.ef-dialog-in { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.ef-dialog-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 3px solid var(--ef-accent); }
.ef-dialog-head h2 { margin: 0; font-size: 18px; flex: 1; }
.ef-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px 0; }
.ef-tab { border: 1px solid var(--ef-line); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--ef-surface-2);
  padding: 6px 12px; font: 600 14px/1.3 var(--ef-font); color: var(--ef-text); cursor: pointer; min-height: 36px; }
.ef-tab[aria-selected="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-panel { padding: 14px 18px 18px; overflow: auto; border-top: 1px solid var(--ef-line); }
.ef-panel h3 { margin: 12px 0 4px; font-size: 16px; }
.ef-panel ul { margin: 4px 0 8px; padding-left: 1.3em; }
.ef-panel p { margin: 4px 0 8px; }
.ef-hist-ver { font-weight: 700; color: var(--ef-accent); }
.ef-hist-date { color: var(--ef-muted); font-size: 13px; margin-left: 6px; }

/* 文字を大きくした・くっきりのときも読めるように */
/* 基本編・発展編のタブ(メニュー。EduitFrame.levels が作る) */
.ef-levels { margin: 0 0 18px; font-family: var(--ef-font); }
.ef-level-tabs { display: flex; gap: 0; border-bottom: 3px solid var(--ef-accent); }
.ef-level-tab {
  display: inline-flex; align-items: baseline; gap: 8px; min-height: 48px; padding: 8px 22px; margin: 0 6px -3px 0;
  font: inherit; font-size: 1.15em; font-weight: 700 !important; color: var(--ef-muted) !important; cursor: pointer;
  background: var(--ef-surface-2); border: 1px solid var(--ef-line); border-bottom: 3px solid var(--ef-accent);
  border-radius: var(--ef-radius-s) var(--ef-radius-s) 0 0;
}
.ef-level-tab:hover { color: var(--ef-text) !important; }
/* 教材ごとのボタンの色指定(#hub button など)に負けないように !important にする */
.ef-level-tab[aria-selected="true"], .ef-level-tab[aria-selected="true"]:hover { color: var(--ef-accent-ink) !important; background: var(--ef-accent) !important; border-color: var(--ef-accent) !important; }
.ef-level-tab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }
.ef-level-count { font-size: .72em; font-weight: 400; }
.ef-level-panel { padding: 12px 0 0; }
.ef-level-panel:focus { outline: none; }
.ef-level-lead { margin: 0 0 12px; color: var(--ef-muted); line-height: 1.6; }
.ef-level-advanced[aria-selected="true"], .ef-level-advanced[aria-selected="true"]:hover { background: #5b3fa8 !important; border-color: #5b3fa8 !important; }
.ef-level-tabs:has(.ef-level-advanced[aria-selected="true"]) { border-bottom-color: #5b3fa8; }
.ef-level-parts { margin: .3em 0 0; font-size: .9em; line-height: 1.5; color: var(--ef-text); }
.ef-mcard-tb { margin: .3em 0 0; font-size: .85em; line-height: 1.5; color: var(--ef-muted); }
.ef-level-group { display: flex; align-items: baseline; gap: .5em; margin: 18px 0 10px; padding: 0 0 4px; border-bottom: 1px solid var(--ef-line); font-size: 1.1em; color: var(--ef-text); }
.ef-level-group:first-of-type { margin-top: 4px; }
.ef-level-group-ch { font-size: .8em; font-weight: 700; color: var(--ef-accent); }
.ef-level-parts-k {
  display: inline-block; margin-right: .5em; padding: 0 .5em; font-size: .85em; font-weight: 700;
  color: var(--ef-accent); background: var(--ef-accent-soft); border-radius: 999px;
}

/* 振り返りを隠す設定(EduitFrame.furikaeri)。振り返りのタブ・欄・印には data-ef-reflect を付ける */
html[data-ef-furikaeri="off"] [data-ef-reflect] { display: none !important; }

/* ---- スマホ(せまい画面) ----
 * 上のバー: 名前を1行目に、道具が入りきらないときは次の行へ。ボタンは少し小さくする。
 * 名前(.ef-title)は 9em 以上の幅を取るので、せまい画面では道具が下の行に回る。
 */
@media (max-width: 640px) {
  .ef-header { gap: 6px; padding: 6px 10px; }
  .ef-title { flex: 1 1 9em; min-width: 0; font-size: 16px; }
  .ef-tools { gap: 4px; }
  .ef-header .ef-btn { min-height: 36px; padding: 0 10px; font-size: 14px; }
  .ef-level-tab { padding: 6px 14px; min-height: 44px; font-size: 1.05em; }
  .ef-mcard { min-height: 0; }
  .ef-dialog { width: calc(100vw - 16px); max-height: calc(100vh - 16px); }
  .ef-panel { padding: 12px; }
}

@media print { .ef-footer, .ef-dialog { display: none !important; } }

</style>

  <style>
/* 計測・制御シミュレータ（情報セキュリティ体験ラボと共通の土台） */
:root {
  color-scheme: light;
  --bg: var(--ef-bg, #f5f4f0);
  --surface-1: #fcfcfb;
  --surface-2: #efeee9;
  --border: #d9d7cf;
  --text-primary: #1b1b1a;
  --text-secondary: #52514e;
  --text-muted: #6d6c67;
  --accent: var(--ef-accent, #1a5fc8);
  --accent-ink: #ffffff;
  --accent-soft: var(--ef-accent-soft, #e6eefb);
  --good: #1f7a3a;
  --good-soft: #e3f3e7;
  --warn: #8a5a00;
  --warn-soft: #fbf0d9;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  --focus: var(--ef-focus, #f08c00);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.04);
  --font: var(--ef-font, "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif);
  --mono: "BIZ UDGothic", "Consolas", "Menlo", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html { font-size: 17px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font);
  line-height: 1.75;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, h4 { line-height: 1.4; margin: 0 0 0.5em; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.1rem; }
p { margin: 0 0 0.8em; }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
.skip-link { position: absolute; left: -999px; top: 0; background: var(--surface-1); padding: 8px 12px; z-index: 10; }
.skip-link:focus { left: 8px; }

/* レイアウト */
.app-header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 20px; background: var(--surface-1); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 5;
}
.app-header .brand { font-weight: 700; font-size: 1.05rem; text-decoration: none; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
.app-header .brand img { width: 28px; height: 28px; }
.app-header .spacer { flex: 1; }
.overall-progress { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-secondary); }
.overall-progress .bar { width: 120px; }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; gap: 24px; padding: 20px; }
.chapter-nav { position: sticky; top: 72px; align-self: start; min-width: 0; }
.chapter-nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; position: relative; }
.chapter-nav a, .chapter-nav span.disabled {

  text-decoration: none; color: var(--text-primary); font-size: 0.92rem;
}
.chapter-nav a:hover { background: var(--surface-2); }
.chapter-nav a[aria-current="page"] { background: var(--accent-soft); font-weight: 700; }
.chapter-nav span.disabled { color: var(--text-muted); }
.chapter-nav .num {
  flex: none; width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center;
  font-size: 0.78rem; border: 1.5px solid var(--border); background: var(--surface-1);
}

.chapter-nav .nav-group { font-size: 0.75rem; color: var(--text-muted); margin: 14px 10px 4px; letter-spacing: 0.05em; }
main { min-width: 0; }

@media (max-width: 860px) {
  html { font-size: 16px; }
  .layout { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }

  .chapter-nav ol { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; padding-bottom: 6px; }
  .chapter-nav .nav-group { display: none; }
  .overall-progress .bar { width: 70px; }
}

/* 部品 */
.card {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 22px; margin-bottom: 18px; box-shadow: var(--shadow);
}
.card > :last-child { margin-bottom: 0; }
.module-head { margin-bottom: 18px; }
.module-head .meta { color: var(--text-secondary); font-size: 0.9rem; }
.step-title { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
.step-title .badge {
  flex: none; font-size: 0.75rem; font-weight: 700; padding: 2px 10px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent);
}
.step-title .check { margin-left: auto; font-size: 0.8rem; color: var(--good); font-weight: 700; }

.explain {
  border-left: 5px solid var(--accent); background: var(--accent-soft);
  border-radius: 8px; padding: 12px 16px; margin: 14px 0;
}
.explain .explain-label { font-weight: 700; font-size: 0.85rem; color: var(--accent); display: block; margin-bottom: 2px; }
.explain.warn { border-color: var(--warn); background: var(--warn-soft); }
.explain.warn .explain-label { color: var(--warn); }
.explain.good { border-color: var(--good); background: var(--good-soft); }
.explain.good .explain-label { color: var(--good); }
.explain.bad { border-color: var(--bad); background: var(--bad-soft); }
.explain.bad .explain-label { color: var(--bad); }
.explain > :last-child { margin-bottom: 0; }

.three-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; padding: 0; list-style: none; counter-reset: s; }
.three-steps li {
  background: var(--surface-2); border-radius: 10px; padding: 10px 12px; text-align: center; font-size: 0.9rem;
  counter-increment: s;
}
.three-steps li strong { display: block; font-size: 1.05rem; }
.three-steps li strong::before { content: counter(s) ". "; }
@media (max-width: 560px) { .three-steps { grid-template-columns: 1fr; } }

.btn {
  font: inherit; font-size: 0.95rem; cursor: pointer; border-radius: 10px; padding: 8px 16px;
  border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700;
  min-height: 44px;
}
.btn:hover { filter: brightness(1.08); }
.btn.secondary { background: transparent; color: var(--accent); }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 0.88rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; align-items: center; }

label { font-weight: 700; font-size: 0.92rem; }
input[type="text"], input[type="number"], textarea, select {
  max-width: 100%;
  font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%; min-height: 44px;
}
textarea { min-height: 90px; resize: vertical; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.field { margin: 10px 0; display: grid; gap: 4px; }
.field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.hint { font-size: 0.85rem; color: var(--text-secondary); font-weight: 400; }

.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
.bar > span { display: block; height: 100%; background: var(--good); border-radius: 99px; }

.result-box {
  border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px; margin: 12px 0; background: var(--surface-2);
}
.big-number { font-size: 1.8rem; font-weight: 700; line-height: 1.3; }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; padding: 2px 10px; border-radius: 99px; font-size: 0.9rem; }
.status.good { background: var(--good-soft); color: var(--good); }
.status.warn { background: var(--warn-soft); color: var(--warn); }
.status.bad { background: var(--bad-soft); color: var(--bad); }

.choice-list { display: grid; gap: 8px; margin: 10px 0; padding: 0; list-style: none; }
.choice-list button {
  width: 100%; text-align: left; font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; cursor: pointer; min-height: 44px;
}
.choice-list button:hover { border-color: var(--accent); }
.choice-list button.correct { border-color: var(--good); background: var(--good-soft); }
.choice-list button.wrong { border-color: var(--bad); background: var(--bad-soft); }

table.data { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
table.data th, table.data td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
table.data th { color: var(--text-secondary); font-weight: 700; }
.table-wrap { overflow-x: auto; }

.module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.module-card {
  display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--text-primary);
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
}
a.module-card:hover { border-color: var(--accent); }
.module-card .mc-num { font-size: 0.8rem; color: var(--text-muted); }
.module-card .mc-title { font-weight: 700; font-size: 1.05rem; }
.module-card .mc-desc { font-size: 0.88rem; color: var(--text-secondary); flex: 1; }
.module-card.soon { opacity: 0.6; }

.reflection textarea { margin-top: 6px; }
.saved-note { font-size: 0.85rem; color: var(--good); min-height: 1.4em; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text-primary); color: var(--surface-1);
  padding: 10px 18px; border-radius: 99px; font-size: 0.9rem; z-index: 20; max-width: calc(100vw - 32px); width: max-content; opacity: 0; transition: opacity 0.2s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* グラフ */
.chart { width: 100%; position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid line { stroke: var(--border); stroke-width: 1; }
.chart .axis text, .chart text.axis { fill: var(--text-muted); font-size: 11px; font-family: var(--font); }
.chart text.label { fill: var(--text-primary); font-size: 12px; font-family: var(--font); }
.chart text.label-strong { fill: var(--text-primary); font-size: 12px; font-weight: 700; font-family: var(--font); }
.chart .tooltip {
  position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 0.8rem; box-shadow: var(--shadow); white-space: nowrap; display: none; z-index: 3;
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--text-secondary); margin: 6px 0; padding: 0; list-style: none; }
.legend .sw { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

/* 表示の切りかえ */
.display-toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.display-toggles .toggle {
  font: inherit; font-size: 0.8rem; padding: 4px 10px; border-radius: 99px; border: 1.5px solid var(--border);
  background: var(--surface-1); color: var(--text-secondary); cursor: pointer; min-height: 32px;
}
.display-toggles .toggle[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.display-toggles .toggle[aria-pressed="true"]::before { content: "✓ "; }
html.large-text { font-size: 20px; }
@media (max-width: 860px) { html.large-text { font-size: 18px; } }

/* ---- 計測・制御シミュレータ ---- */
:root { --series-5: #8a5cd1; --code-bg: #f3f2ee; --cur: #fff1c2; --cur-line: #eda100; }

.layout.single { display: block; max-width: 1400px; margin: 0 auto; padding: 20px; }
@media (max-width: 860px) { .layout.single { padding: 12px 16px; } }
.top-nav { display: flex; gap: 4px; flex-wrap: wrap; }
.top-nav a { text-decoration: none; color: var(--text-primary); padding: 6px 12px; border-radius: 8px; font-size: 0.92rem; }
.top-nav a:hover { background: var(--surface-2); }
.top-nav a[aria-current="page"] { background: var(--accent-soft); font-weight: 700; }

.hero h1 { font-size: 1.8rem; }
.hero .lead { font-size: 1.02rem; }
.author-line { color: var(--text-secondary); font-size: 0.9rem; margin-top: 10px; }
.section-title { margin: 24px 0 12px; }
.io-flow { display: flex; align-items: stretch; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
.io-box { flex: 1 1 160px; border-radius: 10px; padding: 10px 12px; font-weight: 700; display: flex; flex-direction: column; gap: 2px; border: 1.5px solid var(--border); }
.io-tag { font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); }
.io-in { background: var(--accent-soft); border-color: var(--series-1); }
.io-cpu { background: var(--surface-2); }
.io-out { background: var(--good-soft); border-color: var(--good); }
.io-arrow { align-self: center; font-size: 1.4rem; color: var(--text-muted); }
.io-if { background: var(--warn-soft); border-color: var(--warn); }
.io-flow.five { gap: 6px; }
.io-flow.five .io-box { flex: 1 1 90px; min-width: 0; font-size: 0.92rem; padding: 8px 10px; }
.io-flow.five .io-box small { font-weight: 400; font-size: 0.8rem; color: var(--text-secondary); }
@media (max-width: 700px) { .io-flow.five { flex-direction: column; } .io-flow.five .io-box { flex: none; } .io-flow.five .io-arrow { transform: rotate(90deg); } }
@media (max-width: 560px) { .io-flow { flex-direction: column; } .io-box { flex: none; } .io-arrow { transform: rotate(90deg); } }

.scn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-bottom: 18px; }
.scn-card { display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.scn-card:hover { border-color: var(--accent); }
.scn-icon { font-size: 1.8rem; line-height: 1.2; }
.scn-num { font-size: 0.8rem; color: var(--text-muted); }
.scn-title { font-weight: 700; font-size: 1.1rem; }
.scn-desc { font-size: 0.88rem; color: var(--text-secondary); flex: 1; }
.scn-status { font-size: 0.82rem; font-weight: 700; color: var(--text-secondary); }
.scn-status.done { color: var(--good); }
.scn-status.done::before { content: "✓ "; }
.how-to li { margin-bottom: 4px; }

.scn-head h1 { margin-bottom: 8px; }
.scn-head details { margin-top: 8px; }
.scn-head summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.device-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 4px 20px; }
.device-list h3 { font-size: 0.95rem; margin: 8px 0 4px; }
.device-list ul { margin: 0; padding-left: 1.2em; font-size: 0.9rem; }
.device-list code, .test-list code { background: var(--surface-2); padding: 0 6px; border-radius: 4px; font-weight: 700; }

.workbench { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1000px) { .workbench { grid-template-columns: minmax(0, 1fr); } }
.workbench .card { margin-bottom: 0; }
.workbench + .card, .workbench + section { margin-top: 18px; }
.card-title-row { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 8px; }
.card-title-row h2 { margin: 0; }
.btn-row.tight { margin: 4px 0; gap: 6px; }

.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 10px; flex-wrap: wrap; }
.tabs button { font: inherit; font-size: 0.92rem; padding: 6px 14px; min-height: 40px; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

/* ブロック */
.blk-palette { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.blk-add { font: inherit; font-size: 0.85rem; padding: 4px 10px; min-height: 36px; border-radius: 8px; cursor: pointer; border: 1.5px solid; font-weight: 700; color: var(--text-primary); }
.blk-add::before { content: "＋ "; }
.blk-canvas { max-height: 640px; overflow: auto; padding: 4px 2px; }
.blk-list { display: flex; flex-direction: column; }
.blk { border-radius: 8px; border: 1.5px solid; border-left-width: 6px; margin: 0; padding: 4px 6px 4px 8px; }
.blk-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; min-height: 36px; }
.blk-word { font-size: 0.92rem; }
.blk-word.strong { font-weight: 700; }
.blk-inner { margin-left: 18px; padding: 2px 0; }
.blk-mid, .blk-foot { font-size: 0.85rem; display: flex; gap: 8px; align-items: center; padding: 2px 0; }
.blk-foot { color: var(--text-muted); }
.blk-sel, input.blk-expr, select.blk-sel { width: auto; min-height: 34px; padding: 2px 6px; font-size: 0.92rem; border-radius: 6px; }
input.blk-expr { font-family: var(--mono); min-width: 3.5em; }
.blk-expr.bad { border-color: var(--bad); background: var(--bad-soft); }
.blk-expr-wrap { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px; max-width: 100%; }
.blk-bad-msg { font-size: 0.82rem; font-weight: 700; color: var(--bad); line-height: 1.4; white-space: normal; }
.blk-comment-text { font-family: var(--font); min-width: 12em; }
.blk-tools { margin-left: auto; display: inline-flex; gap: 2px; }
.blk-tool, .blk-mini { font: inherit; font-size: 0.8rem; min-height: 30px; min-width: 30px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); cursor: pointer; padding: 0 6px; }
.blk-tool:disabled { opacity: 0.35; cursor: default; }
.blk-slot { font: inherit; display: block; width: 100%; text-align: left; border: 1px dashed transparent; background: transparent; color: var(--text-muted); font-size: 0.75rem; line-height: 1; padding: 3px 6px; min-height: 18px; cursor: pointer; border-radius: 6px; opacity: 0.55; }
.blk-slot:hover, .blk-slot:focus-visible { opacity: 1; border-color: var(--border); }
.blk-slot.active { opacity: 1; border: 2px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; padding: 6px 8px; }
.blk.current > .blk-head { background: var(--cur); outline: 2px solid var(--cur-line); border-radius: 6px; }
/* 種類ごとの色（教科書のブロック言語に近い色分け） */
.blk-if, .blk-add-if, .blk-add-ifelse { border-color: #e2a400; background: #fff6dc; }
.blk-forever, .blk-repeat, .blk-while, .blk-add-forever, .blk-add-repeat, .blk-add-while { border-color: #e07b00; background: #ffeedd; }
.blk-assign, .blk-add-assign { border-color: #2a78d6; background: #e6f0fc; }
.blk-wait, .blk-add-wait { border-color: #1baf7a; background: #e2f6ee; }
.blk-comment, .blk-add-comment { border-color: #9a978d; background: #f2f1ec; }

/* フローチャート */
.flow-box { overflow: auto; max-height: 700px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
.flowchart { display: block; margin: 0 auto; max-width: none; }
.fc-node rect, .fc-node polygon { fill: var(--surface-1); stroke: var(--text-secondary); stroke-width: 1.5; }
.fc-if polygon { fill: #fff6dc; stroke: #c48f00; }
.fc-loop polygon, .fc-loop-end polygon { fill: #ffeedd; stroke: #c96d00; }
.fc-assign rect { fill: #e6f0fc; stroke: #2a78d6; }
.fc-wait rect { fill: #e2f6ee; stroke: #1b9a6c; }
.fc-term rect { fill: var(--surface-2); }
.fc-node.current rect, .fc-node.current polygon { stroke: var(--cur-line); stroke-width: 4; }
.fc-text { font-size: 13px; fill: #1b1b1a; font-family: var(--font); }
.fc-term .fc-text { fill: var(--text-primary); }
.fc-yes, .fc-no { font-size: 12px; fill: var(--text-secondary); font-family: var(--font); font-weight: 700; }
.fc-line { stroke: var(--text-secondary); stroke-width: 1.5; }
.fc-arrowhead { fill: var(--text-secondary); }

/* テキスト */
.code-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
.gutter { font-family: var(--mono); font-size: 0.95rem; line-height: 1.6; padding: 10px 6px; text-align: right; color: var(--text-muted); background: var(--surface-2); overflow: hidden; height: 460px; user-select: none; min-width: 2.8em; }
.gutter > div.current { background: var(--cur); color: var(--text-primary); font-weight: 700; box-shadow: inset 3px 0 0 var(--cur-line); }
.gutter > div.current::before { content: "▶"; font-size: 0.7em; margin-right: 2px; }
textarea.code { font-family: var(--mono); font-size: 0.95rem; line-height: 1.6; border: none; border-radius: 0; height: 460px; min-height: 0; resize: vertical; padding: 10px 12px; background: var(--code-bg); tab-size: 2; white-space: pre; overflow: auto; }
textarea.code:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--focus); }
.code-view { font-family: var(--mono); background: var(--code-bg); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 6px 0; font-size: 0.92rem; line-height: 1.6; }
.code-view.small { font-size: 0.82rem; padding: 6px 10px; margin: 0; }
.err-box ul { margin: 0; padding-left: 1.2em; }

/* 仮想世界 */
.world { border-radius: 10px; overflow: hidden; border: 1px solid var(--border); line-height: 0; }
.world svg { width: 100%; height: auto; display: block; }
.sim-meta { display: flex; gap: 10px; align-items: center; font-size: 0.9rem; }
.sim-time { font-family: var(--mono); font-weight: 700; font-size: 1.05rem; }
.sim-state { font-size: 0.8rem; padding: 2px 10px; border-radius: 99px; background: var(--surface-2); color: var(--text-secondary); font-weight: 700; }
.sim-state.good { background: var(--good-soft); color: var(--good); }
.sim-state.bad { background: var(--bad-soft); color: var(--bad); }
.case-bar { margin-top: 6px; height: 6px; }
.case-bar > span { background: var(--accent); }
.controls .btn { min-width: 6.5em; }
.inline-label { font-weight: 400; display: inline-flex; align-items: center; gap: 4px; }
.speed-sel, .case-sel { width: auto; min-height: 40px; }
.case-sel { max-width: 100%; }
.next-line { background: var(--cur); border-left: 4px solid var(--cur-line); padding: 6px 10px; border-radius: 6px; margin: 6px 0; font-size: 0.92rem; }
.manual-box .field { margin: 6px 0; }
.manual-box output { font-family: var(--mono); color: var(--accent); }
.press-btn { touch-action: none; user-select: none; }
.press-btn[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); }
.press-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.press-flash { color: var(--warn); font-weight: 700; min-width: 4em; }
.check-item { display: flex; gap: 8px; align-items: center; font-weight: 400; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; cursor: pointer; margin: 6px 0; }
.check-item input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
.check-item.small { font-size: 0.88rem; padding: 4px 10px; display: inline-flex; }

  <script id="eduit-frame">
/* Edu-IT 共通の枠: 作成者・安全と個人情報・ライセンス・更新履歴
 * 使い方(classic script。file:// でも動く):
 *   <link rel="stylesheet" href="…/shared/eduit-frame.css">
 *   <script src="…/<分野>/eduit-info.js"><\/script>   … window.EDUIT_INFO を決める
 *   <script src="…/shared/eduit-frame.js"><\/script>
 * 置き場所(どれか):
 *   - <div data-ef-footer></div> があればそこにフッターを出す
 *   - <span data-ef-about></span> があればそこに「ⓘ このアプリについて」ボタンを出す(フッターは出さない)
 *   - どちらもなければ <body> の最後にフッターを足す
 *   - EDUIT_INFO.app.footer === false なら自動では何も出さない(EduitFrame.open() だけ使う)
 * EDUIT_INFO = {
 *   domain: 'A',                     分野(A/B/C/D)。色が切りかわる
 *   domainName: '材料と加工の技術',
 *   suite: '材料と加工 教材アプリ',     教材集の名前
 *   version: '2.1', updated: '2026-10-15',
 *   safety: ['この分野だけの安全の説明', …],   共通の説明のあとに足す
 *   history: [{ version: '2.1', date: '2026-10-15', items: ['…', …] }, …]   新しい順
 *   app: { name: 'A3 構造強化ラボ' }   アプリごとに上書き(EDUIT_INFO.app を各ページで決めてもよい)
 *   levels: { basic: {...}, advanced: {...} }   基本編・発展編の分け方(メニューが EduitFrame.levels で使う)
 * }
 *
 * メニューのカード(4分野共通の形): EduitFrame.card({ code: 'A1', icon: '🪵', title: '…', desc: '…', parts: 「使うところ」の要素,
 *   extra: [分野ごとの追加の要素…], href: 'ひらく先' か onOpen: function () {…}, openAttrs: { 'data-go': 'b1' } })
 *   → <article class="ef-card ef-mcard">。記号・アイコン・名前・説明・使うところ・追加の欄・「ひらく ▶」の順。カードのどこを押しても開く。
 * 記号の印: EduitFrame.code('A2') → <span class="ef-code">A2</span>(メニューの上のバー・アプリの上のバー・切りかえボタンで使う)
 * メニューの上のバーの名前: EduitFrame.menuTitle(h1) → h1 の中を「[A] 材料と加工の技術 教材集」にする
 * 上のバーの表示の道具(4分野で同じ形):
 *   ふりがな・くっきり: <button class="ef-btn ef-toggle" aria-pressed="true|false">ふりがな</button>(ON は分野の色で塗り、✓ が付く)
 *   文字の大きさ: <button class="ef-btn ef-size"></button> に EduitFrame.sizeButton(btn, { steps: [[値, '中'], [値, '大'], …], get: 今の値, set: function (値) {…} })
 *     →「文字 中」のボタンになり、押すたびに次の大きさへ(最後のつぎは最初へ)。もどり値の関数を呼ぶと表示を今の値に合わせる。
 *     「ふつう・大きい」の2段だけのときは、<button class="ef-btn ef-size" aria-pressed="false">文字 <span class="ef-size-v"></span></button> にして aria-pressed を切りかえるだけでよい(「中」「大」は CSS が出す)。
 * タブの帯をスクロールで隠す: 上に固定(position: sticky)したタブの帯に data-ef-autohide を付けるだけ。
 *   下へ読み進めると上へ引っこみ、少しでも上へ戻すと出てくる(帯の中にフォーカスがあるときは隠さない)。
 *
 * 振り返りを隠す設定: EduitFrame.furikaeri(true = 出す / false = 隠す)。隠すときは <html data-ef-furikaeri="off"> になり、
 *   data-ef-reflect の付いた要素(振り返りのタブ・欄・カードの印など)が出なくなる(eduit-frame.css)。決め方(先のものが勝つ):
 *   1. アドレスの ?furikaeri=off / ?furikaeri=on(自分か、同じサイトの親の画面のアドレス)。localStorage 'eduit.furikaeri' に覚える
 *   2. window.EDUIT_FURIKAERI = 'off' / 'on'(自分か親の画面。配布用の「振り返りなし」版はこれを入れてある)
 *   3. localStorage 'eduit.furikaeri'(前に 1 で決めたもの)

 *
 * 基本編・発展編(メニュー用): EduitFrame.levels(置き場所, { card: function (item, parts, levelKey) { return カードの要素; }, code: function (item) { return 'A1'; } })
 *   code を渡すと、基本編の上に「おすすめの順番: A1 → A2 → …」の1行を出す(カードの順 = 番号の順 = おすすめの順)。
 *   EDUIT_INFO.levels = {
 *     basic:    { title: '基本編', lead: '…', items: [{ id: 'M1', parts: ['材料カード', …], curr: 'A(1)ア', why: '…' }, …] },
 *     advanced: { title: '発展編', lead: '…', items: [ … ] }
 *   }
 *   id はメニューごとのアプリの id。parts は生徒の画面に出るタブ・ページの名前(「使うところ」に出す)。
 *   EDUIT_INFO.textbook があれば、カードを教科書の章ごとに見出しで区切り、カードに「教科書 1編1章 2」の行を出す:
 *   EDUIT_INFO.textbook = {
 *     groups: [{ key: 'know', ch: '1章', title: 'しくみを知る' }, { key: 'solve', ch: '2章', title: '問題を解決する' }, …],  見出しの順
 *     items: { 'material-navi': { g: 'know', ref: '1編1章 1・2' }, … }   id ごとの区切りと、カードに出す教科書の節
 *   }
 *   curr(学習指導要領の項目)と why(分けた理由)は先生用の一覧だけに出し、生徒のカードには出さない。
 *   選んだ編は localStorage の 'eduit.level.<分野>' に覚える(表示の設定なので「はじめから」でも消さない)。
 */
(function () {
  'use strict';
  var AUTHOR = '技術　岡田';
  var info = window.EDUIT_INFO || {};
  var app = info.app || {};
  if (info.domain) document.documentElement.setAttribute('data-ef-domain', info.domain);

  // ---- 振り返りを隠す設定 ----
  var FK_KEY = 'eduit.furikaeri';
  function furikaeriSetting() {

        var m = /[?&]furikaeri=(on|off)(?:&|$)/.exec(w.location.search || '');

      if (w === w.parent) break;

  }
  var furikaeri = furikaeriSetting();
  if (!furikaeri) document.documentElement.setAttribute('data-ef-furikaeri', 'off');

  var SAFETY = [
    'この教材はインターネットに接続しません。外部のサイトやサーバーへ、入力した内容や学習の記録を送ることはありません。',
    '学習の記録は、開いた端末のブラウザの中だけに保存されます。ほかの端末や先生のパソコンへ自動で送られることはありません。',
    '提出するときは、自分で「書き出す」などのボタンでファイルにして、先生の指示どおりに出します。',
    '名前などの個人情報は、先生の指示がないときは入力しないでください。',
    '端末をほかの人と共有するときは、提出したあとに記録を消してください。',
    '教材に出てくる会社名・人名・アドレス・数値は、学習のために作ったものです(実在のものではありません。数値は目安です)。',
    '広告・アクセス解析・Cookie による追跡はありません。外部のプログラム(CDN など)も読み込みません。'
  ];
  var LICENSE = [
    '著作権: © 2026 ' + AUTHOR,
    '学校の授業・家庭学習など、学習のためであれば、だれでも無料で使用・コピー・配布できます(ほかの学校の先生も使えます)。',
    '授業に合わせて直して使うこともできます。直したものを配るときは、直したことと、もとの作者(' + AUTHOR + ')を書いてください。',
    '販売すること、有料の教材や商品に入れて配ることはできません。',
    'この教材は今のまま提供します。使ったことで起きた不具合や損害について、作者は責任を負いません。',
    '教科書の図や文章は使っていません。図や文章はこの教材のために作ったものです。'
  ];

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'class') e.className = attrs[k];

  }
  function list(items) { return el('ul', null, items.map(function (t) { return el('li', { text: t }); })); }
  function appName() { return app.name || info.suite || document.title; }

  var dlg = null;
  function build() {
    var safety = SAFETY.concat(info.safety || []).concat(app.safety || []);
    var hist = info.history || [];
    var panels = [
      ['安全と個人情報', [el('h3', { text: 'この教材の安全について' }), list(safety)]],
      ['ライセンス', [el('h3', { text: '使ってよい条件' }), list(LICENSE)]],
      ['更新履歴', hist.length ? hist.map(function (h) {
        return el('section', null, [
          el('h3', null, [el('span', { class: 'ef-hist-ver', text: h.version ? '第' + h.version + '版' : '' }),
            el('span', { class: 'ef-hist-date', text: h.date || '' })]),
          list(h.items || [])
        ]);
      }) : [el('p', { text: 'まだありません。' })]],
      ['作った人', [
        el('h3', { text: appName() }),
        el('p', { text: (info.domainName ? '中学校 技術・家庭科(技術分野)「' + info.domainName + '」の教材です。' : '中学校 技術・家庭科(技術分野)の教材です。') }),
        el('p', { text: '作成: ' + AUTHOR }),
        el('p', { text: (info.version ? '第' + info.version + '版' : '') + (info.updated ? '(' + info.updated + ' 更新)' : '') })
      ]]
    ];
    var tabs = el('div', { class: 'ef-tabs', role: 'tablist' });
    var body = el('div');
    var tabEls = [], panelEls = [];
    panels.forEach(function (p, i) {
      var t = el('button', { type: 'button', class: 'ef-tab', role: 'tab', id: 'ef-tab-' + i, 'aria-controls': 'ef-panel-' + i, 'aria-selected': i ? 'false' : 'true', tabindex: i ? '-1' : '0', text: p[0] });
      var pn = el('div', { class: 'ef-panel', role: 'tabpanel', id: 'ef-panel-' + i, 'aria-labelledby': 'ef-tab-' + i }, p[1]);
      if (i) pn.hidden = true;
      t.addEventListener('click', function () { select(i); });
      t.addEventListener('keydown', function (e) {
        var n = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (n) { e.preventDefault(); select((i + n + panels.length) % panels.length); tabEls[(i + n + panels.length) % panels.length].focus(); }
      });
      tabEls.push(t); panelEls.push(pn); tabs.appendChild(t); body.appendChild(pn);
    });
    function select(i) {
      tabEls.forEach(function (t, j) { t.setAttribute('aria-selected', i === j ? 'true' : 'false'); t.tabIndex = i === j ? 0 : -1; });
      panelEls.forEach(function (p, j) { p.hidden = i !== j; });
    }
    var close = el('button', { type: 'button', class: 'ef-btn', text: '閉じる' });
    close.addEventListener('click', function () { dlg.close(); });
    dlg = el('dialog', { class: 'ef-dialog', 'aria-labelledby': 'ef-dialog-title' }, [
      el('div', { class: 'ef-dialog-in' }, [
        el('div', { class: 'ef-dialog-head' }, [el('h2', { id: 'ef-dialog-title', text: 'このアプリについて' }), close]),
        tabs, body
      ])
    ]);
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
    dlg._select = select;

  }
  function open(tab) {

  }

  function aboutButton(cls) {

    else if (about) { if (!about.querySelector('button')) about.appendChild(aboutButton()); }
    else if (!document.querySelector('body > .ef-footer')) document.body.appendChild(footer());
  }

  // ---- 基本編・発展編のタブ(メニュー用) ----
  var LEVEL_KEYS = ['basic', 'advanced'];
  function levels(box, opts) {
    var L = info.levels;
    if (!box || !L) return null;
    opts = opts || {};
    var store = 'eduit.level.' + (info.domain || 'x');
    var cur = 'basic';
    try { if (LEVEL_KEYS.indexOf(localStorage.getItem(store)) >= 0) cur = localStorage.getItem(store); } catch (e) {}
    var uid = 'ef-lv-' + (info.domain || 'x');
    var tabs = el('div', { class: 'ef-level-tabs', role: 'tablist', 'aria-label': '基本編と発展編' });
    var panel = el('div', { class: 'ef-level-panel', role: 'tabpanel', id: uid + '-panel', tabindex: '-1' });
    var tabEls = LEVEL_KEYS.map(function (k, i) {
      var lv = L[k] || { items: [] };
      var t = el('button', { type: 'button', role: 'tab', class: 'ef-level-tab ef-level-' + k, id: uid + '-' + k, 'aria-controls': uid + '-panel' }, [
        el('span', { class: 'ef-level-name', text: lv.title || (k === 'basic' ? '基本編' : '発展編') }),
        el('span', { class: 'ef-level-count', text: (lv.items || []).length + 'つ' })
      ]);
      t.addEventListener('click', function () { select(k, true); });
      t.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        var n = LEVEL_KEYS[(i + 1) % LEVEL_KEYS.length];
        select(n, true); tabEls[LEVEL_KEYS.indexOf(n)].focus();
      });
      tabs.appendChild(t);
      return t;
    });
    function partsEl(item) {
      if (!item.parts || !item.parts.length) return null;
      return el('p', { class: 'ef-level-parts' }, [el('span', { class: 'ef-level-parts-k', text: '使うところ' }), item.parts.join('・')]);
    }

      var lv = L[cur] || { items: [] };
      tabEls.forEach(function (t, i) { var on = LEVEL_KEYS[i] === cur; t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = on ? 0 : -1; });

          c.insertBefore(el('p', { class: 'ef-mcard-tb' }, [el('span', { class: 'ef-level-parts-k', text: '教科書' }), t.ref]), go && go.parentNode === c ? go : null);
        }
        if (!tb || !tb.groups) { grid.appendChild(c); return; }
        var gi = 0;
        tb.groups.forEach(function (g, i) { if (t && t.g === g.key) gi = i; });
        (groups[gi] = groups[gi] || []).push(c);
      });
      // 教科書の章ごとに見出しで区切る(EDUIT_INFO.textbook)。区切りの中は levels の items の順
      var blocks = [];
      if (tb && tb.groups) tb.groups.forEach(function (g, i) {
        if (!groups[i]) return;
        blocks.push(el('h3', { class: 'ef-level-group' }, [g.ch ? el('span', { class: 'ef-level-group-ch', text: g.ch }) : null, g.title]));
        blocks.push(el('div', { class: 'ef-level-grid ' + (opts.gridClass || '') }, groups[i]));
      });
      while (panel.firstChild) panel.removeChild(panel.firstChild);
      if (lv.lead) panel.appendChild(el('p', { class: 'ef-level-lead', text: lv.lead }));
      if (opts.code && cur === 'basic') {
        var codes = (lv.items || []).map(opts.code).filter(Boolean);
        if (codes.length) panel.appendChild(el('p', { class: 'ef-level-order' }, [el('span', { class: 'ef-level-parts-k', text: 'おすすめの順番' }), codes.join(' → ')]));
      }
      if (blocks.length) blocks.forEach(function (b) { panel.appendChild(b); });
      else panel.appendChild(grid);
      if (opts.onRender) opts.onRender(panel, cur);
    }
    function select(k, byUser) {
      if (LEVEL_KEYS.indexOf(k) < 0) return;
      cur = k;
      if (byUser) try { localStorage.setItem(store, k); } catch (e) {}
      render();
    }
    while (box.firstChild) box.removeChild(box.firstChild);
    box.classList.add('ef-levels');

    box.appendChild(panel);

  }

  // ---- 記号の印・メニューの上のバーの名前・メニューのカード(4分野共通の形) ----
  function code(c) { return el('span', { class: 'ef-code', text: c }); }
  function menuTitle(h) {
    if (!h) return h;
    while (h.firstChild) h.removeChild(h.firstChild);
    h.classList.add('ef-title');
    if (info.domain) h.appendChild(code(info.domain));
    h.appendChild(el('span', { class: 'ef-title-name', text: (info.domainName || '') + ' 教材集' }));
    return h;
  }
  function card(o) {
    o = o || {};
    var go = o.href
      ? el('a', { class: 'ef-btn-primary ef-mcard-go', href: o.href, text: 'ひらく ▶' })
      : el('button', { type: 'button', class: 'ef-btn-primary ef-mcard-go', text: 'ひらく ▶' });
    if (o.openAttrs) for (var k in o.openAttrs) go.setAttribute(k, o.openAttrs[k]);
    if (o.title) go.setAttribute('aria-label', (o.code ? o.code + ' ' : '') + o.title + ' をひらく');

    var c = el('article', { class: 'ef-card ef-mcard' }, [
      el('div', { class: 'ef-mcard-hd' }, [
        o.icon ? el('span', { class: 'ef-mcard-ic', 'aria-hidden': 'true', text: o.icon }) : null,
        el('div', { class: 'ef-mcard-ht' }, [
          o.code ? el('p', { class: 'ef-card-tag' }, [code(o.code)]) : null,
          el('h3', { class: 'ef-card-title', text: o.title || '' })

      ]),
      o.desc ? el('p', { class: 'ef-mcard-desc', text: o.desc }) : null,

      extra.length ? el('div', { class: 'ef-mcard-extra' }, extra) : null,

    c.addEventListener('click', function (e) {

      go.click();
    });
    return c;
  }

  // ---- 文字の大きさのボタン(4分野で同じ形:「文字 中」。押すたびに次の大きさへ) ----
  function sizeButton(btn, opt) {
    var steps = opt.steps;
    btn.classList.add('ef-btn', 'ef-size');
    btn.type = 'button';
    btn.textContent = '';
    btn.appendChild(document.createTextNode('文字 '));
    var v = document.createElement('span');
    v.className = 'ef-size-v';
    v.setAttribute('data-noruby', '');
    btn.appendChild(v);
    function idx() {
      var cur = opt.get(), best = 0;
      for (var i = 1; i < steps.length; i++) if (Math.abs(steps[i][0] - cur) < Math.abs(steps[best][0] - cur)) best = i;
      return best;
    }
    function update() {

  return { dist: (d.dist || []).filter((x) => s.allow.dist.includes(x)), color: s.allow.color.includes(Number(d.color)) ? Number(d.color) : base.color, speed: SPEEDS[d.speed] ? d.speed : base.speed };

    h("p", { class: "scn-goal" }, h("strong", {}, "めあて："), s.goal),
    h(
      "details",
      { class: "scn-story", open: firstVisit ? "open" : null },
      h("summary", {}, "ステージの説明（お話・できたら合格になること）"),
      h("p", {}, s.story),
      h("p", { class: "hint" }, h("strong", {}, "学ぶこと: "), s.learn),
      h("h3", { class: "dev-title" }, s.free ? "点数のつけ方" : "テストで調べること（ケースごと）"),
      h("ul", {}, s.checks.map((c) => h("li", {}, c))),
    ),
    h("details", { class: "hints" }, h("summary", {}, "ヒントを見る"), h("ol", {}, s.hints.map((x) => h("li", {}, x)))),
  );

  // ---- 2 解決策の構想: ロボットの設計 ----

    const full = design.dist.length >= MAX_DIST_SENSORS;
    const distBtns = distAllowed.map((slot) => {
      const on = design.dist.includes(slot.id);
      return h(
        "button",
        {
          type: "button",
          class: `ef-btn chip${on ? " is-on" : ""}`,
          "aria-pressed": on ? "true" : "false",
          disabled: !on && full ? "disabled" : null,
          "data-slot": slot.id,
          onclick: () => {
            const next = on ? design.dist.filter((x) => x !== slot.id) : [...design.dist, slot.id];
            setDesign({ ...design, dist: DIST_SLOTS.map((x) => x.id).filter((id) => next.includes(id)) });
          },
        },
        on ? "✓ " : "＋ ",
        slot.short,
      );
    });
    const radio = (name, value, label, checked, onPick) => {
      const id = `${name}-${s.id}-${value}`;

    const colorRow = s.allow.color.length > 1 ? h("div", { class: "design-row" }, h("span", { class: "design-label" }, "色センサ（下向き）"), h("div", { class: "chip-row" }, s.allow.color.map((n) => radio("color", n, n === 0 ? "なし" : n === 1 ? "1こ（まん中）" : "2こ（左右）", Number(design.color) === n, (v) => setDesign({ ...design, color: Number(v) }))))) : null;

        robotSvg(design),
      ),
    );
  }

  function setDesign(d) {
    design = d;
    store.setDesign(s.id, d);
    renderDesign();
    blockEd.setSensors(sensorsOf(design));
    errors = [...validate(program, design).errors, ...blockEd.inputErrors()];
    afterProgramChange();
  }

  // ---- 3 プログラムの制作 ----
  const blockEd = createBlockEditor(() => programChanged(), () => {

  }

  function programChanged() {
    text = programToText(program);
    store.setProgram(s.id, text);

  function renderFlow() {

      edBody.replaceChildren(blockEd.el);
    } else {

      edBody.replaceChildren(h("p", { class: "hint" }, "フローチャートはプログラムから自動でかかれます（解決策の構想で考えた流れと同じになっているか、くらべよう）。直すときは「ブロック」で。"), flowBox);

  const undoBtn = h("button", { type: "button", class: "btn secondary small", onclick: () => {

  const resetBtn = h("button", { type: "button", class: "btn secondary small", onclick: () => {

    applyText(s.starter);

  // ---- テスト ----

  function doTests() {
    if (errors.length) return toast("まちがいを直してからテストしよう");
    const results = runTests(s, program, design);
    const passed = results.filter((r) => r.pass).length;
    const rec = store.addRecord({ sid: s.id, title: s.title, passed, total: results.length, results: results.map((r) => ({ id: r.id, name: r.name, pass: r.pass, reason: r.reason })), program: text, design: { ...design }, cost: designCost(design) });

  function runChallenge() {
    if (errors.length) return toast("まちがいを直してから挑戦しよう");
    const c = s.cases[caseIdx];
    const sm = new RoverSim(c.field, program, design);
    const sum = sm.runToEnd();
    const score = freeScore(c.field, sum);
    const rec = store.addRecord({ sid: s.id, title: `${s.title}（${c.name}）`, course: c.id, courseName: c.name, score, passed: sum.collected, total: sum.targets, time: sum.time, battery: sum.battery, goal: sum.goal, crash: Boolean(sum.crash), outcome: sum.outcome, results: [], program: text, design: { ...design }, cost: designCost(design) });
    const best = store.recordsOf(s.id).filter((r) => r.course === c.id).reduce((a, r) => (r.score > a ? r.score : a), 0);

              h("tbody", {}, rs.map((r, i) => h("tr", {}, h("td", {}, `${i + 1}位`), h("td", {}, h("strong", {}, `${r.score}点`)), h("td", {}, `${r.passed}/${r.total}${r.crash ? " 💥" : ""}`), h("td", {}, `${fmt(r.time)}秒`), h("td", {}, `${fmt(r.battery)}%`), h("td", {}, yen(r.cost || 0)), h("td", { class: "small-cell" }, designText(r.design)), h("td", {}, fmtTime(r.at))))),

  function renderMini() {
    if (!lastResults) return testMini.replaceChildren();

  function renderMemo(rec, earlier = false) {
    const id = `memo-${s.id}`;

  // ---- シミュレーションの操作 ----
  function newSim() {
    pause();
    sim = new RoverSim(s.cases[caseIdx].field, program, design);

    outcomeEl.replaceChildren();
    nextEl.replaceChildren();

  function playCase(id) {
    caseIdx = s.cases.findIndex((c) => c.id === id);
    caseSel.value = String(caseIdx);
    newSim();
    worldCard.scrollIntoView({ behavior: "smooth", block: "start" });
    run();
  }

  function run() {
    if (errors.length) return toast("まちがいを直してから実行しよう");
    if (!sim || sim.outcome) newSim();
    running = true;
    runBtn.textContent = "⏸ 一時停止";
    nextEl.replaceChildren();
    lastTs = null;
    acc = 0;
    raf = requestAnimationFrame(loop);
    refreshState();
  }

  function pause() {
    running = false;
    runBtn.textContent = "▶ 実行";
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    refreshState();
  }

  function loop(ts) {
    if (!running) return;
    if (lastTs == null) lastTs = ts;
    const dt = Math.min(0.25, (ts - lastTs) / 1000);
    lastTs = ts;
    acc += dt * speed;
    let n = 0;
    while (acc >= DT && n < 200 && !sim.outcome) {
      sim.tick();
      acc -= DT;
      n++;
    }
    refresh();
    if (sim.outcome) {
      pause();
      return;
    }
    raf = requestAnimationFrame(loop);
  }

  function stepOnce() {
    if (errors.length) return toast("まちがいを直してから実行しよう");
    if (!sim || sim.outcome) newSim();
    pause();
    sim.step();
    refresh();
    const node = findNode(sim.currentId);
    nextEl.replaceChildren(sim.outcome ? "" : h("p", { class: "next-line" }, node ? ["次に実行する命令: ", h("strong", {}, blockLabel(node)), "（ブロックとフローチャートで光っています）"] : sim.programAlive ? "待っています（時間が進みます）" : "プログラムは終わりました"));
  }

  function findNode(id) {
    let found = null;
    const walk = (list) => list.forEach((n) => {
      if (n.id === id) found = n;
      for (const k of ["body", "then", "else"]) if (Array.isArray(n[k])) walk(n[k]);
    });
    if (id != null) walk(program);
    return found;
  }

  function highlight() {
    if (!sim) return;
    const id = sim.tickN === 0 && !sim.inTick ? null : sim.currentId;
    blockEd.highlight(running ? null : id);
    flowBox.querySelectorAll(".fc-node.current").forEach((x) => x.classList.remove("current"));
    if (id != null && !running) flowBox.querySelectorAll(`.fc-node[data-id="${id}"]`).forEach((x) => x.classList.add("current"));
  }

  function refreshState() {
    if (!sim) return;
    const st = sim.outcome === "clear" ? "ミッション達成" : sim.outcome === "crash" ? "ぶつかった" : sim.outcome === "battery" ? "電池切れ" : sim.outcome ? "おわり" : running ? "実行中" : sim.tickN ? "一時停止" : "停止中";
    stateEl.textContent = st;
    stateEl.className = `sim-state${sim.outcome === "clear" ? " good" : sim.outcome === "crash" || sim.outcome === "battery" ? " bad" : running ? " run" : ""}`;
  }

  function refresh(force = false) {
    if (!sim) return;
    viewer.draw(sim);
    timeEl.textContent = `${sim.t.toFixed(1)}秒 / ${sim.limit}秒`;
    const bat = sim.battery;
    meters.replaceChildren(
      h("div", { class: "meter" }, h("span", { class: "meter-label" }, "🔋 電池"), h("span", { class: `bar battery-bar${bat < 20 ? " low" : ""}`, role: "img", "aria-label": `電池の残り ${Math.round(bat)}%` }, h("span", { style: `width:${bat.toFixed(1)}%` })), h("span", { class: "meter-val" }, `${bat.toFixed(1)}%`)),
      h("div", { class: "meter" }, h("span", { class: "meter-label" }, "💎 調査"), h("span", { class: "meter-val" }, `${sim.collected}/${sim.targets.length}`), sim.field.goal ? h("span", { class: "meter-val" }, `🚩 ${sim.goalReached ? "着いた" : "まだ"}`) : null, h("span", { class: "meter-val muted" }, `走った距離 ${Math.round(sim.robot.dist)}cm`)),
    );
    refreshState();
    // コンピュータの中の値
    const rows = [];
    for (const x of sim.sensorList) rows.push(h("tr", { class: "is-sensor" }, h("th", {}, x.name), h("td", {}, x.kind === "dist" ? `${sim.sensors[x.name]} cm` : sim.sensors[x.name] ? "線（1）" : "地面（0）")));
    rows.push(h("tr", { class: `is-output${sim.wheels[0] || sim.wheels[1] ? " on" : ""}` }, h("th", {}, "走行"), h("td", {}, sim.drive)));
    rows.push(h("tr", { class: "is-output" }, h("th", {}, "左右のモーター"), h("td", {}, `左 ${wheelWord(sim.wheels[0])}・右 ${wheelWord(sim.wheels[1])}`)));
    for (const [k, v] of Object.entries(sim.vars)) rows.push(h("tr", { class: "is-var" }, h("th", {}, `変数 ${k}`), h("td", {}, fmt(v))));
    panel.replaceChildren(h("table", { class: "mcu-table" }, h("tbody", {}, rows)));
    // ログ
    const items = sim.log.slice(-40).reverse().map((l) => h("li", { class: `log-${l.kind}` }, h("span", { class: "log-t" }, `${l.t.toFixed(1)}秒`), l.text));
    logBox.replaceChildren(...(items.length ? items : [h("li", { class: "hint" }, "▶ 実行すると、ここに動きの記録が出ます。")]));
    highlight();
    if (sim.outcome && announced !== sim) {
      announced = sim;
      const sum = sim.summary();
      const j = judge(s, sim.field, sum);
      outcomeEl.replaceChildren(
        sim.outcome === "clear"
          ? explainCard("ミッション達成！", `${fmt(sum.time)}秒・電池の残り ${fmt(sum.battery)}%。${s.free ? "" : "ほかのケースでもうまくいくか、テストで確かめよう。"}`, "good")
          : explainCard(sim.outcome === "crash" ? "ぶつかった！" : sim.outcome === "battery" ? "電池が切れた" : sim.outcome === "time" ? "時間切れ" : "止まりました", j.reasons.join("。") || "プログラムが終わりました。", sim.outcome === "stopped" ? "warn" : "bad"),
      );
    }
    if (force) nextEl.replaceChildren();
  }

  const wheelWord = (w) => (w > 0 ? "前へ" : w < 0 ? "後ろへ" : "止まる");

  const onResize = () => sim && viewer.draw(sim);
  window.addEventListener("resize", onResize);
  cleanup = () => {
    pause();
    window.removeEventListener("resize", onResize);
  };

  view.replaceChildren(head, designCard, h("div", { class: "workbench" }, editorCard, worldCard), testCard);
  renderDesign();
  setEditorTab(editorTab);
  showErrors();
  newSim();
  if (s.free) renderRanking();
  // 前のテストの記録があれば、その改善メモを出す
  const last = store.recordsOf(s.id).at(-1);
  if (last) renderMemo(last, true);
  renderHistory();
}

// ロボットを上から見た図（センサの位置）
function robotSvg(design) {
  const sz = 150;
  const c = sz / 2;
  const k = 2.1;
  let s = `<rect x="${c - 16 * k}" y="${c - 13 * k}" width="${32 * k}" height="${26 * k}" rx="8" class="rb-body"/>`;
  s += `<rect x="${c - 16 * k}" y="${c - 13 * k - 2}" width="${32 * k}" height="9" rx="3" class="rb-wheel"/><rect x="${c - 16 * k}" y="${c + 13 * k - 7}" width="${32 * k}" height="9" rx="3" class="rb-wheel"/>`;
  s += `<polygon points="${c + 12 * k},${c} ${c + 6 * k},${c - 4 * k} ${c + 6 * k},${c + 4 * k}" class="rb-front"/>`;
  for (const id of design.dist) {
    const sl = DIST_SLOTS.find((x) => x.id === id);
    const x = c + sl.fwd * k;
    const y = c + sl.side * k;
    const a = (sl.dir * Math.PI) / 180;
    s += `<line x1="${x}" y1="${y}" x2="${x + Math.cos(a) * 26}" y2="${y + Math.sin(a) * 26}" class="rb-beam"/>`;
    s += `<rect x="${x - 6}" y="${y - 6}" width="12" height="12" rx="2" class="rb-dist" transform="rotate(${sl.dir} ${x} ${y})"/>`;
  }
  for (const cs of COLOR_SETS[Number(design.color) || 0]) s += `<circle cx="${c + cs.fwd * k}" cy="${c + cs.side * k}" r="5" class="rb-color"/>`;
  return h("figure", { class: "robot-fig" }, h("div", { html: `<svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}" role="img" aria-label="ロボットを上から見た図（右が前）">${s}</svg>` }), h("figcaption", { class: "hint" }, "上から見た図（右が前）。青い四角: 距離センサ、緑の丸: 色センサ"));
}

  ["debug", "動作確認・デバッグ: 思ったとおりに動かなかったところと、どう直したか", "例: 速く走るとぶつかったので、止まる距離を 10cm から 30cm にした。"],
  ["improve", "評価して、もっとよくするために改善・修正したいこと", "例: 電池を多く使っていたので、速さをふつうにして、回る回数をへらしたい。"],
  ["society", "この問題解決の考え方を、社会や生活のどんな問題の解決に生かせそうか", "例: 災害で人が入れない建物の中を調べるロボットに使えそう。"],
];

function renderEval() {
  const ev = store.state.evaluation || { before: {}, after: {} };
  const chartBox = h("div", { class: "radar-box" });
  const COLORS = { before: "#2a78d6", after: "#eb6834" };
  const draw = () => {
    const e = store.state.evaluation;
    chartBox.innerHTML = radarSvg([
      { values: e.before, color: COLORS.before, label: "改善の前" },
      { values: e.after, color: COLORS.after, label: "改善のあと" },
    ]);
  };
  const sliders = (which, title) =>
    h(
      "fieldset",
      { class: `eval-set eval-${which}` },
      h("legend", {}, h("span", { class: "swatch", style: `background:${COLORS[which]}` }), title),
      AXES.map((a) => {
        const id = `ev-${which}-${a}`;
        const v = Number(ev[which]?.[a]) || 0;
        const out = h("output", { for: id }, v ? `${v}` : "—");
        const r = h("input", { type: "range", id, min: "0", max: "5", step: "1", value: v, "aria-label": `${title} ${a}` });
        r.addEventListener("input", () => {
          store.setEval(which, a, Number(r.value));
          out.textContent = Number(r.value) ? r.value : "—";
          draw();
        });
        return h("div", { class: "field eval-row" }, h("label", { for: id }, a, " ", out), r);
      }),
    );
  // 参考になる記録
  const facts = STAGES.map((s) => {
    const rs = store.recordsOf(s.id);
    const best = store.best(s.id);
    const last = rs.at(-1);
    return h("tr", {}, h("td", {}, `${s.label} ${s.title}`), h("td", {}, best ? (s.free ? `${best.score}点` : `${best.passed}/${best.total}`) : "—"), h("td", {}, last ? yen(last.cost || 0) : "—"), h("td", {}, last ? designText(last.design || designOf(s)) : "—"));
  });
  const reflect = REFLECT_Q.map(([id, q, ex]) => {
    const tid = `refl-${id}`;
    const ta = h("textarea", { id: tid, maxlength: "400", placeholder: ex });
    ta.value = store.getReflection(id);
    const note = h("div", { class: "saved-note", "aria-live": "polite" });
    attachAutosave(ta, (t) => store.setReflection(id, t.trim()), { onSaved: () => (note.textContent = AUTOSAVE_DONE) });
    return h("div", { class: "field" }, h("label", { for: tid, class: "block-label" }, q), ta, note);
  });
  view.replaceChildren(
    h("h1", {}, T_EVAL),
    h(
      "section",
      { class: "card" },
      h("h2", {}, h("span", { class: "ps-tag" }, "4 評価、改善・修正"), "レーダーチャートで評価しよう"),
      h("p", {}, "自分のロボット（設計とプログラム）を、5つの観点で 1〜5 の5段階で評価しよう。はじめに「改善の前」をつけ、直したあとに「改善のあと」をつけると、どこがよくなったかが見えます。"),
      h("div", { class: "eval-grid" }, chartBox, h("div", { class: "eval-sliders" }, sliders("before", "改善の前"), sliders("after", "改善のあと"))),
      h("dl", { class: "axis-notes" }, AXES.map((a) => [h("dt", {}, a), h("dd", {}, AXIS_NOTE[a])])),
    ),
    h(
      "section",
      { class: "card" },
      h("h2", {}, "評価の参考になる自分の記録"),
      h("div", { class: "table-wrap" }, h("table", { class: "data" }, h("thead", {}, h("tr", {}, h("th", {}, "ステージ"), h("th", {}, "いちばんよい結果"), h("th", {}, "費用（最新）"), h("th", {}, "設計（最新）"))), h("tbody", {}, facts))),
      h("p", { class: "hint" }, "テストの「電池の残り」や「ぶつかった」も、環境への配慮・安全性を評価するときの手がかりになります。"),
    ),
    h("section", { class: "card reflection", "data-ef-reflect": "" }, h("h2", {}, "振り返り"), h("p", { class: "hint" }, AUTOSAVE_HINT), reflect),
  );
  draw();
}

// ---------------- 記録 ----------------
function renderRecords() {
  const st = store.state;
  const field = (key, label, w) => {
    const inp = h("input", { type: "text", value: st.student[key] || "", id: `stu-${key}`, style: `max-width:${w}` });
    inp.addEventListener("change", () => store.setStudent({ [key]: inp.value.trim() }));
    return h("div", { class: "field" }, h("label", { for: `stu-${key}` }, label), inp);
  };
  const recs = [...st.records].reverse();
  const summary = STAGES.map((s) => {
    const rs = store.recordsOf(s.id);
    const best = store.best(s.id);
    return h("tr", {}, h("td", {}, `${s.icon} ${s.label} ${s.title}`), h("td", {}, rs.length), h("td", {}, best ? (s.free ? `${best.score}点` : `${best.passed}/${best.total}`) : "—"));
  });
  const list = recs.map((r) =>
    h(
      "li",
      { class: "rec" },
      h("div", { class: "rec-head" }, h("strong", {}, r.title), r.score != null ? h("span", { class: "status good" }, `${r.score}点`) : h("span", { class: `status ${r.passed === r.total ? "good" : "warn"}` }, `${r.passed}/${r.total} 合格`), h("span", { class: "hint" }, fmtTime(r.at))),
      r.results?.length ? h("ul", { class: "rec-results" }, r.results.map((x) => h("li", {}, x.pass ? "○ " : "× ", x.name, x.pass ? "" : `（${x.reason}）`))) : h("p", { class: "hint" }, `サンプル ${r.passed}/${r.total}・${fmt(r.time)}秒・電池の残り ${fmt(r.battery)}%`),
      r.design ? h("p", { class: "hint" }, designText(r.design), `・費用 ${yen(r.cost || 0)}`) : null,
      r.memo ? h("p", { class: "rec-memo" }, "改善メモ: ", r.memo) : null,
      h("details", {}, h("summary", {}, "このときのプログラム"), h("pre", { class: "code-view small" }, r.program)),
    ),
  );
  const exportNote = h("p", { class: "export-note", "aria-live": "polite" });
  const readyToExport = () => {
    const vals = Object.fromEntries(["cls", "num", "name"].map((k) => [k, (document.getElementById(`stu-${k}`)?.value || "").trim()]));
    store.setStudent(vals);
    const empty = ["cls", "num"].find((k) => !vals[k]);
    if (empty) {
      exportNote.className = "export-note warn";
      exportNote.textContent = "組と番号を入れてから書き出そう";
      document.getElementById(`stu-${empty}`)?.focus({ preventScroll: true });
      return false;
    }
    return true;
  };
  const exported = (name) => {
    exportNote.className = "export-note good";
    exportNote.textContent = `ファイルを保存しました（ファイル名: ${name}）。先生に言われた場所に出そう。`;
  };
  const exportJson = () => {
    if (!readyToExport()) return;
    const name = `火星探査ロボット_記録_${st.student.cls || ""}${st.student.num || ""}.json`;
    const data = { app: APP_NAME, exportedAt: new Date().toISOString(), student: st.student, kadai: st.kadai, records: st.records, evaluation: st.evaluation, reflections: FK_OFF ? {} : st.reflections, programs: st.programs, designs: st.designs };
    downloadFile(name, JSON.stringify(data, null, 2));
    exported(name);
  };
  const exportCsv = () => {
    if (!readyToExport()) return;
    const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const lines = [["組", "番号", "名前", "日時", "ステージ", "合格数・サンプル", "ケース数・サンプル数", "点数", "不合格の理由", "設計", "費用", "改善メモ"].map(q).join(",")];
    for (const r of st.records) lines.push([st.student.cls, st.student.num, st.student.name, r.at, r.title, r.passed, r.total, r.score ?? "", (r.results || []).filter((x) => !x.pass).map((x) => `${x.name}: ${x.reason}`).join(" / "), r.design ? designText(r.design) : "", r.cost ?? "", r.memo].map(q).join(","));
    for (const w of ["before", "after"]) for (const a of AXES) if (st.evaluation?.[w]?.[a]) lines.push([st.student.cls, st.student.num, st.student.name, "", `評価（${w === "before" ? "改善の前" : "改善のあと"}）`, "", "", "", a, st.evaluation[w][a], "", ""].map(q).join(","));
    if (!FK_OFF) for (const [id, qq] of REFLECT_Q) if (store.getReflection(id)) lines.push([st.student.cls, st.student.num, st.student.name, st.reflections[id].at, `振り返り: ${qq.split(":")[0]}`, "", "", "", "", "", "", store.getReflection(id)].map(q).join(","));
    const name = `火星探査ロボット_記録_${st.student.cls || ""}${st.student.num || ""}.csv`;
    downloadFile(name, "﻿" + lines.join("\r\n"), "text/csv");
    exported(name);
  };
  view.replaceChildren(
    h("h1", {}, "記録"),
    h("section", { class: "card" }, h("h2", {}, "名前"), h("div", { class: "field-row" }, field("cls", "組", "8em"), field("num", "番号", "6em"), field("name", "名前", "16em")), h("p", { class: "hint" }, "名前はこの端末のブラウザと、書き出したファイルに入ります。ほかの人と端末を使うときは、最後に「この端末の記録をすべて消す」を押そう。")),
    h(
      "section",
      { class: "card" },
      h("h2", {}, "ステージごとのまとめ"),
      h("div", { class: "table-wrap" }, h("table", { class: "data" }, h("thead", {}, h("tr", {}, h("th", {}, "ステージ"), h("th", {}, "テスト・挑戦の回数"), h("th", {}, "いちばんよい結果"))), h("tbody", {}, summary))),
      h("p", { class: "hint" }, h("strong", {}, "先生に出すのは JSON のファイルです。"), "課題・テストの記録・評価", FK_OFF ? "" : "・振り返り", " が入ります。CSV は、表計算ソフトで見るためのものです。"),
      h("div", { class: "btn-row" }, h("button", { type: "button", class: "btn", onclick: exportJson }, "JSONで書き出す（先生に出す）"), h("button", { type: "button", class: "btn secondary", onclick: exportCsv }, "CSVで書き出す（表計算ソフト用）")),
      exportNote,
    ),
    h("section", { class: "card" }, h("h2", {}, `テスト・挑戦の記録（${recs.length}件、新しい順）`), recs.length ? h("ul", { class: "rec-list" }, list) : h("p", {}, "まだ記録がありません。ステージの「テストを実行」「記録に挑戦」を押すと、ここに残ります。"), recs.length ? h("div", { class: "btn-row" }, h("button", { type: "button", class: "btn secondary small", onclick: () => { if (confirm("この端末のテストの記録をすべて消します。よろしいですか？")) { store.clearRecords(); renderRecords(); } } }, "テストの記録だけ消す")) : null),
    h("section", { class: "card" }, h("h2", {}, "記録を消す"), h("p", { class: "hint" }, "次の人に端末をわたすときに使います。名前・課題・設計・プログラム・テストの記録・評価・振り返りをすべて消します。"), h("div", { class: "btn-row" }, h("button", { type: "button", class: "btn secondary", onclick: () => { if (confirm("名前・課題・設計・プログラム・テストの記録・評価・振り返りをすべて消します。よろしいですか？")) { store.reset(); store.setPref("seenStages", []); undoHistories.clear(); toast("記録を消しました"); route(); } } }, "この端末の記録をすべて消す"))),
  );
}

// ---------------- 左メニュー ----------------
function renderNav(current) {
  const link = (href, num, title, id, done, attrs = {}) =>
    h("li", { class: done ? "done" : "", ...attrs }, h("a", { href, "aria-current": current === id ? "page" : null }, h("span", { class: "num", "aria-hidden": "true" }, done ? "✓" : num), h("span", { class: "nav-title" }, title, done ? h("span", { class: "visually-hidden" }, "（全部合格）") : null)));
  const group = (title) => h("li", { class: "nav-group", "aria-hidden": "true" }, title);
  const ol = h("ol");
  ol.append(link("#/", "⌂", "はじめに", "", false));
  for (const [lv, title] of [["basic", "基本編"], ["advanced", "発展編"]]) {
    ol.append(group(title));
    for (const s of STAGES.filter((x) => x.level === lv)) {
      const best = store.best(s.id);
      ol.append(link(`#/s/${s.id}`, s.num, s.title, `s/${s.id}`, Boolean(!s.free && best && best.passed === best.total)));
    }
  }
  ol.append(group("まとめ"));
  ol.append(link("#/eval", "★", T_EVAL, "eval", false));
  ol.append(link("#/records", "✎", "記録", "records", false));
  nav.replaceChildren(h("nav", { "aria-label": "ページ" }, ol));
}

// ---------------- ルーティング ----------------
function route() {
  flushAutosaves();
  cleanup?.();
  cleanup = null;
  const [page = "", arg] = location.hash.replace(/^#\/?/, "").split("/");
  renderNav(page === "s" ? `s/${arg}` : page);
  if (page === "s") renderStage(decodeURIComponent(arg || ""));
  else if (page === "eval") renderEval();
  else if (page === "records") renderRecords();
  else if (page === "teacher") renderTeacher();
  else renderHome();
  document.querySelector(".layout")?.classList.toggle("scn-mode", page === "s");
  window.scrollTo(0, 0);
}

function setupToggles() {
  const box = document.getElementById("display-toggles");
  const apply = () => document.documentElement.classList.toggle("large-text", Boolean(store.pref("largeText")));
  const b = h("button", { type: "button", class: "ef-btn ef-size", "data-kz-label": "大きな文字", "aria-label": "文字の大きさ(大きな文字)", "aria-pressed": store.pref("largeText") ? "true" : "false" }, "文字 ", h("span", { class: "ef-size-v" }));
  b.addEventListener("click", () => {
    store.setPref("largeText", !store.pref("largeText"));
    b.setAttribute("aria-pressed", store.pref("largeText") ? "true" : "false");
    apply();
    window.dispatchEvent(new Event("resize"));
  });
  box.replaceChildren(b);
  apply();
}

function setupTeacherKeys() {
  const word = "teacher";
  let typed = "";
  window.addEventListener("keydown", (e) => {
    const t = e.target;
    if (e.ctrlKey || e.metaKey || e.altKey || (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))) return;
    if (e.key.length !== 1) return;
    typed = (typed + e.key.toLowerCase()).slice(-word.length);
    if (typed === word) {
      typed = "";
      location.hash = "#/teacher";
    }
  });
}

function start() {
  setupToggles();
  setupTeacherKeys();
  const header = document.querySelector(".app-header");
  const setHeaderH = () => document.documentElement.style.setProperty("--header-h", `${header?.offsetHeight || 0}px`);
  setHeaderH();
  if (header && "ResizeObserver" in window) new ResizeObserver(setHeaderH).observe(header);
  window.addEventListener("hashchange", route);
  window.addEventListener("pagehide", flushAutosaves);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") flushAutosaves();
  });
  route();
}

start();

return {  };
})();
</script>
