  <style id="eduit-frame-css">
/* Edu-IT 共通の枠(4分野・全アプリ共通)
 * 色・文字・ボタン・カード・ヘッダー・フッターの見た目をそろえるための部品。
 * 分野の色は <html data-ef-domain="A|B|C|D"> で切りかわる。
 * アプリ固有の見た目は各アプリの CSS に残し、ここでは「枠」だけを決める。
 */
:root {
  --ef-font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --ef-bg: #f5f4f0;          /* 画面の地 */
  --ef-surface: #ffffff;     /* カード・ヘッダー */
  --ef-surface-2: #f8f7f4;   /* 一段下げた面 */
  --ef-line: #d6d3cb;        /* 枠線 */
  --ef-text: #1f2328;
  --ef-muted: #565d68;
  --ef-focus: #f08c00;       /* キーボード操作の枠 */
  --ef-radius: 12px;
  --ef-radius-s: 8px;
  --ef-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .04);
  --ef-header-h: 52px;
  --ef-tap: 40px;            /* ボタンの最小の高さ */
  /* 分野の色(既定は D) */
  --ef-accent: #1a5fc8;
  --ef-accent-ink: #ffffff;
  --ef-accent-soft: #e6eefb;
}
:root[data-ef-domain="A"] { --ef-accent: #985a26; --ef-accent-soft: #f5e9dc; }  /* 材料と加工: 木の茶 */
:root[data-ef-domain="B"] { --ef-accent: #2e7d32; --ef-accent-soft: #e4f2e5; }  /* 生物育成: 緑 */
:root[data-ef-domain="C"] { --ef-accent: #b45309; --ef-accent-soft: #fbeedd; }  /* エネルギー変換: だいだい */
:root[data-ef-domain="D"] { --ef-accent: #1a5fc8; --ef-accent-soft: #e6eefb; }  /* 情報: 青 */

.tab-icon { font-size: 0.9rem; }
.main { max-width: 1320px; margin: 0 auto; padding: 18px 20px; }
main:focus { outline: none; }
.app-footer .author { font-weight: 700; color: var(--text-secondary); }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.toolbar .tb-title { font-size: 1.35rem; margin: 0; margin-right: auto; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.segmented { display: inline-flex; border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; }
.segmented .seg { font: inherit; font-size: 0.88rem; padding: 4px 12px; min-height: 36px; border: 0; background: var(--surface-1); color: var(--text-primary); cursor: pointer; }
.segmented .seg + .seg { border-left: 1.5px solid var(--border); }
.segmented .seg[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
.nowrap { white-space: nowrap; }

/* 作品 */
.flow { list-style: none; padding: 0; margin: 0 0 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; counter-reset: f; }
.flow li { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 0.85rem; color: var(--text-secondary); counter-increment: f; }
.flow li strong { display: block; color: var(--text-primary); font-size: 0.98rem; }
.flow li strong::before { content: counter(f) ". "; color: var(--accent); }
@media (max-width: 760px) { .flow { grid-template-columns: 1fr 1fr; } }
button.module-card { font: inherit; text-align: left; cursor: pointer; }
button.module-card:hover { border-color: var(--accent); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 0.72rem; padding: 0 8px; border-radius: 99px; background: var(--surface-2); color: var(--text-secondary); }
details.plan { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
details.plan summary { cursor: pointer; font-weight: 700; }
details.plan textarea { min-height: 64px; }
.work-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.work-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; }
.work-list li.current { border-color: var(--accent); background: var(--accent-soft); }
.work-list .wl-title { font-weight: 700; flex: 1; min-width: 10em; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.work-list .wl-date { font-size: 0.8rem; color: var(--text-muted); }
.work-list .btn-row { margin: 0; }

/* エディタ */
.editor-grid { display: grid; gap: 12px; grid-template-columns: 190px minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.editor-grid.mode-blocks { grid-template-columns: 190px minmax(0, 1fr); }
.editor-grid.mode-blocks .pane-code { display: none; }
.editor-grid.mode-code { grid-template-columns: minmax(0, 1fr); }
.editor-grid.mode-code .pane-palette, .editor-grid.mode-code .pane-blocks { display: none; }
/* 「ブロック＋実行」: ブロックの横に小さな実行画面（IS-07） */
.editor-grid.mode-run { grid-template-columns: 190px minmax(0, 1.2fr) minmax(280px, 1fr); }
.editor-grid.mode-run .pane-code { display: none; }
.pane-preview { position: sticky; top: 76px; }
.pane-preview .run-controls { margin: 0 0 8px; }
.pane-preview .stage-frame { padding: 6px; }
@media (max-width: 1000px) {
  .editor-grid, .editor-grid.mode-blocks, .editor-grid.mode-run { grid-template-columns: 160px minmax(0, 1fr); }
  .editor-grid .pane-code, .editor-grid .pane-preview { grid-column: 1 / -1; }
  .pane-preview { position: static; }
}
@media (max-width: 640px) {
  .editor-grid, .editor-grid.mode-blocks, .editor-grid.mode-run { grid-template-columns: minmax(0, 1fr); }
  .palette { max-height: 220px; overflow-y: auto; }
}
.pane { min-width: 0; }
.pane-title { font-weight: 700; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; margin-bottom: 6px; }
.pane-title .hint { font-weight: 400; }
.palette { position: sticky; top: 76px; display: grid; gap: 10px; max-height: calc(100vh - 96px); overflow-y: auto; padding-right: 2px; }
.pal-group { display: grid; gap: 4px; }
.pal-title { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; }
.pal-item {
  font: inherit; font-size: 0.84rem; text-align: left; cursor: pointer; padding: 5px 10px; border-radius: 8px; min-height: 34px;
  border: 1.5px solid var(--c); border-left-width: 6px; background: color-mix(in srgb, var(--c) 10%, var(--surface-1)); color: var(--text-primary);
}
.pal-item:hover { background: color-mix(in srgb, var(--c) 22%, var(--surface-1)); }
.pal-item:disabled { cursor: not-allowed; }
.pal-item.pal-part { border-style: dashed; border-left-style: solid; font-weight: 700; }
.pal-note { font-size: 0.75rem; color: var(--text-muted); overflow-wrap: anywhere; }
.cat-event { --c: var(--cat-event); }
.cat-io { --c: var(--cat-io); }
.cat-var { --c: var(--cat-var); }
.cat-ctrl { --c: var(--cat-ctrl); }
.cat-ui { --c: var(--cat-ui); }
.cat-server { --c: var(--cat-server); }
.cat-other { --c: var(--cat-other); }

.workspace { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; min-height: 240px; }
.workspace.readonly { padding: 6px; }
.block { border-left: 6px solid var(--c); border-radius: 8px; background: color-mix(in srgb, var(--c) 9%, var(--surface-1)); margin: 2px 0; }
.block-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 5px 6px; font-size: 0.9rem; border-radius: 0 8px 8px 0; }
.block-head.running { background: var(--now); color: var(--now-ink); box-shadow: inset 0 0 0 2px var(--focus); }
.block-head.error-line { background: var(--bad-soft); box-shadow: inset 0 0 0 2px var(--bad); }
.block-body { margin-left: 18px; padding: 2px 0 2px 4px; border-left: 2px dashed color-mix(in srgb, var(--c) 45%, transparent); }
.block-mid { padding: 2px 8px; font-size: 0.9rem; }
.block-foot { height: 6px; }
.block .word { white-space: nowrap; }
.block.dragging { opacity: 0.4; }
.handle { cursor: grab; touch-action: none; user-select: none; color: var(--text-muted); padding: 2px 4px; font-size: 1rem; }
.tools { margin-left: auto; display: inline-flex; gap: 2px; }
.tool {
  font: inherit; font-size: 0.8rem; min-width: 28px; min-height: 28px; padding: 0 4px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
}
.tool:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.tool:disabled { opacity: 0.35; cursor: default; }
.tool.mini { min-width: 24px; min-height: 24px; }
.block .tools .tool { opacity: 0.55; }
.block-head:hover > .tools .tool, .block-head:focus-within > .tools .tool { opacity: 1; }
input.fld, select.fld {
  font: inherit; font-size: 0.88rem; color: var(--text-primary); background: var(--surface-1); border: 1.5px solid var(--border);
  border-radius: 6px; padding: 2px 6px; min-height: 30px; width: auto; max-width: 100%; field-sizing: content; min-width: 2.5em;
}
.fld.name { border-radius: 99px; border-color: var(--cat-var); font-weight: 700; }
.fld.wide { flex: 1; min-width: 12em; }
.fld.invalid { border-color: var(--bad); background: var(--bad-soft); }
select.fld { padding-right: 4px; }
.fld:disabled { opacity: 1; color: var(--text-primary); }
.slot { display: inline-flex; align-items: center; gap: 0; max-width: 100%; }
.slot-text .fld { border-color: color-mix(in srgb, var(--cat-io) 60%, var(--border)); background: var(--surface-1); }
.slot-expr .fld { font-family: var(--mono); font-size: 0.84rem; }
.mode {
  white-space: nowrap; flex: none;
  font: inherit; font-size: 0.7rem; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary);
  border-radius: 99px; padding: 0 6px; margin-left: 3px; cursor: pointer; min-height: 22px;
}
.slot-text .mode { color: var(--cat-io); }
.mode:disabled { cursor: default; }
.options { display: inline-flex; flex-wrap: wrap; gap: 3px; align-items: center; }
/* 欄の横の、見える注意（" " のつけ忘れ・「式」にしたいとき。IS-05） */
.slot-outer { display: contents; }
.slot-note { flex-basis: 100%; font-size: 0.8rem; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 2px 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.slot-note[hidden] { display: none; }
.slot-note .note-btn { font-size: 0.78rem; min-height: 28px; padding: 0 8px; color: var(--accent); border-color: var(--accent); }
.cond-wrap { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 3px 4px; max-width: 100%; }
select.fld.op { font-family: var(--mono); }
.part-pick { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.tool.add-part { color: var(--accent); border-color: var(--accent); font-weight: 700; padding: 0 8px; }
/* コードにまちがいがある間は、ブロックとパレットを使えない（IS-13） */
.workspace.locked, .palette.locked { opacity: 0.45; pointer-events: none; }
.lock-note { margin: 0 0 8px; }
/* ブロックのすき間: いつも細い点線と小さな「＋」を出し、押せる場所だと分かるようにする（IS-04） */
.gap {
  display: flex; align-items: center; width: 100%; min-height: 20px; margin: 0; padding: 0 0 0 4px; border: 0; cursor: pointer;
  font: inherit; font-size: 0.78rem; color: var(--accent); text-align: left; border-radius: 6px;
  background: linear-gradient(to right, color-mix(in srgb, var(--accent) 35%, transparent) 50%, transparent 0) 0 50% / 8px 1px repeat-x;
}
.gap .gap-plus { font-size: 0.72rem; line-height: 1; color: var(--accent); background: var(--surface-1); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border)); border-radius: 99px; padding: 1px 5px; opacity: 0.8; }
.gap:hover { background: var(--accent-soft); }
.gap:hover .gap-plus { opacity: 1; }
.gap.exit { min-height: 30px; margin: 2px 0; padding: 0 8px; background: var(--surface-1); border: 1.5px dashed var(--accent); font-weight: 700; }
.gap.exit:hover { background: var(--accent-soft); }
.gap.empty { min-height: 26px; color: var(--text-muted); border: 1.5px dashed var(--border); margin: 2px 0; padding: 0 8px; background: transparent; }
.gap.cursor { min-height: 24px; background: var(--accent-soft); border: 2px solid var(--accent); padding: 0 8px; font-weight: 700; color: var(--accent); }
.workspace.is-dragging .gap { min-height: 20px; }
.gap.drop { min-height: 26px !important; background: var(--accent); border-radius: 6px; }
.drag-ghost {
  position: fixed; z-index: 30; pointer-events: none; background: var(--surface-1); border: 2px solid var(--accent);
  border-radius: 8px; padding: 4px 10px; font-size: 0.85rem; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18); max-width: 60vw; white-space: nowrap; overflow: hidden;
}

.code-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); border: 1.5px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface-1); }
.gutter {
  font-family: var(--mono); font-size: 0.86rem; line-height: 1.6; padding: 10px 6px; text-align: right; color: var(--text-muted);
  background: var(--surface-2); white-space: pre; overflow: hidden; user-select: none; min-width: 2.6em; height: 62vh;
}
.code-input {
  font-family: var(--mono); font-size: 0.86rem; line-height: 1.6; border: 0 !important; border-radius: 0 !important; padding: 10px !important;
  height: 62vh; min-height: 280px; resize: vertical; white-space: pre; tab-size: 2; background: var(--surface-1);
}
.code-input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--focus); }

/* 実行 */
.run-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .run-grid { grid-template-columns: minmax(0, 1fr); } }
.run-controls { margin-top: 0; }
.run-status { font-size: 0.88rem; font-weight: 700; color: var(--text-secondary); }
.run-status.st-running, .run-status.st-waiting, .run-status.st-listening { color: var(--good); }
.run-status.st-error { color: var(--bad); }
.run-status.st-paused { color: var(--warn); }
.stage-frame { border: 2px solid var(--border); border-radius: 18px; padding: 10px; background: var(--surface-2); margin-bottom: 12px; }
.stage {
  background: var(--surface-1); border-radius: 12px; min-height: 360px; display: flex; flex-direction: column; gap: 10px; padding: 14px; position: relative;
}
.stage-frame.small .stage { min-height: 220px; }
.stage-parts { display: grid; gap: 8px; }
.part-label { font-size: 1.05rem; font-weight: 700; min-height: 1.5em; white-space: pre-wrap; overflow-wrap: anywhere; }
.part-input { width: 100%; }
.part-row { display: flex; flex-wrap: wrap; gap: 8px; }
.part-button {
  font: inherit; font-weight: 700; cursor: pointer; border-radius: 10px; padding: 8px 18px; min-height: 44px;
  border: 1.5px solid var(--cat-event); background: color-mix(in srgb, var(--cat-event) 14%, var(--surface-1)); color: var(--text-primary);
}
.part-button:hover { background: color-mix(in srgb, var(--cat-event) 26%, var(--surface-1)); }
.stage-output { flex: 1; overflow-y: auto; max-height: 50vh; display: grid; align-content: start; gap: 2px; }
.stage-frame.small .stage-output { max-height: 28vh; }
.out-line { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1px 0; }
.out-answer { color: var(--text-muted); font-size: 0.85rem; }
.out-trim { color: var(--text-muted); font-size: 0.8rem; }
.out-warn { color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 2px 8px; font-size: 0.88rem; }
.stage-prompt:empty { display: none; }
.stage-prompt { border-top: 1px solid var(--border); padding-top: 10px; display: grid; gap: 8px; }
.prompt-q { font-weight: 700; white-space: pre-wrap; overflow-wrap: anywhere; }
.prompt-row { display: flex; gap: 8px; }
.prompt-choices { display: grid; gap: 6px; }
.prompt-choices .choice {
  font: inherit; text-align: left; cursor: pointer; border-radius: 10px; padding: 8px 14px; min-height: 44px;
  border: 1.5px solid var(--accent); background: var(--accent-soft); color: var(--text-primary);
}
.prompt-choices .choice:hover { background: color-mix(in srgb, var(--accent) 25%, var(--surface-1)); }
.stage-net { position: absolute; right: 10px; top: 8px; font-size: 0.78rem; color: var(--cat-server); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.stage-net.on { opacity: 1; }
.error-box { border: 2px solid var(--bad); background: var(--bad-soft); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; }
.error-box strong { color: var(--bad); }
.error-box p { margin: 4px 0; }
.part-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.part-row-edit { display: grid; grid-template-columns: 6.5em minmax(0, 0.8fr) minmax(0, 1.2fr) auto; gap: 6px; align-items: end; padding: 6px 8px; border-radius: 8px; border-left: 5px solid var(--c, var(--border)); background: var(--surface-2); }
.part-row-edit.t-label { --c: var(--cat-io); }
.part-row-edit.t-input { --c: var(--cat-var); }
.part-row-edit.t-button { --c: var(--cat-event); }
.part-row-edit .ptype { font-size: 0.82rem; font-weight: 700; align-self: center; }
.part-row-edit .pfield { display: grid; font-weight: 400; }
.part-row-edit .pfield .hint { font-size: 0.72rem; }
.part-row-edit input { min-height: 36px; padding: 4px 8px; }
.part-row-edit .tools { align-self: center; }
@media (max-width: 520px) { .part-row-edit { grid-template-columns: 1fr 1fr; } }
/* せまいときは「名前」と「文字」を2行に分ける（タブレットの横向きで名前が「co」としか見えなかった。IS-11） */
.designer { container-type: inline-size; }
@container (max-width: 480px) {
  .part-row-edit { grid-template-columns: 6em minmax(0, 1fr) auto; }
  .part-row-edit .ptext { grid-column: 1 / -1; }
}

/* デバッグ */
.debug-controls select { width: auto; min-height: 36px; padding: 4px 8px; }
.debug-controls input[type="range"] { width: 120px; }
.debug-status { font-weight: 700; color: var(--text-secondary); min-height: 1.6em; }
.debug-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .debug-grid { grid-template-columns: minmax(0, 1fr); } }
.listing { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 0.86rem; max-height: 65vh; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
.listing li { display: flex; align-items: stretch; line-height: 1.6; }
.listing li code { white-space: pre; padding: 0 8px; flex: 1; }
.listing li.now { background: var(--now); color: var(--now-ink); }
.listing li.err { background: var(--bad-soft); }
.listing .bp {
  font: inherit; font-size: 0.78rem; min-width: 3.2em; text-align: right; padding: 0 6px; border: 0; border-right: 1px solid var(--border);
  background: var(--surface-2); color: var(--text-muted); cursor: pointer; position: relative;
}
.listing .bp[aria-pressed="true"] { background: var(--bad); color: #fff; font-weight: 700; }
.listing .bp[aria-pressed="true"]::before { content: "● "; }
table.watch tr.changed td, table.watch tr.changed th { background: var(--now); color: var(--now-ink); }
table.watch td.mono { word-break: break-all; }

/* サーバー */
.cs-diagram { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; text-align: center; margin-bottom: 10px; }
.cs-node { background: var(--surface-2); border-radius: 12px; padding: 10px; display: grid; gap: 2px; }
.cs-node .emoji { font-size: 1.8rem; }
.cs-arrows { display: grid; gap: 2px; font-size: 0.85rem; color: var(--cat-server); font-weight: 700; }
.box-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-bottom: 8px; }
.box-card { border: 1px solid var(--border); border-left: 5px solid var(--cat-server); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; align-content: start; }
.box-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tally { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 0.88rem; }
.tally li { display: grid; grid-template-columns: minmax(0, 1fr) 1.2fr auto; gap: 8px; align-items: center; }
.tally .tv { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tally .tbar { height: 12px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.tally .tbar span { display: block; height: 100%; background: var(--cat-server); border-radius: 99px; }
.tally .tn { font-variant-numeric: tabular-nums; color: var(--text-secondary); }
.log-wrap { max-height: 50vh; overflow: auto; }
/* 本物のサーバーと、この教材の模型のちがい（IS-03） */
.real-vs-model { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.real-vs-model .explain { margin: 0; }
.real-vs-model .explain p { margin: 0; }

/* ヘルプ */
.code-sample { font-family: var(--mono); font-size: 0.84rem; margin: 0; white-space: pre; background: var(--surface-2); padding: 4px 8px; border-radius: 6px; overflow-x: auto; }

/* 書き出した作品（プレイヤー） */
body.player .player-wrap { max-width: 720px; margin: 0 auto; }
body.player .app-header { justify-content: center; }

@media print {
  .app-header, .palette, .tools, .gap { display: none !important; }
}
.btn { white-space: nowrap; }
.prompt-row .prompt-input { flex: 1; min-width: 0; }
body.player .player-wrap { padding: 16px; }
@media (max-width: 640px) {
  .app-header { padding: 8px 16px; }
  .main { padding: 14px 16px; }
  .card { padding: 16px; }
  table.data td:first-child { min-width: 7em; }
  .cs-diagram { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .palette { position: static; max-height: 210px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
  .pal-group { display: flex; flex-wrap: wrap; gap: 4px; }
  .pal-title { width: 100%; }
  .app-header { position: static; }
}

/* 左メニュー：ほかの教材（セキュリティラボなど）と同じ位置・同じ見た目。作業画面が広いので幅を広げる */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; gap: 24px; padding: 20px; }
.layout.wide { grid-template-columns: 180px minmax(0, 1fr); max-width: 1500px; gap: 20px; }
.chapter-nav { position: sticky; top: 72px; align-self: start; min-width: 0; }
.chapter-nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; position: relative; }
.chapter-nav a {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
  text-decoration: none; color: var(--text-primary); font-size: 0.92rem;
}
.chapter-nav a:hover { background: var(--surface-2); }
.chapter-nav a[aria-current="page"] { background: var(--accent-soft); font-weight: 700; }
.chapter-nav .num {
  flex: none; width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center;

      { id: 'genai-lab', parts: ['④ つぎの言葉あて', '⑤ 言葉のかけら(トークン)', '⑥ ミニ文章AIを動かす', '⑦ ノイズをまぜる(学習)', '⑧ ノイズから絵をつくる'], curr: 'D(1)ア・D(4)イ(発展)', why: '生成AIが文章や画像を作るしくみの中身は、教科書のコラムより先の内容' },
      { id: 'hash-lab', parts: ['① ハッシュ値を作ってみよう', '② 1文字だけ変えると？', '③ 手作りハッシュの弱点', '④ もとにもどせる？', '⑤ パスワードの守り方', '⑥ 改ざんを見つける', '⑦ クイズとふりかえり'], curr: 'D(1)ア・D(4)ア(発展)', why: 'ハッシュ関数は教科書の基本の内容には入っていない。パスワードの保存や改ざんの見つけ方は情報セキュリティの発展' }
    ]
  }
};

</script>
  <script id="eduit-frame">
/* Edu-IT 共通の枠: 作成者・安全と個人情報・ライセンス・更新履歴
 * 使い方(classic script。file:// でも動く):
 *   <link rel="stylesheet" href="…/shared/eduit-frame.css">
 *   <script src="…/<分野>/eduit-info.js"><\/script>   … window.EDUIT_INFO を決める
 *   <script src="…/shared/eduit-frame.js"><\/script>
 * 置き場所(どれか):
 *   - <div data-ef-footer></div> があればそこにフッターを出す
 *   - <span data-ef-about></span> があればそこに「ⓘ このアプリについて」ボタンを出す(フッターは出さない)
 *   - どちらもなければ <body> の最後にフッターを足す
 *   - EDUIT_INFO.app.footer === false なら自動では何も出さない(EduitFrame.open() だけ使う)
 * EDUIT_INFO = {
 *   domain: 'A',                     分野(A/B/C/D)。色が切りかわる
 *   domainName: '材料と加工の技術',
 *   suite: '材料と加工 教材アプリ',     教材集の名前
 *   version: '2.1', updated: '2026-10-15',
 *   safety: ['この分野だけの安全の説明', …],   共通の説明のあとに足す
 *   history: [{ version: '2.1', date: '2026-10-15', items: ['…', …] }, …]   新しい順
 *   app: { name: 'A3 構造強化ラボ' }   アプリごとに上書き(EDUIT_INFO.app を各ページで決めてもよい)
 *   levels: { basic: {...}, advanced: {...} }   基本編・発展編の分け方(メニューが EduitFrame.levels で使う)
 * }
 *
 * メニューのカード(4分野共通の形): EduitFrame.card({ code: 'A1', icon: '🪵', title: '…', desc: '…', parts: 「使うところ」の要素,
 *   extra: [分野ごとの追加の要素…], href: 'ひらく先' か onOpen: function () {…}, openAttrs: { 'data-go': 'b1' } })
 *   → <article class="ef-card ef-mcard">。記号・アイコン・名前・説明・使うところ・追加の欄・「ひらく ▶」の順。カードのどこを押しても開く。
 * 記号の印: EduitFrame.code('A2') → <span class="ef-code">A2</span>(メニューの上のバー・アプリの上のバー・切りかえボタンで使う)
 * メニューの上のバーの名前: EduitFrame.menuTitle(h1) → h1 の中を「[A] 材料と加工の技術 教材集」にする
 *
 * 振り返りを隠す設定: EduitFrame.furikaeri(true = 出す / false = 隠す)。隠すときは <html data-ef-furikaeri="off"> になり、
 *   data-ef-reflect の付いた要素(振り返りのタブ・欄・カードの印など)が出なくなる(eduit-frame.css)。決め方(先のものが勝つ):
 *   1. アドレスの ?furikaeri=off / ?furikaeri=on(自分か、同じサイトの親の画面のアドレス)。localStorage 'eduit.furikaeri' に覚える
 *   2. window.EDUIT_FURIKAERI = 'off' / 'on'(自分か親の画面。配布用の「振り返りなし」版はこれを入れてある)
 *   3. localStorage 'eduit.furikaeri'(前に 1 で決めたもの)
 *   JS で振り返りを出し分けるとき(振り返りを書かないと先へ進めない、など)は EduitFrame.furikaeri を見る。
 *
 * 基本編・発展編(メニュー用): EduitFrame.levels(置き場所, { card: function (item, parts, levelKey) { return カードの要素; }, code: function (item) { return 'A1'; } })
 *   code を渡すと、基本編の上に「おすすめの順番: A1 → A2 → …」の1行を出す(カードの順 = 番号の順 = おすすめの順)。
 *   EDUIT_INFO.levels = {
 *     basic:    { title: '基本編', lead: '…', items: [{ id: 'M1', parts: ['材料カード', …], curr: 'A(1)ア', why: '…' }, …] },
 *     advanced: { title: '発展編', lead: '…', items: [ … ] }
 *   }
 *   id はメニューごとのアプリの id。parts は生徒の画面に出るタブ・ページの名前(「使うところ」に出す)。
 *   curr(学習指導要領の項目)と why(分けた理由)は先生用の一覧だけに出し、生徒のカードには出さない。
 *   選んだ編は localStorage の 'eduit.level.<分野>' に覚える(表示の設定なので「はじめから」でも消さない)。
 */
(function () {
  'use strict';
  var AUTHOR = '技術　岡田';
  var info = window.EDUIT_INFO || {};
  var app = info.app || {};
  if (info.domain) document.documentElement.setAttribute('data-ef-domain', info.domain);

  // ---- 振り返りを隠す設定 ----
  var FK_KEY = 'eduit.furikaeri';
  function furikaeriSetting() {
    var w = window, v = null;
    for (var i = 0; i < 8 && v === null; i++) {
      try {
        var m = /[?&]furikaeri=(on|off)(?:&|$)/.exec(w.location.search || '');
        if (m) { v = m[1]; try { localStorage.setItem(FK_KEY, v); } catch (e) {} }
        else if (w.EDUIT_FURIKAERI === 'on' || w.EDUIT_FURIKAERI === 'off') v = w.EDUIT_FURIKAERI;
      } catch (e) { break; }  // ちがうサイトの親は見ない
      if (w === w.parent) break;
      w = w.parent;
    }
    if (v === null) try { v = localStorage.getItem(FK_KEY); } catch (e) {}
    return v !== 'off';
  }
  var furikaeri = furikaeriSetting();
  if (!furikaeri) document.documentElement.setAttribute('data-ef-furikaeri', 'off');

  var SAFETY = [
    'この教材はインターネットに接続しません。外部のサイトやサーバーへ、入力した内容や学習の記録を送ることはありません。',
    '学習の記録は、開いた端末のブラウザの中だけに保存されます。ほかの端末や先生のパソコンへ自動で送られることはありません。',
    '提出するときは、自分で「書き出す」などのボタンでファイルにして、先生の指示どおりに出します。',
    '名前などの個人情報は、先生の指示がないときは入力しないでください。',
    '端末をほかの人と共有するときは、提出したあとに記録を消してください。',
    '教材に出てくる会社名・人名・アドレス・数値は、学習のために作ったものです(実在のものではありません。数値は目安です)。',
    '広告・アクセス解析・Cookie による追跡はありません。外部のプログラム(CDN など)も読み込みません。'
  ];
  var LICENSE = [
    '著作権: © 2026 ' + AUTHOR,
    '学校の授業・家庭学習など、学習のためであれば、だれでも無料で使用・コピー・配布できます(ほかの学校の先生も使えます)。',
    '授業に合わせて直して使うこともできます。直したものを配るときは、直したことと、もとの作者(' + AUTHOR + ')を書いてください。',
    '販売すること、有料の教材や商品に入れて配ることはできません。',
    'この教材は今のまま提供します。使ったことで起きた不具合や損害について、作者は責任を負いません。',
    '教科書の図や文章は使っていません。図や文章はこの教材のために作ったものです。'
  ];

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'class') e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function list(items) { return el('ul', null, items.map(function (t) { return el('li', { text: t }); })); }
  function appName() { return app.name || info.suite || document.title; }

  var dlg = null;
  function build() {
    var safety = SAFETY.concat(info.safety || []).concat(app.safety || []);
    var hist = info.history || [];
    var panels = [
      ['安全と個人情報', [el('h3', { text: 'この教材の安全について' }), list(safety)]],
      ['ライセンス', [el('h3', { text: '使ってよい条件' }), list(LICENSE)]],
      ['更新履歴', hist.length ? hist.map(function (h) {
        return el('section', null, [
          el('h3', null, [el('span', { class: 'ef-hist-ver', text: h.version ? '第' + h.version + '版' : '' }),
            el('span', { class: 'ef-hist-date', text: h.date || '' })]),
          list(h.items || [])
        ]);
      }) : [el('p', { text: 'まだありません。' })]],
      ['作った人', [
        el('h3', { text: appName() }),
        el('p', { text: (info.domainName ? '中学校 技術・家庭科(技術分野)「' + info.domainName + '」の教材です。' : '中学校 技術・家庭科(技術分野)の教材です。') }),
        el('p', { text: '作成: ' + AUTHOR }),
        el('p', { text: (info.version ? '第' + info.version + '版' : '') + (info.updated ? '(' + info.updated + ' 更新)' : '') })
      ]]
    ];
    var tabs = el('div', { class: 'ef-tabs', role: 'tablist' });
    var body = el('div');
    var tabEls = [], panelEls = [];
    panels.forEach(function (p, i) {
      var t = el('button', { type: 'button', class: 'ef-tab', role: 'tab', id: 'ef-tab-' + i, 'aria-controls': 'ef-panel-' + i, 'aria-selected': i ? 'false' : 'true', tabindex: i ? '-1' : '0', text: p[0] });
      var pn = el('div', { class: 'ef-panel', role: 'tabpanel', id: 'ef-panel-' + i, 'aria-labelledby': 'ef-tab-' + i }, p[1]);
      if (i) pn.hidden = true;
      t.addEventListener('click', function () { select(i); });
      t.addEventListener('keydown', function (e) {
        var n = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (n) { e.preventDefault(); select((i + n + panels.length) % panels.length); tabEls[(i + n + panels.length) % panels.length].focus(); }
      });
      tabEls.push(t); panelEls.push(pn); tabs.appendChild(t); body.appendChild(pn);
    });
    function select(i) {
      tabEls.forEach(function (t, j) { t.setAttribute('aria-selected', i === j ? 'true' : 'false'); t.tabIndex = i === j ? 0 : -1; });
      panelEls.forEach(function (p, j) { p.hidden = i !== j; });
    }
    var close = el('button', { type: 'button', class: 'ef-btn', text: '閉じる' });
    close.addEventListener('click', function () { dlg.close(); });
    dlg = el('dialog', { class: 'ef-dialog', 'aria-labelledby': 'ef-dialog-title' }, [
      el('div', { class: 'ef-dialog-in' }, [
        el('div', { class: 'ef-dialog-head' }, [el('h2', { id: 'ef-dialog-title', text: 'このアプリについて' }), close]),
        tabs, body
      ])
    ]);
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
    dlg._select = select;
    document.body.appendChild(dlg);
  }
  function open(tab) {
    if (!dlg) build();
    dlg._select(typeof tab === 'number' ? tab : 0);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  }

  function aboutButton(cls) {
    var b = el('button', { type: 'button', class: cls || 'ef-btn ef-about-btn', title: '作った人・安全と個人情報・ライセンス・更新履歴', text: 'ⓘ このアプリについて' });
    b.addEventListener('click', function () { open(0); });
    return b;
  }
  function footer() {
    var link = aboutButton('ef-about-link');
    link.textContent = '安全と個人情報・ライセンス・更新履歴';
    return el('footer', { class: 'ef-footer', role: 'contentinfo' }, [
      el('span', null, ['作成: ', el('span', { class: 'ef-author', text: AUTHOR })]),
      info.version ? el('span', { text: '第' + info.version + '版' + (info.updated ? '(' + info.updated + ')' : '') }) : null,
      link
    ]);
  }
  function mount() {
    if (app.footer === false) return;
    var slot = document.querySelector('[data-ef-footer]');
    var about = document.querySelector('[data-ef-about]');
    if (slot) { if (!slot.querySelector('.ef-footer')) slot.appendChild(footer()); }
    else if (about) { if (!about.querySelector('button')) about.appendChild(aboutButton()); }
    else if (!document.querySelector('body > .ef-footer')) document.body.appendChild(footer());
  }

  // ---- 基本編・発展編のタブ(メニュー用) ----
  var LEVEL_KEYS = ['basic', 'advanced'];
  function levels(box, opts) {
    var L = info.levels;
    if (!box || !L) return null;
    opts = opts || {};
    var store = 'eduit.level.' + (info.domain || 'x');
    var cur = 'basic';
    try { if (LEVEL_KEYS.indexOf(localStorage.getItem(store)) >= 0) cur = localStorage.getItem(store); } catch (e) {}
    var uid = 'ef-lv-' + (info.domain || 'x');
    var tabs = el('div', { class: 'ef-level-tabs', role: 'tablist', 'aria-label': '基本編と発展編' });
    var panel = el('div', { class: 'ef-level-panel', role: 'tabpanel', id: uid + '-panel', tabindex: '-1' });
    var tabEls = LEVEL_KEYS.map(function (k, i) {
      var lv = L[k] || { items: [] };
      var t = el('button', { type: 'button', role: 'tab', class: 'ef-level-tab ef-level-' + k, id: uid + '-' + k, 'aria-controls': uid + '-panel' }, [
        el('span', { class: 'ef-level-name', text: lv.title || (k === 'basic' ? '基本編' : '発展編') }),
        el('span', { class: 'ef-level-count', text: (lv.items || []).length + 'つ' })
      ]);
      t.addEventListener('click', function () { select(k, true); });
      t.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        var n = LEVEL_KEYS[(i + 1) % LEVEL_KEYS.length];
        select(n, true); tabEls[LEVEL_KEYS.indexOf(n)].focus();
      });
      tabs.appendChild(t);
      return t;
    });
    function partsEl(item) {
      if (!item.parts || !item.parts.length) return null;
      return el('p', { class: 'ef-level-parts' }, [el('span', { class: 'ef-level-parts-k', text: '使うところ' }), item.parts.join('・')]);
    }
    function render() {
      var lv = L[cur] || { items: [] };
      tabEls.forEach(function (t, i) { var on = LEVEL_KEYS[i] === cur; t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = on ? 0 : -1; });
      panel.setAttribute('aria-labelledby', uid + '-' + cur);
      var grid = el('div', { class: 'ef-level-grid ' + (opts.gridClass || '') });
      (lv.items || []).forEach(function (item) {
        var c = opts.card ? opts.card(item, partsEl(item), cur) : null;
        if (c) grid.appendChild(c);
      });
      while (panel.firstChild) panel.removeChild(panel.firstChild);
      if (lv.lead) panel.appendChild(el('p', { class: 'ef-level-lead', text: lv.lead }));
      if (opts.code && cur === 'basic') {
        var codes = (lv.items || []).map(opts.code).filter(Boolean);
        if (codes.length) panel.appendChild(el('p', { class: 'ef-level-order' }, [el('span', { class: 'ef-level-parts-k', text: 'おすすめの順番' }), codes.join(' → ')]));
      }
      panel.appendChild(grid);
      if (opts.onRender) opts.onRender(panel, cur);
    }
    function select(k, byUser) {
      if (LEVEL_KEYS.indexOf(k) < 0) return;
      cur = k;
      if (byUser) try { localStorage.setItem(store, k); } catch (e) {}
      render();
    }
    while (box.firstChild) box.removeChild(box.firstChild);
    box.classList.add('ef-levels');
    box.appendChild(tabs);
    box.appendChild(panel);
    render();
    return { render: render, select: select, current: function () { return cur; } };
  }

  // ---- 記号の印・メニューの上のバーの名前・メニューのカード(4分野共通の形) ----
  function code(c) { return el('span', { class: 'ef-code', text: c }); }
  function menuTitle(h) {
    if (!h) return h;
    while (h.firstChild) h.removeChild(h.firstChild);
    h.classList.add('ef-title');
    if (info.domain) h.appendChild(code(info.domain));
    h.appendChild(el('span', { class: 'ef-title-name', text: (info.domainName || '') + ' 教材集' }));
    return h;
  }
  function card(o) {
    o = o || {};
    var go = o.href
      ? el('a', { class: 'ef-btn-primary ef-mcard-go', href: o.href, text: 'ひらく ▶' })
      : el('button', { type: 'button', class: 'ef-btn-primary ef-mcard-go', text: 'ひらく ▶' });
    if (o.openAttrs) for (var k in o.openAttrs) go.setAttribute(k, o.openAttrs[k]);
    if (o.title) go.setAttribute('aria-label', (o.code ? o.code + ' ' : '') + o.title + ' をひらく');
    if (o.onOpen) go.addEventListener('click', function (e) { o.onOpen(e); });
    var extra = (o.extra || []).filter(Boolean);
    var c = el('article', { class: 'ef-card ef-mcard' }, [
      el('div', { class: 'ef-mcard-hd' }, [
        o.icon ? el('span', { class: 'ef-mcard-ic', 'aria-hidden': 'true', text: o.icon }) : null,
        el('div', { class: 'ef-mcard-ht' }, [
          o.code ? el('p', { class: 'ef-card-tag' }, [code(o.code)]) : null,
          el('h3', { class: 'ef-card-title', text: o.title || '' })
        ])
      ]),
      o.desc ? el('p', { class: 'ef-mcard-desc', text: o.desc }) : null,
      o.parts || null,
      extra.length ? el('div', { class: 'ef-mcard-extra' }, extra) : null,
      go
    ]);
    if (o.code) c.setAttribute('data-code', o.code);
    // カードのどこを押しても開く(カードの中のほかのボタン・リンク・入力は、そのまま)
    c.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('a, button, input, select, textarea, label, summary')) return;
      go.click();
    });
    return c;
  }

  window.EduitFrame = { AUTHOR: AUTHOR, furikaeri: furikaeri, open: open, footer: footer, aboutButton: aboutButton, mount: mount, levels: levels, card: card, code: code, menuTitle: menuTitle };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();

</script>

"use strict";
// ---- js/ui.js ----
const __m_js_ui_js = (() => {

// 共通UI部品（要素ビルダー、トースト、ファイルの書き出し・読み込み）

// 小さな要素ビルダー: h("div", { class: "card" }, "text", child)
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(el.dataset, v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

let toastTimer;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) {
    t = h("div", { class: "toast", role: "status" });
    document.body.append(t);
  }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
}

// 端末内でファイルを作ってダウンロードさせる（送信はしない）
function downloadFile(filename, text, type = "application/json") {
  const blob = new Blob([text], { type: type + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ファイルを選ばせて、文字として読む
function pickFile(accept) {
  return new Promise((resolve) => {
    const input = h("input", { type: "file", accept, class: "visually-hidden" });
    input.addEventListener("change", async () => {
      const f = input.files[0];
      input.remove();
      if (!f) return resolve(null);
      if (f.size > 3 * 1024 * 1024) return resolve({ error: "ファイルが大きすぎます（3MBまで）。" });
      resolve({ name: f.name, text: await f.text() });
    });
    document.body.append(input);
    input.click();
  });
}

function safeFileName(s) {
  return String(s).replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 40) || "作品";
}

return { h, toast, downloadFile, pickFile, safeFileName };
})();

const __m_js_lang_js = (() => {

// 簡易言語「スタジオ・スクリプト」（JavaScript風）の字句解析と構文解析。

const FORMAT = "interactive-studio-work";

  const { id, ...rest } = w;

// JSON（このアプリで書き出したもの）か、HTML（作品を書き出したページ）から作品を取り出す
function workFromFile(text) {
  let data = null;
  const m = /<script type="application\/json" id="studio-work">([\s\S]*?)<\/script>/.exec(text);
  try {

const __m_js_bundle_js = (() => {

// モジュールを1つのスクリプトにまとめる（Node の build と、ブラウザの「HTMLで書き出す」の両方で使う）
const ORDER = ["js/ui.js", "js/lang.js", "js/interp.js", "js/runner.js", "js/blockmodel.js", "js/server.js", "js/store.js", "js/samples.js", "js/bundle.js", "js/stage.js", "js/blocks.js", "js/app.js"];

const varName = (p) => "__m_" + p.replace(/[^a-z0-9]/gi, "_");
const joinPath = (base, spec) => {
  const parts = base.split("/").slice(0, -1);
  for (const seg of spec.split("/")) {
    if (seg === "." || seg === "") continue;
    if (seg === "..") parts.pop();
    else parts.push(seg);
  }
  return parts.join("/");
};

// sources: { "js/app.js": "…" }
function bundleSources(sources) {
  const chunks = ORDER.map((file) => {
    let src = sources[file];
    if (typeof src !== "string") throw new Error(`${file} がありません`);
    const imports = [];
    src = src.replace(/^import\s*\{([^}]+)\}\s*from\s*"([^"]+)";?\s*$/gm, (_, names, spec) => {
      const target = joinPath(file, spec);
      if (!ORDER.includes(target)) throw new Error(`${file}: 未知の import ${spec}`);
      if (ORDER.indexOf(target) > ORDER.indexOf(file)) throw new Error(`${file}: ${target} より前に並べてください`);
      imports.push(`const {${names.replace(/\bas\b/g, ":")}} = ${varName(target)};`);
      return "";
    });
    if (/^\s*import\s/m.test(src)) throw new Error(`${file}: 対応していない import の書き方があります`);
    const exported = [];
    src = src.replace(/^export\s+(async\s+function|function\*?|const|let|class)\s+([A-Za-z_$][\w$]*)/gm, (_, kind, name) => {
      exported.push(name);
      return `${kind} ${name}`;
    });
    if (/^export\s/m.test(src)) throw new Error(`${file}: 対応していない export の書き方があります`);
    return `// ---- ${file} ----\nconst ${varName(file)} = (() => {\n${imports.join("\n")}\n${src}\nreturn { ${exported.join(", ")} };\n})();`;
  });
  return safeScript(`"use strict";\n${chunks.join("\n\n")}`);
}

// <\/script> が中に出てこないようにする
function safeScript(s) {
  return s.replace(/<\/(script)/gi, "<\\/$1").replace(/<\!--/g, "<\\!--");
}

const STRICT_CSP = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'";

return { ORDER, bundleSources, safeScript, STRICT_CSP };
})();

  addscore: { cat: "server", parts: ["サーバーの箱", { f: "coll", key: "coll" }, "に", E("player", "expr"), "さんの得点", E("score", "num"), "を登録する"] },
  comment: { cat: "other", parts: ["メモ:", { f: "text", key: "text" }] },
  code: { cat: "other", parts: ["コード:", { f: "code", key: "code" }] },
};

// パレット（中身はコードの切れはし。入れるときにブロックに変換する）

  { cat: "var", label: "変数を増やす", code: "score += 1;" },

  { cat: "ui", label: "＋ ボタンを置く", part: "button" },
  { cat: "ui", label: "＋ ラベルを置く", part: "label" },
  { cat: "ui", label: "＋ 入力ボックスを置く", part: "input" },

function detectMode(src, slot) {
  if (slot !== "text" && slot !== "expr") return "expr";
  if (String(src).trim() === "") return slot === "text" ? "text" : "expr";
  try {
    return parseExpr(src).type === "str" ? "text" : "expr";
  } catch {
    return "expr";
  }
}

function exprError(src) {
  if (String(src).trim() === "") return "値を入れましょう";
  try {
    parseExpr(src);
    return "";
  } catch (e) {
    return e.message;
  }
}

function codeError(src) {
  try {
    const p = parse(src);
    if (p.body.length !== 1) return "1つの文にしましょう";
    return "";
  } catch (e) {
    return e.message;
  }
}

// 「文字」の欄に、" や変数が打たれている（式にしたいのかもしれない）
function wantsExpr(value, known) {
  if (value.includes('"')) return true;
  try {
    const e = parseExpr(value);
    return e.type !== "str" && exprVarNames(value).some((n) => known.has(n));
  } catch {
    return false;
  }
}

// 「文字」から「式」に切りかえるとき、打った中身をそのまま式として使うか
function rawAsExpr(value, known) {
  if (!value.trim()) return false;
  if (value.includes('"')) return true;
  try {
    const e = parseExpr(value);
    if (e.type !== "var") return true;
    return known.has(e.name) || /^[A-Za-z_$][\w$]*$/.test(e.name);
  } catch {
    return false;
  }
}

const sizeTo = (input) => {
  const n = [...input.value].reduce((s, c) => s + (c.charCodeAt(0) > 255 ? 2 : 1), 0);
  input.size = Math.max(2, Math.min(48, n + 1));
};

const clone = (b) => JSON.parse(JSON.stringify(b));

// タブレットで、名前が大文字になったり、勝手に直されたりしないように（IS-11）
const NO_AUTO = { autocapitalize: "off", autocorrect: "off", spellcheck: "false" };
const SLOT_LABEL = { text: "文字", expr: "値", cond: "条件", condtext: "条件", num: "数", val: "くらべるもの" };
const OP_LABEL = { "==": "==（同じ）", "!=": "!=（ちがう）", ">": ">（より大きい）", "<": "<（より小さい）", ">=": ">=（以上）", "<=": "<=（以下）" };
// 「もし」などの中にいるとき、外に出る位置の名前（IS-04）
const EXIT_LABEL = { if: "「もし」", ifelse: "「もし」", repeat: "「くり返し」", while: "「くり返し」", when: "「ボタンが押されたとき」" };
const PART_TYPE_NAME = { label: "ラベル", input: "入力ボックス", button: "ボタン" };

class BlockEditor {
  // onChange(structural): ブロックが変わった。getParts(): 画面の部品。readOnly: デバッグ用の表示だけ
  // getVars(): いまのプログラムの変数の名前。onAddPart(type, id): 画面に部品を置いて、その名前を返す
  constructor({ onChange = () => {}, getParts = () => [], getVars = () => [], readOnly = false, varListId = "" } = {}) {
    this.onChange = onChange;
    this.getParts = getParts;
    this.getVars = getVars;
    this.readOnly = readOnly;
    this.varListId = varListId;
    this.blocks = [];
    this.cursor = null; // 最初は、いちばん下（最後のブロックの後ろ）にする（IS-04）
    this.lists = new Map();
    this.el = h("div", { class: "workspace" + (readOnly ? " readonly" : ""), role: "tree", "aria-label": "ブロック" });
  }

  load(blocks) {
    this.blocks = blocks;
    if (!this.cursor || !this.cursorValid()) this.cursor = { path: "r", index: blocks.length };
    this.render();
  }

  cursorValid() {
    if (!this.cursor) return false;
    const list = this.listAt(this.cursor.path);
    return list && this.cursor.index <= list.length;
  }

  // パス "r:2.b:0.e"（いちばん外側の2番目のブロックの中 → その0番目の「でなければ」側）→ リスト
  listAt(path) {
    let list = this.blocks;
    const segs = path.split(":");
    if (segs[0] !== "r") return null;
    for (let k = 1; k < segs.length; k++) {
      const [idx, which] = segs[k].split(".");
      const b = list[Number(idx)];
      if (!b) return null;
      list = which === "e" ? b.else : b.body;
      if (!list) return null;
    }
    return list;
  }

  // リストの場所（パス）を、いまのブロックの並びから探す（動かしたあとで位置を合わせるのに使う）
  pathOf(target) {
    const find = (list, path) => {
      if (list === target) return path;
      for (let i = 0; i < list.length; i++) {
        const b = list[i];
        for (const [which, sub] of [["b", b.body], ["e", b.else]]) {
          if (!sub) continue;
          const hit = find(sub, `${path}:${i}.${which}`);
          if (hit) return hit;
        }
      }
      return null;
    };
    return find(this.blocks, "r");
  }

  render() {
    this.lists.clear();
    const scrollY = window.scrollY;
    this.el.replaceChildren();
    this.renderList(this.blocks, "r", this.el);
    if (!this.blocks.length && this.readOnly) this.el.append(h("p", { class: "hint" }, "ブロックがありません"));
    window.scrollTo({ top: scrollY });
  }

  renderList(list, path, container) {
    this.lists.set(path, list);
    if (!this.readOnly) container.append(this.gap(path, 0, list.length === 0));
    list.forEach((b, i) => {
      container.append(this.renderBlock(b, path, i));
      if (this.readOnly) return;
      // 位置が、このブロックのすぐ中にあるときは、すぐ下のすき間に「外に入れる」を出す
      const c = this.cursor;
      const inside = c && (c.path === `${path}:${i}.b` || c.path === `${path}:${i}.e`);
      container.append(this.gap(path, i + 1, false, inside ? EXIT_LABEL[b.kind] || "ブロック" : ""));
    });
  }

  // ブロックとブロックのすき間。押すと「▶ ここに追加されます」がそこに動く
  gap(path, index, empty, exit = "") {
    const sel = Boolean(this.cursor) && this.cursor.path === path && this.cursor.index === index;
    const kind = sel ? " cursor" : empty ? " empty" : exit ? " exit" : "";
    const g = h(
      "button",
      {
        type: "button",
        class: "gap" + kind,
        "aria-label": sel ? "追加する位置（選択中）" : exit ? `${exit}の外（この下）に追加する位置を選ぶ` : "ここに追加する位置を選ぶ",
        "aria-pressed": sel ? "true" : "false",
      },
      sel ? "▶ ここに追加されます" : empty ? "（ここにブロックを入れる）" : exit ? `＋ ${exit}の外（この下）に入れる` : h("span", { class: "gap-plus", "aria-hidden": "true" }, "＋"),
    );
    g._path = path;
    g._index = index;
    g.addEventListener("click", () => {
      this.cursor = { path, index };
      this.render();
      this.el.querySelector(".gap.cursor")?.focus();
    });
    return g;
  }

  renderBlock(b, path, i) {
    const spec = SPECS[b.kind] || SPECS.code;
    const bpath = `${path}:${i}`;
    const head = h("div", { class: "block-head", dataset: { line: b.line || "" } });
    const el = h("div", { class: `block cat-${spec.cat}`, role: "treeitem" }, head);
    el._path = bpath;
    if (!this.readOnly) {
      const handle = h("span", { class: "handle", title: "ドラッグして動かす", "aria-hidden": "true" }, "⠿");
      handle.addEventListener("pointerdown", (e) => this.startDrag(e, el, path, i));
      head.append(handle);
    }
    for (const part of spec.parts) {
      if (typeof part === "string") head.append(h("span", { class: "word" }, part));
      else head.append(this.field(b, part));
    }
    if (!this.readOnly) head.append(this.tools(path, i));
    if (spec.body) {
      b.body ||= [];
      const body = h("div", { class: "block-body" });
      this.renderList(b.body, `${bpath}.b`, body);
      el.append(body);
    }
    if (spec.else) {
      b.else ||= [];
      el.append(h("div", { class: "block-mid" }, h("span", { class: "word" }, "でなければ")));
      const body = h("div", { class: "block-body" });
      this.renderList(b.else, `${bpath}.e`, body);
      el.append(body);
    }
    if (spec.body) el.append(h("div", { class: "block-foot" }));
    return el;
  }

  tools(path, i) {
    const list = this.lists.get(path);
    const btn = (label, aria, fn, disabled) => h("button", { type: "button", class: "tool", "aria-label": aria, title: aria, disabled: disabled || null, onclick: fn }, label);
    return h(
      "span",
      { class: "tools" },
      btn("↑", "上へ", () => this.move(path, i, path, i - 1), i === 0),
      btn("↓", "下へ", () => this.move(path, i, path, i + 2), i === list.length - 1),
      btn("⧉", "複製", () => {
        list.splice(i + 1, 0, clone(list[i]));
        // 位置は、できたブロックの下へ（IS-04）
        this.cursor = { path: this.pathOf(list) || path, index: i + 2 };
        this.changed(true);
      }),
      btn("✕", "削除", () => {
        const curList = this.cursor && this.listAt(this.cursor.path);
        const idx = this.cursor ? this.cursor.index : 0;
        list.splice(i, 1);
        const p = curList && this.pathOf(curList);
        if (p) this.cursor = { path: p, index: curList === list && idx > i ? idx - 1 : idx };
        else this.cursor = { path: this.pathOf(list) || "r", index: i }; // 消したブロックの中にあったときは、消した場所へ
        this.changed(true);
      }),
    );
  }

  changed(structural) {
    this.onChange(structural);
  }

  field(b, part) {
    const f = (b.f ||= {});
    const ro = this.readOnly;
    switch (part.f) {
      case "expr":
        return this.slot(f, part.key, part.slot);
      case "name": {
        const input = h("input", { type: "text", class: "fld name", value: f[part.key] || "", "aria-label": "変数の名前", list: this.varListId || null, disabled: ro || null, ...NO_AUTO });
        const check = () => {
          const ok = isIdentifier(input.value);
          input.classList.toggle("invalid", !ok);
          input.title = ok ? "" : "変数の名前は文字で始め、スペースや記号を入れません（例: score, 点数）";
        };
        input.addEventListener("input", () => {
          f[part.key] = input.value.trim();
          sizeTo(input);
          check();
          this.changed(false);
        });
        sizeTo(input);
        check();
        return input;
      }
      case "part": {
        const parts = this.getParts().filter((p) => !part.type || p.type === part.type);
        const sel = h("select", { class: "fld part", "aria-label": part.type === "button" ? "ボタン" : "部品", disabled: ro || null });
        const ids = parts.map((p) => p.id);
        for (const p of parts) sel.append(h("option", { value: p.id }, `${p.id}（${{ label: "ラベル", input: "入力", button: "ボタン" }[p.type]}）`));
        if (f[part.key] && !ids.includes(f[part.key])) sel.append(h("option", { value: f[part.key] }, `${f[part.key]}（画面にない）`));
        if (!sel.options.length) sel.append(h("option", { value: "" }, "部品がありません"));
        sel.value = f[part.key] || "";
        sel.classList.toggle("invalid", !ids.includes(f[part.key]));
        sel.title = ids.includes(f[part.key]) ? "" : "「＋ 画面に置く」か、実行タブの「部品の配置」で部品を置こう";
        sel.addEventListener("change", () => {
          f[part.key] = sel.value;
          this.changed(true);
        });
        if (ro || ids.includes(f[part.key]) || !this.onAddPart) return sel;
        // 画面にない部品は、ここからすぐ置ける（IS-07）
        const want = f[part.key] || "";
        const type = part.type || (/^input/i.test(want) ? "input" : /^button/i.test(want) ? "button" : "label");
        const add = h(
          "button",
          {
            type: "button",
            class: "tool add-part",
            title: `実行画面に${PART_TYPE_NAME[type]}を置きます`,
            onclick: () => {
              const id = this.onAddPart(type, want);
              if (!id) return;
              if (f[part.key] !== id) {
                f[part.key] = id;
                this.changed(true);
              } else this.render();
            },
          },
          `＋ 画面に置く`,
        );
        return h("span", { class: "part-pick" }, sel, add);
      }
      case "coll": {
        // 箱の名前: "朝ごはん" のような文字でも、box のような変数でもよい（IS-08）
        return this.slot(f, part.key, "text");
      }
      case "op": {
        const sel = h("select", { class: "fld", "aria-label": "増やすか減らすか", disabled: ro || null }, h("option", { value: "+=" }, "増やす"), h("option", { value: "-=" }, "減らす"));
        sel.value = f.op === "-=" ? "-=" : "+=";
        sel.addEventListener("change", () => {
          f.op = sel.value;
          this.changed(false);
        });
        return sel;
      }
      case "options": {
        const opts = (f.options ||= ['"A"']);
        const wrap = h("span", { class: "options" });
        opts.forEach((_, k) => {
          wrap.append(this.slot(opts, k, "text"));
          if (!ro && opts.length > 1)
            wrap.append(h("button", { type: "button", class: "tool mini", "aria-label": `選択肢${k + 1}を消す`, title: "この選択肢を消す", onclick: () => (opts.splice(k, 1), this.changed(true)) }, "−"));
        });
        if (!ro && opts.length < 12) wrap.append(h("button", { type: "button", class: "tool mini", "aria-label": "選択肢を増やす", title: "選択肢を増やす", onclick: () => (opts.push(strLit(`選択肢${opts.length + 1}`)), this.changed(true)) }, "＋"));
        return wrap;
      }
      case "text": {
        const input = h("input", { type: "text", class: "fld wide", value: f[part.key] || "", "aria-label": "メモ", disabled: ro || null, autocapitalize: "off", autocorrect: "off" });
        input.addEventListener("input", () => {
          f[part.key] = input.value;
          this.changed(false);
        });
        return input;
      }
      case "code": {
        const input = h("input", { type: "text", class: "fld wide mono", value: f[part.key] || "", "aria-label": "コード", disabled: ro || null, ...NO_AUTO });
        const check = () => {
          const msg = codeError(input.value);
          input.classList.toggle("invalid", Boolean(msg));
          input.title = msg;
        };
        input.addEventListener("input", () => {
          f[part.key] = input.value;
          check();
          this.changed(false);
        });
        check();
        return input;
      }
    }
    return h("span");
  }

  // 値を入れる欄。「文字」モードでは " を自動で付ける。「式」モードでは計算や変数を書ける
  // onSet: 値が変わったとき（条件の3つの欄を、1つの条件にまとめるのに使う）
  slot(obj, key, slot, onSet) {
    const ro = this.readOnly;
    if (slot === "cond" && !ro) return this.condSlot(obj, key);
    let mode = detectMode(obj[key] ?? "", slot);
    let tg = null; // 「文字／式」の切りかえボタン（切りかえられる欄だけ）
    const wrap = h("span", { class: `slot slot-${mode}` });
    const input = h("input", {
      type: "text",
      class: "fld" + (slot === "cond" || slot === "condtext" ? " cond" : ""),
      "aria-label": SLOT_LABEL[slot] || "値",
      list: slot === "val" && this.varListId ? this.varListId : null,
      disabled: ro || null,
      ...NO_AUTO,
    });
    // マウスを乗せなくても見える注意（タブレットでも読めるように）
    const note = h("span", { class: "slot-note", hidden: true, "aria-live": "polite" });
    const set = (v) => {
      obj[key] = v;
      onSet?.();
      this.changed(false);
    };
    const fill = () => {
      const src = obj[key] ?? "";
      if (mode === "text") {
        try {
          const e = parseExpr(src);
          input.value = e.type === "str" ? e.v : src;
        } catch {
          input.value = src;
        }
      } else input.value = src;
      sizeTo(input);
    };
    const known = () => new Set(this.getVars());
    const updateNote = () => {
      if (ro) return;
      let text = "";
      let action = null;
      if (mode === "text") {
        if (wantsExpr(input.value, known())) {
          text = "変数や \" \"、+ を使うときは「式」にしよう。";
          action = h("button", { type: "button", class: "tool note-btn", onclick: () => toggle() }, "式に切りかえる");
        }
      } else {
        const k = known();
        const jp = exprVarNames(obj[key] ?? "").find((n) => hasJapanese(n) && !k.has(n));
        if (jp) {
          text = `「${jp}」は変数の名前として読まれます。文字として使うときは "${jp}" のように " " でかこもう。`;
          // 「文字／式」を切りかえられる欄なら、すぐ「文字」にできる
          if (tg) action = h("button", { type: "button", class: "tool note-btn", onclick: () => toggle() }, "文字にする");
        }
      }
      note.hidden = !text;
      note.replaceChildren(...(text ? [text, action] : []).filter(Boolean));
    };
    const check = () => {
      const msg = mode === "text" ? "" : exprError(obj[key] ?? "");
      input.classList.toggle("invalid", Boolean(msg));
      input.title = msg;
      updateNote();
    };
    fill();
    check();
    input.addEventListener("input", () => {
      sizeTo(input);
      set(mode === "text" ? strLit(input.value) : input.value);
      check();
    });
    wrap.append(input);
    const toggle = () => {
      if (mode === "text") {
        mode = "expr";
        // 「文字」で打った "得点は" + score を、\ を付けずにそのまま「式」へ移す（IS-05）
        if (rawAsExpr(input.value, known())) set(input.value);
      } else {
        mode = "text";
        if (detectMode(obj[key] ?? "", "text") !== "text") set(strLit(input.value));
      }
      wrap.className = `slot slot-${mode}`;
      tg.textContent = mode === "text" ? "文字" : "式";
      tg.setAttribute("aria-label", `入力のしかた: ${tg.textContent}（押すと切りかえ）`);
      fill();
      check();
      input.focus();
    };
    if (slot === "text" || slot === "expr") {
      tg = h("button", { type: "button", class: "mode", disabled: ro || null, title: "押すと「文字」と「式（計算・変数）」を切りかえ", "aria-label": `入力のしかた: ${mode === "text" ? "文字" : "式"}（押すと切りかえ）` }, mode === "text" ? "文字" : "式");
      tg.addEventListener("click", toggle);
      wrap.append(tg);
    }
    updateNote(); // 切りかえボタンができてから、もう一度
    return ro ? wrap : h("span", { class: "slot-outer" }, wrap, note);
  }

// 見本（または空の作品）から作品を作る
function createFromSample(s) {
  flushSaves();
  stopRun();
  resetUndo();
  // いまの作品が見本のままで、企画・改善メモだけ書いてあれば、新しい作品に移すか聞く（IS-09）
  const memoKeys = ["who", "problem", "idea", "test", "improve"];
  const prev = work;
  const moveMemo =
    prev &&
    isUntouchedSample(prev) &&
    memoKeys.some((k) => prev.plan[k]) &&
    confirm(`いまの「${prev.title}」に書いた企画・改善メモを、新しい作品に移しますか？\n（OK: 移す　キャンセル: 移さない）`);
  const plan = moveMemo ? Object.fromEntries(memoKeys.map((k) => [k, prev.plan[k]])) : {};
  if (moveMemo) works.update(prev.id, { plan: { ...prev.plan, ...Object.fromEntries(memoKeys.map((k) => [k, ""])) } });
  work = works.add({ title: s.title, code: s.code, ui: s.ui, plan });
  toast(moveMemo ? `「${s.title}」を作り、メモを移しました` : `「${s.title}」を作りました`);
  location.hash = "#/editor";
}

function sampleCard(s, choice) {
  const openOld = (old) => {
    stopRun();
    resetUndo();
    works.setCurrent(old.id);
    toast(`前の「${old.title}」を開きました`);
    location.hash = "#/editor";
  };
  return h(
    "button",
    {
      type: "button",
      class: "module-card sample",
      onclick: () => {
        // 同じ見本がもう一覧にあれば、前のを開くか、もう1つ作るかを選ぶ（見本が何個も増えないように。IS-09）
        const old = s.key === "blank" ? null : works.all().find((w) => w.title === s.title);
        if (!old || !choice) return createFromSample(s);
        choice.hidden = false;
        choice.replaceChildren(
          h("p", {}, `「${s.title}」は、作品の一覧にもうあります。`),
          h(
            "div",
            { class: "btn-row" },
            h("button", { type: "button", class: "btn small", onclick: () => openOld(old) }, "前のを開く"),
            h("button", { type: "button", class: "btn small secondary", onclick: () => createFromSample(s) }, "もう1つ作る"),
            h("button", { type: "button", class: "btn small secondary", onclick: () => ((choice.hidden = true), choice.replaceChildren()) }, "やめる"),
          ),
        );
        choice.scrollIntoView({ block: "nearest" });
        choice.querySelector("button")?.focus({ preventScroll: true });
      },
    },
    h("span", { class: "mc-title" }, s.key === "blank" ? "＋ 空の作品" : s.title),
    h("span", { class: "mc-desc" }, s.desc),
    s.tags?.length ? h("span", { class: "tags" }, s.tags.map((t) => h("span", { class: "tag" }, t))) : null,
  );
}

async function importWork() {

// ================= エディタ =================
// 元に戻す・やり直すの記録は、作品ごとに持つ（IS-02: 別の作品のコードに置きかわらないように）。
// 作品を開く・作る・読みこむときと、エディタの外でコードが変わったときは空にする。
const hist = { workId: null, code: null, undo: [], redo: [] };
function resetUndo() {
  hist.workId = null;
  hist.code = null;
  hist.undo.length = 0;
  hist.redo.length = 0;
}
function histFor(w) {
  if (hist.workId !== w.id || (hist.code !== null && hist.code !== w.code)) {
    resetUndo();
    hist.workId = w.id;
  }
  return hist;
}
function pushUndo(w, code) {
  const hh = histFor(w);
  hh.redo.length = 0;
  if (hh.undo[hh.undo.length - 1] !== code) hh.undo.push(code);
  if (hh.undo.length > 60) hh.undo.shift();
}

function varNames(code) {
  const names = new Set();
  for (const m of code.matchAll(/(?:^|[\s;{(])(?:let\s+)?([\p{L}_$][\p{L}\p{N}_$]*)\s*(?:=(?!=)|\+=|-=)/gmu)) names.add(m[1]);
  return [...names].filter((n) => !["if", "while", "repeat", "when", "let"].includes(n)).slice(0, 60);
}

function viewEditor() {
  const datalist = h("datalist", { id: "istudio-vars" });
  const refreshVars = () => datalist.replaceChildren(...varNames(work.code).map((n) => h("option", { value: n })));
  refreshVars();

  const banner = h("div", { class: "explain warn", role: "status", hidden: true });
  const showBanner = (msg) => {
    banner.hidden = !msg;
    banner.replaceChildren(h("span", { class: "explain-label" }, "コードに誤りがあります"), h("p", {}, msg || ""));
  };

  const editor = new BlockEditor({ getParts: () => work.ui, getVars: () => varNames(work.code), varListId: "istudio-vars" });
  editor.onMessage = toast;
  const partsNote = h("div", { class: "pal-note" });
  const syncPartsNote = () => (partsNote.textContent = `いまの部品: ${work.ui.length ? work.ui.map((q) => q.id).join("、") : "なし"}`);
  syncPartsNote();
  editor.onAddPart = (type, id) => {
    const nid = addPart(type, id);
    syncPartsNote();
    return nid;
  };

  // コードにまちがいがある間は、ブロックとパレットを使えないようにする（書いた行が消えないように。IS-13）
  const lockNote = h(
    "div",
    { class: "explain warn lock-note", role: "status", hidden: true },
    h("span", { class: "explain-label" }, "コードのまちがいを直してからブロックを使おう"),
    h("p", {}, prefs.editorMode === "both" ? "右のテキストコードを直すか、「↶ 元に戻す」を押そう。" : "表示を「両方」にしてテキストコードを直すか、「↶ 元に戻す」を押そう。"),
  );
  let locked = false;
  const setLock = (on) => {
    locked = on;
    lockNote.hidden = !on;
    editor.el.inert = on;
    editor.el.classList.toggle("locked", on);
    palette.classList.toggle("locked", on);
    palette.querySelectorAll("button").forEach((b) => (b.disabled = on));
  };

  // コード欄
  const gutter = h("div", { class: "gutter", "aria-hidden": "true" });
  const ta = h("textarea", { class: "code-input", spellcheck: "false", autocapitalize: "off", autocomplete: "off", "aria-label": "テキストコード", wrap: "off" });
  ta.value = work.code;
  const refreshGutter = () => {
    const n = ta.value.split("\n").length;
    gutter.textContent = Array.from({ length: n }, (_, i) => i + 1).join("\n");
    gutter.scrollTop = ta.scrollTop;
  };
  ta.addEventListener("scroll", () => (gutter.scrollTop = ta.scrollTop));

  const loadBlocks = () => {
    try {
      editor.load(codeToBlocks(work.code));
      showBanner("");
      if (locked) setLock(false);
      return true;
    } catch (e) {
      if (!(e instanceof LangError)) throw e;
      showBanner(`${e.line}行目: ${e.message}（ブロックは、コードを直すまで前のままです）`);
      if (!editor.blocks.length) editor.render();
      // まちがいが、文字で書いたコードにあるときだけ止める（ブロックの欄で作ったまちがいは、ブロックで直せる）
      setLock(blocksToCode(editor.blocks) !== work.code);
      return false;
    }
  };

  editor.onChange = (structural) => {
    if (structural) pushUndo(work, work.code);
    else histFor(work).redo.length = 0;
    const code = blocksToCode(editor.blocks);
    saveWork({ code });
    hist.code = work.code;
    syncHist();
    ta.value = code;
    refreshGutter();
    refreshVars();
    if (structural) loadBlocks();
    else {
      try {
        parse(code);
        showBanner("");
      } catch (e) {
        showBanner(`${e.line}行目: ${e.message}`);
      }
    }
  };

  let typing = null;
  let typingStart = null;
  const typingKey = {};
  // 書きかけのコードを保存する（0.35秒たったとき・元に戻す前・画面を移る前）
  const flushTyping = () => {
    clearTimeout(typing);
    pendingSaves.delete(typingKey);
    if (typingStart === null) return;
    const start = typingStart;
    typingStart = null;
    if (start !== ta.value) pushUndo(work, start);
    saveWork({ code: ta.value });
    hist.code = work.code;
    refreshVars();
    loadBlocks();
    syncHist();
  };
  ta.addEventListener("input", () => {
    if (typingStart === null) {
      histFor(work);
      typingStart = work.code;
    }
    refreshGutter();
    undoBtn.disabled = false;
    clearTimeout(typing);
    pendingSaves.set(typingKey, flushTyping);
    typing = setTimeout(flushTyping, 350);
  });
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Tab" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      ta.setRangeText("  ", ta.selectionStart, ta.selectionEnd, "end");
      ta.dispatchEvent(new Event("input"));
    }
  });

  const applyCode = (code) => {
    saveWork({ code });
    hist.code = work.code;
    ta.value = code;
    refreshGutter();
    refreshVars();
    loadBlocks();
    syncHist();
  };
  const undo = () => {
    flushTyping();
    const hh = histFor(work);
    const prev = hh.undo.pop();
    if (prev === undefined) return toast("これ以上は戻せません");
    hh.redo.push(work.code);
    applyCode(prev);
  };
  const redo = () => {
    flushTyping();
    const hh = histFor(work);
    const next = hh.redo.pop();
    if (next === undefined) return toast("これ以上はやり直せません");
    hh.undo.push(work.code);
    applyCode(next);
  };
  const undoBtn = h("button", { type: "button", class: "btn small secondary", onclick: undo }, "↶ 元に戻す");
  const redoBtn = h("button", { type: "button", class: "btn small secondary", onclick: redo }, "↷ やり直す");
  function syncHist() {
    const hh = histFor(work);
    undoBtn.disabled = !hh.undo.length;
    redoBtn.disabled = !hh.redo.length;
  }

  // パレット
  const placeholder = (code) =>
    code
      .replace("$button", work.ui.find((p) => p.type === "button")?.id || "button1")
      .replace("$input", work.ui.find((p) => p.type === "input")?.id || "input1")
      .replace("$part", work.ui.find((p) => p.type === "label")?.id || work.ui[0]?.id || "label1");
  const palette = h("nav", { class: "palette", "aria-label": "ブロックのパレット" });
  // 「＋ ボタンを置く」など: ブロックではなく、実行画面に部品を置く（IS-07）
  const placePart = (type) => {
    if (!addPart(type)) return;
    syncPartsNote();
    editor.render();
  };
  for (const [cat, label] of Object.entries(CATS)) {
    const items = PALETTE.filter((p) => p.cat === cat);
    palette.append(
      h(
        "div",
        { class: "pal-group" },
        h("div", { class: "pal-title" }, label),
        ...items.map((p) =>
          p.part
            ? h("button", { type: "button", class: `pal-item pal-part cat-${cat}`, onclick: () => placePart(p.part) }, p.label)
            : h("button", { type: "button", class: `pal-item cat-${cat}`, onclick: () => editor.insertCode(placeholder(p.code)) }, p.label),
        ),
        cat === "ui" ? partsNote : null,
      ),
    );
  }

  // 「ブロック＋実行」の表示: 作りながら、すぐ横で動かして確かめる（IS-07）
  const preview = prefs.editorMode === "run" ? editorPreview() : null;

  const modeBtn = (m, label) =>
    h(
      "button",
      {
        type: "button",
        class: "seg",
        "aria-pressed": prefs.editorMode === m ? "true" : "false",
        onclick: () => {
          prefs.editorMode = m;
          savePrefs();
          route();
        },
      },
      label,
    );

  const layout = h(
    "div",
    { class: `editor-grid mode-${prefs.editorMode}` },
    h("div", { class: "pane pane-palette" }, palette),
    h(
      "div",
      { class: "pane pane-blocks" },
      h("div", { class: "pane-title" }, "ブロック", h("span", { class: "hint" }, "ブロックとブロックのすき間を押すと、「▶ ここに追加されます」がそこに動きます。⠿ をドラッグで移動。")),
      lockNote,
      editor.el,
    ),
    h("div", { class: "pane pane-code" }, h("div", { class: "pane-title" }, "テキストコード", h("span", { class: "hint" }, "書きかえるとブロックにも反映")), h("div", { class: "code-wrap" }, gutter, ta)),
    preview ? h("div", { class: "pane pane-preview" }, preview.el) : null,
  );

  view.append(
    datalist,
    h(
      "div",
      { class: "toolbar" },
      h("h1", { class: "tb-title" }, "エディタ", h("span", { class: "hint" }, work.title)),
      h("div", { class: "segmented", role: "group", "aria-label": "表示" }, modeBtn("blocks", "ブロック"), modeBtn("both", "両方"), modeBtn("code", "コード"), modeBtn("run", "ブロック＋実行")),
      undoBtn,
      redoBtn,
      h("a", { class: "btn small", href: "#/run" }, "▶ 実行タブで動かす"),
    ),
    banner,
    layout,
  );
  refreshGutter();
  loadBlocks();
  syncHist();

  if (pendingLine) {
    // route() が最後に画面の先頭へもどすので、そのあとで行を選んで見える所までスクロールする（IS-12）
    const line = pendingLine;
    pendingLine = 0;
    setTimeout(() => {
      if (!ta.isConnected) return;
      editor.highlight(line, "error-line");
      const lines = ta.value.split("\n");
      const start = lines.slice(0, line - 1).reduce((s, l) => s + l.length + 1, 0);
      const block = editor.el.querySelector(".block-head.error-line");
      if (ta.offsetParent) {
        ta.focus({ preventScroll: true });
        ta.setSelectionRange(start, start + (lines[line - 1] || "").length);
        const lh = parseFloat(getComputedStyle(ta).lineHeight) || 20;
        ta.scrollTop = Math.max(0, (line - 3) * lh);
        refreshGutter();
      }
      (block || ta).scrollIntoView({ block: "center" });
    }, 0);
  }
}
