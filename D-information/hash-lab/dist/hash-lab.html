  <style id="eduit-frame-css">
/* Edu-IT 共通の枠(4分野・全アプリ共通)
 * 色・文字・ボタン・カード・ヘッダー・フッターの見た目をそろえるための部品。
 * 分野の色は <html data-ef-domain="A|B|C|D"> で切りかわる。
 * アプリ固有の見た目は各アプリの CSS に残し、ここでは「枠」だけを決める。
 */
:root {
  --ef-font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --ef-bg: #f5f4f0;          /* 画面の地 */
  --ef-surface: #ffffff;     /* カード・ヘッダー */
  --ef-surface-2: #f8f7f4;   /* 一段下げた面 */
  --ef-line: #d6d3cb;        /* 枠線 */
  --ef-text: #1f2328;
  --ef-muted: #565d68;
  --ef-focus: #f08c00;       /* キーボード操作の枠 */
  --ef-radius: 12px;
  --ef-radius-s: 8px;
  --ef-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .04);
  --ef-header-h: 52px;
  --ef-tap: 40px;            /* ボタンの最小の高さ */
  /* 分野の色(既定は D) */
  --ef-accent: #1a5fc8;
  --ef-accent-ink: #ffffff;
  --ef-accent-soft: #e6eefb;
}
:root[data-ef-domain="A"] { --ef-accent: #985a26; --ef-accent-soft: #f5e9dc; }  /* 材料と加工: 木の茶 */
:root[data-ef-domain="B"] { --ef-accent: #2e7d32; --ef-accent-soft: #e4f2e5; }  /* 生物育成: 緑 */
:root[data-ef-domain="C"] { --ef-accent: #b45309; --ef-accent-soft: #fbeedd; }  /* エネルギー変換: だいだい */
:root[data-ef-domain="D"] { --ef-accent: #1a5fc8; --ef-accent-soft: #e6eefb; }  /* 情報: 青 */

/* ---- ヘッダー ----
 * メニュー:   <header class="ef-header"> <h1 class="ef-title"><span class="ef-code">A</span> 材料と加工の技術 教材集</h1>
 *               <div class="ef-tools"> ふりがな / 文字の大きさ / (くっきり) / 使い方 / 先生用 </div> </header>
 * アプリ:     <header class="ef-header"> <a class="ef-btn ef-back" href="…">◀ メニュー</a>
 *               <h1 class="ef-title"><span class="ef-code">A2</span> アプリ名</h1>
 *               <div class="ef-tools"> ふりがな / 文字の大きさ / くっきり / 使い方 / そのアプリだけのボタン </div> </header>
 *   同じ分野の教材を切りかえるボタンにも記号を出す(<button class="ef-btn"><span class="ef-code">D2</span> CPU</button>)。
 */
.ef-header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  min-height: var(--ef-header-h); padding: 6px 14px;
  background: var(--ef-surface); color: var(--ef-text);
  border-bottom: 3px solid var(--ef-accent);
  font-family: var(--ef-font);
  box-sizing: border-box;
}
.ef-title {
  display: flex; align-items: center; gap: 8px;
  margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--ef-text);
}
.ef-title .ef-icon { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; font-size: 22px; }
.ef-title .ef-sub { font-size: 13px; font-weight: 400; color: var(--ef-muted); }
.ef-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }

/* ---- ボタン ----
 * .ef-btn          ふつうのボタン(白地・枠線・丸角)
 * .ef-btn.is-on    ON の状態(分野の色で塗る)。aria-pressed="true" でも同じ
 * .ef-btn-primary  いちばん大事な操作(はじめる・ひらく など)
 */
.ef-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--ef-tap); padding: 0 14px;
  border: 1px solid var(--ef-line); border-radius: 999px;
  background: var(--ef-surface); color: var(--ef-text);
  font: 600 15px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
  box-sizing: border-box; white-space: nowrap;
}
.ef-btn:hover { border-color: var(--ef-accent); }
.ef-btn.is-on, .ef-btn[aria-pressed="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-back { color: var(--ef-accent); border-color: transparent; background: var(--ef-accent-soft); }
.ef-btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 20px;
  border: 0; border-radius: var(--ef-radius-s);
  background: var(--ef-accent); color: var(--ef-accent-ink);
  font: 700 16px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
}
.ef-btn-primary:hover { filter: brightness(1.08); }
.ef-btn:focus-visible, .ef-btn-primary:focus-visible, .ef-about-link:focus-visible, .ef-dialog :focus-visible {
  outline: 3px solid var(--ef-focus); outline-offset: 2px;
}

/* ---- メニューのカード ----
 * <article class="ef-card"> <p class="ef-card-tag">A1</p> <h3 class="ef-card-title">…</h3> <p>…</p> <a class="ef-btn-primary">ひらく ▶</a> </article>
 * メニューのカードは EduitFrame.card() で作る(下の .ef-mcard)。
 */
.ef-page { background: var(--ef-bg); color: var(--ef-text); font-family: var(--ef-font); }
.ef-card {
  background: var(--ef-surface); border: 1px solid var(--ef-line); border-top: 4px solid var(--ef-accent);
  border-radius: var(--ef-radius); box-shadow: var(--ef-shadow); padding: 16px 18px;
}
.ef-card-tag { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ef-accent); }
.ef-card-title { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: var(--ef-text); }

/* ---- 記号の印(A1・B2・C3・D4 など。メニューの上のバー・アプリの上のバー・切りかえボタン・カード) ---- */
.ef-code {
  display: inline-flex; align-items: center; justify-content: center; min-width: 1.9em; padding: 0 .35em;
  border-radius: 6px; background: var(--ef-accent); color: var(--ef-accent-ink);
  font: 700 .9em/1.5 var(--ef-font); letter-spacing: .02em; white-space: nowrap; vertical-align: .05em;
}
.ef-title .ef-code { font-size: 15px; }
.ef-btn .ef-code { font-size: 13px; min-width: 0; margin-right: 2px; }
.ef-btn.is-on .ef-code, .ef-btn[aria-pressed="true"] .ef-code, .ef-btn[aria-current] .ef-code { background: var(--ef-accent-ink); color: var(--ef-accent); }

/* ---- メニューのカード(EduitFrame.card が作る。4分野同じ形) ---- */
.ef-mcard { display: flex; flex-direction: column; gap: 6px; min-height: 9rem; padding: 12px 16px 14px; cursor: pointer; font-family: var(--ef-font); color: var(--ef-text); transition: box-shadow .1s; }
.ef-mcard:hover { box-shadow: 0 2px 12px rgba(0, 0, 0, .14); }
.ef-mcard-hd { display: flex; align-items: center; gap: 10px; }
.ef-mcard-ic { flex: 0 0 auto; width: 1.4em; font-size: 2em; line-height: 1; text-align: center; }
.ef-mcard-ht { min-width: 0; }
.ef-mcard .ef-card-tag { margin: 0 0 2px; font-size: 14px; }
.ef-mcard .ef-card-title { margin: 0; font-size: 1.12em; line-height: 1.4; }
.ef-mcard-desc { margin: 0; font-size: .95em; line-height: 1.6; }
.ef-mcard-extra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: .88em; color: var(--ef-muted); }
.ef-mcard-go { margin-top: auto; align-self: flex-end; }
.ef-level-order { margin: -4px 0 12px; font-size: .95em; line-height: 1.6; }

/* ---- フッター(作成者・このアプリについて) ---- */
.ef-footer {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 14px;
  margin: 24px 0 0; padding: 12px 16px;
  border-top: 1px solid var(--ef-line); background: var(--ef-surface-2);
  font: 13px/1.6 var(--ef-font); color: var(--ef-muted);
}
.ef-footer .ef-author { font-weight: 700; color: var(--ef-text); }
.ef-about-link {
  border: 0; background: none; padding: 2px 4px; cursor: pointer;
  font: inherit; color: var(--ef-accent); text-decoration: underline;
}
/* ヘッダーなどに置く小さい「このアプリについて」ボタン */
.ef-about-btn { font-size: 14px; }

/* ---- このアプリについて(ダイアログ) ---- */
.ef-dialog {
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  padding: 0; border: 1px solid var(--ef-line); border-radius: var(--ef-radius);
  background: var(--ef-surface); color: var(--ef-text); font: 15px/1.7 var(--ef-font);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
}
.ef-dialog::backdrop { background: rgba(0, 0, 0, .4); }
.ef-dialog-in { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.ef-dialog-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 3px solid var(--ef-accent); }
.ef-dialog-head h2 { margin: 0; font-size: 18px; flex: 1; }
.ef-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px 0; }
.ef-tab { border: 1px solid var(--ef-line); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--ef-surface-2);
  padding: 6px 12px; font: 600 14px/1.3 var(--ef-font); color: var(--ef-text); cursor: pointer; min-height: 36px; }
.ef-tab[aria-selected="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-panel { padding: 14px 18px 18px; overflow: auto; border-top: 1px solid var(--ef-line); }
.ef-panel h3 { margin: 12px 0 4px; font-size: 16px; }
.ef-panel ul { margin: 4px 0 8px; padding-left: 1.3em; }
.ef-panel p { margin: 4px 0 8px; }
.ef-hist-ver { font-weight: 700; color: var(--ef-accent); }
.ef-hist-date { color: var(--ef-muted); font-size: 13px; margin-left: 6px; }

/* 文字を大きくした・くっきりのときも読めるように */
/* 基本編・発展編のタブ(メニュー。EduitFrame.levels が作る) */
.ef-levels { margin: 0 0 18px; font-family: var(--ef-font); }
.ef-level-tabs { display: flex; gap: 0; border-bottom: 3px solid var(--ef-accent); }
.ef-level-tab {
  display: inline-flex; align-items: baseline; gap: 8px; min-height: 48px; padding: 8px 22px; margin: 0 6px -3px 0;
  font: inherit; font-size: 1.15em; font-weight: 700 !important; color: var(--ef-muted) !important; cursor: pointer;
  background: var(--ef-surface-2); border: 1px solid var(--ef-line); border-bottom: 3px solid var(--ef-accent);
  border-radius: var(--ef-radius-s) var(--ef-radius-s) 0 0;
}
.ef-level-tab:hover { color: var(--ef-text) !important; }
/* 教材ごとのボタンの色指定(#hub button など)に負けないように !important にする */
.ef-level-tab[aria-selected="true"], .ef-level-tab[aria-selected="true"]:hover { color: var(--ef-accent-ink) !important; background: var(--ef-accent) !important; border-color: var(--ef-accent) !important; }
.ef-level-tab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }
.ef-level-count { font-size: .72em; font-weight: 400; }
.ef-level-panel { padding: 12px 0 0; }
.ef-level-panel:focus { outline: none; }
.ef-level-lead { margin: 0 0 12px; color: var(--ef-muted); line-height: 1.6; }
.ef-level-advanced[aria-selected="true"], .ef-level-advanced[aria-selected="true"]:hover { background: #5b3fa8 !important; border-color: #5b3fa8 !important; }
.ef-level-tabs:has(.ef-level-advanced[aria-selected="true"]) { border-bottom-color: #5b3fa8; }
.ef-level-parts { margin: .3em 0 0; font-size: .9em; line-height: 1.5; color: var(--ef-text); }
.ef-level-parts-k {
  display: inline-block; margin-right: .5em; padding: 0 .5em; font-size: .85em; font-weight: 700;
  color: var(--ef-accent); background: var(--ef-accent-soft); border-radius: 999px;
}

@media print { .ef-footer, .ef-dialog { display: none !important; } }

</style>
  <style>
/* ハッシュ化体験ラボ。色・文字・ボタンは共通の枠(shared/eduit-frame.css)の --ef-* を使う */
:root {
  --gl-ok: #1a7f4b;
  --gl-ok-soft: #e3f4ea;
  --gl-ng: #c0362c;
  --gl-ng-soft: #fde7e4;
  --gl-warn: #b45309;
  --gl-warn-soft: #fdf0dc;
  --gl-info-soft: #eef3fb;
  --gl-chip-0: #dce8fb;
  --gl-chip-1: #fbe3c8;
  --gl-chip-2: #dff1d8;
  --gl-chip-3: #f1dcf3;
  --gl-nav-w: 262px;
}
/* 画面の枠は、ほかの情報の教材(デジタル化ラボ・情報セキュリティ体験ラボ・ネットワーク通信シミュレータ)と同じ形にそろえる */
html { font-size: 17px; }
html.big-text { font-size: 20px; }
body { margin: 0; background: var(--ef-bg); color: var(--ef-text); font-family: var(--ef-font); line-height: 1.75; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
h1, h2, h3 { line-height: 1.4; margin: 0 0 .5em; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.1rem; }
a { color: var(--ef-accent); }
rt { font-size: .6em; font-weight: 400; }
button, input, select, textarea { font: inherit; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: absolute; left: -999px; top: 0; }
.skip-link:focus { left: 8px; z-index: 10; background: var(--ef-surface); padding: 6px 10px; }
.ef-title { text-decoration: none; }
.ef-btn, .ef-btn-primary { font-size: 1rem; }

/* 上のバー: 表示の切りかえ・進み具合 */
.app-header { position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
.display-toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.overall-progress { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--ef-muted); white-space: nowrap; }
.overall-progress .bar { width: 120px; height: 10px; }
.overall-progress .bar-fill { background: var(--gl-ok); }

/* レイアウト: 左に章のメニュー、右に本文 */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; gap: 24px; padding: 20px; }
.chapter-nav { position: sticky; top: 72px; align-self: start; min-width: 0; }
.chapter-nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.nav-link { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ef-text); font-size: .92rem; line-height: 1.45; }
.nav-link:hover { background: var(--ef-surface-2); }
.nav-link[aria-current="page"] { background: var(--ef-accent-soft); font-weight: 700; }
.chapter-nav .num { flex: none; width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: .8rem; border: 1.5px solid var(--ef-line); background: var(--ef-surface); }
.chapter-nav .done .num { background: var(--gl-ok); border-color: var(--gl-ok); color: #fff; }
.chapter-nav .nav-group { font-size: .8rem; color: var(--ef-muted); margin: 14px 10px 4px; letter-spacing: .05em; }
main { min-width: 0; }
#view { outline: none; }
.app-footer { text-align: center; font-size: .85rem; color: var(--ef-muted); padding: 24px 16px 40px; }
.app-note { margin: 0 0 8px; }

.module-head { margin-bottom: 18px; }
.module-head .meta { color: var(--ef-muted); font-size: .9rem; margin: 0 0 4px; }
.module-head p.meta:not(:first-child) { font-size: 1rem; }
.module-head .author { margin-top: 6px; }
.sec-title { margin: 0 0 6px; font-size: 1.6rem; line-height: 1.4; text-wrap: balance; }
.sec-body { display: grid; gap: 18px; }
.lead { margin: 0; font-size: 1rem; max-width: 50em; }
.muted { color: var(--ef-muted); font-size: .9rem; margin: 0; }
.small-title { margin: 8px 0 4px; font-weight: 700; font-size: .95rem; }

/* カード(ほかの教材の .card と同じ) */
.panel, .card { background: #fcfcfb; border: 1px solid var(--ef-line); border-radius: var(--ef-radius); padding: 20px 22px; display: grid; gap: 12px; min-width: 0; box-shadow: var(--ef-shadow); }
.sec-body > .card, .sec-body > section { margin: 0; }
.panel-title, .card > h2 { margin: 0; font-size: 1.3rem; }
.panel p, .card p { margin: 0; }
.card ol, .card ul { margin: 0; padding-left: 1.4em; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.row, .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; background: #fcfcfb; border: 1px solid var(--ef-line); border-radius: var(--ef-radius); padding: 14px 18px; box-shadow: var(--ef-shadow); }
.ctl { display: grid; gap: 4px; min-width: 0; max-width: 100%; }
select.input { width: 100%; text-overflow: ellipsis; }
.ctl-label { font-size: .875rem; font-weight: 700; color: var(--ef-muted); }
.input { border: 1.5px solid var(--ef-line); border-radius: 8px; padding: 8px 10px; background: var(--ef-surface); color: var(--ef-text); min-height: 44px; max-width: 100%; }
textarea.input { width: 100%; resize: vertical; }
input[type="text"].input { flex: 1 1 260px; }
.range { display: flex; align-items: center; gap: 10px; }
.range input { width: 180px; accent-color: var(--ef-accent); }
.range output { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 6.5em; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }

/* 本文のボタン: ほかの教材の .btn(青でぬる)と .btn.secondary(青のわく)と同じ見た目 */
#view .ef-btn, #view .ef-btn-primary { font: inherit; font-size: .95rem; font-weight: 700; border-radius: 10px; min-height: 44px; padding: 8px 16px; border: 1.5px solid var(--ef-accent); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; line-height: 1.45; }
#view .ef-btn { background: transparent; color: var(--ef-accent); }
#view .ef-btn-primary { background: var(--ef-accent); color: var(--ef-accent-ink); }

      { id: 'virtual-cpu', parts: ['① 図解: 5つの装置', '② 手計算くらべ'], curr: 'D(1)ア・イ', why: 'コンピュータの構成(5つの装置)と、自動で処理するよさは基本' },
      { id: 'network-sim', parts: ['① ネットワークを組み立てる', '② Webページが届くまで', '③ 回線が切れたら？', '④ のぞき見と暗号化'], curr: 'D(1)ア', why: '情報通信ネットワークのしくみ(パケット・サーバ・ルータ)と暗号化は基本' },
      { id: 'security-lab', parts: ['① デジタル化と情報量', '② パスワード強度ラボ', '③ 暗号ラボ', '④ フィッシング見分け', '⑤ ネットワーク通信の模擬', '⑥ SNS投稿の個人情報チェック', '⑦ デジタルタトゥー', '⑧ 著作権・利用ルールクイズ', '⑨ 判断ロールプレイ', '⑩ まとめ・行動宣言', '理解度チェック'], curr: 'D(1)ア・D(4)ア', why: '情報セキュリティ・情報モラル・知的財産は、どの教科書でも扱う基本' },
      { id: 'scam-lab', parts: ['① ワンクリック詐欺', '② 「当選しました」メール', '③ ウイルス付きメール', '④ にせのウイルス警告', '⑤ にせの通販サイト', '⑥ まとめとふりかえり'], curr: 'D(1)ア・D(4)ア', why: 'ネットの詐欺やウイルスから身を守る情報セキュリティ・情報モラルは基本' },
      { id: 'interactive-studio', parts: ['作品', 'エディタ', '実行', 'デバッグ', 'サーバーのデータ', 'ふりかえり・記録'], curr: 'D(2)ア・イ', why: 'ネットワークを利用した双方向性のあるコンテンツのプログラミングは、学習指導要領で必ず扱う内容' },
      { id: 'measure-control-sim', parts: ['① 街灯', '② 自動ドア', '③ 信号機', '④ 押しボタン式信号機'], curr: 'D(3)ア・イ', why: '計測・制御のプログラミング(センサ・順次・分岐・反復)は、学習指導要領で必ず扱う内容' },
      { id: 'genai-lab', parts: ['① もっともらしいまちがい', '② 個人情報が出てしまう？', '③ クイズとふりかえり'], curr: 'D(4)ア・イ', why: '生成AIのまちがい(ハルシネーション)や個人情報に気をつけて使うことは、新しい教科書でも扱う情報モラルの内容' }
    ]
  },
  advanced: {
    title: '発展編',
    lead: '基本編が終わった人や、もっとくわしく調べたい人のための内容です。教科書の「発展」「コラム」にあたる内容や、しくみの中まで入って調べる内容です。先生の指示があったら取り組みましょう。',
    items: [
      { id: 'digitization-lab', parts: ['⑤ 圧縮のしくみ'], curr: 'D(1)ア(発展)', why: '教科書では圧縮があることを知る程度で、しくみをためすのは発展' },
      { id: 'virtual-cpu', parts: ['③ 仮想CPUを動かす', '④ 課題'], curr: 'D(1)ア(発展)', why: 'レジスタや命令を1つずつ動かす機械語に近いプログラミングは、教科書の基本より先の内容' },
      { id: 'network-sim', parts: ['⑤ IPアドレス・ドリル'], curr: 'D(1)ア(発展)', why: '教科書では IP アドレスの名前と役割を知る程度で、くわしい練習は発展' },
      { id: 'security-lab', parts: ['⑪ ハッシュ体験'], curr: 'D(1)ア(発展)', why: 'ハッシュ関数は教科書の基本の内容には入っていない' },
      { id: 'measure-control-sim', parts: ['⑤ 自由に作る(仮想マイコン)'], curr: 'D(3)イ(発展)', why: 'センサと出力を自由に組み合わせる設計は、課題を広げる発展の活動' },
      { id: 'genai-lab', parts: ['④ つぎの言葉あて', '⑤ 言葉のかけら(トークン)', '⑥ ミニ文章AIを動かす', '⑦ ノイズをまぜる(学習)', '⑧ ノイズから絵をつくる'], curr: 'D(1)ア・D(4)イ(発展)', why: '生成AIが文章や画像を作るしくみの中身は、教科書のコラムより先の内容' },
      { id: 'hash-lab', parts: ['① ハッシュ値を作ってみよう', '② 1文字だけ変えると？', '③ 手作りハッシュの弱点', '④ もとにもどせる？', '⑤ パスワードの守り方', '⑥ 改ざんを見つける', '⑦ クイズとふりかえり'], curr: 'D(1)ア・D(4)ア(発展)', why: 'ハッシュ関数は教科書の基本の内容には入っていない。パスワードの保存や改ざんの見つけ方は情報セキュリティの発展' }
    ]
  }
};

</script>
  <script id="eduit-frame">
/* Edu-IT 共通の枠: 作成者・安全と個人情報・ライセンス・更新履歴
 * 使い方(classic script。file:// でも動く):
 *   <link rel="stylesheet" href="…/shared/eduit-frame.css">
 *   <script src="…/<分野>/eduit-info.js"><\/script>   … window.EDUIT_INFO を決める
 *   <script src="…/shared/eduit-frame.js"><\/script>
 * 置き場所(どれか):
 *   - <div data-ef-footer></div> があればそこにフッターを出す
 *   - <span data-ef-about></span> があればそこに「ⓘ このアプリについて」ボタンを出す(フッターは出さない)
 *   - どちらもなければ <body> の最後にフッターを足す
 *   - EDUIT_INFO.app.footer === false なら自動では何も出さない(EduitFrame.open() だけ使う)
 * EDUIT_INFO = {
 *   domain: 'A',                     分野(A/B/C/D)。色が切りかわる
 *   domainName: '材料と加工の技術',
 *   suite: '材料と加工 教材アプリ',     教材集の名前
 *   version: '2.1', updated: '2026-10-15',
 *   safety: ['この分野だけの安全の説明', …],   共通の説明のあとに足す
 *   history: [{ version: '2.1', date: '2026-10-15', items: ['…', …] }, …]   新しい順
 *   app: { name: 'M3 構造強化ラボ' }   アプリごとに上書き(EDUIT_INFO.app を各ページで決めてもよい)
 *   levels: { basic: {...}, advanced: {...} }   基本編・発展編の分け方(メニューが EduitFrame.levels で使う)
 * }
 *
 * メニューのカード(4分野共通の形): EduitFrame.card({ code: 'A1', icon: '🪵', title: '…', desc: '…', parts: 「使うところ」の要素,
 *   extra: [分野ごとの追加の要素…], href: 'ひらく先' か onOpen: function () {…}, openAttrs: { 'data-go': 'b1' } })
 *   → <article class="ef-card ef-mcard">。記号・アイコン・名前・説明・使うところ・追加の欄・「ひらく ▶」の順。カードのどこを押しても開く。
 * 記号の印: EduitFrame.code('A2') → <span class="ef-code">A2</span>(メニューの上のバー・アプリの上のバー・切りかえボタンで使う)
 * メニューの上のバーの名前: EduitFrame.menuTitle(h1) → h1 の中を「[A] 材料と加工の技術 教材集」にする
 *
 * 基本編・発展編(メニュー用): EduitFrame.levels(置き場所, { card: function (item, parts, levelKey) { return カードの要素; }, code: function (item) { return 'A1'; } })
 *   code を渡すと、基本編の上に「おすすめの順番: A1 → A2 → …」の1行を出す(カードの順 = 番号の順 = おすすめの順)。
 *   EDUIT_INFO.levels = {
 *     basic:    { title: '基本編', lead: '…', items: [{ id: 'M1', parts: ['材料カード', …], curr: 'A(1)ア', why: '…' }, …] },
 *     advanced: { title: '発展編', lead: '…', items: [ … ] }
 *   }
 *   id はメニューごとのアプリの id。parts は生徒の画面に出るタブ・ページの名前(「使うところ」に出す)。
 *   curr(学習指導要領の項目)と why(分けた理由)は先生用の一覧だけに出し、生徒のカードには出さない。
 *   選んだ編は localStorage の 'eduit.level.<分野>' に覚える(表示の設定なので「はじめから」でも消さない)。
 */
(function () {
  'use strict';
  var AUTHOR = '羽生市立南中学校　技術　岡田';
  var info = window.EDUIT_INFO || {};
  var app = info.app || {};
  if (info.domain) document.documentElement.setAttribute('data-ef-domain', info.domain);

  var SAFETY = [
    'この教材はインターネットに接続しません。外部のサイトやサーバーへ、入力した内容や学習の記録を送ることはありません。',
    '学習の記録は、開いた端末のブラウザの中だけに保存されます。ほかの端末や先生のパソコンへ自動で送られることはありません。',
    '提出するときは、自分で「書き出す」などのボタンでファイルにして、先生の指示どおりに出します。',
    '名前などの個人情報は、先生の指示がないときは入力しないでください。',
    '端末をほかの人と共有するときは、提出したあとに記録を消してください。',
    '教材に出てくる会社名・人名・アドレス・数値は、学習のために作ったものです(実在のものではありません。数値は目安です)。',
    '広告・アクセス解析・Cookie による追跡はありません。外部のプログラム(CDN など)も読み込みません。'
  ];
  var LICENSE = [
    '著作権: © 2026 ' + AUTHOR,
    '学校の授業・家庭学習など、学習のためであれば、だれでも無料で使用・コピー・配布できます(ほかの学校の先生も使えます)。',
    '授業に合わせて直して使うこともできます。直したものを配るときは、直したことと、もとの作者(' + AUTHOR + ')を書いてください。',
    '販売すること、有料の教材や商品に入れて配ることはできません。',
    'この教材は今のまま提供します。使ったことで起きた不具合や損害について、作者は責任を負いません。',
    '教科書の図や文章は使っていません。図や文章はこの教材のために作ったものです。'
  ];

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'class') e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function list(items) { return el('ul', null, items.map(function (t) { return el('li', { text: t }); })); }
  function appName() { return app.name || info.suite || document.title; }

  var dlg = null;
  function build() {
    var safety = SAFETY.concat(info.safety || []).concat(app.safety || []);
    var hist = info.history || [];
    var panels = [
      ['安全と個人情報', [el('h3', { text: 'この教材の安全について' }), list(safety)]],
      ['ライセンス', [el('h3', { text: '使ってよい条件' }), list(LICENSE)]],
      ['更新履歴', hist.length ? hist.map(function (h) {
        return el('section', null, [
          el('h3', null, [el('span', { class: 'ef-hist-ver', text: h.version ? '第' + h.version + '版' : '' }),
            el('span', { class: 'ef-hist-date', text: h.date || '' })]),
          list(h.items || [])
        ]);
      }) : [el('p', { text: 'まだありません。' })]],
      ['作った人', [
        el('h3', { text: appName() }),
        el('p', { text: (info.domainName ? '中学校 技術・家庭科(技術分野)「' + info.domainName + '」の教材です。' : '中学校 技術・家庭科(技術分野)の教材です。') }),
        el('p', { text: '作成: ' + AUTHOR }),
        el('p', { text: (info.version ? '第' + info.version + '版' : '') + (info.updated ? '(' + info.updated + ' 更新)' : '') })
      ]]
    ];
    var tabs = el('div', { class: 'ef-tabs', role: 'tablist' });
    var body = el('div');
    var tabEls = [], panelEls = [];
    panels.forEach(function (p, i) {
      var t = el('button', { type: 'button', class: 'ef-tab', role: 'tab', id: 'ef-tab-' + i, 'aria-controls': 'ef-panel-' + i, 'aria-selected': i ? 'false' : 'true', tabindex: i ? '-1' : '0', text: p[0] });
      var pn = el('div', { class: 'ef-panel', role: 'tabpanel', id: 'ef-panel-' + i, 'aria-labelledby': 'ef-tab-' + i }, p[1]);
      if (i) pn.hidden = true;
      t.addEventListener('click', function () { select(i); });
      t.addEventListener('keydown', function (e) {
        var n = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (n) { e.preventDefault(); select((i + n + panels.length) % panels.length); tabEls[(i + n + panels.length) % panels.length].focus(); }
      });
      tabEls.push(t); panelEls.push(pn); tabs.appendChild(t); body.appendChild(pn);
    });
    function select(i) {
      tabEls.forEach(function (t, j) { t.setAttribute('aria-selected', i === j ? 'true' : 'false'); t.tabIndex = i === j ? 0 : -1; });
      panelEls.forEach(function (p, j) { p.hidden = i !== j; });
    }
    var close = el('button', { type: 'button', class: 'ef-btn', text: '閉じる' });
    close.addEventListener('click', function () { dlg.close(); });
    dlg = el('dialog', { class: 'ef-dialog', 'aria-labelledby': 'ef-dialog-title' }, [
      el('div', { class: 'ef-dialog-in' }, [
        el('div', { class: 'ef-dialog-head' }, [el('h2', { id: 'ef-dialog-title', text: 'このアプリについて' }), close]),
        tabs, body
      ])
    ]);
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
    dlg._select = select;
    document.body.appendChild(dlg);
  }
  function open(tab) {
    if (!dlg) build();
    dlg._select(typeof tab === 'number' ? tab : 0);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  }

  function aboutButton(cls) {
    var b = el('button', { type: 'button', class: cls || 'ef-btn ef-about-btn', title: '作った人・安全と個人情報・ライセンス・更新履歴', text: 'ⓘ このアプリについて' });
    b.addEventListener('click', function () { open(0); });
    return b;
  }
  function footer() {
    var link = aboutButton('ef-about-link');
    link.textContent = '安全と個人情報・ライセンス・更新履歴';
    return el('footer', { class: 'ef-footer', role: 'contentinfo' }, [
      el('span', null, ['作成: ', el('span', { class: 'ef-author', text: AUTHOR })]),
      info.version ? el('span', { text: '第' + info.version + '版' + (info.updated ? '(' + info.updated + ')' : '') }) : null,
      link
    ]);
  }
  function mount() {
    if (app.footer === false) return;
    var slot = document.querySelector('[data-ef-footer]');
    var about = document.querySelector('[data-ef-about]');
    if (slot) { if (!slot.querySelector('.ef-footer')) slot.appendChild(footer()); }
    else if (about) { if (!about.querySelector('button')) about.appendChild(aboutButton()); }
    else if (!document.querySelector('body > .ef-footer')) document.body.appendChild(footer());
  }

  // ---- 基本編・発展編のタブ(メニュー用) ----
  var LEVEL_KEYS = ['basic', 'advanced'];
  function levels(box, opts) {
    var L = info.levels;
    if (!box || !L) return null;
    opts = opts || {};
    var store = 'eduit.level.' + (info.domain || 'x');
    var cur = 'basic';
    try { if (LEVEL_KEYS.indexOf(localStorage.getItem(store)) >= 0) cur = localStorage.getItem(store); } catch (e) {}
    var uid = 'ef-lv-' + (info.domain || 'x');
    var tabs = el('div', { class: 'ef-level-tabs', role: 'tablist', 'aria-label': '基本編と発展編' });
    var panel = el('div', { class: 'ef-level-panel', role: 'tabpanel', id: uid + '-panel', tabindex: '-1' });
    var tabEls = LEVEL_KEYS.map(function (k, i) {
      var lv = L[k] || { items: [] };
      var t = el('button', { type: 'button', role: 'tab', class: 'ef-level-tab ef-level-' + k, id: uid + '-' + k, 'aria-controls': uid + '-panel' }, [
        el('span', { class: 'ef-level-name', text: lv.title || (k === 'basic' ? '基本編' : '発展編') }),
        el('span', { class: 'ef-level-count', text: (lv.items || []).length + 'つ' })
      ]);
      t.addEventListener('click', function () { select(k, true); });
      t.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        var n = LEVEL_KEYS[(i + 1) % LEVEL_KEYS.length];
        select(n, true); tabEls[LEVEL_KEYS.indexOf(n)].focus();
      });
      tabs.appendChild(t);
      return t;
    });
    function partsEl(item) {
      if (!item.parts || !item.parts.length) return null;
      return el('p', { class: 'ef-level-parts' }, [el('span', { class: 'ef-level-parts-k', text: '使うところ' }), item.parts.join('・')]);
    }
    function render() {
      var lv = L[cur] || { items: [] };
      tabEls.forEach(function (t, i) { var on = LEVEL_KEYS[i] === cur; t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = on ? 0 : -1; });
      panel.setAttribute('aria-labelledby', uid + '-' + cur);
      var grid = el('div', { class: 'ef-level-grid ' + (opts.gridClass || '') });
      (lv.items || []).forEach(function (item) {
        var c = opts.card ? opts.card(item, partsEl(item), cur) : null;
        if (c) grid.appendChild(c);
      });
      while (panel.firstChild) panel.removeChild(panel.firstChild);
      if (lv.lead) panel.appendChild(el('p', { class: 'ef-level-lead', text: lv.lead }));
      if (opts.code && cur === 'basic') {
        var codes = (lv.items || []).map(opts.code).filter(Boolean);
        if (codes.length) panel.appendChild(el('p', { class: 'ef-level-order' }, [el('span', { class: 'ef-level-parts-k', text: 'おすすめの順番' }), codes.join(' → ')]));
      }
      panel.appendChild(grid);
      if (opts.onRender) opts.onRender(panel, cur);
    }
    function select(k, byUser) {
      if (LEVEL_KEYS.indexOf(k) < 0) return;
      cur = k;
      if (byUser) try { localStorage.setItem(store, k); } catch (e) {}
      render();
    }
    while (box.firstChild) box.removeChild(box.firstChild);
    box.classList.add('ef-levels');
    box.appendChild(tabs);
    box.appendChild(panel);
    render();
    return { render: render, select: select, current: function () { return cur; } };
  }

  // ---- 記号の印・メニューの上のバーの名前・メニューのカード(4分野共通の形) ----
  function code(c) { return el('span', { class: 'ef-code', text: c }); }
  function menuTitle(h) {
    if (!h) return h;
    while (h.firstChild) h.removeChild(h.firstChild);
    h.classList.add('ef-title');
    if (info.domain) h.appendChild(code(info.domain));
    h.appendChild(el('span', { class: 'ef-title-name', text: (info.domainName || '') + ' 教材集' }));
    return h;
  }
  function card(o) {
    o = o || {};
    var go = o.href
      ? el('a', { class: 'ef-btn-primary ef-mcard-go', href: o.href, text: 'ひらく ▶' })
      : el('button', { type: 'button', class: 'ef-btn-primary ef-mcard-go', text: 'ひらく ▶' });
    if (o.openAttrs) for (var k in o.openAttrs) go.setAttribute(k, o.openAttrs[k]);
    if (o.title) go.setAttribute('aria-label', (o.code ? o.code + ' ' : '') + o.title + ' をひらく');
    if (o.onOpen) go.addEventListener('click', function (e) { o.onOpen(e); });
    var extra = (o.extra || []).filter(Boolean);
    var c = el('article', { class: 'ef-card ef-mcard' }, [
      el('div', { class: 'ef-mcard-hd' }, [
        o.icon ? el('span', { class: 'ef-mcard-ic', 'aria-hidden': 'true', text: o.icon }) : null,
        el('div', { class: 'ef-mcard-ht' }, [
          o.code ? el('p', { class: 'ef-card-tag' }, [code(o.code)]) : null,
          el('h3', { class: 'ef-card-title', text: o.title || '' })
        ])
      ]),
      o.desc ? el('p', { class: 'ef-mcard-desc', text: o.desc }) : null,
      o.parts || null,
      extra.length ? el('div', { class: 'ef-mcard-extra' }, extra) : null,
      go
    ]);
    if (o.code) c.setAttribute('data-code', o.code);
    // カードのどこを押しても開く(カードの中のほかのボタン・リンク・入力は、そのまま)
    c.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('a, button, input, select, textarea, label, summary')) return;
      go.click();
    });
    return c;
  }

  window.EduitFrame = { AUTHOR: AUTHOR, open: open, footer: footer, aboutButton: aboutButton, mount: mount, levels: levels, card: card, code: code, menuTitle: menuTitle };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();

</script>

        out),
      point('なだれ効果',
        h('p', { text: '元のデータがほんの少しちがうだけで、ハッシュ値は全体がばらばらに変わります。雪山の小さな雪のかたまりが大きななだれになるようすにたとえて「なだれ効果」といいます。' }),
        h('p', { text: 'だから、ハッシュ値が似ているかどうかを見ても、元の文が似ているかは分かりません。また、たった1文字の書きかえでも、ハッシュ値をくらべればすぐに見つかります(ステップ6)。' }))

  // ================= 4 もとにもどせる？ =================
  function newPin() { return ('00' + Math.floor(Math.random() * 1000)).slice(-3); }
  var s4 = { pin: '', guess: '', tries: [], running: false, scan: 0, found: '', by: '', kinds: 'num', len: 4 };
  function renderOneway(el) {
    if (!s4.pin) s4.pin = newPin();
    var target = HL.sha256(s4.pin);
    var gi = h('input', { id: 'pin-guess', type: 'text', inputmode: 'numeric', class: 'input pin', maxlength: '3', autocomplete: 'off', 'aria-label': '3けたの番号' });
    gi.value = s4.guess;
    gi.addEventListener('input', function () { s4.guess = gi.value.replace(/[^0-9０-９]/g, ''); });
    gi.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); tryGuess(); } });
    function tryGuess() {
      var g = (s4.guess || '').replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xfee0); });
      if (!/^\d{3}$/.test(g) || s4.found) return;
      s4.tries.unshift(g);
      if (g === s4.pin) { s4.found = g; s4.by = 'あなた'; clear('crack'); }
      s4.guess = '';
      go('oneway');
    }
    var live = h('div', { class: 'scan', 'aria-live': 'off' });
    function scanView() {
      live.textContent = '';
      var n = s4.scan;
      var cur = ('00' + Math.max(0, n - 1)).slice(-3);
      append(live, [
        h('p', null, 'ためした数: ', h('b', { class: 'scan-n', text: n + ' / 1000' })),
        bar(n / 1000),
        n ? h('p', { class: 'scan-now' }, h('span', { text: cur + ' → ' }), h('code', { class: 'hex small', text: shortHex(HL.sha256(cur)) })) : null
      ]);
    }
    function brute() {
      if (s4.running || s4.found) return;
      s4.running = true;
      s4.scan = 0;
      var t0 = Date.now();
      var per = reduceMotion ? 1000 : 9;
      go('oneway');
      var id = setInterval(function () {
        for (var k = 0; k < per && !s4.found; k++) {
          var c = ('00' + s4.scan).slice(-3);
          s4.scan++;
          if (HL.sha256(c) === target) { s4.found = c; s4.by = 'コンピュータ'; }
        }
        scanView();
        if (s4.found || s4.scan >= 1000) {
          clearInterval(id);
          s4.running = false;
          s4.ms = Date.now() - t0;
          clear('crack');
          rerender();
        }
      }, 16);
      timers.push(id);
    }
    function again() { s4.pin = newPin(); s4.tries = []; s4.found = ''; s4.by = ''; s4.scan = 0; s4.guess = ''; go('oneway'); }
    scanView();

    var kinds = D.charKinds.filter(function (k) { return k.id === s4.kinds; })[0] || D.charKinds[0];
    var total = HL.combos(kinds.n, s4.len);
    var lenIn = h('input', { id: 'len', type: 'range', min: '1', max: '16', value: String(s4.len), 'aria-label': 'パスワードの長さ' });

    append(el, [
      h('p', { class: 'lead', text: 'ハッシュ値から元のデータを計算でもどせるでしょうか。ある人の3けたの暗証番号(000〜999)を、ハッシュ値だけを手がかりに当ててみよう。' }),
      missionBox('oneway'),
      card('暗証番号を当てる',

          h('p', { text: '見つかりました！ 暗証番号は「' + s4.found + '」。' + (s4.by === 'コンピュータ' ? 'コンピュータが ' + s4.scan + '回ためして見つけました(およそ ' + Math.max(1, s4.ms || 0) + 'ミリ秒)。' : 'あなたが ' + s4.tries.length + '回目で当てました。') }),
          h('p', { text: 'ハッシュ値をもとにもどす計算をしたのではなく、「000」から順番にハッシュ化して、同じハッシュ値になるものをさがしただけです(総当たり)。' }),

            h('div', { class: 'row' }, gi, btn('ハッシュ化してくらべる', tryGuess, 'ef-btn-primary')),
            s4.tries.length ? h('ul', { class: 'try-list' }, s4.tries.slice(0, 6).map(function (g) {
              return h('li', null, h('b', { text: g }), ' → ', h('code', { class: 'hex small', text: shortHex(HL.sha256(g)) }), h('span', { class: 'ng-text', text: ' ちがう' }));
            })) : null,
            s4.tries.length ? h('p', { class: 'muted', text: s4.tries.length + '回ためしました。ハッシュ値が「近い」かどうかもヒントになりません。' }) : null),
          h('div', { class: 'try-box' },
            h('p', { class: 'small-title', text: '② コンピュータに総当たりさせる' }),

            btn(s4.running ? 'さがしています…' : '総当たりをはじめる', brute, 'ef-btn-primary'),
            s4.running || s4.scan ? live : null)) : null),
      card('パスワードが長いと？',
        h('p', { text: '総当たりで全部ためすのにかかる時間は、文字の種類と長さで決まります。1秒に100億回ためせるコンピュータ(例)で計算してみよう。自分のパスワードは入れずに、種類と長さだけをえらびます。' }),

        h('div', { class: 'stat-row' },
          h('div', { class: 'stat' }, h('span', { text: 'ありうる組み合わせ' }), h('b', { text: HL.bigNumber(total) + '通り' }), h('small', { class: 'muted', text: kinds.n + 'の' + s4.len + '乗' })),
          h('div', { class: 'stat' + (total / D.triesPerSec > 3600 * 24 * 365 * 100 ? ' good' : total / D.triesPerSec < 3600 * 24 ? ' bad' : '') },
            h('span', { text: '全部ためすのにかかる時間(最大)' }), h('b', { text: HL.duration(total / D.triesPerSec) }))),
        h('table', { class: 'data compact' },

          h('tbody', null, [['数字4けた', 10, 4], ['英小文字8文字', 26, 8], ['英大文字・小文字+数字 8文字', 62, 8], ['英大文字・小文字+数字+記号 12文字', 94, 12]].map(function (r) {

          })))),
      point('一方向性(もとにもどせない)',
        h('p', { text: 'ハッシュ関数は、ハッシュ値から元のデータを計算でもどせない「一方向」の計算です。元を知るには、ありうるものを片っぱしから試す(総当たり)しかありません。' }),
        h('p', { text: '3けたの番号のように組み合わせが少ないと、総当たりですぐ見つかります。長く、いろいろな種類の文字を使ったパスワードほど、見つけるのに時間がかかります。' }))
    ]);
  }

  // ================= 5 パスワードの守り方 =================
  var s5 = { login: '', loginRes: null, picked: [], dict: false, salt: false };
  var userHash = {};
  function hashOf(u, salt) {
    var k = u.id + (salt ? ':s' : '');
    if (!userHash[k]) userHash[k] = HL.sha256((salt ? u.salt : '') + u.password);
    return userHash[k];
  }
  function renderPassword(el) {
    var demo = D.loginDemo;
    var stored = HL.sha256(demo.password);
    var li = h('input', { id: 'login-pass', type: 'text', class: 'input', maxlength: '40', autocomplete: 'off', 'aria-label': 'パスワード(練習用)' });

        h('p', { class: 'muted' }, 'ふりかえりは「', h('a', { href: '#quiz', text: '⑦ クイズとふりかえり' }), '」で書きます。')),
      card('書き出す',
        h('p', null, h('strong', { text: '先生に出すのは JSON のファイルです。' }), 'CSV は、表計算ソフトで見るときに使います。ファイルができないときは「記録をコピーする」を使います。'),
        h('div', { class: 'btn-row' },
          btn('記録を書き出す(JSON・提出用)', function () { download('json'); }, 'ef-btn-primary'),
          btn('CSVで書き出す(表計算用)', function () { download('csv'); }),
          btn('記録をコピーする', copy)),
        note,
        point('書き出す中身', h('p', { text: '組・番号・名前、ひらいたステップ、チャレンジとクイズの結果、ふりかえりの文章だけです。ハッシュ化した文などは入りません。' }))),
      renderReset()
    ]);
  }

  // ---- はじめからやり直す(データリセット) ----
  // 確認は画面の中で行う(ブラウザの確認ダイアログが出ない環境でも使えるように)。
  // ふりがな・文字の大きさは表示の設定なので消さない(ほかの情報の教材と同じ)。
  var resetAsk = false;
  var resetMsg = '';
  function renderReset() {
    var box = card('はじめからやり直す',
      h('p', { text: '次の人に端末をわたすときや、最初からやり直したいときに使います。この端末に保存した組・番号・名前、進み具合、チャレンジ、ふりかえり、クイズの答えなどを、すべて消します。ふりがな・文字の大きさの設定は残ります。' }));
    box.id = 'reset';
    box.classList.add('reset-card');
    if (!resetAsk) {
      box.appendChild(h('div', { class: 'btn-row' }, btn('この端末の記録をすべて消す', function () { resetAsk = true; resetMsg = ''; go(current.id); }, 'ef-btn reset-btn')));
    } else {
      box.appendChild(h('div', { class: 'reset-confirm', role: 'alert' },
        h('p', null, h('strong', { text: '本当に消しますか？' }), '消した記録は元にもどせません。提出がまだなら、先に「書き出す」でファイルにしておこう。'),
        h('div', { class: 'btn-row' },
          btn('消す(はじめからやり直す)', function () { resetAll(); }, 'ef-btn-primary danger'),
          btn('やめる', function () { resetAsk = false; go(current.id); }))));
    }
    if (resetMsg) box.appendChild(h('p', { class: 'export-note good', role: 'status', text: resetMsg }));
    return box;
  }
  function resetAll() {
    clearTimers();
    var keep = { furigana: saved.furigana, big: saved.big };
    saved = {};
    try { localStorage.removeItem(KEY); } catch (e) { /* 保存できない環境でも続ける */ }
    if (keep.furigana) save('furigana', true);
    if (keep.big) save('big', true);
    var init = JSON.parse(INITIAL);
    [[s1, 's1'], [s2, 's2'], [s3, 's3'], [s4, 's4'], [s5, 's5'], [s6, 's6'], [qs, 'qs']].forEach(function (o) {
      Object.keys(o[0]).forEach(function (k) { delete o[0][k]; });
      Object.assign(o[0], init[o[1]]);
    });
    resetAsk = false;
    resetMsg = '記録をすべて消しました。はじめから使えます。';
    current = null;
    show('records');
    resetMsg = '';
    markNav();
    toast('記録を消しました');
    var b = document.querySelector('.reset-btn');
    if (b) try { b.focus({ preventScroll: true }); } catch (e) { b.focus(); }
    var r = document.getElementById('reset');
    if (r) r.scrollIntoView({ block: 'center' });
  }
  function toast(msg) {
    var t = document.querySelector('.toast') || document.body.appendChild(h('div', { class: 'toast', role: 'status' }));
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { t.classList.remove('show'); }, 2500);
  }

  // ---- 表示の切りかえ(ふりがな・大きな文字) ----
  function setupToggles() {
    var tools = document.getElementById('display-toggles');
    [['furigana', 'ふりがな', 'show-ruby'], ['big', '大きな文字', 'big-text']].forEach(function (t) {
      var on = !!saved[t[0]];
      document.documentElement.classList.toggle(t[2], on);
      var b = h('button', { type: 'button', class: 'toggle ef-btn', 'aria-pressed': String(on) }, t[1]);
      b.addEventListener('click', function () {
        on = !on;
        save(t[0], on);
        b.setAttribute('aria-pressed', String(on));
        document.documentElement.classList.toggle(t[2], on);
        if (t[0] === 'furigana' && current) rerender();
      });
      tools.appendChild(b);
    });
  }

  // 体験の途中のようす(入れた文・クイズの答えなど)も、この端末の中に残す(読みこみ直しても消えない)
  function persist() {
    save('state', {
      s1: { text: s1.text, hist: s1.hist }, s2: { a: s2.a, b: s2.b }, s3: { a: s3.a, b: s3.b },
      s4: { kinds: s4.kinds, len: s4.len }, s5: { salt: s5.salt, dict: s5.dict, picked: s5.picked },
      s6: { calc: s6.calc, judge: s6.judge }, quiz: qs.ans
    });
  }
  var INITIAL = JSON.stringify({ s1: s1, s2: s2, s3: s3, s4: s4, s5: s5, s6: s6, qs: qs });
  (function restore() {
    var st = saved.state;
    if (!st) return;
    try {
      if (st.s1) { s1.text = String(st.s1.text || ''); s1.hist = Array.isArray(st.s1.hist) ? st.s1.hist.map(String).slice(0, 10) : []; }
      if (st.s2) { s2.a = String(st.s2.a || ''); s2.b = String(st.s2.b || ''); }
      if (st.s3) { s3.a = String(st.s3.a || ''); s3.b = String(st.s3.b || ''); }
      if (st.s4) {
        if (D.charKinds.some(function (k) { return k.id === st.s4.kinds; })) s4.kinds = st.s4.kinds;
        if (st.s4.len >= 1 && st.s4.len <= 16) s4.len = st.s4.len;
      }
      if (st.s5) { s5.salt = !!st.s5.salt; s5.dict = !!st.s5.dict; s5.picked = Array.isArray(st.s5.picked) ? st.s5.picked.slice(0, 2) : []; }
      if (st.s6) { s6.calc = st.s6.calc || {}; s6.judge = st.s6.judge || {}; }
      if (st.quiz) qs.ans = st.quiz;
    } catch (e) { /* 読めなければ最初から */ }
  })();

  buildNav();
  setupToggles();
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
