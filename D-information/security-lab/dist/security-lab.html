  <!-- 4分野共通の枠（色・ヘッダー・ボタン・フッター・このアプリについて）。1ファイル版では中に入れる -->
  <style id="eduit-frame-css">
/* Edu-IT 共通の枠(4分野・全アプリ共通)
 * 色・文字・ボタン・カード・ヘッダー・フッターの見た目をそろえるための部品。
 * 分野の色は <html data-ef-domain="A|B|C|D"> で切りかわる。
 * アプリ固有の見た目は各アプリの CSS に残し、ここでは「枠」だけを決める。
 */
:root {
  color-scheme: light;      /* 端末がダークモードでも、4分野とも明るい画面で出す */
  --ef-font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --ef-bg: #f5f4f0;          /* 画面の地 */
  --ef-surface: #ffffff;     /* カード・ヘッダー */
  --ef-surface-2: #f8f7f4;   /* 一段下げた面 */
  --ef-line: #d6d3cb;        /* 枠線 */
  --ef-text: #1f2328;
  --ef-muted: #565d68;
  --ef-focus: #f08c00;       /* キーボード操作の枠 */
  --ef-radius: 12px;
  --ef-radius-s: 8px;
  --ef-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .04);
  --ef-header-h: 52px;
  --ef-tap: 40px;            /* ボタンの最小の高さ */
  /* 分野の色(既定は D) */
  --ef-accent: #1a5fc8;
  --ef-accent-ink: #ffffff;
  --ef-accent-soft: #e6eefb;
}
:root[data-ef-domain="A"] { --ef-accent: #985a26; --ef-accent-soft: #f5e9dc; }  /* 材料と加工: 木の茶 */
:root[data-ef-domain="B"] { --ef-accent: #2e7d32; --ef-accent-soft: #e4f2e5; }  /* 生物育成: 緑 */
:root[data-ef-domain="C"] { --ef-accent: #b45309; --ef-accent-soft: #fbeedd; }  /* エネルギー変換: だいだい */
:root[data-ef-domain="D"] { --ef-accent: #1a5fc8; --ef-accent-soft: #e6eefb; }  /* 情報: 青 */

/* ---- ヘッダー ----
 * メニュー:   <header class="ef-header"> <h1 class="ef-title"><span class="ef-code">A</span> 材料と加工の技術 教材集</h1>
 *               <div class="ef-tools"> ふりがな / 文字の大きさ / (くっきり) / 使い方 / 先生用 </div> </header>
 * アプリ:     <header class="ef-header"> <a class="ef-btn ef-back" href="…">◀ メニュー</a>
 *               <h1 class="ef-title"><span class="ef-code">A2</span> アプリ名</h1>
 *               <div class="ef-tools"> ふりがな / 文字の大きさ / くっきり / 使い方 / そのアプリだけのボタン </div> </header>
 *   同じ分野の教材を切りかえるボタンにも記号を出す(<button class="ef-btn"><span class="ef-code">D2</span> CPU</button>)。
 */

 * メニューのカード(4分野共通の形): EduitFrame.card({ code: 'A1', icon: '🪵', title: '…', desc: '…', parts: 「使うところ」の要素,

      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'class') e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function list(items) { return el('ul', null, items.map(function (t) { return el('li', { text: t }); })); }
  function appName() { return app.name || info.suite || document.title; }

  var dlg = null;
  function build() {
    var safety = SAFETY.concat(info.safety || []).concat(app.safety || []);
    var hist = info.history || [];
    var panels = [
      ['安全と個人情報', [el('h3', { text: 'この教材の安全について' }), list(safety)]],
      ['ライセンス', [el('h3', { text: '使ってよい条件' }), list(LICENSE)]],
      ['更新履歴', hist.length ? hist.map(function (h) {
        return el('section', null, [
          el('h3', null, [el('span', { class: 'ef-hist-ver', text: h.version ? '第' + h.version + '版' : '' }),
            el('span', { class: 'ef-hist-date', text: h.date || '' })]),
          list(h.items || [])
        ]);
      }) : [el('p', { text: 'まだありません。' })]],
      ['作った人', [
        el('h3', { text: appName() }),
        el('p', { text: (info.domainName ? '中学校 技術・家庭科(技術分野)「' + info.domainName + '」の教材です。' : '中学校 技術・家庭科(技術分野)の教材です。') }),
        el('p', { text: '作成: ' + AUTHOR }),
        el('p', { text: (info.version ? '第' + info.version + '版' : '') + (info.updated ? '(' + info.updated + ' 更新)' : '') })
      ]]
    ];
    var tabs = el('div', { class: 'ef-tabs', role: 'tablist' });
    var body = el('div');
    var tabEls = [], panelEls = [];
    panels.forEach(function (p, i) {
      var t = el('button', { type: 'button', class: 'ef-tab', role: 'tab', id: 'ef-tab-' + i, 'aria-controls': 'ef-panel-' + i, 'aria-selected': i ? 'false' : 'true', tabindex: i ? '-1' : '0', text: p[0] });
      var pn = el('div', { class: 'ef-panel', role: 'tabpanel', id: 'ef-panel-' + i, 'aria-labelledby': 'ef-tab-' + i }, p[1]);
      if (i) pn.hidden = true;
      t.addEventListener('click', function () { select(i); });
      t.addEventListener('keydown', function (e) {
        var n = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (n) { e.preventDefault(); select((i + n + panels.length) % panels.length); tabEls[(i + n + panels.length) % panels.length].focus(); }
      });
      tabEls.push(t); panelEls.push(pn); tabs.appendChild(t); body.appendChild(pn);
    });
    function select(i) {
      tabEls.forEach(function (t, j) { t.setAttribute('aria-selected', i === j ? 'true' : 'false'); t.tabIndex = i === j ? 0 : -1; });
      panelEls.forEach(function (p, j) { p.hidden = i !== j; });
    }
    var close = el('button', { type: 'button', class: 'ef-btn', text: '閉じる' });
    close.addEventListener('click', function () { dlg.close(); });
    dlg = el('dialog', { class: 'ef-dialog', 'aria-labelledby': 'ef-dialog-title' }, [
      el('div', { class: 'ef-dialog-in' }, [
        el('div', { class: 'ef-dialog-head' }, [el('h2', { id: 'ef-dialog-title', text: 'このアプリについて' }), close]),
        tabs, body
      ])
    ]);
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
    dlg._select = select;
    document.body.appendChild(dlg);
  }
  function open(tab) {
    if (!dlg) build();
    dlg._select(typeof tab === 'number' ? tab : 0);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  }

  function aboutButton(cls) {
    var b = el('button', { type: 'button', class: cls || 'ef-btn ef-about-btn', title: '作った人・安全と個人情報・ライセンス・更新履歴', text: 'ⓘ このアプリについて' });
    b.addEventListener('click', function () { open(0); });
    return b;
  }
  function footer() {
    var link = aboutButton('ef-about-link');
    link.textContent = '安全と個人情報・ライセンス・更新履歴';
    return el('footer', { class: 'ef-footer', role: 'contentinfo' }, [
      el('span', null, ['作成: ', el('span', { class: 'ef-author', text: AUTHOR })]),
      info.version ? el('span', { text: '第' + info.version + '版' + (info.updated ? '(' + info.updated + ')' : '') }) : null,
      link
    ]);
  }
  function mount() {
    if (app.footer === false) return;
    var slot = document.querySelector('[data-ef-footer]');
    var about = document.querySelector('[data-ef-about]');
    if (slot) { if (!slot.querySelector('.ef-footer')) slot.appendChild(footer()); }
    else if (about) { if (!about.querySelector('button')) about.appendChild(aboutButton()); }
    else if (!document.querySelector('body > .ef-footer')) document.body.appendChild(footer());
  }

  // ---- 基本編・発展編のタブ(メニュー用) ----
  var LEVEL_KEYS = ['basic', 'advanced'];
  function levels(box, opts) {
    var L = info.levels;
    if (!box || !L) return null;
    opts = opts || {};
    var store = 'eduit.level.' + (info.domain || 'x');
    var cur = 'basic';
    try { if (LEVEL_KEYS.indexOf(localStorage.getItem(store)) >= 0) cur = localStorage.getItem(store); } catch (e) {}
    var uid = 'ef-lv-' + (info.domain || 'x');
    var tabs = el('div', { class: 'ef-level-tabs', role: 'tablist', 'aria-label': '基本編と発展編' });
    var panel = el('div', { class: 'ef-level-panel', role: 'tabpanel', id: uid + '-panel', tabindex: '-1' });
    var tabEls = LEVEL_KEYS.map(function (k, i) {
      var lv = L[k] || { items: [] };
      var t = el('button', { type: 'button', role: 'tab', class: 'ef-level-tab ef-level-' + k, id: uid + '-' + k, 'aria-controls': uid + '-panel' }, [
        el('span', { class: 'ef-level-name', text: lv.title || (k === 'basic' ? '基本編' : '発展編') }),
        el('span', { class: 'ef-level-count', text: (lv.items || []).length + 'つ' })
      ]);
      t.addEventListener('click', function () { select(k, true); });
      t.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        var n = LEVEL_KEYS[(i + 1) % LEVEL_KEYS.length];
        select(n, true); tabEls[LEVEL_KEYS.indexOf(n)].focus();
      });
      tabs.appendChild(t);
      return t;
    });
    function partsEl(item) {
      if (!item.parts || !item.parts.length) return null;
      return el('p', { class: 'ef-level-parts' }, [el('span', { class: 'ef-level-parts-k', text: '使うところ' }), item.parts.join('・')]);
    }
    function render() {
      var lv = L[cur] || { items: [] };
      tabEls.forEach(function (t, i) { var on = LEVEL_KEYS[i] === cur; t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = on ? 0 : -1; });
      panel.setAttribute('aria-labelledby', uid + '-' + cur);
      var grid = el('div', { class: 'ef-level-grid ' + (opts.gridClass || '') });
      (lv.items || []).forEach(function (item) {
        var c = opts.card ? opts.card(item, partsEl(item), cur) : null;
        if (c) grid.appendChild(c);
      });
      while (panel.firstChild) panel.removeChild(panel.firstChild);
      if (lv.lead) panel.appendChild(el('p', { class: 'ef-level-lead', text: lv.lead }));
      if (opts.code && cur === 'basic') {
        var codes = (lv.items || []).map(opts.code).filter(Boolean);
        if (codes.length) panel.appendChild(el('p', { class: 'ef-level-order' }, [el('span', { class: 'ef-level-parts-k', text: 'おすすめの順番' }), codes.join(' → ')]));
      }
      panel.appendChild(grid);
      if (opts.onRender) opts.onRender(panel, cur);
    }
    function select(k, byUser) {
      if (LEVEL_KEYS.indexOf(k) < 0) return;
      cur = k;
      if (byUser) try { localStorage.setItem(store, k); } catch (e) {}
      render();
    }
    while (box.firstChild) box.removeChild(box.firstChild);
    box.classList.add('ef-levels');
    box.appendChild(tabs);
    box.appendChild(panel);
    render();
    return { render: render, select: select, current: function () { return cur; } };
  }

  // ---- 記号の印・メニューの上のバーの名前・メニューのカード(4分野共通の形) ----
  function code(c) { return el('span', { class: 'ef-code', text: c }); }
  function menuTitle(h) {
    if (!h) return h;
    while (h.firstChild) h.removeChild(h.firstChild);
    h.classList.add('ef-title');
    if (info.domain) h.appendChild(code(info.domain));
    h.appendChild(el('span', { class: 'ef-title-name', text: (info.domainName || '') + ' 教材集' }));
    return h;
  }
  function card(o) {
    o = o || {};
    var go = o.href
      ? el('a', { class: 'ef-btn-primary ef-mcard-go', href: o.href, text: 'ひらく ▶' })
      : el('button', { type: 'button', class: 'ef-btn-primary ef-mcard-go', text: 'ひらく ▶' });
    if (o.openAttrs) for (var k in o.openAttrs) go.setAttribute(k, o.openAttrs[k]);
    if (o.title) go.setAttribute('aria-label', (o.code ? o.code + ' ' : '') + o.title + ' をひらく');
    if (o.onOpen) go.addEventListener('click', function (e) { o.onOpen(e); });
    var extra = (o.extra || []).filter(Boolean);
    var c = el('article', { class: 'ef-card ef-mcard' }, [
      el('div', { class: 'ef-mcard-hd' }, [
        o.icon ? el('span', { class: 'ef-mcard-ic', 'aria-hidden': 'true', text: o.icon }) : null,
        el('div', { class: 'ef-mcard-ht' }, [
          o.code ? el('p', { class: 'ef-card-tag' }, [code(o.code)]) : null,
          el('h3', { class: 'ef-card-title', text: o.title || '' })
        ])
      ]),
      o.desc ? el('p', { class: 'ef-mcard-desc', text: o.desc }) : null,
      o.parts || null,
      extra.length ? el('div', { class: 'ef-mcard-extra' }, extra) : null,
      go
    ]);
    if (o.code) c.setAttribute('data-code', o.code);
    // カードのどこを押しても開く(カードの中のほかのボタン・リンク・入力は、そのまま)
    c.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('a, button, input, select, textarea, label, summary')) return;
      go.click();
    });
    return c;
  }

  // ---- 文字の大きさのボタン(4分野で同じ形:「文字 中」。押すたびに次の大きさへ) ----
  function sizeButton(btn, opt) {
    var steps = opt.steps;
    btn.classList.add('ef-btn', 'ef-size');
    btn.type = 'button';
    btn.textContent = '';
    btn.appendChild(document.createTextNode('文字 '));
    var v = document.createElement('span');
    v.className = 'ef-size-v';
    v.setAttribute('data-noruby', '');
    btn.appendChild(v);
    function idx() {
      var cur = opt.get(), best = 0;
      for (var i = 1; i < steps.length; i++) if (Math.abs(steps[i][0] - cur) < Math.abs(steps[best][0] - cur)) best = i;
      return best;
    }
    function update() {
      var s = steps[idx()][1];
      v.textContent = s;
      btn.title = '文字の大きさ(いまは「' + s + '」。押すと変わる)';
      btn.setAttribute('aria-label', '文字の大きさ: ' + s);
    }
    btn.addEventListener('click', function () { opt.set(steps[(idx() + 1) % steps.length][0]); update(); });
    update();
    return update;
  }

  window.EduitFrame = { AUTHOR: AUTHOR, furikaeri: furikaeri, open: open, footer: footer, aboutButton: aboutButton, mount: mount, levels: levels, card: card, code: code, menuTitle: menuTitle, sizeButton: sizeButton };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();

</script>

e":"著作権・利用ルールの分岐クイズ。各ケースは start のノードから始まり、choices の next で次の問いへ進む。best=true が望ましい答え。先生が追加・変更してよい。","cases":[{"id":"lyrics","title":"好きな曲の歌詞","situation":"大好きな曲の歌詞を、全部自分のSNSに載せてみんなに紹介したい。","start":"q1","nodes":{"q1":{"text":"歌詞を全部、SNSに載せてもいい？","choices":[{"label":"いい。歌手の名前と曲名を書けば大丈夫","best":false,"explain":"歌詞も著作物です。名前や曲名を書いても、作った人の許可なく全部をネットに載せると、著作権の侵害になるおそれがあります。","next":"q2"},{"label":"だめ。作った人の許可が必要","best":true,"explain":"そのとおり。歌詞は作詞家の著作物で、ネットに載せる（公衆送信する）には許可が必要です。","next":"q2"}]},"q2":{"text":"では、曲の感想を書くために、歌詞の一部を使いたいときは？","choices":[{"label":"「引用」のルールを守って、必要な部分だけ使う","best":true,"explain":"引用のルール: ①公表された作品から ②自分の文章が中心（主）で、引用は一部だけ（従） ③かぎかっこで区別し、変えずに使う ④出典（曲名・作詞者）を書く。必要な範囲だけ。これを守れば許可なく使えます。"},{"label":"一部なら、ルールを気にせず自由に使える","best":false,"explain":"一部でも、引用のルール（公表された作品から、自分の文章が中心、かぎかっこで区別して変えずに使う、出典を書く、必要な範囲だけ）を守らないと、無断で使ったことになります。"}]}}},{"id":"report","title":"調べ学習のレポート","situation":"調べ学習のレポートに、図書館の本に書いてあった説明を使いたい。","start":"q1","nodes":{"q1":{"text":"どう使えばいい？","choices":[{"label":"本の文章を、そのまま自分の文として書き写す","best":false,"explain":"人の文章を自分の文のように使うのは、著作権の問題だけでなく、学習としてもよくありません。","next":"q2"},{"label":"かぎかっこで区別して出典を書き、自分の考えを中心にまとめる","best":true,"explain":"それが「引用」です。どこから引用したか（本の題名・著者・ページ）を書いておくと、読む人も確かめられます。","next":"q2"}]},"q2":{"text":"ネットで見つけた記事の文章を使うときは？","choices":[{"label":"本と同じく、引用のルールを守り、サイト名とURL・見た日を書く","best":true,"explain":"ネットの文章も著作物です。本と同じルールで引用し、サイト名・URL・見た日を出典として書きましょう。"},{"label":"ネットの文章はだれのものでもないので、自由にコピーしてよい","best":false,"explain":"ネット上の文章や画像にも、ほとんどの場合、著作権があります。自由に使えるわけではありません。"}]}}},{"id":"recording","title":"録画したアニメ","situation":"テレビで放送されたアニメを家で録画した。","start":"q1","nodes":{"q1":{"text":"録画したアニメを、家族と一緒に家で見るのは？","choices":[{"label":"問題ない","best":true,"explain":"自分や家族など、限られた範囲で楽しむための録画やコピーは「私的使用」として認められています。","next":"q2"},{"label":"許可が必要","best":false,"explain":"自分や家族の範囲で楽しむための録画は「私的使用」として、許可なくできます。","next":"q2"}]},"q2":{"text":"見のがした友達のために、動画サイトにアップロードするのは？","choices":[{"label":"友達のためだから問題ない","best":false,"explain":"動画サイトに上げると、だれでも見られる状態になり、私的使用の範囲をこえます。著作権の侵害になり、罰則があります。違法にアップロードされたものと知りながらダウンロードすることも、法律で禁止されています。"},{"label":"だめ。私的使用の範囲をこえる","best":true,"explain":"そのとおり。ネットに上げるのは、家族の範囲をこえて「公衆」に送ることになります。違法にアップロードされたものと知りながらダウンロードすることも、法律で禁止されています。"}]}}},{"id":"free","title":"フリー素材のイラスト","situation":"「フリー素材」と書いてあるサイトのイラストを、学級新聞に使いたい。","start":"q1","nodes":{"q1":{"text":"使う前にすることは？","choices":[{"label":"「フリー」なので、何も確かめずに使ってよい","best":false,"explain":"「フリー」は「お金がかからない」という意味のことが多く、条件がついていることがほとんどです。","next":"q2"},{"label":"利用規約（使ってよい条件）を読む","best":true,"explain":"そのとおり。クレジット（作者名）の表示、加工してよいか、何枚まで、営利目的はだめ、などの条件が決められています。","next":"q2"}]},"q2":{"text":"規約に「クレジット表記が必要」「加工禁止」とあった。どうする？","choices":[{"label":"作者名を書いて、色や形を変えずに使う","best":true,"explain":"条件を守れば、安心して使えます。条件が守れないときは、別の素材を探しましょう。"},{"label":"新聞の色に合わせて色を変え、作者名は省く","best":false,"explain":"規約の条件を守らないと、許可された使い方ではなくなります。"}]}}},{"id":"photo","title":"文化祭で撮った写真","situation":"文化祭で、友達の楽しそうな様子をスマホで撮った。","start":"q1","nodes":{"q1":{"text":"その写真を、本人に聞かずにSNSに投稿するのは？","choices":[{"label":"自分が撮った写真だから自由に投稿してよい","best":false,"explain":"写っている人には、勝手に顔を公開されない権利（肖像権）やプライバシーがあります。本人が嫌がるかもしれません。","next":"q2"},{"label":"写っている友達に、投稿してよいか聞く","best":true,"explain":"そのとおり。写っている人の気持ちと権利（肖像権）を大切にしましょう。学校のルールも確認しよう。","next":"q2"}]},"q2":{"text":"友達が撮った写真を、自分のSNSで使いたいときは？","choices":[{"label":"写っているのが自分なら、撮った友達に聞かなくてよい","best":false,"explain":"写真は撮った人の著作物です。自分が写っていても、撮った友達の許可をもらいましょう。"},{"label":"撮った友達に許可をもらう","best":true,"explain":"写真の著作権は撮った人にあります。写っている人と撮った人、両方の気持ちを考えよう。"}]}}},{"id":"class","title":"授業での発表","situation":"授業の発表スライドで、好きな曲を少しBGMとして流したい（教室の中だけ）。","start":"q1","nodes":{"q1":{"text":"教室での授業の発表で使うのは？","choices":[{"label":"授業のために必要な範囲なら、許可なく使える場合がある","best":true,"explain":"そのとおり。授業の中で必要な範囲なら、曲をスライドに入れたり（著作権法 第35条）、教室で流したり（第38条）することが、許可なくできる決まりがあります。","next":"q2"},{"label":"どんな場合でも絶対に使えない","best":false,"explain":"授業の中で必要な範囲なら、曲をスライドに入れたり（著作権法 第35条）、教室で流したり（第38条）することが、許可なくできる決まりがあります。","next":"q2"}]},"q2":{"text":"その発表を録画して、だれでも見られる動画サイトに公開するのは？","choices":[{"label":"授業で作ったものだから、そのまま公開してよ てしまう危険もある。"}},{"id":"web-game","title":"ゲームの「無料プレゼント」ログイン画面","kind":"web","isPhishing":true,"address":{"id":"url","text":"http://pocketquest-free-gems.example/login","suspicious":true,"explain":"公式サイト（pocketquest.example）とは違うアドレス。「free-gems」のような言葉が入っているのも怪しい。また「http://」で始まり、通信が暗号化されていない。"},"intro":"SNSの広告をタップしたら、このページが開きました。怪しいと思うところをすべて選ぼう（アドレスバーも選べます）。","parts":[{"id":"logo","role":"logo","text":"PQ ポケットクエスト","suspicious":false,"explain":"ロゴや画像は簡単にコピーできる。本物そっくりでも安心の理由にはならない。"},{"id":"head","role":"heading","text":"公式イベント！今だけ ジェム10000個 無料プレゼント","suspicious":true,"explain":"「今だけ」「無料」「大量」は、うまい話でおびき寄せる典型的な言葉。"},{"id":"timer","role":"timer","text":"受け取り期限まで 残り 04:59","suspicious":true,"explain":"カウントダウンで急がせ、立ち止まって考えるのをじゃましている。"},{"id":"f1","role":"field","text":"ユーザーID","suspicious":false,"explain":"ログインにIDを使うのはふつう。ただし、このページに入力すること自体が危ない。"},{"id":"f2","role":"field","text":"パスワード","suspicious":false,"explain":"ふつうのログインでも聞かれる項目。問題は「どのページで」入力するか。"},{"id":"f3","role":"field","text":"電話番号・生年月日","suspicious":true,"explain":"プレゼントを受け取るのに必要のない個人情報まで集めようとしている。"}],"action":{"question":"このページでどうする？","choices":["ジェムがほしいので、カード番号は入れずにIDとパスワードだけ入力する","入力せずに閉じ、ゲームアプリのお知らせでイベントがあるか確かめる","自分のアカウントは心配なので、まず友達のアカウントで試してもらう"],"answer":1,"danger":[0,2],"explain":"一度入力したIDとパスワードは盗まれて、アカウントを乗っ取られるおそれがある。もし入力してしまったら、すぐにパスワードを変えて、家族や先生に相談しよう。"}},{"id":"mail-order","title":"ネットショップの注文確認メール","kind":"email","isPhishing":false,"intro":"先週、家族と一緒にクモストアで本を注文しました。そのあとに届いたメールです。怪しいと思うところがあれば選ぼう（なければ選ばずに答え合わせ）。","parts":[{"id":"from","role":"sender","text":"クモストア <order@kumo-store.example>","suspicious":false,"explain":"@ の後ろが、いつも使っているクモストアの公式アドレス（kumo-store.example）と同じ。ただし、差出人のアドレスは本物と同じに見せかけることもできるので、これだけでは決められない。注文した内容と合っているかを見て、心配なら公式アプリの注文履歴で確かめよう。"},{"id":"subject","role":"subject","text":"ご注文の商品を発送しました（注文番号 KS-2026-1004-0042）","suspicious":false,"explain":"自分が実際に注文した内容と合っている。急かす言葉もない。"},{"id":"greet","role":"text","text":"山田 花子 様","suspicious":false,"explain":"登録した名前で呼びかけている。"},{"id":"t1","role":"text","text":"ご注文いただいた商品「はじめてのプログラミング」を本日発送しました。お届け予定日は10月6日です。","suspicious":false,"explain":"注文した商品と日付が合っている。自然な日本語。"},{"id":"t2","role":"text","text":"配送状況は、クモストアのアプリの「注文履歴」からご確認いただけます。","suspicious":false,"explain":"リンクを押させるのではなく、公式アプリで確かめるよう案内している。"}],"action":{"question":"このメールについて、どう考える？","choices":["通販のメールはほとんどが詐欺なので、読まずに削除して誰にも言わない","注文と合っていて怪しい点もない。心配なら公式アプリの注文履歴で確かめる","念のため、メールに書かれていないお店の電話番号をネットで検索してかけてみる"],"answer":1,"danger":[2],"explain":"本物のメールもたくさんある。大切なのは「こわがって全部無視」ではなく、手順にそって確かめること。検索で出てきた電話番号が偽物のこともあるので、公式アプリや公式サイトから確かめよう。"}},{"id":"dm-prize","title":"SNSの「当選しました」DM","kind":"dm","isPhishing":true,"intro":"SNSに知らないアカウントからダイレクトメッセージ（DM）が届きました。怪しいと思うところをすべて選ぼう。","parts":[{"id":"from","role":"sender","text":"@hikari_live_present（フォロワー 3人・今月作成）","suspicious":true,"explain":"公式マークがなく、作られたばかりでフォロワーもほとんどいない。公式を名乗るなりすましアカウントの特徴。"},{"id":"t1","role":"text","text":"おめでとうございます🎉 あなたは人気アイドル「ヒカリ」のライブチケットに当選しました！","suspicious":true,"explain":"応募していないのに当選するのはおかしい。"},{"id":"t2","role":"text","text":"受け取りのため、下のフォームに 名前・住所・学校名・電話番号 を入力してね。","suspicious":true,"explain":"住所や学校名などの個人情報を集めようとしている。一度知られると取り消せない。"},{"id":"t3","role":"text","text":"発送手数料として、コンビニで500円のギフトカードを買って番号を送ってください。","suspicious":true,"explain":"ギフトカードの番号を送らせるのは詐欺の典型的な手口。番号を送った時点でお金がとられる。"},{"id":"t4","role":"text","text":"このことは、ほかの人には内緒にしてね！","suspicious":true,"explain":"「内緒に」は、家族や先生に相談させないためのことば。相談されると困るのは、だます側。"},{"id":"link","role":"link","text":"https://hikari-present.form-site.example","suspicious":true,"explain":"「https」でも安全とは限らない。https は通信が暗号化されているという意味で、相手が本物かどうかは別の話。"}],"action":{"question":"あなたならどうする？","choices":["チケットがほしいので、住所は書かずに名前だけ入力してみる","返信せず、家族や先生に見せて相談し、アカウントをブロック・通報する","入力する前に「本当に当選ですか？」と返信して確かめる"],"answer":1,"danger":[0,2],"explain":"返信すると、さらに言葉たくみに個人情報を聞き出されることがある。1人で判断せず相談し、ブロック・通報しよう。"}}]},"quiz":{"_note":"理解度チェックの問題。core=true の問題（各モジュール1問）は事前テスト・事後テストに使う。step はまちがえたときに復習するステップ。","questions":[{"id":"password-1","module":"password","step":"compare","core":true,"question":"英小文字9文字のパスワードを強くしたい。いちばん効果が大きいのは？","choices":["同じ文字の種類のまま、4文字長くする","長さはそのままで、1文字を記号に変える","ほかはそのままで、最後に数字を1つ足す"],"answer":0,"explain":"文字の種類を増やすより、長くするほうが組み合わせの数は大きく増えます。パスワード強度ラボと同じ計算（1秒に100億回試す場合）で、英小文字9文字（約9分）を4文字長くすると約7.9年、1文字を記号に変えると約10日、数字を1つ足すと約4.2日です。"},{"id":"password-2","module":"password","step":"try","core":false,"question":"「Password123!」が弱いと言える理由は？","choices":["文字数が12文字しかなく、長さが足りないから","辞書の言葉に、よくある数字と記号を足しただけだから","大文字・数字・記号が入っていて、覚えにくく忘れやすいから"],"answer":1,"explain":"攻撃する側は、辞書の言葉に数字や記号を足したパターンから先に試します。"},{"id":"password-3","module":"password","step":"quiz","core":false,"question":"同じパスワードをいろいろなサービスで使い回すと、何が危ない？","choices":["どのサービスのパスワードか分からなくなり、忘れやすくなる","1つのサービスから流出すると、ほかのサービスまで乗っ取られる","サービスどうしが同じ情報を読みこむので、スマホの動きが遅くなる"],"answer":1,"explain":"流出したIDとパスワードの組み合わせで、別のサービスへのログインを試される攻撃があります。"},{"id":"crypto-1","module":"crypto","step":"brute","core":true,"question":"シーザー暗号が簡単に破られる理由は？","choices":["鍵（ずらす数）が25通りしかなく、全部試せるから","暗号にすると文が元の何倍にも長くなり、目立つから","アルファベットにしか使えず、日本語を暗号にできないから"],"answer":0,"explain":"鍵の候補が少ないと、総当たりで全部試されてしまいます。"},{"id":"crypto-2","module":"crypto","step":"freq","core":false,"question":"頻度分析とは？","choices":["文字の出てくる回数のかたよりから、暗号を解く方法","同じ暗号文を何度もくり返し送って、確実に届ける方法","鍵を毎日変えて、同じ鍵を使う回数を少なくする方法"],"answer":0,"explain":"ふつうの文章では特定の文字（ローマ字なら母音など）がよく出るので、その特徴から鍵を推測できます。"},{"id":"crypto-3","module":"crypto","step":"keyx","core":false,"question":"公開鍵暗号で、みんなに公開してよいのはどれ？","choices":["秘密鍵","公開鍵","両方"],"answer":1,"explain":"公開鍵は暗号にするための鍵で、配ってもかまいません。元に戻せる秘密鍵は自分だけが持ちます。"},{"id":"crypto-4","module":"crypto","step":"rsa","core":false,"question":"RSA暗号が安全な理由に関係するのは？","choices":["大きな数の素因数分解がとても難しいこと","鍵を作るときに使うパスワードがとても長いこと","暗号文を送る通信がとても速く、のぞき見できないこと"],"answer":0,"explain":"n＝p×q の n から p と q を見つけるのが、とても大きな数では現実的な時間でできないことを利用しています。"},{"id":"hash-1","module":"hash","step":"avalanche","core":true,"question":"データを1文字だけ変えると、ハッシュ値は？","choices":["変えた1文字の部分だけが変わる","まったく別の値に大きく変わる","元と同じ値のまま、まったく変わらない"],"answer":1,"explain":"少しの違いで大きく変わる（なだれ効果）ので、改ざんに気づけます。"},{"id":"hash-2","module":"hash","step":"fixed","core":false,"question":"ハッシュと暗号のちがいとして正しいのは？","choices":["ハッシュは元に戻せない","ハッシュは鍵があれば元に戻せる","どちらも元に戻せるので、違いはない"],"answer":0,"explain":"暗号は鍵で元に戻せますが、ハッシュは一方向で元に戻せません。"},{"id":"hash-3","module":"hash","step":"storage","core":false,"question":"サービスがパスワードをハッシュ値で保存する理由は？","choices":["パスワードを長いデータに変えて、入力ミスを見つけやすくするため","流出しても、パスワードそのものはすぐには分からないようにするため","短い値にそろえて、ログインのときにくらべる時間を短くするため"],"answer":1,"explain":"ハッシュ値は元に戻せないので、パスワードそのものを保存するより安全です（弱いパスワードは辞書攻撃で見つかることもあります）。"},{"id":"phishing-1","module":"phishing","step":"first","core":true,"question":"フィッシングメールのURLを確かめるとき、本当の持ち主が分かるのはどこ？","choices":["「//」のすぐ後ろにある、いちばん左の部分（例: midori-bank）","ドメイン名の右はしとその左（例: ○○.example）","メールの差出人に表示される名前（例: ミドリ銀行）"],"answer":1,"explain":"midori-bank.account-verify.example を右から読むと、本当の持ち主は account-verify.example です。"},{"id":"phishing-2","module":"phishing","step":"first","core":false,"question":"「24時間以内に確認しないと口座を凍結します」というメール。まずすることは？","choices":["凍結されると困るので、すぐにメールのリンクを開いて確認する","立ち止まり、公式アプリや自分で調べた公式の連絡先で確かめる","メールに返信して、本当に凍結されるのかを相手に問い合わせる"],"answer":1,"explain":"急かす・脅すのはフィッシングの典型的な手口です。メッセージ内のリンクは使わずに確かめましょう。"},{"id":"phishing-3","module":"phishing","step":"all","core":false,"question":"SNSで「当選したのでギフトカードの番号を送って」と言われた。正しい判断は？","choices":["名前や住所ではなく番号だけなら、送ってもよい","詐欺の典型なので送らず、大人に相談する","当選したことを、友達にも教えてあげる"],"answer":1,"explain":"ギフトカードの番号を送らせるのは詐欺の典型的な手口です。"},{"id":"network-1","module":"network","step":"send","core":true,"question":"HTTP（暗号化なし）でパスワードを送ると？","choices":["途中でのぞき見されると、そのまま読まれてしまう","パスワードの欄だけは、ブラウザが自動で暗号化する","送り先のサーバーにしか届かないので、のぞき見されない"],"answer":0,"explain":"HTTP では通信内容がそのまま流れるので、途中の機器でのぞき見されると読まれてしまいます。"},{"id":"network-2","module":"network","step":"visible","core":false,"question":"HTTPS で通信しているとき、のぞき見する人にも分かってしまうのは？","choices":["フォームに入力したパスワード","通信している相手のサイト名","表示しているページの文章や画像"],"answer":1,"explain":"中身は暗号化されますが、どのサイトと通信しているかは分かります。"},{"id":"network-3","module":"network","step":"lock","core":false,"question":"アドレスが https:// で始まる（鍵マーク）意味は？","choices":["そのサイトが本物で安全だという保証","通信の途中が暗号化されているということ","サイトにウイルスがないという保証"],"answer":1,"explain":"フィッシングサイトでも https は使えます。https（鍵マーク）は「通信路が暗号化されている」という意味です。本物かどうかは、ドメイン名で確かめます。"},{"id":"sns-1","module":"sns","step":"photo","core":true,"question":"写真を投稿するとき、場所が分かってしまう手がかりになるのは？","choices":["駅の看板や電柱にはってある住所の表示","写真の空にうつっている雲の形","投稿についた、いいねやコメントの数"],"answer":0,"explain":"背景の看板や住所表示、制服などから場所や学校が分かります。位置情報にも注意しましょう。"},{"id":"sns-2","module":"sns","step":"combine","core":false,"question":"1つ1つは小さな情報でも危ないのはなぜ？","choices":["組み合わせると、住所や学校など本人や生活が特定されるから","小さな情報をたくさん書くと、投稿が長くなりすぎるから","細かい話ばかりだと見る人が減り、いいねがつかないから"],"answer":0,"explain":"誕生日・行動の時間・学校までの距離などを組み合わせると、本人を特定できてしまいます。"},{"id":"sns-3","module":"sns","step":"fix","core":false,"question":"公開範囲を「友達だけ」にすれば、どんな投稿をしても安全？","choices":["友達しか見られない設定なので、どんな内容でも安全","保存やスクショで広がるので、安全とはいえない","友達の人数が少なければ、外に広がらないので安全"],"answer":1,"explain":"友達の範囲からも、保存やスクショ、転載で広がることがあります。だれに見られても困らない内容にしよう。"},{"id":"tattoo-1","module":"tattoo","step":"delete","core":true,"question":"自分の投稿を削除しても、消えないことがあるのはなぜ？","choices":["見た人が保存・スクショ・転載したコピーが残るから","削除ボタンは見た目だけで、本当は消えないしくみだから","インターネットは一度書きこむと、書きかえができないから"],"answer":0,"explain":"コピーは自分では消せません。これがデジタルタトゥーです。"},{"id":"tattoo-2","module":"tattoo","step":"quiz","core":false,"question":"人を傷つける投稿を見つけたときの行動として、よいのは？","choices":["みんなに知らせるため、友達にも共有して注意する","広げずに、必要ならサービスへの通報や大人への相談をする","証拠としてスクショし、ほかのSNSにも載せておく"],"answer":1,"explain":"共有すると、さらに広げる手伝いをしてしまいます。"},{"id":"copyright-1","module":"copyright","step":"first","core":true,"question":"歌詞の一部を使って感想を書くとき、守るべきルールは？","choices":["引用のルール（自分の文章が中心・区別・出典・必要な範囲）","歌手と曲の名前さえ書けば、歌詞を全部のせてもよい","1〜2行の一部だけなら、決まりはなく自由に使ってよい"],"answer":0,"explain":"引用のルール（公表された作品から、自分の文章が中心、かぎかっこで区別して変えずに使う、出典を書く、必要な範囲だけ）を守れば、許可なく一部を使うことができます。"},{"id":"copyright-2","module":"copyright","step":"first","core":false,"question":"テレビ番組を録画して家族と見るのは？","choices":["私的使用なので問題ない","テレビ局に許可をもらう必要がある","家族でも、録画して見るのは違法"],"answer":0,"explain":"自分や家族の範囲で楽しむための録画は私的使用として認められています。ネットに上げるのは別です。違法にアップロードされたものと知りながらダウンロードすることも、法律で禁止されています。"},{"id":"copyright-3","module":"copyright","step":"all","core":false,"question":"「フリー素材」を使う前にすべきことは？","choices":["フリーなので、何もしなくてよい","利用規約（条件）を確認する","作者に使用料をはらう"],"answer":1,"explain":"クレジット表記や加工の可否などの条件が決められていることがほとんどです。"},{"id":"roleplay-1","module":"roleplay","step":"first","core":true,"question":"知らない人から「どこの中学？写真送って」とDMが来た。どうする？","choices":["何回かやりとりして仲良くなったら、送ってよい","送らずにやりとりをやめ、家族や先生に相談する","本当の学校がばれないよう、うその学校名だけ送る"],"answer":1,"explain":"相手が言っている年齢や立場が本当とは限りません。うその学校名でも、やりとりが続くと、写真や会う約束を求められることがあります。やりとりをやめて、家族や先生に相談しよう。"},{"id":"roleplay-2","module":"roleplay","step":"first","core":false,"question":"無料の写真加工アプリが連絡先へのアクセスを求めてきた。どうする？","choices":["使えないと困るので、全部許可する","写真加工に必要ないので許可しない","とりあえず許可して、あとで設定を見直す"],"answer":1,"explain":"機能に本当に必要な権限だけを許可しましょう。"},{"id":"roleplay-3","module":"roleplay","step":"all","core":false,"question":"友達のパスワードを知ってしまった。その友達のアカウントに勝手にログインすると？","choices":["見るだけで何も変えなければ、問題ない","不正アクセス禁止法に違反する犯罪になる","仲のよい友達のアカウントなら、ゆるされる"],"answer":1,"explain":"他人のIDとパスワードで許可なくログインすることは犯罪です。"},{"id":"declare-1","module":"declare","step":"choose","core":true,"question":"ネットでトラブルにあったとき、いちばん大切な行動は？","choices":["心配をかけないよう、だれにも言わずに自分で解決する","一人でかかえこまず、家族や先生に相談する","相手をブロックして、なかったことにして忘れる"],"answer":1,"explain":"早めに相談すれば、被害を小さくできます。"},{"id":"digital-1","module":"digital","step":"resolution","core":true,"question":"画像の横と縦の画素数をそれぞれ2倍にすると、データ量（圧縮しないとき）は？","choices":["2倍","4倍","変わらない"],"answer":1,"explain":"データ量は画素の数に比例します。横2倍×縦2倍で、画素の数は4倍になります。"},{"id":"digital-2","module":"digital","step":"tone","core":false,"question":"1画素の色を表すビット数を1ビット増やすと、表せる段階の数は？","choices":["1つ増える","2倍になる","10倍になる"],"answer":1,"explain":"1ビット増えるごとに、表せる段階は2倍になります（2ビットで4段階、3ビットで8段階）。"},{"id":"digital-3","module":"digital","step":"sound","core":false,"question":"音のデジタル化で、「一定の時間ごとに波の高さをはかる」ことを何という？","choices":["標本化","量子化","圧縮"],"answer":0,"explain":"時間ごとにはかるのが標本化、はかった高さを決まった段階の数で表すのが量子化です。"},{"id":"digital-4","module":"digital","step":"compress","core":false,"question":"写真の JPEG のように、細かい部分を捨ててデータを小さくし、完全には元に戻らない圧縮は？","choices":["可逆圧縮","非可逆圧縮","ランレングス圧縮"],"answer":1,"explain":"完全に元に戻せる圧縮が可逆圧縮、戻らないかわりに大きく小さくできるのが非可逆圧縮です。"},{"id":"tattoo-3","module":"tattoo","step":"responsibility","core":false,"question":"ほかの人のうその投稿を再投稿（シェア）した。正しい考え方は？","choices":["自分が書いた文ではないので、責任は元の投稿者だけにある","広げた人も発信者として責任を問われることがある","匿名のアカウントなら、だれがしたか分からないので関係ない"],"answer":1,"explain":"再投稿も発信です。うそや人を傷つける情報を広げると、責任を問われることがあります。"},{"id":"copyright-4","module":"copyright","step":"responsibility","core":false,"question":"自分で描いたイラストの著作権は、いつ生まれる？","choices":["役所に作品を届け出て、登録されたとき","作品を作った時点で自動的に","SNSなどで公開して、多くの人に見られたとき"],"answer":1,"explain":"著作権は作った時点で自動的に生まれます。中学生の作品も同じです。"}]},"roleplay":{"_note":"判断ロールプレイの分岐ストーリー。nodes の choices の next で進み、end（good/ok/bad）で終わる。先生が追加・変更してよい。","stories":[{"id":"dm","title":"知らない人からのDM","start":"s1","nodes":{"s1":{"text":"同じゲームが好きだという知らない人から、DMが届いた。「いつも投稿見てるよ！ 同じ中学2年だよ。仲良くしよう😊」","choices":[{"label":"同じゲーム好きならいいかな。返信して仲良くする","next":"s2"},{"label":"返信しない。しつこければブロックして、家族に伝える","next":"e_good"}]},"s2":{"text":"何日かやりとりが続いた。相手から「どこの中学？」「顔写真送ってよ。ぼくのも送るから」と言われた。","choices":[{"label":"仲良くなったし、学校名と写真を送る","next":"e_bad"},{"label":"「それは教えられない」と断り、やりとりをやめて、家族や先生に相談する","next":"e_ok"}]},"e_good":{"end":"good","title":"安全な判断！","text":"ネットでは、年齢や性別をいつわることが簡単にできます。知らない人とのやりとりは、始めないのがいちばん安全です。"},"e_ok":{"end":"ok","title":"途中で気づけた！","text":"個人情報や写真を求められた時点で、立ち止まれたのは大切な判断です。相手が本当に同じ中学生とは限りません。やりとりの記録は消さずに、大人と一緒に対応しよう。"},"e_bad":{"end":"bad","title":"危ない状況です","text":"送った写真や学校名は、悪用されたり、会うように迫られたりするきっかけになります。一度送ったものは取り消せません。すぐに家族や先生に相談しよう。今からでも遅くありません。"}}},{"id":"app","title":"無料アプリの権限","start":"s1","nodes":{"s1":{"text":"話題の無料写真加工アプリを入れたら、「連絡先・位置情報・マイク・カメラ・写真へのアクセスを許可しますか？」と次々に表示された。","choices":[{"label":"早く使いたいので、全部「許可」をおす","next":"s2"},{"label":"写真加工に必要な「写真」「カメラ」だけ許可し、ほかは許可しない","next":"e_good"},{"label":"いったん止めて、提供元やレビューを家族と一緒に確かめる","next":"e_good2"}]},"s2":{"text":"数日後、友達から「変なアプリの招待メッセージが届いたよ」と言われた。連絡先の全員に、勝手に送られていたらしい。","choices":[{"label":"自分が送ったわけではないので、放っておく","next":"e_bad"},{" <script>
"use strict";
// ---- js/store.js ----
const __m_js_store_js = (() => {

// 進捗・ふりかえりの保存（この端末のブラウザ内 localStorage のみ。外部には送らない）
// 注意: パスワード入力欄の値はここに絶対に渡さない。

const STORE_KEY = "seclab.v1";

function emptyState() {
  return {
    version: 1,
    student: { cls: "", num: "", name: "" },
    modules: {}, // { [moduleId]: { steps: { [stepId]: isoDate }, score: {...} } }
    reflections: {}, // { [moduleId]: { text, at } }
    updatedAt: null,
  };
}

let state = load();
const listeners = new Set();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return emptyState();
    const parsed = JSON.parse(raw);
    return { ...emptyState(), ...parsed };
  } catch {
    return emptyState();
  }
}

function save() {
  state.updatedAt = new Date().toISOString();
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch {
    // プライベートモード等で保存できない場合も、画面上の体験は続けられる
  }
  listeners.forEach((fn) => fn(state));
}

const store = {
  get state() {
    return state;
  },
  subscribe(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  },
  completeStep(moduleId, stepId) {
    const m = (state.modules[moduleId] ||= { steps: {}, score: {} });
    if (m.steps[stepId]) return false;
    m.steps[stepId] = new Date().toISOString();
    save();
    return true;
  },
  isStepDone(moduleId, stepId) {
    return Boolean(state.modules[moduleId]?.steps?.[stepId]);
  },
  setScore(moduleId, key, value) {
    const m = (state.modules[moduleId] ||= { steps: {}, score: {} });
    m.score[key] = value;
    save();
  },
  getScore(moduleId, key) {
    return state.modules[moduleId]?.score?.[key];
  },
  // 空の文を保存したとき（全部消したとき）は、記録からも消す
  setReflection(moduleId, text) {
    if (text) state.reflections[moduleId] = { text, at: new Date().toISOString() };
    else delete state.reflections[moduleId];
    save();
  },
  getReflection(moduleId) {
    return state.reflections[moduleId]?.text || "";
  },
  setStudent(info) {
    state.student = { ...state.student, ...info };
    save();
  },
  replaceAll(next) {
    state = { ...emptyState(), ...next };
    save();
  },
  reset() {
    state = emptyState();
    save();
  },
};

return { store };
})();

const __m_js_ui_js = (() => {

  { id: "compare", title: "「長さ」と「文字の種類」、どちらが効く？" },
  { id: "passphrase", title: "パスフレーズを作ってみよう" },
  { id: "quiz", title: "いちばん強いのはどれ？" },
  { id: "reflect", title: "ふりかえり" },
];

let rateLog10 = 10;
const rateListeners = new Set();
function setRate(v) {
  rateLog10 = v;
  rateListeners.forEach((fn) => fn());
}

function rateSelect(idSuffix) {
  const sel = h("select", { id: `rate-${idSuffix}` }, RATES.map((r) => h("option", { value: r.log10, selected: r.log10 === rateLog10 ? true : null }, `${r.label}（${r.note}）`)));
  sel.addEventListener("change", () => setRate(Number(sel.value)));
  rateListeners.add(() => (sel.value = String(rateLog10)));
  return h("div", { class: "field" }, h("label", { for: `rate-${idSuffix}` }, "攻撃する側の速さ（仮定）"), sel, h("span", { class: "hint" }, "実際の速さは、パスワードの保存方法や攻撃の方法によって大きく変わります。ここでは仮定を変えて比べてみよう。"));
}

const passwordModule = {
  id: ID,
  minutes: "15分",
  lead: "パスワードは「長さ」と「文字の種類」で強さが決まります。総当たり（すべての組み合わせを試す）で解読するのに、どれくらい時間がかかるかを体験しよう。",
  steps: STEPS,
  async render(root) {
    rateListeners.clear();
    rateLog10 = Number((await getConfig()).defaultAttackRate ?? 10);
    const [commonData, wordData] = await Promise.all([loadData("common-passwords"), loadData("passphrase-words")]);
    const commonSet = new Set(commonData.words);
    const cards = STEPS.map((s, i) => stepCard(ID, s, i));

    root.append(
      explainCard(
        "⚠ 本物のパスワードは入力しないで",
        "ここには、練習用のでたらめな文字を入れてください。入力した文字はこの画面の中だけで計算に使い、保存も送信もしません（ページを閉じると消えます）。",
        "warn",
      ),
    );

    // ステップ1: 入力して解読時間を見る
    {
      const c = cards[0];
      const input = h("input", { type: "text", id: "pw-input", autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-describedby": "pw-result", placeholder: "例: neko123" });
      const result = h("div", { id: "pw-result", class: "result-box", "aria-live": "polite" });
      // 入力欄のすぐ下の1行（タブレットで画面キーボードが出ても、打ちながら結果が見えるように）。読み上げは下の結果だけにする
      const quick = h("div", { class: "hint pw-quick", "aria-hidden": "true", style: "margin-top:4px;font-weight:700;min-height:1.5em" });
      const samples = ["neko", "neko1234", "Neko#1234", "password", "P@ssw0rd", "Sakur@2026!", "tq7vmz2kpw9xrb"];
      const update = () => {
        const pw = input.value;
        if (!pw) {
          quick.textContent = "";
          result.replaceChildren(h("p", { class: "hint" }, "文字を入力するか、下の例をおしてみよう。"));
          return;
        }
        const a = analyze(pw, commonSet);
        const logSec = crackSeconds(a.log10Combos, rateLog10);
        const r = rating(logSec, a.weakness);
        const mark = r.level === "good" ? "◎ " : r.level === "warn" ? "△ " : "× ";
        const time = a.weakness ? "一瞬で見つかるおそれ" : formatDuration(logSec);
        const universe = a.weakness ? "" : universeCompare(logSec);
        const note = powNote(a.log10Combos, a.weakness ? -Infinity : durationLog10(logSec));
        quick.textContent = `結果: ${mark}${r.label}（${a.weakness ? time : `${rateLabel(rateLog10)}試すと ${time}`}）`;
        result.replaceChildren(
          h("div", {}, h("span", { class: `status ${r.level}` }, mark, r.label)),
          h("p", { style: "margin:8px 0 0" }, a.weakness ? "よく使われる言葉やパターンから先に試されるので" : `${rateLabel(rateLog10)}試すと、すべての組み合わせを試し終わるまで`),
          h("div", { class: "big-number" }, time),
          universe ? h("p", { style: "margin:0" }, `（${universe}）`) : "",
          a.weakness ? "" : h("p", { class: "hint", style: "margin:4px 0 0" }, "これは「いちばん長くかかる」場合の時間です。運がよければ、その半分くらいで見つかることもあります。"),
          a.weakness
            ? explainCard(
                "総当たりより先に見つかる理由",
                `${a.weakness.text}。${/^leet/.test(a.weakness.kind) ? "a を @ に、o を 0 にするような置きかえはよく知られていて、辞書の言葉と同じように最初に試されます。" : ""}攻撃する側は、まず「よく使われるパスワードの一覧（辞書）」や決まったパターンから試すので、組み合わせの数に関係なくすぐに見つかってしまいます。`,
                "bad",
              )
            : "",
          h(
            "ul",
            { class: "hint" },
            h("li", {}, `長さ: ${a.length}文字`),
            h("li", {}, `使っている文字の種類: ${a.classes.map((x) => `${x.label}(${x.size})`).join(" ＋ ") || "なし"} ＝ ${a.poolSize}種類`),
            h("li", {}, `組み合わせの数: ${a.poolSize} の ${a.length} 乗 ＝ 約${bigJaLog10(a.log10Combos)}通り`),
          ),
          a.converted ? h("p", { class: "hint" }, "全角の英数字や記号は、半角にそろえて計算しました。") : "",
          a.hasOther ? h("p", { class: "hint" }, "全角の文字やひらがな・漢字は、パスワードに使えないサービスが多いよ。") : "",
          note ? h("p", { class: "hint" }, note) : "",
          h("p", { class: "hint" }, "記号を混ぜたり、文字を記号に置きかえたりするより、長くする・使い回さないほうが効きます。"),
        );
        if (a.length >= 4) c.done();
      };
      input.addEventListener("input", update);
      rateListeners.add(update);
      c.body.append(
        h("p", {}, "文字の種類（英小文字・英大文字・数字・記号）と長さを変えると、解読にかかる時間はどう変わるかな？"),
        h("div", { class: "field" }, h("label", { for: "pw-input" }, "練習用の文字"), input, quick),
        h("div", { class: "btn-row" }, h("span", { class: "hint" }, "例:"), samples.map((s) => h("button", { class: "btn small secondary", type: "button", onclick: () => ((input.value = s), update()) }, s))),
        result,
        rateSelect("1"),
        explainCard("計算のしかた", "組み合わせの数 ＝ 文字の種類の数 を 長さの回数だけかけたもの。それを「1秒あたりに試せる回数」でわると、すべて試し終わるまでの時間が出ます。"),
      );
      update();
    }

    // ステップ2: グラフで比べる
    {
      const c = cards[1];
      const chart = h("div", { class: "chart" });
      const rateNote = h("p", { class: "hint", style: "margin:4px 0" });
      const drawChart = () => {
        chart.replaceChildren(...lengthChart(rateLog10));
        rateNote.textContent = `グラフの時間は、${rateLabel(rateLog10)}試す場合です（速さは下で変えられます）。`;
      };
      rateListeners.add(drawChart);
      drawChart();
      c.body.append(
        h("p", {}, "横じくが「長さ」、たてじくが「すべて試し終わるまでの時間」です。たてじくは、ふつうのグラフとちがい、上に行くほど時間が何千倍・何万倍にものびる目もりです（1秒→1日は約9万倍、1日→1年は365倍）。線が少し上がるだけで、時間はとても長くなります。"),
        h("ul", { class: "legend", "aria-hidden": "true" }, SERIES.map((s) => h("li", {}, h("span", { class: "sw", style: `background:${s.color}` }), s.label))),
        rateNote,
        chart,
        h("p", { class: "hint", style: "margin:4px 0 0" }, "グラフの上を押す（マウスをのせる）と、その長さの時間が出ます。下の「表で見る」でも同じ数字が見られます。"),
        rateSelect("2"),
        tableView(),
        choiceQuiz(
          {
            question: "英小文字だけの8文字のパスワード。強くするのに効果が大きいのはどっち？",
            choices: ["文字の種類を増やす（英大文字も使う）が、長さは8文字のまま", "英小文字だけのまま、長さを12文字にする"],
            answer: 1,
            explain: "英小文字26種類×8文字は約2088億通り。大文字を混ぜて52種類×8文字にすると約53兆通り（256倍）。英小文字だけで12文字にすると約9.5京通り（約46万倍）。長さを増やすと、かけ算の回数が増えるので効果がとても大きい。",
          },
          () => c.done(),
        ),
      );
    }

    // ステップ3: パスフレーズ
    {
      const c = cards[2];
      const out = h("div", { class: "result-box", "aria-live": "polite" }, h("p", { class: "hint" }, "ボタンをおすと、単語をランダムに選んでパスフレーズを作ります。"));
      const countSel = h("select", { id: "pp-count" }, [4, 5, 6, 7].map((n) => h("option", { value: n, selected: n === 6 ? true : null }, `${n}個`)));
      const words = wordData.words;
      const gen = () => {
        const n = Number(countSel.value);
        const pick = new Uint32Array(n);
        crypto.getRandomValues(pick);
        const phrase = [...pick].map((x) => words[x % words.length]).join("-");
        const a = analyze(phrase, commonSet);
        const logSecChars = crackSeconds(a.log10Combos, rateLog10);
        const logSecWords = crackSeconds(n * Math.log10(words.length), rateLog10);
        out.replaceChildren(
          h("div", { class: "big-number mono", style: "font-size:1.4rem;overflow-wrap:anywhere" }, phrase),
          h("p", {}, `${a.length}文字。${rateLabel(rateLog10)}試すとして、1文字ずつ総当たりすると ${formatDuration(logSecChars)}。`),
          explainCard(
            "もし攻撃する側が「この単語リストから選んだ」と知っていたら？",
            `このラボの単語リストは${words.length.toLocaleString("ja-JP")}語。組み合わせは ${words.length.toLocaleString("ja-JP")} の ${n} 乗 ＝ 約${bigJaLog10(n * Math.log10(words.length))}通り。${rateLabel(rateLog10)}試すと、すべて試すのに ${formatDuration(logSecWords)}${universeCompare(logSecWords) ? `（${universeCompare(logSecWords)}）` : ""}。${
              logSecWords < Math.log10(86400 * 365 * 100) ? "これでは足りません。単語の数を増やしてみよう。" : "リストを知られていても、ランダムに選んでいれば、とても時間がかかります。"
            }単語をランダムに選ぶことが大切です。有名な言葉の組み合わせや、少ない単語の中から選んだもの、辞書にある単語1つだけは弱いので注意。`,
            logSecWords < Math.log10(86400 * 365 * 100) ? "warn" : "good",
          ),
          powNote(a.log10Combos, n * Math.log10(words.length), durationLog10(logSecChars), durationLog10(logSecWords)) ? h("p", { class: "hint" }, powNote(a.log10Combos, n * Math.log10(words.length), durationLog10(logSecChars), durationLog10(logSecWords))) : "",
          h("p", { class: "hint" }, "速さは、ステップ1・2の「攻撃する側の速さ（仮定）」で変えられます。"),
        );
        c.done();
      };
      rateListeners.add(() => out.querySelector(".big-number") && gen());
      c.body.append(
        h("p", {}, "パスフレーズは、いくつかの単語をつなげたパスワードです。長いのに覚えやすいのが利点です。数千語の中から、5〜6個の単語をランダムに選ぶのが目安です。"),
        h("div", { class: "field-row" }, h("div", { class: "field" }, h("label", { for: "pp-count" }, "単語の数"), countSel)),
        h("div", { class: "btn-row" }, h("button", { class: "btn", type: "button", onclick: gen }, "パスフレーズを作る")),
        out,
        explainCard("覚え方のコツ", "単語から情景を思いうかべると覚えやすくなります（例: neko-sora-hashiru-ringo-yuki-densha → 猫が空を走って、りんごと雪の電車に乗る）。ただし、有名な歌詞やことわざは辞書に入っていることがあるので避けよう。"),
      );
    }

    // ステップ4: クイズと対策
    {
      const c = cards[3];
      c.body.append(
        choiceQuiz(
          {
            question: "次のうち、いちばん強いパスワードはどれ？（どれも練習用の例）",
            choices: ["P@ssw0rd", "Sakura2026!", "Xy7#", "kumo-ringo-hashiru-ame"],
            answer: 3,
            explain: "「P@ssw0rd」は password の文字を記号に置きかえただけで、辞書攻撃ですぐに見つかります。「Sakura2026!」も言葉＋年号の定番パターン。「Xy7#」は文字の種類は多いけれど4文字しかありません。「kumo-ringo-hashiru-ame」は、ランダムに選んだ単語がいくつもつながっていて長いので、この中ではいちばん強くなります。ただし、有名な言葉の組み合わせや、少ない単語の中から選んだものは弱くなります。本物のパスフレーズは、数千語の中からランダムに5〜6個を選ぼう。",
          },
          () => c.done(),
        ),
        h("h3", {}, "パスワードを守るための対策"),
        h(
          "ul",
          {},
          h("li", {}, h("strong", {}, "長くする: "), "12文字以上。パスフレーズなら、ランダムに選んだ単語を5〜6個に。"),
          h("li", {}, h("strong", {}, "使い回さない: "), "1つのサービスから流出すると、同じパスワードの別のサービスまで乗っ取られます。"),
          h("li", {}, h("strong", {}, "覚えきれないとき: "), "パスワード管理アプリやブラウザの保存機能を、家の人と相談して使おう（紙に書くなら持ち歩かず、家の決まった場所にしまう）。"),
          h("li", {}, h("strong", {}, "定期的に変えなくてよい: "), "変えるのは、もれたかもしれないときや、人に見られたとき。そのときはすぐに変えよう。"),
          h("li", {}, h("strong", {}, "2段階認証（多要素認証）を使う: "), "パスワードが知られても、スマホなどの確認がないとログインできません。"),
          h("li", {}, h("strong", {}, "人に教えない: "), "仲のよい友達でも教えない。メールやメッセージでパスワードを聞かれても答えない（先生や家族を名乗っていても、直接会って確かめる）。家の人と決めたルールがあれば、それにしたがおう。"),
        ),
        threeSteps({ stop: "パスワードを聞かれたら手を止める", check: "本当に公式の画面か確かめる", ask: "変だと思ったら大人に相談" }),
      );
    }

    // ステップ5: ふりかえり
    cards[4].body.append(reflectionBox(ID, "長いパスワードやパスフレーズが強いのは、なぜだと思う？ 一言で書こう。", () => cards[4].done()));

    root.append(...cards.map((c) => c.el));
  },
};

// ---- グラフ（長さ × 文字の種類 → 解読時間, たてじくは対数） ----
const YEAR = 86400 * 365;
const REF_LINES = [
  { log10: -3, label: "0.001秒" },
  { log10: 0, label: "1秒" },
  { log10: Math.log10(86400), label: "1日" },
  { log10: Math.log10(YEAR), label: "1年" },
  { log10: Math.log10(YEAR * 1e4), label: "1万年" },
  { log10: Math.log10(YEAR * 1.38e10), label: "宇宙の年齢" },
  // 京より大きい単位は使わず、宇宙の年齢（約138億年）の何倍かで表す
  { log10: Math.log10(YEAR * 1.38e14), label: ["宇宙の年齢", "の1万倍"] },
  { log10: Math.log10(YEAR * 1.38e18), label: ["宇宙の年齢", "の1億倍"] },
  { log10: Math.log10(YEAR * 1.38e22), label: ["宇宙の年齢", "の1兆倍"] },
];
function lengthChart(rateL) {
  const W = 640, H = 340, m = { l: 56, r: 92, t: 12, b: 40 };
  const xs = Array.from({ length: 13 }, (_, i) => i + 4); // 4〜16文字
  const all = SERIES.flatMap((ser) => [4 * Math.log10(ser.size) - rateL, 16 * Math.log10(ser.size) - rateL]);
  const yMin = Math.floor(Math.min(...all)) - 1, yMax = Math.ceil(Math.max(...all)) + 1;
  const x = (len) => m.l + ((len - 4) / 12) * (W - m.l - m.r);
  const y = (lg) => m.t + (1 - (Math.max(yMin, Math.min(yMax, lg)) - yMin) / (yMax - yMin)) * (H - m.t - m.b);
  const NS = "http://www.w3.org/2000/svg";
  const s = (tag, attrs, text) => {
    const el = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (text !== undefined) el.textContent = text;
    return el;
  };
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "パスワードの長さと解読時間のグラフ。長さが1文字増えるごとに、時間は文字の種類の数の倍だけ増える。" });
  const grid = s("g", { class: "grid" });
  const axis = s("g", { class: "axis" });
  for (const r of REF_LINES.filter((r) => r.log10 >= yMin && r.log10 <= yMax)) {
    grid.append(s("line", { x1: m.l, x2: W - m.r, y1: y(r.log10), y2: y(r.log10) }));
    if (Array.isArray(r.label)) {
      const t = s("text", { x: m.l - 6, y: y(r.log10) - 2, "text-anchor": "end" });
      r.label.forEach((line, i) => t.append(s("tspan", { x: m.l - 6, dy: i ? 12 : 0 }, line)));
      axis.append(t);
    } else axis.append(s("text", { x: m.l - 6, y: y(r.log10) + 4, "text-anchor": "end" }, r.label));
  }
  for (const len of xs) {
    if (len % 2 === 0) axis.append(s("text", { x: x(len), y: H - m.b + 18, "text-anchor": "middle" }, `${len}`));
  }
  axis.append(s("text", { x: (m.l + W - m.r) / 2, y: H - 4, "text-anchor": "middle" }, "パスワードの長さ（文字）"));
  svg.append(grid, axis);
  const labelYs = [];
  SERIES.forEach((ser) => {
    const pts = xs.map((len) => [x(len), y(len * Math.log10(ser.size) - rateL)]);
    svg.append(s("path", { d: "M" + pts.map((p) => p.join(",")).join("L"), fill: "none", stroke: ser.color, "stroke-width": 2.5, "stroke-dasharray": ser.dash, "stroke-linecap": "round", "stroke-linejoin": "round" }));
    let ly = pts[pts.length - 1][1];
    for (const prev of labelYs) if (Math.abs(prev - ly) < 14) ly = prev + 14;
    labelYs.push(ly);
    svg.append(s("text", { x: W - m.r + 6, y: Math.max(m.t + 4, ly) + 4, class: "label" }, ser.label));
  });
  // ホバー用の縦線とツールチップ
  const cross = s("line", { y1: m.t, y2: H - m.b, stroke: "var(--text-muted)", "stroke-width": 1, "stroke-dasharray": "3 3", visibility: "hidden" });
  const dots = SERIES.map((ser) => s("circle", { r: 5, fill: ser.color, stroke: "var(--surface-1)", "stroke-width": 2, visibility: "hidden" }));
  svg.append(cross, ...dots);
  const hit = s("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" });
  svg.append(hit);
  const tip = h("div", { class: "tooltip", role: "presentation" });
  const show = (evt) => {
    const rect = svg.getBoundingClientRect();
    const px = ((evt.clientX - rect.left) / rect.width) * W;
    const len = Math.max(4, Math.min(16, Math.round(4 + ((px - m.l) / (W - m.l - m.r)) * 12)));
    cross.setAttribute("x1", x(len));
    cross.setAttribute("x2", x(len));
    cross.setAttribute("visibility", "visible");
    SERIES.forEach((ser, i) => {
      dots[i].setAttribute("cx", x(len));
      dots[i].setAttribute("cy", y(len * Math.log10(ser.size) - rateL));
      dots[i].setAttribute("visibility", "visible");
    });
    tip.replaceChildren(h("strong", {}, `${len}文字`), ...SERIES.map((ser) => h("div", {}, h("span", { class: "sw", style: `display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:${ser.color}` }), `${ser.label}: ${formatDuration(len * Math.log10(ser.size) - rateL)}`)));
    tip.style.display = "block";
    const left = (x(len) / W) * rect.width;
    tip.style.left = `${left > rect.width / 2 ? left - tip.offsetWidth - 12 : left + 12}px`;
    tip.style.top = `${8}px`;
  };
  // マウスはのせている間だけ出す。指やペンで押したときは、指をはなしても消さない（次に押した所に動く）
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", (evt) => {
    if (evt.pointerType && evt.pointerType !== "mouse") return;
    tip.style.display = "none";
    cross.setAttribute("visibility", "hidden");
    dots.forEach((d) => d.setAttribute("visibility", "hidden"));
  });
  return [svg, tip];
}

// グラフと同じ内容の表（色に頼らず読めるように）
function tableView() {
  const tbody = h("tbody");

  const data = buf.getChannelData(0);
  const levels = 2 ** bits;
  for (let i = 0; i < data.length; i++) {
    const t = i / sr;

// ただし、マウスや指で押している途中に書きかえると、そのクリックが消えてしまう
// （ふりかえりの自動保存は、章ナビを押した瞬間にも起きる）ので、はなしてから書きかえる。
let pointerIsDown = false;
let navPending = false;
function refreshNav() {
  navPending = false;
  renderNav(parseHash().id);
  renderOverall();
}
document.addEventListener("pointerdown", () => (pointerIsDown = true), true);
const pointerReleased = () => {
  pointerIsDown = false;
  if (navPending) setTimeout(refreshNav, 0);
};
document.addEventListener("pointerup", pointerReleased, true);
document.addEventListener("pointercancel", pointerReleased, true);
store.subscribe(() => {
  if (pointerIsDown) navPending = true;
  else refreshNav();
});
window.addEventListener("hashchange", route);
// 画面を閉じる・別のアプリに切りかえる・再読み込みするときも、書きかけのふりかえりを保存する
window.addEventListener("pagehide", flushReflections);
window.addEventListener("beforeunload", flushReflections);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushReflections();
});

reloadConfig();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

return {  };
})();
</script>
</body>
