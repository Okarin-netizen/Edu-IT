  <!-- 4分野共通の枠（色・ヘッダー・ボタン・フッター・このアプリについて）。1ファイル版では中に入れる -->
  <style id="eduit-frame-css">
/* Edu-IT 共通の枠(4分野・全アプリ共通)
 * 色・文字・ボタン・カード・ヘッダー・フッターの見た目をそろえるための部品。
 * 分野の色は <html data-ef-domain="A|B|C|D|G|T|M|F|Z"> で切りかわる(G は分野に入らない「技術分野のガイダンス」。T・M・F・Z は T-textbook/ の教科書順コースと3つの教材)。
 * アプリ固有の見た目は各アプリの CSS に残し、ここでは「枠」だけを決める。
 */
:root {
  color-scheme: light;      /* 端末がダークモードでも、4分野とも明るい画面で出す */
  --ef-font: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --ef-bg: #f5f4f0;          /* 画面の地 */
  --ef-surface: #ffffff;     /* カード・ヘッダー */
  --ef-surface-2: #f8f7f4;   /* 一段下げた面 */
  --ef-line: #d6d3cb;        /* 枠線 */
  --ef-text: #1f2328;
  --ef-muted: #565d68;
  --ef-focus: #f08c00;       /* キーボード操作の枠 */
  --ef-radius: 12px;
  --ef-radius-s: 8px;
  --ef-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .04);
  --ef-header-h: 52px;
  --ef-tap: 40px;            /* ボタンの最小の高さ */
  /* 分野の色(既定は D) */
  --ef-accent: #1a5fc8;
  --ef-accent-ink: #ffffff;
  --ef-accent-soft: #e6eefb;
}
:root[data-ef-domain="A"] { --ef-accent: #985a26; --ef-accent-soft: #f5e9dc; }  /* 材料と加工: 木の茶 */
:root[data-ef-domain="B"] { --ef-accent: #2e7d32; --ef-accent-soft: #e4f2e5; }  /* 生物育成: 緑 */
:root[data-ef-domain="C"] { --ef-accent: #b45309; --ef-accent-soft: #fbeedd; }  /* エネルギー変換: だいだい */
:root[data-ef-domain="D"] { --ef-accent: #1a5fc8; --ef-accent-soft: #e6eefb; }  /* 情報: 青 */
:root[data-ef-domain="G"] { --ef-accent: #0f766e; --ef-accent-soft: #e0f2ef; }  /* 技術分野のガイダンス(4分野の前): 青緑 */
:root[data-ef-domain="T"] { --ef-accent: #475569; --ef-accent-soft: #eef1f5; }  /* 教科書の順に進む学習コース(T-textbook/): 灰青 */
:root[data-ef-domain="M"] { --ef-accent: #9d174d; --ef-accent-soft: #fbe7ef; }  /* M 身の回りの技術さがし(各編のはじめ): 赤紫 */
:root[data-ef-domain="F"] { --ef-accent: #4338ca; --ef-accent-soft: #e8e8fb; }  /* F これからの技術ラボ(各編の最後): あい色 */
:root[data-ef-domain="Z"] { --ef-accent: #7c4a03; --ef-accent-soft: #f6ecdc; }  /* Z 学習を終えて(3年間のまとめ): こげ茶 */

/* ---- ヘッダー ----
 * メニュー:   <header class="ef-header"> <h1 class="ef-title"><span class="ef-code">A</span> 材料と加工の技術 教材集</h1>
 *               <div class="ef-tools"> ふりがな / 文字 中 / 使い方 / 先生用 </div> </header>   (4分野でこの4つだけ・字だけ)
 * アプリ:     <header class="ef-header"> <a class="ef-btn ef-back" href="…">◀ メニュー</a>
 *               <h1 class="ef-title"><span class="ef-code">A2</span> アプリ名</h1>
 *               <div class="ef-tools"> ふりがな / 文字の大きさ / くっきり / 使い方 / そのアプリだけのボタン </div> </header>
 *   同じ分野の教材を切りかえるボタンにも記号を出す(<button class="ef-btn"><span class="ef-code">D1</span> CPU</button>)。
 */
.ef-header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  min-height: var(--ef-header-h); padding: 6px 14px;
  background: var(--ef-surface); color: var(--ef-text);
  border-bottom: 3px solid var(--ef-accent);
  font-family: var(--ef-font);
  box-sizing: border-box;
}
.ef-title {
  display: flex; align-items: center; gap: 8px;
  margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--ef-text);
}
.ef-title .ef-icon { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; font-size: 22px; }
.ef-title .ef-sub { font-size: 13px; font-weight: 400; color: var(--ef-muted); }
.ef-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }

/* ---- ボタン ----
 * .ef-btn          ふつうのボタン(白地・枠線・丸角)
 * .ef-btn.is-on    ON の状態(分野の色で塗る)。aria-pressed="true" でも同じ
 * .ef-btn-primary  いちばん大事な操作(はじめる・ひらく など)
 */
.ef-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--ef-tap); padding: 0 14px;
  border: 1px solid var(--ef-line); border-radius: 999px;
  background: var(--ef-surface); color: var(--ef-text);
  font: 600 15px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
  box-sizing: border-box; white-space: nowrap;
}
.ef-btn:hover { border-color: var(--ef-accent); }
.ef-btn.is-on, .ef-btn[aria-pressed="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-back { color: var(--ef-accent); border-color: transparent; background: var(--ef-accent-soft); }
/* 上のバーの表示の道具(4分野で同じ形)。ふりがな・くっきりは .ef-toggle(ON で ✓)、文字の大きさは .ef-size(EduitFrame.sizeButton) */
.ef-toggle[aria-pressed="true"]::before { content: "✓"; }
.ef-size .ef-size-v {
  display: inline-block; min-width: 2em; padding: 0 .3em; border-radius: 6px;
  background: var(--ef-accent-soft); color: var(--ef-accent); font-weight: 700; text-align: center;
}
/* 「ふつう・大きい」の2段だけのとき: <button class="ef-btn ef-size" aria-pressed="false|true">文字 <span class="ef-size-v"></span></button>
 * (中身が空の .ef-size-v に「中」「大」を出す。ON でもボタンは塗らない) */
.ef-size[aria-pressed="true"] { background: var(--ef-surface); border-color: var(--ef-line); color: var(--ef-text); }
.ef-size[aria-pressed]::before { content: none; }
.ef-size[aria-pressed] .ef-size-v:empty::after { content: "中"; }
.ef-size[aria-pressed="true"] .ef-size-v:empty::after { content: "大"; }
/* タブの帯をスクロールで隠す(data-ef-autohide。隠すのは eduit-frame.js) */
[data-ef-autohide] { transition: transform .2s ease; }
[data-ef-autohide].ef-ah-hide { transform: translateY(var(--ef-ah-y, -110%)); }
@media (prefers-reduced-motion: reduce) { [data-ef-autohide] { transition: none; } }
.ef-btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 20px;
  border: 0; border-radius: var(--ef-radius-s);
  background: var(--ef-accent); color: var(--ef-accent-ink);
  font: 700 16px/1.2 var(--ef-font); text-decoration: none; cursor: pointer;
}
.ef-btn-primary:hover { filter: brightness(1.08); }
.ef-btn:focus-visible, .ef-btn-primary:focus-visible, .ef-about-link:focus-visible, .ef-dialog :focus-visible {
  outline: 3px solid var(--ef-focus); outline-offset: 2px;
}

/* ---- メニューのカード ----
 * <article class="ef-card"> <p class="ef-card-tag">A1</p> <h3 class="ef-card-title">…</h3> <p>…</p> <a class="ef-btn-primary">ひらく ▶</a> </article>
 * メニューのカードは EduitFrame.card() で作る(下の .ef-mcard)。
 */
.ef-page { background: var(--ef-bg); color: var(--ef-text); font-family: var(--ef-font); }
.ef-card {
  background: var(--ef-surface); border: 1px solid var(--ef-line); border-top: 4px solid var(--ef-accent);
  border-radius: var(--ef-radius); box-shadow: var(--ef-shadow); padding: 16px 18px;
}
.ef-card-tag { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ef-accent); }
.ef-card-title { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: var(--ef-text); }

/* ---- 記号の印(A1・B2・C3・D4 など。メニューの上のバー・アプリの上のバー・切りかえボタン・カード) ---- */
.ef-code {
  display: inline-flex; align-items: center; justify-content: center; min-width: 1.9em; padding: 0 .35em;
  border-radius: 6px; background: var(--ef-accent); color: var(--ef-accent-ink);
  font: 700 .9em/1.5 var(--ef-font); letter-spacing: .02em; white-space: nowrap; vertical-align: .05em;
}
.ef-title .ef-code { font-size: 15px; }
.ef-btn .ef-code { font-size: 13px; min-width: 0; margin-right: 2px; }
.ef-btn.is-on .ef-code, .ef-btn[aria-pressed="true"] .ef-code, .ef-btn[aria-current] .ef-code { background: var(--ef-accent-ink); color: var(--ef-accent); }

/* ---- メニューのカード(EduitFrame.card が作る。4分野同じ形) ---- */
.ef-mcard { display: flex; flex-direction: column; gap: 6px; min-height: 9rem; padding: 12px 16px 14px; cursor: pointer; font-family: var(--ef-font); color: var(--ef-text); transition: box-shadow .1s; }
.ef-mcard:hover { box-shadow: 0 2px 12px rgba(0, 0, 0, .14); }
.ef-mcard-hd { display: flex; align-items: center; gap: 10px; }
.ef-mcard-ic { flex: 0 0 auto; width: 1.4em; font-size: 2em; line-height: 1; text-align: center; }
.ef-mcard-ht { min-width: 0; }
.ef-mcard .ef-card-tag { margin: 0 0 2px; font-size: 14px; }
.ef-mcard .ef-card-title { margin: 0; font-size: 1.12em; line-height: 1.4; }
.ef-mcard-desc { margin: 0; font-size: .95em; line-height: 1.6; }
.ef-mcard-extra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: .88em; color: var(--ef-muted); }
.ef-mcard-go { margin-top: auto; align-self: flex-end; }
.ef-level-order { margin: -4px 0 12px; font-size: .95em; line-height: 1.6; }

/* ---- フッター(作成者・このアプリについて) ---- */
.ef-footer {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 14px;
  margin: 24px 0 0; padding: 12px 16px;
  border-top: 1px solid var(--ef-line); background: var(--ef-surface-2);
  font: 13px/1.6 var(--ef-font); color: var(--ef-muted);
}
.ef-footer .ef-author { font-weight: 700; color: var(--ef-text); }
.ef-about-link {
  border: 0; background: none; padding: 2px 4px; cursor: pointer;
  font: inherit; color: var(--ef-accent); text-decoration: underline;
}
/* ヘッダーなどに置く小さい「このアプリについて」ボタン */
.ef-about-btn { font-size: 14px; }

/* ---- このアプリについて(ダイアログ) ---- */
.ef-dialog {
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  padding: 0; border: 1px solid var(--ef-line); border-radius: var(--ef-radius);
  background: var(--ef-surface); color: var(--ef-text); font: 15px/1.7 var(--ef-font);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
}
.ef-dialog::backdrop { background: rgba(0, 0, 0, .4); }
.ef-dialog-in { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.ef-dialog-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 3px solid var(--ef-accent); }
.ef-dialog-head h2 { margin: 0; font-size: 18px; flex: 1; }
.ef-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px 0; }
.ef-tab { border: 1px solid var(--ef-line); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--ef-surface-2);
  padding: 6px 12px; font: 600 14px/1.3 var(--ef-font); color: var(--ef-text); cursor: pointer; min-height: 36px; }
.ef-tab[aria-selected="true"] { background: var(--ef-accent); border-color: var(--ef-accent); color: var(--ef-accent-ink); }
.ef-panel { padding: 14px 18px 18px; overflow: auto; border-top: 1px solid var(--ef-line); }
.ef-panel h3 { margin: 12px 0 4px; font-size: 16px; }
.ef-panel ul { margin: 4px 0 8px; padding-left: 1.3em; }
.ef-panel p { margin: 4px 0 8px; }
.ef-howto .ef-panel { border-top: 0; }
.ef-howto .ef-panel ol { margin: 4px 0 8px; padding-left: 1.5em; }
.ef-howto .ef-panel li { margin: 2px 0; }
.ef-hist-ver { font-weight: 700; color: var(--ef-accent); }
.ef-hist-date { color: var(--ef-muted); font-size: 13px; margin-left: 6px; }

/* 文字を大きくした・くっきりのときも読めるように */
/* 基本編・発展編のタブ(メニュー。EduitFrame.levels が作る) */
.ef-levels { margin: 0 0 18px; font-family: var(--ef-font); }
.ef-level-tabs { display: flex; gap: 0; border-bottom: 3px solid var(--ef-accent); }
.ef-level-tab {
  display: inline-flex; align-items: baseline; gap: 8px; min-height: 48px; padding: 8px 22px; margin: 0 6px -3px 0;
  font: inherit; font-size: 1.15em; font-weight: 700 !important; color: var(--ef-muted) !important; cursor: pointer;
  background: var(--ef-surface-2); border: 1px solid var(--ef-line); border-bottom: 3px solid var(--ef-accent);
  border-radius: var(--ef-radius-s) var(--ef-radius-s) 0 0;
}
.ef-level-tab:hover { color: var(--ef-text) !important; }
/* 教材ごとのボタンの色指定(#hub button など)に負けないように !important にする */
.ef-level-tab[aria-selected="true"], .ef-level-tab[aria-selected="true"]:hover { color: var(--ef-accent-ink) !important; background: var(--ef-accent) !important; border-color: var(--ef-accent) !important; }
.ef-level-tab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }
.ef-level-count { font-size: .72em; font-weight: 400; }
.ef-level-panel { padding: 12px 0 0; }
.ef-level-panel:focus { outline: none; }
.ef-level-lead { margin: 0 0 12px; color: var(--ef-muted); line-height: 1.6; }
.ef-level-advanced[aria-selected="true"], .ef-level-advanced[aria-selected="true"]:hover { background: #5b3fa8 !important; border-color: #5b3fa8 !important; }
.ef-level-tabs:has(.ef-level-advanced[aria-selected="true"]) { border-bottom-color: #5b3fa8; }
.ef-level-parts { margin: .3em 0 0; font-size: .9em; line-height: 1.5; color: var(--ef-text); }
.ef-level-parts summary { cursor: pointer; color: var(--ef-sub, #5e6b64); }
.ef-level-parts p { margin: .2em 0 0; }
.ef-mcard-tb { margin: .3em 0 0; font-size: .85em; line-height: 1.5; color: var(--ef-muted); }
.ef-level-group { display: flex; align-items: baseline; gap: .5em; margin: 18px 0 10px; padding: 0 0 4px; border-bottom: 1px solid var(--ef-line); font-size: 1.1em; color: var(--ef-text); }
.ef-level-group:first-of-type { margin-top: 4px; }
.ef-level-group-ch { font-size: .8em; font-weight: 700; color: var(--ef-accent); }
/* 区切りのはじめ・おわりの M・F へのリンクの行(EDUIT_INFO.textbook.links) */
.ef-level-link { margin: 6px 0 12px; line-height: 1.6; }
.ef-level-link a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--ef-line); border-radius: var(--ef-radius-s, 8px); background: #fff; color: var(--ef-text); text-decoration: none; font-weight: 600; }
.ef-level-link a:hover, .ef-level-link a:focus-visible { border-color: var(--ef-accent); }
.ef-level-link-go { color: var(--ef-accent); font-weight: 700; }
.ef-level-matome { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 14px; border: 2px solid var(--ef-accent); border-radius: var(--ef-radius-s, 8px); background: #fff; color: var(--ef-text); font: inherit; cursor: pointer; text-align: left; }
.ef-level-matome:hover, .ef-level-matome:focus-visible { background: var(--ef-bg, #f6f7f5); }
.ef-level-matome-t { font-weight: 700; }
.ef-level-matome-d { color: var(--ef-sub, #5e6b64); font-size: .92em; }
.ef-matome-score { font-weight: 700; }
.ef-matome-h { display: flex; align-items: center; gap: 6px; margin: 16px 0 4px; font-size: 1.05em; }
.ef-level-parts-k {
  display: inline-block; margin-right: .5em; padding: 0 .5em; font-size: .85em; font-weight: 700;
  color: var(--ef-accent); background: var(--ef-accent-soft); border-radius: 999px;
}

/* 振り返りを隠す設定(EduitFrame.furikaeri)。振り返りのタブ・欄・印には data-ef-reflect を付ける */
html[data-ef-furikaeri="off"] [data-ef-reflect] { display: none !important; }

/* ---- スマホ(せまい画面) ----
 * 上のバー: 名前を1行目に、道具が入りきらないときは次の行へ。ボタンは少し小さくする。
 * 名前(.ef-title)は 9em 以上の幅を取るので、せまい画面では道具が下の行に回る。
 */
@media (max-width: 640px) {
  .ef-header { gap: 6px; padding: 6px 10px; }
  .ef-title { flex: 1 1 9em; min-width: 0; font-size: 16px; }
  .ef-tools { gap: 4px; }
  .ef-header .ef-btn { min-height: 36px; padding: 0 10px; font-size: 14px; }
  .ef-level-tab { padding: 6px 14px; min-height: 44px; font-size: 1.05em; }
  .ef-mcard { min-height: 0; }
  .ef-dialog { width: calc(100vw - 16px); max-height: calc(100vh - 16px); }
  .ef-panel { padding: 12px; }
}

@media print { .ef-footer, .ef-dialog { display: none !important; } }

/* ---- 自習ガイド(自習モードのとき。EduitFrame が作る) ----
 * .ef-jishu-fab  右はしのたてのボタン「自習ガイド 2/5」
 * .ef-jishu      右に開くパネル(スマホは下から出る)。教材を操作しながら読めるように、まわりを暗くしない
 */
.ef-jishu-fab {
  position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 2147483000;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 7px; border: 0; border-radius: 10px 0 0 10px;
  background: var(--ef-accent); color: var(--ef-accent-ink); cursor: pointer;
  font: 700 15px/1.2 var(--ef-font); box-shadow: -2px 2px 10px rgba(0, 0, 0, .25);
}
.ef-jishu-fab-t { display: block; width: 1.05em; line-height: 1.15; word-break: break-all; text-align: center; }  /* 1字ずつ縦にならべる(writing-mode だと字が重なる端末がある) */
.ef-jishu-fab-p { font-size: 12px; font-weight: 700; background: rgba(255, 255, 255, .25); border-radius: 999px; padding: 1px 5px; }
.ef-jishu-fab:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 2px; }
html.ef-jishu-open .ef-jishu-fab { display: none; }
.ef-jishu {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 2147483001;
  width: min(380px, 100vw); display: flex; flex-direction: column; box-sizing: border-box;
  background: var(--ef-surface); color: var(--ef-text); border-left: 1px solid var(--ef-line);
  box-shadow: -6px 0 24px rgba(0, 0, 0, .18); font: 15px/1.65 var(--ef-font); font-size: max(15px, .95rem); text-align: left;
}
.ef-jishu[hidden] { display: none; }
.ef-jishu *, .ef-jishu *::before { box-sizing: border-box; }
.ef-jishu-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 3px solid var(--ef-accent); }
.ef-jishu rt { display: ruby-text !important; font-size: .55em; font-weight: 400; }  /* 教材のふりがなをオフにしても、ガイドのふりがなはガイドのボタンで決める */
.ef-jishu-head h2 { flex: 1; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 0; font-size: 16px; line-height: 1.35; }
.ef-jishu-k { color: var(--ef-accent); }
.ef-jishu-name { font-weight: 700; }
.ef-jishu-body { flex: 1; overflow-y: auto; padding: 4px 14px 24px; overscroll-behavior: contain; }
.ef-jishu h3 { margin: 14px 0 6px; font-size: 15px; color: var(--ef-accent); }
.ef-jishu p { margin: 0 0 6px; line-height: 1.85; }
.ef-jishu-goal { padding: 2px 0 4px; border-bottom: 1px solid var(--ef-line); }
.ef-jishu-time, .ef-jishu-note { font-size: 13px; color: var(--ef-muted); }
.ef-jishu-steps, .ef-jishu-qs { list-style: none; margin: 0; padding: 0; }
.ef-jishu-step { margin: 0 0 10px; padding: 10px 12px; border: 1px solid var(--ef-line); border-radius: var(--ef-radius-s); background: var(--ef-surface-2); }
.ef-jishu-step.is-done { background: var(--ef-accent-soft); border-color: var(--ef-accent); }
.ef-jishu-step-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ef-jishu-n { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%;
  background: var(--ef-accent); color: var(--ef-accent-ink); font-size: 13px; font-weight: 700; }
.ef-jishu-where { font-size: 13px; font-weight: 700; color: var(--ef-accent); }
.ef-jishu-do { font-weight: 600; }
.ef-jishu-line { display: block; }
.ef-jishu-tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.ef-jishu .ef-jishu-small { min-height: 32px; padding: 0 10px; font-size: 13px; }
.ef-jishu-hint { margin: 6px 0; padding: 8px 10px; border-left: 4px solid var(--ef-focus); background: #fff8e6; font-size: 14px; }
.ef-jishu-hint[hidden] { display: none; }
.ef-jishu-done { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 14px; font-weight: 700; cursor: pointer; }
.ef-jishu-done input { width: 20px; height: 20px; accent-color: var(--ef-accent); }
.ef-jishu-q { margin: 0 0 12px; padding: 10px 12px; border: 1px solid var(--ef-line); border-radius: var(--ef-radius-s); }
.ef-jishu-qt { font-weight: 700; }
.ef-jishu-choices { display: flex; flex-direction: column; gap: 6px; }
.ef-jishu-choice {
  min-height: 38px; padding: 6px 10px; text-align: left; cursor: pointer;
  font: 14px/1.5 var(--ef-font); color: var(--ef-text); background: var(--ef-surface); border: 1px solid var(--ef-line); border-radius: var(--ef-radius-s);
}
.ef-jishu-choice:hover { border-color: var(--ef-accent); }
.ef-jishu-choice:focus-visible { outline: 3px solid var(--ef-focus); outline-offset: 1px; }
.ef-jishu-choice.is-ok { background: #e3f4e4; border-color: #2e7d32; font-weight: 700; }
.ef-jishu-choice.is-ok::before { content: "○ "; color: #2e7d32; }
.ef-jishu-choice.is-ng { background: #fdecea; border-color: #c62828; }
.ef-jishu-choice.is-ng::before { content: "× "; color: #c62828; }
.ef-jishu-res { margin: 6px 0 0; font-size: 14px; }
.ef-jishu-res.is-ok strong { color: #2e7d32; }

.spread-svg .edge { stroke: var(--border); stroke-width: 1.2; }
.spread-svg .node { fill: var(--surface-2); stroke: var(--text-muted); stroke-width: 1.5; transition: fill 0.3s; }
.spread-svg .node.seen { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
.spread-svg .node.copy { fill: var(--series-2); stroke: var(--text-primary); stroke-width: 2.5; }
.spread-svg .node.me { fill: var(--accent); stroke: var(--text-primary); stroke-width: 2.5; }
.spread-svg .node.deleted { fill: var(--surface-1); stroke: var(--text-muted); stroke-dasharray: 3 3; }
.spread-svg .node-label { font-size: 8px; fill: var(--surface-1); font-weight: 700; font-family: var(--font); pointer-events: none; }
.spread-stats { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; font-size: 0.92rem; }
.legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background: var(--surface-2); border: 1.5px solid var(--text-muted); }
.legend .dot.me { background: var(--accent); border-color: var(--text-primary); }
.legend .dot.seen { background: var(--series-1); border-color: var(--series-1); }
.legend .dot.copy { background: var(--series-2); border-color: var(--text-primary); }
@media (prefers-reduced-motion: reduce) { .spread-svg .node { transition: none; } }

/* 分岐型 */
.branch-log { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 10px; }
.branch-log > li { border-left: 3px solid var(--border); padding-left: 12px; }
.branch-q { margin: 0 0 4px; }
.branch-a { margin: 0; font-weight: 700; color: var(--accent); }
.case-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }

/* 行動宣言 */
.action-group { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px 12px; margin: 0 0 10px; }
.action-group legend { font-weight: 700; padding: 0 6px; }
.check-item:has(input:disabled) { opacity: 0.55; cursor: not-allowed; }
.declare-card { border: 3px double var(--accent); border-radius: 14px; padding: 20px 24px; background: var(--surface-1); }
.declare-title { font-size: 1.3rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
.declare-card ol { font-size: 1.1rem; font-weight: 700; line-height: 2; }
@media print {
  body.print-card main > *:not(:has(#declare-card)) { display: none; }
  body.print-card .card:not(:has(#declare-card)) { display: none; }
  body.print-card .module-head, body.print-card .btn-row, body.print-card .step-title { display: none; }
  body.print-card .card { border: none; box-shadow: none; }
}

/* 理解度チェック */
.check-q { border: 1px solid var(--border); }
.check-q legend { font-weight: 700; padding: 0; float: left; width: 100%; margin-bottom: 6px; }
.check-q .badge { font-size: 0.75rem; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.check-q .check-list { margin-top: 10px; clear: both; }
.check-q.is-correct { border-color: var(--good); }
.check-q.is-wrong { border-color: var(--bad); }

/* 表示の切りかえ */
.display-toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.display-toggles .toggle {
  font: inherit; font-size: 0.8rem; padding: 4px 10px; border-radius: 99px; border: 1.5px solid var(--border);
  background: var(--surface-1); color: var(--text-secondary); cursor: pointer; min-height: 32px;
}
.display-toggles .toggle[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.display-toggles .toggle[aria-pressed="true"]::before { content: "✓ "; }
html.large-text { font-size: 20px; }
.easy-summary { display: none; }
html.easy-mode .easy-summary { display: block; }
.easy-step { background: var(--accent-soft); border-radius: 8px; padding: 6px 12px; margin: 0 0 10px; font-size: 0.95rem; }
.easy-step .easy-tag { font-weight: 700; color: var(--accent); margin-right: 8px; font-size: 0.85rem; }
ruby rt { font-size: 0.55em; color: var(--text-secondary); font-weight: 400; }
ruby { ruby-align: center; }
@media (max-width: 860px) { html.large-text { font-size: 18px; } .display-toggles { order: 3; width: 100%; } }

/* デジタル化 */
.pixel-canvas { width: 100%; max-width: 320px; height: auto; image-rendering: pixelated; border-radius: 8px; border: 1px solid var(--border); display: block; }
.digital-row { align-items: start; }
.rle-grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 1px; width: 100%; max-width: 288px; background: var(--border); border: 1px solid var(--border); }
.rle-grid span { aspect-ratio: 1; background: #ffffff; }
.rle-grid span.on { background: #1b1b1a; }
.rle-codes { font-size: 0.8rem; margin: 6px 0 0; padding-left: 2.2em; line-height: 1.6; }
.app-footer p { margin: 0 0 4px; }
.app-footer .author { font-weight: 700; color: var(--text-secondary); }
.module-head .author { margin-top: -4px; }
main#view:focus { outline: none; }

/* 記録の書き出し（SEC-60） */
.export-msg { font-size: 0.92rem; font-weight: 700; }
.export-msg.warn { color: var(--warn); }
.export-msg.good { color: var(--good); }
.sub-tools { border-top: 1px dashed var(--border); margin-top: 12px; padding-top: 8px; }

/* 相談窓口（SEC-63） */
.consult { border: 1.5px solid var(--good); border-radius: 10px; padding: 12px 16px; margin: 12px 0; background: var(--surface-1); }
.consult h3, .consult h4 { margin: 0 0 6px; font-size: 1rem; }
.consult ul { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 6px; }
.consult li { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-size: 0.92rem; }
.consult .tel { font-weight: 700; font-size: 1.05rem; margin: 0 6px; white-space: nowrap; }
.consult .who { font-size: 0.82rem; color: var(--text-secondary); white-space: nowrap; }

/* ロールプレイの記録の説明（SEC-62） */
.grade-note { font-size: 0.88rem; }

  // ---- 文字の大きさのボタン(4分野で同じ形:「文字 中」。押すたびに次の大きさへ) ----
  function sizeButton(btn, opt) {
    var steps = opt.steps;
    btn.classList.add('ef-btn', 'ef-size');
    btn.type = 'button';
    btn.textContent = '';
    btn.appendChild(document.createTextNode('文字 '));
    var v = document.createElement('span');

    v.setAttribute('data-noruby', '');
    btn.appendChild(v);
    function idx() {
      var cur = opt.get(), best = 0;
      for (var i = 1; i < steps.length; i++) if (Math.abs(steps[i][0] - cur) < Math.abs(steps[best][0] - cur)) best = i;
      return best;
    }
    function update() {
      var s = steps[idx()][1];

      btn.title = '文字の大きさ(いまは「' + s + '」。押すと変わる)';
      btn.setAttribute('aria-label', '文字の大きさ: ' + s);

    btn.addEventListener('click', function () { opt.set(steps[(idx() + 1) % steps.length][0]); update(); });
    update();
    return update;
  }

  // ---- タブの帯をスクロールで隠す([data-ef-autohide]。下へ読み進めると隠れ、上へ戻すと出る) ----

      if (Math.abs(dy) < 6 && y > 0) return;

      Array.prototype.forEach.call(bars(), function (bar) {
        if (dy < 0 || y <= 0 || bar.contains(document.activeElement)) { show(bar); return; }
        if (bar.classList.contains('ef-ah-hide')) return;
        var cs = getComputedStyle(bar), top = parseFloat(cs.top) || 0;
        // 上に固定されている(画面の上にはりついている)ときだけ隠す
        if (cs.position !== 'sticky' && cs.position !== 'fixed') return;
        // 横長の帯だけを隠す。PC の左のメニュー(画面のはばの半分より細い)は、いつも見えるように残す
        if (bar.offsetWidth < window.innerWidth / 2) return;
        if (bar.getBoundingClientRect().top > top + 1) return;
        bar.style.setProperty('--ef-ah-y', -(top + bar.offsetHeight + 4) + 'px');
        bar.classList.add('ef-ah-hide');
      });
    }
    window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(run); } }, { passive: true });
    document.addEventListener('focusin', function (e) {
      var bar = e.target.closest && e.target.closest('[data-ef-autohide]');

    });

    function reveal() {

        var t = bar.querySelector('[role=tab][aria-selected="true"], [aria-current="page"]');

    var a = (window.EDUIT_INFO || info).app || app;
    var m = /^([A-D]\d+|[GMFZ])\s/.exec(a.name || '');
    return m ? m[1] : null;
  }
  function jishuLoad(c) {
    try { var v = JSON.parse(localStorage.getItem(JS_STORE + c) || 'null'); if (v && typeof v === 'object') return { s: v.s || {}, q: v.q || {}, seen: !!v.seen }; } catch (e) {}
    return { s: {}, q: {}, seen: false };
  }
  function jishuSave(c, st) { try { localStorage.setItem(JS_STORE + c, JSON.stringify(st)); } catch (e) {} }
  function jishuSteps(d) {
    // 振り返りを隠す設定のときは、振り返りの手順を出さない。i は steps の中の番号(できたの印はこれで覚える)
    return (d.steps || []).map(function (s, i) { return { s: s, i: i }; }).filter(function (x) { return furikaeri || !x.s.reflect; });
  }
  // 進み具合: 基本の手順のうち「できた」の数、たしかめ問題の正解の数
  function jishuProgress(c) {
    var d = jishuData(c);
    if (!d) return null;
    var st = jishuLoad(c);
    var basic = jishuSteps(d).filter(function (x) { return x.s.level !== 'advanced'; });
    var ok = 0;
    (d.check || []).forEach(function (q, i) { if (st.q[i] === q.answer) ok++; });
    return {
      done: basic.filter(function (x) { return st.s[x.i]; }).length, steps: basic.length,
      ok: ok, checks: (d.check || []).length
    };
  }
  function progressText(p) {
    return '進め方 ' + p.done + '/' + p.steps + (p.checks ? '・たしかめ ' + p.ok + '/' + p.checks : '');
  }

  // 自習ガイドのふりがな: EDUIT_INFO.jishu.ruby(言葉 → 読み。shared/jishu-ruby.py で作る)の言葉に、長いものから順に付ける。
  // ガイドの上の「ふりがな」で消せる(はじめは付いている。その端末で覚える)
  var JS_RUBY = 'eduit.jishu.ruby', KJ = /[一-鿿々〆]/, rubyRe = null;
  function jishuRubyOn() { try { return localStorage.getItem(JS_RUBY) !== 'off'; } catch (e) { return true; } }
  function rubyDict() { var J = (window.EDUIT_INFO || info).jishu; return (J && J.ruby) || {}; }
  // 言葉の中のかなのところには付けない(「下げる」→ 下(さ)げる)。読みと合わないときは、言葉ぜんぶに付ける
  function rubyParts(k, r) {
    var parts = k.match(/[一-鿿々〆]+|[^一-鿿々〆]+/g);
    var m = new RegExp('^' + parts.map(function (p) { return KJ.test(p) ? '(.+?)' : '(' + p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')'; }).join('') + '$').exec(r);
    if (!m) return [[k, r]];
    return parts.map(function (p, i) { return [p, KJ.test(p) ? m[i + 1] : null]; });
  }
  function jishuRuby(node) {
    var D = rubyDict(), keys = Object.keys(D);
    if (!keys.length) return;
    if (!rubyRe) rubyRe = new RegExp(keys.sort(function (a, b) { return b.length - a.length; }).map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|'), 'g');
    var w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null), list = [];
    while (w.nextNode()) if (KJ.test(w.currentNode.nodeValue) && !w.currentNode.parentNode.closest('ruby, rt, script, style')) list.push(w.currentNode);
    list.forEach(function (n) {
      var s = n.nodeValue, f = document.createDocumentFragment(), last = 0, m;
      rubyRe.lastIndex = 0;
      while ((m = rubyRe.exec(s))) {
        if (m.index > last) f.appendChild(document.createTextNode(s.slice(last, m.index)));
        rubyParts(m[0], D[m[0]]).forEach(function (x) {
          f.appendChild(x[1] ? el('ruby', null, [x[0], el('rt', { text: x[1] })]) : document.createTextNode(x[0]));
        });
        last = m.index + m[0].length;
      }
      if (!last) return;
      if (last < s.length) f.appendChild(document.createTextNode(s.slice(last)));
      n.parentNode.replaceChild(f, n);
    });
  }

  // 振り返りを隠す設定のときは、タブの名前から「ふりかえり」を消す(D の「ふりかえり・記録」→「記録」など。教材の側も同じように変わる)
  function whereText(w) {
    return furikaeri ? w : w.replace(/(ふりかえり|振り返り)・/g, '').replace(/と(ふりかえり|振り返り)/g, '');
  }
  // c: 記号(なければアプリ名から)。1つのページの中でアプリを切りかえる教材集(C)は、開いたアプリの記号で呼びなおす(null でかくす)
  function jishuMount(c, appTitle) {
    if (!jishu) return;
    Array.prototype.forEach.call(document.querySelectorAll('.ef-jishu, .ef-jishu-fab'), function (e) { e.parentNode.removeChild(e); });
    document.documentElement.classList.remove('ef-jishu-open');
    if (c === undefined) c = appCode();
    var d = jishuData(c);
    if (!d) return;
    var st = jishuLoad(c);
    var narrow = function () { return window.innerWidth <= 640; };
    var fab = el('button', { type: 'button', class: 'ef-jishu-fab kz-norb no-ruby', 'data-noruby': '', 'aria-expanded': 'false', 'aria-controls': 'ef-jishu', title: '自習ガイド(ひとりで進めるときの案内)' }, [
      el('span', { class: 'ef-jishu-fab-t', text: '自習ガイド' }), el('span', { class: 'ef-jishu-fab-p' })
    ]);
    var close = el('button', { type: 'button', class: 'ef-btn', text: '閉じる' });
    var rb = Object.keys(rubyDict()).length ? el('button', { type: 'button', class: 'ef-btn ef-toggle ef-jishu-small', 'aria-pressed': String(jishuRubyOn()), text: 'ふりがな' }) : null;
    var body = el('div', { class: 'ef-jishu-body' });
    var name = appTitle || ((window.EDUIT_INFO || info).app || app).name || '';
    var panel = el('aside', { class: 'ef-jishu kz-norb no-ruby', 'data-noruby': '', id: 'ef-jishu', 'aria-label': '自習ガイド', hidden: '' }, [
      el('div', { class: 'ef-jishu-head' }, [
        el('h2', null, [el('span', { class: 'ef-jishu-k', text: '自習ガイド' }), code(d.label || c), el('span', { class: 'ef-jishu-name', text: name.replace(/^(?:[A-D]\d+|[GMFZ])\s*/, '') })]),
        rb, close
      ]),
      body
    ]);
    function save() { jishuSave(c, st); updateFab(); }
    function updateFab() {
      var p = jishuProgress(c);
      fab.querySelector('.ef-jishu-fab-p').textContent = p.done + '/' + p.steps;
    }
    function go(where) {
      if (!where) return;
      if (where.charAt(0) === '#') location.hash = where;
      else { var t = document.querySelector(where); if (t) t.click(); }
      if (narrow()) show(false);
    }
    function canGo(where) {
      if (!where) return false;
      if (where.charAt(0) === '#') return true;
      try { return !!document.querySelector(where); } catch (e) { return false; }
    }
    // 1つの手順に文が2つ以上あるときは、文ごとに行を分ける(読む人が、いまどこをしているか追いやすいように)
    function lines(t) {
      return String(t || '').replace(/。(?=[^」』）)])/g, '。\n').split('\n').map(function (x) { return el('span', { class: 'ef-jishu-line', text: x }); });
    }
    function stepEl(x, n) {
      var s = x.s;
      var cb = el('input', { type: 'checkbox', id: 'ef-js-s' + x.i });
      cb.checked = !!st.s[x.i];
      cb.addEventListener('change', function () { if (cb.checked) st.s[x.i] = 1; else delete st.s[x.i]; li.classList.toggle('is-done', cb.checked); save(); renderEnd(); });
      var tools = el('div', { class: 'ef-jishu-tools' });
      if (s.hint) {
        var hint = el('p', { class: 'ef-jishu-hint', hidden: '', text: s.hint });
        var hb = el('button', { type: 'button', class: 'ef-btn ef-jishu-small', 'aria-expanded': 'false', text: 'ヒント' });
        hb.addEventListener('click', function () { hint.hidden = !hint.hidden; hb.setAttribute('aria-expanded', String(!hint.hidden)); });
        tools.appendChild(hb);
      }
      if (canGo(s.go)) {
        var gb = el('button', { type: 'button', class: 'ef-btn ef-jishu-small', text: 'この場所へ ▶' });
        gb.addEventListener('click', function () { go(s.go); });
        tools.appendChild(gb);
      }
      var li = el('li', { class: 'ef-jishu-step' + (cb.checked ? ' is-done' : '') }, [
        el('div', { class: 'ef-jishu-step-hd' }, [
          el('span', { class: 'ef-jishu-n', text: String(n) }),
          s.where ? el('span', { class: 'ef-jishu-where', text: whereText(s.where) }) : null
        ]),
        el('p', { class: 'ef-jishu-do' }, lines(s.do)),
        tools,
        hint || null,
        el('label', { class: 'ef-jishu-done', for: 'ef-js-s' + x.i }, [cb, 'できた'])
      ]);
      if (s.reflect) li.setAttribute('data-ef-reflect', '');
      return li;
    }
    function checkEl(q, i) {
      var res = el('p', { class: 'ef-jishu-res', 'aria-live': 'polite' });
      var btns = (q.choices || []).map(function (t, j) {
        var b = el('button', { type: 'button', class: 'ef-jishu-choice', text: t });
        b.addEventListener('click', function () { st.q[i] = j; save(); paint(); renderEnd(); });
        return b;
      });
      function paint() {
        var a = st.q[i];
        btns.forEach(function (b, j) {
          b.classList.toggle('is-ok', a !== undefined && j === q.answer && a === q.answer);
          b.classList.toggle('is-ng', a !== undefined && j === a && a !== q.answer);
          b.setAttribute('aria-pressed', String(a === j));
        });
        while (res.firstChild) res.removeChild(res.firstChild);
        if (a === undefined) return;
        res.className = 'ef-jishu-res ' + (a === q.answer ? 'is-ok' : 'is-ng');
        res.appendChild(el('strong', { text: a === q.answer ? '正解!' : 'ちがいます。もう一度考えて、ほかのものを選ぼう。' }));
        if (a === q.answer && q.explain) res.appendChild(el('span', { text: ' ' + q.explain }));
        if (rb && jishuRubyOn()) jishuRuby(res);
      }
      paint();
      return el('li', { class: 'ef-jishu-q' }, [el('p', { class: 'ef-jishu-qt', text: q.q }), el('div', { class: 'ef-jishu-choices' }, btns), res]);
    }
    var endBox = el('div', { class: 'ef-jishu-end' });
    function renderEnd() {
      var p = jishuProgress(c);
      while (endBox.firstChild) endBox.removeChild(endBox.firstChild);
      var all = p.done === p.steps && p.ok === p.checks;
      endBox.classList.toggle('is-clear', all);
      endBox.appendChild(el('p', { class: 'ef-jishu-prog', text: progressText(p) }));
      endBox.appendChild(el('p', { text: all
        ? '基本はクリアです。発展に挑戦しよう。または、メニューにもどって次の教材へ進もう。'
        : 'できた手順に ✓ を付けよう。手順が全部できて、たしかめ問題が全部正解ならクリアです。' }));
      if (rb && jishuRubyOn()) jishuRuby(endBox);
    }
    function render() {
      while (body.firstChild) body.removeChild(body.firstChild);
      var steps = jishuSteps(d);
      var basic = steps.filter(function (x) { return x.s.level !== 'advanced'; });
      var adv = steps.filter(function (x) { return x.s.level === 'advanced'; });
      body.appendChild(el('section', { class: 'ef-jishu-goal' }, [
        el('h3', { text: 'ねらい' }), el('p', null, lines(d.goal)),
        d.time ? el('p', { class: 'ef-jishu-time', text: '時間の目安: ' + d.time }) : null
      ]));
      body.appendChild(el('section', null, [el('h3', { text: '進め方' }), el('ol', { class: 'ef-jishu-steps' }, basic.map(function (x, k) { return stepEl(x, k + 1); }))]));
      if (d.check && d.check.length) body.appendChild(el('section', null, [
        el('h3', { text: 'たしかめ問題' }),
        el('p', { class: 'ef-jishu-note', text: '進め方が終わったら答えよう。わからないときは、教材にもどって確かめよう。' }),
        el('ol', { class: 'ef-jishu-qs' }, d.check.map(checkEl))
      ]));
      body.appendChild(endBox);
      renderEnd();
      if (adv.length) {
        var det = el('details', { class: 'ef-jishu-adv' }, [
          el('summary', { text: '発展(基本が終わった人)' }),
          el('ol', { class: 'ef-jishu-steps' }, adv.map(function (x, k) { return stepEl(x, k + 1); }))
        ]);
        body.appendChild(det);
      }
      if (rb && jishuRubyOn()) jishuRuby(body);
      document.dispatchEvent(new CustomEvent('eduit-jishu-render', { detail: panel }));
    }
    function show(on) {
      panel.hidden = !on;
      fab.setAttribute('aria-expanded', String(on));
      document.documentElement.classList.toggle('ef-jishu-open', on);
      if (on && !st.seen) { st.seen = true; save(); }
    }
    fab.addEventListener('click', function () { show(panel.hidden); if (!panel.hidden) close.focus(); });
    close.addEventListener('click', function () { show(false); fab.focus(); });
    if (rb) rb.addEventListener('click', function () {
      var on = !jishuRubyOn();
      try { localStorage.setItem(JS_RUBY, on ? 'on' : 'off'); } catch (e) {}
      rb.setAttribute('aria-pressed', String(on));
      render();
    });
    panel.addEventListener('keydown', function (e) { if (e.key === 'Escape') { show(false); fab.focus(); } });
    render();
    updateFab();
    document.body.appendChild(fab);
    document.body.appendChild(panel);
    // はじめて開いた教材では、ガイドを開いておく
    if (!st.seen) show(true);
  }

  // メニュー(自習モードのとき): 基本編・発展編の上に進め方の説明、カードに進み具合
  function jishuMenuBox() {
    var J = info.jishu || {};
    return el('section', { class: 'ef-jishu-menu', 'aria-label': 'ひとりで進めるとき' }, [
      el('h3', { text: 'ひとりで進めるとき(自習モード)' }),
      J.lead ? el('p', { text: J.lead }) : null,
      el('ol', null, [
        el('li', { text: '基本編のカードを、おすすめの順番に開きます。' }),
        el('li', { text: '教材の右はしの「自習ガイド」を押すと、ねらいと進め方が出ます。上から順に進めます。できたら「できた」に ✓ を付けます。' }),
        el('li', { text: 'こまったら「ヒント」を押します。「この場所へ」を押すと、その手順のページに移ります。' }),
        el('li', { text: '最後に「たしかめ問題」に答えます。全部正解したら、次の教材へ進みます。' }),
        furikaeri ? el('li', { text: '振り返りを書きます。記録を書き出して、先生の指示どおりに出します。' }) : el('li', { text: '記録を書き出して、先生の指示どおりに出します。' })
      ])
    ]);
  }
  function jishuBadge(c) {
    var p = jishuProgress(c);
    if (!p) return null;
    var b = el('p', { class: 'ef-mcard-jishu', 'data-jishu-code': c }, [el('span', { class: 'ef-level-parts-k', text: '自習' }), progressText(p)]);
    if (p.done === p.steps && p.ok === p.checks) b.classList.add('is-clear');
    return b;
  }
  if (jishu) window.addEventListener('storage', function (e) {
    if (!e.key || e.key.indexOf(JS_STORE) !== 0) return;
    Array.prototype.forEach.call(document.querySelectorAll('.ef-mcard-jishu'), function (b) {
      var n = jishuBadge(b.getAttribute('data-jishu-code'));
      if (n) b.parentNode.replaceChild(n, b);
    });
  });

  window.EduitFrame = { AUTHOR: AUTHOR, furikaeri: furikaeri, jishu: jishu, open: open, howto: howto, footer: footer, aboutButton: aboutButton, mount: mount, levels: levels, card: card, code: code, menuTitle: menuTitle, sizeButton: sizeButton, jishuProgress: jishuProgress, jishuApp: function (c, title) { jishuSet = true; jishuMount(c, title); } };
  var jishuSet = false;  // 教材集が jishuApp で決めたときは、アプリ名から決めなおさない
  function start() { mount(); if (!jishuSet) jishuMount(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>

ou.delivery-check.example/xk7","suspicious":true,"explain":"ドメイン名（「//」のあとから次の「/」まで）は hayate-haisou.delivery-check.example。右から読むと、持ち主は delivery-check.example。左の hayate-haisou は、持ち主が自由に付けられる飾り。ハヤテ配送の公式（hayate.example）ではない。"}],"action":{"question":"あなたならどうする？","choices":["返送されると困るので、リンクを開いて荷物の状況を確かめる","リンクは開かず、ハヤテ配送の公式アプリで確かめる","このSMSに返信して「本物のハヤテ配送ですか？」と聞く"],"answer":1,"danger":[0,2],"explain":"メッセージ内のリンクは使わない。ふだん使っている公式アプリやブックマークから確かめるのが安全。返信すると「この番号は使われている」と相手に知らせてしまう。"}},{"id":"mail-bank","title":"銀行からの「アカウント停止」メール","kind":"email","isPhishing":true,"intro":"家族のスマホに届いたメールを一緒に見ています。怪しいと思うところをすべて選ぼう。","parts":[{"id":"from","role":"sender","text":"ミドリ銀行 <support@midori-bank.account-verify.example>","suspicious":true,"explain":"表示名は自由に名乗れる。メールアドレスの @ の後ろ（ドメイン名）を右から読む。持ち主は account-verify.example。左の midori-bank は飾り。ミドリ銀行（midori-bank.example）のものではない。"},{"id":"subject","role":"subject","text":"【重要】お客様のアカウントが一時停止されました","suspicious":true,"explain":"「重要」「停止」で不安にさせ、あわてさせようとしている。"},{"id":"greet","role":"text","text":"お客様各位","suspicious":true,"explain":"本物の取引先なら名前で呼びかけることが多い。だれにでも同じ文面を送っているサインかもしれない。ただし、これだけで決めつけはできない。"},{"id":"t1","role":"text","text":"不正なアクセスが検出されたので、お客様のアカウントは一時停止されましたです。","suspicious":true,"explain":"「されましたです」は不自然な日本語。翻訳ソフトで作った文面によくある。"},{"id":"t2","role":"text","text":"24時間以内に下記より本人確認を行ってください。確認がない場合、口座は永久に凍結されます。","suspicious":true,"explain":"期限を切って脅すのは典型的な手口。銀行がメールのリンクから暗証番号などを入力させることは、ふつうはない。"},{"id":"btn","role":"button","text":"本人確認をする","sub":"リンク先: http://rnidori-bank.example/login","suspicious":true,"explain":"よく見ると「m」ではなく「r」と「n」（rnidori）。ドメイン名は rnidori-bank.example。本物（midori-bank.example）そっくりの、別のアドレス。"},{"id":"foot","role":"text","text":"ミドリ銀行 お客様サポートセンター","suspicious":false,"explain":"署名は誰でも書ける。あってもなくても、本物かどうかの決め手にはならない。"}],"action":{"question":"家族にどうアドバイスする？","choices":["凍結されると困るから、急いでボタンを押して本人確認したほうがいい","ボタンは押さず、銀行の公式アプリや通帳の電話番号で確かめよう","まずメールを友達に転送して、同じメールが届いていないか聞いてみよう"],"answer":1,"danger":[0,2],"explain":"メールに書かれた連絡先やリンクではなく、自分で調べた公式の連絡先で確かめよう。怪しいメールを転送すると、友達がうっかり押してしまう危険もある。"}},{"id":"web-game","title":"ゲームの「無料プレゼント」ログイン画面","kind":"web","isPhishing":true,"address":{"id":"url","text":"http://pocketquest-free-gems.example/login","suspicious":true,"explain":"公式サイト（pocketquest.example）とは違うアドレス。「free-gems」のような言葉が入っているのも怪しい。また「http://」で始まり、通信が暗号化されていない。"},"intro":"SNSの広告をタップしたら、このページが開きました。怪しいと思うところをすべて選ぼう（アドレスバーも選べます）。","parts":[{"id":"logo","role":"logo","text":"PQ ポケットクエスト","suspicious":false,"explain":"ロゴや画像は簡単にコピーできる。本物そっくりでも安心の理由にはならない。"},{"id":"head","role":"heading","text":"公式イベント！今だけ ジェム10000個 無料プレゼント","suspicious":true,"explain":"「今だけ」「無料」「大量」は、うまい話でおびき寄せる典型的な言葉。"},{"id":"timer","role":"timer","text":"受け取り期限まで 残り 04:59","suspicious":true,"explain":"カウントダウンで急がせ、立ち止まって考えるのをじゃましている。"},{"id":"f1","role":"field","text":"ユーザーID","suspicious":false,"explain":"ログインにIDを使うのはふつう。ただし、このページに入力すること自体が危ない。"},{"id":"f2","role":"field","text":"パスワード","suspicious":false,"explain":"ふつうのログインでも聞かれる項目。問題は「どのページで」入力するか。"},{"id":"f3","role":"field","text":"電話番号・生年月日","suspicious":true,"explain":"プレゼントを受け取るのに必要のない個人情報まで集めようとしている。"}],"action":{"question":"このページでどうする？","choices":["ジェムがほしいので、カード番号は入れずにIDとパスワードだけ入力する","入力せずに閉じ、ゲームアプリのお知らせでイベントがあるか確かめる","自分のアカウントは心配なので、まず友達のアカウントで試してもらう"],"answer":1,"danger":[0,2],"explain":"一度入力したIDとパスワードは盗まれて、アカウントを乗っ取られるおそれがある。もし入力してしまったら、すぐにパスワードを変えて、家族や先生に相談しよう。"}},{"id":"mail-order","title":"ネットショップの注文確認メール","kind":"email","isPhishing":false,"intro":"先週、家族と一緒にクモストアで本を注文しました。そのあとに届いたメールです。怪しいと思うところがあれば選ぼう（なければ選ばずに答え合わせ）。","parts":[{"id":"from","role":"sender","text":"クモストア <order@kumo-store.example>","suspicious":false,"explain":"@ の後ろは、クモストアの公式アドレス（kumo-store.example）と同じ。ただし、差出人のアドレスは本物に見せかけることもできる。だから、これだけでは決められない。注文した内容と合っているかを見て、心配なら公式アプリの注文履歴で確かめよう。"},{"id":"subject","role":"subject","text":"ご注文の商品を発送しました（注文番号 KS-2026-1004-0042）","suspicious":false,"explain":"自分が実際に注文した内容と合っている。急かす言葉もない。"},{"id":"greet","role":"text","text":"山田 花子 様","suspicious":false,"explain":"登録した名前で呼びかけている。"},{"id": ットでトラブルにあったとき、いちばん大切な行動は？","choices":["心配をかけないよう、だれにも言わずに自分で解決する","一人でかかえこまず、家族や先生に相談する","相手をブロックして、なかったことにして忘れる"],"answer":1,"explain":"早めに相談すれば、被害を小さくできます。"},{"id":"tattoo-3","module":"tattoo","step":"responsibility","core":false,"question":"ほかの人のうその投稿を再投稿（シェア）した。正しい考え方は？","choices":["自分が書いた文ではないので、責任は元の投稿者だけにある","広げた人も発信者として責任を問われることがある","匿名のアカウントなら、だれがしたか分からないので関係ない"],"answer":1,"explain":"再投稿も発信です。うそや人を傷つける情報を広げると、責任を問われることがあります。"},{"id":"copyright-4","module":"copyright","step":"responsibility","core":false,"question":"自分で描いたイラストの著作権は、いつ生まれる？","choices":["役所に作品を届け出て、登録されたとき","作品を作った時点で自動的に","SNSなどで公開して、多くの人に見られたとき"],"answer":1,"explain":"著作権は作った時点で自動的に生まれます。中学生の作品も同じです。"}]},"roleplay":{"_note":"判断ロールプレイの分岐ストーリー。nodes の choices の next で進み、end（good/ok/bad）で終わる。先生が追加・変更してよい。","stories":[{"id":"dm","title":"知らない人からのDM","start":"s1","nodes":{"s1":{"text":"同じゲームが好きだという知らない人から、DMが届いた。「いつも投稿見てるよ！ 同じ中学2年だよ。仲良くしよう😊」","choices":[{"label":"同じゲーム好きならいいかな。返信して仲良くする","next":"s2"},{"label":"返信しない。しつこければブロックして、家族に伝える","next":"e_good"}]},"s2":{"text":"何日かやりとりが続いた。相手から「どこの中学？」「顔写真送ってよ。ぼくのも送るから」と言われた。","choices":[{"label":"仲良くなったし、学校名と写真を送る","next":"e_bad"},{"label":"「それは教えられない」と断り、やりとりをやめて、家族や先生に相談する","next":"e_ok"}]},"e_good":{"end":"good","title":"安全な判断！","text":"ネットでは、年齢や性別をいつわることが簡単にできます。知らない人とのやりとりは、始めないのがいちばん安全です。"},"e_ok":{"end":"ok","title":"途中で気づけた！","text":"個人情報や写真を求められた時点で、立ち止まれたのは大切な判断です。相手が本当に同じ中学生とは限りません。やりとりの記録は消さずに、大人と一緒に対応しよう。"},"e_bad":{"end":"bad","title":"危ない状況です","text":"送った写真や学校名は、悪用されたり、会うように迫られたりするきっかけになります。一度送ったものは取り消せません。今すぐ家族や先生に相談しよう。"}}},{"id":"app","title":"無料アプリの権限","start":"s1","nodes":{"s1":{"text":"話題の無料写真加工アプリを入れた。すると、「連絡先・位置情報・マイク・カメラ・写真へのアクセスを許可しますか？」と次々に表示された。","choices":[{"label":"早く使いたいので、全部「許可」をおす","next":"s2"},{"label":"写真加工に必要な「写真」「カメラ」だけ許可し、ほかは許可しない","next":"e_good"},{"label":"いったん止めて、提供元やレビューを家族と一緒に確かめる","next":"e_good2"}]},"s2":{"text":"数日後、友達から「変なアプリの招待メッセージが届いたよ」と言われた。連絡先の全員に、勝手に送られていたらしい。","choices":[{"label":"自分が送ったわけではないので、放っておく <script>
"use strict";
// ---- js/store.js ----
const __m_js_store_js = (() => {

// 進捗・ふりかえりの保存（この端末のブラウザ内 localStorage のみ。外部には送らない）
// 注意: パスワード入力欄の値はここに絶対に渡さない。

const STORE_KEY = "seclab.v1";

function emptyState() {
  return {
    version: 1,
    student: { cls: "", num: "", name: "" },
    modules: {}, // { [moduleId]: { steps: { [stepId]: isoDate }, score: {...} } }
    reflections: {}, // { [moduleId]: { text, at } }
    updatedAt: null,
  };
}

let state = load();
const listeners = new Set();

// 保存データを、はじめの形に重ねる。壊れたデータ（オブジェクトのはずの所が別の値など）は、はじめの形にもどす
function mergeSaved(base, saved) {
  if (!saved || typeof saved !== "object" || Array.isArray(saved)) return base;
  const out = { ...base, ...saved };
  for (const [k, v] of Object.entries(base)) {
    if (v && typeof v === "object" && (!out[k] || typeof out[k] !== "object" || Array.isArray(out[k]))) out[k] = v;
  }
  return out;
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return emptyState();
    return mergeSaved(emptyState(), JSON.parse(raw));
  } catch {
    return emptyState();
  }
}

function save() {
  state.updatedAt = new Date().toISOString();
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch {
    // プライベートモード等で保存できない場合も、画面上の体験は続けられる
  }
  listeners.forEach((fn) => fn(state));
}

const store = {
  get state() {
    return state;
  },
  subscribe(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  },
  completeStep(moduleId, stepId) {
    const m = (state.modules[moduleId] ||= { steps: {}, score: {} });
    if (m.steps[stepId]) return false;
    m.steps[stepId] = new Date().toISOString();
    save();
    return true;
  },
  isStepDone(moduleId, stepId) {
    return Boolean(state.modules[moduleId]?.steps?.[stepId]);
  },
  setScore(moduleId, key, value) {
    const m = (state.modules[moduleId] ||= { steps: {}, score: {} });
    m.score[key] = value;
    save();
  },
  getScore(moduleId, key) {
    return state.modules[moduleId]?.score?.[key];
  },
  // 空の文を保存したとき（全部消したとき）は、記録からも消す
  setReflection(moduleId, text) {
    if (text) state.reflections[moduleId] = { text, at: new Date().toISOString() };
    else delete state.reflections[moduleId];
    save();
  },
  getReflection(moduleId) {

// ---- グラフ（長さ × 文字の種類 → 解読時間, たてじくは対数） ----
const YEAR = 86400 * 365;
const REF_LINES = [
  { log10: -3, label: "0.001秒" },
  { log10: 0, label: "1秒" },
  { log10: Math.log10(86400), label: "1日" },
  { log10: Math.log10(YEAR), label: "1年" },
  { log10: Math.log10(YEAR * 1e4), label: "1万年" },
  { log10: Math.log10(YEAR * 1.38e10), label: "宇宙の年齢" },
  // 京より大きい単位は使わず、宇宙の年齢（約138億年）の何倍かで表す
  { log10: Math.log10(YEAR * 1.38e14), label: ["宇宙の年齢", "の1万倍"] },
  { log10: Math.log10(YEAR * 1.38e18), label: ["宇宙の年齢", "の1億倍"] },
  { log10: Math.log10(YEAR * 1.38e22), label: ["宇宙の年齢", "の1兆倍"] },
];
function lengthChart(rateL) {
  const W = 660, H = 340, m = { l: 76, r: 92, t: 12, b: 40 };
  const xs = Array.from({ length: 13 }, (_, i) => i + 4); // 4〜16文字
  const all = SERIES.flatMap((ser) => [4 * Math.log10(ser.size) - rateL, 16 * Math.log10(ser.size) - rateL]);
  const yMin = Math.floor(Math.min(...all)) - 1, yMax = Math.ceil(Math.max(...all)) + 1;
  const x = (len) => m.l + ((len - 4) / 12) * (W - m.l - m.r);
  const y = (lg) => m.t + (1 - (Math.max(yMin, Math.min(yMax, lg)) - yMin) / (yMax - yMin)) * (H - m.t - m.b);
  const NS = "http://www.w3.org/2000/svg";
  const s = (tag, attrs, text) => {
    const el = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (text !== undefined) el.textContent = text;
    return el;
  };
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "パスワードの長さと解読時間のグラフ。長さが1文字増えるごとに、時間は文字の種類の数の倍だけ増える。" });
  const grid = s("g", { class: "grid" });
  const axis = s("g", { class: "axis" });
  for (const r of REF_LINES.filter((r) => r.log10 >= yMin && r.log10 <= yMax)) {
    grid.append(s("line", { x1: m.l, x2: W - m.r, y1: y(r.log10), y2: y(r.log10) }));
    if (Array.isArray(r.label)) {
      const t = s("text", { x: m.l - 6, y: y(r.log10) - 2, "text-anchor": "end" });
      r.label.forEach((line, i) => t.append(s("tspan", { x: m.l - 6, dy: i ? 12 : 0 }, line)));
      axis.append(t);
    } else axis.append(s("text", { x: m.l - 6, y: y(r.log10) + 4, "text-anchor": "end" }, r.label));
  }
  for (const len of xs) {
    if (len % 2 === 0) axis.append(s("text", { x: x(len), y: H - m.b + 18, "text-anchor": "middle" }, `${len}`));
  }
  axis.append(s("text", { x: (m.l + W - m.r) / 2, y: H - 4, "text-anchor": "middle" }, "パスワードの長さ（文字）"));
  svg.append(grid, axis);
  const labelYs = [];

  for (const n of byRing(1)) edges.push([0, n.id]);
  for (let r = 1; r <= 3; r++) {
    const ring = byRing(r);
    ring.forEach((n, i) => edges.push([n.id, ring[(i + 1) % ring.length].id]));
    if (r < 3) {
      const outer = byRing(r + 1);
      for (const o of outer) {
        const nearest = ring.reduce((best, n) => (Math.hypot(n.x - o.x, n.y - o.y) < Math.hypot(best.x - o.x, best.y - o.y) ? n : best));
        edges.push([nearest.id, o.id]);
      }
    }
  }
  const neighbors = new Map(nodes.map((n) => [n.id, []]));
  for (const [a, b] of edges) {
    neighbors.get(a).push(b);
    neighbors.get(b).push(a);
  }
  return { nodes, edges, neighbors };
}

    ...GROUPS.map((g) => {
      const list = available.map((c, i) => [c, cards[i]]).filter(([c]) => c.group === g.id);
      return list.length ? h("section", { class: "module-group" }, h("h2", {}, g.title), h("div", { class: "module-grid" }, list.map(([, card]) => card))) : "";
    }),
  );
}

async function renderModule(entry, stepId) {
  const m = entry.module;
  const root = h("div");
  view.replaceChildren(
    h("div", { class: "module-head" }, h("p", { class: "meta" }, `モジュール${entry.label}・目安 ${m.minutes}`), h("h1", {}, entry.title), h("p", {}, m.lead), easyBox(entry.easy)),
    root,
  );
  const idx = available.indexOf(entry);
  const prev = available[idx - 1];
  const next = available[idx + 1];
  const navRow = h(
    "div",
    { class: "btn-row" },
    prev ? h("a", { class: "btn secondary", href: `#/${prev.id}` }, "← 前のモジュール") : null,
    next ? h("a", { class: "btn", href: `#/${next.id}` }, `次へ：${next.title} →`) : h("a", { class: "btn", href: "#/check" }, "理解度チェックへ →"),
  );
  await m.render(root);
  // やさしい日本語: ステップごとに「やること」を1文で出す（SEC-14）
  for (const [stepId, text] of Object.entries(EASY_STEPS[entry.id] || {})) {
    const head = document.getElementById(`step-${entry.id}-${stepId}`);
    if (head) head.after(h("p", { class: "easy-summary easy-step" }, h("span", { class: "easy-tag" }, "やること"), text));
  }
  view.append(navRow);
  if (stepId) document.getElementById(`step-${entry.id}-${stepId}`)?.scrollIntoView({ block: "start" });
}

let routeToken = 0;
async function route() {
  const token = ++routeToken;
  // ページを移る前に、書きかけのふりかえりを保存する（前の画面がまだ残っているうちに）
  flushReflections();
  const { id, step } = parseHash();
  const entry = available.find((c) => c.id === id);
  renderNav(id);
  renderOverall();
  window.scrollTo(0, 0);
  if (entry) await renderModule(entry, step);
  else if (id === "records") renderRecords(view, available, config, route, easyBox(EASY_PAGES.records));
  else if (id === "teacher") renderTeacher(view, available, config, reloadConfig);
  else if (id === "check") await renderCheck(view, available, easyBox(EASY_PAGES.check));
  else renderHome();
  if (token !== routeToken) return;
  const title = entry ? entry.title : { records: recordsTitle(), teacher: "先生用ページ", check: "理解度チェック" }[id] || "はじめに";
  document.title = `${title} | 情報セキュリティ体験ラボ`;
  if (!step) view.focus({ preventScroll: true });
}

async function reloadConfig() {
  config = await getConfig();
  available = availableModules(config);
  await applyDisplay();
  await renderToggles();
  await setRubyEnabled(view, Boolean(await pref("ruby")));
  await route();
}

// 記録が変わったら章ナビと進み具合を書きかえる。
// ただし、マウスや指で押している途中に書きかえると、そのクリックが消えてしまう
// （ふりかえりの自動保存は、章ナビを押した瞬間にも起きる）ので、はなしてから書きかえる。
let pointerIsDown = false;
let navPending = false;
function refreshNav() {
  navPending = false;
  renderNav(parseHash().id);
  renderOverall();
}
document.addEventListener("pointerdown", () => (pointerIsDown = true), true);
const pointerReleased = () => {
  pointerIsDown = false;
  if (navPending) setTimeout(refreshNav, 0);
};
document.addEventListener("pointerup", pointerReleased, true);
document.addEventListener("pointercancel", pointerReleased, true);
store.subscribe(() => {
  if (pointerIsDown) navPending = true;
  else refreshNav();
});
window.addEventListener("hashchange", route);
// 画面を閉じる・別のアプリに切りかえる・再読み込みするときも、書きかけのふりかえりを保存する
window.addEventListener("pagehide", flushReflections);
window.addEventListener("beforeunload", flushReflections);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushReflections();
});

reloadConfig().catch((e) => {
  // 設定や問題のデータを読めなかったとき（ファイルを直接開いた など）は、白い画面のままにせず知らせる
  view.replaceChildren(h("div", { class: "card" }, h("h1", {}, "読み込めませんでした"), h("p", {}, `${e?.message || e}。単一HTML版（dist/security-lab.html）を使うか、Webサーバー経由で開いてください。`)));
});

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

return {  };
})();
</script>
</body>
</html>
